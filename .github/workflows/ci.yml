name: Monorepo CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths:
      - .github/workflows/**
      - apps/**
      - packages/**
      - supabase/**
      - .editorconfig
      - .env.example
      - .nvmrc
      - .prettierignore
      - .prettierrc.json
      - eslint.config.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
  push:
    branches:
      - dev
      - staging
      - main
    paths:
      - .github/workflows/**
      - apps/**
      - packages/**
      - supabase/**
      - .editorconfig
      - .env.example
      - .nvmrc
      - .prettierignore
      - .prettierrc.json
      - eslint.config.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
  workflow_dispatch:

concurrency:
  group: monorepo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build workspaces
        run: pnpm build
