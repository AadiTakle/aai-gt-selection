<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUANT-GRAPH-01 · Story Graph</title>
<style>
  :root{
    --paper:#fffdf7;--canvas:#eef7f4;--ink:#24343a;--grid:#c9dbd7;
    --a:#e05d45;--b:#3478a8;--accent:#f2b84b;--good:#2d9b6f;--bad:#d95b67;
    --tel:#111b24;--tel2:#1a2a35;--key:#74f0ca;--dim:#7892a3;
  }
  *{box-sizing:border-box}html,body{margin:0;min-height:100%}
  body{
    display:flex;color:var(--ink);font:16px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;
    background:linear-gradient(145deg,#e7f3ef,#f7efe0);
  }
  button{font:inherit;border:0;cursor:pointer}
  #wrap{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px}
  #badge{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#758b89}
  #phasecue{font-size:34px;height:40px}
  #stagecard{
    width:min(760px,100%);background:var(--paper);border-radius:28px;padding:20px;
    box-shadow:0 25px 60px -35px #304c49;display:grid;gap:15px;border:1px solid #fff;
  }
  #storyboard{
    min-height:190px;border-radius:22px;background:linear-gradient(#eaf6f4,#f8fbf7);
    border:2px solid #d6e6e2;position:relative;overflow:hidden;padding:14px;
  }
  #scene{height:132px;display:flex;align-items:flex-end;justify-content:center;gap:38px}
  .rig{height:124px;min-width:100px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
  .tank{
    width:74px;height:110px;border:4px solid #617c80;border-top-width:2px;border-radius:8px 8px 16px 16px;
    display:flex;flex-direction:column-reverse;padding:4px;gap:2px;background:rgba(255,255,255,.7);
  }
  .block{height:10px;border-radius:3px;background:var(--a);box-shadow:inset 0 -2px rgba(0,0,0,.08)}
  .rig.b .block{background:var(--b);background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.28) 5px 8px)}
  .rig .mark{font-size:26px;height:30px}
  .rateStrip{align-self:center;display:flex;gap:5px;min-width:92px;justify-content:center;align-items:flex-end}
  .drop{width:15px;height:22px;border-radius:60% 40% 60% 40%;background:var(--a);transform:rotate(45deg)}
  #beats{height:22px;display:flex;justify-content:center;gap:17px;margin-top:7px}
  #beats i{width:13px;height:13px;border-radius:50%;background:#cfddd9}
  #beats i.live{background:var(--accent);box-shadow:0 0 0 5px rgba(242,184,75,.2)}
  #scrub{display:block;width:min(330px,70%);margin:2px auto 0;accent-color:var(--accent)}
  #scrub:disabled{opacity:.35}
  #replayStory{
    position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;
    background:#dfece8;color:#537173;font-size:20px;
  }
  #options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .option{
    min-height:140px;border-radius:18px;background:#f4f7f4;border:3px solid transparent;
    display:grid;place-items:center;padding:6px;transition:.16s;
  }
  .option:not(:disabled):hover{transform:translateY(-2px);border-color:#d6e4df}
  .option.selected{border-color:var(--accent);background:#fff8e8}
  .option.correct{border-color:var(--good);background:#e5f7ef}
  .option.wrong{border-color:var(--bad);background:#ffecef}
  .option:disabled{cursor:default}
  .graph{width:100%;height:120px}
  .axis{stroke:#657d80;stroke-width:3;stroke-linecap:round}
  .guide{stroke:var(--grid);stroke-width:1;stroke-dasharray:3 4}
  .pathA{fill:none;stroke:var(--a);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .pathB{fill:none;stroke:var(--b);stroke-width:5;stroke-dasharray:8 5;stroke-linecap:round;stroke-linejoin:round}
  .pointA{fill:var(--paper);stroke:var(--a);stroke-width:3}
  .barA{fill:var(--a);rx:3}.barB{fill:var(--b);rx:3}
  #controls{display:flex;justify-content:center;gap:14px;align-items:center}
  .round{width:49px;height:49px;border-radius:50%;background:#e8efec;color:#547175;font-size:22px}
  #go{
    width:70px;height:70px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;
    box-shadow:0 12px 25px -12px #a87619;opacity:.35;pointer-events:none;
  }
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1s infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}
  #progress{display:flex;justify-content:center;gap:7px;height:11px}
  #progress i{width:10px;height:10px;border-radius:50%;background:#d9e5e1}
  #progress i.ok{background:var(--good)}#progress i.no{background:var(--bad)}
  #ghost{
    position:fixed;left:0;top:0;z-index:60;font-size:40px;opacity:0;pointer-events:none;
    transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .2s;filter:drop-shadow(0 3px 4px #0004);
  }
  #ghost.show{opacity:.95}#ghost.tap{animation:tap .38s}@keyframes tap{50%{scale:.78}}
  #telemetry{
    width:340px;flex:0 0 340px;min-height:100vh;background:var(--tel);color:#c0d3df;
    display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  #telemetry h3{margin:0;padding:13px 14px;background:var(--tel2);color:#fff;font-size:12px;letter-spacing:.09em;text-transform:uppercase}
  #difficulty{padding:10px 13px;border-bottom:1px solid #29404d}
  #diffhead{display:flex;justify-content:space-between;color:#9cb3c0;font-size:11px}
  #diffbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:7px 0}
  #diffbar i{height:8px;border-radius:8px;background:#2a414e}#diffbar i.live{background:var(--accent)}
  #dtrend{font-size:11px;color:#718a99}
  #mlist{padding:11px 13px;display:flex;flex-direction:column;gap:8px}
  .mrow{display:grid;grid-template-columns:102px 1fr;gap:7px}.mid{color:var(--key);font-weight:800}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--dim);font-size:11px;margin-top:-4px}
  #logwrap{margin-top:auto;border-top:1px solid #29404d}
  #logwrap b{display:block;padding:8px 12px 3px;color:#819aaa;font-size:11px;letter-spacing:.08em}
  #log{height:220px;overflow:auto;padding:2px 12px 12px;white-space:pre-wrap}
  #log div{padding:3px 0;border-bottom:1px dotted #263b47}#log .t{color:#5e7888}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;min-height:0;height:340px;flex:none}}
  @media(max-width:580px){#options{grid-template-columns:1fr}.option{min-height:110px}.graph{height:95px}#scene{gap:14px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="wrap">
  <div id="badge">QUANT-GRAPH-01 · Story Graph</div>
  <div id="phasecue">👁️</div>
  <section id="stagecard">
    <div id="storyboard"><div id="scene"></div><div id="beats"></div><input id="scrub" type="range" min="0" max="2" value="0" step="1" aria-label="move through story"><button id="replayStory" aria-label="replay story">▶</button></div>
    <div id="options"></div>
    <div id="controls"><button class="round" id="replayDemo" aria-label="replay demonstration">↻</button><button id="go" aria-label="submit">✓</button></div>
    <div id="progress"></div>
  </section>
</main>
<aside id="telemetry">
  <h3>Live telemetry · per-child</h3>
  <div id="difficulty"><div id="diffhead"><span>DIFFICULTY</span><span id="dlevel"></span></div><div id="diffbar"></div><div id="dtrend"></div></div>
  <div id="mlist"></div>
  <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
</aside>
<div id="ghost">👆</div>
<script src="embed-shim.js"></script>
<script>
'use strict';
var __gtLevel=1,__gtResponded=false;
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const ITEMS=[
  {level:1,kind:'one',mode:'bars',a:[1,2,4],options:[{a:[4,2,1],err:'direction',credit:.33},{a:[1,2,4],err:'none',credit:1},{a:[1,1,4],err:'height',credit:.67}],correct:1},
  {level:2,kind:'one',mode:'line',a:[0,2,4,6],options:[{a:[2,2,2,2],err:'slope-as-level',credit:.25},{a:[0,1,2,3],err:'rate-size',credit:.5},{a:[0,2,4,6],err:'none',credit:1}],correct:2},
  {level:3,kind:'rate',mode:'line',a:[0,1,3,6],rates:[1,2,3],options:[{a:[0,1,3,6],err:'none',credit:1},{a:[0,2,4,6],err:'constant-rate',credit:.5},{a:[0,3,5,6],err:'rate-order',credit:.5}],correct:0},
  {level:4,kind:'two',mode:'two',a:[0,2,4,6],b:[5,4,3,2],options:[{a:[0,2,4,6],b:[5,6,7,8],err:'intersection',credit:.5},{a:[0,2,4,6],b:[5,4,3,2],err:'none',credit:1},{a:[0,1,2,3],b:[5,4,3,2],err:'relative-slope',credit:.75}],correct:1},
  {level:5,kind:'one',mode:'line',a:[1,3,6,7,7],options:[{a:[1,3,5,7,9],err:'constant-rate',credit:.4},{a:[7,7,6,3,1],err:'direction',credit:.2},{a:[1,3,6,7,7],err:'none',credit:1}],correct:2},
  {level:6,kind:'rate',mode:'area',a:[0,1,4,6,10],rates:[1,3,2,4],options:[{a:[0,1,3,2,4],err:'rate-as-height',credit:.25},{a:[0,1,4,6,10],err:'none',credit:1},{a:[0,2,4,6,8],err:'constant-accumulation',credit:.5}],correct:1}
];
const WARM={level:1,kind:'one',mode:'bars',a:[1,3],options:[{a:[3,1],err:'direction',credit:.5},{a:[1,3],err:'none',credit:1},{a:[1,1],err:'height',credit:.5}],correct:1};
let phase='demo',cur=null,selected=-1,locked=true,animToken=0,scoredIndex=0,replays=0;
const T={scored:0,correct:0,poly:'—',path:[],plan:'—',err:'—',level:1,startLevel:1,maxSolved:0,results:[],itemStart:0};
const METERS=[
  {id:'M-ACC',name:'Whole graph-story match',get:()=>T.scored?`${T.correct}/${T.scored} · ${Math.round(100*T.correct/T.scored)}%`:'—'},
  {id:'M-POLY',name:'Story relations preserved',get:()=>T.poly},
  {id:'M-PATH',name:'Selections and story replays',get:()=>T.path.length?`${T.path.join('→')} · replay ${replays}`:'—'},
  {id:'M-PLANFUL',name:'Temporal mapping strategy',get:()=>T.plan},
  {id:'M-ERRTYPE',name:'Height, rate, crossing, or accumulation',get:()=>T.err},
  {id:'M-DIFFREACH',name:'Deepest graph idea solved',get:()=>T.maxSolved?`level ${T.maxSolved} · ${idea(T.maxSolved)}`:'—'},
  {id:'M-LEARNRATE',name:'Adaptive level gain per scored item',get:()=>T.scored?`${((T.level-T.startLevel)/T.scored).toFixed(2)} level/trial`:'—'}
];
function idea(level){return['height','constant rise','changing rate','intersection','turning rate','accumulation'][level-1]}
function buildTelemetry(){
  $('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');
  $('#diffbar').innerHTML=ITEMS.map(()=>'<i></i>').join('');
  $('#progress').innerHTML=ITEMS.map(()=>'<i></i>').join('');
}
function renderMeters(){
  METERS.forEach(m=>$('#v_'+m.id).textContent=m.get());
  $('#dlevel').textContent=`${T.level} / 6 · ${idea(T.level)}`;
  [...$('#diffbar').children].forEach((x,i)=>x.classList.toggle('live',i<T.level));
  $('#dtrend').textContent=`path ${T.results.join('')||'·'} · success raises, miss lowers`;
}
function log(message){
  const elapsed=T.itemStart?Math.round(performance.now()-T.itemStart):0;
  const row=document.createElement('div');row.innerHTML=`<span class="t">+${elapsed}ms</span> ${message}`;
  $('#log').appendChild(row);$('#log').scrollTop=$('#log').scrollHeight;
}
function points(values){
  const max=Math.max(10,...values),step=values.length>1?140/(values.length-1):140;
  return values.map((v,i)=>`${20+i*step},${90-v/max*72}`).join(' ');
}
function graphSVG(option,mode){
  const a=option.a,b=option.b||[];
  let marks='<line class="axis" x1="18" y1="90" x2="168" y2="90"/><line class="axis" x1="18" y1="92" x2="18" y2="12"/>';
  marks+='<line class="guide" x1="18" y1="52" x2="168" y2="52"/><text x="151" y="108">⏱</text><text x="1" y="18">🧱</text>';
  if(mode==='bars'){
    const max=Math.max(...a),w=125/a.length;
    marks+=a.map((v,i)=>`<rect class="barA" x="${28+i*w}" y="${88-v/max*65}" width="${w-10}" height="${v/max*65}"/>`).join('');
  }else{
    marks+=`<polyline class="pathA" points="${points(a)}"/>`;
    marks+=a.map((v,i)=>{const p=points(a).split(' ')[i].split(',');return `<circle class="pointA" cx="${p[0]}" cy="${p[1]}" r="4"/>`}).join('');
    if(b.length)marks+=`<polyline class="pathB" points="${points(b)}"/>`;
  }
  return `<svg class="graph" viewBox="0 0 180 112" aria-hidden="true">${marks}</svg>`;
}
function renderOptions(){
  $('#options').innerHTML=cur.options.map((o,i)=>`<button class="option" data-i="${i}" disabled>${graphSVG(o,cur.mode)}</button>`).join('');
  selected=-1;T.path=[];T.poly='—';T.err='—';T.plan='—';$('#go').classList.remove('ready');
}
function blocks(count){return Array.from({length:count},()=>'<i class="block"></i>').join('')}
function renderFrame(index){
  const beats=$('#beats').children;[...beats].forEach((x,i)=>x.classList.toggle('live',i===index));
  $('#scrub').value=index;
  if(cur.kind==='two'){
    $('#scene').innerHTML=`<div class="rig"><div class="mark">▲</div><div class="tank">${blocks(cur.a[index])}</div></div><div class="rig b"><div class="mark">●</div><div class="tank">${blocks(cur.b[index])}</div></div>`;
    return;
  }
  const amount=cur.a[Math.min(index,cur.a.length-1)];
  const rate=cur.rates?cur.rates[Math.max(0,index-1)]||cur.rates[0]:0;
  const strip=cur.rates?`<div class="rateStrip">${Array.from({length:rate},()=>'<i class="drop"></i>').join('')}</div>`:'';
  $('#scene').innerHTML=`${strip}<div class="rig"><div class="mark">${cur.kind==='rate'?'💧':'🫙'}</div><div class="tank">${blocks(amount)}</div></div>`;
}
async function playStory(countReplay=true){
  const token=++animToken;locked=true;if(countReplay){replays++;T.path.push('▶');log('story replay');}
  const frames=cur.a.length;$('#beats').innerHTML=Array.from({length:frames},()=>'<i></i>').join('');
  $('#scrub').max=frames-1;$('#scrub').disabled=true;
  for(let i=0;i<frames;i++){if(token!==animToken)return;renderFrame(i);await sleep(430)}
  if(token!==animToken)return;locked=false;
  $('#scrub').disabled=false;
  [...document.querySelectorAll('.option')].forEach(x=>x.disabled=false);
  T.itemStart=performance.now();renderMeters();
}
function pick(index,fromGhost=false){
  if(locked||phase==='done')return;
  if(phase==='scored')GTExam.markFirstAction();
  if(selected!==index){T.path.push(`g${index+1}`);selected=index}
  document.querySelectorAll('.option').forEach((x,i)=>x.classList.toggle('selected',i===index));
  const credit=cur.options[index].credit;T.poly=`${Math.round(credit*100)}% relations`;
  T.err=cur.options[index].err;T.plan=T.path.some(x=>x.startsWith('↔'))?'scrub-then-map':replays?'replay-then-map':T.path.length===1?'direct temporal map':'visual revision';
  $('#go').classList.add('ready');renderMeters();if(!fromGhost)log(`select graph ${index+1} · partial ${Math.round(credit*100)}%`);
  if(phase==='scored')GTExam.telemetry('action',{option:index});
}
async function submit(){
  if(locked||selected<0)return;locked=true;$('#go').classList.remove('ready');
  const correct=selected===cur.correct;
  document.querySelectorAll('.option').forEach((x,i)=>{x.disabled=true;if(i===cur.correct)x.classList.add('correct');if(i===selected&&!correct)x.classList.add('wrong')});
  if(phase==='warmup'){
    log(`WARM-UP ${correct?'match':'corrective match'} · UNSCORED`);await sleep(850);T.level=__gtLevel;startScored();return;
  }
  T.scored++;if(correct){T.correct++;T.maxSolved=Math.max(T.maxSolved,cur.level)}
  T.results.push(correct?'↑':'↓');T.level=clamp(T.level+(correct?1:-1),1,6);
  $('#progress').children[scoredIndex].classList.add(correct?'ok':'no');
  log(`SUBMIT level ${cur.level} ${idea(cur.level)} → ${correct?'CORRECT':'MISS '+T.err}`);
  if(!__gtResponded){__gtResponded=true;GTExam.respond({correct:correct,revisions:0,measurements:{'M-DIFFREACH':correct?cur.level:0}});}
  renderMeters();scoredIndex++;await sleep(900);scoredIndex<1?startScored():finish();
}
function center(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function ghostTo(el){const p=center(el);$('#ghost').style.transform=`translate(${p.x-10}px,${p.y-10}px)`;await sleep(480)}
async function ghostTap(){$('#ghost').classList.remove('tap');void $('#ghost').offsetWidth;$('#ghost').classList.add('tap');await sleep(350)}
function reset(){
  Object.assign(T,{scored:0,correct:0,poly:'—',path:[],plan:'—',err:'—',level:1,startLevel:1,maxSolved:0,results:[],itemStart:0});
  scoredIndex=0;replays=0;[...$('#progress').children].forEach(x=>x.className='');renderMeters();
}
async function loadItem(item,cue){
  cur=item;selected=-1;replays=0;locked=true;$('#phasecue').textContent=cue;renderOptions();await playStory(false);
}
async function runDemo(){
  animToken++;reset();phase='demo';log('ghost-hand demo · wordless');
  await loadItem(ITEMS[0],'👁️');locked=false;$('#ghost').classList.add('show');
  await ghostTo($('#scene'));await sleep(220);await ghostTo($('#options').children[cur.correct]);await ghostTap();pick(cur.correct,true);
  await ghostTo($('#go'));await ghostTap();document.querySelectorAll('.option')[cur.correct].classList.add('correct');
  await sleep(500);$('#ghost').classList.remove('show');startWarmup();
}
async function startWarmup(){phase='warmup';await loadItem(WARM,'⭐');log('warm-up · unscored')}
async function startScored(){phase='scored';await loadItem(ITEMS[T.level-1],'🎯');GTExam.warmupDone();GTExam.startScored();GTExam.telemetry('item_shown',{difficulty:T.level,typeCode:'QUANT-GRAPH-01'});log(`SCORED ${scoredIndex+1}/6 · ${idea(T.level)}`)}
function finish(){phase='done';locked=true;$('#phasecue').textContent='🏆';log(`DONE · ${T.correct}/${T.scored} · peak ${T.maxSolved}`);renderMeters()}
$('#options').addEventListener('click',e=>{const button=e.target.closest('.option');if(button)pick(+button.dataset.i)});
$('#go').addEventListener('click',submit);
$('#replayStory').addEventListener('click',()=>{if(cur&&phase!=='demo'&&phase!=='done')playStory(true)});
$('#scrub').addEventListener('input',event=>{if(cur&&!locked)renderFrame(+event.target.value)});
$('#scrub').addEventListener('change',event=>{if(cur&&!locked){T.path.push(`↔${event.target.value}`);T.plan='scrub-then-map';log(`inspect beat ${+event.target.value+1}`);renderMeters()}});
$('#replayDemo').addEventListener('click',runDemo);
buildTelemetry();renderMeters();
window.__gtPhase=function(){return phase;};
window.__gtAnswer=function(wantCorrect){if((phase!=='scored'&&phase!=='warmup')||locked||!cur)return false;var ci=cur.correct;var idx=wantCorrect?ci:(ci+1)%cur.options.length;pick(idx);submit();return true;};
(function(){var started=false;function begin(lvl){if(started)return;started=true;__gtLevel=Math.max(1,Math.min(6,lvl||1));runDemo();}
if(window.GTExam){GTExam.onInit(function(hostItem){begin(hostItem&&hostItem.difficultyLevel);});GTExam.ready();setTimeout(function(){begin(1);},800);}else{begin(1);}})();
</script>
</body>
</html>
