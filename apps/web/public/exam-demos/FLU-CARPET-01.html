<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-CARPET-01 · Pattern Carpet</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#ffffff;--accent:#5b6cff;--carpet-cell:84px;
    --good:#22b573;--bad:#ff6b6b;--socket:#c9d3ef;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:18px;max-width:600px;width:100%}
  #loom{position:relative;padding:16px;border-radius:20px;background:linear-gradient(160deg,#e7f0ff,#f3eefe);border:3px solid #d3ddff}
  .carpet{display:grid;gap:8px;background:#c9d6f4;padding:8px;border-radius:14px}
  .cell{background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;width:var(--carpet-cell);height:var(--carpet-cell)}
  .cell.empty{background:repeating-linear-gradient(45deg,#eef2ff,#eef2ff 8px,#e2e9ff 8px,#e2e9ff 16px);border:3px dashed var(--socket)}
  .cell.filled-anim{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}
  #tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .opt{position:relative;background:#fff;border:3px solid #e2e8fb;border-radius:14px;width:80px;height:80px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
  .opt::after{content:attr(data-key);position:absolute;right:5px;bottom:3px;font:700 11px/1 ui-monospace,monospace;color:#8a93b5}
  .opt:hover{transform:translateY(-3px);border-color:#c3ccf5}
  .opt.sel{border-color:var(--accent);box-shadow:0 0 0 4px #c9d0ff;transform:translateY(-3px)}
  .opt.correct{border-color:var(--good);box-shadow:0 0 0 4px #b4ecd0}
  .opt.wrong{border-color:var(--bad);box-shadow:0 0 0 4px #ffd0d0}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:76px;height:76px;background:var(--accent);color:#fff;font-size:32px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:52px;height:52px;background:#eef1ff;color:#5b6cff;font-size:24px}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .7s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}
  @keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #difficulty{margin:10px 12px 2px;padding:10px;border:1px solid #2c365d;border-radius:10px;background:#171e36}
  .dtop{display:flex;justify-content:space-between;color:#fff}.dsub{display:flex;justify-content:space-between;color:var(--tel-dim);font-size:11px;margin-top:5px}
  .dtrack{height:7px;background:#2a3458;border-radius:8px;margin-top:8px;overflow:hidden}.dfill{height:100%;background:linear-gradient(90deg,#7fffcf,#ffd479);transition:.25s}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:200px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  button:focus-visible,.opt:focus-visible{outline:4px solid #ffbf69;outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:350px}}
  @media(max-width:500px){:root{--carpet-cell:40px}#wrap{padding:10px}#stagecard{padding:12px}#loom{padding:8px}
    .carpet{gap:5px;padding:6px}#carpet svg{width:100%;height:100%}.opt{width:64px;height:64px}.opt svg{width:58px;height:58px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-CARPET-01 · Pattern Carpet</div>
    <div id="phasecue">&#128065;</div>
    <div id="stagecard">
      <div id="loom"><div id="carpet" class="carpet"></div></div>
      <div id="tray"></div>
      <div id="controls">
        <button id="replay" title="replay demo">&#8635;</button>
        <button id="go" title="submit">&#10003;</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="difficulty" data-tracks="M-DIFFREACH M-LEARNRATE"></div>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">&#128070;<span class="ring"></span></div>
<script src="embed-shim.js"></script>
<script>
'use strict';
var __gtLevel=1,__gtResponded=false;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const last=a=>a[a.length-1];
const PAL=['#4267d5','#159f94','#ef5b5b','#e6a817','#8357c5'];
const MOTIFS=['leaf','bolt','chevron','petal','capsule'];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

/* woven motifs, not generic dot arrays */
const POS={1:[[.5,.5]],2:[[.32,.5],[.68,.5]],3:[[.24,.5],[.5,.5],[.76,.5]],
  4:[[.3,.3],[.7,.3],[.3,.7],[.7,.7]],5:[[.28,.3],[.72,.3],[.5,.5],[.28,.72],[.72,.72]]};
function motif(m,x,y,s,color,fill){const f=fill?`fill="${color}"`:`fill="none" stroke="${color}" stroke-width="3"`;
  if(m==='leaf')return `<path d="M${x-s} ${y+s*.45}Q${x-s*.25} ${y-s*1.2},${x+s} ${y-s*.45}Q${x+s*.2} ${y+s},${x-s} ${y+s*.45}Z" ${f}/>`;
  if(m==='bolt')return `<polygon points="${x-s*.25},${y-s} ${x+s*.75},${y-s} ${x+s*.1},${y} ${x+s*.65},${y} ${x-s*.6},${y+s} ${x-s*.05},${y+s*.1}" ${f}/>`;
  if(m==='chevron')return `<path d="M${x-s} ${y-s*.5}L${x} ${y+s*.55}L${x+s} ${y-s*.5}" ${fill?`fill="none" stroke="${color}" stroke-width="${Math.max(4,s*.45)}"`:`fill="none" stroke="${color}" stroke-width="3"`}/>`;
  if(m==='petal')return `<path d="M${x} ${y-s}Q${x+s} ${y},${x} ${y+s}Q${x-s} ${y},${x} ${y-s}Z" ${f}/>`;
  return `<rect x="${x-s}" y="${y-s*.52}" width="${s*2}" height="${s*1.04}" rx="${s*.5}" ${f}/>`;}
function attrSVG(a,box=76){const s=[.075,.105,.135][a.sizeLvl||0]*box;let inner='';
  (POS[a.count]||POS[1]).forEach(p=>inner+=motif(a.motif,p[0]*box,p[1]*box,s,a.color,a.fill!==0));
  if(a.rot)inner=`<g transform="rotate(${a.rot} ${box/2} ${box/2})">${inner}</g>`;
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${inner}</svg>`;}
function eqA(a,b){return a.motif===b.motif&&a.count===b.count&&a.sizeLvl===b.sizeLvl&&a.color===b.color&&(a.rot||0)===(b.rot||0)&&(a.fill||0)===(b.fill||0);}

/* ---------- item generation: row and two-axis progression grammar ---------- */
function genItem(level){const motifs=shuffle(MOTIFS),colors=shuffle(PAL),grid=level>=5,rows=grid?3:1,cols=grid?3:level>=3?5:4,cells=[];
  for(let r=0;r<rows;r++){cells.push([]);for(let c=0;c<cols;c++){let a={motif:motifs[0],count:1,sizeLvl:1,color:colors[0],rot:0,fill:1};
    if(level===1){a.motif=motifs[c%2];a.color=colors[c%2];}
    if(level>=2)a.count=Math.min(5,c+1);
    if(level>=3)a.rot=c*45;
    if(level===4)a.fill=c%2;
    if(level>=5){a.count=c+1;a.sizeLvl=r;a.motif=motifs[(r+c)%3];}
    if(level>=6){a.rot=(r+c)*45;a.color=colors[r];}
    cells[r].push(a);}}
  const ansPos=[rows-1,cols-1],ans={...cells[ansPos[0]][ansPos[1]]},opts=[];
  const add=(a,tag)=>{if(!opts.some(o=>eqA(o.a,a)))opts.push({a,tag});};
  add(ans,'correct');
  if(level===1)add({...ans,motif:motifs[0],color:colors[0]},'period:repeat-last');
  add({...ans,count:Math.max(1,ans.count-1)},'row:off-by-one');
  add({...ans,sizeLvl:Math.max(0,ans.sizeLvl-1)},'column:size-slip');
  add({...ans,rot:(ans.rot+45)%360},'rotation:wrong-step');
  add({...ans,motif:motifs[(motifs.indexOf(ans.motif)+1)%motifs.length]},'motif:wrong-cycle');
  add({...ans,fill:ans.fill?0:1},'fill:wrong-phase');
  let g=0;while(opts.length<4&&g++<20)add({...ans,color:colors[g%colors.length],count:Math.max(1,ans.count-(g%2+1))},'random');
  return {level,mode:grid?'grid':'row',rows,cols,cells,ansPos,options:shuffle(opts.slice(0,4)),diff:level};}
function twinOf(it){return genItem(it.level);}

/* ---------- telemetry ---------- */
const T={scored:0,correct:0,rts:[],gates:[],firstLat:null,lastErr:'\u2014',maxSolved:0,level:1,
  pairFirst:null,pairHistory:[],itemStart:0,firstActed:false,blurThis:0};
function consistStr(){if(T.pairFirst!=null)return `twin pending (${T.pairFirst?'\u2713':'\u2717'}…)`;if(!T.pairHistory.length)return '\u2014';
  const p=last(T.pairHistory);return `${p[0]===p[1]?'consistent':'INCONSISTENT'} (${p.map(x=>x?'\u2713':'\u2717').join('')}) · ${T.pairHistory.length} pair(s)`;}
function rtStr(){if(!T.rts.length)return '\u2014';const g=last(T.gates),rt=last(T.rts);return g.ok?`${rt} ms (mean ${mean(T.rts)})`:`gated · ${g.reason} · ${rt} ms`;}
const METERS=[
 {id:'M-ACC',name:'Item accuracy (running)',get:()=>T.scored?`${T.correct}/${T.scored}  ${Math.round(100*T.correct/T.scored)}%`:'\u2014'},
 {id:'M-RT',name:'Response time — engagement gated',get:()=>rtStr()},
 {id:'M-RTFIRST',name:'First-action latency (extract rule)',get:()=>T.firstLat==null?'\u2014':T.firstLat+' ms'},
 {id:'M-ERRTYPE',name:'Error type (progression slip)',get:()=>T.lastErr},
 {id:'M-DIFFREACH',name:'Max difficulty (parallel progressions)',get:()=>T.maxSolved?`L${T.maxSolved}`:'\u2014'},
 {id:'M-CONSIST',name:'Cross-item consistency (AIG twins)',get:()=>consistStr()},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>
  `<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span>`
  +`<span class="mname">${m.name}</span></div>`).join('');}
function learnRate(){return T.scored?(Math.max(0,T.maxSolved-1)/T.scored).toFixed(2):'0.00';}
function renderDifficulty(){$('#difficulty').innerHTML=`<div class="dtop"><b>DIFFICULTY</b><span>${T.level}/6</span></div><div class="dtrack"><div class="dfill" style="width:${T.level/6*100}%"></div></div><div class="dsub"><span>reach ${T.maxSolved||'\u2014'}</span><span>learn ${learnRate()} lvl/trial</span></div>`;}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});renderDifficulty();}
function log(msg){const now=new Date(),t=Math.max(0,Date.now()-T.itemStart),d=document.createElement('div');
  d.innerHTML=`<span class="t">${now.toISOString().slice(11,23)} · +${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
function gate(rt){const rapid=rt<350,blur=T.blurThis>0,base=T.rts.length>2?mean(T.rts.slice(0,-1)):0,drift=base>0&&rt>base*2.5;return{ok:!rapid&&!blur&&!drift,reason:rapid?'rapid':blur?'blur':drift?'drift':'ok'};}

/* ---------- ghost ---------- */
const ghost=$('#ghost');
function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(680);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(500);}

/* ---------- flow ---------- */
let phase='demo',cur=null,staged=-1,locked=false,scoredIndex=0,pairBase=null,demoRun=0;
const TOTAL=1;
function setCue(i){$('#phasecue').innerHTML=i;}
function disableTray(d){locked=d;}
function renderItem(item){cur=item;const g=$('#carpet');g.style.gridTemplateColumns=`repeat(${item.cols},var(--carpet-cell))`;g.innerHTML='';
  for(let r=0;r<item.rows;r++)for(let c=0;c<item.cols;c++){const cell=document.createElement('div');cell.className='cell';
    if(r===item.ansPos[0]&&c===item.ansPos[1]){cell.classList.add('empty');cell.id='emptycell';}
    else cell.innerHTML=attrSVG(item.cells[r][c]);g.appendChild(cell);}
  const tray=$('#tray');tray.innerHTML='';
  item.options.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.dataset.i=i;b.dataset.key=i+1;b.setAttribute('aria-label',`option ${i+1}`);b.innerHTML=attrSVG(o.a);tray.appendChild(b);});
  $('#go').classList.remove('ready');staged=-1;T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;T.blurThis=0;renderMeters();}
function fillEmpty(a){const cell=$('#emptycell');if(!cell)return;cell.classList.remove('empty');
  cell.classList.add('filled-anim');cell.innerHTML=attrSVG(a);setTimeout(()=>cell.classList.remove('filled-anim'),300);}
function onOpt(el){if(locked||phase==='demo'||phase==='done')return;const idx=+el.dataset.i;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first tap · option '+idx);if(phase==='scored')GTExam.markFirstAction();}
  staged=idx;$$('#tray .opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');
  fillEmpty(cur.options[idx].a);$('#go').classList.add('ready');if(phase==='scored')GTExam.telemetry('action',{option:idx});renderMeters();}
function feedback(correct){const opt=$$('#tray .opt')[staged];if(opt)opt.classList.add(correct?'correct':'wrong');
  if(!correct){$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),450);
    const ci=cur.options.findIndex(o=>o.tag==='correct');$$('#tray .opt')[ci].classList.add('correct');}
  disableTray(true);$('#go').classList.remove('ready');}
function submit(){if(staged===-1)return;const opt=cur.options[staged];const rt=Date.now()-T.itemStart;const correct=opt.tag==='correct';
  if(phase==='warmup'){feedback(correct);log('warm-up '+(correct?'correct':'incorrect')+' — UNSCORED');setTimeout(nextPhase,950);return;}
  T.scored++;T.rts.push(rt);T.gates.push(gate(rt));
  if(correct){T.correct++;T.maxSolved=Math.max(T.maxSolved,cur.level);T.lastErr='none';}else T.lastErr=opt.tag;
  if(scoredIndex%2===0)T.pairFirst=correct;
  else{const pair=[T.pairFirst,correct];T.pairHistory.push(pair);const jump=T.pairHistory.length===1?2:T.pairHistory.length===2?3:1;
    T.level=Math.max(1,Math.min(6,T.level+(pair[0]&&pair[1]?jump:-1)));T.pairFirst=null;}
  feedback(correct);
  log(`SUBMIT ${scoredIndex+1}/${TOTAL} · L${cur.level} ${cur.mode}${scoredIndex%2?' twin':''} \u2192 ${correct?'CORRECT':'wrong ['+opt.tag+']'} · ${last(T.gates).reason}${scoredIndex%2?' · next L'+T.level:' · twin queued'}`);
  if(!__gtResponded){__gtResponded=true;GTExam.respond({correct:correct,revisions:0,measurements:{'M-DIFFREACH':correct?cur.level:0,'M-ERRTYPE':correct?0:1}});}
  renderMeters();setTimeout(nextPhase,1200);}
function nextPhase(){if(phase==='warmup'){scoredIndex=0;T.level=__gtLevel;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<TOTAL?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('&#11088;');disableTray(false);renderItem(genItem(2));log('— warm-up · continue the weave · UNSCORED —');}
function startScored(){phase='scored';setCue('&#127919;');disableTray(false);
  if(scoredIndex%2===0){pairBase=genItem(T.level);renderItem(pairBase);}else renderItem(twinOf(pairBase));
  GTExam.warmupDone();GTExam.startScored();GTExam.telemetry('item_shown',{difficulty:cur.level,typeCode:'FLU-CARPET-01'});
  log(`— SCORED ${scoredIndex+1}/${TOTAL} · L${cur.level} · ${cur.mode}${scoredIndex%2?' · AIG twin':''} —`);}
function finish(){phase='done';setCue('&#127942;');disableTray(true);
  log(`— DONE · accuracy ${T.correct}/${T.scored} · ${consistStr()} —`);}
async function runDemo(){const token=++demoRun;phase='demo';setCue('&#128065;');disableTray(true);
  const d=genItem(2);renderItem(d);log('ghost-hand demo · sweep and continue · wordless · <10s');
  const ci=d.options.findIndex(o=>o.tag==='correct');
  ghostShow(true);await sleep(250);const cells=$$('#carpet .cell');
  await ghostTo(cells[0]);await ghostTo(cells[1]);await ghostTo(cells[2]);await sleep(150);
  await ghostTo($('#carpet .cell.empty'));await sleep(180);
  await ghostTo($$('#tray .opt')[ci]);await ghostTap();
  $$('#tray .opt')[ci].classList.add('correct');fillEmpty(d.options[ci].a);
  await sleep(500);await ghostTo($('#go'));await ghostTap();await sleep(350);ghostShow(false);await sleep(350);if(token===demoRun)startWarmup();}

$('#tray').addEventListener('click',e=>{const o=e.target.closest('.opt');if(o)onOpt(o);});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
document.addEventListener('keydown',e=>{if(!locked&&phase!=='done'){if(/^[1-4]$/.test(e.key)){const o=$$('#tray .opt')[+e.key-1];if(o)onOpt(o);}if(e.key==='Enter'&&$('#go').classList.contains('ready'))submit();}});
window.addEventListener('blur',()=>{if(phase==='scored'&&!locked){T.blurThis++;log('engagement · focus lost');renderMeters();}});
buildMeters();renderMeters();
window.__gtPhase=function(){return phase;};
window.__gtAnswer=function(wantCorrect){if((phase!=='scored'&&phase!=='warmup')||locked||!cur)return false;var ci=cur.options.findIndex(function(o){return o.tag==='correct';});var idx=wantCorrect?ci:(ci+1)%cur.options.length;onOpt($$('#tray .opt')[idx]);submit();return true;};
(function(){var started=false;function begin(lvl){if(started)return;started=true;__gtLevel=Math.max(1,Math.min(6,lvl||1));runDemo();}
if(window.GTExam){GTExam.onInit(function(hostItem){begin(hostItem&&hostItem.difficultyLevel);});GTExam.ready();setTimeout(function(){begin(1);},800);}else{begin(1);}})();
</script>
</body>
</html>
