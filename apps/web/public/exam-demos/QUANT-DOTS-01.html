<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUANT-DOTS-01 · More or Fewer (renderer)</title>
<style>
  :root{
    --sky:#edf6fb;--mist:#dce8ee;--ink:#243642;--paper:#fff;
    --firefly:#26343b;--accent:#ffb347;--dim:#7992a7;
    --tel:#101a24;--tel2:#182838;--key:#73f0c4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    display:flex;background:radial-gradient(circle at 35% 10%,#fff 0,var(--sky) 48%,#d9e9f1 100%);
    color:var(--ink);font:16px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;
  }
  button{font:inherit;border:0;cursor:pointer}
  #wrap{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px}
  #badge{color:#718895;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  #howto{max-width:720px;width:100%;background:#fff;border:1px solid #dbe7ed;border-left:5px solid var(--accent);border-radius:12px;padding:12px 16px;box-shadow:0 8px 24px -18px #314b5d}
  #howto h1{margin:0 0 4px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#c07d1e}
  #howto p{margin:0;font-size:14px;color:#3d5663;line-height:1.5}
  #phasecue{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:#fff0da;color:#b06d10;border:2px solid #ffd9a6;min-height:30px}
  #phasecue[data-phase="waiting"]{background:#fff7e6;color:#a9791b;border-color:#ffe1a6}
  #phasecue[data-phase="flash"]{background:#e7f0ff;color:#3a58c8;border-color:#c9d6ff}
  #phasecue[data-phase="answer"]{background:var(--accent);color:#5a3800;border-color:var(--accent)}
  #phasecue[data-phase="sent"]{background:#e6f7ef;color:#1c8f63;border-color:#bfe6d6}
  #stagecard{width:min(720px,100%);background:rgba(255,255,255,.9);border-radius:30px;box-shadow:0 24px 65px -35px #314b5d;padding:22px;display:grid;gap:16px;border:1px solid #fff}
  #sky{display:grid;grid-template-columns:1fr 1fr;gap:16px;position:relative}
  .window{min-height:238px;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(#cfe7f0,#eef6f8);border:3px solid #fff;box-shadow:inset 0 0 0 1px #c3d8e2}
  .cloud{position:absolute;inset:0}
  .dot{position:absolute;border-radius:50%;background:var(--firefly);box-shadow:0 0 0 2px rgba(255,255,255,.65),0 2px 7px rgba(22,48,58,.25);transform:translate(-50%,-50%)}
  .cover{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:repeating-linear-gradient(135deg,#dfe8eb 0,#dfe8eb 15px,#d5e1e5 15px,#d5e1e5 30px);color:#9dafb7;font-size:56px;opacity:0;pointer-events:none;transition:opacity .16s}
  .cover.closed{opacity:1}
  #answers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .side{height:82px;border-radius:22px;background:#e8f0f3;color:#617985;font-size:38px;box-shadow:0 8px 18px -14px #28404d;transition:.18s;position:relative}
  .side:not(:disabled):hover{transform:translateY(-2px);background:#dcebef}
  .side:disabled{opacity:.38;cursor:default}
  .side.chosen{background:#fff0da;color:#b06d10;transform:scale(1.02);box-shadow:0 0 0 4px #ffd9a655}
  .keycap{position:absolute;right:12px;bottom:9px;font:700 11px ui-monospace,monospace;border:1px solid #b8cad1;border-bottom-width:3px;border-radius:6px;padding:2px 6px}
  #status{min-height:22px;font-size:14px;font-weight:700;text-align:center;color:#7992a7}
  #telemetry{width:330px;flex:0 0 330px;min-height:100vh;background:var(--tel);color:#bdd0df;display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:13px 14px;background:var(--tel2);color:#fff;text-transform:uppercase;font-size:12px;letter-spacing:.09em}
  #difficulty{padding:11px 13px;border-bottom:1px solid #263b4c}
  #diffhead{display:flex;justify-content:space-between;color:#9eb6c8;font-size:11px}
  #diffbar{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin:7px 0}
  #diffbar i{height:9px;border-radius:3px;background:#2a4052}
  #diffbar i.on{background:linear-gradient(90deg,#73f0c4,#ffcf7a)}
  #mlist{padding:11px 13px;display:flex;flex-direction:column;gap:8px}
  .mrow{display:grid;grid-template-columns:100px 1fr;gap:7px}
  .mid{color:var(--key);font-weight:800}.mval{color:#fff;text-align:right}
  .mname{grid-column:1/3;color:var(--dim);font-size:11px;margin-top:-4px}
  #logwrap{margin-top:auto;border-top:1px solid #263b4c}
  #logwrap b{display:block;padding:8px 12px 3px;color:#829caf;font-size:11px;letter-spacing:.08em}
  #log{height:230px;overflow:auto;padding:2px 12px 12px;white-space:pre-wrap}
  #log div{padding:3px 0;border-bottom:1px dotted #263746}#log .t{color:#587185}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;min-height:0;height:330px;flex:none}}
  @media(max-width:520px){#wrap{padding:10px}.window{min-height:190px}#stagecard{padding:14px}#sky{gap:9px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<style>html[data-gt-telemetry="off"] #telemetry{display:none}</style>
<script>/* D-028 — the researcher telemetry panel is presentational only. Embedded in the
   child-facing screener it is hidden: naming the behavioural metrics to the child can
   change the behaviour being measured. `?telemetry=1` restores it for a live
   demonstration, and standalone (opened directly) is unchanged. Sampling, metric
   computation and the {type:'telemetry'} postMessage stream are untouched. */
(function(){var f=/(^|[?&])telemetry=1(&|$)/.test(location.search),e=true;try{e=!!(window.parent&&window.parent!==window);}catch(_){e=true;}if(e&&!f)document.documentElement.setAttribute('data-gt-telemetry','off');})();</script>
</head>
<body>
<main id="wrap">
  <div id="badge">QUANT-DOTS-01 · More or Fewer</div>
  <header id="howto">
    <h1>How to use — More or Fewer</h1>
    <p>Two groups of dots flash and then hide. Choose the side that had MORE dots — tap it, or press F for left and J for right.</p>
  </header>
  <div id="phasecue" data-phase="waiting">Loading</div>
  <section id="stagecard">
    <div id="sky">
      <div class="window" id="winL"><div class="cloud" id="cloudL"></div><div class="cover" id="coverL">&#9676;</div></div>
      <div class="window" id="winR"><div class="cloud" id="cloudR"></div><div class="cover" id="coverR">&#9676;</div></div>
    </div>
    <div id="answers">
      <button class="side" id="pickL" disabled aria-label="choose left">&#9664;<span class="keycap">F</span></button>
      <button class="side" id="pickR" disabled aria-label="choose right">&#9654;<span class="keycap">J</span></button>
    </div>
    <div id="status">Waiting for an item.</div>
  </section>
</main>
<aside id="telemetry">
  <h3>Live telemetry · per-child</h3>
  <div id="difficulty">
    <div id="diffhead"><span>ITEM DIFFICULTY (design rung)</span><span id="dlevel">— / 20</span></div>
    <div id="diffbar"></div>
  </div>
  <div id="mlist"></div>
  <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
</aside>
<script>
'use strict';
/*
 * QUANT-DOTS-01 — PURE RENDERER (nonsymbolic 2AFC).
 * Renders one ServedItem's `content` (two dot arrays; no answer key ever reaches
 * this file), flashes both arrays for content.exposureMs, hides them behind
 * neutral covers, captures which side the child taps + timing, and hands the
 * result to the host via postMessage. It NEVER reveals which side had more;
 * scoring is server-authoritative (EXAM_ADAPTIVE_BUILD_PLAN.md §2).
 *
 * Embedding protocol (postMessage):
 *   host -> demo : {source:'gt-exam-host', type:'init',  item:ServedItem}
 *                  {source:'gt-exam-host', type:'start'}
 *   demo -> host : {source:'gt-exam-demo', type:'ready'}
 *                  {source:'gt-exam-demo', type:'result',    result:ItemResult}
 *                  {source:'gt-exam-demo', type:'telemetry', event:TelemetryEvent}
 *
 * Double-clicked (standalone), it renders bundled sample items so it still runs.
 */
const $=s=>document.querySelector(s);
const clock=()=>performance.now();
const EMBEDDED = !!(window.parent && window.parent !== window);
const SRC_DEMO='gt-exam-demo', SRC_HOST='gt-exam-host';
const RAPID_MS=250;                               // ANS effort-validity threshold (tracked)

/* ---------------- state (reset per item) ---------------- */
let item=null, renderT0=0, decisionT0=null, firstT=null, selectedKey=null;
let submitted=false, locked=true, loadToken=0;
let focusedMs=0, focusTs=clock(), isFocused=(document.visibilityState!=='hidden'), blurCount=0;
let telemetryLog=[];

/* ---------------- rendering ---------------- */
function paintCloud(el,side){
  el.innerHTML='';
  const d=2*side.r;                                // px diameter
  (side.dots||[]).forEach(p=>{
    const dot=document.createElement('i');
    dot.className='dot';
    dot.style.cssText=`width:${d}px;height:${d}px;left:${p.x}%;top:${p.y}%`;
    el.appendChild(dot);
  });
}
function renderItem(){
  const c=item.content;
  paintCloud($('#cloudL'),c.left);paintCloud($('#cloudR'),c.right);
  $('#coverL').classList.add('closed');$('#coverR').classList.add('closed'); // hidden until the flash
  $('#pickL').disabled=true;$('#pickR').disabled=true;
  $('#pickL').classList.remove('chosen');$('#pickR').classList.remove('chosen');
  const dd=Number(item.difficulty)||0;
  $('#dlevel').textContent=`${dd?dd.toFixed(1):'—'} / 20`;
  $('#diffbar').innerHTML=Array.from({length:20},(_,i)=>`<i class="${i<Math.round(dd)?'on':''}"></i>`).join('');
  renderMeters();
}

/* ---------------- telemetry + metrics ---------------- */
function emit(type,payload){const msg=Object.assign({source:SRC_DEMO,type},payload);if(EMBEDDED){try{window.parent.postMessage(msg,'*');}catch(e){/* no-op */}}}
function evt(name,extra){const e=Object.assign({t:Math.round(clock()-renderT0),name},extra||{});telemetryLog.push(e);emit('telemetry',{event:e});log(name+(extra&&extra.key?` · ${extra.key}`:'')+(extra&&extra.ms!=null?` · ${extra.ms}ms`:''));return e;}
function evt0(name){const e={t:0,name};telemetryLog.push(e);emit('telemetry',{event:e});log(name);}
function tickFocus(){const t=clock();if(isFocused)focusedMs+=t-focusTs;focusTs=t;}
function decisionRt(){return decisionT0==null?0:Math.round((submitted&&firstT!=null?firstT:clock())-decisionT0);}
function metricsNow(){
  tickFocus();
  const total=Math.max(1,Math.round(clock()-renderT0));
  const rt=decisionRt();
  return {
    'M-RTFIRST': rt,                                // ms from stimulus offset to the tap
    'M-RT': rt,                                     // single-decision RT (== first action)
    'M-REV': 0,                                     // 2AFC: no revision channel
    'M-RAPIDGUESS': submitted&&rt<RAPID_MS?1:0,      // impulsive-tap flag (tracked)
    'M-ENGAGE': Math.round(1000*Math.min(1,focusedMs/total))/1000,
  };
}

/* ---------------- interaction ---------------- */
function choose(side,modality){
  if(locked||submitted||decisionT0==null)return;
  if(side!=='L'&&side!=='R')return;
  submitted=true;locked=true;selectedKey=side;
  firstT=clock();                                   // moment of decision
  (side==='L'?$('#pickL'):$('#pickR')).classList.add('chosen');
  $('#pickL').disabled=true;$('#pickR').disabled=true;
  const rt=decisionRt();
  evt('choose',{key:side,ms:rt,modality:modality||'tap'});
  setCue('sent','Answer sent');setStatus('Answer sent. Waiting for the next item.');
  // ItemResult: raw choice + timing. NO correctness, NO reveal of the bigger side.
  const result={
    itemId:item.itemId,typeCode:item.typeCode||'QUANT-DOTS-01',domain:item.domain||'quantitative',
    response:{selectedKey:side,rtMs:rt,exposureMs:item.content.exposureMs,modality:modality||'tap'},
    metrics:metricsNow(),
    telemetry:telemetryLog.slice(),
  };
  emit('result',{result});
  log('RESULT sent · '+side+' · '+JSON.stringify(result.metrics));
  if(!EMBEDDED) standaloneAdvance();
}

/* ---------------- meters / cue / log ---------------- */
const METERS=[
  {id:'M-RTFIRST',name:'Decision latency from flash off (ms)'},
  {id:'M-RT',name:'Total response time (ms)'},
  {id:'M-REV',name:'Revisions (2AFC = 0)'},
  {id:'M-RAPIDGUESS',name:'Rapid-guess flag (tracked)'},
  {id:'M-ENGAGE',name:'Focused fraction (tracked)'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}">—</span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){const m=metricsNow();METERS.forEach(x=>{const el=$('#v_'+x.id);if(el)el.textContent=String(m[x.id]);});}
function setCue(k,txt){const el=$('#phasecue');el.dataset.phase=k;el.textContent=txt;}
function setStatus(msg){$('#status').textContent=msg;}
function log(msg){const d=document.createElement('div');d.innerHTML=`<span class="t">${new Date().toLocaleTimeString([],{minute:'2-digit',second:'2-digit'})}</span> ${msg}`;$('#log').appendChild(d);$('#log').scrollTop=$('#log').scrollHeight;}

/* ---------------- lifecycle ---------------- */
function loadItem(served){
  item=served;submitted=false;locked=true;selectedKey=null;decisionT0=null;firstT=null;
  telemetryLog=[];focusedMs=0;focusTs=clock();isFocused=(document.visibilityState!=='hidden');blurCount=0;
  renderT0=clock();loadToken++;
  renderItem();
  setCue('waiting','Get ready');setStatus('Watch for the two dot groups.');
  evt('render',{itemId:item.itemId,exposureMs:item.content.exposureMs,difficulty:item.difficulty});
  // Unlock via the flash sequence on host 'start'; self-run shortly if omitted.
  clearTimeout(loadItem._t);
  loadItem._t=setTimeout(()=>{ if(!submitted&&decisionT0==null)begin(); },500);
}
// Flash both arrays, then hide and RELEASE the lock so the child can answer.
function begin(){
  if(!item||submitted||decisionT0!=null)return;
  const token=loadToken;
  clearTimeout(loadItem._t);
  setCue('flash','Look');setStatus('Which side has more?');
  $('#coverL').classList.remove('closed');$('#coverR').classList.remove('closed'); // reveal dots
  evt('flash_on',{exposureMs:item.content.exposureMs});
  setTimeout(()=>{
    if(token!==loadToken||submitted)return;
    $('#coverL').classList.add('closed');$('#coverR').classList.add('closed');       // hide dots
    decisionT0=clock();locked=false;                                                 // RELEASE lock
    $('#pickL').disabled=false;$('#pickR').disabled=false;
    setCue('answer','Your turn');setStatus('Tap the side that had more dots (or press F / J).');
    evt('flash_off');renderMeters();
  }, Math.max(120, item.content.exposureMs|0));
}

/* host protocol */
window.addEventListener('message',e=>{
  const d=e.data; if(!d||d.source!==SRC_HOST)return;
  if(d.type==='init'&&d.item){evt0('init');loadItem(d.item);}
  else if(d.type==='start'){clearTimeout(loadItem._t);begin();}
});

/* engagement tracking */
function onFocus(){tickFocus();isFocused=true;}
function onBlur(){tickFocus();if(isFocused)blurCount++;isFocused=false;evt('blur',{blurCount});}
window.addEventListener('focus',onFocus);window.addEventListener('blur',onBlur);
document.addEventListener('visibilitychange',()=>{document.visibilityState==='hidden'?onBlur():onFocus();});

/* input wiring */
$('#pickL').addEventListener('click',()=>choose('L','tap'));
$('#pickR').addEventListener('click',()=>choose('R','tap'));
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='f')choose('L','key');if(k==='j')choose('R','key');});

/* ---------------- standalone fallback (double-click) ---------------- */
function ring(n,cx,cy,rad,r){return Array.from({length:n},(_,i)=>({x:Math.round((cx+rad*Math.cos(i/n*6.283))*10)/10,y:Math.round((cy+rad*Math.sin(i/n*6.283))*10)/10}));}
const SAMPLES=[
  {itemId:'sample-easy',typeCode:'QUANT-DOTS-01',domain:'quantitative',difficulty:2.0,ageBands:['K-1'],
   content:{typeCode:'QUANT-DOTS-01',mode:'compare_more',
     left:{count:5,r:20,dots:ring(5,50,50,26,20)},right:{count:10,r:20,dots:ring(10,50,50,30,20)},
     exposureMs:1100,cueCondition:'equal-size',options:[{key:'L'},{key:'R'}],prompt:'Which side had more dots?'}},
  {itemId:'sample-hard',typeCode:'QUANT-DOTS-01',domain:'quantitative',difficulty:15.0,ageBands:['2-3'],
   content:{typeCode:'QUANT-DOTS-01',mode:'compare_more',
     left:{count:19,r:11,dots:ring(19,50,50,34,11)},right:{count:16,r:14,dots:ring(16,50,50,32,14)},
     exposureMs:400,cueCondition:'incongruent',options:[{key:'L'},{key:'R'}],prompt:'Which side had more dots?'}},
];
let sampleIx=0;
function standaloneAdvance(){setTimeout(()=>{sampleIx=(sampleIx+1)%SAMPLES.length;loadItem(SAMPLES[sampleIx]);begin();},1300);}

/* ---------------- boot ---------------- */
buildMeters();
emit('ready');
if(EMBEDDED){ setCue('waiting','Waiting for host'); log('ready · awaiting host init'); }
else{ log('standalone · no host detected'); loadItem(SAMPLES[0]); begin(); }
</script>
</body>
</html>
