<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPA-HIDDENCUBE-01 · X-Ray Cubes</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px}
  #stagecard{background:var(--card);border-radius:26px;padding:20px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:560px;width:100%}
  #stage{position:relative;border-radius:18px;background:radial-gradient(120% 120% at 50% 20%,#f3f7ff,#e5ebff);border:3px solid #d6ddff}
  canvas{display:block;border-radius:15px;touch-action:none}
  #stepbar{display:flex;align-items:center;gap:14px}
  .rd{width:56px;height:56px;border-radius:50%;background:#eef1ff;color:#4757d6;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center}
  #count{min-width:96px;height:78px;border-radius:18px;background:linear-gradient(160deg,#eef4ff,#f4ecff);border:3px solid #cfd8ff;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#2b3566}
  #controls{display:flex;gap:14px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  .rd:active{transform:scale(.94)}
  #go{width:70px;height:70px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  #replay,#xray{width:48px;height:48px;background:#eef1ff;color:#5b6cff;font-size:20px}
  #xray.on{background:#ffe6fb;color:#c026a6}
  #xray[disabled]{opacity:.28;pointer-events:none}
  .rot{width:46px;height:46px;border-radius:14px;background:#eef1ff;color:#4757d6;font-size:22px}
  #keys{font-size:12px;color:#8a93b5;letter-spacing:.02em;text-align:center}
  #keys b{color:#5566b0}
  .shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .flash{animation:flash .5s}@keyframes flash{0%{box-shadow:0 0 0 0 rgba(34,181,115,.0)}40%{box-shadow:0 0 0 8px rgba(34,181,115,.35)}100%{box-shadow:0 0 0 0 rgba(34,181,115,0)}}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;transition:transform .55s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-4px;width:26px;height:26px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:326px;flex:0 0 326px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #diffwrap{padding:4px 12px 10px;border-top:1px solid #262f52}
  #diffwrap b{display:block;color:#8ea0d6;font-size:11px;letter-spacing:.08em;padding:6px 0 6px}
  #diffmeter{display:flex;gap:3px}
  .seg{flex:1;height:14px;border-radius:3px;background:#222c4d;position:relative}
  .seg.done{background:#3350d9}.seg.cur{background:#7fffcf}.seg.ceil{box-shadow:inset 0 0 0 2px #ffd479}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:172px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">SPA-HIDDENCUBE-01 · X-Ray Cubes</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="stage"><canvas id="c" width="500" height="330"></canvas></div>
      <div id="controls">
        <button class="rot" id="rl" title="rotate left">⟲</button>
        <button class="rot" id="rr" title="rotate right">⟳</button>
        <button id="xray" title="x-ray (practice only)">🩻</button>
        <button id="replay" title="replay demo">↻</button>
      </div>
      <div id="stepbar">
        <button class="rd" id="minus" title="fewer">−</button>
        <div id="count">0</div>
        <button class="rd" id="plus" title="more">＋</button>
        <button id="go" title="submit count">✓</button>
      </div>
      <div id="keys"><b>◀ ▶</b> turn · <b>▲ ▼</b> count · <b>X</b> x-ray · <b>Enter</b> submit</div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="diffwrap"><b>DIFFICULTY LADDER (M-DIFFREACH · M-LEARNRATE)</b><div id="diffmeter"></div></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const last=a=>a[a.length-1];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- minimal 3D: yaw/pitch + orthographic projection ---------- */
function proj(p,yaw,pit,s,cx,cy){
  const cyw=Math.cos(yaw),syw=Math.sin(yaw),cp=Math.cos(pit),sp=Math.sin(pit);
  let x=p[0]*cyw+p[2]*syw, z=-p[0]*syw+p[2]*cyw, y=p[1]*cp-z*sp; z=p[1]*sp+z*cp;
  return {x:cx+x*s, y:cy-y*s, z};
}
const LIGHT=[0.35,0.84,0.42];
function faceShade(n){const d=Math.max(0,n[0]*LIGHT[0]+n[1]*LIGHT[1]+n[2]*LIGHT[2]);return 0.52+0.48*d;}
function shade(rgb,f){return `rgb(${Math.round(rgb[0]*f)},${Math.round(rgb[1]*f)},${Math.round(rgb[2]*f)})`;}

/* ---------- stack generation (voxel heightmap, stability forced) ---------- */
function analyze(H,R,C){
  const vox=[];let total=0,hidden=0,maxBury=0;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const h=H[r][c];total+=h;
    for(let y=0;y<h;y++){
      const above=y<h-1;
      const front=(r+1<R)&&H[r+1][c]>y;
      const right=(c+1<C)&&H[r][c+1]>y;
      const hid=above&&front&&right;
      if(hid){hidden++;maxBury=Math.max(maxBury,h-1-y);}
      vox.push({r,c,y,hidden:hid});
    }}
  return {vox,total,hidden,visible:total-hidden,maxBury};
}
function levelParams(L){
  return {
    R:clamp(2+Math.floor(L/3),2,3),
    C:clamp(2+Math.floor((L+2)/3),2,3),
    maxH:clamp(2+Math.floor(L/2),2,4),
    holes:L>=5,
    needHidden:clamp(1+Math.floor(L/2),1,5)
  };
}
function genStack(L){
  const P=levelParams(L);
  for(let t=0;t<900;t++){
    const H=[];
    for(let r=0;r<P.R;r++){H.push([]);for(let c=0;c<P.C;c++){
      let h=(P.holes&&Math.random()<0.14)?0:1+Math.floor(Math.random()*P.maxH);
      H[r].push(h);
    }}
    const s=analyze(H,P.R,P.C);
    if(s.total>=3&&s.total<=30&&s.hidden>=P.needHidden&&s.visible!==s.total)
      return Object.assign({H,R:P.R,C:P.C,level:L},s);
  }
  // constructed fallback: heights rise toward the front-right so hidden cubes are forced
  const H=[];for(let r=0;r<P.R;r++){H.push([]);for(let c=0;c<P.C;c++)H[r].push(clamp(2+(r>=1?1:0)+(c>=1?1:0),2,P.maxH));}
  return Object.assign({H,R:P.R,C:P.C,level:L,fallback:true},analyze(H,P.R,P.C));
}

/* ---------- scene build + draw ---------- */
const cv=$('#c'),ctx=cv.getContext('2d');
let yaw=-0.72,pit=0.52,scale=44,cx=250,cy=200,scene=null,xray=false,stack=null;
function buildScene(st){
  let maxY=0;st.H.forEach(row=>row.forEach(h=>{if(h>maxY)maxY=h;}));
  const ox=st.C/2,oy=maxY/2,oz=st.R/2,verts=[],faces=[];
  st.vox.forEach(v=>{
    const x=v.c,y=v.y,z=v.r;
    const corners=[[x,y,z],[x+1,y,z],[x+1,y+1,z],[x,y+1,z],[x,y,z+1],[x+1,y,z+1],[x+1,y+1,z+1],[x,y+1,z+1]]
      .map(q=>[q[0]-ox,q[1]-oy,q[2]-oz]);
    const off=verts.length;corners.forEach(q=>verts.push(q));
    [{i:[0,1,2,3],n:[0,0,-1]},{i:[4,5,6,7],n:[0,0,1]},{i:[0,1,5,4],n:[0,-1,0]},
     {i:[3,2,6,7],n:[0,1,0]},{i:[1,2,6,5],n:[1,0,0]},{i:[0,3,7,4],n:[-1,0,0]}]
      .forEach(d=>faces.push({idx:d.i.map(k=>k+off),n:d.n,hidden:v.hidden}));
  });
  scene={verts,faces};fit();
}
function fit(){
  const p0=scene.verts.map(v=>proj(v,yaw,pit,1,0,0));
  let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
  p0.forEach(p=>{mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x);mny=Math.min(mny,p.y);mxy=Math.max(mxy,p.y);});
  scale=Math.min((cv.width-56)/((mxx-mnx)||1),(cv.height-56)/((mxy-mny)||1),72);
  cx=cv.width/2-((mnx+mxx)/2)*scale;cy=cv.height/2-((mny+mxy)/2)*scale;
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();ctx.globalAlpha=.5;ctx.fillStyle='#c7d2f2';
  ctx.beginPath();ctx.ellipse(cv.width/2,cv.height-34,scale*(stack?stack.C:2)*0.95,scale*0.55,0,0,7);ctx.fill();ctx.restore();
  const P=scene.verts.map(v=>proj(v,yaw,pit,scale,cx,cy));
  scene.faces.map((f,k)=>({k,depth:f.idx.reduce((a,i)=>a+P[i].z,0)/f.idx.length}))
    .sort((a,b)=>a.depth-b.depth)
    .forEach(({k})=>{
      const f=scene.faces[k];
      const mag=xray&&f.hidden,base=mag?[226,86,205]:[92,132,224];
      ctx.beginPath();f.idx.forEach((i,j)=>{const p=P[i];j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);});ctx.closePath();
      ctx.globalAlpha=xray?(f.hidden?0.97:0.24):1;
      ctx.fillStyle=shade(base,faceShade(f.n));ctx.fill();
      ctx.globalAlpha=1;ctx.lineWidth=mag?2.4:1.4;ctx.strokeStyle=mag?'#8a1272':'#22315a';ctx.stroke();
    });
}
function rotate(dir){yaw=clamp(yaw+dir*0.2,-1.5,0.1);fit();draw();if(phase!=='demo'){T.explore++;first();log('rotate turntable ('+(dir<0?'left':'right')+')');renderMeters();}}

/* ---------- telemetry ---------- */
const T={scored:0,exact:0,rts:[],firsts:[],explores:[],errN:0,errS:0,errR:0,lastErr:'\u2014',
  itemStart:0,firstAt:0,explore:0,seq:[],startLevel:1,maxSolved:0};
let level=1,ans=0,cur=null,phase='demo',locked=false,scoredIdx=0;const SCORED_N=6,MAXLEVEL=9;
function first(){if(!T.firstAt){T.firstAt=Date.now()-T.itemStart;}}
function pct(){return T.scored?Math.round(100*T.exact/T.scored):0;}
function learnStr(){
  if(T.seq.length<1)return '\u2014';
  const gained=T.maxSolved-T.startLevel,rate=(gained/T.scored).toFixed(2);
  const traj=T.seq.map(s=>'L'+s.level+(s.ok?'\u2713':'\u2717'));
  const show=traj.length<=5?traj:[traj[0],'\u2026',last(traj)];
  return `${gained>=0?'+':''}${rate} lvl/trial  [${show.join(' ')}]`;
}
const METERS=[
 {id:'M-ACC',name:'Item accuracy (exact total)',get:()=>T.scored?`${T.exact}/${T.scored}  ${pct()}%`:'\u2014'},
 {id:'M-RT',name:'Response time — total',get:()=>T.rts.length?`${last(T.rts)} ms (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency (encoding)',get:()=>T.firsts.length?`${last(T.firsts)} ms (med ${mean(T.firsts)})`:'\u2014'},
 {id:'M-ERRTYPE',name:'Error type (visible-only/near/rand)',get:()=>`${T.lastErr}  ·  sys${T.errS} near${T.errN} rnd${T.errR}`},
 {id:'M-EXPLORE',name:'Turntable inspections before answer',get:()=>T.explores.length?`${last(T.explores)} (mean ${mean(T.explores)})`:`${T.explore}`},
 {id:'M-DIFFREACH',name:'Ceiling — max stack level solved',get:()=>`L${T.maxSolved} / at L${level}`},
 {id:'M-LEARNRATE',name:'Within-session learning rate',get:()=>learnStr()},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});renderDiff();}
function renderDiff(){let h='';for(let i=1;i<=MAXLEVEL;i++){let cls='seg';if(i<=T.maxSolved)cls+=' done';if(i===level)cls+=' cur';if(i===T.maxSolved&&T.maxSolved>0)cls+=' ceil';h+=`<div class="${cls}" title="level ${i}"></div>`;}$('#diffmeter').innerHTML=h;}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}

/* ---------- ghost ---------- */
const ghost=$('#ghost');
function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-9}px,${c.y-6}px)`;await sleep(520);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(430);}

/* ---------- item lifecycle ---------- */
function setCue(i){$('#phasecue').textContent=i;}
function setCount(v){ans=clamp(v,0,32);$('#count').textContent=ans;}
function loadItem(st){
  cur=st;stack=st;buildScene(st);xray=false;$('#xray').classList.remove('on');
  T.itemStart=Date.now();T.firstAt=0;T.explore=0;setCount(0);draw();
  $('#go').classList.toggle('ready',phase!=='demo');
  $('#xray').disabled=(phase==='scored'||phase==='done');
  renderMeters();
}
function classifyErr(a){
  if(a===cur.total)return null;
  if(a===cur.visible)return 'systematic:visible-only';
  if(Math.abs(a-cur.total)===1)return 'near-miss:off-by-one';
  return 'random';
}
function feedback(ok){$('#count').classList.remove('flash','shake');void $('#count').offsetWidth;$('#count').classList.add(ok?'flash':'shake');}
function submit(){
  if(locked||phase==='demo'||phase==='done')return;
  const rt=Date.now()-T.itemStart;first();
  const ok=ans===cur.total,err=classifyErr(ans);
  if(phase==='warmup'){
    feedback(ok);locked=true;$('#go').classList.remove('ready');
    log(`warm-up: answered ${ans} · true ${cur.total} (${cur.hidden} hidden) — ${ok?'right':'not yet'} · UNSCORED`);
    setTimeout(()=>{locked=false;scoredIdx=0;startScored();},1150);return;
  }
  T.scored++;T.rts.push(rt);T.firsts.push(T.firstAt);T.explores.push(T.explore);
  if(ok){T.exact++;T.maxSolved=Math.max(T.maxSolved,level);}
  else{if(err==='near-miss:off-by-one')T.errN++;else if(err&&err.indexOf('systematic')===0)T.errS++;else T.errR++;}
  T.lastErr=ok?'correct':err;
  T.seq.push({level,ok});
  feedback(ok);locked=true;$('#go').classList.remove('ready');
  log(`SCORED #${scoredIdx+1} L${level}: ans ${ans} · true ${cur.total} (vis ${cur.visible}, hidden ${cur.hidden}, bury ${cur.maxBury}) · ${ok?'EXACT':'ERR['+err+']'} · rot ${T.explore} · ${rt}ms`);
  const prev=level;level=ok?Math.min(level+1,MAXLEVEL):Math.max(level-1,1);
  if(ok)log(`escalate ${prev}\u2192${level}`);else log(`back off ${prev}\u2192${level}`);
  renderMeters();
  setTimeout(nextScored,1350);
}
function nextScored(){locked=false;scoredIdx++;if(scoredIdx<SCORED_N)startScored();else finish();}
function startWarmup(){phase='warmup';locked=false;setCue('\u2b50');level=1;loadItem(genStack(1));log('— warm-up (unscored): count ALL cubes, hidden ones too. X-ray allowed —');}
function startScored(){phase='scored';setCue('\ud83c\udfaf');loadItem(genStack(level));log(`— SCORED item ${scoredIdx+1}/${SCORED_N} · level ${level} (X-ray OFF) —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');locked=true;$('#go').classList.remove('ready');$('#xray').disabled=true;
  log(`— DONE · exact ${T.exact}/${T.scored} (${pct()}%) · ceiling L${T.maxSolved} · ${learnStr()} —`);renderMeters();}

async function runDemo(){
  phase='demo';setCue('\ud83d\udc41\ufe0f');locked=true;xray=false;
  const H=[[2,2],[2,3]];const st=Object.assign({H,R:2,C:2,level:1},analyze(H,2,2));
  loadItem(st);log('ghost-hand demo (wordless, <10s): hidden cubes count too');
  ghostShow(true);await sleep(300);
  await ghostTo($('#rl'));await ghostTap();rotate(-1);await sleep(180);
  await ghostTo($('#xray'));await ghostTap();xray=true;$('#xray').classList.add('on');draw();
  log('X-ray ON → 1 hidden cube revealed (magenta)');await sleep(750);
  for(let i=0;i<st.visible;i++){setCount(ans+1);await sleep(70);}
  await sleep(200);await ghostTo($('#plus'));await ghostTap();setCount(st.total);
  log('count the hidden cube too \u2192 '+st.total);await sleep(500);
  await ghostTo($('#go'));await ghostTap();await sleep(250);
  ghostShow(false);xray=false;$('#xray').classList.remove('on');draw();await sleep(350);
  startWarmup();
}

/* ---------- input ---------- */
$('#rl').onclick=()=>rotate(-1);
$('#rr').onclick=()=>rotate(1);
$('#xray').onclick=()=>{if($('#xray').disabled)return;xray=!xray;$('#xray').classList.toggle('on',xray);first();if(phase!=='demo'){T.explore++;log('x-ray '+(xray?'ON':'off'));renderMeters();}draw();};
$('#minus').onclick=()=>{if(phase==='demo'||phase==='done'||locked)return;first();setCount(ans-1);log('count \u2212 \u2192 '+ans);};
$('#plus').onclick=()=>{if(phase==='demo'||phase==='done'||locked)return;first();setCount(ans+1);log('count + \u2192 '+ans);};
$('#go').onclick=()=>{if($('#go').classList.contains('ready'))submit();};
$('#replay').onclick=()=>{if(phase!=='demo')runDemo();};
window.addEventListener('keydown',e=>{
  if(phase==='demo'||phase==='done')return;
  if(e.key==='ArrowLeft'){rotate(-1);e.preventDefault();}
  else if(e.key==='ArrowRight'){rotate(1);e.preventDefault();}
  else if(e.key==='ArrowUp'||e.key==='+'){if(!locked){first();setCount(ans+1);log('count + \u2192 '+ans);}e.preventDefault();}
  else if(e.key==='ArrowDown'||e.key==='-'){if(!locked){first();setCount(ans-1);log('count \u2212 \u2192 '+ans);}e.preventDefault();}
  else if(e.key==='x'||e.key==='X'){$('#xray').onclick();}
  else if(e.key==='Enter'){if($('#go').classList.contains('ready'))submit();e.preventDefault();}
});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
