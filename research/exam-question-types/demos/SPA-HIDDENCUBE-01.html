<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPA-HIDDENCUBE-01 — X-Ray Cubes</title>
<style>
  :root{--bg:#0f1420;--panel:#182234;--ink:#eaf0fb;--mut:#9fb0cc;--good:#37d67a;--bad:#ff6b6b;--accent:#ffd166;--line:#2a3852}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .stage{flex:1;padding:20px;max-width:760px}
  .side{width:320px;background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
  .banner{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .phase{color:var(--accent);font-weight:700;letter-spacing:.4px;text-transform:uppercase;font-size:12px}
  .ask{font-size:18px;margin-top:4px}
  .scene{display:flex;flex-direction:column;align-items:center}
  canvas{background:#0c1424;border:1px solid var(--line);border-radius:12px}
  .controls{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .stepper{display:flex;align-items:center;gap:10px;background:#111a2b;border:1px solid var(--line);border-radius:12px;padding:6px}
  .stepper button{width:44px;height:44px;font-size:24px;border:0;border-radius:8px;background:#22304a;color:var(--ink);cursor:pointer}
  .count{font-size:30px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums;color:var(--accent)}
  button.act{background:var(--accent);color:#20160a;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer}
  button.ghost{background:#22304a;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
  button.ghost:disabled{opacity:.3;cursor:not-allowed}
  .tele h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dotted #24344e}
  .kv span:last-child{color:var(--accent);font-variant-numeric:tabular-nums;text-align:right;max-width:180px}
  .log{font:12px/1.4 ui-monospace,Menlo,monospace;color:#bcd;background:#0c1424;border:1px solid var(--line);border-radius:8px;padding:8px;height:120px;overflow:auto;white-space:pre-wrap}
  .fb{font-weight:700;margin-top:8px;min-height:22px;text-align:center}
  .hint{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="stage">
  <h1>X-Ray Cubes <span class="hint">· SPA-HIDDENCUBE-01</span></h1>
  <div class="sub">How many blocks in total — including the ones hidden behind and underneath?</div>
  <div class="banner">
    <div class="phase" id="phase">Demo</div>
    <div class="ask" id="ask">Watch: hidden blocks count too.</div>
  </div>
  <div class="scene">
    <canvas id="cv" width="440" height="300"></canvas>
    <div class="controls">
      <button class="ghost" id="rotBtn">⟲ Turn to inspect</button>
      <button class="ghost" id="xrayBtn">🔦 X-ray (practice only)</button>
      <div class="stepper">
        <button id="minus">−</button>
        <div class="count" id="count">1</div>
        <button id="plus">+</button>
      </div>
      <button class="act" id="doneBtn">Done</button>
      <button class="ghost" id="nextBtn" style="display:none">Next ▶</button>
    </div>
    <div class="fb" id="fb"></div>
  </div>
</div>
<div class="side tele">
  <h2>Live telemetry</h2>
  <div class="kv"><span>Phase</span><span id="t_phase">demo</span></div>
  <div class="kv"><span>M-ACC (last)</span><span id="t_acc">–</span></div>
  <div class="kv"><span>M-RT (ms)</span><span id="t_rt">–</span></div>
  <div class="kv"><span>M-RTFIRST (ms)</span><span id="t_rtf">–</span></div>
  <div class="kv"><span>M-ERRTYPE</span><span id="t_err">–</span></div>
  <div class="kv"><span>M-EXPLORE (turns)</span><span id="t_exp">0</span></div>
  <div class="kv"><span>M-DIFFREACH (max hidden solved)</span><span id="t_reach">0</span></div>
  <h2>Log</h2>
  <div class="log" id="log"></div>
</div>
<script>
const $=id=>document.getElementById(id);
// heightmaps: rows[0]=back ... last row=front. value = column height.
const LEVELS=[
  {mode:"demo",   grid:[[1,1],[2,1]]},
  {mode:"warmup", grid:[[1,1],[2,2]]},
  {mode:"scored", grid:[[1,2],[2,2]]},
  {mode:"scored", grid:[[2,1,1],[2,2,1],[3,2,2]]}
];
let li=0,cur,val=1,startT=0,firstT=0,turns=0,mirror=false,xray=false,bestHidden=0;

function total(g){let s=0;g.forEach(r=>r.forEach(h=>s+=h));return s;}
function hiddenSet(g){ // cube (r,c,k) hidden if the column in front (r+1,c) is >= k+2
  const H=new Set();
  for(let r=0;r<g.length-1;r++)for(let c=0;c<g[r].length;c++){
    const front=g[r+1][c];
    for(let k=0;k<g[r][c];k++) if(front>=k+2) H.add(r+"_"+c+"_"+k);
  }
  return H;
}
function draw(){
  const ctx=$("cv").getContext("2d");ctx.clearRect(0,0,440,300);
  const g=cur.grid,R=g.length, C=g[0].length;
  const tw=42, th=22, ch=34, ox=220, oy=110;
  const H=hiddenSet(g);
  const cubes=[];
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(let k=0;k<g[r][c];k++){
    const cc = mirror? (C-1-c):c;
    const sx=ox+(cc-r)*tw, sy=oy+(cc+r)*th - k*ch;
    cubes.push({sx,sy,depth:(r+c)*10+k,hidden:H.has(r+"_"+c+"_"+k)});
  }
  cubes.sort((a,b)=>a.depth-b.depth);
  cubes.forEach(o=>drawCube(ctx,o.sx,o.sy,tw,th,ch,o.hidden));
}
function drawCube(ctx,x,y,tw,th,ch,hidden){
  const showHidden = xray && hidden;
  // top
  ctx.beginPath();ctx.moveTo(x,y-th);ctx.lineTo(x+tw,y);ctx.lineTo(x,y+th);ctx.lineTo(x-tw,y);ctx.closePath();
  ctx.fillStyle=showHidden?"rgba(255,107,107,.5)":"#c8d6ef";ctx.fill();ctx.strokeStyle="#0f1420";ctx.lineWidth=1.5;ctx.stroke();
  // left
  ctx.beginPath();ctx.moveTo(x-tw,y);ctx.lineTo(x,y+th);ctx.lineTo(x,y+th+ch);ctx.lineTo(x-tw,y+ch);ctx.closePath();
  ctx.fillStyle=showHidden?"rgba(255,107,107,.35)":"#8ea3c9";ctx.fill();ctx.stroke();
  // right
  ctx.beginPath();ctx.moveTo(x+tw,y);ctx.lineTo(x,y+th);ctx.lineTo(x,y+th+ch);ctx.lineTo(x+tw,y+ch);ctx.closePath();
  ctx.fillStyle=showHidden?"rgba(255,107,107,.25)":"#6b80a8";ctx.fill();ctx.stroke();
  if(showHidden){ctx.fillStyle="#fff";ctx.font="12px system-ui";ctx.fillText("?",x-3,y+6);}
}
function render(){
  cur=LEVELS[li];val=1;startT=performance.now();firstT=0;turns=0;mirror=false;xray=false;
  $("phase").textContent=cur.mode==="demo"?"Demo":cur.mode==="warmup"?"Warm-up (not scored)":"Scored item";
  $("t_phase").textContent=cur.mode;
  $("ask").textContent=cur.mode==="demo"?"Watch: the hidden block lights up — it counts too.":"How many blocks in total?";
  $("count").textContent=val;$("t_exp").textContent="0";$("fb").textContent="";
  ["t_acc","t_rt","t_rtf","t_err"].forEach(k=>$(k).textContent="–");
  $("nextBtn").style.display="none";$("doneBtn").style.display="";
  // X-ray allowed only in demo/warmup
  $("xrayBtn").disabled = (cur.mode==="scored");
  draw();
  if(cur.mode==="demo"){$("doneBtn").style.display="none";setTimeout(runGhost,700);}
}
function firstMove(){if(!firstT){firstT=Math.round(performance.now()-startT);$("t_rtf").textContent=firstT;}}
$("plus").onclick=()=>{if(cur.mode==="demo")return;firstMove();val=Math.min(40,val+1);$("count").textContent=val;};
$("minus").onclick=()=>{if(cur.mode==="demo")return;firstMove();val=Math.max(1,val-1);$("count").textContent=val;};
$("rotBtn").onclick=()=>{if(cur.mode==="demo")return;turns++;mirror=!mirror;$("t_exp").textContent=turns;draw();log("turn "+turns+" (inspect)");};
$("xrayBtn").onclick=()=>{if($("xrayBtn").disabled)return;xray=!xray;draw();log("x-ray "+(xray?"ON":"off"));};
function log(s){$("log").textContent+=s+"\n";$("log").scrollTop=1e9;}
$("doneBtn").onclick=()=>{
  const tot=total(cur.grid),H=hiddenSet(cur.grid).size,vis=tot-H;
  const correct=val===tot;
  let err="none";
  if(!correct){ if(val===vis)err="visible-only undercount (ignored hidden)";
    else if(Math.abs(val-tot)===1)err="off-by-one (near-miss)"; else err="other/random"; }
  const rt=Math.round(performance.now()-startT);
  if(cur.mode!=="demo"){
    $("t_acc").textContent=correct?"1 ✓":"0 ✗";
    $("t_rt").textContent=rt;$("t_err").textContent=err;
    if(correct&&cur.mode==="scored"){bestHidden=Math.max(bestHidden,H);$("t_reach").textContent=bestHidden;}
  }
  xray=true;draw(); // reveal on submit
  $("fb").textContent = correct?`Correct — ${tot} blocks (${H} hidden). 🎉`:`It's ${tot}: ${vis} you can see + ${H} hidden.`;
  $("fb").style.color=correct?"var(--good)":"var(--bad)";
  log(`ANSWER ${val} | total ${tot} (vis ${vis}+hid ${H}) | ${correct?"✓":"✗"} | ${err}`);
  $("doneBtn").style.display="none";$("nextBtn").style.display= li<LEVELS.length-1?"":"none";
};
$("nextBtn").onclick=()=>{if(li<LEVELS.length-1){li++;render();}};
function runGhost(){
  let on=false;const t=setInterval(()=>{xray=!xray;on=xray;draw();},600);
  setTimeout(()=>{clearInterval(t);xray=true;draw();
    $("ask").textContent="The glowing block was hidden — it still counts. Now you try.";
    $("nextBtn").style.display="";},2600);
}
render();
</script>
</body>
</html>
