<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-MORPHMAKE-01 · Same-Change Machine</title>
<style>
  :root{
    --bg1:#eef4ff; --bg2:#f7ecff; --ink:#26304a; --card:#ffffff;
    --accent:#5b6cff; --good:#22b573; --bad:#ff6b6b;
    --tel-bg:#11162a; --tel-ink:#c8d6ff; --tel-key:#7fffcf; --tel-dim:#7183b8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:26px;padding:20px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:14px;max-width:600px;width:100%}
  .analogy{display:flex;align-items:center;gap:12px;justify-content:center}
  .fig{width:88px;height:88px;border-radius:16px;background:#f5f8ff;border:2px solid #e2e8fb;display:flex;align-items:center;justify-content:center}
  .fig.d{border:3px solid var(--accent);background:#fff}
  .fig.hit{border-color:var(--good);box-shadow:0 0 0 4px #b4ecd0}
  .fig.miss{border-color:var(--bad);box-shadow:0 0 0 4px #ffd0d0}
  .arrow{font-size:26px;color:#9aa6d6}
  .arrow.morph{animation:glow 1.4s infinite}
  @keyframes glow{0%,100%{color:#9aa6d6;transform:scale(1)}50%{color:var(--accent);transform:scale(1.18)}}
  .qmark{font-size:34px;color:#b9c2e6;font-weight:700}
  .divider{width:90%;height:1px;background:#eceffb;margin:2px 0}
  #palette{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .tool{min-width:72px;height:64px;border-radius:14px;border:3px solid #e2e8fb;background:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.12s;-webkit-tap-highlight-color:transparent;padding:0 8px}
  .tool:hover{transform:translateY(-3px);border-color:#c3ccf5}
  .tool:active{transform:scale(.94)}
  .tool .ic{font-size:24px;line-height:1}
  .tool .tl{font-size:10px;color:#8791b5;letter-spacing:.04em}
  .tool.undo{border-color:#ffe0c2;background:#fff8f0}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:72px;height:72px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:50px;height:50px;background:#eef1ff;color:#5b6cff;font-size:22px}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .58s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}
  @keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff;word-break:break-word}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:190px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}
  #log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-MORPHMAKE-01 · Same-Change Machine</div>
    <div id="phasecue">&#128065;&#65039;</div>
    <div id="stagecard">
      <div class="analogy">
        <div class="fig" id="figA"></div>
        <div class="arrow morph">&#8594;</div>
        <div class="fig" id="figB"></div>
      </div>
      <div class="divider"></div>
      <div class="analogy">
        <div class="fig" id="figC"></div>
        <div class="arrow">&#8594;</div>
        <div class="fig d" id="figD"></div>
      </div>
      <div id="palette"></div>
      <div id="controls">
        <button id="replay" title="replay demo">&#8635;</button>
        <button id="go" title="submit">&#10003;</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">&#128072;<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function choice(a){return a[(Math.random()*a.length)|0];}
const clamp=(x,lo,hi)=>Math.max(lo,Math.min(hi,x));

const PAL={red:'#e6194b',green:'#2ca25f',blue:'#4363d8',orange:'#f58231',purple:'#911eb4'};
const COLORKEYS=Object.keys(PAL);
const SIZES=[0.58,0.85,1.12];
function polyPts(cx,cy,r,n,rot){let p=[];for(let i=0;i<n;i++){let a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function baseShape(shape,color,cx,cy,r){const f='fill="'+color+'"';
  switch(shape){
    case 'circle':return `<circle cx="${cx}" cy="${cy}" r="${r}" ${f}/>`;
    case 'square':return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="3" ${f}/>`;
    case 'triangle':return `<polygon points="${polyPts(cx,cy,r,3,-Math.PI/2)}" ${f}/>`;
  } return '';}
function arrowSVG(cx,cy,r,color,rotDeg){const w=r*0.55;
  const d=`M ${cx} ${cy-r} L ${cx+w} ${cy} L ${cx+w*0.5} ${cy} L ${cx+w*0.5} ${cy+r} L ${cx-w*0.5} ${cy+r} L ${cx-w*0.5} ${cy} L ${cx-w} ${cy} Z`;
  return `<path d="${d}" fill="${color}" transform="rotate(${rotDeg} ${cx} ${cy})"/>`;}
function figSVG(st,box=72){const color=PAL[st.color]||st.color;const s=SIZES[st.sizeIdx];let inner='';
  if(st.shape==='arrow'){inner=arrowSVG(box/2,box/2,box*0.34*s,color,st.rotIdx*90);}
  else{const n=st.countIdx+1;
    if(n===1)inner=baseShape(st.shape,color,box/2,box/2,box*0.30*s);
    else{const pos=n===2?[[.32,.5],[.68,.5]]:[[.25,.5],[.5,.5],[.75,.5]];
      const r=box*0.13*s;pos.slice(0,n).forEach(p=>inner+=baseShape(st.shape,color,p[0]*box,p[1]*box,r));}}
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${inner}</svg>`;}

const TOOLS={shrink:{ic:'\u2199',tl:'smaller'},grow:{ic:'\u2197',tl:'bigger'},rotate:{ic:'\u21bb',tl:'turn'},plus:{ic:'\u2295',tl:'+ dot'},minus:{ic:'\u2296',tl:'- dot'}};
function applyBtn(st,btn){const n={...st};
  if(btn==='shrink')n.sizeIdx=clamp(n.sizeIdx-1,0,2);
  else if(btn==='grow')n.sizeIdx=clamp(n.sizeIdx+1,0,2);
  else if(btn==='rotate')n.rotIdx=(n.rotIdx+1)%4;
  else if(btn==='plus')n.countIdx=clamp(n.countIdx+1,0,2);
  else if(btn==='minus')n.countIdx=clamp(n.countIdx-1,0,2);
  return n;}
function applyDeltas(st,d){return {...st,sizeIdx:clamp(st.sizeIdx+(d.size||0),0,2),rotIdx:((st.rotIdx+(d.rotation||0))%4+4)%4,countIdx:clamp(st.countIdx+(d.count||0),0,2)};}
function neededButtons(item){const b=[];const d=item.deltas;
  if(d.size<0)for(let i=0;i<-d.size;i++)b.push('shrink');if(d.size>0)for(let i=0;i<d.size;i++)b.push('grow');
  if(d.count<0)for(let i=0;i<-d.count;i++)b.push('minus');if(d.count>0)for(let i=0;i<d.count;i++)b.push('plus');
  if(d.rotation)for(let i=0;i<d.rotation;i++)b.push('rotate');
  return b;}

function genItem(nT,forceSizeShrink){
  let attrs, shapeA, shapeC, colA, colC, palette;
  const cols=shuffle(COLORKEYS);
  const A={shape:'circle',color:cols[0],sizeIdx:1,rotIdx:0,countIdx:0};
  const C={shape:'square',color:cols[1],sizeIdx:1,rotIdx:0,countIdx:0};
  const deltas={size:0,rotation:0,count:0};
  function linStep(){const delta=Math.random()<.5?1:-1;const lo=delta>0?0:1,hi=delta>0?1:2;
    return {delta,a:lo+((Math.random()*(hi-lo+1))|0),c:lo+((Math.random()*(hi-lo+1))|0)};}
  if(nT===2){
    attrs=['size','rotation'];A.shape=C.shape='arrow';
    const s=linStep();deltas.size=s.delta;A.sizeIdx=s.a;C.sizeIdx=s.c;
    deltas.rotation=choice([1,2]);A.rotIdx=0;C.rotIdx=choice([0,1,2,3]);
    palette=['shrink','grow','rotate'];
  } else {
    const attr=forceSizeShrink?'size':choice(['size','count','rotation']);attrs=[attr];
    if(attr==='rotation'){A.shape=C.shape='arrow';deltas.rotation=choice([1,2]);A.rotIdx=0;C.rotIdx=choice([0,1,2,3]);palette=['shrink','grow','rotate'];}
    else{const two=shuffle(['circle','square','triangle']);A.shape=two[0];C.shape=two[1];palette=['shrink','grow','plus','minus'];
      if(attr==='size'){const s=forceSizeShrink?{delta:-1,a:2,c:2}:linStep();deltas.size=s.delta;A.sizeIdx=s.a;C.sizeIdx=s.c;}
      else{const s=linStep();deltas.count=s.delta;A.countIdx=s.a;C.countIdx=s.c;}}
  }
  const B=applyDeltas(A,deltas),expectedD=applyDeltas(C,deltas);
  return {nT,attrs,A,B,C,deltas,expectedD,palette};}

const T={scored:0,correct:0,firstLat:null,path:[],rev:0,polyLast:'\u2014',ruleLast:'\u2014',lastErr:'\u2014',itemStart:0,firstActed:false};
const METERS=[
 {id:'M-ACC',name:'Item accuracy (D exactly right)',get:()=>T.scored?`${T.correct}/${T.scored}  ${Math.round(100*T.correct/T.scored)}%`:'\u2014'},
 {id:'M-POLY',name:'Partial-credit (transforms right)',get:()=>T.polyLast},
 {id:'M-PATH',name:'Transforms applied (in order)',get:()=>T.path.length?T.path.join(','):'\u2014'},
 {id:'M-REV',name:'Revisions / undos',get:()=>T.rev+''},
 {id:'M-RTFIRST',name:'First-action latency (map before act)',get:()=>T.firstLat==null?'\u2014':T.firstLat+' ms'},
 {id:'M-ERRTYPE',name:'Error type (transform failure)',get:()=>T.lastErr},
 {id:'M-RULEID',name:'Rule dimensionality solved',get:()=>T.ruleLast},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>
  `<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');
  d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}

const ghost=$('#ghost');
function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(580);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(470);}

let phase='demo',cur=null,Dstate=null,hist=[],locked=true,scoredIndex=0;
const scoredItems=[genItem(1),genItem(2)];
function setCue(i){$('#phasecue').innerHTML=i;}
function renderFigs(){$('#figA').innerHTML=figSVG(cur.A);$('#figB').innerHTML=figSVG(cur.B);
  $('#figC').innerHTML=figSVG(cur.C);$('#figD').innerHTML=figSVG(Dstate);}
function renderPalette(){const el=$('#palette');el.innerHTML='';
  cur.palette.forEach(b=>{const t=document.createElement('div');t.className='tool';t.dataset.btn=b;
    t.innerHTML=`<span class="ic">${TOOLS[b].ic}</span><span class="tl">${TOOLS[b].tl}</span>`;el.appendChild(t);});
  const u=document.createElement('div');u.className='tool undo';u.dataset.btn='undo';
  u.innerHTML='<span class="ic">\u238c</span><span class="tl">undo</span>';el.appendChild(u);}
function renderItem(item){cur=item;Dstate={...item.C};hist=[];
  $('#figD').className='fig d';renderFigs();renderPalette();$('#go').classList.remove('ready');
  T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;T.path=[];T.rev=0;T.polyLast='\u2014';T.ruleLast='\u2014';T.lastErr='\u2014';renderMeters();}
function firstAct(){if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first action');}}
function tool(btn){if(locked)return;
  if(btn==='undo'){if(hist.length){Dstate=hist.pop();T.rev++;T.path.push('undo');log('undo');renderFigs();renderMeters();}return;}
  firstAct();hist.push({...Dstate});Dstate=applyBtn(Dstate,btn);T.path.push(btn);log('applied '+btn);
  $('#go').classList.add('ready');renderFigs();renderMeters();}
function score(){const keyOf={size:'sizeIdx',rotation:'rotIdx',count:'countIdx'};
  const req=cur.attrs.map(a=>keyOf[a]);const allK=['sizeIdx','rotIdx','countIdx'];
  const correctReq=req.filter(k=>Dstate[k]===cur.expectedD[k]).length;
  const extra=allK.filter(k=>!req.includes(k)).filter(k=>Dstate[k]!==cur.C[k]).length;
  const exact=allK.every(k=>Dstate[k]===cur.expectedD[k]);
  let err='none';
  if(!exact){if(extra>0)err='over-application';else{const k=req.find(k=>Dstate[k]!==cur.expectedD[k]);err=(Dstate[k]===cur.C[k])?'missed transform':'wrong magnitude';}}
  return {correctReq,reqN:req.length,extra,exact,err};}
function submit(){const s=score();T.polyLast=s.correctReq+' / '+s.reqN+' transforms'+(s.extra?' (+'+s.extra+' extra)':'');
  T.ruleLast=s.correctReq+' / '+s.reqN+' rules';T.lastErr=s.err;
  $('#figD').classList.add(s.exact?'hit':'miss');
  if(phase==='warmup'){log('warm-up '+(s.exact?'correct':'not quite')+' — UNSCORED');if(!s.exact)$('#figD').innerHTML=figSVG(cur.expectedD);locked=true;$('#go').classList.remove('ready');setTimeout(nextPhase,1100);return;}
  T.scored++;if(s.exact)T.correct++;else{$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),450);$('#figD').innerHTML=figSVG(cur.expectedD);}
  locked=true;$('#go').classList.remove('ready');
  log(`SUBMIT item ${scoredIndex+1} · ${cur.nT} transform(s) [${cur.attrs.join('+')}] \u2192 ${s.exact?'CORRECT':'wrong ['+s.err+']'} · POLY ${s.correctReq}/${s.reqN}`);
  renderMeters();setTimeout(nextPhase,1300);}
function nextPhase(){if(phase==='warmup'){scoredIndex=0;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<scoredItems.length?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('&#11088;');locked=false;renderItem(genItem(1,true));log('— warm-up (unscored): make C change the same way A did —');}
function startScored(){phase='scored';setCue('&#127919;');locked=false;renderItem(scoredItems[scoredIndex]);
  log(`— SCORED item ${scoredIndex+1}: apply the A\u2192B change to C (${cur.nT} transform) —`);}
function finish(){phase='done';setCue('&#127942;');locked=true;log(`— DONE · accuracy ${T.correct}/${T.scored} —`);}
async function runDemo(){phase='demo';setCue('&#128065;&#65039;');locked=true;
  const d=genItem(1,true);renderItem(d);log('ghost-hand demo (wordless, <10s): same change, on C');
  ghostShow(true);await sleep(400);
  await ghostTo($('#figA'));await ghostTo($('#figB'));await sleep(200);
  await ghostTo($('#figC'));await sleep(150);locked=false;
  for(const b of neededButtons(d)){const el=$$('#palette .tool').find(t=>t.dataset.btn===b);await ghostTo(el);await ghostTap();tool(b);await sleep(160);}
  await sleep(250);await ghostTo($('#go'));await ghostTap();$('#figD').classList.add('hit');
  await sleep(600);ghostShow(false);locked=true;await sleep(400);startWarmup();}

$('#palette').addEventListener('click',e=>{const t=e.target.closest('.tool');if(t)tool(t.dataset.btn);});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
