<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-NUMQUEST-01 · Number Quest</title>
<style>
  :root{--bg1:#fff6e9;--bg2:#eafaf0;--ink:#26304a;--card:#fff;--accent:#f59e0b;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:14px;width:440px;max-width:100%}
  #track{width:100%;height:32px;background:#eef3ff;border-radius:16px;position:relative;overflow:hidden}
  #hero{position:absolute;top:2px;left:0;font-size:26px;transition:left .4s}
  #flag{position:absolute;top:4px;right:6px;font-size:22px}
  #instr{font-size:14px;color:#666;min-height:20px;text-align:center}
  #dots{display:flex;gap:16px}
  .herd{width:150px;height:130px;background:#f5f8ff;border:3px solid #e2e8fb;border-radius:14px;cursor:pointer;position:relative;transition:.1s}
  .herd:hover{border-color:var(--accent)}
  .herd.pick{border-color:var(--good);box-shadow:0 0 0 4px #b4ecd0}
  .herd.no{border-color:var(--bad)}
  .dot{position:absolute;border-radius:50%;background:#4363d8}
  #build{display:none;flex-direction:column;align-items:center;gap:10px}
  #target{font-size:40px;font-weight:800;color:var(--accent);cursor:pointer}
  #bins{display:flex;gap:24px}
  .bin{width:120px;min-height:120px;background:#f5f8ff;border:3px dashed #cdd7f5;border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .bin h4{margin:0;font-size:12px;color:#889}
  .blocks{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
  .ten{width:16px;height:44px;background:#2f6bd8;border-radius:3px;cursor:pointer}
  .one{width:16px;height:16px;background:#f0a020;border-radius:3px;cursor:pointer}
  .add{margin-top:6px;padding:6px 12px;border-radius:10px;background:#e7edff;font-size:13px;cursor:pointer;border:2px solid #cdd7f5}
  #cur{font-size:20px;font-weight:700}
  #controls{display:flex;gap:14px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #replay{width:44px;height:44px;background:#eef1ff;color:#5b6cff;font-size:20px}
  #ghost{position:fixed;left:0;top:0;font-size:36px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .5s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:180px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-NUMQUEST-01 · Number Quest</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="track"><div id="hero">🏇</div><div id="flag">🏁</div></div>
      <div id="instr"></div>
      <div id="dots"><div class="herd" data-s="L"></div><div class="herd" data-s="R"></div></div>
      <div id="build">
        <div id="target" title="tap to hear">23 🔊</div>
        <div id="bins">
          <div class="bin"><h4>TENS (10)</h4><div class="blocks" id="tenB"></div><div class="add" data-b="ten">+ ten</div></div>
          <div class="bin"><h4>ONES (1)</h4><div class="blocks" id="oneB"></div><div class="add" data-b="one">+ one</div></div>
        </div>
        <div id="cur">built: 0</div>
      </div>
      <div id="controls"><button id="replay" title="replay demo">↻</button></div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
function say(txt){try{const u=new SpeechSynthesisUtterance(txt);u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

const T={rt:[],correct:0,total:0,minRatio:1,firstLat:null,firstActed:false,errType:'—',pae:'—',eff:'—',progress:0,scored:0};
const METERS=[
 {id:'M-ACC',name:'Accuracy',get:()=>T.total?`${T.correct}/${T.total}`:'—'},
 {id:'M-RT',name:'Response time (mean)',get:()=>mean(T.rt)==null?'—':mean(T.rt)+' ms'},
 {id:'M-WEBER',name:'ANS acuity (min ratio)',get:()=>T.minRatio<1?T.minRatio.toFixed(2)+' (w≈'+(1-T.minRatio).toFixed(2)+')':'—'},
 {id:'M-PAE',name:'Build placement error',get:()=>T.pae},
 {id:'M-EFF',name:'Build blocks vs minimal',get:()=>T.eff},
 {id:'M-ERRTYPE',name:'Error type',get:()=>T.errType},
 {id:'M-RTFIRST',name:'First-action latency',get:()=>T.firstLat==null?'—':T.firstLat+' ms'},
 {id:'M-SPEEDACC',name:'Speed×accuracy (correct only)',get:()=>{const c=T.rt;return c.length?Math.round(100*T.correct/T.total)+'% @ '+mean(c)+'ms':'—'}},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const d=document.createElement('div');d.innerHTML=`<span class="t">•</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(520)}

let phase='demo',cur=null;const setCue=i=>$('#phasecue').textContent=i;
function advance(){T.progress=Math.min(100,T.progress+18);$('#hero').style.left=`calc(${T.progress}% - ${T.progress*0.26}px)`}
function drawHerd(el,n){el.innerHTML='';for(let i=0;i<n;i++){const d=document.createElement('div');d.className='dot';
  const r=8+Math.random()*6;d.style.width=d.style.height=r+'px';d.style.left=(6+Math.random()*(150-16-r))+'px';d.style.top=(6+Math.random()*(130-16-r))+'px';el.appendChild(d)}}
function showDots(){$('#dots').style.display='flex';$('#build').style.display='none'}
function showBuild(){$('#dots').style.display='none';$('#build').style.display='flex'}
// ---- dot comparison ----
let t0=0;
function newCompare(ratio){showDots();const big=Math.round(8+Math.random()*6);const small=Math.max(3,Math.round(big*ratio));
  const leftBig=Math.random()<.5;const L=leftBig?big:small,R=leftBig?small:big;
  cur={type:'cmp',more:leftBig?'L':'R',ratio,L,R};drawHerd($('.herd[data-s="L"]'),L);drawHerd($('.herd[data-s="R"]'),R);
  $$('.herd').forEach(h=>h.classList.remove('pick','no'));t0=performance.now();T.firstActed=false;renderMeters()}
function pickHerd(side){if(cur.type!=='cmp'||phase==='demo'||phase==='done')return;const rt=Math.round(performance.now()-t0);
  if(!T.firstActed){T.firstActed=true;T.firstLat=rt}
  const ok=side===cur.more;T.total++;T.rt.push(rt);const el=$(`.herd[data-s="${side}"]`);
  if(ok){T.correct++;el.classList.add('pick');if(cur.ratio<T.minRatio)T.minRatio=cur.ratio;T.errType='none';advance();log(`compare ${cur.L} vs ${cur.R}: ✓ (ratio ${cur.ratio.toFixed(2)}) rt ${rt}`)}
  else{el.classList.add('no');T.errType='magnitude miss';log(`compare ${cur.L} vs ${cur.R}: ✗ rt ${rt}`)}
  renderMeters();nextAfter()}
// ---- build a number ----
let tens=0,ones=0,target=0;
function newBuild(tv){showBuild();target=tv;tens=0;ones=0;$('#target').textContent=tv+' 🔊';renderBuild();cur={type:'build'};t0=performance.now();T.firstActed=false;say(String(tv));log('build target '+tv)}
function renderBuild(){$('#tenB').innerHTML='<div class="ten"></div>'.repeat(tens);$('#oneB').innerHTML='<div class="one"></div>'.repeat(ones);
  const v=tens*10+ones;$('#cur').textContent='built: '+v;
  if(cur&&cur.type==='build'&&v===target)buildDone()}
function addBlock(b){if(cur.type!=='build'||phase==='done')return;if(!T.firstActed){T.firstActed=true;T.firstLat=Math.round(performance.now()-t0)}
  if(b==='ten')tens++;else ones++;renderBuild()}
function buildDone(){const rt=Math.round(performance.now()-t0);T.rt.push(rt);T.total++;
  const used=tens+ones;const optTen=Math.floor(target/10),optOne=target%10;const opt=optTen+optOne;
  T.eff=`${opt}/${used}`;T.pae='0% (exact)';
  if(tens===optTen&&ones===optOne){T.correct++;T.errType='none';log(`built ${target} exactly · ${tens} tens ${ones} ones · optimal`)}
  else{T.correct++;T.errType=(tens!==optTen?'place-value (tens)':'ones');log(`built ${target} (value ok, grouping ${tens}t ${ones}o)`) }
  advance();renderMeters();setTimeout(finish,900)}
function nextAfter(){setTimeout(()=>{
  if(phase==='warmup'){startScored();return}
  if(phase==='scored'){T._ci=(T._ci||0)+1;const seq=[0.75,0.83];if(T._ci<=seq.length)newCompare(seq[T._ci-1]);else newBuild(23)}
},760)}
function startWarmup(){phase='warmup';setCue('⭐');$('#instr').textContent='Tap the box with MORE dots';log('— warm-up (unscored): easy compare —');newCompare(0.5)}
function startScored(){phase='scored';setCue('🎯');$('#instr').textContent='Tap MORE dots, then build the number';T._ci=0;log('— SCORED: adaptive compares + build-a-number —');newCompare(0.67)}
function finish(){phase='done';setCue('🏆');T.progress=100;$('#hero').style.left='calc(100% - 30px)';log(`— DONE · acc ${T.correct}/${T.total} · ANS min ratio ${T.minRatio.toFixed(2)} —`);renderMeters()}
async function runDemo(){phase='demo';setCue('👁️');$('#instr').textContent='';log('ghost-hand demo (wordless, <10s)');showDots();
  cur={type:'cmp',more:'R'};drawHerd($('.herd[data-s="L"]'),4);drawHerd($('.herd[data-s="R"]'),10);gShow(true);await sleep(500);
  await gTo($('.herd[data-s="R"]'));$('.herd[data-s="R"]').classList.add('pick');advance();await sleep(700);
  // show build quickly
  showBuild();target=13;tens=0;ones=0;$('#target').textContent='13 🔊';renderBuild();cur={type:'demo'};
  await gTo($('.add[data-b="ten"]'));tens=1;$('#tenB').innerHTML='<div class="ten"></div>';await sleep(300);
  for(let k=0;k<3;k++){await gTo($('.add[data-b="one"]'));ones=k+1;$('#oneB').innerHTML='<div class="one"></div>'.repeat(ones)}
  $('#cur').textContent='built: 13';await sleep(600);gShow(false);await sleep(400);startWarmup()}
$('#dots').addEventListener('click',e=>{const h=e.target.closest('.herd');if(h)pickHerd(h.dataset.s)});
$('#build').addEventListener('click',e=>{const a=e.target.closest('.add');if(a)addBlock(a.dataset.b);const t=e.target.closest('.ten');if(t&&tens>0){tens--;renderBuild()}const o=e.target.closest('.one');if(o&&ones>0){ones--;renderBuild()}});
$('#target').addEventListener('click',()=>say(String(target)));
$('#replay').addEventListener('click',()=>{if(phase==='done')runDemo()});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
