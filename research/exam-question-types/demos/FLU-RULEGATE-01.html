<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-RULEGATE-01 · Sorting Gate</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;--socket:#c9d3ef;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:640px;width:100%}
  #arena{display:flex;gap:14px;align-items:stretch;width:100%;justify-content:center;flex-wrap:wrap}
  .bin{flex:1;min-width:180px;min-height:170px;border-radius:16px;border:3px dashed #c3ccf5;padding:10px;background:#f6f8ff;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:.12s}
  .bin .arrow{font-size:24px;color:#8ea0d6;text-align:center}
  .bin .exs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .bin.hot{border-color:var(--accent);background:#eef1ff}
  .bin.good{border-color:var(--good);background:#eafaf1}
  .bin.bad{border-color:var(--bad);background:#fdeeee}
  #holder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:120px}
  .exs .ex{width:44px;height:44px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid #eef}
  .cell{background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;width:96px;height:96px;box-shadow:0 6px 16px -8px #6a74b0}
  #queuecount{font-size:12px;color:#8a93b5}
  #tools{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #hint{width:52px;height:52px;background:#fff7e0;color:#e0a300;font-size:24px}
  #go{width:72px;height:72px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:50px;height:50px;background:#eef1ff;color:#5b6cff;font-size:22px}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;transition:transform .7s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mid.prop{color:#ffd479}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:210px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-RULEGATE-01 · Sorting Gate</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="arena">
        <div class="bin" id="binL"><div class="arrow">◀</div><div class="exs"></div></div>
        <div id="holder"><div class="cell" id="curfig"></div><div id="queuecount"></div></div>
        <div class="bin" id="binR"><div class="arrow">▶</div><div class="exs"></div></div>
      </div>
      <div id="tools">
        <button id="replay" title="replay demo">↻</button>
        <button id="hint" title="hint">💡</button>
        <button id="go" title="finish round">✓</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const PAL={red:'#e6194b',green:'#2ca25f',blue:'#4363d8',orange:'#f58231',purple:'#911eb4'};
const COLORKEYS=Object.keys(PAL),SH=['circle','square','triangle','diamond','star','hexagon'];
function polyPts(cx,cy,r,n,rot){let p=[];for(let i=0;i<n;i++){let a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function starPts(cx,cy,r,n){let p=[];for(let i=0;i<2*n;i++){let rr=i%2?r*0.45:r;let a=-Math.PI/2+i*Math.PI/n;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(' ');}
function oneShape(shape,color,cx,cy,r,fill){const solid=fill!=='outline';const f=solid?`fill="${color}"`:`fill="none" stroke="${color}" stroke-width="4"`;switch(shape){
  case 'circle':return `<circle cx="${cx}" cy="${cy}" r="${r}" ${f}/>`;
  case 'square':return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="3" ${f}/>`;
  case 'triangle':return `<polygon points="${polyPts(cx,cy,r,3,-Math.PI/2)}" ${f}/>`;
  case 'diamond':return `<polygon points="${polyPts(cx,cy,r,4,-Math.PI/2)}" ${f}/>`;
  case 'hexagon':return `<polygon points="${polyPts(cx,cy,r,6,-Math.PI/2)}" ${f}/>`;
  case 'star':return `<polygon points="${starPts(cx,cy,r,5)}" ${f}/>`;}return '';}
function tileSVG(a,box=80){const color=PAL[a.color]||a.color,n=a.count||1,sc=a.size||1,fill=a.fill||'solid';let inner='';
  if(n===1)inner=oneShape(a.shape,color,box/2,box/2,box*0.30*sc,fill);
  else{const pos=n===2?[[.3,.5],[.7,.5]]:n===3?[[.24,.5],[.5,.5],[.76,.5]]:[[.3,.3],[.7,.3],[.3,.7],[.7,.7]];
    const r=box*(n>=4?.13:.15)*sc;pos.slice(0,n).forEach(p=>inner+=oneShape(a.shape,color,p[0]*box,p[1]*box,r,fill));}
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${inner}</svg>`;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeFig(){return{shape:SH[(Math.random()*SH.length)|0],color:COLORKEYS[(Math.random()*COLORKEYS.length)|0],count:1+((Math.random()*4)|0),size:Math.random()<.5?0.75:1,fill:Math.random()<.5?'outline':'solid'};}

/* ---------- hidden-rule rounds (AIG) ---------- */
const RULES={color:{lab:f=>f.color==='red'?'L':'R',desc:'red goes left'},
  count:{lab:f=>f.count>=3?'L':'R',desc:'many (3+) left, few right'},
  hole:{lab:f=>f.fill==='outline'?'L':'R',desc:'outline (hole) left, solid right'}};
function sampleSide(rule,s){for(let k=0;k<600;k++){const f=makeFig();if(rule.lab(f)===s)return f;}return makeFig();}
function genRound(key,qlen){const rule=RULES[key];const exsL=[],exsR=[];
  while(exsL.length<3)exsL.push(sampleSide(rule,'L'));while(exsR.length<3)exsR.push(sampleSide(rule,'R'));
  const labels=qlen===4?['L','L','R','R']:['L','L','L','R','R','R'];
  const queue=shuffle(labels).map(s=>sampleSide(rule,s));
  return {key,rule,exsL,exsR,queue};}

/* ---------- telemetry ---------- */
const T={placements:0,correct:0,rts:[],hints:0,explored:new Set(),seq:[],lastHyp:'\u2014',itemStart:0,figTime:0};
function progStr(){if(!T.seq.length)return '\u2014';const marks=T.seq.map(s=>s.correct?'\u2713':'\u2717').join('');const c=T.seq.filter(s=>s.correct).length;return `${marks}  ${Math.round(100*c/T.seq.length)}%`;}
function pathStr(){if(!T.seq.length)return '\u2014';return T.seq.map(s=>s.chosen+(s.correct?'\u2713':'\u2717')).join(' ');}
function computeHyp(seq){let k=null;for(let i=0;i+2<seq.length;i++){if(seq[i].correct&&seq[i+1].correct&&seq[i+2].correct){k=i+1;break;}}
  let p=0;for(let i=1;i<seq.length;i++){if(!seq[i].correct&&!seq[i-1].correct&&seq[i].chosen===seq[i-1].chosen)p++;}
  return `criterion ${k?('@trial '+k):'not reached'} · persev ${p}`;}
const METERS=[
 {id:'M-ACC',name:'Placement accuracy (all scored)',get:()=>T.placements?`${T.correct}/${T.placements}  ${Math.round(100*T.correct/T.placements)}%`:'\u2014'},
 {id:'M-RT',name:'Response time — per placement (mean)',get:()=>T.rts.length?`${mean(T.rts)} ms`:'\u2014'},
 {id:'M-PROG',name:'Rule-acquisition trajectory (this round)',get:()=>progStr()},
 {id:'M-PATH',name:'Placement path (bin + hit)',get:()=>pathStr()},
 {id:'M-HINT',name:'Scaffold / hint usage',get:()=>T.hints+''},
 {id:'M-EXPLORE',name:'Examples inspected',get:()=>T.explored.size+''},
 {id:'M-HYP',name:'Hypothesis-search efficiency',prop:true,get:()=>T.lastHyp},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid ${m.prop?'prop':''}">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}${m.prop?' · PROPOSED':''}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(680);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(480);}

/* ---------- flow ---------- */
let phase='demo',cur=null,qi=0,locked=false,scoredIndex=0,curFig=null;
const scoredRounds=['count','hole'];
function setCue(i){$('#phasecue').textContent=i;}
function renderRound(round){cur=round;qi=0;T.seq=[];T.itemStart=Date.now();
  const paint=(binSel,exs,side)=>{const box=$(binSel+' .exs');box.innerHTML='';exs.forEach((f,i)=>{const e=document.createElement('div');e.className='ex';e.dataset.id=side+i;e.innerHTML=tileSVG(f,42);box.appendChild(e);});};
  paint('#binL',round.exsL,'L');paint('#binR',round.exsR,'R');
  $('#go').classList.remove('ready');showNext();renderMeters();}
function showNext(){if(qi<cur.queue.length){curFig=cur.queue[qi];$('#curfig').innerHTML=tileSVG(curFig,84);$('#curfig').style.visibility='visible';$('#queuecount').textContent=(cur.queue.length-qi)+' left';T.figTime=Date.now();}
  else{curFig=null;$('#curfig').innerHTML='';$('#curfig').style.visibility='hidden';$('#queuecount').textContent='round complete';if(!locked)$('#go').classList.add('ready');}}
function binFlash(side,cls){const b=$(side==='L'?'#binL':'#binR');b.classList.add(cls);setTimeout(()=>b.classList.remove(cls),480);}
function onBin(side){if(locked||phase==='demo'||phase==='done'||!curFig)return;const rt=Date.now()-T.figTime;const correct=cur.rule.lab(curFig)===side;
  binFlash(side,correct?'good':'bad');T.seq.push({chosen:side,correct});
  if(phase==='scored'){T.placements++;if(correct)T.correct++;T.rts.push(rt);}
  log(`place ${side} · ${correct?'\u2713 fits rule':'\u2717 wrong bin'} · rt ${rt}ms`);
  qi++;renderMeters();setTimeout(showNext,420);}
function hint(){if(locked||phase==='demo'||phase==='done'||!curFig)return;T.hints++;const side=cur.rule.lab(curFig);
  const arr=side==='L'?cur.exsL:cur.exsR;const f=sampleSide(cur.rule,side);arr.push(f);
  const box=$(side==='L'?'#binL .exs':'#binR .exs');const e=document.createElement('div');e.className='ex';e.dataset.id=side+(arr.length-1);e.innerHTML=tileSVG(f,42);box.appendChild(e);
  log('hint used: extra example added to '+side);renderMeters();}
function finishRound(){T.lastHyp=computeHyp(T.seq);log('round done · '+cur.rule.desc+' · '+T.lastHyp);renderMeters();nextPhase();}
function nextPhase(){locked=false;if(phase==='warmup'){scoredIndex=0;startScored();}else if(phase==='scored'){scoredIndex++;scoredIndex<scoredRounds.length?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('\u2b50');renderRound(genRound('color',4));log('— warm-up (unscored): sort by the secret rule —');}
function startScored(){phase='scored';setCue('\ud83c\udfaf');renderRound(genRound(scoredRounds[scoredIndex],6));log(`— SCORED round ${scoredIndex+1}: discover the hidden rule —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');locked=true;log(`— DONE · placement acc ${T.correct}/${T.placements} —`);}
async function runDemo(){phase='demo';setCue('\ud83d\udc41\ufe0f');locked=true;renderRound(genRound('color',6));log('ghost-hand demo (wordless, <10s)');
  curFig=cur.queue.find(f=>cur.rule.lab(f)==='L')||cur.queue[0];$('#curfig').innerHTML=tileSVG(curFig,84);$('#curfig').style.visibility='visible';
  const correctSide=cur.rule.lab(curFig);ghostShow(true);await sleep(300);
  await ghostTo($('#binL'));$('#binL').classList.add('hot');await sleep(250);$('#binL').classList.remove('hot');
  await ghostTo($('#binR'));$('#binR').classList.add('hot');await sleep(250);$('#binR').classList.remove('hot');
  const tgt=correctSide==='L'?'#binL':'#binR';await ghostTo($(tgt));await ghostTap();binFlash(correctSide,'good');$('#curfig').style.visibility='hidden';
  await sleep(500);ghostShow(false);await sleep(500);startWarmup();}
$('#binL').addEventListener('click',()=>onBin('L'));
$('#binR').addEventListener('click',()=>onBin('R'));
$('#arena').addEventListener('pointerover',e=>{const ex=e.target.closest('.ex');if(ex&&phase!=='demo'&&phase!=='done'){T.explored.add(ex.dataset.id);renderMeters();}});
$('#hint').addEventListener('click',hint);
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready')){$('#go').classList.remove('ready');finishRound();}});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
