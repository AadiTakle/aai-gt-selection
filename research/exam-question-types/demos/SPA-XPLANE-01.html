<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPA-XPLANE-01 · Place the Slice</title>
<style>
:root{--ink:#26304a;--violet:#6d5dfc;--pink:#ef5da8;--cyan:#30c5d8;--good:#18a774;--bad:#e44f61;--tel:#101326;--tel2:#1b2040}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{display:flex;background:radial-gradient(circle at 12% 12%,#dffbff 0,transparent 30%),linear-gradient(145deg,#f3efff,#fff1f8);font:16px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
#wrap{flex:1;min-width:0;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px}#badge{font-size:12px;font-weight:850;letter-spacing:.09em;color:#77799a;text-transform:uppercase}#phasecue{font-size:34px;height:42px}
#stagecard{width:min(760px,100%);background:#fff;border-radius:27px;padding:16px;box-shadow:0 24px 60px -32px #493d8c;display:grid;gap:12px}
#canvasWrap{position:relative;border-radius:20px;overflow:hidden;background:#11152c;border:2px solid #252c55}canvas{display:block;width:100%;height:auto;aspect-ratio:7/4}
#match{height:10px;background:#e6e4f2;border-radius:10px;overflow:hidden}#match i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ef5da8,#ffd166,#18a774);transition:.12s}
#sliders{display:grid;gap:9px}.control{display:grid;grid-template-columns:38px 1fr 92px;gap:10px;align-items:center;padding:7px 10px;border-radius:13px;background:#f5f4ff}.control.off{opacity:.28}.glyph{font-size:24px;text-align:center}.control input{width:100%;accent-color:var(--violet)}.keys{text-align:right;color:#7f82a3;font:700 11px ui-monospace,monospace}.kbd{display:inline-grid;place-items:center;min-width:22px;height:21px;padding:0 4px;background:#fff;border:1px solid #c7c7db;border-bottom-width:3px;border-radius:6px;color:#343755;margin:0 1px}
#controls{display:flex;justify-content:center;align-items:center;gap:12px}.round{border:0;border-radius:50%;cursor:pointer;font:800 24px system-ui}.round:focus-visible{outline:4px solid #bcb5ff;outline-offset:2px}#replay{width:50px;height:50px;background:#efedff;color:#6354d9}#lock{width:66px;height:66px;color:#fff;background:var(--violet);box-shadow:0 10px 24px -10px var(--violet)}#lock:disabled{opacity:.26;cursor:not-allowed}#orbitKeys{text-align:center;color:#8587a4;font:700 11px ui-monospace,monospace}
#ghost{position:fixed;left:0;top:0;z-index:90;font-size:38px;opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .2s;filter:drop-shadow(0 3px 4px #0006)}#ghost.show{opacity:1}#ghost.tap{animation:tap .34s}@keyframes tap{50%{scale:.76}}
#telemetry{width:340px;flex:0 0 340px;min-height:100vh;background:var(--tel);color:#d6dcff;display:flex;flex-direction:column;font:13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace}#telemetry h3{margin:0;padding:13px 15px;background:var(--tel2);font-size:12px;color:#fff;text-transform:uppercase;letter-spacing:.1em}
#mountain{margin:12px 12px 4px;padding:10px;border:1px solid #30375f;border-radius:12px}.mountTop{display:flex;justify-content:space-between;color:#8b94ca;font-size:11px}.track{height:9px;background:#252b4c;border-radius:9px;overflow:hidden;margin-top:7px}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#30c5d8,#9c8cff,#ef5da8);transition:.3s}
#mlist{padding:8px 12px;display:grid;gap:7px}.mrow{display:grid;grid-template-columns:107px 1fr;gap:6px}.mid{color:#7fffcf;font-weight:800}.mval{text-align:right;color:#fff;overflow-wrap:anywhere}.mname{grid-column:1/3;color:#747fb2;font-size:11px;margin-top:-4px}#logwrap{border-top:1px solid #292f52;margin-top:auto}#logwrap b{display:block;padding:8px 12px 4px;color:#818bc0;font-size:11px;letter-spacing:.08em}#log{height:210px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}#log div{padding:3px 0;border-bottom:1px dotted #252b4b}#log .t{color:#626c9f}
@media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;min-height:0;height:340px;flex:none}}@media(max-width:510px){#stagecard{padding:10px}.control{grid-template-columns:30px 1fr 82px}.keys{font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="wrap">
  <div id="badge">SPA-XPLANE-01 · Place the Slice</div>
  <div id="phasecue">👁️</div>
  <main id="stagecard">
    <div id="canvasWrap"><canvas id="scene" width="700" height="400" aria-label="three dimensional solid and cutting plane"></canvas></div>
    <div id="match"><i></i></div>
    <div id="sliders">
      <label class="control" id="rowH"><span class="glyph">↕</span><input id="height" type="range" min="0" max="100" value="50" aria-label="plane height"><span class="keys"><i class="kbd">W</i><i class="kbd">S</i></span></label>
      <label class="control" id="rowT"><span class="glyph">↗</span><input id="tilt" type="range" min="0" max="100" value="0" aria-label="plane tilt"><span class="keys"><i class="kbd">A</i><i class="kbd">D</i></span></label>
      <label class="control" id="rowW"><span class="glyph">⟳</span><input id="twist" type="range" min="0" max="100" value="0" aria-label="plane twist"><span class="keys"><i class="kbd">Q</i><i class="kbd">E</i></span></label>
    </div>
    <div id="orbitKeys"><span class="kbd">I</span><span class="kbd">J</span><span class="kbd">K</span><span class="kbd">L</span> ◇ <span class="kbd">↵</span></div>
    <div id="controls"><button id="replay" class="round" title="replay wordless example" aria-label="replay example">↻</button><button id="lock" class="round" title="lock plane" aria-label="lock plane">✓</button></div>
  </main>
</div>
<aside id="telemetry">
  <h3>Live telemetry · per-child</h3>
  <div id="mountain"><div class="mountTop"><span>CHALLENGE MOUNTAIN</span><span id="mountText">1/5 · Δ 0.00</span></div><div class="track"><i id="mountFill"></i></div></div>
  <div id="mlist"></div>
  <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
</aside>
<div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),ctx=$('#scene').getContext('2d');
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const V=(x,y,z)=>[x,y,z],add=(a,b)=>a.map((x,i)=>x+b[i]),sub=(a,b)=>a.map((x,i)=>x-b[i]),mul=(a,s)=>a.map(x=>x*s),dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{const n=Math.hypot(...a)||1;return a.map(x=>x/n)};
// Minimal 3D: rotate (yaw,pitch) + orthographic project; painter's-algorithm faces.
function proj(p,yaw,pit,s,cx,cy){const cy_=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pit),sp=Math.sin(pit);let x=p[0]*cy_+p[2]*sy,z=-p[0]*sy+p[2]*cy_,y=p[1]*cp-z*sp;z=p[1]*sp+z*cp;return{x:cx+x*s,y:cy-y*s,z};}
function drawFaces(c,verts,faces,yaw,pit,s,cx,cy){const P=verts.map(v=>proj(v,yaw,pit,s,cx,cy));faces.map(f=>({f,depth:f.idx.reduce((a,i)=>a+P[i].z,0)/f.idx.length})).sort((a,b)=>a.depth-b.depth).forEach(({f})=>{c.beginPath();f.idx.forEach((i,k)=>k?c.lineTo(P[i].x,P[i].y):c.moveTo(P[i].x,P[i].y));c.closePath();c.fillStyle=f.fill;c.fill();c.strokeStyle='#28335c';c.lineWidth=2;c.stroke()});}
function solid(verts,faceIdx,colors){return{verts,faces:faceIdx.map((idx,i)=>({idx,fill:colors[i%colors.length]}))};}
const COLORS=['#8ba7ff','#7791eb','#657cd4','#9eb8ff','#6e86dc','#b0c4ff','#839df0','#7288d0'];
const SOLIDS={
 cube:solid([V(-1,-1,-1),V(1,-1,-1),V(1,1,-1),V(-1,1,-1),V(-1,-1,1),V(1,-1,1),V(1,1,1),V(-1,1,1)],[[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[1,5,6,2],[0,3,7,4]],COLORS),
 pyramid:solid([V(-1,-1,-1),V(1,-1,-1),V(1,-1,1),V(-1,-1,1),V(0,1.25,0)],[[0,1,2,3],[0,4,1],[1,4,2],[2,4,3],[3,4,0]],COLORS),
 tetra:solid([V(0,1.25,0),V(-1,-.9,-.8),V(1,-.9,-.8),V(0,-.9,1.1)],[[0,1,2],[0,2,3],[0,3,1],[1,3,2]],COLORS),
 prism:solid([V(-1,-1,-1),V(1,-1,-1),V(0,1,-1),V(-1,-1,1),V(1,-1,1),V(0,1,1)],[[0,1,2],[3,5,4],[0,3,4,1],[1,4,5,2],[2,5,3,0]],COLORS),
 octa:solid([V(0,1.3,0),V(0,-1.3,0),V(1,0,0),V(0,0,1),V(-1,0,0),V(0,0,-1)],[[0,2,3],[0,3,4],[0,4,5],[0,5,2],[1,3,2],[1,4,3],[1,5,4],[1,2,5]],COLORS)
};
function edgesOf(s){const set=new Set(),out=[];s.faces.forEach(f=>f.idx.forEach((a,i)=>{const b=f.idx[(i+1)%f.idx.length],k=a<b?`${a},${b}`:`${b},${a}`;if(!set.has(k)){set.add(k);out.push([a,b])}}));return out;}
function basis(n){const ref=Math.abs(n[1])<.88?[0,1,0]:[1,0,0],u=norm(cross(n,ref)),v=norm(cross(n,u));return{u,v};}
function planeFor(s,h,t,w){const a=t/100*Math.PI*.37,b=w/100*Math.PI,n=norm([Math.sin(a)*Math.cos(b),Math.cos(a),Math.sin(a)*Math.sin(b)]),ds=s.verts.map(p=>dot(n,p)),lo=Math.min(...ds),hi=Math.max(...ds),d=lo+(.08+.84*h/100)*(hi-lo);return{n,d,...basis(n)};}
function section(s,pl){const pts=[];for(const [ia,ib] of edgesOf(s)){const a=s.verts[ia],b=s.verts[ib],da=dot(pl.n,a)-pl.d,db=dot(pl.n,b)-pl.d;if(Math.abs(da)<1e-7)pts.push(a);if(da*db< -1e-8){const q=da/(da-db);pts.push(add(a,mul(sub(b,a),q)))}}
 const uniq=[];pts.forEach(p=>{if(!uniq.some(q=>Math.hypot(...sub(p,q))<1e-5))uniq.push(p)});if(uniq.length<3)return[];const c=mul(uniq.reduce(add,V(0,0,0)),1/uniq.length);return uniq.sort((a,b)=>Math.atan2(dot(sub(a,c),pl.v),dot(sub(a,c),pl.u))-Math.atan2(dot(sub(b,c),pl.v),dot(sub(b,c),pl.u)));
}
function drawPoly(points,fill,stroke,width=3){if(points.length<3)return;const P=points.map(p=>proj(p,yaw,pitch,94,255,205));ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}
function planePatch(pl){const c=mul(pl.n,pl.d),r=1.48;return[add(c,add(mul(pl.u,-r),mul(pl.v,-r))),add(c,add(mul(pl.u,r),mul(pl.v,-r))),add(c,add(mul(pl.u,r),mul(pl.v,r))),add(c,add(mul(pl.u,-r),mul(pl.v,r)))];}
function sectionLocal(poly,pl){return poly.map(p=>[dot(p,pl.u),dot(p,pl.v)]);}
function drawIcon(poly,pl,cx,cy,color,symbol){ctx.save();ctx.translate(cx,cy);ctx.strokeStyle='#444b73';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.strokeRect(-58,-58,116,116);ctx.setLineDash([]);ctx.fillStyle='#9ca4cc';ctx.font='22px system-ui';ctx.textAlign='center';ctx.fillText(symbol,0,-68);const q=sectionLocal(poly,pl);if(q.length>=3){ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p[0]*34,-p[1]*34):ctx.moveTo(p[0]*34,-p[1]*34));ctx.closePath();ctx.fillStyle=color+'aa';ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=3;ctx.stroke();q.forEach(p=>{ctx.beginPath();ctx.arc(p[0]*34,-p[1]*34,3,0,7);ctx.fillStyle='#fff';ctx.fill()})}ctx.restore();}
const LIB=[
 {level:1,solid:'pyramid',target:{h:32,t:0,w:0},start:{h:72,t:0,w:0},dims:[1,0,0]},
 {level:2,solid:'tetra',target:{h:42,t:22,w:0},start:{h:75,t:5,w:0},dims:[1,1,0]},
 {level:3,solid:'prism',target:{h:54,t:38,w:20},start:{h:22,t:8,w:20},dims:[1,1,0]},
 {level:4,solid:'cube',target:{h:50,t:72,w:25},start:{h:24,t:22,w:25},dims:[1,1,1]},
 {level:5,solid:'octa',target:{h:61,t:78,w:68},start:{h:25,t:18,w:10},dims:[1,1,1]}
];
const T={scored:0,correct:0,rts:[],first:0,revs:0,explore:new Set(),path:[],moves:0,lastDir:{h:0,t:0,w:0},error:'—',poly:0,maxSolved:0,level:1,startLevel:1,itemStart:0,rapid:false,blur:false,lastActivity:performance.now()};
let phase='demo',item=LIB[0],trial=0,locked=true,yaw=-.62,pitch=.42,animating=false;
function learnRate(){return T.scored?((T.maxSolved-T.startLevel)/T.scored).toFixed(2):'0.00';}
function vals(){return{h:+$('#height').value,t:+$('#tilt').value,w:+$('#twist').value};}
function idealMoves(){return item.dims.reduce((n,on)=>n+(on?1:0),0);}
function rtText(){if(!T.rts.length)return'—';return T.rapid||T.blur?'gated':`${T.rts.at(-1)} ms · μ ${mean(T.rts)}`;}
const METERS=[
 {id:'M-ACC',name:'Exact plane-placement accuracy',get:()=>T.scored?`${T.correct}/${T.scored} · ${Math.round(100*T.correct/T.scored)}%`:'—'},
 {id:'M-POLY',name:'Live cross-section match',get:()=>`${T.poly}%`},
 {id:'M-RT',name:'Commit time, engagement-gated',get:rtText},
 {id:'M-RTFIRST',name:'Time to first plane move',get:()=>T.first?`${Math.round(T.first)} ms`:'—'},
 {id:'M-REV',name:'Control-direction reversals',get:()=>String(T.revs)},
 {id:'M-EXPLORE',name:'Distinct plane states sampled',get:()=>`${T.explore.size} states`},
 {id:'M-PATH',name:'Plane-adjustment path',get:()=>T.path.length?T.path.slice(-4).join(' → '):'—'},
 {id:'M-EFF',name:'Moves versus direct path',get:()=>T.moves?`${T.moves} / ideal ${idealMoves()}`:'—'},
 {id:'M-ERRTYPE',name:'Last placement error',get:()=>T.error},
 {id:'M-DIFFREACH',name:'Hardest plane level solved',get:()=>`${T.maxSolved}/5 · Δ/trial ${learnRate()}`}
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{$('#v_'+m.id).textContent=m.get()});$('#mountFill').style.width=(T.level/5*100)+'%';$('#mountText').textContent=`${T.level}/5 · Δ ${learnRate()}`;}
function log(msg){const d=document.createElement('div');d.innerHTML=`<span class="t">+${Math.round(Math.max(0,performance.now()-T.itemStart))}ms</span> ${msg}`;$('#log').appendChild(d);$('#log').scrollTop=$('#log').scrollHeight;}
function first(){if(!T.first){T.first=performance.now()-T.itemStart;log(`first plane move @ ${Math.round(T.first)}ms`)}}
function score(){const v=vals(),tar=item.target,keys=['h','t','w'];let sum=0,n=0;keys.forEach((k,i)=>{if(item.dims[i]){sum+=(v[k]-tar[k])**2;n++}});const cur=section(SOLIDS[item.solid],planeFor(SOLIDS[item.solid],v.h,v.t,v.w)),goal=section(SOLIDS[item.solid],planeFor(SOLIDS[item.solid],tar.h,tar.t,tar.w)),sidePenalty=Math.abs(cur.length-goal.length)*9;return clamp(Math.round(100-Math.sqrt(sum/Math.max(1,n))*1.5-sidePenalty),0,100);}
function draw(){
 const s=SOLIDS[item.solid],v=vals(),pl=planeFor(s,v.h,v.t,v.w),poly=section(s,pl),tpl=planeFor(s,item.target.h,item.target.t,item.target.w),target=section(s,tpl);ctx.clearRect(0,0,700,400);
 const grd=ctx.createLinearGradient(0,0,700,400);grd.addColorStop(0,'#11162f');grd.addColorStop(1,'#202952');ctx.fillStyle=grd;ctx.fillRect(0,0,700,400);
 ctx.strokeStyle='#3a426d';ctx.lineWidth=1;for(let x=20;x<470;x+=30){ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,380);ctx.stroke()}for(let y=20;y<390;y+=30){ctx.beginPath();ctx.moveTo(20,y);ctx.lineTo(470,y);ctx.stroke()}
 drawFaces(ctx,s.verts,s.faces,yaw,pitch,94,255,205);drawPoly(planePatch(pl),'#ef5da83b','#ef78b9',2);drawPoly(poly,'#33d6c688','#8dfff1',4);
 ctx.strokeStyle='#32395f';ctx.beginPath();ctx.moveTo(480,20);ctx.lineTo(480,380);ctx.stroke();drawIcon(target,tpl,590,112,'#ef5da8','◎');drawIcon(poly,pl,590,292,'#30c5d8','◇');
 T.poly=score();$('#match i').style.width=T.poly+'%';renderMeters();
}
function setItem(next,fresh=true){item=next;const keys=['height','tilt','twist'],vs=['h','t','w'];keys.forEach((id,i)=>{const el=$('#'+id);el.value=item.start[vs[i]];el.dataset.prior=el.value;el.disabled=!item.dims[i];$('#row'+vs[i].toUpperCase()).classList.toggle('off',!item.dims[i])});locked=phase==='demo';$('#lock').disabled=locked;$('#phasecue').textContent=phase==='demo'?'👁️':phase==='warmup'?'⭐':'🎯';
 if(fresh){T.itemStart=performance.now();T.first=0;T.revs=0;T.explore=new Set();T.path=[];T.moves=0;T.lastDir={h:0,t:0,w:0};T.error='—';T.rapid=false;T.blur=false;T.lastActivity=performance.now()}draw();}
function track(k,oldVal,newVal,commit=false){if(phase==='demo'||locked)return;first();const d=Math.sign(newVal-oldVal);if(T.lastDir[k]&&d&&d!==T.lastDir[k])T.revs++;if(d)T.lastDir[k]=d;if(commit){T.moves++;const v=vals(),state=`${Math.round(v.h/10)}/${Math.round(v.t/10)}/${Math.round(v.w/10)}`;T.explore.add(state);T.path.push(state);log(`plane state ${state}`)}draw();}
['height','tilt','twist'].forEach((id,i)=>{const el=$('#'+id),k=['h','t','w'][i];el.addEventListener('input',()=>{const n=+el.value,prior=+(el.dataset.prior??n);track(k,prior,n,false);el.dataset.prior=n});el.addEventListener('change',()=>{const n=+el.value;track(k,n,n,true);el.dataset.prior=n})});
function activity(){T.lastActivity=performance.now()}addEventListener('pointerdown',activity);addEventListener('keydown',activity);document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='scored')T.blur=true});
function gate(rt){T.rapid=rt<500||performance.now()-T.lastActivity>25000;if(T.rapid||T.blur)log(`RT gate: ${T.rapid?'rapid/idle':'blur'}`);}
function errorType(){const v=vals(),tar=item.target,d={height:Math.abs(v.h-tar.h),tilt:Math.abs(v.t-tar.t),twist:Math.abs(v.w-tar.w)};return Object.entries(d).sort((a,b)=>b[1]-a[1])[0][0]+' mismatch';}
async function submit(){if(locked||animating)return;locked=true;$('#lock').disabled=true;const rt=Math.round(performance.now()-T.itemStart),pct=score(),ok=pct>=91;
 if(phase==='warmup'){T.error=ok?'—':errorType();log(`warm-up ${ok?'matched':'guided reveal'} · ${pct}% · unscored`);$('#phasecue').textContent=ok?'✅':'↻';if(!ok)await animateToTarget(false);await sleep(650);startScored();return}
 T.scored++;T.rts.push(rt);gate(rt);if(ok){T.correct++;T.maxSolved=Math.max(T.maxSolved,item.level);T.level=Math.min(5,T.level+1);T.error='—'}else{T.level=Math.max(1,T.level-1);T.error=errorType()}$('#phasecue').textContent=ok?'✅':'🔎';log(`LOCK ${ok?'match':'miss '+T.error} · ${pct}% · L${item.level} · ${rt}ms`);renderMeters();await sleep(900);trial++;trial<6?startScored():finish();
}
async function animateToTarget(trackReplay=true){if(animating)return;animating=true;const from=vals(),to=item.target,start=performance.now(),dur=1450;while(true){const q=Math.min(1,(performance.now()-start)/dur),e=1-(1-q)**3;['h','t','w'].forEach((k,i)=>{$(['#height','#tilt','#twist'][i]).value=Math.round(from[k]+(to[k]-from[k])*e)});draw();if(q>=1)break;await new Promise(requestAnimationFrame)}['#height','#tilt','#twist'].forEach(s=>{$(s).dataset.prior=$(s).value});animating=false;if(trackReplay){T.moves++;T.explore.add('target-demo');log('wordless target replay');renderMeters()}}
function startWarmup(){phase='warmup';const w={level:1,solid:'cube',target:{h:50,t:0,w:0},start:{h:50,t:70,w:0},dims:[0,1,0]};setItem(w,true);locked=false;$('#lock').disabled=false;log('warm-up · unscored');}
function startScored(){phase='scored';const base=LIB[T.level-1],copy=JSON.parse(JSON.stringify(base));if(copy.dims[2])copy.target.w=(copy.target.w+trial*13)%88+6;setItem(copy,true);locked=false;$('#lock').disabled=false;log(`scored ${trial+1}/6 · L${item.level} · ${item.solid}`);}
function finish(){phase='done';locked=true;$('#phasecue').textContent='🏆';$('#lock').disabled=true;log(`DONE · ${T.correct}/${T.scored} · max L${T.maxSolved} · Δ ${learnRate()}`);renderMeters();}
const ghost=$('#ghost');async function ghostTo(el){const r=el.getBoundingClientRect();ghost.style.transform=`translate(${r.left+r.width/2-12}px,${r.top+r.height/2-10}px)`;await sleep(460)}async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(330)}
async function runDemo(){phase='demo';setItem(LIB[3],false);ghost.classList.add('show');await ghostTo($('#tilt'));await animateToTarget(false);await ghostTo($('#lock'));await ghostTap();$('#phasecue').textContent='✨';await sleep(350);ghost.classList.remove('show');startWarmup();}
$('#lock').addEventListener('click',submit);$('#replay').addEventListener('click',()=>{if(animating||phase==='demo'||phase==='done')return;animateToTarget(true)});
function nudge(id,d){const el=$('#'+id);if(el.disabled||locked)return;const old=+el.value;el.value=clamp(old+d,0,100);track({height:'h',tilt:'t',twist:'w'}[id],old,+el.value,true)}
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k==='w')nudge('height',8);else if(k==='s')nudge('height',-8);else if(k==='a')nudge('tilt',-8);else if(k==='d')nudge('tilt',8);else if(k==='q')nudge('twist',-8);else if(k==='e')nudge('twist',8);else if(k==='j'){yaw-=.12;draw()}else if(k==='l'){yaw+=.12;draw()}else if(k==='i'){pitch-=.1;draw()}else if(k==='k'){pitch+=.1;draw()}else if(e.key==='Enter')submit();else return;e.preventDefault()});
buildMeters();setItem(LIB[0],false);renderMeters();runDemo();
</script>
