<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-radar-01 — Signal Radar (dual n-back / updating)</title>
<style>
  :root{
    --bg:#04120e;--panel:#082018;--edge:#124535;--ink:#d9ffe9;--mut:#5fae8b;
    --accent:#37e0a0;--good:#7dffb0;--bad:#ff6b8a;--warn:#ffd166;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
  h1{font-size:19px;margin:.2rem 0}
  .sub{color:var(--mut);font-size:13px;margin:0 0 6px;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--accent);font-size:12px}
  #scope{position:relative;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,#0c2c20 0,#04120e 70%);border:2px solid var(--edge);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;padding:26px}
  #scope::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from var(--sweep,0deg),#37e0a033,transparent 30deg);animation:none}
  .cell{border-radius:12px;background:#0a2a1f66;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative}
  .cell.blip::after{content:"";position:absolute;width:34px;height:34px;border-radius:50%;background:var(--accent);box-shadow:0 0 20px 6px #37e0a0aa}
  .cell .lt{position:relative;z-index:2;font-weight:800;color:#03210f}
  #letter{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:26px;font-weight:800;color:var(--warn);z-index:3}
  #cue{font-size:20px;min-height:30px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:11px 20px;border-radius:10px;border:1px solid var(--edge);background:#0c2c20;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#03210f;border-color:transparent;font-weight:600}
  button.match{font-size:17px;font-weight:700;min-width:150px}
  button.flash{background:var(--warn);color:#3a2c00}
  button:disabled{opacity:.4;cursor:not-allowed}
  .modebtn.on{background:var(--warn);color:#3a2c00;border-color:transparent;font-weight:600}
  #ghost{position:absolute;font-size:28px;left:0;top:0;transition:left .4s,top .4s;pointer-events:none;z-index:6;opacity:0;filter:drop-shadow(0 3px 3px #0008)}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #124535;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}
  .kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:140px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#051a13}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>📡 Signal Radar <span class="badge" id="bmode">1-back · single</span></h1>
    <p class="sub">Tap <b>WHERE-MATCH</b> when the blip is in the same spot as <b id="ntxt">1</b> sweep(s) ago. (Dual mode adds letters.)</p>
  </div>
  <div style="position:relative"><div id="scope"><div id="letter"></div></div><div id="ghost">👆</div></div>
  <div id="cue">👀</div>
  <div class="row">
    <button class="match pri" id="whereBtn" disabled>◎ WHERE-MATCH</button>
    <button class="match" id="whatBtn" style="display:none" disabled>🔤 WHAT-MATCH</button>
  </div>
  <div class="row">
    <button class="pri" id="go">▶ Watch how it works</button>
    <button id="replay" disabled>↺ Replay demo</button>
    <button class="modebtn" id="dual" title="add letter channel">Dual mode</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand will show you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const scope=$("#scope"),cue=$("#cue"),ghost=$("#ghost"),letterEl=$("#letter");
const cells=[];for(let i=0;i<9;i++){const d=document.createElement("div");d.className="cell";d.dataset.i=i;scope.appendChild(d);cells.push(d);}
const LETTERS=["A","B","C","D"];
const T={phase:"idle",n:1,dual:false,block:0,nMax:0,
  hit:0,miss:0,fa:0,cr:0,lureFA:0,rts:[],lapses:0,
  accByN:{},half:[[0,0],[0,0]],idle:0,blur:0,log:[]};
window.addEventListener("blur",()=>{T.blur++;render();});
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m;}
function norminv(p){ // Acklam approximation
  if(p<=0)return -6;if(p>=1)return 6;
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const pl=0.02425;let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p<=1-pl){q=p-0.5;r=q*q;return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
  q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}
function dprime(){const H=(T.hit+.5)/(T.hit+T.miss+1),F=(T.fa+.5)/(T.fa+T.cr+1);return norminv(H)-norminv(F);}
function updateCost(){const ks=Object.keys(T.accByN).map(Number).sort((a,b)=>a-b);if(ks.length<2)return "—";const first=T.accByN[ks[0]],last=T.accByN[ks[ks.length-1]];const af=first.h/(first.n||1),al=last.h/(last.n||1);return ((al-af)/(ks[ks.length-1]-ks[0])).toFixed(2);}
function drift(){const a=T.half[0],b=T.half[1];const fa=a[1]?a[0]/a[1]:0,sb=b[1]?b[0]/b[1]:0;return b[1]?Math.round(100*(sb-fa)):"—";}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop();}
function render(){
  const tot=T.hit+T.miss+T.fa+T.cr;const acc=tot?Math.round(100*(T.hit+T.cr)/tot):0;
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-radar-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>n · channel</span><b>${T.n}-back · ${T.dual?"dual":"single"}</b></div>
  <div class="kv"><span>block</span><b>${T.block}</b></div>
  <h2>Sensitivity</h2>
  <div class="kv"><span>d-prime <span class="m">M-DPRIME</span></span><b>${dprime().toFixed(2)}</b></div>
  <div class="kv"><span>accuracy <span class="m">M-ACC</span></span><b>${acc}%</b></div>
  <div class="kv"><span>hits/miss</span><b>${T.hit}/${T.miss}</b></div>
  <div class="kv"><span>false alarms</span><b>${T.fa}</b></div>
  <div class="kv"><span>lure FA <span class="m">M-ERRTYPE</span></span><b>${T.lureFA}</b></div>
  <h2>Capacity & updating</h2>
  <div class="kv"><span>max n sustained <span class="m">M-DIFFREACH</span></span><b>${T.nMax}</b></div>
  <div class="kv"><span>acc-by-n slope <span class="m">M-UPDATECOST</span></span><b>${updateCost()}</b></div>
  <h2>Consistency & engagement</h2>
  <div class="kv"><span>RT variability <span class="m">M-RTVAR</span></span><b>${cv(T.rts).toFixed(2)}</b></div>
  <div class="kv"><span>lapses <span class="m">M-LAPSE</span></span><b>${T.lapses}</b></div>
  <div class="kv"><span>drift half2-1 <span class="m">M-DRIFT</span></span><b>${drift()}${drift()==="—"?"":"%"}</b></div>
  <div class="kv"><span>focus-loss <span class="m">M-ENGAGE</span></span><b>${T.blur}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();
function clearCells(){cells.forEach(c=>{c.className="cell";});letterEl.textContent="";}
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=$("#replay").disabled=$("#dual").disabled=true;
  clearCells();cells[4].classList.add("blip");cue.textContent="👀 a blip here…";await sleep(900);cells[4].classList.remove("blip");await sleep(500);
  cells[4].classList.add("blip");cue.textContent="👆 same spot as 1 ago → WHERE-MATCH";
  ghost.style.opacity="1";const b=$("#whereBtn").getBoundingClientRect();ghost.style.left=(b.left+b.width/2-14)+"px";ghost.style.top=(b.top-30)+"px";ghost.style.position="fixed";
  await sleep(900);$("#whereBtn").classList.add("flash");await sleep(500);$("#whereBtn").classList.remove("flash");cells[4].classList.remove("blip");
  cue.textContent="✅";ghost.style.opacity="0";await sleep(600);clearCells();
  $("#go").disabled=$("#replay").disabled=$("#dual").disabled=false;$("#go").textContent="▶ Try a practice block";$("#go").onclick=warmup;
  T.phase="idle";$("#phasehint").textContent="Now you try — this practice block is NOT scored.";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;
let whereFlag=false,whatFlag=false,rtMark=0;
$("#whereBtn").onclick=()=>{if($("#whereBtn").disabled)return;whereFlag=true;if(!rtMark)rtMark=performance.now();$("#whereBtn").classList.add("flash");};
$("#whatBtn").onclick=()=>{if($("#whatBtn").disabled)return;whatFlag=true;$("#whatBtn").classList.add("flash");};
async function runBlock(scored){
  $("#go").disabled=$("#replay").disabled=$("#dual").disabled=true;
  const n=T.n,SW=14,posHist=[],letHist=[];const win=Math.max(1200,2200-(n-1)*300);
  T.accByN[n]=T.accByN[n]||{h:0,n:0};
  for(let s=0;s<SW;s++){
    let pos=Math.random()*9|0,let_=LETTERS[Math.random()*LETTERS.length|0];
    let isPos=false,isLet=false;
    if(s>=n){
      const r=Math.random();
      if(r<0.32){pos=posHist[s-n];isPos=true;}                 // target
      else if(r<0.5 && s>=n+1){pos=posHist[s-n-1];}            // lure n+1
      else if(r<0.62 && s>=n-1 && n>1){pos=posHist[s-n+1];}    // lure n-1
      if(T.dual){if(Math.random()<0.3){let_=letHist[s-n];isLet=true;}}
      // recompute actual match flags after assignment
      isPos=(pos===posHist[s-n]);if(T.dual)isLet=(let_===letHist[s-n]);
    }
    posHist.push(pos);letHist.push(let_);
    clearCells();cells[pos].classList.add("blip");if(T.dual){letterEl.textContent=let_;cells[pos].innerHTML='<span class="lt">'+let_+'</span>';}
    cue.textContent=`${n}-back — watch`;
    whereFlag=false;whatFlag=false;rtMark=0;
    $("#whereBtn").disabled=false;if(T.dual)$("#whatBtn").disabled=false;
    const onset=performance.now();
    await sleep(win);
    $("#whereBtn").disabled=true;$("#whatBtn").disabled=true;$("#whereBtn").classList.remove("flash");$("#whatBtn").classList.remove("flash");
    if(s>=n && scored){
      // WHERE channel (signal detection)
      if(isPos)T.accByN[n].n++;
      if(isPos&&whereFlag){T.hit++;T.accByN[n].h++;}
      else if(isPos&&!whereFlag){T.miss++;}
      else if(!isPos&&whereFlag){T.fa++;const lure=(s>=n+1&&pos===posHist[s-n-1])||(n>1&&pos===posHist[s-n+1]);if(lure)T.lureFA++;}
      else {T.cr++;}
      if(whereFlag&&rtMark){const rt=rtMark-onset;if(rt>0){T.rts.push(rt);if(rt>1500)T.lapses++;}}
      const half=s<SW/2?0:1;T.half[half][1]++;if((isPos&&whereFlag)||(!isPos&&!whereFlag))T.half[half][0]++;
      // WHAT channel (dual mode)
      if(T.dual){ if(isLet&&whatFlag)T.hit++; else if(isLet&&!whatFlag)T.miss++; else if(!isLet&&whatFlag)T.fa++; else T.cr++; }
    }
    render();await sleep(280);
  }
  clearCells();
  if(scored){
    const rate=T.accByN[n].n?T.accByN[n].h/T.accByN[n].n:0;
    if(dprime()>1.2 && T.hit>=T.miss){if(n>T.nMax)T.nMax=n;T.n=Math.min(4,T.n+1);}
    else if(dprime()<0.4)T.n=Math.max(1,T.n-1);
    T.block++;logE(`block ${T.block}: ${n}-back d'=${dprime().toFixed(2)} hits ${T.hit}`);
    $("#ntxt").textContent=T.n;$("#bmode").textContent=`${T.n}-back · ${T.dual?"dual":"single"}`;
  }
  render();$("#go").disabled=$("#replay").disabled=$("#dual").disabled=false;
}
async function warmup(){T.phase="warm-up (unscored)";render();await runBlock(false);T.phase="idle";$("#go").textContent="▶ Start scored blocks";$("#go").onclick=startScored;$("#phasehint").textContent="Great! These count. Flag only true matches — false alarms hurt your d-prime.";render();}
let left=0;
async function startScored(){T.phase="scored";render();left=3;$("#go").disabled=true;await loop();}
async function loop(){if(left<=0){finish();return;}await runBlock(true);left--;if(left>0)await loop();else finish();}
function finish(){T.phase="done";render();cue.textContent="🏁";$("#go").disabled=false;$("#go").textContent="▶ Run more blocks";$("#go").onclick=startScored;$("#phasehint").textContent=`Done. Max n sustained ${T.nMax||T.n}, d-prime ${dprime().toFixed(2)}. Try Dual mode for a higher ceiling.`;}
$("#dual").onclick=()=>{T.dual=!T.dual;$("#dual").textContent=T.dual?"Single mode":"Dual mode";$("#dual").classList.toggle("on",T.dual);$("#whatBtn").style.display=T.dual?"inline-block":"none";$("#bmode").textContent=`${T.n}-back · ${T.dual?"dual":"single"}`;logE(`channel → ${T.dual?"dual":"single"}`);render();};
</script>
</body>
</html>
