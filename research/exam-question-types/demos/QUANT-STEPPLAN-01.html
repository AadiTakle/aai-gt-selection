<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUANT-STEPPLAN-01 — Solution Recipe (Step Planner)</title>
<style>
:root{--bg:#0f1226;--panel:#1b2140;--panel2:#232a52;--accent:#5eead4;--accent2:#f59e0b;--good:#4ade80;--bad:#f87171;--ink:#eef1ff;--muted:#9aa3c7}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 20% -10%,#26305e,#0f1226 60%);min-height:100vh}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1120px;margin:0 auto;padding:18px}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid #313a6b;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.phasebar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#2b336a;color:var(--muted);border:1px solid #3a447f}
.pill.on{background:var(--accent);color:#053;font-weight:700}
.story{background:#141a38;border:1px solid #3a447f;border-radius:14px;padding:12px 14px;margin:6px 0 14px;font-size:24px;text-align:center;line-height:1.5}
.story .cap{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.steps{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.step{display:flex;align-items:center;gap:8px;justify-content:center;background:#20264d;border:1px solid #3a447f;border-radius:12px;padding:10px}
.step .lbl{color:var(--muted);font-size:12px;width:52px}
.slot{min-width:52px;height:46px;border-radius:10px;border:2px dashed #4a5590;background:#171d3c;display:flex;align-items:center;
  justify-content:center;font-size:22px;font-weight:800;cursor:pointer}
.slot.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,234,212,.25)}
.slot.op{min-width:46px}
.eq{color:var(--muted);font-size:22px}
.res{min-width:56px;height:46px;border-radius:10px;background:#16351f;border:1px solid #2f6b41;display:flex;align-items:center;
  justify-content:center;font-size:22px;font-weight:800;color:var(--good)}
.res.empty{background:#171d3c;border:1px solid #3a447f;color:var(--muted)}
.palette{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.chip{min-width:46px;height:46px;padding:0 10px;border-radius:10px;background:#2b336a;border:2px solid #3a447f;color:var(--ink);
  font-size:22px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chip:hover{border-color:var(--accent)}
.chip.opc{background:#33224a;border-color:#5a3f7f;color:var(--accent2)}
.chip.resc{background:#16351f;border-color:#2f6b41;color:var(--good)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:8px;flex-wrap:wrap}
button.act{font:600 15px system-ui;padding:10px 18px;border-radius:12px;border:0;cursor:pointer;background:var(--accent);color:#053}
button.act.ghost{background:#2b336a;color:var(--ink);border:1px solid #3a447f}
button.act:disabled{opacity:.4;cursor:default}
.fb{min-height:26px;text-align:center;font-weight:700;margin-top:12px}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.hand{position:fixed;font-size:34px;z-index:20;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:left .55s cubic-bezier(.4,0,.2,1),top .45s ease;opacity:0}
.tele{font-size:13px}
.tele h2{font-size:14px;margin:0 0 8px;color:var(--accent)}
.metrics{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-bottom:10px}
.metrics div:nth-child(odd){color:var(--muted)}
.metrics b{font-variant-numeric:tabular-nums}
.log{height:236px;overflow:auto;background:#12172f;border:1px solid #2a336a;border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-acc{color:var(--good)}.t-err{color:var(--bad)}.t-evt{color:#9fb0ff}.t-sys{color:var(--muted)}
.legend{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <h1>Solution Recipe</h1>
    <div class="sub">Build the steps that solve the story. Tap a slot, then tap a number or a sign. Each step shows its result.</div>
    <div class="phasebar" id="phasebar"></div>
    <div class="story" id="story"></div>
    <div class="steps" id="steps"></div>
    <div class="palette" id="palette"></div>
    <div class="row">
      <button class="act" id="doneBtn">Answer</button>
      <button class="act ghost" id="nextBtn" style="display:none">Next</button>
    </div>
    <div class="fb" id="fb"></div>
    <div class="hand" id="hand">&#128070;</div>
  </main>
  <aside class="card tele">
    <h2>Live telemetry</h2>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="legend">Logs <b>M-POLY</b> (steps correct 0-2), <b>M-PROG</b> (steps completed over time), <b>M-PATH</b> (fill order), <b>M-ERRTYPE</b> (wrong-op / wrong-number), <b>M-EFF</b> (edits vs optimal).</div>
  </aside>
</div>
<script>
(function(){
  "use strict";
  var el=function(id){return document.getElementById(id)};
  var stepsBox=el('steps'),palette=el('palette'),story=el('story'),hand=el('hand'),
      fb=el('fb'),doneBtn=el('doneBtn'),nextBtn=el('nextBtn');
  var T0=Date.now(); function perf(){return Date.now()-T0;}
  function ap(a,op,b){return op==='+'?a+b:op==='-'?a-b:op==='\u00D7'?a*b:op==='\u00F7'?(b?a/b:NaN):NaN;}

  var Tel={
    scored:0,correct:0,polySum:0,polyMax:0,edits:0,effSum:0,effN:0,progMax:0,
    push:function(cls,msg){var d=document.createElement('div');d.className=cls;
      d.textContent='['+(perf()/1000).toFixed(2)+'s] '+msg;var L=el('log');L.appendChild(d);L.scrollTop=L.scrollHeight;},
    render:function(){
      var acc=Tel.scored?Math.round(100*Tel.correct/Tel.scored)+'% ('+Tel.correct+'/'+Tel.scored+')':'—';
      var poly=Tel.polyMax?Tel.polySum+'/'+Tel.polyMax:'—';
      var eff=Tel.effN?Math.round(100*Tel.effSum/Tel.effN)+'%':'—';
      el('metrics').innerHTML=
        '<div>M-ACC accuracy</div><b>'+acc+'</b>'+
        '<div>M-POLY steps</div><b>'+poly+'</b>'+
        '<div>M-PROG steps done</div><b>'+Tel.progMax+'</b>'+
        '<div>M-PATH edits</div><b>'+Tel.edits+'</b>'+
        '<div>M-EFF mean</div><b>'+eff+'</b>';
    }
  };

  // items: story icons, palette numbers, nSteps, solution steps, answer
  var items=[
    {phase:'demo', story:'\uD83E\uDDFA 12 \uD83C\uDF4E \u2192 3 \uD83E\uDDFA \u2192 take 2 \uD83E\uDDFA',cap:'How many apples were taken?',
      nums:[12,3,2],nSteps:2,sol:[{a:12,op:'\u00F7',b:3,r:4},{a:4,op:'\u00D7',b:2,r:8}],answer:8},
    {phase:'warmup',story:'\uD83D\uDFE6 5 + 3 \uD83D\uDFE6',cap:'How many blocks in all?',
      nums:[5,3],nSteps:1,sol:[{a:5,op:'+',b:3,r:8}],answer:8},
    {phase:'scored',story:'\uD83C\uDF6C 18 \u2192 3 \uD83D\uDC66 equally \u2192 1 \uD83D\uDC66 eats 2',cap:'How many does that boy have left?',
      nums:[18,3,2],nSteps:2,sol:[{a:18,op:'\u00F7',b:3,r:6},{a:6,op:'-',b:2,r:4}],answer:4}
  ];
  var labels={demo:'1 Watch',warmup:'2 Try',scored:'3 Solve'};
  var ops=['+','-','\u00D7','\u00F7'];
  var idx=-1,cur=null,cells=[],activeSlot=null,firstAction=0,itemStart=0,resultsAdded=[];

  function renderPhasebar(){
    el('phasebar').innerHTML=['demo','warmup','scored'].map(function(p){
      var on=cur&&cur.phase===p?' on':''; return '<span class="pill'+on+'">'+labels[p]+'</span>';
    }).join('');
  }

  function buildSteps(){
    stepsBox.innerHTML=''; cells=[];
    for(var s=0;s<cur.nSteps;s++){
      (function(s){
        var row=document.createElement('div');row.className='step';
        row.innerHTML='<span class="lbl">Step '+(s+1)+'</span>';
        var a=slot(s,'a'),op=slot(s,'op',true),b=slot(s,'b');
        var eq=document.createElement('span');eq.className='eq';eq.textContent='=';
        var res=document.createElement('div');res.className='res empty';res.id='res'+s;res.textContent='?';
        row.appendChild(a);row.appendChild(op);row.appendChild(b);row.appendChild(eq);row.appendChild(res);
        stepsBox.appendChild(row);
        cells[s]={a:null,op:null,b:null,r:null};
      })(s);
    }
  }
  function slot(s,which,isOp){
    var d=document.createElement('div');d.className='slot'+(isOp?' op':'');d.id='s'+s+which;d.textContent='';
    d.dataset.s=s;d.dataset.w=which;d.dataset.op=isOp?'1':'';
    d.onclick=function(){ if(cur.phase==='demo')return; setActive(d); };
    return d;
  }
  function setActive(d){
    if(activeSlot)activeSlot.classList.remove('active');
    activeSlot=d; d.classList.add('active');
  }
  function drawPalette(){
    palette.innerHTML='';
    cur.nums.forEach(function(n){ palette.appendChild(chip(n,'num')); });
    ops.forEach(function(o){ palette.appendChild(chip(o,'op')); });
    resultsAdded.forEach(function(r){ palette.appendChild(chip(r,'res')); });
  }
  function chip(val,kind){
    var c=document.createElement('div');c.className='chip'+(kind==='op'?' opc':kind==='res'?' resc':'');
    c.textContent=val;
    c.onclick=function(){ if(cur.phase==='demo')return; placeChip(val,kind); };
    return c;
  }
  function placeChip(val,kind){
    if(!activeSlot){ Tel.push('t-sys','tap a slot first'); return; }
    var isOpSlot=activeSlot.dataset.op==='1';
    if(isOpSlot && kind!=='op'){ Tel.push('t-sys','that slot needs a sign'); return; }
    if(!isOpSlot && kind==='op'){ Tel.push('t-sys','that slot needs a number'); return; }
    if(firstAction===0){firstAction=perf();Tel.push('t-evt','first action');}
    var s=+activeSlot.dataset.s,w=activeSlot.dataset.w;
    var had=cells[s][w]!==null;
    cells[s][w]=val; activeSlot.textContent=val; Tel.edits++;
    Tel.push('t-evt','step'+(s+1)+' '+w+' = '+val+(had?' (changed)':''));
    computeStep(s);
    Tel.render();
  }
  function computeStep(s){
    var c=cells[s];
    if(c.a!==null&&c.op!==null&&c.b!==null){
      var r=ap(+c.a,c.op,+c.b);
      c.r=r;
      var res=el('res'+s);res.textContent=(isFinite(r)?r:'?');res.className='res';
      // add result to palette once for chaining
      if(isFinite(r)&&resultsAdded.indexOf(r)<0){ resultsAdded.push(r); drawPalette(); }
      var doneCount=cells.filter(function(x){return x.r!==null&&isFinite(x.r);}).length;
      if(doneCount>Tel.progMax){Tel.progMax=doneCount;}
      Tel.push('t-sys','M-PROG: step '+(s+1)+' computed = '+r+' ('+doneCount+'/'+cur.nSteps+' steps)');
    }
  }

  function loadItem(){
    idx++; if(idx>=items.length){finish();return;}
    cur=items[idx]; activeSlot=null; firstAction=0; itemStart=perf(); resultsAdded=[];
    fb.textContent='';fb.className='fb'; nextBtn.style.display='none'; doneBtn.disabled=false;
    renderPhasebar();
    story.innerHTML=cur.story+'<span class="cap">'+cur.cap+'</span>';
    buildSteps(); drawPalette();
    Tel.push('t-sys','LOAD '+cur.phase+': '+cur.nSteps+'-step problem, answer='+cur.answer);
    if(cur.phase==='demo') ghostDemo();
    Tel.render();
  }

  doneBtn.onclick=function(){ if(cur.phase==='demo')return; commit(); };
  function commit(){
    var finalStep=cells[cur.nSteps-1];
    var finalR=finalStep?finalStep.r:null;
    var correct=(finalR===cur.answer);
    // poly: count steps whose result matches solution step result
    var poly=0;
    for(var s=0;s<cur.nSteps;s++){ if(cells[s].r===cur.sol[s].r)poly++; }
    // errtype from first mismatching step
    var etype='correct';
    if(!correct){
      for(var s2=0;s2<cur.nSteps;s2++){
        var c=cells[s2],sol=cur.sol[s2];
        if(c.r!==sol.r){
          if(c.op!==null&&c.op!==sol.op)etype='wrong-op@step'+(s2+1);
          else if((c.a!=null&&+c.a!==sol.a)||(c.b!=null&&+c.b!==sol.b))etype='wrong-number@step'+(s2+1);
          else etype='incomplete@step'+(s2+1);
          break;
        }
      }
    }
    var optimalEdits=cur.nSteps*3, eff=optimalEdits/Math.max(Tel.edits||optimalEdits,optimalEdits);
    if(cur.phase==='scored'){
      Tel.scored++; if(correct)Tel.correct++;
      Tel.polySum+=poly; Tel.polyMax+=cur.nSteps;
      Tel.effSum+=eff; Tel.effN++;
      Tel.push(correct?'t-acc':'t-err','SCORED: answer='+(finalR===null?'—':finalR)+'  POLY='+poly+'/'+cur.nSteps+'  err='+etype+'  edits='+Tel.edits);
    } else {
      Tel.push('t-sys',cur.phase.toUpperCase()+': answer='+(finalR===null?'—':finalR)+' — not scored');
    }
    fb.textContent = correct? (cur.phase==='warmup'?'Right! Now the two-step story.':'Correct — nice plan!')
                    : 'Answer was '+cur.answer+'. Check your steps.';
    fb.className='fb '+(correct?'good':'bad');
    doneBtn.disabled=true; nextBtn.style.display='inline-block'; if(correct)beep();
    Tel.render();
  }
  nextBtn.onclick=loadItem;

  function ghostDemo(){
    doneBtn.disabled=true; hand.style.opacity='0';
    // fill step by step following cur.sol
    var actions=[];
    for(var s=0;s<cur.nSteps;s++){
      actions.push({slot:'s'+s+'a',val:cur.sol[s].a,kind:'num',s:s,w:'a'});
      actions.push({slot:'s'+s+'op',val:cur.sol[s].op,kind:'op',s:s,w:'op'});
      actions.push({slot:'s'+s+'b',val:cur.sol[s].b,kind:'num',s:s,w:'b'});
    }
    actions.forEach(function(act,i){
      setTimeout(function(){
        var d=el(act.slot);var r=d.getBoundingClientRect();
        hand.style.opacity='1';hand.style.left=(r.left+r.width/2-6)+'px';hand.style.top=(r.top+r.height/2)+'px';
        d.textContent=act.val; d.classList.add('active');
        cells[act.s][act.w]=act.val; computeStep(act.s);
        setTimeout(function(){d.classList.remove('active');},300);
        Tel.push('t-sys','ghost: '+act.slot+' = '+act.val);
      }, 400 + i*620);
    });
    setTimeout(function(){beep();fb.textContent='Answer = '+cur.answer+'.';fb.className='fb good';hand.style.opacity='0';},400+actions.length*620+200);
    setTimeout(function(){loadItem();},400+actions.length*620+1200);
  }

  function beep(){try{var a=new(window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(620,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(960,a.currentTime+.15);g.gain.setValueAtTime(.12,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.3);o.start();o.stop(a.currentTime+.32);}catch(e){}}

  function finish(){
    story.textContent='';
    document.querySelector('.steps').innerHTML='<div style="text-align:center;padding:24px 0">'+
      '<div style="font-size:44px">&#127881;</div><div style="color:var(--muted)">Sample complete. Telemetry captured on the right.</div></div>';
    palette.innerHTML='';doneBtn.style.display='none';nextBtn.style.display='none';
    Tel.push('t-sys','SESSION complete: '+Tel.correct+'/'+Tel.scored+' scored correct');
  }
  window.addEventListener('blur',function(){Tel.push('t-sys','engagement: focus lost');});
  Tel.render(); loadItem();
})();
</script>
</body>
</html>
