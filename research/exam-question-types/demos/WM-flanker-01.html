<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-flanker-01 — Fish School (flanker interference)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;--fish:#59c1ff;--tgt:#ffd166;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #stage{width:440px;height:230px;background:linear-gradient(#123049,#0d2135);border:1px solid var(--edge);border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  #school{display:flex;gap:14px;align-items:center;opacity:0;transition:opacity .1s}
  #school.show{opacity:1}
  .fish{--c:var(--fish);width:56px;height:34px;background:var(--c);border-radius:50%;position:relative;transition:transform .05s}
  .fish .tail{position:absolute;left:-14px;top:5px;width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;border-right:16px solid var(--c)}
  .fish .eye{position:absolute;right:11px;top:11px;width:7px;height:7px;background:#06283d;border-radius:50%}
  .fish.left{transform:scaleX(-1)}
  .fish.center{--c:var(--tgt);width:70px;height:44px;box-shadow:0 0 0 3px #0d2135,0 0 18px 4px #ffd16688}
  .fish.center.left{transform:scaleX(-1) scale(1)}
  .fish.center .eye{top:15px;right:14px}
  .neutral{width:56px;height:22px;background:#6b7bb0;border-radius:8px}
  #timerbar{position:absolute;bottom:0;left:0;height:6px;background:var(--accent);width:0}
  #cue{font-size:26px;height:32px}
  .ans{display:flex;gap:20px}
  .ans button{font-size:34px;width:120px;height:70px;border-radius:16px;border:2px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  .ans button:active{transform:scale(.96)}
  .ans button.flash{background:var(--good);border-color:transparent}
  .ans button.wrong{background:var(--bad);border-color:transparent}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.ctl{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:315px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🐠 Fish School <span class="badge" id="blevel">deadline 2000ms</span></h1>
    <p class="sub">Which way is the <b>middle</b> fish (gold) swimming? Tap that arrow — ignore the other fish!</p>
  </div>
  <div id="stage"><div id="school"></div><div id="timerbar"></div></div>
  <div id="cue">👀</div>
  <div class="ans" id="ans">
    <button data-d="L">⬅️</button>
    <button data-d="R">➡️</button>
  </div>
  <div class="row">
    <button class="pri ctl" id="go">▶ Watch how it works</button>
    <button class="ctl" id="replay" disabled>↺ Replay demo</button>
    <label class="sub" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="adapt" checked> speed-up when fast+accurate</label>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>

<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const stage=$("#stage"),school=$("#school"),cue=$("#cue"),bar=$("#timerbar"),ansBtns=[...document.querySelectorAll("#ans button")];
let deadline=2000;
const T={phase:"idle",trial:0,deadline:2000,
  rt:{cong:[],incong:[],neut:[]},acc:{cong:[0,0],incong:[0,0],neut:[0,0]},
  lapses:0,slow:0,postErrRT:[],baseRT:[],lastErr:false,log:[]};
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function med(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m;}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop();}
function accPct(p){return (p[1])?Math.round(100*p[0]/p[1]):0;}
function render(){
  const conEff=Math.round(med(T.rt.incong)-med(T.rt.cong));
  const allRT=[...T.rt.cong,...T.rt.incong,...T.rt.neut];
  const pes=Math.round(mean(T.postErrRT)-mean(T.baseRT))||0;
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-flanker-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>trials</span><b>${T.trial}</b></div>
  <div class="kv"><span>deadline</span><b>${T.deadline} ms</b></div>
  <h2>RT by condition <span class="m">M-RT</span></h2>
  <div class="kv"><span>congruent</span><b>${Math.round(med(T.rt.cong))} ms</b></div>
  <div class="kv"><span>incongruent</span><b>${Math.round(med(T.rt.incong))} ms</b></div>
  <div class="kv"><span>neutral</span><b>${Math.round(med(T.rt.neut))} ms</b></div>
  <div class="kv"><span>flanker effect <span class="m">M-CONGEFF</span></span><b>${isNaN(conEff)?0:conEff} ms</b></div>
  <h2>Accuracy <span class="m">M-ACC</span></h2>
  <div class="kv"><span>congruent</span><b>${accPct(T.acc.cong)}%</b></div>
  <div class="kv"><span>incongruent</span><b>${accPct(T.acc.incong)}%</b></div>
  <h2>Consistency & control</h2>
  <div class="kv"><span>RT variability CV <span class="m">M-RTVAR</span></span><b>${cv(allRT).toFixed(2)}</b></div>
  <div class="kv"><span>lapses(&gt;1s) <span class="m">M-LAPSE</span></span><b>${T.lapses}</b></div>
  <div class="kv"><span>missed deadline</span><b>${T.slow}</b></div>
  <div class="kv"><span>post-error slowing <span class="m">M-POSTERR</span></span><b>${pes>0?"+":""}${pes} ms</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();

function mkFish(dir,center){const f=document.createElement("div");f.className="fish"+(center?" center":"")+(dir==="L"?" left":"");
  f.innerHTML='<div class="tail"></div><div class="eye"></div>';return f;}
function mkNeutral(){const n=document.createElement("div");n.className="neutral";return n;}
function buildSchool(centerDir,cond){
  school.innerHTML="";
  const flankDir = cond==="cong"?centerDir:(centerDir==="L"?"R":"L");
  for(let i=0;i<2;i++) school.appendChild(cond==="neut"?mkNeutral():mkFish(flankDir,false));
  school.appendChild(mkFish(centerDir,true));
  for(let i=0;i<2;i++) school.appendChild(cond==="neut"?mkNeutral():mkFish(flankDir,false));
}

let cur=null,rafId=null;
function startTimerBar(dur){const t0=performance.now();function step(){const p=Math.min(1,(performance.now()-t0)/dur);bar.style.width=(p*100)+"%";bar.style.background=p>0.75?"var(--bad)":"var(--accent)";if(p<1&&cur&&!cur.done)rafId=requestAnimationFrame(step);}rafId=requestAnimationFrame(step);}

function respond(dir,btn){
  if(!cur||cur.done)return;cur.done=true;cancelAnimationFrame(rafId);
  cur.rt=performance.now()-cur.onset;cur.resp=dir;
  const ok=dir===cur.dir;btn.classList.add(ok?"flash":"wrong");setTimeout(()=>btn.classList.remove("flash","wrong"),200);
  cur.ok=ok;cur.resolve();
}
ansBtns.forEach(b=>b.addEventListener("pointerdown",()=>respond(b.dataset.d,b)));

async function trial(scored){
  const dir=Math.random()<.5?"L":"R";
  const r=Math.random();const cond=r<0.4?"cong":(r<0.8?"incong":"neut");
  buildSchool(dir,cond);
  cue.textContent="";bar.style.width="0";
  await sleep(350); // fixation gap
  school.classList.add("show");
  cur={dir,cond,onset:performance.now(),done:false,rt:null,ok:false,resp:null,resolve:null};
  startTimerBar(deadline);
  await new Promise(res=>{cur.resolve=res;setTimeout(()=>{if(!cur.done){cur.done=true;cancelAnimationFrame(rafId);cur.timeout=true;res();}},deadline);});
  school.classList.remove("show");
  if(scored){
    T.trial++;
    if(cur.timeout){T.slow++;cue.textContent="🐢";T.lastErr=true;logE(`${cond}: too slow`);}
    else{
      const key=cond==="cong"?"cong":cond==="incong"?"incong":"neut";
      T.acc[key][1]++;if(cur.ok){T.acc[key][0]++;T.rt[key].push(cur.rt);if(cur.rt>1000)T.lapses++;(T.lastErr?T.postErrRT:T.baseRT).push(cur.rt);}
      cue.textContent=cur.ok?"✅":"❌";T.lastErr=!cur.ok;
      logE(`${cond} ${dir}: ${cur.resp}=${cur.ok?"ok":"err"} ${Math.round(cur.rt)}ms`);
    }
  }
  render();await sleep(500);cue.textContent="";bar.style.width="0";
}

async function runBlock(scored,len){for(let i=0;i<len;i++)await trial(scored);}

// ghost-hand demo: incongruent, center faces RIGHT, flankers LEFT -> tap ➡️
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;$("#replay").disabled=true;
  buildSchool("R","incong");await sleep(300);school.classList.add("show");
  const ghost=document.createElement("div");ghost.textContent="👆";ghost.style.cssText="position:fixed;font-size:30px;z-index:9;transition:left .4s,top .4s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  const rbtn=ansBtns[1];const r=rbtn.getBoundingClientRect();
  await sleep(500);ghost.style.opacity="1";ghost.style.left=(r.left+r.width/2-12)+"px";ghost.style.top=(r.top+8)+"px";
  await sleep(500);rbtn.classList.add("flash");cue.textContent="✅";await sleep(260);rbtn.classList.remove("flash");school.classList.remove("show");
  await sleep(400);ghost.remove();
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice one";$("#go").onclick=warmup;
  $("#phasehint").textContent="Only the MIDDLE fish matters. Practice one (not scored).";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;

async function warmup(){T.phase="warm-up (unscored)";render();$("#go").disabled=true;$("#replay").disabled=true;
  await runBlock(false,4);T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Start scored game";$("#go").onclick=startScored;
  $("#phasehint").textContent="These count. Stay accurate — speed only helps if you're right.";render();}
async function startScored(){T.phase="scored";render();$("#go").disabled=true;$("#replay").disabled=true;
  const nBlocks=2;
  for(let bk=0;bk<nBlocks;bk++){
    await runBlock(true,10);
    if($("#adapt").checked){const inc=accPct(T.acc.incong);if(inc>=85&&med(T.rt.incong)<deadline*0.6){deadline=Math.max(700,deadline-350);T.deadline=deadline;$("#blevel").textContent="deadline "+deadline+"ms";logE(`level up → deadline ${deadline}ms`);}}
    render();await sleep(500);
  }
  T.phase="done";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Play again";$("#go").onclick=startScored;
  $("#phasehint").textContent=`Done. Flanker effect = ${Math.round(med(T.rt.incong)-med(T.rt.cong))||0}ms (smaller = better interference control). Consistency beats raw speed.`;
  cue.textContent="🏁";render();}
</script>
</body>
</html>
