<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CX-diverge-01 — Brainstorm Blaster</title>
<style>
  :root{--bg:#0d1a1f;--card:#12262d;--ink:#eafff7;--muted:#8fc4bd;--acc:#38e6c5;--gold:#ffd35c;}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(circle at 70% 0%,#17323b,#0d1a1f)}
  header{padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  .badge{font-size:12px;color:var(--muted);border:1px solid #2f5a55;padding:2px 8px;border-radius:999px}
  .wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:0 20px 30px;max-width:1100px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .stage{background:var(--card);border-radius:18px;padding:18px;min-height:440px;position:relative;overflow:hidden}
  .phaseTag{position:absolute;top:12px;right:14px;font-size:12px;color:var(--gold);background:#22331f;border:1px solid #4a5a1f;padding:3px 10px;border-radius:999px}
  .obj{font-size:74px;text-align:center;margin:4px 0}
  .prompt{text-align:center;color:var(--muted);min-height:22px}
  .entry{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
  input[type=text]{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid #2f5a55;background:#0c1c20;color:var(--ink);width:min(340px,70vw)}
  button{font:inherit;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600}
  .add{background:var(--acc);color:#04231d}
  .ghost-btn{background:#20424a;color:#d7fff5}
  .modeToggle{position:absolute;top:12px;left:14px;display:flex;gap:6px}
  .modeToggle button{padding:6px 10px;font-size:13px;background:#183036;color:#bfeee6;border:1px solid #2f5a55}
  .modeToggle button.on{background:var(--acc);color:#04231d}
  .palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
  .palette div{font-size:30px;background:#0c1c20;border:1px solid #2f5a55;border-radius:12px;padding:6px 8px;cursor:pointer}
  .field{position:relative;height:220px;margin-top:8px;border-top:1px dashed #2f5a55}
  .bubble{position:absolute;bottom:0;background:#0c1c20;border:2px solid var(--acc);color:var(--ink);padding:6px 12px;border-radius:999px;animation:rise 6s linear forwards;white-space:nowrap;font-size:14px}
  .bubble .cat{font-size:10px;color:var(--gold);display:block;text-align:center}
  @keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-210px);opacity:.15}}
  .combo{position:absolute;bottom:8px;left:14px;font-weight:800;color:var(--gold);font-size:20px}
  .ghost{position:absolute;font-size:40px;pointer-events:none;transition:left .8s ease,top .8s ease;z-index:6;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
  .tele{background:#0c1c20;border:1px solid #244b46;border-radius:18px;padding:14px;height:fit-content;position:sticky;top:12px}
  .tele h3{margin:0 0 8px;font-size:14px;letter-spacing:.5px;color:var(--gold)}
  .metrics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:12px;background:#12262d;border:1px solid #2f5a55;border-radius:8px;padding:4px 8px}
  .chip b{color:var(--gold)}
  .log{font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#a9e6dc;max-height:220px;overflow:auto;background:#08171b;border-radius:10px;padding:8px}
  .log div{border-bottom:1px solid #14282d;padding:1px 0}
  .note{font-size:11px;color:var(--muted);margin-top:8px}
  .cta{display:flex;gap:10px;justify-content:center;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>💡 Brainstorm Blaster</h1>
  <span class="badge">CX-diverge-01</span>
  <span class="badge">bands: K–1 · 2–3 · 4–5 · 6–8</span>
  <span class="badge">divergent thinking</span>
</header>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="modeToggle" id="modeToggle" style="display:none">
      <button id="mText" class="on">Aa type</button>
      <button id="mPic">😀 tap</button>
    </div>
    <div class="phaseTag" id="phaseTag">demo</div>
    <div class="obj" id="obj">👟</div>
    <div class="prompt" id="prompt"></div>
    <div class="entry" id="entry" style="display:none">
      <input type="text" id="idea" placeholder="a different use…" autocomplete="off">
      <button class="add" id="addBtn">Blast! →</button>
    </div>
    <div class="palette" id="palette" style="display:none"></div>
    <div class="field" id="field"><div class="combo" id="combo"></div></div>
    <div class="ghost" id="ghost" style="display:none">👆</div>
    <div class="cta" id="cta"></div>
  </div>
  <div class="tele">
    <h3>LIVE TELEMETRY</h3>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="note">M-IDEAFLU (idea count), M-FLEX (distinct categories), M-ORIG (rare vs common), M-ELAB (words/idea), M-PERSIST (ideas after the easy ones).</div>
  </div>
</div>
<script>
const T={ev:[],m:{},t0:performance.now(),
  now(){return Math.round(performance.now()-this.t0)},
  log(a,d){const t=this.now();this.ev.push(Object.assign({t,a},d||{}));
    const el=document.getElementById('log');const line=document.createElement('div');
    line.textContent='+'+(t/1000).toFixed(2)+'s  '+a+(d?'  '+JSON.stringify(d):'');el.prepend(line);},
  set(k,v){this.m[k]=v;this.render();},
  render(){document.getElementById('metrics').innerHTML=
    Object.entries(this.m).map(([k,v])=>'<span class="chip"><b>'+k+'</b> '+v+'</span>').join('');}};
const $=s=>document.querySelector(s);
const field=$('#field'),ghost=$('#ghost'),phaseTag=$('#phaseTag');

/* generic category dictionary */
const CATS={tool:['hammer','dig','scrape','hook','open','fix','pry','cut','tool','poke','unlock','reset','screw','lever','key'],
  art:['draw','paint','decorate','art','jewel','necklace','craft','color','ring','earring','sculpt'],
  play:['toy','game','play','spin','fly','doll','catapult','sling','launch','race','marble'],
  build:['build','bridge','tower','hold','fasten','clip','connect','chain','fence','house','stack','anchor'],
  wear:['hair','wear','clothes','pin','belt','button','zipper','shoe','hat'],
  home:['clean','hang','holder','bookmark','stand','prop','plug','stopper','weight','curtain'],
  food:['eat','food','stir','cook','plate','spoon','fork','straw','cup'],
  story:['pet','animal','monster','alien','magic','rocket','boat','robot','friend']};
function categorize(txt){const t=txt.toLowerCase();
  for(const c in CATS){if(CATS[c].some(k=>t.includes(k)))return c;}return 'novel';}

const PROMPTS={
  demo:{obj:'👟',label:'shoe'},
  warm:{obj:'🥄',label:'spoon',common:['eat','food','stir','soup']},
  item:{obj:'📎',label:'paperclip',common:['hold papers','clip','clip papers','bookmark','paper']}
};
const PIC_IDEAS=[['🔨','hammer','tool'],['⛵','boat','story'],['🌸','flower pot','home'],['🎣','fishing hook','tool'],
  ['👑','crown','art'],['🚀','rocket','story'],['🎨','paintbrush','art'],['🐛','pet worm','story'],
  ['🎯','dart','play'],['🔑','key','tool']];

let ideas=[],cats=new Set(),orig=0,words=0,combo=0,cur=null,scored=false,startT=0;
T.set('phase','demo');T.set('ideas_M-IDEAFLU',0);T.set('categories_M-FLEX',0);T.set('original_M-ORIG',0);T.set('avg_words_M-ELAB','0');

function addIdea(txt,cat){
  txt=txt.trim();if(!txt)return;
  const norm=txt.toLowerCase();
  if(ideas.some(i=>i.norm===norm)){T.log('duplicate_ignored',{txt});flash('#ff6b8a');return;}
  cat=cat||categorize(txt);
  const isOrig=scored?!cur.common.some(c=>norm.includes(c)):true;
  const w=txt.split(/\s+/).length;
  ideas.push({txt,norm,cat,isOrig,w,t:T.now()});
  const newCat=!cats.has(cat);cats.add(cat);
  if(scored){if(isOrig)orig++;words+=w;
    if(newCat){combo++;$('#combo').textContent='🔥 x'+combo+' new kind!';}else{$('#combo').textContent='';}
    T.set('ideas_M-IDEAFLU',ideas.length);T.set('categories_M-FLEX',cats.size);
    T.set('original_M-ORIG',orig);T.set('avg_words_M-ELAB',(words/ideas.length).toFixed(1));
    const late=ideas.filter(i=>i.t>15000).length;T.set('ideas_after_15s_M-PERSIST',late);
  }
  T.log(scored?'idea':'warmup_idea',{txt,cat,original:isOrig,words:w});
  bubble(txt,cat,isOrig);
}
function bubble(txt,cat,isOrig){
  const b=document.createElement('div');b.className='bubble';
  b.style.left=(10+Math.random()*70)+'%';
  b.style.borderColor=isOrig?'var(--gold)':'var(--acc)';
  b.innerHTML=(isOrig?'⭐ ':'')+txt+'<span class="cat">'+cat+'</span>';
  field.appendChild(b);setTimeout(()=>b.remove(),6000);
}
function flash(c){$('#idea').style.borderColor=c;setTimeout(()=>$('#idea').style.borderColor='',400);}

/* ---- flow ---- */
function runGhost(){
  phaseTag.textContent='demo';$('#obj').textContent=PROMPTS.demo.obj;ghost.style.display='block';
  const demos=[['👟 as a hammer','tool'],['🛶 boat for a mouse','story'],['🌸 flower pot','home']];
  let i=0;const stage=$('#stage').getBoundingClientRect();
  ghost.style.left='50%';ghost.style.top='60%';
  const step=()=>{if(i>=demos.length){ghost.style.display='none';startWarm();return;}
    ghost.style.left=(30+i*18)+'%';ghost.style.top=(55-i*4)+'%';
    setTimeout(()=>{bubble(demos[i][0],demos[i][1],true);i++;setTimeout(step,1600);},700);};
  setTimeout(step,700);
}
function startWarm(){
  scored=false;cur=PROMPTS.warm;phaseTag.textContent='warm-up (practice)';
  $('#obj').textContent=cur.obj;$('#prompt').textContent='Practice: how many uses for a '+cur.label+'? (not scored)';
  $('#entry').style.display='flex';$('#modeToggle').style.display='flex';
  T.set('phase','warm-up');T.log('phase_warmup');
  let count=0;const onAdd=()=>{count++;if(count>=2){$('#cta').innerHTML='<button class="add" onclick="startItem()">I\'m ready → real one</button>';}};
  bindEntry(onAdd);
}
function startItem(){
  ideas=[];cats=new Set();orig=0;words=0;combo=0;scored=true;cur=PROMPTS.item;startT=T.now();
  phaseTag.textContent='scored';$('#cta').innerHTML='';$('#combo').textContent='';
  $('#obj').textContent=cur.obj;$('#prompt').innerHTML='<b>How many different uses for a '+cur.label+'?</b> Keep going — different <i>kinds</i> of ideas score more!';
  T.set('phase','scored');T.set('ideas_M-IDEAFLU',0);T.set('categories_M-FLEX',0);T.set('original_M-ORIG',0);
  T.log('phase_scored',{prompt:cur.label});
  bindEntry(()=>{});
  $('#cta').innerHTML='<button class="ghost-btn" onclick="finish()">Done → results</button>';
}
function bindEntry(onAdd){
  $('#addBtn').onclick=()=>{const v=$('#idea').value;if(v.trim()){addIdea(v);$('#idea').value='';onAdd();}};
  $('#idea').onkeydown=e=>{if(e.key==='Enter'){$('#addBtn').click();}
    if(!$('#idea').dataset.f){$('#idea').dataset.f=1;T.log('first_action_typed');}};
  $('#idea').oninput=()=>{if(!$('#idea').dataset.f){$('#idea').dataset.f=1;T.log('first_action',{});}};
  // picture mode
  const pal=$('#palette');pal.innerHTML='';
  PIC_IDEAS.forEach(([emo,label,cat])=>{const d=document.createElement('div');d.textContent=emo;d.title=label;
    d.onclick=()=>{addIdea(emo+' '+label,cat);onAdd();};pal.appendChild(d);});
  $('#mText').onclick=()=>{$('#mText').classList.add('on');$('#mPic').classList.remove('on');$('#entry').style.display='flex';pal.style.display='none';T.log('mode_text');};
  $('#mPic').onclick=()=>{$('#mPic').classList.add('on');$('#mText').classList.remove('on');$('#entry').style.display='none';pal.style.display='flex';T.log('mode_picture');};
}
function finish(){
  const late=ideas.filter(i=>i.t-startT>15000).length;
  T.log('SESSION_END',{fluency:ideas.length,flexibility:cats.size,originality:orig,avg_words:+(words/(ideas.length||1)).toFixed(1),late_ideas:late});
  $('#prompt').innerHTML='<b style="color:var(--gold);font-size:20px">Nice brainstorming! 🎉</b>';
  $('#entry').style.display='none';$('#palette').style.display='none';$('#modeToggle').style.display='none';
  $('#cta').innerHTML='<button class="add" onclick="location.reload()">↺ Play again</button>';
  $('#combo').textContent='';
  $('#prompt').innerHTML+='<div class="note">Fluency '+ideas.length+' · Flexibility '+cats.size+' categories · '+orig+
    ' rare ideas · '+(words/(ideas.length||1)).toFixed(1)+' words/idea. <b>Flexibility & originality</b> — spanning many <i>kinds</i> of ideas — are the least-coachable tail signals.</div>';
  T.set('phase','done');
}
window.addEventListener('blur',()=>T.log('off_task_blur (M-ENGAGE)'));
runGhost();
</script>
</body>
</html>
