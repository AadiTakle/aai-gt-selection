<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CX-diverge-01 · Brainstorm Blaster</title>
<style>
:root{
  --ink:#16313a;--paper:#fffef8;--teal:#25aa9b;--blue:#368ed0;
  --pink:#ed6d91;--gold:#efb63d;--line:#d6e7e5;--tel:#0d1c23;
  --tel2:#142b35;--key:#78ffd0;--dim:#789ca5;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;display:flex;color:var(--ink);
  font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(circle at 13% 8%,#d8fff2,transparent 27%),
    linear-gradient(145deg,#e7fbff,#f5f7e9 58%,#fff0dc);
}
#wrap{
  flex:1;min-width:0;padding:17px;display:flex;flex-direction:column;
  align-items:center;gap:9px;
}
#badge{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#718f94}
#phasecue{height:37px;font-size:31px}
#stagecard{
  width:min(710px,100%);background:var(--paper);border-radius:30px;padding:18px;
  box-shadow:0 24px 58px -35px #234c55;display:flex;flex-direction:column;
  align-items:center;gap:12px;border:1px solid #fff;overflow:hidden;
}
#promptCard{
  width:100%;min-height:112px;border:3px solid #d8ece9;border-radius:23px;
  background:radial-gradient(circle at 50% 40%,#fff 0 20%,#e9faf7);
  display:flex;justify-content:center;align-items:center;gap:18px;position:relative;
}
#promptIcon{font-size:62px;filter:drop-shadow(0 5px 0 #cfe8e4)}
#promptWord{font:900 30px/1.05 ui-rounded,"Arial Rounded MT Bold",system-ui;color:#1f716c}
#spark{position:absolute;right:18px;top:12px;font-size:23px;letter-spacing:4px;color:var(--gold)}
#entry{width:100%;display:grid;grid-template-columns:1fr 58px;gap:8px}
#idea{
  width:100%;height:54px;border:3px solid #cfe3e1;border-radius:17px;background:#fff;
  color:var(--ink);padding:8px 15px;font:700 17px system-ui;outline:none;
}
#idea:focus{border-color:var(--teal);box-shadow:0 0 0 4px #d9f6f0}
#add{
  border:0;border-radius:17px;background:var(--teal);color:#fff;cursor:pointer;
  font:900 23px system-ui;
}
#field{
  width:100%;height:206px;border-top:2px dashed #c9dedb;position:relative;
  overflow:hidden;background:linear-gradient(transparent,#f3fbf8);border-radius:0 0 18px 18px;
}
.bubble{
  position:absolute;bottom:-44px;max-width:190px;padding:7px 12px;border-radius:20px;
  border:2px solid var(--teal);background:#fff;color:var(--ink);
  font:700 13px system-ui;animation:rise 8s linear forwards;box-shadow:0 7px 15px -12px #173d44;
}
.bubble.rare{border-color:var(--gold);background:#fff9df}
.bubble .cat{display:block;text-align:center;color:#66918e;font:800 9px ui-monospace,monospace;text-transform:uppercase}
@keyframes rise{0%{transform:translateY(0);opacity:0}8%{opacity:1}75%{opacity:1}100%{transform:translateY(-225px);opacity:.25}}
#combo{
  position:absolute;left:12px;bottom:8px;color:#d78c13;font:900 17px system-ui;z-index:3;
}
#tools{display:flex;gap:11px}
#tools button{
  height:50px;border:0;border-radius:16px;cursor:pointer;font:800 21px system-ui;
  background:#e7f4f2;color:var(--teal);
}
#replay{width:52px}#submit{width:86px;background:var(--blue)!important;color:#fff!important;opacity:.35;pointer-events:none}
#submit.ready{opacity:1;pointer-events:auto;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
button:focus-visible{outline:4px solid #168dff;outline-offset:2px}
#ghost{
  position:fixed;left:0;top:0;opacity:0;z-index:50;pointer-events:none;font-size:38px;
  transition:transform .42s cubic-bezier(.2,.7,.2,1),opacity .2s;filter:drop-shadow(0 4px 4px #0004);
}
#ghost.show{opacity:1}
#telemetry{
  width:345px;flex:0 0 345px;min-height:100vh;background:var(--tel);
  color:#c7e4e7;display:flex;flex-direction:column;
  font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
}
#telemetry h3{
  margin:0;padding:13px 14px;background:var(--tel2);color:#fff;
  font:800 12px system-ui;letter-spacing:.1em;text-transform:uppercase;
}
#difficulty{padding:10px 13px;border-bottom:1px solid #25414a}
.diffTop{display:flex;justify-content:space-between;color:#9ebbc1}
.diffTrack{height:8px;background:#203941;border-radius:8px;overflow:hidden;margin-top:6px}
#diffFill{height:100%;width:20%;background:linear-gradient(90deg,#25aa9b,#51e0bd,#efbd47);transition:.3s}
#mlist{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:103px 1fr;gap:7px}
.mid{color:var(--key);font-weight:800}.mval{color:#fff}
.mname{grid-column:1/3;color:var(--dim);font-size:10px;margin-top:-3px}
#logwrap{border-top:1px solid #25414a;margin-top:auto}
#logwrap b{display:block;padding:8px 12px 3px;color:#7899a1;font-size:10px}
#log{height:185px;overflow:auto;padding:0 12px 12px}
#log div{border-bottom:1px dotted #25414a;padding:3px 0}
#log .t{color:#50757d}
@media(max-width:860px){
  body{flex-direction:column}#telemetry{width:100%;min-height:0;height:310px;flex:none}
}
@media(max-width:480px){#promptIcon{font-size:48px}#promptWord{font-size:24px}#field{height:180px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="wrap">
  <div id="badge">CX-diverge-01 · Brainstorm Blaster</div>
  <div id="phasecue">👁️</div>
  <section id="stagecard">
    <div id="promptCard">
      <span id="promptIcon">👟</span><span id="promptWord">shoe</span><span id="spark">✦✦✦</span>
    </div>
    <div id="entry">
      <input id="idea" type="text" autocomplete="off" placeholder="…" aria-label="idea">
      <button id="add" aria-label="add idea">↵</button>
    </div>
    <div id="field"><div id="combo"></div></div>
    <div id="tools">
      <button id="replay" aria-label="replay">↻</button>
      <button id="submit" aria-label="next prompt">✓</button>
    </div>
  </section>
</main>
<aside id="telemetry">
  <h3>Live telemetry · per-child</h3>
  <div id="difficulty">
    <div class="diffTop"><span>DIFFICULTY</span><span id="diffLabel">1 / 5</span></div>
    <div class="diffTrack"><div id="diffFill"></div></div>
  </div>
  <div id="mlist"></div>
  <div id="logwrap"><b>EVENT LOG · TYPE + ENTER</b><div id="log"></div></div>
</aside>
<div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const PROMPTS={
  1:[
    {icon:'📎',word:'paperclip',bank:[
      ['hold paper|clip paper','organize',.44],['hook|fish','tool',.12],['necklace|bracelet|jewelry','art',.08],
      ['reset|phone slot|unlock','technology',.035],['zipper','repair',.06],['tiny sculpture|shape','art',.045]]},
    {icon:'🥤',word:'cup',bank:[
      ['drink|water','food',.46],['plant|flower pot','nature',.18],['scoop|dig','tool',.11],
      ['drum|music','music',.06],['tower|stack','play',.08],['bug home|tiny house','story',.035]]}
  ],
  2:[
    {icon:'▣',word:'cardboard box',bank:[
      ['store|storage|hold things','organize',.40],['fort|castle','play',.18],['robot|costume','story',.10],
      ['planter|plant','nature',.08],['drum|instrument','music',.055],['sled|slide','motion',.035]]},
    {icon:'〰',word:'string',bank:[
      ['tie|fasten','tool',.38],['bracelet|necklace','art',.17],['jump rope|game','play',.13],
      ['map|trail|line','symbol',.06],['guitar|instrument','music',.05],['trap|alarm','invention',.025]]}
  ],
  3:[
    {icon:'▧',word:'blanket',bank:[
      ['warm|cover|sleep','comfort',.43],['tent|fort','play',.18],['cape|costume','story',.11],
      ['picnic|ground','outdoors',.09],['carry|sling','tool',.05],['movie screen|shadow show','art',.025]]},
    {icon:'▰',word:'brick',bank:[
      ['build|wall|house','build',.42],['weight|hold down','tool',.16],['doorstop','home',.12],
      ['paint|stamp','art',.07],['heat|warm','science',.05],['tiny stage|toy city','story',.025]]}
  ],
  4:[
    {icon:'◯',word:'circle',bank:[
      ['wheel|roll','motion',.28],['sun|moon|planet','nature',.20],['face|head','body',.16],
      ['target|game','play',.10],['portal|window','story',.045],['signal|code|map','symbol',.035]]},
    {icon:'0',word:'zero',bank:[
      ['nothing|none','number',.35],['circle|shape','shape',.25],['start|reset','time',.10],
      ['portal|door','story',.045],['balance|middle','system',.04],['secret code|placeholder','symbol',.03]]}
  ],
  5:[
    {icon:'∿',word:'silence',bank:[
      ['rest|sleep|calm','wellbeing',.25],['pause|music','music',.16],['secret|hide','story',.12],
      ['think|idea space','mind',.10],['warning|signal','communication',.055],['blank canvas|room for sound','metaphor',.025]]},
    {icon:'◒',word:'shadow',bank:[
      ['shade|cool','nature',.24],['puppet|show','story',.18],['clock|tell time','time',.11],
      ['trace|draw','art',.10],['measure|height','science',.055],['secret message|double','communication',.03]]}
  ]
};
const WARM={icon:'🥄',word:'spoon',bank:[
  ['eat|soup','food',.46],['stir|mix','tool',.28],['mirror|reflect','science',.07],
  ['drum|music','music',.08],['catapult|launch','play',.04],['tiny boat','story',.035]
]};
const DEMO={icon:'👟',word:'shoe',bank:[
  ['hammer','tool',.10],['boat','story',.04],['flower pot|plant','nature',.08]
]};
const GENERIC={
  tool:['cut','dig','hold','open','fix','carry','lift','scrape','hammer','hook'],
  art:['draw','paint','decorate','sculpt','jewelry','design','pattern'],
  play:['game','toy','race','throw','spin','play','fort'],
  story:['magic','alien','dragon','tiny','pretend','portal','monster'],
  nature:['plant','animal','water','sun','garden','bird','tree'],
  music:['music','sound','drum','song','instrument'],
  build:['build','bridge','tower','wall','connect'],
  science:['measure','experiment','heat','light','signal']
};
const T={
  ideas:0,categories:new Set(),origSum:0,origN:0,words:0,persist:0,
  blur:0,activeMs:0,activeStart:Date.now(),lastAction:Date.now(),
  itemStart:Date.now(),maxSolved:0
};
let phase='demo',level=1,scoredIndex=0,prompt=DEMO,current=[],currentCats=new Set();
let required=2,locked=true;
function normalize(text){
  return text.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\b(a|an|the|to|for|as)\b/g,' ').replace(/\s+/g,' ').trim();
}
function jaccard(a,b){
  const A=new Set(a.split(' ')),B=new Set(b.split(' ')),both=[...A].filter(x=>B.has(x)).length;
  return both/Math.max(1,new Set([...A,...B]).size);
}
function scoreText(text){
  const norm=normalize(text);let hit=null;
  for(const entry of prompt.bank){
    if(entry[0].split('|').some(term=>norm.includes(term))){hit={category:entry[1],frequency:entry[2]};break;}
  }
  if(!hit){
    let category='other';
    for(const [cat,terms] of Object.entries(GENERIC)){
      if(terms.some(term=>norm.includes(term))){category=cat;break;}
    }
    hit={category,frequency:category==='other'?.12:.07};
  }
  return {norm,category:hit.category,frequency:hit.frequency,originality:Math.round((1-hit.frequency)*100)};
}
function isDuplicate(norm){return current.some(x=>x.norm===norm||jaccard(x.norm,norm)>.82);}
function originality(){return T.origN?Math.round(T.origSum/T.origN):0;}
function engagement(){
  const active=T.activeMs+(document.hasFocus()&&phase==='scored'?Date.now()-T.activeStart:0);
  const idle=Math.max(0,Date.now()-T.lastAction-8000);
  return `${Math.round(active/1000)}s active · ${T.blur} blur · ${Math.round(idle/1000)}s idle`;
}
const METERS=[
  {id:'M-IDEAFLU',name:'Distinct valid ideas',get:()=>`${T.ideas}`},
  {id:'M-FLEX',name:'Distinct semantic categories',get:()=>`${T.categories.size}`},
  {id:'M-ORIG',name:'Mean inverse response-bank frequency',get:()=>T.origN?`${originality()} / 100`:'—'},
  {id:'M-ELAB',name:'Mean words per idea',get:()=>T.ideas?`${(T.words/T.ideas).toFixed(1)}`:'—'},
  {id:'M-PERSIST',name:'Ideas beyond first two / after 15s',get:()=>`${T.persist}`},
  {id:'M-ENGAGE',name:'Active / blur / idle state',get:()=>engagement()}
];
function buildMeters(){
  $('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');
}
function renderMeters(){
  METERS.forEach(m=>{const el=$(`#v_${m.id}`);if(el)el.textContent=m.get();});
  $('#diffLabel').textContent=`${level} / 5 · ${required}+ ideas`;
  $('#diffFill').style.width=`${level*20}%`;
}
function log(message){
  const d=document.createElement('div');
  d.innerHTML=`<span class="t">+${Date.now()-T.itemStart}ms</span> ${message}`;
  $('#log').appendChild(d);$('#log').scrollTop=$('#log').scrollHeight;
}
function bubble(text,category,rare){
  const b=document.createElement('div');b.className=`bubble ${rare?'rare':''}`;
  b.style.left=`${5+(current.length*23)%68}%`;
  b.innerHTML=`${rare?'✦ ':''}${text}<span class="cat">${category}</span>`;
  $('#field').appendChild(b);setTimeout(()=>b.remove(),8100);
}
function touch(){T.lastAction=Date.now();renderMeters();}
function addIdea(text,fromDemo=false){
  text=text.trim();if(!text||locked&&!fromDemo)return false;
  const scored=scoreText(text);
  if(isDuplicate(scored.norm)){
    $('#idea').style.borderColor='var(--pink)';setTimeout(()=>$('#idea').style.borderColor='',350);
    log(`near-duplicate ignored · "${text}"`);return false;
  }
  const words=text.split(/\s+/).filter(Boolean).length,entry={text,...scored,words,time:Date.now()-T.itemStart};
  current.push(entry);currentCats.add(entry.category);
  if(phase==='scored'){
    T.ideas++;T.categories.add(entry.category);T.origSum+=entry.originality;T.origN++;T.words+=words;
    if(current.length>2||entry.time>15000)T.persist++;
  }
  bubble(text,entry.category,entry.originality>=92);
  $('#combo').textContent=currentCats.size>1?`✦ ${currentCats.size} kinds`:'';
  log(`${phase==='scored'?'idea':'practice'} · "${text}" · ${entry.category} · orig ${entry.originality}`);
  $('#submit').classList.toggle('ready',current.length>=required);touch();return true;
}
function submit(){
  if(!$('#submit').classList.contains('ready')||locked)return;
  locked=true;touch();
  if(phase==='warmup'){log('warm-up prompt · UNSCORED');setTimeout(startScored,650);return;}
  const success=current.length>=3&&currentCats.size>=2;
  log(`prompt auto-score · fluency ${current.length} · flexibility ${currentCats.size} · mean originality ${Math.round(current.reduce((s,x)=>s+x.originality,0)/current.length)}`);
  T.activeMs+=Date.now()-T.activeStart;prompt.result=success;phase='between';setTimeout(nextItem,700);
}
function nextItem(){
  if(prompt.result){T.maxSolved=Math.max(T.maxSolved,level);level=Math.min(5,level+1);}
  else level=Math.max(1,level-1);
  scoredIndex++;renderMeters();
  if(scoredIndex>=5)finish();else startScored();
}
function pickPrompt(){
  const list=PROMPTS[level],index=(scoredIndex+level)%list.length;
  return list[index];
}
function resetPrompt(next,kind){
  prompt=next;current=[];currentCats=new Set();locked=false;T.itemStart=Date.now();T.lastAction=Date.now();
  required=kind==='warmup'?2:(level>=4?3:2);
  $('#promptIcon').textContent=prompt.icon;$('#promptWord').textContent=prompt.word;
  $('#idea').value='';$('#field').querySelectorAll('.bubble').forEach(x=>x.remove());
  $('#combo').textContent='';$('#submit').classList.remove('ready');$('#idea').disabled=false;
  $('#idea').focus();renderMeters();
}
function startWarmup(){
  phase='warmup';resetPrompt(WARM,'warmup');$('#phasecue').textContent='⭐';
  log('— WARM-UP · UNSCORED PROMPT —');
}
function startScored(){
  phase='scored';T.activeStart=Date.now();resetPrompt(pickPrompt(),'scored');$('#phasecue').textContent='🎯';
  log(`— SCORED ${scoredIndex+1}/5 · level ${level} · ${prompt.word} —`);
}
function finish(){
  if(phase==='scored'&&document.hasFocus())T.activeMs+=Date.now()-T.activeStart;
  phase='done';locked=true;$('#phasecue').textContent='🏆';
  $('#stagecard').innerHTML='<div style="font-size:100px;padding:70px 0">💡</div><button id="again" style="width:58px;height:50px;border:0;border-radius:16px;font-size:22px" aria-label="again">↻</button>';
  $('#again').onclick=()=>location.reload();
  log(`— DONE · fluency ${T.ideas} · flexibility ${T.categories.size} · originality ${originality()} —`);renderMeters();
}
const ghost=$('#ghost');
function center(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){
  const p=center(el);ghost.style.transform=`translate(${p.x-12}px,${p.y-8}px)`;await sleep(350);
}
async function typeGhost(text){
  $('#idea').value='';for(const ch of text){$('#idea').value+=ch;await sleep(35);}
  await sleep(120);addIdea(text,true);$('#idea').value='';
}
async function runDemo(){
  phase='demo';locked=false;prompt=DEMO;current=[];currentCats=new Set();required=3;T.itemStart=Date.now();
  $('#phasecue').textContent='👁️';$('#promptIcon').textContent=prompt.icon;$('#promptWord').textContent=prompt.word;
  $('#submit').classList.remove('ready');ghost.classList.add('show');log('wordless typed-idea demo');
  await ghostTo($('#idea'));await typeGhost('hammer');
  await ghostTo($('#idea'));await typeGhost('tiny boat');
  await ghostTo($('#idea'));await typeGhost('flower pot');
  await ghostTo($('#submit'));await sleep(250);ghost.classList.remove('show');startWarmup();
}
function enterIdea(){
  if(!['warmup','scored'].includes(phase)||locked)return;
  const value=$('#idea').value;if(addIdea(value))$('#idea').value='';
}
$('#add').addEventListener('click',enterIdea);
$('#idea').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();enterIdea();}});
$('#idea').addEventListener('input',touch);
$('#submit').addEventListener('click',submit);
$('#replay').addEventListener('click',()=>{if(phase!=='demo')location.reload();});
window.addEventListener('blur',()=>{
  if(phase==='scored'){T.activeMs+=Date.now()-T.activeStart;T.blur++;log('blur');renderMeters();}
});
window.addEventListener('focus',()=>{if(phase==='scored'){T.activeStart=Date.now();T.lastAction=Date.now();}});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
