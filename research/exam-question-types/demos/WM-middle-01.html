<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-middle-01 — Middle Muddle (flanker / conflict / switch)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #cue{font-size:15px;color:var(--warn);height:22px}
  #stage{width:440px;height:150px;background:#101a30;border:1px solid var(--edge);border-radius:18px;display:flex;align-items:center;justify-content:center;gap:6px}
  .arr{font-size:46px}.arr.mid{filter:drop-shadow(0 0 8px #ffd166)}
  .num{font-weight:800;color:#cfe3ff}
  .ans{display:flex;gap:20px}
  .ans button{font-size:30px;width:120px;height:66px;border-radius:16px;border:2px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  .ans button:active{transform:scale(.96)}.ans button.flash{background:var(--good);border-color:transparent}.ans button.wrong{background:var(--bad);border-color:transparent}
  #verdict{font-size:22px;height:30px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.ctl{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🎯 Middle Muddle <span class="badge" id="blevel">combo 0</span></h1>
    <p class="sub">When you see ➡️, tap which way the <b>middle</b> arrow points. When you see 🔢, tap the side with the <b>bigger number</b> (ignore its size). Watch the rule change!</p>
  </div>
  <div id="cue"></div>
  <div id="stage"></div>
  <div class="ans" id="ans"><button data-d="L">⬅️</button><button data-d="R">➡️</button></div>
  <div id="verdict"></div>
  <div class="row">
    <button class="pri ctl" id="go">▶ Watch how it works</button>
    <button class="ctl" id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const stage=$("#stage"),cue=$("#cue"),verdict=$("#verdict"),ansBtns=[...document.querySelectorAll("#ans button")];
const T={phase:"idle",trial:0,acc:[0,0],rtCong:[],rtIncong:[],rtSwitch:[],rtRepeat:[],combo:0,maxCombo:0,
  lastTask:null,lastErr:false,postErr:[],base:[],log:[]};
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function med(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m}
function pct(p){return p[1]?Math.round(100*p[0]/p[1]):0}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop()}
function bump(ok){if(ok){T.combo++;T.maxCombo=Math.max(T.maxCombo,T.combo);}else T.combo=0;$("#blevel").textContent="combo "+T.combo;}
function render(){
  const conEff=Math.round(med(T.rtIncong)-med(T.rtCong))||0;
  const swCost=Math.round(med(T.rtSwitch)-med(T.rtRepeat))||0;
  const pes=Math.round(mean(T.postErr)-mean(T.base))||0;
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-middle-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>trials</span><b>${T.trial}</b></div>
  <h2>Accuracy <span class="m">M-ACC</span></h2>
  <div class="kv"><span>correct</span><b>${pct(T.acc)}%</b></div>
  <h2>Interference <span class="m">M-CONGEFF</span></h2>
  <div class="kv"><span>incong − cong RT</span><b>${conEff} ms</b></div>
  <h2>Set-shifting <span class="m">M-SWITCHCOST</span></h2>
  <div class="kv"><span>switch − repeat RT</span><b>${swCost} ms</b></div>
  <h2>Controlled speed</h2>
  <div class="kv"><span>accuracy-gated combo <span class="m">M-COMBO</span></span><b>${T.combo}/${T.maxCombo}</b></div>
  <div class="kv"><span>RT variability CV <span class="m">M-RTVAR</span></span><b>${cv([...T.rtCong,...T.rtIncong]).toFixed(2)}</b></div>
  <div class="kv"><span>post-error slowing <span class="m">M-POSTERR</span></span><b>${pes>0?"+":""}${pes} ms</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();

let cur=null;
function respond(d,btn){if(!cur||cur.done)return;cur.done=true;cur.rt=performance.now()-cur.onset;cur.resp=d;
  const ok=d===cur.correct;btn.classList.add(ok?"flash":"wrong");setTimeout(()=>btn.classList.remove("flash","wrong"),200);cur.ok=ok;cur.resolve();}
ansBtns.forEach(b=>b.addEventListener("pointerdown",()=>respond(b.dataset.d,b)));

function buildFlanker(dir,cong){stage.innerHTML="";const fl=cong?dir:(dir==="L"?"R":"L");const a=d=>d==="L"?"⬅️":"➡️";
  for(let i=0;i<2;i++){const s=document.createElement("span");s.className="arr";s.textContent=a(fl);stage.appendChild(s);}
  const m=document.createElement("span");m.className="arr mid";m.textContent=a(dir);stage.appendChild(m);
  for(let i=0;i<2;i++){const s=document.createElement("span");s.className="arr";s.textContent=a(fl);stage.appendChild(s);}}
function buildNumeric(){stage.innerHTML="";let L=1+Math.floor(Math.random()*9),R;do{R=1+Math.floor(Math.random()*9);}while(R===L);
  const big=L>R?"L":"R";const conflict=Math.random()<0.6; // physical size conflicts with value
  const lS=conflict?(big==="L"?26:58):(big==="L"?58:26),rS=conflict?(big==="R"?26:58):(big==="R"?58:26);
  const ls=document.createElement("span");ls.className="num";ls.style.fontSize=lS+"px";ls.textContent=L;
  const rs=document.createElement("span");rs.className="num";rs.style.fontSize=rS+"px";rs.textContent=R;
  const gap=document.createElement("span");gap.style.width="70px";
  stage.appendChild(ls);stage.appendChild(gap);stage.appendChild(rs);
  return {correct:big,cong:!conflict};}

async function trial(scored){
  const task=Math.random()<0.55?"flank":"num";
  const isSwitch=T.lastTask!==null&&T.lastTask!==task;
  cue.textContent=task==="flank"?"➡️ point where the MIDDLE points":"🔢 tap the BIGGER number";
  let cong=true;
  if(task==="flank"){const dir=Math.random()<.5?"L":"R";cong=Math.random()<0.5;buildFlanker(dir,cong);cur={correct:dir};}
  else{const r=buildNumeric();cong=r.cong;cur={correct:r.correct};}
  cur.onset=performance.now();cur.done=false;cur.rt=null;cur.ok=false;
  await sleep(250);
  await new Promise(res=>{cur.resolve=res;setTimeout(()=>{if(!cur.done){cur.done=true;cur.timeout=true;res();}},2500);});
  if(scored){T.trial++;T.acc[1]++;
    if(cur.timeout){verdict.textContent="🐢";bump(false);T.lastErr=true;logE(`${task}: too slow`);}
    else{if(cur.ok){T.acc[0]++;bump(true);(T.lastErr?T.postErr:T.base).push(cur.rt);
        if(task==="flank"){(cong?T.rtCong:T.rtIncong).push(cur.rt);}(isSwitch?T.rtSwitch:T.rtRepeat).push(cur.rt);
        verdict.textContent="✅";T.lastErr=false;}
      else{bump(false);verdict.textContent="❌";T.lastErr=true;logE(`${task}${isSwitch?" (switch)":""}: err`);}}
    T.lastTask=task;}
  render();await sleep(380);verdict.textContent="";stage.innerHTML="";
}
async function block(scored,len){for(let i=0;i<len;i++)await trial(scored);}

async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;$("#replay").disabled=true;
  cue.textContent="➡️ point where the MIDDLE points";buildFlanker("R",false);
  const ghost=document.createElement("div");ghost.textContent="👆";ghost.style.cssText="position:fixed;font-size:30px;z-index:9;transition:left .4s,top .4s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  const rbtn=ansBtns[1],r=rbtn.getBoundingClientRect();await sleep(500);ghost.style.opacity="1";ghost.style.left=(r.left+r.width/2-12)+"px";ghost.style.top=(r.top+8)+"px";
  await sleep(700);rbtn.classList.add("flash");verdict.textContent="✅ middle points ➡️";await sleep(600);rbtn.classList.remove("flash");
  ghost.remove();stage.innerHTML="";T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice round";$("#go").onclick=warmup;
  $("#phasehint").textContent="Only the middle (or the bigger number) matters. Practice (not scored).";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;
async function warmup(){T.phase="warm-up (unscored)";render();$("#go").disabled=true;$("#replay").disabled=true;await block(false,4);
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;$("#go").textContent="▶ Start scored game";$("#go").onclick=startScored;
  $("#phasehint").textContent="These count. Small, steady interference beats fast guessing.";render();}
async function startScored(){T.phase="scored";render();$("#go").disabled=true;$("#replay").disabled=true;await block(true,18);
  T.phase="done";$("#go").disabled=false;$("#replay").disabled=false;$("#go").textContent="▶ Play again";$("#go").onclick=startScored;
  $("#phasehint").textContent=`Done. Flanker effect ${Math.round(med(T.rtIncong)-med(T.rtCong))||0}ms; switch cost ${Math.round(med(T.rtSwitch)-med(T.rtRepeat))||0}ms.`;verdict.textContent="🏁";render();}
</script>
</body>
</html>
