<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-MATRIXFLAW-01 · Fix the Glitch</title>
<style>
  :root{
    --bg1:#eef4ff; --bg2:#f7ecff; --ink:#26304a; --card:#ffffff;
    --accent:#5b6cff; --good:#22b573; --bad:#ff6b6b; --socket:#c9d3ef;
    --tel-bg:#11162a; --tel-ink:#c8d6ff; --tel-key:#7fffcf; --tel-dim:#7183b8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #trialdots{display:flex;gap:6px}
  #trialdots span{width:9px;height:9px;border-radius:50%;background:#cdd7f2}
  #trialdots span.on{background:var(--accent)}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:18px;max-width:560px;width:100%}
  #machine{position:relative;padding:16px;border-radius:20px;background:linear-gradient(160deg,#e2e9ff,#f2f0ff);border:3px solid #cfd8ff}
  .matrix{display:grid;gap:9px;background:#c7d2f2;padding:9px;border-radius:14px}
  .cell{background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;width:88px;height:88px;
    cursor:pointer;transition:.12s;-webkit-tap-highlight-color:transparent;border:3px solid transparent}
  .cell:hover{transform:translateY(-2px)}
  .cell.sel{border-color:var(--accent);box-shadow:0 0 0 4px #c9d0ff;transform:translateY(-3px)}
  .cell.hit{border-color:var(--good);box-shadow:0 0 0 4px #b4ecd0}
  .cell.miss{border-color:var(--bad);box-shadow:0 0 0 4px #ffd0d0}
  .cell.glitch{animation:buzz .5s}
  @keyframes buzz{0%,100%{transform:none}25%{transform:translate(-3px,2px) rotate(-3deg)}75%{transform:translate(3px,-2px) rotate(3deg)}}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:74px;height:74px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:50px;height:50px;background:#eef1ff;color:#5b6cff;font-size:22px}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .55s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}
  @keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:200px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}
  #log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:290px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-MATRIXFLAW-01 · Fix the Glitch</div>
    <div id="phasecue">&#128065;&#65039;</div>
    <div id="trialdots"></div>
    <div id="stagecard">
      <div id="machine"><div id="matrix" class="matrix"></div></div>
      <div id="controls">
        <button id="replay" title="replay demo">&#8635;</button>
        <button id="go" title="submit">&#10003;</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">&#128072;<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const last=a=>a[a.length-1];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function sd(a){if(a.length<2)return null;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.round(Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1)));}
function median(a){if(!a.length)return 0;const b=a.slice().sort((x,y)=>x-y);const n=b.length;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2;}

const PAL={red:'#e6194b',green:'#2ca25f',blue:'#4363d8',orange:'#f58231',purple:'#911eb4'};
const COLORKEYS=Object.keys(PAL);
const SH=['circle','square','triangle','diamond','star','hexagon'];
function polyPts(cx,cy,r,n,rot){let p=[];for(let i=0;i<n;i++){let a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function starPts(cx,cy,r,n){let p=[];for(let i=0;i<2*n;i++){let rr=i%2?r*0.45:r;let a=-Math.PI/2+i*Math.PI/n;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(' ');}
function oneShape(shape,color,cx,cy,r){const f='fill="'+color+'"';
  switch(shape){
    case 'circle':return `<circle cx="${cx}" cy="${cy}" r="${r}" ${f}/>`;
    case 'square':return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="3" ${f}/>`;
    case 'triangle':return `<polygon points="${polyPts(cx,cy,r,3,-Math.PI/2)}" ${f}/>`;
    case 'diamond':return `<polygon points="${polyPts(cx,cy,r,4,-Math.PI/2)}" ${f}/>`;
    case 'hexagon':return `<polygon points="${polyPts(cx,cy,r,6,-Math.PI/2)}" ${f}/>`;
    case 'star':return `<polygon points="${starPts(cx,cy,r,5)}" ${f}/>`;
  } return '';}
function tileSVG(a,box=76){const color=PAL[a.color]||a.color;const n=a.count||1;let inner='';
  if(n===1){inner=oneShape(a.shape,color,box/2,box/2,box*0.30);}
  else{const pos=n===2?[[.3,.5],[.7,.5]]:[[.24,.5],[.5,.5],[.76,.5]];
    const r=box*.14;pos.slice(0,n).forEach(p=>inner+=oneShape(a.shape,color,p[0]*box,p[1]*box,r));}
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${inner}</svg>`;}

/* build a rule-consistent matrix, then break exactly one cell on one attribute */
function genItem(nRules,size){size=size||3;
  const shapes=shuffle(SH).slice(0,size), colors=shuffle(COLORKEYS).slice(0,size), grid=[];
  for(let r=0;r<size;r++){grid.push([]);for(let c=0;c<size;c++)grid[r].push({
    shape:shapes[(r+c)%size], color:nRules>=2?colors[r]:colors[0], count:nRules>=3?c+1:1});}
  const br=(Math.random()*size)|0, bc=(Math.random()*size)|0;
  const attrs=['shape'];if(nRules>=2)attrs.push('color');if(nRules>=3)attrs.push('count');
  const bAttr=attrs[(Math.random()*attrs.length)|0];
  const cell=grid[br][bc], good={...cell};
  if(bAttr==='shape'){const alt=shapes.filter(s=>s!==cell.shape);cell.shape=alt[(Math.random()*alt.length)|0];}
  else if(bAttr==='color'){const alt=colors.filter(c=>c!==cell.color);cell.color=alt[(Math.random()*alt.length)|0];}
  else{cell.count=cell.count===1?2:(cell.count===3?2:cell.count+1);if(cell.count===good.count)cell.count=good.count===3?1:good.count+1;}
  return {size,nRules,grid,br,bc,bAttr,brokenIdx:br*size+bc};}

const T={scored:0,correct:0,rts:[],rtsCorrect:[],firstLat:null,lastErr:'\u2014',maxRules:0,itemStart:0,firstActed:false};
const METERS=[
 {id:'M-ACC',name:'Item accuracy (running)',get:()=>T.scored?`${T.correct}/${T.scored}  ${Math.round(100*T.correct/T.scored)}%`:'\u2014'},
 {id:'M-RT',name:'Response time — total',get:()=>T.rts.length?`${last(T.rts)} ms (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency (scan/plan)',get:()=>T.firstLat==null?'\u2014':T.firstLat+' ms'},
 {id:'M-RTVAR',name:'Intra-individual RT variability (SD)',get:()=>{const s=sd(T.rtsCorrect);return s==null?'\u2014':s+' ms';}},
 {id:'M-LAPSE',name:'Lapse rate (slowest / worst-perf)',get:()=>{if(!T.rts.length)return '\u2014';const md=median(T.rts);const n=T.rts.filter(x=>x>1.5*md).length;return Math.max(...T.rts)+' ms  ('+n+' slow)';}},
 {id:'M-ERRTYPE',name:'Error type (which wrong cell)',get:()=>T.lastErr},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>
  `<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');
  d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}

const ghost=$('#ghost');
function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(560);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(480);}

let phase='demo',cur=null,selIdx=null,locked=true,trialIndex=0;
const scoredItems=[genItem(1,3),genItem(2,3),genItem(2,3),genItem(3,3)];
function setCue(i){$('#phasecue').innerHTML=i;}
function renderDots(){const el=$('#trialdots');el.innerHTML=(phase==='scored')?
  scoredItems.map((_,i)=>`<span class="${i<=trialIndex?'on':''}"></span>`).join(''):'';}
function renderItem(item){cur=item;selIdx=null;const m=$('#matrix');m.style.gridTemplateColumns=`repeat(${item.size},1fr)`;m.innerHTML='';
  for(let r=0;r<item.size;r++)for(let c=0;c<item.size;c++){const cell=document.createElement('div');cell.className='cell';
    cell.dataset.i=r*item.size+c;cell.innerHTML=tileSVG(item.grid[r][c]);m.appendChild(cell);}
  $('#go').classList.remove('ready');T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;renderMeters();renderDots();}
function onCell(el){if(locked)return;const i=+el.dataset.i;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first tap · cell '+i);}
  selIdx=i;$$('#matrix .cell').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');
  $('#go').classList.add('ready');}
function errType(){if(selIdx===cur.brokenIdx)return 'none';
  const sr=(selIdx/cur.size)|0, sc=selIdx%cur.size;
  return (sr===cur.br||sc===cur.bc)?('near (shares broken '+(sr===cur.br?'row':'column')+')'):'far cell';}
function submit(){if(selIdx==null)return;const rt=Date.now()-T.itemStart;const correct=selIdx===cur.brokenIdx;
  const cells=$$('#matrix .cell');const selCell=cells[selIdx],brokenCell=cells[cur.brokenIdx];
  if(phase==='warmup'){brokenCell.classList.add(correct?'hit':'glitch');if(!correct&&selCell)selCell.classList.add('miss');
    log('warm-up '+(correct?'correct':'answer shown')+' — UNSCORED');locked=true;$('#go').classList.remove('ready');setTimeout(nextPhase,950);return;}
  T.scored++;T.rts.push(rt);T.lastErr=correct?'none':errType();
  if(correct){T.correct++;T.rtsCorrect.push(rt);T.maxRules=Math.max(T.maxRules,cur.nRules);selCell.classList.add('hit');}
  else{if(selCell)selCell.classList.add('miss');brokenCell.classList.add('glitch');setTimeout(()=>brokenCell.classList.add('hit'),260);}
  locked=true;$('#go').classList.remove('ready');
  log(`SUBMIT trial ${trialIndex+1} · ${cur.nRules}-rule ${cur.size}x${cur.size} · broke ${cur.bAttr} \u2192 ${correct?'CORRECT':'wrong ['+T.lastErr+']'} · RT ${rt}ms`);
  renderMeters();setTimeout(nextPhase,1150);}
function nextPhase(){if(phase==='warmup'){trialIndex=0;startScored();}
  else if(phase==='scored'){trialIndex++;trialIndex<scoredItems.length?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('&#11088;');locked=false;renderItem(genItem(1,2));renderDots();log('— warm-up (unscored): tap the cell that does not fit —');}
function startScored(){phase='scored';setCue('&#127919;');locked=false;renderItem(scoredItems[trialIndex]);
  log(`— SCORED trial ${trialIndex+1}: find the glitch in a ${cur.nRules}-rule ${cur.size}x${cur.size} —`);}
function finish(){phase='done';setCue('&#127942;');locked=true;renderDots();
  log(`— DONE · acc ${T.correct}/${T.scored} · RT-SD ${sd(T.rtsCorrect)||'-'}ms · ceiling ${T.maxRules} rules —`);}
async function runDemo(){phase='demo';setCue('&#128065;&#65039;');locked=true;
  const d=genItem(1,2);renderItem(d);log('ghost-hand demo (wordless, <10s): spot the glitchy cell');
  const cells=$$('#matrix .cell');ghostShow(true);await sleep(300);
  for(let i=0;i<cells.length;i++){if(i===d.brokenIdx)continue;await ghostTo(cells[i]);}
  await ghostTo(cells[d.brokenIdx]);await ghostTap();
  cells[d.brokenIdx].classList.add('glitch');setTimeout(()=>cells[d.brokenIdx].classList.add('hit'),260);
  await sleep(550);ghostShow(false);await sleep(400);startWarmup();}

$('#matrix').addEventListener('click',e=>{const c=e.target.closest('.cell');if(c)onCell(c);});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
