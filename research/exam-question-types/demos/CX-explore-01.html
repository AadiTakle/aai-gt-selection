<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CX-explore-01 — Berry Patch (explore–exploit behavioral curiosity)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;
    --accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;--berry:#7b5cff;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
  h1{font-size:19px;margin:.2rem 0}
  .sub{color:var(--mut);font-size:13px;margin:0 0 6px;text-align:center;max-width:500px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--accent);font-size:12px}
  #stage{position:relative;width:520px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;align-items:center}
  .bushes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .bush{position:relative;width:86px;height:98px;background:#16321f;border:2px solid var(--edge);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:transform .08s,box-shadow .12s,background .12s}
  .bush:active{transform:scale(.95)}
  .bush.here{box-shadow:0 0 0 3px var(--warn);background:#1e402a}
  .bush.unknown{background:#241a3a}
  .bush .lvl{font-size:34px}
  .bush .yield{font-size:12px;color:#cfe0ff;min-height:14px}
  .bush .q{font-size:26px;color:var(--warn)}
  .basket{display:flex;align-items:center;gap:10px;font-size:16px}
  .basket .bar{width:280px;height:14px;background:#10152a;border-radius:99px;overflow:hidden;border:1px solid var(--edge)}
  .basket .bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--berry),var(--accent));transition:width .25s}
  #enough{font-size:14px;color:var(--good);min-height:20px;text-align:center}
  #ghost{position:absolute;font-size:26px;left:0;top:0;transition:left .42s cubic-bezier(.5,0,.3,1),top .42s cubic-bezier(.5,0,.3,1);pointer-events:none;filter:drop-shadow(0 3px 3px #0008);z-index:9;opacity:0}
  #cue{font-size:24px;height:30px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:9px 16px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button.stop{background:#20284a;color:var(--ink)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}
  .kv .m{color:var(--mut);font-size:10px}
  .note{font-size:10px;color:var(--mut);margin-top:6px}
  .log{margin-top:6px;max-height:130px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🫐 Berry Patch <span class="badge" id="bphase">warm-up soon</span></h1>
    <p class="sub">Pick berries! A bush gives fewer each time you pick it. Other bushes are a mystery — they might be better, or worse. Pick wherever you like: stay, or wander to a new bush.</p>
  </div>
  <div id="stage">
    <div class="bushes" id="bushes"></div>
    <div class="basket">🧺 <div class="bar"><div id="fill"></div></div> <b id="banked">0</b></div>
    <div id="enough"></div>
    <div id="ghost">👆</div>
  </div>
  <div id="cue">👀</div>
  <div class="row">
    <button class="pri" id="go">▶ Watch how it works</button>
    <button class="stop" id="stopbtn" style="display:none">🧺 I'm happy — stop</button>
  </div>
  <p class="sub" id="hint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const stage=$("#stage"),ghost=$("#ghost"),cue=$("#cue"),bushesEl=$("#bushes");
const NB=5;let bushes=[];
const T={phase:"idle",here:-1,picks:0,banked:0,
  explore:0,exploit:0,visited:new Set(),exploreUnknown:0,exploreDepleted:0,
  path:[],freePicks:0,gateShown:false,log:[]};
const TARGET=40, REQUIRED=10; // basket target; after REQUIRED picks the "you're done" gate appears
function newBushes(){bushes=[];for(let i=0;i<NB;i++){const base=2+Math.random()*5;bushes.push({base,cur:base,dep:.62+Math.random()*.22,seen:false,picks:0});}}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>50)T.log.pop();}
function directedness(){return T.explore?Math.round(100*T.exploreDepleted/T.explore):0;}
function render(){
  const tot=T.explore+T.exploit;
  $("#fill").style.width=Math.min(100,100*T.banked/TARGET)+"%";$("#banked").textContent=Math.round(T.banked);
  $("#tel").innerHTML=`
  <h2>Live telemetry · CX-explore-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>total picks</span><b>${T.picks}</b></div>
  <div class="kv"><span>berries banked</span><b>${Math.round(T.banked)}</b></div>
  <h2>Explore vs exploit (behavioral)</h2>
  <div class="kv"><span>explore rate <span class="m">M-UNCERT</span></span><b>${tot?Math.round(100*T.explore/tot):0}% <span class="m">(${T.explore}/${tot})</span></b></div>
  <div class="kv"><span>toward the unknown <span class="m">M-UNCERT</span></span><b>${T.explore?Math.round(100*T.exploreUnknown/T.explore):0}%</b></div>
  <div class="kv"><span>bushes sampled <span class="m">M-EXPLORE</span></span><b>${T.visited.size} / ${NB}</b></div>
  <div class="kv"><span>choice path <span class="m">M-PATH</span></span><b>${T.path.slice(-10).join("")||"—"}</b></div>
  <h2>Free choice & drive</h2>
  <div class="kv"><span>picks after "enough" <span class="m">M-CHOICE</span></span><b>${T.freePicks}</b></div>
  <div class="kv"><span>time-on-task <span class="m">M-PERSIST</span></span><b>${T.picks} picks</b></div>
  <div class="kv"><span>engagement <span class="m">M-ENGAGE</span></span><b>${T.phase==="foraging"?"active":"idle"}</b></div>
  <div class="note">Validity caveat: exploration is only "curiosity" if it's <b>directed</b> — here ${directedness()}% of explores happened when the current bush had thinned. Read explore-rate WITH directedness & consistency to rule out random/impulsive switching. Behavioral, not self-report.</div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
function centerOf(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2};}
function draw(){
  bushesEl.innerHTML="";bushes.forEach((b,i)=>{const d=document.createElement("div");d.className="bush"+(i===T.here?" here":"")+(b.seen?"":" unknown");d.dataset.i=i;
    if(b.seen){const dots="🫐".repeat(Math.max(0,Math.round(b.cur)));d.innerHTML=`<div class="lvl">🌳</div><div class="yield">${dots||"·"}</div>`;}
    else{d.innerHTML=`<div class="lvl">🌳</div><div class="q">?</div>`;}
    bushesEl.appendChild(d);});
}
newBushes();draw();render();
function harvest(i){
  const b=bushes[i];const prevHere=T.here;const isExplore=i!==prevHere;
  if(isExplore){T.explore++;if(!b.seen)T.exploreUnknown++;const cb=prevHere>=0?bushes[prevHere]:null;if(cb&&cb.cur<cb.base-0.5)T.exploreDepleted++;T.path.push("→");}
  else{T.exploit++;T.path.push("·");}
  T.here=i;b.seen=true;T.visited.add(i);
  const got=Math.max(1,Math.round(b.cur));T.banked+=got;b.cur=Math.max(0,b.cur*b.dep);b.picks++;T.picks++;
  if(T.gateShown&&T.phase==="foraging")T.freePicks++;
  logE(`${isExplore?"explore":"stay"} bush${i} +${got}`);
  draw();render();
  if(T.phase==="foraging"&&T.picks>=REQUIRED&&!T.gateShown){T.gateShown=true;$("#enough").textContent="🎉 You have plenty! You can stop now — or keep foraging if you like.";$("#stopbtn").style.display="";}
}
let clickHandler=null;
function enablePlay(scored){
  if(clickHandler)bushesEl.removeEventListener("click",clickHandler);
  clickHandler=e=>{const d=e.target.closest(".bush");if(!d)return;if(T.phase!=="foraging"&&T.phase!=="warm")return;cue.textContent="🫐";harvest(+d.dataset.i);};
  bushesEl.addEventListener("click",clickHandler);
}
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;
  T.here=-1;newBushes();draw();cue.textContent="👀";ghost.style.opacity="1";
  // pick bush 0 twice (exploit, yield shrinks), then explore bush 2 (reveal ?)
  let el=bushesEl.children[0];let c=centerOf(el);ghost.style.left=(c.x-12)+"px";ghost.style.top=(c.y-10)+"px";await sleep(600);
  T.here=0;bushes[0].seen=true;bushes[0].cur*=bushes[0].dep;draw();await sleep(500);
  c=centerOf(bushesEl.children[0]);ghost.style.left=(c.x-12)+"px";ghost.style.top=(c.y-10)+"px";await sleep(500);
  bushes[0].cur*=bushes[0].dep;draw();cue.textContent="🍃";await sleep(500);
  el=bushesEl.children[2];c=centerOf(el);ghost.style.left=(c.x-12)+"px";ghost.style.top=(c.y-10)+"px";await sleep(650);
  T.here=2;bushes[2].seen=true;draw();cue.textContent="✅";await sleep(800);
  ghost.style.opacity="0";
  // reset counters used during demo
  T.explore=0;T.exploit=0;T.picks=0;T.banked=0;T.visited=new Set();T.path=[];T.exploreUnknown=0;T.exploreDepleted=0;
  $("#go").disabled=false;$("#go").textContent="▶ Try a practice one";$("#go").onclick=warmup;
  T.phase="idle";$("#bphase").textContent="try it";$("#hint").textContent="Now you try a few — this practice is NOT scored. Stay or wander, your call.";
  T.here=-1;newBushes();draw();render();
}
$("#go").onclick=demo;
let warmLeft=0;
function warmup(){$("#go").disabled=true;T.phase="warm";$("#bphase").textContent="practice";T.here=-1;newBushes();draw();render();cue.textContent="🫐";enablePlay(false);
  warmLeft=4;const iv=setInterval(()=>{if(T.picks>=4){clearInterval(iv);endWarm();}},300);}
function endWarm(){bushesEl.removeEventListener("click",clickHandler);clickHandler=null;
  T.phase="idle";T.explore=0;T.exploit=0;T.picks=0;T.banked=0;T.visited=new Set();T.path=[];T.exploreUnknown=0;T.exploreDepleted=0;T.freePicks=0;T.gateShown=false;
  T.here=-1;newBushes();draw();render();
  $("#go").disabled=false;$("#go").textContent="▶ Start foraging";$("#go").onclick=startScored;
  $("#hint").textContent="Great! Now forage for real. There's no wrong choice — we just watch what you like to do.";}
function startScored(){$("#go").disabled=true;$("#go").style.display="none";T.phase="foraging";$("#bphase").textContent="foraging";
  T.here=-1;newBushes();draw();render();cue.textContent="🫐";enablePlay(true);$("#hint").textContent="Pick wherever you like. Stop whenever you want.";}
$("#stopbtn").onclick=()=>{bushesEl.removeEventListener("click",clickHandler);clickHandler=null;T.phase="done";
  $("#stopbtn").style.display="none";$("#go").style.display="";$("#go").disabled=false;$("#go").textContent="▶ Forage again";$("#go").onclick=startScored;
  cue.textContent="🧺";$("#enough").textContent="";
  const tot=T.explore+T.exploit;
  $("#hint").textContent=`You stopped after ${T.picks} picks (${T.freePicks} past "enough"), sampled ${T.visited.size}/${NB} bushes, explore-rate ${tot?Math.round(100*T.explore/tot):0}% (${directedness()}% directed).`;render();};
</script>
</body>
</html>
