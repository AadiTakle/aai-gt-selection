<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-TWINODD-01 · Two Strangers</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#ffffff;--accent:#5b6cff;
    --good:#22b573;--bad:#ff6b6b;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px}
  #countpips{display:flex;gap:8px;height:20px}
  #countpips span{width:16px;height:16px;border-radius:50%;background:#d3dcf6;transition:.2s}
  #countpips span.on{background:var(--accent);box-shadow:0 0 8px #b9c2ff}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:18px;max-width:600px;width:100%}
  #field{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:14px;background:linear-gradient(160deg,#e9f0ff,#f4eefe);border-radius:18px;border:3px solid #d3ddff}
  .fig{background:#fff;border:3px solid #e2e8fb;border-radius:16px;width:84px;height:84px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
  .fig:hover{transform:translateY(-3px);border-color:#c3ccf5}
  .fig.sel{border-color:var(--accent);box-shadow:0 0 0 4px #c9d0ff;transform:translateY(-4px)}
  .fig.hit{border-color:var(--good);box-shadow:0 0 0 4px #b4ecd0}
  .fig.miss{border-color:var(--bad);box-shadow:0 0 0 4px #ffd0d0}
  .fig.reveal{outline:3px dashed var(--good);outline-offset:2px}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:76px;height:76px;background:var(--accent);color:#fff;font-size:32px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:52px;height:52px;background:#eef1ff;color:#5b6cff;font-size:24px}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .7s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}
  @keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:200px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-TWINODD-01 · Two Strangers</div>
    <div id="phasecue">&#128065;</div>
    <div id="countpips"><span></span><span></span></div>
    <div id="stagecard">
      <div id="field"></div>
      <div id="controls">
        <button id="replay" title="replay demo">&#8635;</button>
        <button id="go" title="submit">&#10003;</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">&#128070;<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const last=a=>a[a.length-1];
const PAL={red:'#e6194b',green:'#2ca25f',blue:'#4363d8',orange:'#f58231',purple:'#911eb4'};
const COLORKEYS=Object.keys(PAL);const SH=['circle','square','triangle','diamond','star'];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[(Math.random()*a.length)|0];}

function polyPts(cx,cy,r,n,rot){let p=[];for(let i=0;i<n;i++){let a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function starPts(cx,cy,r,n){let p=[];for(let i=0;i<2*n;i++){let rr=i%2?r*0.45:r;let a=-Math.PI/2+i*Math.PI/n;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(' ');}
function oneShape(shape,color,cx,cy,r,filled){const f=filled?`fill="${color}"`:`fill="none" stroke="${color}" stroke-width="5"`;
  switch(shape){
    case 'circle':return `<circle cx="${cx}" cy="${cy}" r="${r}" ${f}/>`;
    case 'square':return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="3" ${f}/>`;
    case 'triangle':return `<polygon points="${polyPts(cx,cy,r,3,-Math.PI/2)}" ${f}/>`;
    case 'diamond':return `<polygon points="${polyPts(cx,cy,r,4,-Math.PI/2)}" ${f}/>`;
    case 'star':return `<polygon points="${starPts(cx,cy,r,5)}" ${f}/>`;
  }return '';}
function figSVG(f,box=72){return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${oneShape(f.shape,PAL[f.color],box/2,box/2,box*0.30,f.fill===0)}</svg>`;}

/* ---------- item generation: majority share critDim; 2 strangers break it ---------- */
function genItem(n,critDim){
  const critVal=critDim==='shape'?pick(SH):critDim==='color'?pick(COLORKEYS):0; // fill crit uses 0(solid)
  const figs=[];
  const rnd=()=>({shape:pick(SH),color:pick(COLORKEYS),fill:pick([0,1])});
  for(let i=0;i<n;i++){let f=rnd();
    if(critDim==='shape')f.shape=critVal; if(critDim==='color')f.color=critVal; if(critDim==='fill')f.fill=critVal;
    f.stranger=false;figs.push(f);}
  // choose 2 strangers, force a different value on critDim
  const idx=shuffle([...figs.keys()]).slice(0,2);
  idx.forEach(i=>{const f=figs[i];f.stranger=true;
    if(critDim==='shape')f.shape=pick(SH.filter(s=>s!==critVal));
    if(critDim==='color')f.color=pick(COLORKEYS.filter(c=>c!==critVal));
    if(critDim==='fill')f.fill=1;});
  return {n,critDim,critVal,figs,strangers:new Set(idx)};
}

/* ---------- telemetry ---------- */
const T={scored:0,correct:0,rts:[],firstLat:null,lastErr:'\u2014',lastPoly:'\u2014',polySum:0,taps:0,itemStart:0,firstActed:false};
const METERS=[
 {id:'M-ACC',name:'Item accuracy (both strangers, exact)',get:()=>T.scored?`${T.correct}/${T.scored}  ${Math.round(100*T.correct/T.scored)}%`:'\u2014'},
 {id:'M-POLY',name:'Partial credit (strangers found /2)',get:()=>T.lastPoly},
 {id:'M-RT',name:'Response time — total',get:()=>T.rts.length?`${last(T.rts)} ms  (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency (induce rule)',get:()=>T.firstLat==null?'\u2014':T.firstLat+' ms'},
 {id:'M-ERRTYPE',name:'Error type (miss vs over-inclusion)',get:()=>T.lastErr},
 {id:'M-EXPLORE',name:'Exploration (select/deselect taps)',get:()=>T.taps+''},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>
  `<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span>`
  +`<span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');
  d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
function setPips(k){$$('#countpips span').forEach((s,i)=>s.classList.toggle('on',i<k));}

/* ---------- ghost ---------- */
const ghost=$('#ghost');
function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(620);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(460);}

/* ---------- flow ---------- */
let phase='demo',cur=null,sel=new Set(),locked=false,scoredIndex=0;
const scoredItems=[genItem(6,'shape'),genItem(7,'fill')];
function setCue(i){$('#phasecue').innerHTML=i;}
function renderItem(item){cur=item;sel=new Set();const f=$('#field');f.innerHTML='';
  item.figs.forEach((fig,i)=>{const d=document.createElement('div');d.className='fig';d.dataset.i=i;d.innerHTML=figSVG(fig);f.appendChild(d);});
  $('#go').classList.remove('ready');setPips(0);T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;T.taps=0;renderMeters();}
function onFig(el){if(locked||phase==='demo'||phase==='done')return;const i=+el.dataset.i;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first tap · fig '+i);}
  T.taps++;
  if(sel.has(i)){sel.delete(i);el.classList.remove('sel');}else{sel.add(i);el.classList.add('sel');}
  setPips(sel.size);$('#go').classList.toggle('ready',sel.size===2);renderMeters();}
function reveal(){cur.strangers.forEach(i=>{const el=$$('#field .fig')[i];if(!sel.has(i))el.classList.add('reveal');});}
function scoreSel(){let hits=0;sel.forEach(i=>{const el=$$('#field .fig')[i];const ok=cur.strangers.has(i);
  el.classList.add(ok?'hit':'miss');if(ok)hits++;});return hits;}
function submit(){if(sel.size!==2)return;const rt=Date.now()-T.itemStart;const hits=scoreSel();const correct=hits===2;
  if(!correct)reveal();
  if(phase==='warmup'){log('warm-up '+hits+'/2 strangers — UNSCORED');setPips(0);setTimeout(nextPhase,1100);return;}
  T.scored++;T.rts.push(rt);T.polySum+=hits;T.lastPoly=hits+' / 2';
  if(correct){T.correct++;T.lastErr='none';}
  else T.lastErr=hits===1?'near-miss (found 1 of 2)':'over-inclusion (0 strangers)';
  locked=true;$('#go').classList.remove('ready');
  log(`SUBMIT scored ${scoredIndex+1} · rule=${cur.critDim} \u2192 ${hits}/2 strangers ${correct?'CORRECT':'['+T.lastErr+']'} · RT ${rt}ms · taps ${T.taps}`);
  renderMeters();setTimeout(nextPhase,1300);}
function nextPhase(){locked=false;if(phase==='warmup'){scoredIndex=0;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<scoredItems.length?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('&#11088;');locked=false;renderItem(genItem(6,'shape'));log('— warm-up (unscored): most are one shape; tap the TWO that differ —');}
function startScored(){phase='scored';setCue('&#127919;');locked=false;renderItem(scoredItems[scoredIndex]);
  log(`— SCORED item ${scoredIndex+1}: shared rule on ${cur.critDim}; find both strangers —`);}
function finish(){phase='done';setCue('&#127942;');locked=true;
  log(`— DONE · exact ${T.correct}/${T.scored} · strangers found ${T.polySum}/${2*T.scored} —`);}
async function runDemo(){phase='demo';setCue('&#128065;');locked=true;
  const d=genItem(6,'shape');renderItem(d);log('ghost-hand demo (wordless, <10s): scan, then tap the two strangers');
  ghostShow(true);await sleep(250);const figs=$$('#field .fig');
  for(let i=0;i<4;i++){await ghostTo(figs[i]);await sleep(60);}
  const st=[...d.strangers];
  await ghostTo(figs[st[0]]);await ghostTap();figs[st[0]].classList.add('sel');setPips(1);
  await ghostTo(figs[st[1]]);await ghostTap();figs[st[1]].classList.add('sel');setPips(2);
  await sleep(450);await ghostTo($('#go'));await ghostTap();
  figs[st[0]].classList.add('hit');figs[st[1]].classList.add('hit');
  await sleep(400);ghostShow(false);await sleep(450);setPips(0);startWarmup();}

$('#field').addEventListener('click',e=>{const o=e.target.closest('.fig');if(o)onFig(o);});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
