<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUANT-COUNTWAYS-01 · Count the Ways</title>
<style>
  :root{--bg1:#fff2ea;--bg2:#eaf1ff;--ink:#3a2a2a;--card:#fff;--accent:#e07b39;--accent2:#5b6cff;--good:#22b573;--bad:#ff6b6b;--tel-bg:#221a14;--tel-ink:#ffe3cf;--tel-key:#ffd479;--tel-dim:#a5876f;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#a08a7a;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #7a5a3a;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:600px;width:100%}
  #prompt{font-size:15px;color:#8a6b57}
  #builder{display:flex;align-items:flex-end;gap:16px}
  #bowl{display:flex;gap:8px}
  .slot{width:56px;height:56px;border-radius:50%;border:3px dashed #e3c3a8;background:#fff8f2;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .flavs{display:flex;gap:12px}
  .flav{width:52px;height:52px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 12px -6px #5a4a3a;cursor:pointer}
  #counter{font-size:15px;color:#8a6b57}
  #counter b{font-size:22px;color:var(--accent)}
  #gallery{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:56px;padding:8px;border-radius:12px;background:#fbf6f1;width:100%}
  .found{display:flex;gap:3px;padding:4px;background:#fff;border-radius:10px;box-shadow:0 3px 8px -5px #7a5a3a}
  .found .d{width:20px;height:20px;border-radius:50%}
  #tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:14px}
  #add{padding:11px 22px;background:var(--good);color:#fff;font-weight:700;opacity:.4;pointer-events:none}
  #add.ready{opacity:1;pointer-events:auto}
  #done{padding:11px 18px;background:var(--accent2);color:#fff;font-weight:700}
  #replay{width:46px;height:46px;border-radius:50%;background:#f0ece6;color:#e07b39;font-size:20px}
  #bounce{position:fixed;font-size:15px;color:#c0392b;background:#fff;border:1px solid #f3c0b8;border-radius:10px;padding:4px 10px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;transition:transform .6s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#2c2119;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #3a2c22;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#c7a68f;font-size:11px;letter-spacing:.08em}
  #log{height:190px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #33261d}#log .t{color:#7a5f4c}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">QUANT-COUNTWAYS-01 · Count the Ways</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="prompt">make every different 2-scoop bowl</div>
      <div id="builder">
        <div id="bowl"><div class="slot" data-s="0"></div><div class="slot" data-s="1"></div></div>
      </div>
      <div class="flavs" id="flavs"></div>
      <div id="counter">found <b id="cf">0</b> different bowls</div>
      <div id="gallery"></div>
      <div id="tools">
        <button id="replay" title="replay demo">↻</button>
        <button id="add">Add ✓</button>
        <button id="done">I found them all</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="bounce">already have that one!</div>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const PAL={S:'#f48fb1',C:'#8d5524',M:'#7fd18a',B:'#5b9bd5'};
function enumerate(flavs){const out=[];for(let i=0;i<flavs.length;i++)for(let j=i;j<flavs.length;j++)out.push(flavs[i]+flavs[j]);return out;}
const canon=arr=>arr.slice().sort().join('');

/* telemetry */
const T={found:[],attempts:0,dups:0,progr:[],path:[],total:0,itemStart:0};
function polyStr(){if(!T.total)return '\u2014';return `${T.found.length}/${T.total} (${Math.round(100*T.found.length/T.total)}%)`;}
function effStr(){ // systematicity: fraction of adjacent adds that share their first (sorted) scoop -> odometer grouping
  if(T.found.length<2)return '\u2014';let g=0;for(let i=1;i<T.found.length;i++)if(T.found[i][0]===T.found[i-1][0])g++;
  return `${Math.round(100*g/(T.found.length-1))}% grouped`;}
const METERS=[
 {id:'M-ACC',name:'Complete set found? (this item)',get:()=>T.total?(T.found.length===T.total?'yes ✓':'no ('+T.found.length+'/'+T.total+')'):'\u2014'},
 {id:'M-POLY',name:'Fraction of the set found',get:()=>polyStr()},
 {id:'M-EFF',name:'Systematic (odometer) order',get:()=>effStr()},
 {id:'M-EXPLORE',name:'Add attempts (incl. dups)',get:()=>T.attempts+''},
 {id:'M-REV',name:'Duplicate attempts bounced',get:()=>T.dups+''},
 {id:'M-PROG',name:'Discovery trajectory (found count)',get:()=>T.progr.length?T.progr.join(''):'\u2014'},
 {id:'M-PATH',name:'Generation order',get:()=>T.path.length?T.path.join(' '):'\u2014'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');const ghostShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(520);}
function showBounce(){const b=$('#bounce'),g=centerOf($('#add'));b.style.left=(g.x-70)+'px';b.style.top=(g.y-46)+'px';b.style.opacity=1;setTimeout(()=>b.style.opacity=0,700);}

let phase='demo',flavs=['S','C','M'],scoops=[null,null],galleryFound=[],seq=[],si=0;
function setCue(i){$('#phasecue').textContent=i;}
function paintFlavs(){$('#flavs').innerHTML=flavs.map(f=>`<div class="flav" data-f="${f}" style="background:${PAL[f]}"></div>`).join('');}
function renderSlots(){$$('.slot').forEach((s,i)=>{s.innerHTML=scoops[i]?`<div class="flav" style="width:44px;height:44px;background:${PAL[scoops[i]]};box-shadow:none"></div>`:'';});
  $('#add').classList.toggle('ready',scoops[0]&&scoops[1]&&phase!=='demo'&&phase!=='done');}
function tapFlav(f){if(phase==='demo'||phase==='done')return;const idx=scoops[0]==null?0:scoops[1]==null?1:null;if(idx==null){scoops=[f,null];}else scoops[idx]=f;renderSlots();}
function tapSlot(i){if(phase==='demo'||phase==='done')return;scoops[i]=null;renderSlots();}
function renderGallery(){$('#gallery').innerHTML=galleryFound.map(c=>`<div class="found">${c.split('').map(x=>`<div class="d" style="background:${PAL[x]}"></div>`).join('')}</div>`).join('');$('#cf').textContent=galleryFound.length;}
function add(){if(!(scoops[0]&&scoops[1])||phase==='demo'||phase==='done')return;T.attempts++;const c=canon(scoops);
  if(galleryFound.includes(c)){T.dups++;showBounce();log(`dup: {${scoops.join(',')}} already found`);scoops=[null,null];renderSlots();renderMeters();return;}
  galleryFound.push(c);T.found.push(c);T.path.push(c);T.progr.push(galleryFound.length%10);
  log(`ADD {${scoops.join(',')}} → new! (${galleryFound.length}/${T.total})`);scoops=[null,null];renderSlots();renderGallery();renderMeters();}
function doneItem(){if(phase==='demo'||phase==='done')return;log(`item done · found ${T.found.length}/${T.total} · systematic ${effStr()}`);renderMeters();si++;si<seq.length?startItem(seq[si]):finish();}
function startItem(cfg){phase=cfg.warm?'warmup':'scored';flavs=cfg.flavs;T.total=enumerate(flavs).length;galleryFound=[];T.found=[];T.path=[];T.progr=[];T.attempts=0;T.dups=0;scoops=[null,null];T.itemStart=Date.now();
  $('#prompt').textContent=`make every different 2-scoop bowl (${flavs.length} flavors)`;paintFlavs();renderSlots();renderGallery();renderMeters();setCue(cfg.warm?'\u2b50':'\ud83c\udfaf');
  log(`— ${cfg.warm?'warm-up':'SCORED'}: build every distinct 2-scoop bowl · order does not matter · no repeats —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');log('— DONE —');}
async function runDemo(){phase='demo';si=0;flavs=['S','C'];T.total=enumerate(flavs).length;galleryFound=[];scoops=[null,null];T.itemStart=Date.now();$('#prompt').textContent='make every different 2-scoop bowl';paintFlavs();renderSlots();renderGallery();
  log('ghost-hand demo (wordless): build a bowl, Add it; a repeat bounces back');ghostShow(true);await sleep(300);
  await ghostTo($('.flav[data-f="S"]'));scoops=['S',null];renderSlots();await ghostTo($('.flav[data-f="C"]'));scoops=['S','C'];renderSlots();
  await ghostTo($('#add'));galleryFound=['CS'];renderGallery();await sleep(400);
  await ghostTo($('.flav[data-f="C"]'));scoops=['C',null];renderSlots();await ghostTo($('.flav[data-f="S"]'));scoops=['C','S'];renderSlots();
  await ghostTo($('#add'));showBounce();await sleep(600);scoops=[null,null];renderSlots();
  ghostShow(false);galleryFound=[];renderGallery();log('demo done — your turn (warm-up)');
  seq=[{warm:true,flavs:['S','C']},{flavs:['S','C','M']}];startItem(seq[0]);}
$('#flavs').addEventListener('click',e=>{const f=e.target.closest('.flav');if(f)tapFlav(f.dataset.f);});
$('#bowl').addEventListener('click',e=>{const s=e.target.closest('.slot');if(s)tapSlot(+s.dataset.s);});
$('#add').addEventListener('click',()=>{if($('#add').classList.contains('ready'))add();});
$('#done').addEventListener('click',doneItem);
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
