<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUANT-ACTOUT-01 — Story Stage (Act-It-Out)</title>
<style>
:root{--bg:#0f1226;--panel:#1b2140;--panel2:#232a52;--accent:#5eead4;--accent2:#f59e0b;--good:#4ade80;--bad:#f87171;--ink:#eef1ff;--muted:#9aa3c7}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 20% -10%,#26305e,#0f1226 60%);min-height:100vh}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1120px;margin:0 auto;padding:18px}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid #313a6b;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.phasebar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#2b336a;color:var(--muted);border:1px solid #3a447f}
.pill.on{background:var(--accent);color:#053;font-weight:700}
.prompt{font-size:15px;color:var(--muted);min-height:22px;margin:6px 0}
.goal{display:flex;gap:14px;align-items:center;justify-content:center;font-size:26px;margin:8px 0 14px;font-weight:800}
.goal .mini{font-size:15px;color:var(--muted);font-weight:600}
.stage{position:relative;padding:6px}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:64px;align-content:flex-start;justify-content:center;
  background:#141a38;border:1px dashed #3a447f;border-radius:14px;padding:10px;margin-bottom:14px}
.trayLbl{color:var(--muted);font-size:12px;text-align:center;margin-bottom:4px}
.plates{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.plate{width:120px;min-height:120px;border-radius:16px;background:radial-gradient(circle at 50% 35%,#2b336a,#20264d);
  border:2px solid #3a447f;padding:8px;cursor:pointer;transition:transform .1s,border-color .15s;position:relative}
.plate:hover{border-color:var(--accent);transform:translateY(-2px)}
.plate .cnt{position:absolute;top:-10px;right:-8px;background:var(--accent2);color:#3a2600;font-weight:800;
  border-radius:999px;min-width:24px;height:24px;line-height:24px;text-align:center;font-size:13px}
.plate .grid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:flex-start;margin-top:4px}
.tok{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe6a0,#e8912a);
  border:1px solid #b56b12;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
.tok.tray{cursor:default}
.row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
button.act{font:600 15px system-ui;padding:10px 18px;border-radius:12px;border:0;cursor:pointer;background:var(--accent);color:#053}
button.act.ghost{background:#2b336a;color:var(--ink);border:1px solid #3a447f}
button.act:disabled{opacity:.4;cursor:default}
.fb{min-height:26px;text-align:center;font-weight:700;margin-top:12px}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.hand{position:absolute;font-size:34px;z-index:20;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:left .7s cubic-bezier(.4,0,.2,1),top .5s ease;opacity:0}
.tele{font-size:13px}
.tele h2{font-size:14px;margin:0 0 8px;color:var(--accent)}
.metrics{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-bottom:10px}
.metrics div:nth-child(odd){color:var(--muted)}
.metrics b{font-variant-numeric:tabular-nums}
.log{height:236px;overflow:auto;background:#12172f;border:1px solid #2a336a;border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-acc{color:var(--good)}.t-err{color:var(--bad)}.t-evt{color:#9fb0ff}.t-sys{color:var(--muted)}
.legend{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <h1>Story Stage — Act It Out</h1>
    <div class="sub">Move the treats onto the plates to act out the story. No reading or number-writing needed.</div>
    <div class="phasebar" id="phasebar"></div>
    <div class="prompt" id="prompt"></div>
    <div class="goal" id="goal"></div>
    <div class="stage">
      <div class="trayLbl" id="trayLbl">Treats left</div>
      <div class="tray" id="tray"></div>
      <div class="plates" id="plates"></div>
      <div class="row">
        <button class="act" id="doneBtn">Done</button>
        <button class="act ghost" id="nextBtn" style="display:none">Next</button>
      </div>
      <div class="fb" id="fb"></div>
    </div>
    <div class="hand" id="hand">&#128070;</div>
  </main>
  <aside class="card tele">
    <h2>Live telemetry</h2>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="legend">Logs <b>M-POLY</b> (0-2 model score), <b>M-PATH</b> (enactment moves), <b>M-EFF</b> (moves vs optimal), <b>M-ERRTYPE</b> (leftover / uneven), <b>M-PERSIST</b> (time on hard items).</div>
  </aside>
</div>
<script>
(function(){
  "use strict";
  var el=function(id){return document.getElementById(id)};
  var tray=el('tray'),plates=el('plates'),hand=el('hand'),prompt=el('prompt'),goal=el('goal'),
      fb=el('fb'),doneBtn=el('doneBtn'),nextBtn=el('nextBtn');
  var T0=Date.now(); function perf(){return Date.now()-T0;}

  var Tel={
    scored:0,correct:0,polySum:0,polyMax:0,effSum:0,effN:0,moves:0,persistSum:0,persistN:0,
    push:function(cls,msg){var d=document.createElement('div');d.className=cls;
      d.textContent='['+(perf()/1000).toFixed(2)+'s] '+msg;var L=el('log');L.appendChild(d);L.scrollTop=L.scrollHeight;},
    render:function(){
      var acc=Tel.scored?Math.round(100*Tel.correct/Tel.scored)+'% ('+Tel.correct+'/'+Tel.scored+')':'—';
      var poly=Tel.polyMax?Tel.polySum+'/'+Tel.polyMax:'—';
      var eff=Tel.effN?Math.round(100*Tel.effSum/Tel.effN)+'%':'—';
      var pers=Tel.persistN?Math.round(Tel.persistSum/Tel.persistN/100)/10+' s':'—';
      el('metrics').innerHTML=
        '<div>M-ACC accuracy</div><b>'+acc+'</b>'+
        '<div>M-POLY model score</div><b>'+poly+'</b>'+
        '<div>M-EFF mean</div><b>'+eff+'</b>'+
        '<div>M-PATH moves</div><b>'+Tel.moves+'</b>'+
        '<div>M-PERSIST mean</div><b>'+pers+'</b>';
    }
  };

  // items: N treats shared equally among P plates
  var items=[
    {phase:'demo',  N:6, P:2},
    {phase:'warmup',N:4, P:2},
    {phase:'scored',N:12,P:3},
    {phase:'scored',N:20,P:4}
  ];
  var labels={demo:'1 Watch',warmup:'2 Try',scored:'3 Solve'};
  var idx=-1,cur=null,onPlate=[],trayN=0,firstAction=0,itemStart=0,moves=0;

  function renderPhasebar(){
    el('phasebar').innerHTML=['demo','warmup','scored'].map(function(p){
      var on=cur&&cur.phase===p?' on':''; return '<span class="pill'+on+'">'+labels[p]+'</span>';
    }).join('');
  }
  function drawTray(){
    tray.innerHTML='';
    for(var i=0;i<trayN;i++){var t=document.createElement('div');t.className='tok tray';t.textContent='\uD83C\uDF6A';tray.appendChild(t);}
    el('trayLbl').textContent='Treats left: '+trayN;
  }
  function drawPlates(){
    plates.innerHTML='';
    for(var p=0;p<cur.P;p++){
      (function(p){
        var d=document.createElement('div');d.className='plate';
        var c=document.createElement('div');c.className='cnt';c.textContent=onPlate[p];d.appendChild(c);
        var g=document.createElement('div');g.className='grid';
        for(var k=0;k<onPlate[p];k++){var t=document.createElement('div');t.className='tok';t.textContent='\uD83C\uDF6A';
          t.onclick=function(ev){ev.stopPropagation();takeFrom(p);};g.appendChild(t);}
        d.appendChild(g);
        d.onclick=function(){addTo(p);};
        plates.appendChild(d);
      })(p);
    }
  }
  function noteFirst(){ if(firstAction===0){firstAction=perf();Tel.push('t-evt','first action');} }
  function addTo(p){
    if(cur.phase==='demo')return;
    if(trayN<=0){Tel.push('t-sys','tray empty');return;}
    noteFirst(); trayN--; onPlate[p]++; moves++; Tel.moves++;
    Tel.push('t-evt','place -> plate '+(p+1)+' (now '+onPlate[p]+')');
    drawTray();drawPlates();
  }
  function takeFrom(p){
    if(cur.phase==='demo')return;
    if(onPlate[p]<=0)return;
    noteFirst(); onPlate[p]--; trayN++; moves++; Tel.moves++;
    Tel.push('t-evt','return <- plate '+(p+1)+' (now '+onPlate[p]+')');
    drawTray();drawPlates();
  }

  function loadItem(){
    idx++; if(idx>=items.length){finish();return;}
    cur=items[idx]; onPlate=[]; for(var i=0;i<cur.P;i++)onPlate.push(0);
    trayN=cur.N; firstAction=0; moves=0; itemStart=perf();
    fb.textContent='';fb.className='fb'; nextBtn.style.display='none'; doneBtn.disabled=false;
    renderPhasebar();
    prompt.textContent = cur.phase==='demo'?'Watch: the treats are shared out one by one so every plate is equal.'
      : 'Share ALL the treats so every plate has the SAME amount.';
    goal.innerHTML='\uD83C\uDF6A\u00D7'+cur.N+' <span class="mini">onto</span> '+plateIcons(cur.P)+' <span class="mini">equally</span>';
    drawTray(); drawPlates();
    Tel.push('t-sys','LOAD '+cur.phase+': '+cur.N+' treats, '+cur.P+' plates (fair share = '+(cur.N/cur.P)+')');
    if(cur.phase==='demo') ghostDemo();
    Tel.render();
  }
  function plateIcons(P){var s='';for(var i=0;i<P;i++)s+='\uD83C\uDF7D\uFE0F';return s;}

  doneBtn.onclick=function(){ if(cur.phase==='demo')return; commit(); };

  function commit(){
    var each=cur.N/cur.P;
    var allPlaced=(trayN===0);
    var equal=onPlate.every(function(x){return x===onPlate[0];});
    var correct=allPlaced&&equal&&onPlate[0]===each;
    var poly = (allPlaced?1:0) + (allPlaced&&equal?1:0); // 0..2
    var etype = correct?'correct':(!allPlaced?'leftover ('+trayN+' unplaced)':'uneven ['+onPlate.join(',')+']');
    var rt=perf()-itemStart;
    var optimal=cur.N, eff=optimal/Math.max(moves,optimal); // <=1
    if(cur.phase==='scored'){
      Tel.scored++; if(correct)Tel.correct++;
      Tel.polySum+=poly; Tel.polyMax+=2;
      Tel.effSum+=eff; Tel.effN++;
      Tel.persistSum+=rt; Tel.persistN++;
      Tel.push(correct?'t-acc':'t-err','SCORED: '+onPlate.join('|')+'  POLY='+poly+'/2  EFF='+Math.round(100*eff)+'%  moves='+moves+'  err='+etype+'  t='+rt+'ms');
    } else {
      Tel.push('t-sys',cur.phase.toUpperCase()+': '+onPlate.join('|')+' — not scored ('+etype+')');
    }
    fb.textContent = correct? (cur.phase==='warmup'?'Fair share! Now the real ones.':'Perfectly fair — every plate equal!')
                    : (!allPlaced?'Some treats are still in the tray.':'Not equal yet — check each plate.');
    fb.className='fb '+(correct?'good':'bad');
    doneBtn.disabled=true; nextBtn.style.display='inline-block';
    Tel.render();
  }
  nextBtn.onclick=loadItem;

  function ghostDemo(){
    doneBtn.disabled=true;
    var seq=[],p=0; for(var i=0;i<cur.N;i++){seq.push(p);p=(p+1)%cur.P;} // round robin
    hand.style.opacity='0';
    var base=350;
    seq.forEach(function(pl,i){
      setTimeout(function(){
        var plateEl=plates.children[pl];var r=plateEl.getBoundingClientRect();var wr=el('plates').getBoundingClientRect();
        hand.style.opacity='1';
        hand.style.left=(plateEl.offsetLeft+plateEl.offsetWidth/2-10)+'px';
        hand.style.top=(plates.offsetTop+10)+'px';
        trayN--; onPlate[pl]++; drawTray(); drawPlates();
        Tel.push('t-sys','ghost: 1 treat -> plate '+(pl+1));
      }, base + i*520);
    });
    setTimeout(function(){ beep(); fb.textContent='Every plate equal!'; fb.className='fb good';
      hand.style.opacity='0'; Tel.push('t-sys','ghost: all plates equal ('+onPlate.join('=')+')'); }, base + seq.length*520 + 200);
    setTimeout(function(){ loadItem(); }, base + seq.length*520 + 1200);
  }

  function beep(){try{var a=new(window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(620,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(960,a.currentTime+.15);g.gain.setValueAtTime(.12,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.3);o.start();o.stop(a.currentTime+.32);}catch(e){}}

  function finish(){
    el('goal').textContent=''; prompt.textContent='';
    document.querySelector('.stage').innerHTML='<div style="text-align:center;padding:30px 0">'+
      '<div style="font-size:44px">&#127881;</div><div style="color:var(--muted)">Sample complete. Telemetry captured on the right.</div></div>';
    Tel.push('t-sys','SESSION complete: '+Tel.correct+'/'+Tel.scored+' scored correct');
  }
  window.addEventListener('blur',function(){Tel.push('t-sys','engagement: focus lost');});
  Tel.render(); loadItem();
})();
</script>
</body>
</html>
