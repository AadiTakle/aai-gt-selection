<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-CONTRAPT-01 · Chain-Reaction Lab</title>
<style>
  :root{--bg1:#eafaf1;--bg2:#e6f0ff;--ink:#26304a;--card:#fff;--accent:#ff8a3d;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:14px;max-width:520px;width:100%}
  #grid{display:grid;gap:4px;background:#cfe3ff;padding:6px;border-radius:12px;position:relative}
  .cell{width:54px;height:54px;background:#f2f7ff;border-radius:8px;display:flex;align-items:center;
    justify-content:center;font-size:30px;cursor:pointer;transition:.12s;-webkit-tap-highlight-color:transparent}
  .cell:hover{background:#e3eeff}
  .cell.start{background:#fff3e0}.cell.goal{background:#e7fbef}
  .cell.ramp{background:#ffe9d6}
  #ball{position:absolute;font-size:30px;transition:left .18s linear,top .18s linear;pointer-events:none}
  #tray{display:flex;gap:12px;align-items:center}
  .tool{width:60px;height:60px;border:3px solid #e2e8fb;border-radius:14px;background:#fff;font-size:30px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s}
  .tool.sel{border-color:var(--accent);box-shadow:0 0 0 4px #ffe0c7}
  #controls{display:flex;gap:14px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:70px;height:70px;background:var(--accent);color:#fff;font-size:26px;font-weight:700;
    box-shadow:0 10px 24px -8px var(--accent);animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  #replay{width:48px;height:48px;background:#eef1ff;color:#5b6cff;font-size:22px}
  .shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .7s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:200px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-CONTRAPT-01 · Chain-Reaction Lab</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="grid"><div id="ball">⚪</div></div>
      <div id="tray">
        <div class="tool" data-t="R" title="right ramp">◢</div>
        <div class="tool" data-t="L" title="left ramp">◣</div>
      </div>
      <div id="controls">
        <button id="replay" title="replay demo">↻</button>
        <button id="go" title="run">RUN ▶</button>
      </div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const COLS=5,ROWS=6,SZ=58; // 54 + 4 gap
// levels: start col, goal col, optimal ramps
const LEVELS={warm:{start:2,goal:3,opt:1},s1:{start:0,goal:3,opt:3}};
const T={runs:0,solved:false,scored:0,correct:0,placements:0,firstLat:null,itemStart:0,firstActed:false,
  used:0,opt:0,reruns:0,failStates:0,persistMs:0};
const METERS=[
 {id:'M-ACC',name:'Solved (scored level)',get:()=>T.scored?`${T.correct}/${T.scored}`:'—'},
 {id:'M-EFF',name:'Efficiency vs optimal (ramps)',get:()=>T.used?`${T.opt}/${T.used}  ${Math.round(100*T.opt/Math.max(T.used,1))}%`:'—'},
 {id:'M-PATH',name:'Placements logged',get:()=>T.placements+''},
 {id:'M-EXPLORE',name:'Configs tested (RUN presses)',get:()=>T.runs+''},
 {id:'M-RTFIRST',name:'First-action latency (plan)',get:()=>T.firstLat==null?'—':T.firstLat+' ms'},
 {id:'M-HYP',name:'Failed tests before solve',get:()=>T.failStates+''},
 {id:'M-PROG',name:'Progress (rows fallen last run)',get:()=>T._prog==null?'—':T._prog+'/'+ROWS},
 {id:'M-PERSIST',name:'Time-on-task (ms)',get:()=>T.itemStart?(Date.now()-T.itemStart)+'':'—'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const t=T.itemStart?Date.now()-T.itemStart:0;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');
function gShow(v){ghost.classList.toggle('show',v)}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(720)}

let phase='demo',level=null,sel='R',grid=[];
function setCue(i){$('#phasecue').textContent=i}
function renderGrid(){const g=$('#grid');g.style.gridTemplateColumns=`repeat(${COLS},54px)`;
  [...g.querySelectorAll('.cell')].forEach(c=>c.remove());
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const d=document.createElement('div');d.className='cell';d.dataset.r=r;d.dataset.c=c;
    if(r===0&&c===level.start){d.classList.add('start')}
    if(r===ROWS-1&&c===level.goal){d.classList.add('goal');d.textContent='🎈'}
    if(grid[r][c]==='R'){d.classList.add('ramp');d.textContent='◢'}
    if(grid[r][c]==='L'){d.classList.add('ramp');d.textContent='◣'}
    g.appendChild(d)}
  placeBall(0,level.start,false)}
function placeBall(r,c,anim){const b=$('#ball');b.style.transition=anim?'':'none';b.style.left=(6+c*SZ+12)+'px';b.style.top=(6+r*SZ+12)+'px';if(!anim)requestAnimationFrame(()=>b.style.transition='')}
function newLevel(L){level={...L};grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;T.used=0;T.opt=L.opt;T.runs=0;T.placements=0;T.failStates=0;T._prog=null;T.solved=false;renderGrid();renderMeters()}
function onCell(el){if(phase==='demo'||phase==='done'||T.solved)return;const r=+el.dataset.r,c=+el.dataset.c;
  if((r===0&&c===level.start)||(r===ROWS-1&&c===level.goal))return;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first placement')}
  if(grid[r][c]){grid[r][c]=null;log('removed ramp @'+r+','+c)}
  else{grid[r][c]=sel;T.placements++;log('placed '+sel+'-ramp @'+r+','+c)}
  renderGrid();renderMeters()}
function countUsed(){let n=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c])n++;return n}
async function runBall(){const b=$('#ball');let r=0,c=level.start;placeBall(0,c,false);await sleep(200);
  for(r=0;r<ROWS;r++){if(grid[r][c]==='R')c=Math.min(COLS-1,c+1);else if(grid[r][c]==='L')c=Math.max(0,c-1);
    placeBall(r,c,true);await sleep(190)}
  T._prog=ROWS;return c===level.goal}
async function run(){if(phase==='demo'||phase==='done'||T.solved)return;
  T.runs++;T.used=countUsed();const ok=await runBall();renderMeters();
  if(ok){T.solved=true;$('#ball').textContent='🎉';
    if(phase==='scored'){T.scored++;T.correct++;log(`SOLVED scored · ramps ${T.used}/opt ${T.opt} · reruns ${T.runs} · firstLat ${T.firstLat}ms`);setCue('🏆');renderMeters();setTimeout(finish,1200)}
    else{log('warm-up solved (unscored)');setTimeout(startScored,1200)}}
  else{T.failStates++;log('missed 🎈 — ball landed col '+ (function(){let c=level.start;for(let r=0;r<ROWS;r++){if(grid[r][c]==='R')c=Math.min(COLS-1,c+1);else if(grid[r][c]==='L')c=Math.max(0,c-1)}return c})());
    $('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),420);
    setTimeout(()=>{$('#ball').textContent='⚪';placeBall(0,level.start,false)},600);renderMeters()}}
function startWarmup(){phase='warmup';setCue('⭐');newLevel(LEVELS.warm);log('— warm-up (unscored): bridge one gap —')}
function startScored(){phase='scored';setCue('🎯');newLevel(LEVELS.s1);log('— SCORED level: guide ball start→🎈 (optimal '+LEVELS.s1.opt+' ramps) —')}
function finish(){phase='done';log(`— DONE · solved ${T.correct}/${T.scored} · efficiency ${T.opt}/${T.used} —`)}
async function runDemo(){phase='demo';setCue('👁️');newLevel(LEVELS.warm);log('ghost-hand demo (wordless, <10s)');
  gShow(true);await sleep(300);await gTo($('.tool[data-t="R"]'));$('.tool[data-t="R"]').classList.add('sel');sel='R';await sleep(300);
  // place one right-ramp at row where ball col==start to nudge toward goal
  const target=$$('#grid .cell').find(c=>+c.dataset.r===2&&+c.dataset.c===level.start);
  await gTo(target);grid[2][level.start]='R';renderGrid();await sleep(300);
  await gTo($('#go'));await sleep(200);gShow(false);await runBall();$('#ball').textContent='🎉';
  await sleep(900);startWarmup()}
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.cell');if(c)onCell(c)});
$('#tray').addEventListener('click',e=>{const t=e.target.closest('.tool');if(!t)return;sel=t.dataset.t;$$('.tool').forEach(x=>x.classList.remove('sel'));t.classList.add('sel');log('tool='+sel)});
$('#go').addEventListener('click',run);
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo()});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
