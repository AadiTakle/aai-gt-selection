<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-RULERUSH-01 · Rule Rush</title>
<style>
  :root{--bg1:#fff3e8;--bg2:#eaf0ff;--ink:#26304a;--card:#fff;--accent:#f0842a;--good:#22b573;--bad:#ff6b6b;
    --red:#e5484d;--blue:#4b6bff;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:12px;width:470px;max-width:100%}
  #instr{font-size:14px;color:#666;min-height:20px;text-align:center}
  #banner{font-size:15px;font-weight:800;padding:6px 16px;border-radius:12px;background:#fff2e2;color:#a85e17;display:flex;gap:8px;align-items:center}
  #arena{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .bin{width:96px;height:104px;border-radius:16px;background:#f3f6ff;border:3px dashed #cdd6f5;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:13px;color:#7a86ad;-webkit-tap-highlight-color:transparent}
  .bin:active{transform:scale(.97)}
  .bin .sw{width:26px;height:26px;border-radius:50%}
  .bin .em{font-size:26px}
  #cardslot{flex:1;height:120px;display:flex;align-items:center;justify-content:center;position:relative}
  #card{font-size:74px;font-weight:900;line-height:1;transition:opacity .1s,transform .1s}
  #lock{position:absolute;font-size:64px;opacity:0}#lock.show{opacity:1}
  #combo{font-size:14px;color:var(--accent);font-weight:800;min-height:18px}
  #flash{position:absolute;inset:0;opacity:0;pointer-events:none;border-radius:16px}
  #controls{display:flex;gap:12px;align-items:center}
  #replay{width:44px;height:44px;background:#eef1ff;color:#5b6cff;font-size:20px;border-radius:50%;border:0;cursor:pointer}
  #ghost{position:fixed;left:0;top:0;font-size:34px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .4s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:170px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:900px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:250px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-RULERUSH-01 · Rule Rush</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="instr"></div>
      <div id="banner"></div>
      <div id="arena">
        <div class="bin" data-side="L"><span class="sw" style="background:var(--red)"></span><span class="em">★</span></div>
        <div id="cardslot"><div id="flash"></div><div id="card"></div><div id="lock">🔒</div></div>
        <div class="bin" data-side="R"><span class="sw" style="background:var(--blue)"></span><span class="em">☾</span></div>
      </div>
      <div id="combo"></div>
      <div id="controls"><button id="replay" title="replay demo">↻</button></div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
const sd=a=>{if(a.length<2)return null;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.round(Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)))};
const COLOR={red:'var(--red)',blue:'var(--blue)'},SHAPE={star:'★',moon:'☾'};
// correct side: color rule red->L blue->R ; shape rule star->L moon->R
function correctSide(card,rule){return rule==='color'?(card.color==='red'?'L':'R'):(card.shape==='star'?'L':'R')}
function otherSide(card,rule){return rule==='color'?(card.shape==='star'?'L':'R'):(card.color==='red'?'L':'R')}
const T={correct:0,total:0,rts:[],switchRT:[],repeatRT:[],cong:[],incong:[],persev:0,switches:0,comm:0,locks:0,combo:0,maxCombo:0};
const METERS=[
 {id:'M-ACC',name:'Accuracy',get:()=>T.total?`${T.correct}/${T.total}  ${Math.round(100*T.correct/T.total)}%`:'—'},
 {id:'M-RT',name:'Sort RT (mean)',get:()=>mean(T.rts)==null?'—':mean(T.rts)+' ms'},
 {id:'M-SWITCHCOST',name:'Switch cost',get:()=>{const s=mean(T.switchRT),r=mean(T.repeatRT);return s!=null&&r!=null?(s-r)+' ms':'—'}},
 {id:'M-CONGEFF',name:'Congruency cost',get:()=>{const i=mean(T.incong),c=mean(T.cong);return i!=null&&c!=null?(i-c)+' ms':'—'}},
 {id:'M-PERSEV',name:'Perseverative errors',get:()=>T.persev+`/${T.switches}sw`},
 {id:'M-COMM',name:'Lock commission',get:()=>T.locks?`${T.comm}/${T.locks}`:'0'},
 {id:'M-RTVAR',name:'RT variability (SD)',get:()=>sd(T.rts)==null?'—':sd(T.rts)+' ms'},
 {id:'M-COMBO',name:'Max accurate streak',get:()=>T.maxCombo+''},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const d=document.createElement('div');d.innerHTML=`<span class="t">•</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(360)}
function flash(col){const f=$('#flash');f.style.background=col;f.style.transition='none';f.style.opacity=.45;requestAnimationFrame(()=>{f.style.transition='opacity .3s';f.style.opacity=0})}
function combo(m){$('#combo').textContent=m}

let phase='demo',prevRule=null;const setCue=i=>$('#phasecue').textContent=i;
function setBanner(rule,lock){const b=$('#banner');b.innerHTML=lock?'🔒 <span>freeze — do not sort</span>':(rule==='color'?'🎨 <span>sort by COLOR</span>':'⬡ <span>sort by SHAPE</span>')}
function showCard(card){const c=$('#card');c.textContent=SHAPE[card.shape];c.style.color=COLOR[card.color]}
function clearCard(){$('#card').textContent='';$('#lock').classList.remove('show')}
function scoreResp(tr,side,rt,timeout){T.total++;const isSwitch=prevRule&&prevRule!==tr.rule&&!tr.lock;if(isSwitch&&!tr.lock)T.switches++;
  if(tr.lock){T.locks++;if(timeout){T.correct++;T.combo++;combo('good freeze! 🔒');log('lock: withheld ✓')}else{T.comm++;T.combo=0;flash('#ff6b6b');combo('oops — that was FREEZE');log('lock: sorted ✗ (commission)')}return}
  if(timeout){T.combo=0;combo('too slow');log('missed (no sort)');return}
  const cs=correctSide(tr.card,tr.rule),ok=side===cs;
  const cong=correctSide(tr.card,'color')===correctSide(tr.card,'shape');
  if(ok){T.correct++;T.rts.push(rt);T.combo++;T.maxCombo=Math.max(T.maxCombo,T.combo);combo('✓ '+rt+'ms');flash('#22b573');
    (cong?T.cong:T.incong).push(rt);if(isSwitch)T.switchRT.push(rt);else if(prevRule)T.repeatRT.push(rt);
    log(`${tr.rule}${isSwitch?' (switch)':''} ${cong?'cong':'incong'}: ✓ rt ${rt}`)}
  else{T.combo=0;flash('#ff6b6b');combo('✗');
    if(isSwitch&&side===otherSide(tr.card,tr.rule)){T.persev++;log(`${tr.rule} (switch): ✗ used OLD rule (perseveration)`)}else log(`${tr.rule}: ✗ wrong bin`)}
  if(!tr.lock)prevRule=tr.rule}
function trial(tr,win){return new Promise(res=>{let done=false;const t0=performance.now();setBanner(tr.rule,tr.lock);
  const onBin=e=>{const b=e.target.closest('.bin');if(!b||done)return;done=true;const rt=Math.round(performance.now()-t0);cleanup();scoreResp(tr,b.dataset.side,rt,false);renderMeters();setTimeout(res,240)};
  function cleanup(){$('#arena').removeEventListener('click',onBin);clearCard()}
  $('#arena').addEventListener('click',onBin);
  if(tr.lock){$('#lock').classList.add('show')}else showCard(tr.card);
  setTimeout(()=>{if(done)return;done=true;cleanup();scoreResp(tr,null,null,true);renderMeters();setTimeout(res,200)},win)})}
async function block(seq,win){for(const tr of seq){await sleep(480);await trial(tr,win)}}
const C=(color,shape)=>({color,shape});
const WARM=[{rule:'color',card:C('red','star')},{rule:'color',card:C('blue','moon')},{rule:'color',card:C('red','moon')}];
const SCORED=[{rule:'color',card:C('red','star')},{rule:'color',card:C('blue','moon')},{rule:'shape',card:C('blue','star')},
 {rule:'shape',card:C('red','moon')},{rule:'color',card:C('red','moon')},{lock:true,rule:'color'},{rule:'shape',card:C('red','star')},
 {rule:'color',card:C('blue','star')},{rule:'shape',card:C('blue','moon')},{lock:true,rule:'shape'},{rule:'color',card:C('red','moon')},{rule:'shape',card:C('blue','star')}];
async function startWarmup(){phase='warmup';prevRule=null;setCue('⭐');$('#instr').textContent='Warm-up: sort by COLOR — red goes left, blue goes right. (unscored)';await block(WARM,2600);startScored()}
async function startScored(){phase='scored';prevRule=null;setCue('🎯');$('#instr').textContent='SCORED: watch the banner — sort by COLOR or SHAPE. Freeze on 🔒. Fast and correct!';log('— SCORED switch + interference + lock —');await block(SCORED,1700);finish()}
function finish(){phase='done';setCue('🏆');combo('done!');$('#instr').textContent='Done! Nimble sorting.';const s=mean(T.switchRT),r=mean(T.repeatRT);log(`— DONE · acc ${Math.round(100*T.correct/T.total)}% · switch cost ${(s!=null&&r!=null)?(s-r):'-'}ms · perseverations ${T.persev} —`);renderMeters()}
async function runDemo(){phase='demo';setCue('👁️');$('#instr').textContent='';setBanner('color',false);log('ghost-hand demo (wordless, <10s)');gShow(true);
  showCard(C('red','star'));await sleep(500);await gTo($('.bin[data-side="L"]'));flash('#22b573');combo('red → left');await sleep(600);clearCard();
  setBanner('shape',false);showCard(C('red','moon'));combo('now sort by shape');await sleep(700);await gTo($('.bin[data-side="R"]'));flash('#22b573');combo('moon → right');await sleep(600);clearCard();gShow(false);combo('');await sleep(300);startWarmup()}
$('#replay').addEventListener('click',()=>{if(phase==='done')runDemo()});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
