<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPA-ROLL-01 · Rolling Cube</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#ecf7ff;--ink:#26304a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:640px;width:100%}
  #top{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
  .netlab{font-size:11px;color:#8a93b5;text-transform:uppercase;letter-spacing:.06em;text-align:center}
  #board{position:relative;background:#f6f8ff;border-radius:14px}
  #cube{position:absolute;width:44px;height:44px;border-radius:8px;background:linear-gradient(145deg,#6d84d8,#4a5cc0);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;box-shadow:0 6px 14px -6px #3f4f9e;transition:left .45s cubic-bezier(.4,.1,.2,1),top .45s cubic-bezier(.4,.1,.2,1),transform .2s;z-index:5}
  #cube.flip{transform:scale(1.15) rotate(8deg)}
  #ask{display:none;flex-direction:column;align-items:center;gap:10px}
  #ask.on{display:flex}
  .faceopts{display:flex;gap:10px}
  .fopt{width:52px;height:52px;border-radius:12px;border:3px solid #e2e7f5;background:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .fopt.sel{border-color:var(--accent);box-shadow:0 0 0 3px #dfe4ff}
  .fopt.good{border-color:var(--good);background:#eafaf1}.fopt.bad{border-color:var(--bad);background:#fdeeee}
  #tools{display:flex;gap:12px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:14px}
  #play{padding:11px 22px;background:var(--accent);color:#fff;font-weight:700}
  #confirm{padding:11px 20px;background:var(--good);color:#fff;font-weight:700;opacity:.4;pointer-events:none}
  #confirm.ready{opacity:1;pointer-events:auto}
  #replay{width:46px;height:46px;border-radius:50%;background:#eef1ff;color:#5b6cff;font-size:20px}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;transition:transform .6s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:180px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:270px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">SPA-ROLL-01 · Rolling Cube</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="top">
        <div><div class="netlab">start faces</div><div id="net"></div></div>
        <div><div class="netlab">path</div><div id="board"></div></div>
      </div>
      <div id="ask">
        <div style="font-size:14px;color:#8a93b5">which picture is on TOP now?</div>
        <div class="faceopts" id="faceopts"></div>
      </div>
      <div id="tools">
        <button id="replay" title="replay demo">↻</button>
        <button id="play">▶ Roll</button>
        <button id="confirm">Lock ✓</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const SYMS=[{s:'★',c:'#e6194b'},{s:'●',c:'#4363d8'},{s:'▲',c:'#2ca25f'},{s:'■',c:'#f58231'},{s:'♦',c:'#911eb4'},{s:'✚',c:'#00a3a3'}];
function initFaces(){const idx=[0,1,2,3,4,5];return{top:SYMS[0],bottom:SYMS[1],north:SYMS[2],south:SYMS[3],east:SYMS[4],west:SYMS[5]};}
function roll(f,dir){const n={...f};
  if(dir==='E'){n.top=f.west;n.east=f.top;n.bottom=f.east;n.west=f.bottom;}
  else if(dir==='W'){n.top=f.east;n.west=f.top;n.bottom=f.west;n.east=f.bottom;}
  else if(dir==='S'){n.top=f.north;n.south=f.top;n.bottom=f.south;n.north=f.bottom;}
  else if(dir==='N'){n.top=f.south;n.north=f.top;n.bottom=f.north;n.south=f.bottom;}
  return n;}
function faceSym(fc){return `<span style="color:${fc.c}">${fc.s}</span>`;}
function netSVG(f){const c=44;const cellsvg=(fc)=>fc?`<div style="width:${c}px;height:${c}px;border:1px solid #cdd6f4;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;color:${fc.c};background:#fff">${fc.s}</div>`:`<div style="width:${c}px;height:${c}px"></div>`;
  const row=(a,b,cc)=>`<div style="display:flex;gap:2px">${cellsvg(a)}${cellsvg(b)}${cellsvg(cc)}</div>`;
  return `<div style="display:flex;flex-direction:column;gap:2px;align-items:flex-start">${row(null,f.north,null)}${row(f.west,f.top,f.east)}${row(null,f.south,null)}${row(null,f.bottom,null)}</div>`;}

/* telemetry */
const T={acc:0,n:0,rts:[],firsts:[],revs:0,errTypes:[],prog:[],maxRolls:0,itemStart:0,firstTap:null};
function progStr(){return T.prog.length?T.prog.join(''):'\u2014';}
function errStr(){if(!T.errTypes.length)return 'none';const c={};T.errTypes.forEach(e=>c[e]=(c[e]||0)+1);return Object.entries(c).map(([k,v])=>k+':'+v).join(' ');}
const METERS=[
 {id:'M-ACC',name:'Final top-face correct / items',get:()=>T.n?`${T.acc}/${T.n}`:'\u2014'},
 {id:'M-PATH',name:'Roll directions',get:()=>curPath?curPath.join(''):'\u2014'},
 {id:'M-PROG',name:'Per-step tracking (step mode)',get:()=>progStr()},
 {id:'M-RT',name:'Response time (mean)',get:()=>T.rts.length?mean(T.rts)+' ms':'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency (mean)',get:()=>T.firsts.length?mean(T.firsts)+' ms':'\u2014'},
 {id:'M-REV',name:'Selection changes',get:()=>T.revs+''},
 {id:'M-ERRTYPE',name:'Error type (axis vs flip vs other)',get:()=>errStr()},
 {id:'M-DIFFREACH',name:'Most rolls solved correctly',get:()=>T.maxRolls||'\u2014'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');const ghostShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(560);}

/* board */
function pathCoords(dirs){let x=0,y=0;const pts=[{x,y}];dirs.forEach(d=>{if(d==='E')x++;else if(d==='W')x--;else if(d==='S')y++;else y--;pts.push({x,y});});return pts;}
let phase='demo',faces0=null,curFaces=null,curPath=null,pts=[],stepMode=true,stepIdx=0,sel=-1,seq=[],si=0;
const CELL=52;
function setCue(i){$('#phasecue').textContent=i;}
function drawBoard(){const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);const minX=Math.min(...xs),minY=Math.min(...ys),maxX=Math.max(...xs),maxY=Math.max(...ys);
  const W=(maxX-minX+1)*CELL+8,H=(maxY-minY+1)*CELL+8;const b=$('#board');b.style.width=W+'px';b.style.height=H+'px';
  let h='';pts.forEach((p,i)=>{const L=4+(p.x-minX)*CELL,Tp=4+(p.y-minY)*CELL;h+=`<div style="position:absolute;left:${L}px;top:${Tp}px;width:${CELL-6}px;height:${CELL-6}px;border-radius:8px;background:${i===0?'#dfe7ff':'#eef1fb'};border:2px ${i===pts.length-1?'solid #b7c2ea':'dashed #cdd6f4'}"></div>`;});
  h+=`<div id="cube">?</div>`;b.innerHTML=h;b._minX=minX;b._minY=minY;placeCube(0);}
function placeCube(i){const b=$('#board');const c=$('#cube');const p=pts[i];c.style.left=(4+(p.x-b._minX)*CELL+3)+'px';c.style.top=(4+(p.y-b._minY)*CELL+3)+'px';}
function renderFaceOpts(){$('#faceopts').innerHTML=SYMS.map((s,i)=>`<div class="fopt" data-i="${i}"><span style="color:${s.c}">${s.s}</span></div>`).join('');}
function selectFace(i){if(phase==='demo'||phase==='done'||!$('#ask').classList.contains('on'))return;if(T.firstTap===null){T.firstTap=Date.now()-T.itemStart;}
  if(sel!==-1&&sel!==i)T.revs++;sel=i;$$('.fopt').forEach(el=>el.classList.toggle('sel',+el.dataset.i===i));$('#confirm').classList.add('ready');}
async function doRoll(){ // roll to end (one-shot) or one step
  $('#play').disabled=true;$('#ask').classList.remove('on');sel=-1;$('#confirm').classList.remove('ready');
  const end=stepMode?stepIdx+1:pts.length-1;
  for(let i=stepIdx+1;i<=end;i++){const dir=curPath[i-1];$('#cube').classList.add('flip');await sleep(200);curFaces=roll(curFaces,dir);placeCube(i);await sleep(300);$('#cube').classList.remove('flip');await sleep(120);}
  stepIdx=end;$('#play').disabled=false;askPrediction();}
function askPrediction(){$('#ask').classList.add('on');renderFaceOpts();T._askStart=Date.now();
  $('#play').style.display=stepMode&&stepIdx<pts.length-1?'':'none';
  log(`rolled to square ${stepIdx}/${pts.length-1} — pick the TOP face`);}
function confirmFace(){if(sel===-1)return;const rt=Date.now()-T._askStart;const truth=SYMS.findIndex(s=>s.s===curFaces.top.s);const ok=sel===truth;
  const isFinal=stepIdx===pts.length-1;
  T.prog.push(ok?'\u2713':'\u2717');T.rts.push(rt);if(T.firstTap!=null){T.firsts.push(T.firstTap);T.firstTap=null;}
  if(!ok){const chosen=SYMS[sel];const side=[curFaces.north,curFaces.south,curFaces.east,curFaces.west].some(f=>f.s===chosen.s);const flip=curFaces.bottom.s===chosen.s;T.errTypes.push(flip?'flip':side?'axis':'other');}
  $$('.fopt')[sel].classList.add(ok?'good':'bad');if(!ok)$$('.fopt')[truth].classList.add('good');
  log(`answer ${SYMS[sel].s} · truth ${curFaces.top.s} · ${ok?'\u2713':'\u2717'} (step ${stepIdx})`);
  if(isFinal||!stepMode){T.n++;if(ok){T.acc++;T.maxRolls=Math.max(T.maxRolls,curPath.length);}renderMeters();$('#confirm').classList.remove('ready');
    phase='between';setTimeout(()=>{si++;si<seq.length?startItem(seq[si]):finish();},1000);return;}
  renderMeters();$('#confirm').classList.remove('ready');$('#ask').classList.remove('on');sel=-1;
  setTimeout(()=>{$('#play').textContent='▶ Roll next';},300);}
function startItem(cfg){phase=cfg.warm?'warmup':'scored';faces0=initFaces();curFaces={...faces0};curPath=cfg.path;pts=pathCoords(curPath);stepMode=cfg.step;stepIdx=0;sel=-1;T.itemStart=Date.now();T.firstTap=null;T.prog=cfg.step?[]:T.prog;
  $('#net').innerHTML=netSVG(faces0);drawBoard();$('#ask').classList.remove('on');$('#play').style.display='';$('#play').textContent='▶ Roll';$('#play').disabled=false;renderMeters();setCue(cfg.warm?'\u2b50':'\ud83c\udfaf');
  log(`— ${cfg.warm?'warm-up':'SCORED'} (${cfg.step?'step':'one-shot'}): roll the cube along the path, then name the TOP face —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');$('#play').style.display='none';log(`— DONE · final-top ${T.acc}/${T.n} · most rolls ${T.maxRolls} —`);}
async function runDemo(){phase='demo';si=0;faces0=initFaces();curFaces={...faces0};curPath=['E'];pts=pathCoords(curPath);stepMode=true;stepIdx=0;T.itemStart=Date.now();
  $('#net').innerHTML=netSVG(faces0);drawBoard();log('ghost-hand demo (wordless): one roll swaps the top with a side face');ghostShow(true);await sleep(400);
  await ghostTo($('#play'));$('#cube').classList.add('flip');await sleep(200);curFaces=roll(curFaces,'E');placeCube(1);await sleep(300);$('#cube').classList.remove('flip');
  $('#ask').classList.add('on');renderFaceOpts();const truth=SYMS.findIndex(s=>s.s===curFaces.top.s);await ghostTo($$('.fopt')[truth]);$$('.fopt')[truth].classList.add('sel');await sleep(300);$$('.fopt')[truth].classList.add('good');await sleep(700);
  ghostShow(false);$('#ask').classList.remove('on');log('demo done — your turn (warm-up)');
  seq=[{warm:true,step:true,path:['E']},{step:true,path:['E','E','S']},{step:false,path:['E','S','E','N']}];startItem(seq[0]);}
$('#faceopts').addEventListener('click',e=>{const f=e.target.closest('.fopt');if(f)selectFace(+f.dataset.i);});
$('#play').addEventListener('click',()=>{if(phase!=='demo'&&phase!=='done')doRoll();});
$('#confirm').addEventListener('click',()=>{if($('#confirm').classList.contains('ready'))confirmFace();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
