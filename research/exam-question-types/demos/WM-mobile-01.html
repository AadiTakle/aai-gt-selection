<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-mobile-01 — Mobile Stash (nonverbal complex span)</title>
<style>
  :root{
    --bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;
    --accent:#c79bff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
  h1{font-size:19px;margin:.2rem 0}
  .sub{color:var(--mut);font-size:13px;margin:0 0 6px;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--accent);font-size:12px}
  #stage{position:relative;width:420px;height:300px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .beam{position:relative;width:300px;height:8px;background:#c9d2ff;border-radius:6px;transition:transform .5s ease}
  .pan{position:absolute;top:8px;width:96px;height:70px;border:3px solid #c9d2ff;border-top:none;border-radius:0 0 48px 48px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;padding:6px}
  .pan.l{left:-48px}.pan.r{right:-48px}
  .w{width:14px;height:14px;border-radius:50%;background:var(--warn)}
  .charm{width:56px;height:56px;border-radius:50%;box-shadow:0 0 18px 4px #fff2;display:inline-block}
  #cue{font-size:24px;min-height:34px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 10px}
  #ghost{position:absolute;font-size:28px;left:0;top:0;transition:left .4s,top .4s;pointer-events:none;z-index:5;opacity:0;filter:drop-shadow(0 3px 3px #0008)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:9px 16px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#1a0740;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .ans{min-width:74px;font-size:20px}
  .pal{display:flex;gap:10px;justify-content:center}
  .pal .charm{cursor:pointer}
  .modebtn.on{background:var(--warn);color:#3a2c00;border-color:transparent;font-weight:600}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}
  .kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot{display:inline-block;width:34px;height:34px;border-radius:50%;border:2px dashed #3a4470;margin:0 3px;vertical-align:middle}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>⚖️ Mobile Stash <span class="badge" id="bmode">Balance</span></h1>
    <p class="sub">Solve the quick puzzle (which side tips down?), watch the charm, and after a few rounds tap the charms back <b>in order</b>.</p>
  </div>
  <div id="stage"><div class="beam" id="beam"><div class="pan l" id="panL"></div><div class="pan r" id="panR"></div></div><div id="ghost">👆</div></div>
  <div id="cue">👀</div>
  <div class="row" id="answers" style="display:none">
    <button class="ans" data-a="L">⬅️ Left</button>
    <button class="ans" data-a="E">⚖️ Level</button>
    <button class="ans" data-a="R">Right ➡️</button>
  </div>
  <div class="row pal" id="palette" style="display:none"></div>
  <div class="row">
    <button class="pri" id="go">▶ Watch how it works</button>
    <button id="replay" disabled>↺ Replay demo</button>
    <button class="modebtn" id="pmode" title="processing module">Symmetry module</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand will show you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const beam=$("#beam"),panL=$("#panL"),panR=$("#panR"),cue=$("#cue"),ghost=$("#ghost"),stage=$("#stage");
const COLORS=[["#ff6b8a","🔴"],["#5cc8ff","🔵"],["#ffd166","🟡"],["#5ce39a","🟢"]];
const T={phase:"idle",proc:"balance",cycle:0,set:2,spanMax:0,correct:0,total:0,
  procHit:0,procTot:0,procRT:[],posHit:Array(9).fill(0),posTot:Array(9).fill(0),
  orderErr:0,itemErr:0,byLen:{},log:[]};
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m;}
function consistency(){let p=0,ag=0;for(const k in T.byLen){const a=T.byLen[k];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){p++;if(a[i]===a[j])ag++;}}return p?Math.round(100*ag/p):"—";}
function polyPct(){const h=T.posHit.reduce((a,b)=>a+b,0),t=T.posTot.reduce((a,b)=>a+b,0);return t?Math.round(100*h/t):0;}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop();}
function render(){
  const acc=T.total?Math.round(100*T.correct/T.total):0;const pa=T.procTot?Math.round(100*T.procHit/T.procTot):0;
  const gate=pa>=80?"✓ valid":"✗ gated";
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-mobile-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>module</span><b>${T.proc}</b></div>
  <div class="kv"><span>set size</span><b>${T.set}</b></div>
  <h2>Storage span</h2>
  <div class="kv"><span>recall span <span class="m">M-SPAN</span></span><b>${T.set}</b></div>
  <div class="kv"><span>max set solved <span class="m">M-DIFFREACH</span></span><b>${T.spanMax}</b></div>
  <div class="kv"><span>recall accuracy <span class="m">M-ACC</span></span><b>${acc}% <span class="m">(${T.correct}/${T.total})</span></b></div>
  <div class="kv"><span>partial credit <span class="m">M-POLY</span></span><b>${polyPct()}%</b></div>
  <h2>Processing gate</h2>
  <div class="kv"><span>proc. accuracy <span class="m">M-PROCACC</span></span><b>${pa}% <span class="m">${gate}</span></b></div>
  <div class="kv"><span>proc. RT var <span class="m">M-RTVAR</span></span><b>${cv(T.procRT).toFixed(2)}</b></div>
  <h2>Errors & consistency</h2>
  <div class="kv"><span>order errors <span class="m">M-ERRTYPE</span></span><b>${T.orderErr}</b></div>
  <div class="kv"><span>item errors <span class="m">M-ERRTYPE</span></span><b>${T.itemErr}</b></div>
  <div class="kv"><span>consistency <span class="m">M-CONSIST</span></span><b>${consistency()}${consistency()==="—"?"":"%"}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();
function setPans(l,r){panL.innerHTML="";panR.innerHTML="";for(let i=0;i<l;i++)panL.innerHTML+='<div class="w"></div>';for(let i=0;i<r;i++)panR.innerHTML+='<div class="w"></div>';const diff=r-l;beam.style.transform=`rotate(${Math.max(-12,Math.min(12,diff*4))}deg)`;}
function centerBtn(a){const b=document.querySelector(`.ans[data-a="${a}"]`);const r=b.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2};}
function makeProc(){ // returns {render, correct}
  if(T.proc==="balance"){const l=1+(Math.random()*4|0);let r=1+(Math.random()*4|0);if(Math.random()<.2)r=l;setPans(l,r);return {correct:r>l?"R":r<l?"L":"E"};}
  else{ // symmetry: pans mirror? show equal(symmetric)=E else which heavier
    const sym=Math.random()<.5;const l=1+(Math.random()*3|0);const r=sym?l:l+1+(Math.random()*2|0);setPans(l,r);return {correct:sym?"E":"R"};}
}
async function askProc(scored){
  const p=makeProc();cue.textContent=T.proc==="balance"?"Which side tips down?":"Balanced, or which is heavier?";
  $("#answers").style.display="flex";const t0=performance.now();
  const ans=await new Promise(res=>{
    let done=false;const to=setTimeout(()=>{if(!done){done=true;res(null);}},3500);
    document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>{if(done)return;done=true;clearTimeout(to);res(b.dataset.a);});
  });
  $("#answers").style.display="none";
  const ok=ans===p.correct;
  if(scored){T.procTot++;if(ok)T.procHit++;if(ans)T.procRT.push(performance.now()-t0);}
  return ok;
}
async function showCharm(ci){const c=document.createElement("div");c.className="charm";c.style.background=COLORS[ci][0];cue.textContent="";stage.appendChild(c);await sleep(850);c.remove();}
async function recall(seq,scored){
  cue.textContent="Tap the charms back in order";const pal=$("#palette");pal.style.display="flex";pal.innerHTML="";
  COLORS.forEach((c,ci)=>{const d=document.createElement("div");d.className="charm";d.style.background=c[0];d.dataset.ci=ci;pal.appendChild(d);});
  const picks=[];
  await new Promise(res=>{pal.querySelectorAll(".charm").forEach(d=>d.onclick=()=>{picks.push(+d.dataset.ci);d.style.transform="scale(.8)";setTimeout(()=>d.style.transform="",120);if(picks.length===seq.length)res();});});
  pal.style.display="none";
  let correct=true;for(let k=0;k<seq.length;k++){const ok=picks[k]===seq[k];if(scored){T.posTot[k]++;if(ok)T.posHit[k]++;}if(!ok){correct=false;if(scored){if(seq.includes(picks[k]))T.orderErr++;else T.itemErr++;}}}
  return correct;
}
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=$("#replay").disabled=$("#pmode").disabled=true;
  setPans(1,3);cue.textContent="👀";await sleep(500);$("#answers").style.display="flex";
  ghost.style.opacity="1";const gp=centerBtn("R");ghost.style.left=(gp.x-12)+"px";ghost.style.top=(gp.y-26)+"px";await sleep(700);
  document.querySelector('.ans[data-a="R"]').style.outline="3px solid #5ce39a";await sleep(500);document.querySelector('.ans[data-a="R"]').style.outline="";$("#answers").style.display="none";
  await showCharm(0);setPans(2,2);await sleep(400);await showCharm(2);
  cue.textContent="Now tap them back in order";ghost.style.opacity="0";
  const pal=$("#palette");pal.style.display="flex";pal.innerHTML="";COLORS.forEach((c,ci)=>{const d=document.createElement("div");d.className="charm";d.style.background=c[0];pal.appendChild(d);});
  await sleep(400);pal.children[0].style.outline="3px solid #5ce39a";await sleep(500);pal.children[0].style.outline="";pal.children[2].style.outline="3px solid #5ce39a";await sleep(500);pal.style.display="none";
  cue.textContent="✅";await sleep(600);
  $("#go").disabled=$("#replay").disabled=$("#pmode").disabled=false;$("#go").textContent="▶ Try a practice one";$("#go").onclick=warmup;
  T.phase="idle";$("#phasehint").textContent="Now you try — this practice round is NOT scored.";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;
async function runSet(scored){
  $("#go").disabled=$("#replay").disabled=$("#pmode").disabled=true;
  const n=T.set,seq=[];let procOK=0;
  for(let k=0;k<n;k++){const ok=await askProc(scored);if(ok)procOK++;await sleep(200);const ci=Math.random()*COLORS.length|0;seq.push(ci);await showCharm(ci);await sleep(200);}
  const recOK=await recall(seq,scored);
  const procRate=procOK/n;const valid=procRate>=0.8;
  cue.textContent=recOK?(valid?"✅":"✅ (check puzzles!)"):"↔️";
  if(scored){
    T.total++;if(recOK&&valid)T.correct++;(T.byLen[n]=T.byLen[n]||[]).push(recOK?1:0);
    if(recOK&&valid&&n>T.spanMax)T.spanMax=n;
    logE(`set ${n}: recall ${recOK?"OK":"miss"}, proc ${Math.round(procRate*100)}%`);
    if(recOK&&valid)T.set=Math.min(7,T.set+1);else T.set=Math.max(2,T.set-1);T.cycle++;
  }
  render();await sleep(800);cue.textContent="";$("#go").disabled=$("#replay").disabled=$("#pmode").disabled=false;
}
async function warmup(){T.phase="warm-up (unscored)";render();await runSet(false);T.phase="idle";$("#go").textContent="▶ Start scored rounds";$("#go").onclick=startScored;$("#phasehint").textContent="Great! These count. Solve the puzzle AND remember the charms.";render();}
let left=0;
async function startScored(){T.phase="scored";T.set=2;render();left=6;$("#go").disabled=true;await loop();}
async function loop(){if(left<=0){finish();return;}await runSet(true);left--;if(left>0)await loop();else finish();}
function finish(){T.phase="done";render();cue.textContent="🏁";$("#go").disabled=false;$("#go").textContent="▶ Run another block";$("#go").onclick=startScored;const pa=T.procTot?Math.round(100*T.procHit/T.procTot):0;$("#phasehint").textContent=`Done. Max set solved ${T.spanMax||"—"} at ${pa}% processing accuracy${pa<80?" (span gated — processing too low)":""}.`;}
$("#pmode").onclick=()=>{T.proc=T.proc==="balance"?"symmetry":"balance";$("#bmode").textContent=T.proc==="balance"?"Balance":"Symmetry";$("#pmode").textContent=T.proc==="balance"?"Symmetry module":"Balance module";$("#pmode").classList.toggle("on",T.proc==="symmetry");logE(`module → ${T.proc}`);render();};
</script>
</body>
</html>
