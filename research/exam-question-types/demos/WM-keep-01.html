<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-keep-01 — Acorn Keeper (delayed span with filled retention interval)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;
    --accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;--dirt:#3a2b1c;--sky:#16305a;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
  h1{font-size:19px;margin:.2rem 0}
  .sub{color:var(--mut);font-size:13px;margin:0 0 6px;text-align:center;max-width:490px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--accent);font-size:12px}
  #stage{position:relative;width:430px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:0;overflow:hidden}
  #sky{position:relative;height:130px;background:linear-gradient(180deg,var(--sky),#0e1f3d);overflow:hidden}
  #delaytxt{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:13px;color:#cfe0ff;pointer-events:none}
  .crow{position:absolute;font-size:30px;cursor:pointer;user-select:none;transition:transform .06s}
  .crow:active{transform:scale(.85)}
  .crow.gone{opacity:0;transition:opacity .18s}
  #ground{background:linear-gradient(180deg,#4a3722,var(--dirt));padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .burrow{position:relative;height:74px;background:#2a1f14;border-radius:50%/40%;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;box-shadow:inset 0 6px 10px #0009;transition:transform .08s,box-shadow .12s}
  .burrow:active{transform:scale(.95)}
  .burrow.lit{box-shadow:inset 0 0 0 3px var(--warn),0 0 20px 3px #ffd16688}
  .burrow.pick{box-shadow:inset 0 0 0 3px var(--accent)}
  .burrow.ok{box-shadow:inset 0 0 0 3px var(--good)}
  .burrow.no{box-shadow:inset 0 0 0 3px var(--bad)}
  .burrow .ord{position:absolute;top:4px;right:8px;font-size:13px;font-weight:700;color:#fff}
  #ghost{position:absolute;font-size:26px;left:0;top:0;transition:left .4s cubic-bezier(.5,0,.3,1),top .4s cubic-bezier(.5,0,.3,1);pointer-events:none;filter:drop-shadow(0 3px 3px #0008);z-index:20;opacity:0}
  #cue{font-size:26px;height:32px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:9px 16px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}
  .kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🐿️ Acorn Keeper <span class="badge" id="binfo">span 3 · wait 3s</span></h1>
    <p class="sub">Remember which burrows the squirrel fills with acorns, <b>in order</b>. Then shoo the crows while you wait. When the coast is clear, tap the burrows back in order.</p>
  </div>
  <div id="stage">
    <div id="sky"><div id="delaytxt"></div></div>
    <div id="ground"></div>
    <div id="ghost">👆</div>
  </div>
  <div id="cue">👀</div>
  <div class="row"><button class="pri" id="go">▶ Watch how it works</button></div>
  <p class="sub" id="hint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const sky=$("#sky"),ground=$("#ground"),stage=$("#stage"),ghost=$("#ghost"),cue=$("#cue"),delaytxt=$("#delaytxt");
const NB=6,burrows=[];
function build(){ground.innerHTML="";burrows.length=0;for(let i=0;i<NB;i++){const b=document.createElement("div");b.className="burrow";b.dataset.i=i;b.textContent="🕳️";burrows.push(b);ground.appendChild(b);}}
let AC=null;function beep(f){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.value=.05;o.start();o.stop(AC.currentTime+.15);}catch(e){}}
const T={phase:"idle",trial:0,span:3,delay:3000,spanMax:0,delayMax:0,correct:0,total:0,
  orderErr:0,itemErr:0,crowHit:0,crowTot:0,bySpan:{},accSeries:[],log:[]};
function consistency(){let p=0,ag=0;for(const k in T.bySpan){const a=T.bySpan[k];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){p++;if(a[i]===a[j])ag++;}}return p?Math.round(100*ag/p):"—";}
function drift(){if(T.accSeries.length<4)return"—";const n=T.accSeries.length,h=n>>1;const a=T.accSeries.slice(0,h),b=T.accSeries.slice(h);const m=x=>x.reduce((s,v)=>s+v,0)/x.length;return Math.round(100*(m(b)-m(a)))+"%";}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>50)T.log.pop();}
function render(){
  const acc=T.total?Math.round(100*T.correct/T.total):0;
  const proc=T.crowTot?Math.round(100*T.crowHit/T.crowTot):0;
  const gate=proc>=70||T.crowTot===0;
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-keep-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>span · retention</span><b>${T.span} · ${(T.delay/1000).toFixed(1)}s</b></div>
  <div class="kv"><span>scored rounds</span><b>${T.trial}</b></div>
  <h2>Capacity across a filled delay</h2>
  <div class="kv"><span>delayed span <span class="m">M-SPAN</span></span><b>${T.spanMax}</b></div>
  <div class="kv"><span>max wait survived <span class="m">M-DIFFREACH</span></span><b>${(T.delayMax/1000).toFixed(1)}s</b></div>
  <div class="kv"><span>ordered accuracy <span class="m">M-ACC</span></span><b>${acc}% <span class="m">(${T.correct}/${T.total})</span></b></div>
  <div class="kv"><span>consistency <span class="m">M-CONSIST</span></span><b>${consistency()}${consistency()==="—"?"":"%"}</b></div>
  <h2>Validity gate</h2>
  <div class="kv"><span>shoo accuracy <span class="m">M-PROCACC</span></span><b style="color:${gate?'var(--good)':'var(--bad)'}">${proc}%</b></div>
  <div class="kv"><span>engagement drift <span class="m">M-DRIFT</span></span><b>${drift()}</b></div>
  <h2>Error grain <span class="m">M-ERRTYPE</span></h2>
  <div class="kv"><span>order errors</span><b>${T.orderErr}</b></div>
  <div class="kv"><span>wrong-burrow errors</span><b>${T.itemErr}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();build();
function centerOf(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2};}
function clear(){burrows.forEach(b=>{b.className="burrow";b.textContent="🕳️";b.querySelector(".ord")?.remove();});}
function pick(n){const idx=[...Array(NB).keys()];for(let i=idx.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[idx[i],idx[j]]=[idx[j],idx[i]];}return idx.slice(0,n);}
async function showSeq(seq){cue.textContent="👀";for(const i of seq){const b=burrows[i];b.classList.add("lit");b.textContent="🌰";beep(523);await sleep(560);b.classList.remove("lit");b.textContent="🕳️";await sleep(240);}}
function spawnCrow(){const c=document.createElement("div");c.className="crow";c.textContent="🐦‍⬛";c.style.left=(6+Math.random()*80)+"%";c.style.top=(10+Math.random()*70)+"%";sky.appendChild(c);return c;}
async function fillDelay(ms,scored){
  cue.textContent="🐦‍⬛";const t0=performance.now();let localHit=0,localTot=0;
  const crows=[];let alive=true;
  function tap(e){const c=e.target.closest(".crow");if(!c||c.classList.contains("gone"))return;c.classList.add("gone");localHit++;if(scored)T.crowHit++;beep(300);setTimeout(()=>c.remove(),200);}
  sky.addEventListener("click",tap);
  while(performance.now()-t0<ms){
    const remain=Math.max(0,ms-(performance.now()-t0));delaytxt.textContent="🌰 keep them in mind · "+(remain/1000).toFixed(1)+"s";
    const c=spawnCrow();crows.push(c);localTot++;if(scored)T.crowTot++;
    await sleep(650);
    // crows that were never tapped just fly off (counted as opportunities)
  }
  delaytxt.textContent="";sky.removeEventListener("click",tap);crows.forEach(c=>c.remove());
  return localTot?localHit/localTot:1;
}
async function recall(seq,scored){
  cue.textContent="👆";$("#hint").textContent=scored?"Coast is clear — tap the burrows in order.":"Practice — tap the burrows in order.";
  const picks=[];
  await new Promise(res=>{
    function onTap(e){const b=e.target.closest(".burrow");if(!b)return;const i=+b.dataset.i;if(picks.includes(i))return;
      picks.push(i);b.classList.add("pick");const o=document.createElement("span");o.className="ord";o.textContent=picks.length;b.appendChild(o);
      if(picks.length===seq.length){ground.removeEventListener("click",onTap);res();}
    }
    ground.addEventListener("click",onTap);
  });
  let correct=true;
  for(let k=0;k<seq.length;k++){const ok=picks[k]===seq[k];burrows[picks[k]].classList.add(ok?"ok":"no");
    if(!ok){correct=false;if(scored){if(seq.includes(picks[k]))T.orderErr++;else T.itemErr++;}}}
  return correct;
}
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;clear();
  const seq=[0,4];await showSeq(seq);
  // brief ghosted delay with one crow
  cue.textContent="🐦‍⬛";const c=spawnCrow();c.style.left="40%";c.style.top="30%";ghost.style.opacity="1";
  let p=centerOf(c);ghost.style.left=(p.x-12)+"px";ghost.style.top=(p.y-24)+"px";await sleep(650);c.classList.add("gone");beep(300);await sleep(300);c.remove();
  // ghost recall
  cue.textContent="👆";for(const i of seq){p=centerOf(burrows[i]);ghost.style.left=(p.x-12)+"px";ghost.style.top=(p.y-24)+"px";await sleep(520);burrows[i].classList.add("ok");}
  cue.textContent="✅";await sleep(800);ghost.style.opacity="0";clear();
  $("#go").disabled=false;$("#go").textContent="▶ Try a practice one";$("#go").onclick=warmup;
  T.phase="idle";$("#hint").textContent="Now you try — this practice one is NOT scored.";render();
}
$("#go").onclick=demo;
async function runRound(scored){
  $("#go").disabled=true;clear();
  const seq=pick(T.span);
  $("#binfo").textContent=`span ${T.span} · wait ${(T.delay/1000).toFixed(1)}s`;
  await sleep(250);await showSeq(seq);
  const proc=await fillDelay(T.delay,scored);
  const correct=await recall(seq,scored);
  cue.textContent=correct?"✅":"↔️";
  if(scored){
    T.trial++;T.total++;if(correct)T.correct++;T.accSeries.push(correct?1:0);
    (T.bySpan[T.span]=T.bySpan[T.span]||[]).push(correct?1:0);
    const validProc=proc>=0.6; // gate: only advance ceilings on valid (engaged) delays
    if(correct&&validProc){if(T.span>T.spanMax)T.spanMax=T.span;if(T.delay>T.delayMax)T.delayMax=T.delay;}
    logE(`span ${T.span}, ${(T.delay/1000).toFixed(1)}s: ${correct?"OK":"miss"} · shoo ${Math.round(proc*100)}%`);
    if(correct){ if(T.span<5)T.span++; else T.delay=Math.min(9000,T.delay+1500);} 
    else { if(T.delay>3000)T.delay=Math.max(3000,T.delay-1500); else T.span=Math.max(2,T.span-1); }
  }
  render();await sleep(1000);clear();cue.textContent="";$("#go").disabled=false;
  return correct;
}
async function warmup(){T.phase="warm-up (unscored)";render();const s=T.span,d=T.delay;T.span=2;T.delay=2500;await runRound(false);T.span=s;T.delay=d;
  T.phase="idle";$("#go").textContent="▶ Start scored rounds";$("#go").onclick=startScored;
  $("#hint").textContent="Great! These count. The wait grows longer as you succeed.";render();}
let left=0;
async function startScored(){T.phase="scored";T.span=3;T.delay=3000;render();left=8;$("#go").disabled=true;await loop();}
async function loop(){if(left<=0){finish();return;}await runRound(true);left--;if(left>0)await loop();else finish();}
function finish(){T.phase="done";cue.textContent="🏁";$("#go").disabled=false;$("#go").textContent="▶ Run another block";$("#go").onclick=startScored;
  $("#hint").textContent=`Done. Delayed span ${T.spanMax}, longest survived wait ${(T.delayMax/1000).toFixed(1)}s. Shoo-accuracy gates whether the wait truly blocked rehearsal.`;render();}
</script>
</body>
</html>
