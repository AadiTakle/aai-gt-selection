<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-MATRIXBUILD-01 · Build the Tile</title>
<style>
  :root{
    --bg1:#eef4ff; --bg2:#f7ecff; --ink:#26304a; --card:#ffffff;
    --accent:#5b6cff; --good:#22b573; --bad:#ff6b6b; --socket:#c9d3ef;
    --tel-bg:#11162a; --tel-ink:#c8d6ff; --tel-key:#7fffcf; --tel-dim:#7183b8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:26px;padding:20px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:16px;max-width:580px;width:100%}
  #machine{position:relative;padding:14px;border-radius:20px;background:linear-gradient(160deg,#dfe7ff,#eef1ff);border:3px solid #cfd8ff}
  #lights{display:flex;gap:8px;justify-content:center;margin-top:10px}
  #lights span{width:13px;height:13px;border-radius:50%;background:#cbd5f5;transition:.25s}
  #lights.on span{background:var(--good);box-shadow:0 0 12px var(--good)}
  .matrix{display:grid;gap:8px;background:#c7d2f2;padding:8px;border-radius:14px}
  .cell{background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;width:84px;height:84px}
  .cell.empty{background:repeating-linear-gradient(45deg,#eef2ff,#eef2ff 8px,#e2e9ff 8px,#e2e9ff 16px);border:3px dashed var(--socket)}
  .cell.preview{border:3px solid var(--accent)}
  .cell.filled-anim{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}
  .pickers{display:flex;flex-direction:column;gap:10px;width:100%}
  .prow{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
  .plabel{font-size:22px;width:34px;text-align:center}
  .pick{background:#fff;border:3px solid #e2e8fb;border-radius:14px;min-width:56px;height:56px;padding:0 6px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.13s;-webkit-tap-highlight-color:transparent}
  .pick:hover{transform:translateY(-2px);border-color:#c3ccf5}
  .pick.sel{border-color:var(--accent);box-shadow:0 0 0 4px #c9d0ff}
  .swatch{width:34px;height:34px;border-radius:50%}
  .cdot{width:11px;height:11px;border-radius:50%;background:#42506f;margin:2px}
  .cdots{display:flex;gap:3px}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:72px;height:72px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:50px;height:50px;background:#eef1ff;color:#5b6cff;font-size:22px}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .7s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}
  @keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:200px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}
  #log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:290px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-MATRIXBUILD-01 · Build the Tile</div>
    <div id="phasecue">&#128065;&#65039;</div>
    <div id="stagecard">
      <div id="machine">
        <div id="matrix" class="matrix"></div>
        <div id="lights"><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="pickers">
        <div class="prow" id="rowShape"></div>
        <div class="prow" id="rowColor"></div>
        <div class="prow" id="rowCount"></div>
      </div>
      <div id="controls">
        <button id="replay" title="replay demo">&#8635;</button>
        <button id="go" title="submit">&#10003;</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">&#128072;<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const last=a=>a[a.length-1];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

/* shape rendering */
const PAL={red:'#e6194b',green:'#2ca25f',blue:'#4363d8',orange:'#f58231',purple:'#911eb4'};
const COLORKEYS=Object.keys(PAL);
const SH=['circle','square','triangle','diamond','star','hexagon'];
function polyPts(cx,cy,r,n,rot){let p=[];for(let i=0;i<n;i++){let a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function starPts(cx,cy,r,n){let p=[];for(let i=0;i<2*n;i++){let rr=i%2?r*0.45:r;let a=-Math.PI/2+i*Math.PI/n;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(' ');}
function oneShape(shape,color,cx,cy,r){const f='fill="'+color+'"';
  switch(shape){
    case 'circle':return `<circle cx="${cx}" cy="${cy}" r="${r}" ${f}/>`;
    case 'square':return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="3" ${f}/>`;
    case 'triangle':return `<polygon points="${polyPts(cx,cy,r,3,-Math.PI/2)}" ${f}/>`;
    case 'diamond':return `<polygon points="${polyPts(cx,cy,r,4,-Math.PI/2)}" ${f}/>`;
    case 'hexagon':return `<polygon points="${polyPts(cx,cy,r,6,-Math.PI/2)}" ${f}/>`;
    case 'star':return `<polygon points="${starPts(cx,cy,r,5)}" ${f}/>`;
  } return '';}
function tileSVG(a,box=72){const color=PAL[a.color]||a.color||'#9aa6c9';const n=a.count||1;let inner='';
  if(n===1){inner=oneShape(a.shape,color,box/2,box/2,box*0.30);}
  else{const pos=n===2?[[.3,.5],[.7,.5]]:[[.24,.5],[.5,.5],[.76,.5]];
    const r=box*.14;pos.slice(0,n).forEach(p=>inner+=oneShape(a.shape,color,p[0]*box,p[1]*box,r));}
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${inner}</svg>`;}

/* item generation: rule x attribute grammar with per-attribute answer key */
function genItem(nRules,size){size=size||3;
  const shapes=shuffle(SH).slice(0,size), colors=shuffle(COLORKEYS).slice(0,size), grid=[];
  for(let r=0;r<size;r++){grid.push([]);for(let c=0;c<size;c++)grid[r].push({
    shape:shapes[(r+c)%size], color:nRules>=2?colors[r]:colors[0], count:nRules>=3?c+1:1});}
  const ans={...grid[size-1][size-1]};
  let sOpts=shapes.slice();for(const s of SH){if(sOpts.length>=4)break;if(!sOpts.includes(s))sOpts.push(s);}sOpts=shuffle(sOpts);
  let cOpts=[colors[0]];if(nRules>=2){cOpts=colors.slice();for(const c of COLORKEYS){if(cOpts.length>=4)break;if(!cOpts.includes(c))cOpts.push(c);}cOpts=shuffle(cOpts);}
  return {size,nRules,grid,ans,shapeOpts:sOpts,colorOpts:cOpts,colorActive:nRules>=2,countActive:nRules>=3};}

/* telemetry */
const T={scored:0,correct:0,rts:[],firstLat:null,path:[],rev:0,lastErr:'\u2014',polyLast:'\u2014',ruleLast:'\u2014',maxRules:0,itemStart:0,firstActed:false};
const METERS=[
 {id:'M-ACC',name:'Item accuracy (all attributes right)',get:()=>T.scored?`${T.correct}/${T.scored}  ${Math.round(100*T.correct/T.scored)}%`:'\u2014'},
 {id:'M-POLY',name:'Partial-credit (attributes correct)',get:()=>T.polyLast},
 {id:'M-RT',name:'Response time — total',get:()=>T.rts.length?`${last(T.rts)} ms (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency (encode/plan)',get:()=>T.firstLat==null?'\u2014':T.firstLat+' ms'},
 {id:'M-PATH',name:'Attribute-setting order',get:()=>T.path.length?T.path.join(' \u2192 '):'\u2014'},
 {id:'M-REV',name:'Revisions / attribute changes',get:()=>T.rev+''},
 {id:'M-ERRTYPE',name:'Error type (which attribute-rule)',get:()=>T.lastErr},
 {id:'M-RULEID',name:'Rule dimensionality solved',get:()=>T.ruleLast},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>
  `<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');
  d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}

/* ghost hand */
const ghost=$('#ghost');
function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(700);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(500);}

/* flow */
let phase='demo',cur=null,sel=null,locked=true,scoredIndex=0;
const scoredItems=[genItem(2,3),genItem(3,3)];
function setCue(i){$('#phasecue').innerHTML=i;}
function lights(on){$('#lights').classList.toggle('on',on);}
function activeAttrs(item){const a=['shape'];if(item.colorActive)a.push('color');if(item.countActive)a.push('count');return a;}
function previewAttr(){return {shape:sel.shape||'circle',color:sel.color||(cur.colorActive?null:cur.ans.color),count:sel.count||(cur.countActive?1:cur.ans.count)};}
function renderPreview(){const cell=$('#emptycell');if(!cell)return;
  if(sel.shape){cell.classList.remove('empty');cell.classList.add('preview');cell.innerHTML=tileSVG(previewAttr());}
  else{cell.classList.add('empty');cell.classList.remove('preview');cell.innerHTML='';}}
function renderItem(item){cur=item;sel={shape:null,color:item.colorActive?null:item.ans.color,count:item.countActive?null:item.ans.count};
  const m=$('#matrix');m.style.gridTemplateColumns=`repeat(${item.size},1fr)`;m.innerHTML='';
  for(let r=0;r<item.size;r++)for(let c=0;c<item.size;c++){const cell=document.createElement('div');cell.className='cell';
    if(r===item.size-1&&c===item.size-1){cell.classList.add('empty');cell.id='emptycell';}
    else cell.innerHTML=tileSVG(item.grid[r][c]);m.appendChild(cell);}
  // shape pickers
  const rs=$('#rowShape');rs.innerHTML='<span class="plabel">&#9733;</span>';
  item.shapeOpts.forEach(sh=>{const b=document.createElement('div');b.className='pick';b.dataset.attr='shape';b.dataset.val=sh;
    b.innerHTML=tileSVG({shape:sh,color:'#42506f',count:1},44);rs.appendChild(b);});
  // color pickers
  const rc=$('#rowColor');rc.innerHTML='';rc.style.display=item.colorActive?'flex':'none';
  if(item.colorActive){rc.innerHTML='<span class="plabel">&#127912;</span>';
    item.colorOpts.forEach(co=>{const b=document.createElement('div');b.className='pick';b.dataset.attr='color';b.dataset.val=co;
      b.innerHTML=`<div class="swatch" style="background:${PAL[co]}"></div>`;rc.appendChild(b);});}
  // count pickers
  const rn=$('#rowCount');rn.innerHTML='';rn.style.display=item.countActive?'flex':'none';
  if(item.countActive){rn.innerHTML='<span class="plabel">&#128290;</span>';
    [1,2,3].forEach(k=>{const b=document.createElement('div');b.className='pick';b.dataset.attr='count';b.dataset.val=k;
      b.innerHTML='<div class="cdots">'+Array.from({length:k}).map(()=>'<span class="cdot"></span>').join('')+'</div>';rn.appendChild(b);});}
  lights(false);$('#go').classList.remove('ready');renderPreview();
  T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;T.path=[];T.rev=0;renderMeters();}
function ready(){return activeAttrs(cur).every(a=>sel[a]!=null);}
function onPick(el){if(locked)return;const attr=el.dataset.attr;let val=el.dataset.val;if(attr==='count')val=+val;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first action');}
  if(sel[attr]==null)T.path.push(attr);
  else if(sel[attr]!==val){T.rev++;log('changed '+attr);}
  sel[attr]=val;
  $$('.pick[data-attr="'+attr+'"]').forEach(p=>p.classList.toggle('sel',(attr==='count'?+p.dataset.val:p.dataset.val)===val));
  renderPreview();$('#go').classList.toggle('ready',ready());renderMeters();}
function score(){const attrs=activeAttrs(cur);let nc=0,wrong=[];
  attrs.forEach(a=>{if(sel[a]===cur.ans[a])nc++;else wrong.push(a);});
  return {nc,tot:attrs.length,wrong,correct:nc===attrs.length};}
function reveal(){const cell=$('#emptycell');cell.classList.remove('empty');cell.classList.add('filled-anim');cell.innerHTML=tileSVG(cur.ans);}
function submit(){if(!ready())return;const rt=Date.now()-T.itemStart;const s=score();
  if(phase==='warmup'){reveal();lights(s.correct);log('warm-up '+(s.correct?'correct':'shown answer')+' — UNSCORED');locked=true;$('#go').classList.remove('ready');setTimeout(nextPhase,1000);return;}
  T.scored++;T.rts.push(rt);T.polyLast=s.nc+' / '+s.tot+' attrs';T.ruleLast=s.nc+' / '+cur.nRules+' rules';
  if(s.correct){T.correct++;T.maxRules=Math.max(T.maxRules,cur.nRules);T.lastErr='none';reveal();lights(true);}
  else{T.lastErr='near-miss: '+s.wrong.join('+')+' rule';reveal();$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),450);}
  locked=true;$('#go').classList.remove('ready');
  log(`SUBMIT item ${scoredIndex+1} · ${cur.nRules} rules \u2192 ${s.correct?'CORRECT':'wrong'} · POLY ${s.nc}/${s.tot} · RT ${rt}ms · firstLat ${T.firstLat}ms · rev ${T.rev}`);
  renderMeters();setTimeout(nextPhase,1250);}
function nextPhase(){if(phase==='warmup'){scoredIndex=0;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<scoredItems.length?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('&#11088;');locked=false;renderItem(genItem(2,2));log('— warm-up (unscored): build shape + color on a 2x2 —');}
function startScored(){phase='scored';setCue('&#127919;');locked=false;renderItem(scoredItems[scoredIndex]);
  log(`— SCORED item ${scoredIndex+1}: ${cur.size}x${cur.size}, ${cur.nRules} co-acting rules to build —`);}
function finish(){phase='done';setCue('&#127942;');locked=true;lights(true);
  log(`— DONE · accuracy ${T.correct}/${T.scored} · ceiling ${T.maxRules} rules —`);}
async function runDemo(){phase='demo';setCue('&#128065;&#65039;');locked=true;
  const d=genItem(2,2);renderItem(d);log('ghost-hand demo (wordless, <10s): build the missing tile');
  ghostShow(true);await sleep(300);
  await ghostTo($('#emptycell'));await sleep(200);
  // point along the row (top-right cell) then column (bottom-left cell)
  await ghostTo($$('#matrix .cell')[1]);await ghostTo($$('#matrix .cell')[2]);
  locked=false;
  // tap correct shape
  const sB=$$('.pick[data-attr="shape"]').find(b=>b.dataset.val===d.ans.shape);await ghostTo(sB);await ghostTap();onPick(sB);
  // tap correct color
  const cB=$$('.pick[data-attr="color"]').find(b=>b.dataset.val===d.ans.color);await ghostTo(cB);await ghostTap();onPick(cB);
  await sleep(250);await ghostTo($('#go'));await ghostTap();
  reveal();lights(true);await sleep(500);ghostShow(false);locked=true;await sleep(400);startWarmup();}

$('#stagecard').addEventListener('click',e=>{const p=e.target.closest('.pick');if(p)onPick(p);});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
