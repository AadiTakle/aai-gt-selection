<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-listspan-01 — Critter Line-Up (list sorting / digit span)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;--tile:#232c4d;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0 0 4px;text-align:center;max-width:440px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #belt{width:440px;height:150px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  #item{font-size:82px;transition:transform .18s,opacity .18s;transform:scale(0);opacity:0}
  #item.show{transform:scale(1);opacity:1}
  #cue{font-size:30px;height:38px}
  .slots{display:flex;gap:10px;min-height:78px;align-items:center;justify-content:center}
  .slot{width:66px;height:66px;border-radius:14px;border:2px dashed var(--edge);display:flex;align-items:center;justify-content:center;font-size:42px;background:#141a30;cursor:pointer}
  .slot.filled{border-style:solid;border-color:var(--accent);background:var(--tile)}
  .slot .n{position:absolute;font-size:11px;color:var(--mut)}
  .slotwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
  .slotwrap>.lbl{font-size:10px;color:var(--mut)}
  .slot.ok{border-color:var(--good);box-shadow:0 0 12px #5ce39a66}
  .slot.no{border-color:var(--bad);box-shadow:0 0 12px #ff6b8a66}
  .tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:66px}
  .chip{width:64px;height:64px;border-radius:14px;border:1px solid var(--edge);background:#20284a;font-size:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s}
  .chip:active{transform:scale(.94)}
  .chip.used{opacity:.25;pointer-events:none}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:7px 12px;background:#182042}
  .seg button.on{background:var(--warn);color:#3a2c00;font-weight:600}
  .tel{width:310px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:140px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🐾 Critter Line-Up <span class="badge" id="bmode">Sort by size</span></h1>
    <p class="sub">Watch the critters march by one at a time. Then line them up <b id="ordertxt">smallest → biggest</b> by tapping them into the boxes.</p>
  </div>
  <div id="belt"><div id="item"></div></div>
  <div id="cue">👀</div>
  <div class="slots" id="slots"></div>
  <div class="tray" id="tray"></div>
  <div class="row">
    <div class="seg" id="content">
      <button data-c="animals" class="on">🐾 Animals</button>
      <button data-c="numbers">🔢 Numbers</button>
    </div>
    <div class="seg" id="modeseg">
      <button data-m="F">Same order</button>
      <button data-m="B">Reverse</button>
      <button data-m="S" class="on">Sort</button>
    </div>
  </div>
  <div class="row">
    <button class="pri" id="go">▶ Watch how it works</button>
    <button id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>

<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const belt=$("#belt"), itemEl=$("#item"), cue=$("#cue"), slotsEl=$("#slots"), trayEl=$("#tray");

const ANIMALS=[{e:"🐜",r:1},{e:"🐭",r:2},{e:"🐰",r:3},{e:"🐱",r:4},{e:"🐶",r:5},{e:"🐷",r:6},{e:"🐴",r:7},{e:"🐘",r:8},{e:"🐳",r:9}];
const NUMBERS=[1,2,3,4,5,6,7,8,9].map(n=>({e:String(n),r:n}));
let content="animals", mode="S", span=3;

const T={phase:"idle",mode:"S",content:"animals",trial:0,span:3,
  fwdMax:0,manipMax:0,correct:0,total:0,
  poly:[],firstLat:[],rt:[],revis:0,orderErr:0,itemErr:0,
  serialHit:Array(9).fill(0),serialTot:Array(9).fill(0),log:[]};
const LAPSE=4000;
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function med(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m;}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop();}
function render(){
  const acc=T.total?Math.round(100*T.correct/T.total):0;
  const poly=T.poly.length?Math.round(100*mean(T.poly)):0;
  const maxpos=Math.max(3,...T.serialTot.map((t,i)=>t?i+1:0));
  const sp=T.serialTot.slice(0,maxpos).map((t,i)=>{const h=t?Math.round(100*T.serialHit[i]/t):0;return `<span style="flex:1;height:20px;border-radius:3px;background:linear-gradient(0deg,#5ce39a ${h}%,#223 ${h}%);font-size:9px;color:#000;display:flex;align-items:flex-end;justify-content:center">${t?h:""}</span>`;}).join("");
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-listspan-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>content</span><b>${T.content}</b></div>
  <div class="kv"><span>rule</span><b>${({F:"repeat",B:"reverse",S:"sort"})[T.mode]}</b></div>
  <div class="kv"><span>trial</span><b>${T.trial}</b></div>
  <h2>Span & manipulation</h2>
  <div class="kv"><span>current length</span><b>${T.span}</b></div>
  <div class="kv"><span>storage max (repeat) <span class="m">M-SPAN</span></span><b>${T.fwdMax}</b></div>
  <div class="kv"><span>manip. max (rev/sort) <span class="m">M-SPAN</span></span><b>${T.manipMax}</b></div>
  <div class="kv"><span>manipulation cost <span class="m">M-MANIPCOST</span></span><b>${T.fwdMax&&T.manipMax?(T.fwdMax-T.manipMax):"—"}</b></div>
  <h2>Accuracy & process</h2>
  <div class="kv"><span>all-correct <span class="m">M-ACC</span></span><b>${acc}% <span class="m">(${T.correct}/${T.total})</span></b></div>
  <div class="kv"><span>partial credit <span class="m">M-POLY</span></span><b>${poly}%</b></div>
  <div class="kv"><span>first-move lat <span class="m">M-RTFIRST</span></span><b>${Math.round(med(T.firstLat))} ms</b></div>
  <div class="kv"><span>place-time CV <span class="m">M-RTVAR</span></span><b>${cv(T.rt).toFixed(2)}</b></div>
  <div class="kv"><span>order errors <span class="m">M-ERRTYPE</span></span><b>${T.orderErr}</b></div>
  <div class="kv"><span>item errors <span class="m">M-ERRTYPE</span></span><b>${T.itemErr}</b></div>
  <div class="kv"><span>revisions <span class="m">M-REV</span></span><b>${T.revis}</b></div>
  <h2>Serial position <span class="m">M-SERIALPOS</span></h2>
  <div style="display:flex;gap:3px">${sp||'<span>—</span>'}</div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();

function bank(){return content==="animals"?ANIMALS:NUMBERS;}
function pickSeq(n){const b=bank().slice();for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]];}return b.slice(0,n);}
function targetOrder(seq){
  if(mode==="F")return seq.slice();
  if(mode==="B")return seq.slice().reverse();
  return seq.slice().sort((a,b)=>a.r-b.r); // sort by size/value
}
async function present(seq,ms=780,gap=200){
  cue.textContent="👀";
  for(const it of seq){itemEl.textContent=it.e;itemEl.classList.add("show");await sleep(ms);itemEl.classList.remove("show");await sleep(gap);}
  itemEl.textContent="";
}

// build slots + tray
function buildBoard(seq){
  const n=seq.length;
  slotsEl.innerHTML="";trayEl.innerHTML="";
  for(let k=0;k<n;k++){
    const w=document.createElement("div");w.className="slotwrap";
    const s=document.createElement("div");s.className="slot";s.dataset.k=k;
    const l=document.createElement("div");l.className="lbl";l.textContent=k+1;
    w.appendChild(s);w.appendChild(l);slotsEl.appendChild(w);
  }
  const shuffled=seq.slice();for(let i=shuffled.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
  shuffled.forEach((it,idx)=>{const c=document.createElement("div");c.className="chip";c.textContent=it.e;c.dataset.r=it.r;c.dataset.e=it.e;trayEl.appendChild(c);});
}

let awaiting=false;
async function runTrial(scored){
  $("#go").disabled=true;$("#replay").disabled=true;
  slotsEl.innerHTML="";trayEl.innerHTML="";
  const n=T.span, seq=pickSeq(n), target=targetOrder(seq);
  await sleep(300);
  await present(seq);
  buildBoard(seq);
  cue.textContent="👆";$("#phasehint").textContent=scored?"Tap them into the boxes.":"Practice — tap them into the boxes.";
  const placed=[]; // {e,r,k}
  const t0=performance.now(); let last=t0; awaiting=true;
  await new Promise(res=>{
    function fill(){
      const slots=[...slotsEl.querySelectorAll(".slot")];
      const filledCount=placed.length;
      if(filledCount===n){awaiting=false;res();}
    }
    trayEl.addEventListener("click",e=>{
      const chip=e.target.closest(".chip");if(!chip||chip.classList.contains("used")||!awaiting)return;
      const slot=slotsEl.querySelector(".slot:not(.filled)");if(!slot)return;
      const now=performance.now();
      if(placed.length===0){if(scored)T.firstLat.push(now-t0);} else {if(scored){T.rt.push(now-last);}}
      last=now;
      slot.textContent=chip.textContent;slot.classList.add("filled");slot.dataset.e=chip.dataset.e;slot.dataset.r=chip.dataset.r;
      chip.classList.add("used");slot._chip=chip;
      placed.push({e:chip.dataset.e,r:+chip.dataset.r,k:+slot.dataset.k});
      render();fill();
    });
    slotsEl.addEventListener("click",e=>{
      const slot=e.target.closest(".slot");if(!slot||!slot.classList.contains("filled")||!awaiting)return;
      // revision: return chip to tray
      slot.classList.remove("filled");slot.textContent="";
      if(slot._chip){slot._chip.classList.remove("used");slot._chip=null;}
      const idx=placed.findIndex(p=>p.k===+slot.dataset.k);if(idx>=0)placed.splice(idx,1);
      delete slot.dataset.e;delete slot.dataset.r;T.revis++;render();
    });
  });
  // score
  const slots=[...slotsEl.querySelectorAll(".slot")].sort((a,b)=>a.dataset.k-b.dataset.k);
  let nCorrect=0;
  slots.forEach((s,k)=>{
    const ok=(mode==="S")? (+s.dataset.r===target[k].r) : (s.dataset.e===target[k].e);
    if(scored){T.serialTot[k]++;if(ok)T.serialHit[k]++;}
    if(ok){nCorrect++;s.classList.add("ok");}
    else{ s.classList.add("no");
      if(scored){ const inSeq=seq.some(x=>x.e===s.dataset.e); inSeq?T.orderErr++:T.itemErr++; } }
  });
  const allCorrect=nCorrect===n;
  cue.textContent=allCorrect?"✅":"↔️";
  if(scored){
    T.total++;if(allCorrect)T.correct++;T.poly.push(nCorrect/n);
    const isStore=(mode==="F");
    if(allCorrect){ if(isStore){if(n>T.fwdMax)T.fwdMax=n;} else {if(n>T.manipMax)T.manipMax=n;} }
    logE(`${({F:"repeat",B:"reverse",S:"sort"})[mode]} len ${n}: ${nCorrect}/${n}`);
    T.span=allCorrect?Math.min(9,T.span+1):Math.max(2,T.span-1);
    T.trial++;
  }
  render();
  await sleep(950);
  $("#go").disabled=false;$("#replay").disabled=false;cue.textContent="";
  return allCorrect;
}

// ---------- ghost-hand demo ----------
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();
  $("#go").disabled=true;$("#replay").disabled=true;
  const saveC=content,saveM=mode;content="animals";mode="S";
  const seq=[ANIMALS[7],ANIMALS[0],ANIMALS[3]]; // elephant, ant, cat
  await sleep(300);await present(seq,650,180);
  buildBoard(seq);
  // ghost auto-solves: tap smallest, then next
  cue.textContent="👆";
  const ghost=document.createElement("div");ghost.textContent="👆";ghost.style.cssText="position:fixed;font-size:28px;z-index:9;transition:left .4s,top .4s;pointer-events:none";document.body.appendChild(ghost);
  const order=seq.slice().sort((a,b)=>a.r-b.r);
  for(const it of order){
    const chip=[...trayEl.querySelectorAll(".chip:not(.used)")].find(c=>c.dataset.e===it.e);
    const slot=slotsEl.querySelector(".slot:not(.filled)");
    const cr=chip.getBoundingClientRect();ghost.style.left=(cr.left+18)+"px";ghost.style.top=(cr.top+10)+"px";
    await sleep(500);
    slot.textContent=chip.textContent;slot.classList.add("filled","ok");chip.classList.add("used");
    await sleep(220);
  }
  cue.textContent="✅";await sleep(700);ghost.remove();
  content=saveC;mode=saveM;slotsEl.innerHTML="";trayEl.innerHTML="";
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice one";$("#go").onclick=warmup;
  $("#phasehint").textContent="Now you try — this practice one is NOT scored.";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;

async function warmup(){T.phase="warm-up (unscored)";render();await runTrial(false);
  T.phase="idle";$("#go").textContent="▶ Start scored round";$("#go").onclick=startScored;
  $("#phasehint").textContent="These next ones count. The line gets longer when you're right.";render();}
let left=0;
async function startScored(){T.phase="scored";T.span=3;render();left=8;$("#go").disabled=true;await loop();}
async function loop(){await runTrial(true);left--;if(left>0)await loop();else finish();}
function finish(){T.phase="done";render();cue.textContent="🏁";
  $("#go").disabled=false;$("#go").textContent="▶ Another round";$("#go").onclick=startScored;
  $("#phasehint").textContent=`Done. Storage max ${T.fwdMax||"—"}, manipulation max ${T.manipMax||"—"}. Switch rule/content to compare.`;}

// content + mode toggles
$("#content").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  content=b.dataset.c;T.content=content;[...$("#content").children].forEach(x=>x.classList.toggle("on",x===b));logE(`content → ${content}`);render();});
$("#modeseg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  mode=b.dataset.m;T.mode=mode;[...$("#modeseg").children].forEach(x=>x.classList.toggle("on",x===b));
  $("#bmode").textContent=({F:"Same order",B:"Reverse",S:"Sort by size"})[mode];
  $("#ordertxt").textContent=({F:"in the same order",B:"in REVERSE order",S:"smallest → biggest"})[mode];
  logE(`rule → ${mode}`);render();});
</script>
</body>
</html>
