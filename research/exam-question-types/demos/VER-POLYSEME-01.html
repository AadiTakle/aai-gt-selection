<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VER-POLYSEME-01 — Two Meanings (lexical-ambiguity resolution)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;
    --accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}
  .sub{color:var(--mut);font-size:13px;margin:0 0 6px;text-align:center;max-width:480px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--accent);font-size:12px}
  #stage{position:relative;width:470px;min-height:210px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .word{font-size:30px;font-weight:800;letter-spacing:.06em;color:var(--warn)}
  .word small{display:block;font-size:12px;color:var(--mut);font-weight:400;letter-spacing:0}
  .sentence{font-size:16px;text-align:center;min-height:44px;max-width:420px}
  .sentence b{color:var(--warn)}
  .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:440px}
  .opt{padding:14px 6px;border-radius:14px;border:1px solid var(--edge);background:#20284a;cursor:pointer;font-size:40px;text-align:center;transition:transform .08s,background .12s}
  .opt:active{transform:scale(.94)}
  .opt.ok{background:var(--good)}
  .opt.no{background:var(--bad)}
  #ghost{position:absolute;font-size:30px;left:0;top:0;transition:left .45s cubic-bezier(.5,0,.3,1),top .45s cubic-bezier(.5,0,.3,1);pointer-events:none;filter:drop-shadow(0 3px 3px #0008);z-index:5;opacity:0}
  #cue{font-size:30px;height:38px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:9px 16px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}
  .kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:160px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🗝️ Two Meanings <span class="badge" id="blvl">easy</span></h1>
    <p class="sub">This word means two different things! Listen to the sentence, then tap the picture that fits <b>this</b> sentence.</p>
  </div>
  <div id="stage">
    <div class="word" id="word">BAT <small>means 2 things</small></div>
    <div class="sentence" id="sentence"></div>
    <div class="opts" id="opts"></div>
    <div id="ghost">👆</div>
  </div>
  <div id="cue">👀</div>
  <div class="row">
    <button class="pri" id="go">▶ Watch how it works</button>
    <button id="say" title="hear the sentence">🔊 Say it again</button>
  </div>
  <p class="sub" id="hint">A ghost hand shows you first. The sentence is read aloud — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const stage=$("#stage"),ghost=$("#ghost"),cue=$("#cue"),optsEl=$("#opts");
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
// depth 1-2 = strong context, dominant meaning; 3-4 = subtle context / subordinate meaning.
// classes: target(correct meaning) / other(the OTHER meaning of the same word) / assoc / unrel
const BANK=[
 [{d:1,band:5,word:"BAT",s:"The BAT flew around the dark cave at night.",o:[["🦇","target"],["🏏","other"],["🌙","assoc"],["🍎","unrel"]]},
  {d:1,band:5,word:"BARK",s:"The big dog gave a loud BARK at the mail carrier.",o:[["🐕","target"],["🌳","other"],["📮","assoc"],["🍦","unrel"]]}],
 [{d:2,band:4,word:"TRUNK",s:"The elephant sprayed water with its long TRUNK.",o:[["🐘","target"],["🚗","other"],["💦","assoc"],["🎈","unrel"]]},
  {d:2,band:4,word:"RING",s:"My phone started to RING during dinner.",o:[["📱","target"],["💍","other"],["🍽️","assoc"],["🐸","unrel"]]}],
 [{d:3,band:3,word:"BAT",s:"She swung the BAT and hit a home run.",o:[["🏏","target"],["🦇","other"],["⚾","assoc"],["🌵","unrel"]]},
  {d:3,band:3,word:"SEAL",s:"He pressed the wax SEAL onto the letter.",o:[["✉️","target"],["🦭","other"],["📜","assoc"],["🚲","unrel"]]}],
 [{d:4,band:2,word:"CRANE",s:"The tall CRANE lifted steel beams at the building site.",o:[["🏗️","target"],["🐦","other"],["🏢","assoc"],["🍓","unrel"]]},
  {d:4,band:2,word:"SPRING",s:"The old couch had a broken SPRING poking out of it.",o:[["🌀","target"],["🌸","other"],["🛋️","assoc"],["🐧","unrel"]]}]
];
const T={phase:"idle",trial:0,d:1,maxd:0,rarest:0,correct:0,total:0,rt:[],first:[],
  lure:{other:0,assoc:0,unrel:0},byD:{},log:[]};
function med(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}
function consistency(){let p=0,ag=0;for(const k in T.byD){const a=T.byD[k];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){p++;if(a[i]===a[j])ag++;}}return p?Math.round(100*ag/p):"—";}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>50)T.log.pop();}
const DNAME=["","strong · literal","strong","subtle context","subtle · subordinate"];
function render(){
  const acc=T.total?Math.round(100*T.correct/T.total):0;
  $("#tel").innerHTML=`
  <h2>Live telemetry · VER-POLYSEME-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>scored items</span><b>${T.total}</b></div>
  <h2>Ability</h2>
  <div class="kv"><span>accuracy <span class="m">M-ACC</span></span><b>${acc}% <span class="m">(${T.correct}/${T.total})</span></b></div>
  <div class="kv"><span>context depth reached <span class="m">M-INFDEPTH</span></span><b>${T.maxd} / 4</b></div>
  <div class="kv"><span>hardest disambig. <span class="m">M-DIFFREACH</span></span><b>${DNAME[T.maxd]||"—"}</b></div>
  <div class="kv"><span>rarest word solved <span class="m">M-VOCABLVL</span></span><b>band ${T.rarest||"—"}</b></div>
  <div class="kv"><span>consistency <span class="m">M-CONSIST</span></span><b>${consistency()}${consistency()==="—"?"":"%"}</b></div>
  <h2>Speed (context)</h2>
  <div class="kv"><span>median decision <span class="m">M-RT</span></span><b>${Math.round(med(T.rt))} ms</b></div>
  <div class="kv"><span>first-look latency <span class="m">M-RTFIRST</span></span><b>${Math.round(med(T.first))} ms</b></div>
  <h2>Error grain <span class="m">M-ERRTYPE · M-LURETYPE</span></h2>
  <div class="kv"><span>chose OTHER meaning</span><b>${T.lure.other}</b></div>
  <div class="kv"><span>chose associate</span><b>${T.lure.assoc}</b></div>
  <div class="kv"><span>chose unrelated</span><b>${T.lure.unrel}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();
function centerOf(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2};}
let cur=null,shownAt=0,firstDone=false;
function draw(item){
  cur=item;$("#word").innerHTML=`${item.word} <small>means 2 things</small>`;
  $("#sentence").innerHTML=item.s.replace(item.word,`<b>${item.word}</b>`);
  const arr=item.o.map(o=>({e:o[0],c:o[1]}));
  for(let i=arr.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[arr[i],arr[j]]=[arr[j],arr[i]];}
  optsEl.innerHTML="";arr.forEach(o=>{const b=document.createElement("div");b.className="opt";b.dataset.c=o.c;b.textContent=o.e;optsEl.appendChild(b);});
  $("#blvl").textContent=DNAME[item.d];
}
async function ghostTo(el){ghost.style.opacity="1";const c=centerOf(el);ghost.style.left=(c.x-14)+"px";ghost.style.top=(c.y-30)+"px";await sleep(520);}
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;
  const it={d:1,word:"BAT",s:"The BAT flew around the dark cave at night.",o:[["🦇","target"],["🏏","other"],["🌙","assoc"],["🍎","unrel"]]};
  draw(it);cue.textContent="👂";say(it.s);await sleep(1700);
  const tgt=[...optsEl.children].find(b=>b.dataset.c==="target");
  await ghostTo(tgt);tgt.classList.add("ok");cue.textContent="✅";await sleep(1000);
  ghost.style.opacity="0";tgt.classList.remove("ok");
  $("#go").disabled=false;$("#go").textContent="▶ Try a practice one";$("#go").onclick=warmup;
  T.phase="idle";$("#hint").textContent="Now you try — this practice one is NOT scored.";render();
}
$("#go").onclick=demo;
$("#say").onclick=()=>{if(cur)say(cur.s);};
function pickItem(){const tier=BANK[Math.min(3,T.d-1)];return tier[T.trial%tier.length];}
function answer(scored){
  return new Promise(res=>{
    firstDone=false;shownAt=performance.now();
    function onClick(e){const b=e.target.closest(".opt");if(!b)return;
      if(!firstDone){firstDone=true;if(scored)T.first.push(performance.now()-shownAt);}
      optsEl.removeEventListener("click",onClick);
      const cls=b.dataset.c,rt=performance.now()-shownAt,ok=cls==="target";
      b.classList.add(ok?"ok":"no");
      if(!ok){const t=[...optsEl.children].find(x=>x.dataset.c==="target");t.classList.add("ok");}
      cue.textContent=ok?"✅":"🙂";
      if(scored){
        T.total++;T.rt.push(rt);(T.byD[cur.d]=T.byD[cur.d]||[]).push(ok?1:0);
        if(ok){T.correct++;if(cur.d>T.maxd)T.maxd=cur.d;if(cur.band>T.rarest)T.rarest=cur.band;}
        else T.lure[cls]=(T.lure[cls]||0)+1;
        logE(`"${cur.word}" d${cur.d} ${ok?"OK":"→"+cls} ${Math.round(rt)}ms`);
        T.d=ok?Math.min(4,T.d+1):Math.max(1,T.d-1);T.trial++;
      }
      render();res(ok);
    }
    optsEl.addEventListener("click",onClick);
  });
}
async function warmup(){$("#go").disabled=true;T.phase="warm-up (unscored)";render();
  const it={d:1,word:"BARK",s:"The dog began to BARK when the doorbell rang.",o:[["🐕","target"],["🌳","other"],["🔔","assoc"],["🍩","unrel"]]};
  draw(it);cue.textContent="👂";say(it.s);await sleep(300);await answer(false);await sleep(800);
  T.phase="idle";$("#go").disabled=false;$("#go").textContent="▶ Start scored items";$("#go").onclick=startScored;
  $("#hint").textContent="Great! The next ones count. Context gets subtler when you're right.";render();
}
let left=0;
async function startScored(){$("#go").disabled=true;T.phase="scored";T.d=1;T.trial=0;render();left=8;await loop();}
async function loop(){if(left<=0){finish();return;}const it=pickItem();draw(it);cue.textContent="👂";say(it.s);await sleep(250);await answer(true);left--;await sleep(650);if(left>0)await loop();else finish();}
function finish(){T.phase="done";cue.textContent="🏁";$("#go").disabled=false;$("#go").textContent="▶ Run another block";$("#go").onclick=startScored;
  $("#hint").textContent=`Done. Context depth ${T.maxd}/4. Choosing the OTHER meaning (vs an associate) is the diagnostic near-miss.`;render();}
draw(BANK[0][0]);say("");
</script>
</body>
</html>
