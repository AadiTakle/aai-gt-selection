<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VER-POLYSEME-01 · Two Meanings</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px}
  #stagecard{background:var(--card);border-radius:26px;padding:24px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:18px;max-width:660px;width:100%}
  .band{border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
  #sentBand{background:linear-gradient(160deg,#e8f0ff,#f2ecff);border:3px solid #cfd8ff}
  #sentText{font-size:20px;text-align:center;line-height:1.6}
  #sentText b{color:var(--accent)}
  .speak{border:0;background:#dfe6ff;color:#5b6cff;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
  #picGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .pic{display:flex;flex-direction:column;align-items:center;gap:6px;background:#f4f6ff;border:3px solid #d7deff;border-radius:16px;padding:12px 10px;cursor:pointer;transition:.12s;position:relative}
  .pic:hover{border-color:#b9c2ee;transform:translateY(-2px)}
  .pic .ic{font-size:36px}
  .pic .hk{position:absolute;top:4px;left:6px;font-size:10px;color:#a7b0d8;font-weight:700}
  .pic.correct{border-color:var(--good);background:#eafaf1}
  .pic.wrong{border-color:var(--bad);background:#fff0f0}
  .pic.ghosted{outline:3px solid var(--accent)}
  #controls{display:flex;gap:16px;align-items:center}
  button.rd{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #replay{width:50px;height:50px;background:#eef1ff;color:#5b6cff;font-size:22px}
  .shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;transition:transform .55s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #diffmeter{width:100%;display:flex;align-items:center;gap:8px;font-size:11px;color:#8a93b5}
  #diffbar{flex:1;height:8px;background:#e4e9ff;border-radius:6px;overflow:hidden}
  #diffbar i{display:block;height:100%;background:linear-gradient(90deg,#5b6cff,#ff8fd0);width:0%;transition:.3s}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:210px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">VER-POLYSEME-01 · Two Meanings</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="sentBand" class="band">
        <button class="speak" id="speak" title="hear it">🔊</button>
        <div id="sentText"></div>
      </div>
      <div id="picGrid"></div>
      <div id="diffmeter">🌱<div id="diffbar"><i id="diffbarfill"></i></div>🌳</div>
      <div id="controls">
        <button class="rd" id="replay" title="replay demo">↻</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,last=a=>a[a.length-1];
function say(text){try{if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(text);u.rate=0.95;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

/* ---------- homograph bank, level 1 (dominant/obvious) -> 6 (subtle/subordinate) ---------- */
const INF_RANK={'strong-literal':0,'moderate':1,'subtle-subordinate':2};
const BANK=[
 {lvl:1,word:'BAT',sent:'The BAT flew around the dark cave.',correct:{ic:'🦇',wd:'flying bat'},other:{ic:'🏏',wd:'baseball bat'},assoc:{ic:'🕷️',wd:'spider'},foil:{ic:'🍕',wd:'pizza'},inf:'strong-literal',vocab:1},
 {lvl:2,word:'RING',sent:'She heard the phone RING loudly.',correct:{ic:'🔔',wd:'ringing sound'},other:{ic:'💍',wd:'jewelry ring'},assoc:{ic:'📞',wd:'phone'},foil:{ic:'🍎',wd:'apple'},inf:'strong-literal',vocab:2},
 {lvl:3,word:'BANK',sent:'They sat by the BANK and watched the ducks swim.',correct:{ic:'🏞️',wd:'riverbank'},other:{ic:'🏦',wd:'money bank'},assoc:{ic:'🦆',wd:'duck'},foil:{ic:'🎈',wd:'balloon'},inf:'moderate',vocab:3},
 {lvl:4,word:'SPRING',sent:'The old mattress had a broken SPRING poking through.',correct:{ic:'🌀',wd:'coil spring'},other:{ic:'🌸',wd:'the season'},assoc:{ic:'🛏️',wd:'mattress'},foil:{ic:'🐶',wd:'puppy'},inf:'moderate',vocab:4},
 {lvl:5,word:'PALM',sent:"He read the lines on her PALM to tell her fortune.",correct:{ic:'✋',wd:'hand palm'},other:{ic:'🌴',wd:'palm tree'},assoc:{ic:'🔮',wd:'fortune teller'},foil:{ic:'🚗',wd:'car'},inf:'subtle-subordinate',vocab:5},
 {lvl:6,word:'PITCH',sent:'The salesman gave his PITCH to the nervous investors.',correct:{ic:'🗣️',wd:'sales speech'},other:{ic:'⚾',wd:'baseball pitch'},assoc:{ic:'💼',wd:'investors'},foil:{ic:'🐱',wd:'kitten'},inf:'subtle-subordinate',vocab:6},
];
function byLevel(l){return BANK.find(b=>b.lvl===l);}
function shuffledOpts(item){const opts=[{...item.correct,role:'correct'},{...item.other,role:'other-meaning'},{...item.assoc,role:'thematic-associate'},{...item.foil,role:'unrelated-foil'}];
  for(let i=opts.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[opts[i],opts[j]]=[opts[j],opts[i]];}return opts;}

/* ---------- telemetry ---------- */
const T={scored:0,exact:0,rts:[],firstRt:[],maxLevel:1,bestInfRank:-1,bestInf:'\u2014',bestVocab:0,lastLure:'\u2014',lastErr:'\u2014',itemStart:0,firstActionAt:null};
const METERS=[
 {id:'M-ACC',name:'Item accuracy',get:()=>T.scored?`${T.exact}/${T.scored}  ${Math.round(100*T.exact/T.scored)}%`:'\u2014'},
 {id:'M-RT',name:'Response time — total',get:()=>T.rts.length?`${last(T.rts)} ms  (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency',get:()=>T.firstRt.length?`${last(T.firstRt)} ms`:'\u2014'},
 {id:'M-INFDEPTH',name:'Disambiguation depth reached',get:()=>T.bestInf},
 {id:'M-DIFFREACH',name:'Ceiling / max level reached',get:()=>`L${T.maxLevel}/6`},
 {id:'M-LURETYPE',name:'Last wrong pick type',get:()=>T.lastLure},
 {id:'M-VOCABLVL',name:'Lexical frequency ceiling solved',get:()=>T.bestVocab?`L${T.bestVocab}/6`:'\u2014'},
 {id:'M-ERRTYPE',name:'Last error classification',get:()=>T.lastErr},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});$('#diffbarfill').style.width=(T.maxLevel/6*100)+'%';}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(520);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(430);}

/* ---------- render ---------- */
let cur=null,opts=null,level=1,locked=false;
function renderItem(item){cur=item;opts=shuffledOpts(item);T.itemStart=Date.now();T.firstActionAt=null;
  $('#sentText').innerHTML=item.sent.replace(item.word,`<b>${item.word}</b>`);
  $('#picGrid').innerHTML=opts.map((o,i)=>`<div class="pic" data-i="${i}"><span class="hk">${i+1}</span><span class="ic">${o.ic}</span></div>`).join('');
  renderMeters();}
function markFirstAction(){if(T.firstActionAt===null){T.firstActionAt=Date.now();T.firstRt.push(T.firstActionAt-T.itemStart);}}
function pick(i){if(locked||!cur)return;markFirstAction();const chosen=opts[i];const exact=chosen.role==='correct';
  $$('#picGrid .pic').forEach(p=>p.classList.remove('correct','wrong'));
  const el=$$('#picGrid .pic')[i];el.classList.add(exact?'correct':'wrong');
  if(!exact){const correctEl=$$('#picGrid .pic')[opts.findIndex(o=>o.role==='correct')];correctEl.classList.add('correct');
    $('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),450);}
  say(cur.sent);
  return {exact,role:chosen.role};}
function submitAnswer(i){if(locked||!cur)return;const rt=Date.now()-T.itemStart;const res=pick(i);if(!res)return;locked=true;
  if(phase==='warmup'){log('warm-up '+(res.exact?'correct':'try again — shown correct')+' — UNSCORED');setTimeout(nextPhase,1400);return;}
  T.scored++;T.rts.push(rt);
  if(res.exact){T.exact++;T.maxLevel=Math.max(T.maxLevel,level);T.bestVocab=Math.max(T.bestVocab,cur.vocab);
    const r=INF_RANK[cur.inf];if(r>T.bestInfRank){T.bestInfRank=r;T.bestInf=cur.inf;}T.lastErr='none (correct)';}
  else{T.lastLure=res.role;T.lastErr=res.role==='unrelated-foil'?'unrelated-foil (weak signal)':'near-miss: '+res.role;}
  log(`SUBMIT L${level} [${cur.word}] \u2192 ${res.exact?'CORRECT':'WRONG ('+res.role+')'} · ${rt}ms`);
  level=res.exact?Math.min(6,level+1):Math.max(1,level-1);
  renderMeters();setTimeout(nextPhase,1400);}
const TOTAL_SCORED=6;let phase='demo',scoredIndex=0;
function setCue(i){$('#phasecue').textContent=i;}
function nextPhase(){locked=false;if(phase==='warmup'){scoredIndex=0;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<TOTAL_SCORED?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('\u2b50');level=1;renderItem(byLevel(1));log('— warm-up (unscored) —');}
function startScored(){phase='scored';setCue('\ud83c\udfaf');renderItem(byLevel(level));log(`— SCORED item ${scoredIndex+1}/${TOTAL_SCORED} · level ${level} —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');locked=true;log(`— DONE · exact ${T.exact}/${T.scored} · ceiling L${T.maxLevel} —`);renderMeters();}
async function runDemo(){phase='demo';setCue('\ud83d\udc41\ufe0f');locked=true;
  const item=byLevel(1);renderItem(item);log('ghost-hand demo (wordless, <10s)');ghostShow(true);await sleep(300);
  const ci=opts.findIndex(o=>o.role==='correct');const el=$$('#picGrid .pic')[ci];await ghostTo(el);el.classList.add('ghosted');await ghostTap();
  pick(ci);await sleep(700);ghostShow(false);el.classList.remove('ghosted');await sleep(400);
  T.itemStart=Date.now();startWarmup();}
$('#picGrid').addEventListener('click',e=>{const p=e.target.closest('.pic');if(p&&!locked&&phase!=='demo'&&phase!=='done')submitAnswer(+p.dataset.i);});
document.addEventListener('keydown',e=>{if(locked||phase==='demo'||phase==='done')return;const n=+e.key;if(n>=1&&n<=4)submitAnswer(n-1);});
$('#speak').addEventListener('click',()=>{if(cur)say(cur.sent);});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
