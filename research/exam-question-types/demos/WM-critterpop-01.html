<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-critterpop-01 — Critter Pop (peek-a-boo 1-back + hideout span)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;--tile:#232c4d;--dirt:#5a4632;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:460px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #field{display:grid;gap:14px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:18px}
  .burrow{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 50% 65%,#241a12,#3a2c1c 70%);border:3px solid #241a12;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;overflow:hidden}
  .burrow .critter{transform:translateY(60px);opacity:0;transition:transform .18s,opacity .12s}
  .burrow.up .critter{transform:translateY(0);opacity:1}
  .burrow.lit{box-shadow:0 0 22px 5px #ffd86b;border-color:#ffd86b}
  .burrow.pick{outline:4px solid var(--accent);outline-offset:2px}
  .paw{font:600 18px system-ui;padding:18px 30px;border-radius:16px;border:2px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer;min-width:180px}
  .paw:active{transform:scale(.97)}.paw.flash{background:var(--good);color:#05261a;border-color:transparent}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:7px 12px;background:#182042}
  .seg button.on{background:var(--warn);color:#3a2c00;font-weight:600}
  #cue{font-size:26px;height:32px}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🐹 Critter Pop <span class="badge" id="bmode">1-back</span></h1>
    <p class="sub" id="prompt">Slap the <b>PAW</b> when the animal now is the <b>same</b> as the one just before.</p>
  </div>
  <div id="field"></div>
  <div id="cue">👀</div>
  <div class="row" id="answerRow"><button class="paw" id="paw">SAME! ✋</button></div>
  <div class="row">
    <div class="seg" id="modeseg">
      <button data-m="match" class="on">Match (1-back)</button>
      <button data-m="hideout">Hideout (span)</button>
    </div>
    <label class="sub" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="adapt" checked> above-grade staircase</label>
  </div>
  <div class="row">
    <button class="pri" id="go">▶ Watch how it works</button>
    <button id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const EMO=["🦊","🐰","🐼","🐸","🦉","🐷","🦔","🐨"];
const field=$("#field");
let cells=[];
function buildField(n){ // n = 4 (2x2) or 9 (3x3)
  const side=Math.sqrt(n)|0; field.style.gridTemplateColumns=`repeat(${side},1fr)`;
  field.innerHTML=""; cells=[];
  for(let i=0;i<n;i++){const b=document.createElement("div");b.className="burrow";
    b.innerHTML='<span class="critter"></span>';b.dataset.i=i;field.appendChild(b);cells.push(b);}
}
buildField(4);

let N=1, mode="match", gridN=4;
const T={phase:"idle",n:1,hit:0,miss:0,fa:0,cr:0,target:0,hitRT:[],lures:0,
  span:2,spanMax:0,revisions:0,blockAcc:[],updateCost:[],blur:0,log:[]};

// ---- stats helpers ----
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function median(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m;}
function qnorm(p){p=Math.min(1-1e-6,Math.max(1e-6,p));const a=[-39.6968302,220.9460984,-275.928510,138.357751,-30.6647980,2.50662827];
  const b=[-54.4760987,161.585836,-155.698979,66.8013118,-13.2806815];const c=[-.00778489,-.322396458,-2.40075827,-2.54973253,4.37466414,2.93816398];
  const d=[.00778469,.322467129,2.44513413,3.75440866];const pl=.02425;
  if(p<pl){const q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p<=1-pl){const q=p-.5,r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
  const q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
function dprime(){const t=T.target,nt=T.cr+T.fa;if(!t||!nt)return 0;let h=T.hit/t,f=T.fa/nt;
  h=Math.min(1-.5/t,Math.max(.5/t,h));f=Math.min(1-.5/nt,Math.max(.5/nt,f));return qnorm(h)-qnorm(f);}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop();}
function render(){
  const tot=T.hit+T.miss+T.fa+T.cr;const acc=tot?Math.round(100*(T.hit+T.cr)/tot):0;
  const faRate=(T.fa+T.cr)?Math.round(100*T.fa/(T.fa+T.cr)):0;
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-critterpop-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>mode</span><b>${mode}</b></div>
  <div class="kv"><span>level</span><b>${mode==="match"?T.n+"-back":"span "+T.span}</b></div>
  <h2>Match detection (1-/2-back)</h2>
  <div class="kv"><span>hits / targets</span><b>${T.hit}/${T.target}</b></div>
  <div class="kv"><span>misses</span><b>${T.miss}</b></div>
  <div class="kv"><span>sensitivity d′ <span class="m">M-DPRIME</span></span><b>${dprime().toFixed(2)}</b></div>
  <div class="kv"><span>false-alarm rate <span class="m">M-FALSEALARM</span></span><b>${faRate}%</b></div>
  <div class="kv"><span>overall acc <span class="m">M-ACC</span></span><b>${acc}%</b></div>
  <div class="kv"><span>updating cost 1→2 <span class="m">M-UPDATECOST</span></span><b>${T.updateCost.length?T.updateCost.map(x=>x+"%").join(","):"—"}</b></div>
  <h2>Visuospatial span (hideout)</h2>
  <div class="kv"><span>span threshold <span class="m">M-SPAN</span></span><b>${T.spanMax||"—"}</b></div>
  <div class="kv"><span>recall revisions <span class="m">M-REV</span></span><b>${T.revisions}</b></div>
  <h2>Consistency & engagement</h2>
  <div class="kv"><span>hit-RT CV <span class="m">M-RTVAR</span></span><b>${cv(T.hitRT).toFixed(2)}</b></div>
  <div class="kv"><span>block acc series <span class="m">M-CONSIST</span></span><b>${T.blockAcc.length?T.blockAcc.map(x=>x+"%").join(","):"—"}</b></div>
  <div class="kv"><span>focus-loss (blur) <span class="m">M-ENGAGE</span></span><b>${T.blur}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
window.addEventListener("blur",()=>{T.blur++;render();});
render();

// ---- MATCH (1-back) ----
let step=null;
$("#paw").onclick=()=>{ if(!step||step.done||step.r!=null)return; step.r=performance.now()-step.onset;
  $("#paw").classList.add("flash");setTimeout(()=>$("#paw").classList.remove("flash"),160); };
function genStream(len){const a=[];for(let i=0;i<len;i++){let e;
  if(i>=N&&Math.random()<.34)e=a[i-N];else{do{e=EMO[Math.random()*gridN|0];}while(i>=N&&e===a[i-N]);}a.push(e);}return a;}
async function matchBlock(scored,len){
  const S=genStream(len);let good=0,tot=0;
  for(let i=0;i<len;i++){
    step={onset:0,r:null,done:false};
    const pos=Math.random()*gridN|0;const b=cells[pos];
    b.querySelector(".critter").textContent=S[i];b.classList.add("up");
    step.onset=performance.now();$("#cue").textContent="👀";
    await sleep(750); b.classList.remove("up");
    await sleep(1550); step.done=true;
    const tgt=i>=N&&S[i]===S[i-N];const resp=step.r!=null;
    if(tgt){ if(scored){T.target++; if(resp){T.hit++;T.hitRT.push(step.r);}else T.miss++;} if(resp)good++; }
    else { if(scored){ if(resp)T.fa++; else T.cr++; } if(!resp)good++; }
    if(scored){tot++;}
    b.querySelector(".critter").textContent="";
    render();
  }
  $("#cue").textContent="";
  return tot?Math.round(100*good/tot):0;
}
// ---- HIDEOUT (span) ----
async function hideoutRound(scored,k){
  const order=[...Array(gridN).keys()].sort(()=>Math.random()-.5).slice(0,k);
  $("#cue").textContent="👀";
  for(const p of order){cells[p].classList.add("lit");await sleep(600);cells[p].classList.remove("lit");await sleep(220);}
  $("#cue").textContent="👆";
  const picks=[];let done=false;
  await new Promise(res=>{
    cells.forEach(c=>c.onclick=()=>{const i=+c.dataset.i;
      if(picks.includes(i)){picks.splice(picks.indexOf(i),1);c.classList.remove("pick");T.revisions++;render();return;}
      picks.push(i);c.classList.add("pick");
      if(picks.length===k){done=true;setTimeout(res,150);}});
  });
  cells.forEach(c=>{c.onclick=null;c.classList.remove("pick");});
  const correct=picks.length===k&&picks.every((v,idx)=>v===order[idx]);
  $("#cue").textContent=correct?"✅":"↺";
  if(scored){ if(correct){T.span=Math.min(gridN,T.span+1);if(T.span-1>T.spanMax)T.spanMax=T.span-1;}
    else T.span=Math.max(2,T.span-1); logE(`hideout k=${k} ${correct?"ok":"miss"} → span ${T.span}`);}
  render();return correct;
}

// ---- phase machine ----
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";$("#go").disabled=true;$("#replay").disabled=true;render();
  const seq=["🐸","🦊","🦊","🐰"];// two foxes in a row => 1-back match on 3rd
  const ghost=document.createElement("div");ghost.textContent="👆";
  ghost.style.cssText="position:fixed;font-size:30px;z-index:9;transition:left .35s,top .35s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  for(let i=0;i<seq.length;i++){
    const pos=i%gridN;const b=cells[pos];b.querySelector(".critter").textContent=seq[i];b.classList.add("up");$("#cue").textContent="👀";
    const isMatch=i>0&&seq[i]===seq[i-1];
    if(isMatch){const r=$("#paw").getBoundingClientRect();ghost.style.opacity="1";ghost.style.left=(r.left+r.width/2-10)+"px";ghost.style.top=(r.top+6)+"px";
      await sleep(430);$("#paw").classList.add("flash");$("#cue").textContent="✅";await sleep(240);$("#paw").classList.remove("flash");}
    else await sleep(750);
    b.classList.remove("up");b.querySelector(".critter").textContent="";await sleep(300);
  }
  ghost.remove();$("#cue").textContent="";
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice round";$("#go").onclick=warmup;
  $("#phasehint").textContent="Now you try — this practice round is NOT scored.";render();
}
async function warmup(){
  T.phase="warm-up (unscored)";$("#go").disabled=true;$("#replay").disabled=true;render();
  if(mode==="match")await matchBlock(false,7); else await hideoutRound(false,2);
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Start scored game";$("#go").onclick=startScored;
  $("#phasehint").textContent="These rounds count. Do well and it gets harder (above grade).";render();
}
async function startScored(){
  T.phase="scored";$("#go").disabled=true;$("#replay").disabled=true;render();
  if(mode==="match"){
    let prev=null;
    for(let bk=0;bk<3;bk++){
      const acc=await matchBlock(true,12);T.blockAcc.push(acc);
      if(acc>=70&&T.n>=T.spanMaxN())T.nMaxSet(T.n);
      if(prev!=null)T.updateCost.push(prev-acc);prev=acc;
      logE(`match block ${bk+1}: ${T.n}-back acc ${acc}%`);
      if($("#adapt").checked){ if(acc>=80)setN(Math.min(3,N+1)); else if(acc<55)setN(Math.max(1,N-1)); }
      render();await sleep(600);
    }
  } else {
    for(let r=0;r<5;r++){await hideoutRound(true,T.span);await sleep(500);}
  }
  T.phase="done";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Play again";$("#go").onclick=startScored;
  $("#phasehint").textContent=`Done. Consistency (low CV, few lapses) matters more than raw speed.`;
  $("#cue").textContent="🏁";render();
}
// track max n sustained
T._nMax=1;T.spanMaxN=()=>T._nMax;T.nMaxSet=n=>{T._nMax=Math.max(T._nMax,n);};
function setN(n){N=n;T.n=n;$("#bmode").textContent=n+"-back";render();}
function setMode(m){mode=m;[...$("#modeseg").children].forEach(x=>x.classList.toggle("on",x.dataset.m===m));
  $("#answerRow").style.display=m==="match"?"flex":"none";
  gridN=m==="hideout"?9:4;buildField(gridN);
  $("#bmode").textContent=m==="match"?T.n+"-back":"span "+T.span;
  $("#prompt").innerHTML=m==="match"?"Slap the <b>PAW</b> when the animal now is the <b>same</b> as the one just before.":"Watch which burrows glow, then <b>tap them back in order</b>.";
  logE("mode → "+m);render();}
$("#go").onclick=demo;$("#replay").onclick=demo;
$("#modeseg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.m);});
setMode("match");
</script>
</body>
</html>
