<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-mirroropp-01 — Mirror Mischief (do-the-opposite + copy/opposite switch)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:480px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #banner{font-size:16px;font-weight:800;padding:9px 20px;border-radius:12px;border:2px solid var(--edge);background:#20284a;letter-spacing:.03em}
  #banner.copy{border-color:var(--good);color:var(--good)}
  #banner.opp{border-color:var(--warn);color:var(--warn)}
  #stage{width:360px;height:210px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;display:flex;align-items:center;justify-content:center;gap:14px;position:relative}
  #puppet{font-size:80px}
  #prompt-ico{font-size:96px;transition:transform .12s,opacity .15s}
  .btns{display:flex;gap:20px}
  .opt{width:150px;height:100px;border-radius:16px;border:3px solid var(--edge);background:#20284a;color:var(--ink);font-size:56px;cursor:pointer}
  .opt:active{transform:scale(.97)}
  .opt.good{box-shadow:0 0 22px 4px #5ce39a88;border-color:var(--good)}
  .opt.bad{box-shadow:0 0 22px 4px #ff6b8a88;border-color:var(--bad)}
  #cue{font-size:22px;height:30px;text-align:center}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.ctl{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:7px 12px;background:#182042;color:var(--ink);cursor:pointer}
  .seg button.on{background:var(--warn);color:#3a2c00;font-weight:600}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🐵 Mirror Mischief <span class="badge" id="bmode">OPPOSITE</span></h1>
    <p class="sub" id="hint2">Do what the banner says: <b>copy</b> the puppet, or do the <b>opposite</b>.</p>
  </div>
  <div id="banner" class="opp">DO THE OPPOSITE</div>
  <div id="stage"><span id="puppet">🐵</span><span id="prompt-ico">⬆️</span></div>
  <div class="btns" id="btns">
    <button class="opt" id="optA">⬆️</button>
    <button class="opt" id="optB">⬇️</button>
  </div>
  <div id="cue">👀</div>
  <div class="row">
    <div class="seg" id="setseg">
      <button data-s="arrows" class="on">arms up/down</button>
      <button data-s="daynight">day / night</button>
      <button data-s="size">big / small</button>
    </div>
  </div>
  <div class="row">
    <button class="ctl pri" id="go">▶ Watch how it works</button>
    <button class="ctl" id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SETS={arrows:["⬆️","⬇️"],daynight:["☀️","🌙"],size:["🐘","🐭"]};
const puppet=$("#puppet"),pico=$("#prompt-ico"),optA=$("#optA"),optB=$("#optB"),banner=$("#banner");
let curSet="arrows";
const T={phase:"idle",trials:[],blur:0,log:[]};

function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m;}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop();}
function scored(){return T.trials.filter(t=>t.scored);}
function render(){
  const S=scored();
  const cong=S.filter(t=>!t.opposite&&t.correct),incong=S.filter(t=>t.opposite&&t.correct);
  const congEff=(cong.length&&incong.length)?Math.round(mean(incong.map(t=>t.rt))-mean(cong.map(t=>t.rt))):null;
  const oppAll=S.filter(t=>t.opposite);const comm=oppAll.length?Math.round(100*oppAll.filter(t=>t.choseCopy).length/oppAll.length):null;
  const rep=S.filter(t=>t.type==="repeat"&&t.correct),sw=S.filter(t=>t.type==="switch"&&t.correct);
  const switchCost=(rep.length&&sw.length)?Math.round(mean(sw.map(t=>t.rt))-mean(rep.map(t=>t.rt))):null;
  const acc=S.length?Math.round(100*S.filter(t=>t.correct).length/S.length):0;
  let peRT=[],pcRT=[];for(let i=1;i<S.length;i++){(S[i-1].correct?pcRT:peRT).push(S[i].rt);}
  const posterr=(peRT.length&&pcRT.length)?Math.round(mean(peRT)-mean(pcRT)):null;
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-mirroropp-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>scored trials</span><b>${S.length}</b></div>
  <div class="kv"><span>overall acc <span class="m">M-ACC</span></span><b>${acc}%</b></div>
  <h2>Inhibition</h2>
  <div class="kv"><span>interference (ms) <span class="m">M-CONGEFF</span></span><b>${congEff==null?"—":congEff}</b></div>
  <div class="kv"><span>commission (copy-slip) <span class="m">M-COMM</span></span><b>${comm==null?"—":comm+"%"}</b></div>
  <h2>Flexibility</h2>
  <div class="kv"><span>copy↔opposite switch cost <span class="m">M-SWITCHCOST</span></span><b>${switchCost==null?"—":switchCost+"ms"}</b></div>
  <h2>Consistency & monitoring</h2>
  <div class="kv"><span>RT CV <span class="m">M-RTVAR</span></span><b>${cv(S.filter(t=>t.correct).map(t=>t.rt)).toFixed(2)}</b></div>
  <div class="kv"><span>post-error slowing <span class="m">M-POSTERR</span></span><b>${posterr==null?"—":posterr+"ms"}</b></div>
  <div class="kv"><span>trials correct series <span class="m">M-CONSIST</span></span><b>${S.slice(-12).map(t=>t.correct?"✓":"✗").join("")||"—"}</b></div>
  <div class="kv"><span>error trials <span class="m">M-ERRTYPE</span></span><b>${S.filter(t=>!t.correct).length}</b></div>
  <div class="kv"><span>focus-loss (blur) <span class="m">M-ENGAGE</span></span><b>${T.blur}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
window.addEventListener("blur",()=>{T.blur++;render();});
render();

function setBanner(opposite){banner.textContent=opposite?"DO THE OPPOSITE":"COPY ME";
  banner.className=opposite?"opp":"copy";$("#bmode").textContent=opposite?"OPPOSITE":"COPY";}
function paintOptions(){const [a,b]=SETS[curSet];optA.textContent=a;optB.textContent=b;}

let awaiting=null;
optA.onclick=()=>awaiting&&awaiting(0);
optB.onclick=()=>awaiting&&awaiting(1);

async function presentTrial({opposite,type,scored:sc}){
  const [a,b]=SETS[curSet];const shownIdx=Math.random()<.5?0:1;
  setBanner(opposite);paintOptions();
  puppet.textContent="🐵";pico.textContent=[a,b][shownIdx];pico.style.opacity="1";
  $("#cue").textContent=opposite?"do the OPPOSITE":"COPY it";
  const t0=performance.now();
  const pick=await new Promise(res=>{awaiting=res;});awaiting=null;
  const rt=performance.now()-t0;
  const correctIdx=opposite?(shownIdx===0?1:0):shownIdx;
  const correct=pick===correctIdx;
  const choseCopy=opposite&&pick===shownIdx; // failure to inhibit prepotent copy
  (pick===0?optA:optB).classList.add(correct?"good":"bad");
  await sleep(280);optA.classList.remove("good","bad");optB.classList.remove("good","bad");pico.style.opacity="0";
  const rec={opposite:!!opposite,type,scored:sc,rt,correct,choseCopy};T.trials.push(rec);
  if(sc)logE(`${opposite?"opp":"copy"}/${type} ${correct?"ok":"X"}${choseCopy?" copy-slip":""} ${Math.round(rt)}ms`);
  render();await sleep(180);return rec;
}
function buildSchedule(sc){
  // blocked copy, blocked opposite, then switching (copy/opposite interleaved)
  const s=[];
  s.push({opposite:false,type:"start",scored:sc});
  for(let i=0;i<2;i++)s.push({opposite:false,type:"repeat",scored:sc});
  s.push({opposite:true,type:"switch",scored:sc});
  for(let i=0;i<2;i++)s.push({opposite:true,type:"repeat",scored:sc});
  // mixed switching
  let prev=true;const mix=[false,true,true,false,true,false];
  for(const o of mix){s.push({opposite:o,type:o===prev?"repeat":"switch",scored:sc});prev=o;}
  return s;
}
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";$("#go").disabled=true;$("#replay").disabled=true;render();
  const ghost=document.createElement("div");ghost.textContent="👆";
  ghost.style.cssText="position:fixed;font-size:30px;z-index:9;transition:left .3s,top .3s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  paintOptions();
  // opposite: puppet shows UP -> tap DOWN
  setBanner(true);pico.textContent=SETS[curSet][0];pico.style.opacity="1";$("#cue").textContent="puppet shows UP → tap DOWN";
  let r=optB.getBoundingClientRect();ghost.style.opacity="1";ghost.style.left=(r.left+r.width/2-10)+"px";ghost.style.top=(r.top+20)+"px";
  await sleep(650);optB.classList.add("good");await sleep(350);optB.classList.remove("good");pico.style.opacity="0";await sleep(300);
  // day/night hint: sun -> night
  const save=curSet;curSet="daynight";paintOptions();setBanner(true);pico.textContent="☀️";pico.style.opacity="1";$("#cue").textContent="sun → tap the moon 🌙";
  r=optB.getBoundingClientRect();ghost.style.left=(r.left+r.width/2-10)+"px";ghost.style.top=(r.top+20)+"px";
  await sleep(650);optB.classList.add("good");await sleep(350);optB.classList.remove("good");pico.style.opacity="0";curSet=save;paintOptions();
  $("#cue").textContent="✅";await sleep(500);ghost.remove();
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice round";$("#go").onclick=warmup;
  $("#phasehint").textContent="Now you try — this practice round is NOT scored.";render();
}
async function warmup(){
  T.phase="warm-up (unscored)";$("#go").disabled=true;$("#replay").disabled=true;render();
  for(const step of [{opposite:false,type:"start",scored:false},{opposite:true,type:"switch",scored:false},{opposite:true,type:"repeat",scored:false}])
    await presentTrial(step);
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Start scored game";$("#go").onclick=startScored;
  $("#phasehint").textContent="These count. Read the banner each time — it can flip between copy and opposite.";render();
}
async function startScored(){
  T.phase="scored";$("#go").disabled=true;$("#replay").disabled=true;render();
  for(const step of buildSchedule(true))await presentTrial(step);
  T.phase="done";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Play again";$("#go").onclick=startScored;
  $("#phasehint").textContent="Done. Few copy-slips + small interference and switch cost at high accuracy is the strong signal — not speed.";
  $("#cue").textContent="🏁";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;
$("#setseg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;curSet=b.dataset.s;
  [...$("#setseg").children].forEach(x=>x.classList.toggle("on",x===b));paintOptions();logE("set → "+curSet);render();});
paintOptions();setBanner(true);
</script>
</body>
</html>
