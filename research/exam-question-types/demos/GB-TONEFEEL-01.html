<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-TONEFEEL-01 · Tone Detective</title>
<style>
  :root{--bg1:#fff0f6;--bg2:#eef1ff;--ink:#26304a;--card:#fff;--accent:#d6558f;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:14px;width:470px;max-width:100%}
  #instr{font-size:14px;color:#666;min-height:20px;text-align:center}
  #meter{width:280px;height:80px;background:#f5f0f8;border-radius:14px;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:10px;overflow:hidden}
  .bar{width:12px;background:var(--accent);border-radius:4px;height:10px;transition:height .12s}
  #playbtn{background:var(--accent);color:#fff;padding:9px 20px;font-weight:800;border:0;border-radius:12px;cursor:pointer}
  #emos{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .emo{width:66px;height:66px;border-radius:14px;background:#f7f0fa;border:3px solid #ecdcf0;font-size:30px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .emo .n{font-size:10px;color:#888}
  .emo.sel{border-color:var(--accent);background:#fbe6f1}
  .emo.right{border-color:var(--good);background:#e7fbf1}.emo.wrong{border-color:var(--bad);background:#ffecec}
  #intwrap{width:280px;display:flex;flex-direction:column;gap:4px}
  #intwrap label{font-size:12px;color:#888;display:flex;justify-content:space-between}
  input[type=range]{width:100%}
  #submit{background:var(--accent);color:#fff;padding:9px 22px;font-weight:800;border:0;border-radius:12px;cursor:pointer}
  #fb{font-size:14px;min-height:18px;font-weight:700}
  #replay{width:44px;height:44px;background:#eef1ff;color:#5b6cff;font-size:20px;border-radius:50%;border:0;cursor:pointer}
  #row{display:flex;gap:12px;align-items:center}
  #ghost{position:fixed;left:0;top:0;font-size:34px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .45s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:170px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:900px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:250px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-TONEFEEL-01 · Tone Detective</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="instr"></div>
      <div id="meter"></div>
      <button id="playbtn">🔊 play the voice</button>
      <div id="emos"></div>
      <div id="intwrap"><label><span>how strong?</span><span id="intval">a little</span></label><input id="intensity" type="range" min="0" max="100" value="50"></div>
      <div id="row"><button id="submit">✓ choose</button><button id="replay" title="replay demo">↻</button></div>
      <div id="fb"></div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
const EMO=[{k:'happy',e:'😀'},{k:'sad',e:'😢'},{k:'angry',e:'😠'},{k:'scared',e:'😨'},{k:'surprised',e:'😲'},{k:'calm',e:'😌'}];
const CONTOUR={happy:{pitch:1.6,rate:1.15,pat:'bounce'},sad:{pitch:.7,rate:.75,pat:'low'},angry:{pitch:.9,rate:1.2,pat:'jagged'},scared:{pitch:1.7,rate:1.3,pat:'tremble'},surprised:{pitch:1.8,rate:1.1,pat:'spike'},calm:{pitch:1,rate:.9,pat:'even'}};
function speakTone(text,emo){try{if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(text);const c=CONTOUR[emo];u.pitch=c.pitch;u.rate=c.rate;speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){}}
const ITEMS={warm:{text:'Oh, it is you!',emo:'happy',int:85},s1:{text:'Oh, it is you.',emo:'sad',int:55},s2:{text:'Oh! It is YOU!',emo:'surprised',int:80}};
const T={correct:0,total:0,rts:[],poly:0,polyMax:0,conf:[],confused:'',startT:0};
const METERS=[
 {id:'M-ACC',name:'Emotion correct (scored)',get:()=>T.total?`${T.correct}/${T.total}`:'—'},
 {id:'M-POLY',name:'Intensity-calibration score',get:()=>T.polyMax?`${T.poly}/${T.polyMax}`:'—'},
 {id:'M-RT',name:'Response time (mean)',get:()=>mean(T.rts)==null?'—':mean(T.rts)+' ms'},
 {id:'M-CONF',name:'Calibration (mean err)',get:()=>T.conf.length?mean(T.conf)+' pts':'—'},
 {id:'M-ERRTYPE',name:'Last confusion',get:()=>T.confused||'—'},
 {id:'M-RTFIRST',name:'First-action latency',get:()=>T.firstLat==null?'—':T.firstLat+' ms'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const d=document.createElement('div');d.innerHTML=`<span class="t">•</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(440)}

let phase='demo',cur=null,sel=null,anim=null,firstDone=false;T.firstLat=null;
const setCue=i=>$('#phasecue').textContent=i;
function buildMeter(){const m=$('#meter');m.innerHTML='';for(let i=0;i<14;i++)m.insertAdjacentHTML('beforeend','<div class="bar"></div>')}
function buildEmos(){$('#emos').innerHTML=EMO.map(x=>`<div class="emo" data-k="${x.k}"><div>${x.e}</div><div class="n">${x.k}</div></div>`).join('')}
function animate(pat){const bars=$$('.bar');let t=0;if(anim)clearInterval(anim);
  anim=setInterval(()=>{t+=1;bars.forEach((b,i)=>{let h=12;
    if(pat==='bounce')h=20+30*Math.abs(Math.sin((t+i)*0.5));
    else if(pat==='low')h=12+8*Math.abs(Math.sin((t+i)*0.2));
    else if(pat==='jagged')h=15+35*Math.random();
    else if(pat==='tremble')h=14+18*Math.random()+6*Math.sin(t);
    else if(pat==='spike')h=(i===7?55:14)+10*Math.sin(t*0.6);
    else h=22+6*Math.sin((t+i)*0.3);
    b.style.height=h+'px'})},90)}
function stopAnim(){if(anim){clearInterval(anim);anim=null}$$('.bar').forEach(b=>b.style.height='10px')}
function play(){if(!cur)return;animate(CONTOUR[cur.emo].pat);speakTone(cur.text,cur.emo);setTimeout(stopAnim,1600);log('played voice')}
function present(item){cur=item;sel=null;firstDone=false;$('#intensity').value=50;setInt();T.startT=performance.now();
  $$('.emo').forEach(e=>e.className='emo');$('#instr').textContent=phase==='scored'?'Listen to the voice, tap the feeling, set how strong, then choose.':'Warm-up: which feeling is the voice? (unscored)';
  setTimeout(play,300)}
function setInt(){const v=+$('#intensity').value;$('#intval').textContent=v<33?'a little':v<66?'medium':'a lot'}
function selectEmo(k){if(!firstDone){firstDone=true;T.firstLat=Math.round(performance.now()-T.startT);log('first action')}sel=k;$$('.emo').forEach(e=>e.classList.toggle('sel',e.dataset.k===k))}
function submit(){if(!cur||!sel)return;const scored=phase==='scored';const rt=Math.round(performance.now()-T.startT);const chosenInt=+$('#intensity').value;
  const ok=sel===cur.emo;const intErr=Math.abs(chosenInt-cur.int);const calib=intErr<=20?2:intErr<=40?1:0;
  if(scored){T.total++;T.polyMax+=2;if(ok){T.correct++;T.rts.push(rt);T.poly+=calib;T.conf.push(100-intErr)}else{T.confused=sel+'↔'+cur.emo}}
  $$('.emo').forEach(e=>{if(e.dataset.k===cur.emo)e.classList.add('right');else if(e.dataset.k===sel&&!ok)e.classList.add('wrong')});
  $('#fb').textContent=ok?(calib===2?'Right feeling, great strength! 🎉':'Right feeling! 🎉'):'Listen again to the tone…';$('#fb').style.color=ok?'var(--good)':'var(--bad)';
  log(`${scored?'SCORED ':''}chose ${sel} (true ${cur.emo}) ${ok?'✓':'✗'} · intensity err ${intErr}`);renderMeters();next(scored,ok)}
let q=[],qi=0;
function next(scored,ok){if(!scored){setTimeout(startScored,1200);return}qi++;if(qi>=q.length){setTimeout(finish,1000);return}setTimeout(()=>{$('#fb').textContent='';present(q[qi])},1200)}
function startWarmup(){phase='warmup';setCue('⭐');present(ITEMS.warm)}
function startScored(){phase='scored';setCue('🎯');q=[ITEMS.s1,ITEMS.s2];qi=0;$('#fb').textContent='';present(q[0]);log('— SCORED tone reading —')}
function finish(){phase='done';setCue('🏆');stopAnim();$('#instr').textContent='Done! Sharp ears for feelings.';$('#fb').textContent='';log(`— DONE · emotion ${T.correct}/${T.total} · calibration ${T.poly}/${T.polyMax} —`);renderMeters()}
async function runDemo(){phase='demo';setCue('👁️');cur=ITEMS.warm;$('#instr').textContent='';$$('.emo').forEach(e=>e.className='emo');log('ghost-hand demo (wordless, <10s)');gShow(true);play();await sleep(1400);
  await gTo($('.emo[data-k="happy"]'));$('.emo[data-k="happy"]').classList.add('sel');await sleep(300);await gTo($('#intensity'));$('#intensity').value=85;setInt();await sleep(300);await gTo($('#submit'));gShow(false);$('.emo[data-k="happy"]').classList.add('right');$('#fb').textContent='happy voice! 🎉';$('#fb').style.color='var(--good)';await sleep(1100);$('#fb').textContent='';startWarmup()}
$('#playbtn').addEventListener('click',play);
$('#emos').addEventListener('click',e=>{const em=e.target.closest('.emo');if(em)selectEmo(em.dataset.k)});
$('#intensity').addEventListener('input',setInt);
$('#submit').addEventListener('click',submit);
$('#replay').addEventListener('click',()=>{if(phase==='done')runDemo()});
buildMeters();buildMeter();buildEmos();renderMeters();runDemo();
</script>
</body>
</html>
