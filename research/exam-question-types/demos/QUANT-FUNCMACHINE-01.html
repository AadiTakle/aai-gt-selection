<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUANT-FUNCMACHINE-01 — Function Machine</title>
<style>
:root{--bg:#0f1226;--panel:#1b2140;--panel2:#232a52;--accent:#5eead4;--accent2:#f59e0b;--good:#4ade80;--bad:#f87171;--ink:#eef1ff;--muted:#9aa3c7}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(1100px 700px at 30% -10%,#3a2b55,#0f1226 60%);min-height:100vh}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1120px;margin:0 auto;padding:18px}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid #313a6b;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.phasebar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#2b336a;color:var(--muted);border:1px solid #3a447f}
.pill.on{background:var(--accent);color:#053;font-weight:700}
.prompt{text-align:center;color:var(--muted);min-height:22px;margin-bottom:6px}
.mach{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 8px}
.hopper,.chute{width:74px;height:54px;border-radius:10px;background:#2b336a;border:2px solid #4b568f;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.box{width:130px;height:96px;border-radius:16px;background:linear-gradient(180deg,#5a67b8,#414c86);border:3px solid #8ea0ff;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.box .gear{font-size:40px;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.box .rule{position:absolute;bottom:6px;font-size:12px;color:#cdd6ff}
.arrow{font-size:26px;color:var(--muted)}
.tbl{margin:0 auto 8px;border-collapse:collapse;font-size:16px}
.tbl th,.tbl td{border:1px solid #3a447f;padding:4px 14px;text-align:center;font-weight:800}
.tbl th{color:var(--muted);font-weight:600;font-size:13px}
.tbl td.newrow{color:var(--accent)}
.probes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.chip{padding:8px 14px;border-radius:12px;background:#2b336a;border:2px solid #3a447f;color:var(--ink);font-weight:800;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip:disabled{opacity:.4}
.section{background:#12172f;border:1px solid #2a336a;border-radius:12px;padding:10px;margin-top:8px}
.section h3{margin:0 0 6px;font-size:13px;color:var(--accent2)}
.qbig{font-size:22px;font-weight:800;text-align:center}
.entry{text-align:center;font-size:28px;font-weight:800;min-height:36px;letter-spacing:2px}
.keypad{display:grid;grid-template-columns:repeat(3,58px);gap:6px;justify-content:center;margin-top:6px}
.key{height:46px;border-radius:10px;background:#2b336a;border:2px solid #3a447f;color:var(--ink);font-size:20px;font-weight:800;cursor:pointer}
.key:hover{border-color:var(--accent)}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{padding:10px 14px;border-radius:10px;background:#2b336a;border:2px solid #3a447f;color:var(--ink);font-size:18px;font-weight:800;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.slots{display:flex;gap:8px;justify-content:center;align-items:center;min-height:48px;margin:6px 0}
.slot{min-width:64px;height:44px;border-radius:10px;border:2px dashed #4b568f;display:flex;align-items:center;justify-content:center;font-weight:800;background:#161c3a}
.slot.filled{border-style:solid;border-color:var(--accent);cursor:pointer}
.row{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
button.act{font:600 15px system-ui;padding:9px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--accent);color:#053}
button.act.ghost{background:#2b336a;color:var(--ink);border:1px solid #3a447f}
button.act:disabled{opacity:.4}
.fb{text-align:center;font-weight:700;min-height:24px;margin-top:8px}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.hand{position:fixed;font-size:32px;z-index:40;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:left .45s ease,top .45s ease}
.tele{font-size:13px}.tele h2{font-size:14px;margin:0 0 8px;color:var(--accent)}
.metrics{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-bottom:10px}
.metrics div:nth-child(odd){color:var(--muted)}.metrics b{font-variant-numeric:tabular-nums}
.log{height:170px;overflow:auto;background:#12172f;border:1px solid #2a336a;border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-acc{color:var(--good)}.t-err{color:var(--bad)}.t-sys{color:var(--muted)}.t-evt{color:#9fb0ff}
.legend{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <h1>Function Machine</h1>
    <div class="sub">Crack the machine's secret rule. Test numbers, then answer.</div>
    <div class="phasebar" id="phasebar"></div>
    <div class="prompt" id="prompt"></div>
    <div class="mach">
      <div class="hopper" id="hopper">?</div><div class="arrow">&#8594;</div>
      <div class="box"><div class="gear">&#9881;</div><div class="rule" id="ruleTag">? ? ?</div></div>
      <div class="arrow">&#8594;</div><div class="chute" id="chute">?</div>
    </div>
    <table class="tbl" id="tbl"></table>
    <div class="section" id="probeSec">
      <h3>Test a number (uses a probe)</h3>
      <div class="probes" id="probes"></div>
      <div style="text-align:center;color:var(--muted);font-size:12px">Probes left: <b id="probesLeft">0</b></div>
    </div>
    <div class="section" id="answerSec"></div>
    <div class="row">
      <button class="act ghost" id="hintBtn">Show another example</button>
      <button class="act ghost" id="nextBtn" style="display:none">Next</button>
    </div>
    <div class="fb" id="fb"></div>
    <div class="hand" id="hand">&#128070;</div>
  </main>
  <aside class="card tele">
    <h2>Live telemetry</h2>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="legend">Logs M-ACC, M-RTFIRST, M-HINT, M-EXPLORE (probes) and <b>M-DIFFREACH</b> (hardest rule solved).</div>
  </aside>
</div>
<script>
(function(){
  "use strict";
  var el=function(id){return document.getElementById(id)};
  var hopper=el('hopper'),chute=el('chute'),ruleTag=el('ruleTag'),tbl=el('tbl'),
      probes=el('probes'),probeSec=el('probeSec'),answerSec=el('answerSec'),
      hintBtn=el('hintBtn'),nextBtn=el('nextBtn'),fb=el('fb'),hand=el('hand'),prompt=el('prompt');
  var T0=Date.now();function perf(){return Date.now()-T0;}
  var diffName={1:'one-step',2:'one-step x',3:'two-step'};

  var Tel={scored:0,correct:0,firsts:[],probeTotal:0,hintTotal:0,maxDiff:0,
    push:function(cls,msg){var d=document.createElement('div');d.className=cls;d.textContent='['+(perf()/1000).toFixed(2)+'s] '+msg;
      var g=el('log');g.appendChild(d);g.scrollTop=g.scrollHeight;},
    render:function(){
      var acc=Tel.scored?Math.round(100*Tel.correct/Tel.scored)+'% ('+Tel.correct+'/'+Tel.scored+')':'—';
      var mean=Tel.firsts.length?Math.round(Tel.firsts.reduce(function(a,b){return a+b},0)/Tel.firsts.length):0;
      el('metrics').innerHTML=
        '<div>M-ACC accuracy</div><b>'+acc+'</b>'+
        '<div>M-RTFIRST mean</div><b>'+(mean||'—')+' ms</b>'+
        '<div>M-EXPLORE probes</div><b>'+Tel.probeTotal+'</b>'+
        '<div>M-HINT hints</div><b>'+Tel.hintTotal+'</b>'+
        '<div>M-DIFFREACH</div><b>'+(Tel.maxDiff?diffName[Tel.maxDiff]:'—')+'</b>';
    }};

  function mk(fn,label){return {fn:fn,label:label};}
  var items=[
    {phase:'demo',rule:mk(function(x){return x+2;},'+2'),examples:[1,2],diff:1,mode:'predict',query:4,probeChips:[3,5],maxProbes:2},
    {phase:'warmup',rule:mk(function(x){return x+1;},'+1'),examples:[1,2],diff:1,mode:'predict',query:5,probeChips:[3,4],maxProbes:2},
    {phase:'scored',rule:mk(function(x){return x*2;},'x2'),examples:[2,3,4],diff:2,mode:'predict',query:6,probeChips:[1,5,10],maxProbes:3},
    {phase:'scored',rule:mk(function(x){return x*2+1;},'x2 +1'),examples:[1,2,3],diff:3,mode:'build',target:['x2','+1'],probeChips:[4,5,10],maxProbes:3}
  ];
  var labels={demo:'1 Watch',warmup:'2 Try',scored:'3 Solve'};
  var i=-1,cur=null,itemStart=0,firstAction=0,answered=false,entry='',probesLeft=0,extraExamples=0,seq=[];

  function renderPhasebar(){el('phasebar').innerHTML=['demo','warmup','scored'].map(function(p){
    return '<span class="pill'+(cur&&cur.phase===p?' on':'')+'">'+labels[p]+'</span>';}).join('')+
    (cur&&cur.phase==='scored'?'<span class="pill">diff: '+diffName[cur.diff]+'</span>':'');}

  function drawTable(){
    var rows='<tr><th>in</th><th>out</th></tr>';
    cur.examples.forEach(function(x){rows+='<tr><td>'+x+'</td><td>'+cur.rule.fn(x)+'</td></tr>';});
    tbl.innerHTML=rows;
  }
  function addExampleRow(x){var tr=document.createElement('tr');tr.innerHTML='<td class="newrow">'+x+'</td><td class="newrow">'+cur.rule.fn(x)+'</td>';tbl.appendChild(tr);}

  function sendThrough(x,silent){
    hopper.textContent=x;
    setTimeout(function(){chute.textContent=cur.rule.fn(x);beep(660,900);},450);
    if(!silent)Tel.push('t-evt','probe '+x+' -> '+cur.rule.fn(x));
  }

  function buildProbes(){
    probes.innerHTML=''; probesLeft=cur.maxProbes; el('probesLeft').textContent=probesLeft;
    cur.probeChips.forEach(function(x){var b=document.createElement('button');b.className='chip';b.textContent=x;
      b.onclick=function(){ if(answered)return; if(firstAction===0){firstAction=perf();Tel.push('t-evt','first action');}
        if(probesLeft<=0){Tel.push('t-sys','no probes left');return;} probesLeft--; Tel.probeTotal++; el('probesLeft').textContent=probesLeft;
        sendThrough(x); b.disabled=true; };
      probes.appendChild(b);});
  }

  function buildAnswer(){
    answerSec.innerHTML='';
    if(cur.mode==='predict'){
      var q=document.createElement('div');q.className='qbig';q.innerHTML='Mystery input <b style="color:var(--accent2)">'+cur.query+'</b> &#8594; what comes out?';
      answerSec.appendChild(q);
      entry='';var e=document.createElement('div');e.className='entry';e.id='entry';e.textContent='_';answerSec.appendChild(e);
      var kp=document.createElement('div');kp.className='keypad';
      ['1','2','3','4','5','6','7','8','9','del','0','ok'].forEach(function(t){
        var b=document.createElement('button');b.className='key';b.textContent=t==='del'?'\u232b':(t==='ok'?'Submit':t);
        b.onclick=function(){ if(answered)return; if(firstAction===0){firstAction=perf();Tel.push('t-evt','first action');}
          if(t==='del')entry=entry.slice(0,-1); else if(t==='ok'){if(entry!=='')submitPredict(parseInt(entry,10));return;} else if(entry.length<4)entry+=t;
          el('entry').textContent=entry===''?'_':entry;};
        kp.appendChild(b);});
      answerSec.appendChild(kp);
    } else {
      var h=document.createElement('div');h.className='qbig';h.textContent='Build the rule (drag up to 2 steps):';answerSec.appendChild(h);
      var slotsWrap=document.createElement('div');slotsWrap.className='slots';slotsWrap.id='slots';
      slotsWrap.innerHTML='in &#8594; <div class="slot" data-k="0">?</div><div class="slot" data-k="1">?</div> &#8594; out';answerSec.appendChild(slotsWrap);
      seq=[];
      var bank=document.createElement('div');bank.className='tiles';
      ['+1','+2','+3','-1','x2','x3'].forEach(function(t){var b=document.createElement('div');b.className='tile';b.textContent=t;
        b.onclick=function(){ if(answered)return; if(firstAction===0){firstAction=perf();Tel.push('t-evt','first action');}
          if(seq.length<2){seq.push(t);refreshSlots();Tel.push('t-evt','add step '+t);}};
        bank.appendChild(b);});
      answerSec.appendChild(bank);
      var chk=document.createElement('button');chk.className='act';chk.textContent='Check rule';chk.style.marginTop='8px';
      chk.onclick=function(){ if(answered)return; if(seq.length===0)return; submitBuild(); };
      var wrap=document.createElement('div');wrap.className='row';wrap.appendChild(chk);answerSec.appendChild(wrap);
    }
  }
  function refreshSlots(){var s=el('slots').querySelectorAll('.slot');
    s.forEach(function(sl,k){ if(seq[k]){sl.textContent=seq[k];sl.classList.add('filled');sl.onclick=function(){if(answered)return;seq.splice(k,1);refreshSlots();Tel.push('t-evt','remove step');};}
      else{sl.textContent='?';sl.classList.remove('filled');sl.onclick=null;} });}

  function applySeq(x){var v=x;seq.forEach(function(t){var op=t[0],n=+t.slice(1);if(op==='+')v+=n;else if(op==='-')v-=n;else if(op==='x')v*=n;});return v;}

  function submitPredict(val){
    answered=true; var ok=(val===cur.rule.fn(cur.query));
    finishScore(ok,'predict '+cur.query+' -> answered '+val+' (key '+cur.rule.fn(cur.query)+')');
    el('entry').textContent=val;
  }
  function submitBuild(){
    answered=true;
    var ok=cur.examples.every(function(x){return applySeq(x)===cur.rule.fn(x);});
    finishScore(ok,'build rule ['+seq.join(' ')+'] (target ['+cur.target.join(' ')+'])');
  }

  function finishScore(ok,detail){
    if(cur.phase==='scored'){
      Tel.scored++; if(ok){Tel.correct++; if(cur.diff>Tel.maxDiff)Tel.maxDiff=cur.diff;}
      if(firstAction)Tel.firsts.push(firstAction-itemStart);
      Tel.push(ok?'t-acc':'t-err','SCORED '+detail+(ok?' OK':' WRONG')+'  first='+(firstAction?firstAction-itemStart:'-')+'ms probes='+ (cur.maxProbes-probesLeft));
      if(ok)beep(600,950);
    } else { Tel.push('t-sys',cur.phase.toUpperCase()+': '+detail+(ok?' OK':' wrong')+' — not scored'); }
    fb.textContent= ok? (cur.phase==='warmup'?'You cracked it! Now the real machines.':'Cracked the machine!') : 'Not the secret rule.';
    fb.className='fb '+(ok?'good':'bad');
    hintBtn.disabled=true; nextBtn.style.display='inline-block'; Tel.render();
  }

  hintBtn.onclick=function(){ if(answered)return; var used=cur.examples.length+extraExamples; var nx=(cur.examples[cur.examples.length-1]||1)+3+extraExamples;
    extraExamples++; Tel.hintTotal++; addExampleRow(nx); Tel.push('t-evt','HINT: extra example '+nx+' -> '+cur.rule.fn(nx)); Tel.render(); };

  function load(){
    i++; if(i>=items.length)return finish();
    cur=items[i]; answered=false; firstAction=0; entry=''; extraExamples=0; seq=[];
    fb.textContent='';fb.className='fb'; nextBtn.style.display='none'; hintBtn.disabled=false;
    hopper.textContent='?'; chute.textContent='?'; ruleTag.textContent='secret';
    renderPhasebar(); drawTable(); buildProbes(); buildAnswer();
    prompt.textContent = cur.phase==='demo'?'Watch: test a number, then predict the output.':
      (cur.mode==='build'?'Figure out the two-step rule and build it.':'Find the secret rule, then predict the output.');
    probeSec.style.display = cur.phase==='demo'?'none':'block';
    answerSec.style.display = cur.phase==='demo'?'none':'block';
    hintBtn.style.display = cur.phase==='demo'?'none':'inline-block';
    itemStart=perf();
    Tel.push('t-sys','LOAD '+cur.phase+' rule='+cur.rule.label+' mode='+cur.mode+(cur.query?' query='+cur.query:''));
    Tel.render();
    if(cur.phase==='demo')ghost();
  }
  nextBtn.onclick=load;

  function ghost(){
    hand.style.opacity='0';
    setTimeout(function(){sendThrough(3,true);Tel.push('t-sys','ghost: test 3');},600);
    setTimeout(function(){ruleTag.textContent='+2 ?';Tel.push('t-sys','ghost: sees 3->5 (+2)');},1300);
    setTimeout(function(){sendThrough(4,true);Tel.push('t-sys','ghost: predict input 4');},2100);
    setTimeout(function(){chute.textContent='6';beep(600,950);Tel.push('t-sys','ghost: output 6');},2600);
    setTimeout(function(){fb.textContent='Rule was +2!';fb.className='fb good';},3000);
    setTimeout(function(){fb.textContent='';load();},4000);
  }
  function beep(f1,f2){try{var a=new(window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.type='square';o.frequency.setValueAtTime(f1,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+.1);g.gain.setValueAtTime(.06,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.2);o.start();o.stop(a.currentTime+.22);}catch(e){}}

  function finish(){
    prompt.textContent='';tbl.innerHTML='';probeSec.style.display='none';answerSec.innerHTML='';hintBtn.style.display='none';fb.textContent='';
    document.querySelector('.mach').innerHTML='<div style="text-align:center;padding:10px"><div style="font-size:44px">\u2699\uFE0F</div>'+
      '<div style="color:var(--muted)">Machines cracked! DIFFREACH: '+(Tel.maxDiff?diffName[Tel.maxDiff]:'none')+'.</div></div>';
    Tel.push('t-sys','SESSION complete: '+Tel.correct+'/'+Tel.scored+' — M-DIFFREACH='+(Tel.maxDiff?diffName[Tel.maxDiff]:'none'));
  }
  window.addEventListener('blur',function(){Tel.push('t-sys','engagement: focus lost');});
  Tel.render(); load();
})();
</script>
</body>
</html>
