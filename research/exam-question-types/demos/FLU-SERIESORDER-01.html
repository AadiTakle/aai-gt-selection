<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-SERIESORDER-01 · Put It In Order</title>
<style>
  :root{
    --bg1:#eef6ff; --bg2:#fdeeff; --ink:#26304a; --card:#ffffff;
    --accent:#5b6cff; --good:#22b573; --bad:#ff6b6b; --slot:#c9d3ef;
    --tel-bg:#11162a; --tel-ink:#c8d6ff; --tel-key:#7fffcf; --tel-dim:#7183b8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:20px;max-width:620px;width:100%}
  .rowlabel{font-size:12px;letter-spacing:.1em;color:#98a2c4;text-transform:uppercase}
  #slots{display:flex;gap:10px;justify-content:center;padding:12px;background:linear-gradient(160deg,#eaf0ff,#f4f0ff);border-radius:18px;min-height:96px;align-items:center}
  .slot{width:72px;height:72px;border-radius:14px;border:3px dashed var(--slot);
    background:repeating-linear-gradient(45deg,#f3f6ff,#f3f6ff 7px,#eaf0ff 7px,#eaf0ff 14px);
    display:flex;align-items:center;justify-content:center;position:relative}
  .slot .idx{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:11px;color:#b6c0e0}
  .slot.filled{border-style:solid;border-color:#cdd7f2;background:#fff;cursor:pointer}
  .slot.fixed{border-color:#ffcf6e;background:#fff9ec}
  .slot.hit{border-color:var(--good);box-shadow:0 0 0 3px #b4ecd0}
  .slot.miss{border-color:var(--bad);box-shadow:0 0 0 3px #ffd0d0}
  #tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:80px;align-items:center}
  .frame{width:72px;height:72px;border-radius:14px;border:3px solid #e2e8fb;background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;-webkit-tap-highlight-color:transparent}
  .frame:hover{transform:translateY(-3px);border-color:#c3ccf5}
  .arrowchip{color:#c0c8e6;font-size:22px;align-self:center}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:74px;height:74px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:50px;height:50px;background:#eef1ff;color:#5b6cff;font-size:22px}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .6s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}
  @keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff;word-break:break-word}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:190px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}
  #log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-SERIESORDER-01 · Put It In Order</div>
    <div id="phasecue">&#128065;&#65039;</div>
    <div id="stagecard">
      <div class="rowlabel">the pattern, in order &#8594;</div>
      <div id="slots"></div>
      <div class="rowlabel">jumbled pieces &#183; tap to place</div>
      <div id="tray"></div>
      <div id="controls">
        <button id="replay" title="replay demo">&#8635;</button>
        <button id="go" title="submit">&#10003;</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">&#128072;<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

const PAL={red:'#e6194b',green:'#2ca25f',blue:'#4363d8',orange:'#f58231',purple:'#911eb4'};
const COLORKEYS=Object.keys(PAL);
function polyPts(cx,cy,r,n,rot){let p=[];for(let i=0;i<n;i++){let a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function baseShape(shape,color,cx,cy,r){const f='fill="'+color+'"';
  switch(shape){
    case 'circle':return `<circle cx="${cx}" cy="${cy}" r="${r}" ${f}/>`;
    case 'square':return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="3" ${f}/>`;
    case 'triangle':return `<polygon points="${polyPts(cx,cy,r,3,-Math.PI/2)}" ${f}/>`;
  } return '';}
function arrowSVG(cx,cy,r,color,rotDeg){const w=r*0.55;
  const d=`M ${cx} ${cy-r} L ${cx+w} ${cy} L ${cx+w*0.5} ${cy} L ${cx+w*0.5} ${cy+r} L ${cx-w*0.5} ${cy+r} L ${cx-w*0.5} ${cy} L ${cx-w} ${cy} Z`;
  return `<path d="${d}" fill="${color}" transform="rotate(${rotDeg} ${cx} ${cy})"/>`;}
function frameSVG(fr,box=60){const color=PAL[fr.color]||fr.color;const n=fr.count||1;let inner='';
  const s=fr.sizeScale||1;
  if(fr.shape==='arrow'){inner=arrowSVG(box/2,box/2,box*0.32*s,color,fr.rotDeg||0);}
  else if(n===1){inner=baseShape(fr.shape,color,box/2,box/2,box*0.30*s);}
  else{const pos=n===2?[[.32,.5],[.68,.5]]:n===3?[[.25,.5],[.5,.5],[.75,.5]]:[[.28,.3],[.72,.3],[.28,.7],[.72,.7]];
    const r=box*0.12*s;pos.slice(0,n).forEach(p=>inner+=baseShape(fr.shape,color,p[0]*box,p[1]*box,r));}
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${inner}</svg>`;}

/* ordered frames by rising value; tray is shuffled */
function genItem(len,attrs){
  const color=shuffle(COLORKEYS)[0];
  const shape=attrs.includes('rotation')?'arrow':(attrs.includes('count')?'circle':'square');
  const frames=[];
  for(let i=0;i<len;i++)frames.push({v:i,shape,color,
    count:attrs.includes('count')?i+1:1,
    sizeScale:attrs.includes('size')?(0.62+0.17*i):1,
    rotDeg:attrs.includes('rotation')?Math.round(i*(135/(len-1||1))):0});
  return {len,attrs,frames,tray:shuffle(frames.map(f=>({...f})))};}

const T={scored:0,correct:0,firstLat:null,path:[],moves:0,rev:0,polyLast:'\u2014',itemStart:0,firstActed:false};
const METERS=[
 {id:'M-ACC',name:'Item accuracy (full order right)',get:()=>T.scored?`${T.correct}/${T.scored}  ${Math.round(100*T.correct/T.scored)}%`:'\u2014'},
 {id:'M-POLY',name:'Partial-credit (slots placed right)',get:()=>T.polyLast},
 {id:'M-PATH',name:'Placement order (slot=value)',get:()=>T.path.length?T.path.join(' ')+'':'\u2014'},
 {id:'M-REV',name:'Revisions (pieces sent back)',get:()=>T.rev+''},
 {id:'M-EFF',name:'Efficiency vs optimal',get:()=>T.moves?`${T.moves} moves (min ${curLen()})`:'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency (rule extract)',get:()=>T.firstLat==null?'\u2014':T.firstLat+' ms'},
];
function curLen(){return cur?cur.len:'-';}
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>
  `<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');
  d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}

const ghost=$('#ghost');
function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(600);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(480);}

let phase='demo',cur=null,slots=[],tray=[],locked=true,scoredIndex=0;
const scoredItems=[genItem(4,['count']),genItem(4,['size','rotation'])];
function setCue(i){$('#phasecue').innerHTML=i;}
function renderSlots(){const el=$('#slots');el.innerHTML='';
  slots.forEach((fr,i)=>{const s=document.createElement('div');s.className='slot'+(fr?' filled':'');s.dataset.slot=i;
    s.innerHTML=`<span class="idx">${i+1}</span>`+(fr?frameSVG(fr):'');el.appendChild(s);
    if(i<slots.length-1){const a=document.createElement('div');a.className='arrowchip';a.textContent='\u2192';el.appendChild(a);}});}
function renderTray(){const el=$('#tray');el.innerHTML='';
  tray.forEach((fr,i)=>{const f=document.createElement('div');f.className='frame';f.dataset.tray=i;f.innerHTML=frameSVG(fr);el.appendChild(f);});}
function renderItem(item){cur=item;slots=Array(item.len).fill(null);tray=item.tray.map(f=>({...f}));
  renderSlots();renderTray();$('#go').classList.remove('ready');
  T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;T.path=[];T.moves=0;T.rev=0;T.polyLast='\u2014';renderMeters();}
function ready(){return slots.every(s=>s!==null);}
function firstAct(){if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first action');}}
function placeFromTray(trayIdx){if(locked)return;const slot=slots.indexOf(null);if(slot<0)return;
  firstAct();const fr=tray.splice(trayIdx,1)[0];slots[slot]=fr;T.moves++;T.path.push('s'+(slot+1)+'=v'+(fr.v+1));
  log('placed piece(v'+(fr.v+1)+') \u2192 slot '+(slot+1));renderSlots();renderTray();$('#go').classList.toggle('ready',ready());renderMeters();}
function returnSlot(slotIdx){if(locked)return;const fr=slots[slotIdx];if(!fr)return;
  firstAct();slots[slotIdx]=null;tray.push(fr);T.rev++;T.moves++;log('sent slot '+(slotIdx+1)+' back to tray');
  renderSlots();renderTray();$('#go').classList.toggle('ready',ready());renderMeters();}
function submit(){if(!ready())return;let nc=0;slots.forEach((fr,i)=>{if(fr.v===i)nc++;});const correct=nc===cur.len;
  T.polyLast=nc+' / '+cur.len+' slots';
  const slotEls=$$('#slots .slot');slots.forEach((fr,i)=>{slotEls[i].classList.add(fr.v===i?'hit':'miss');});
  if(phase==='warmup'){log('warm-up '+(correct?'correct':nc+'/'+cur.len)+' — UNSCORED');locked=true;$('#go').classList.remove('ready');setTimeout(nextPhase,1050);return;}
  T.scored++;if(correct)T.correct++;else{$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),450);}
  locked=true;$('#go').classList.remove('ready');
  log(`SUBMIT item ${scoredIndex+1} · [${cur.attrs.join('+')}] len ${cur.len} \u2192 ${correct?'CORRECT':'partial'} · POLY ${nc}/${cur.len} · moves ${T.moves} (min ${cur.len}) · rev ${T.rev}`);
  renderMeters();setTimeout(nextPhase,1300);}
function nextPhase(){if(phase==='warmup'){scoredIndex=0;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<scoredItems.length?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('&#11088;');locked=false;renderItem(genItem(3,['size']));log('— warm-up (unscored): order small \u2192 big —');}
function startScored(){phase='scored';setCue('&#127919;');locked=false;renderItem(scoredItems[scoredIndex]);
  log(`— SCORED item ${scoredIndex+1}: reconstruct the [${cur.attrs.join('+')}] progression —`);}
function finish(){phase='done';setCue('&#127942;');locked=true;log(`— DONE · accuracy ${T.correct}/${T.scored} —`);}
async function runDemo(){phase='demo';setCue('&#128065;&#65039;');locked=true;
  const d=genItem(3,['size']);renderItem(d);log('ghost-hand demo (wordless, <10s): jumbled \u2192 ordered');
  ghostShow(true);await sleep(300);locked=false;
  for(let target=0;target<d.len;target++){
    const tIdx=tray.findIndex(f=>f.v===target);const el=$$('#tray .frame')[tIdx];
    await ghostTo(el);await ghostTap();placeFromTray(tIdx);await sleep(150);}
  await sleep(250);await ghostTo($('#go'));await ghostTap();
  const slotEls=$$('#slots .slot');slots.forEach((fr,i)=>slotEls[i].classList.add('hit'));
  await sleep(550);ghostShow(false);locked=true;await sleep(400);startWarmup();}

$('#tray').addEventListener('click',e=>{const f=e.target.closest('.frame');if(f)placeFromTray(+f.dataset.tray);});
$('#slots').addEventListener('click',e=>{const s=e.target.closest('.slot.filled');if(s)returnSlot(+s.dataset.slot);});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
