<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUANT-WORD-01 · Story Model</title>
<style>
  :root{
    --paper:#fffdf7;--ink:#2e3a43;--scene:#eaf5ee;--model:#eef1f8;--one:#e07255;--two:#3f83a9;
    --accent:#efb43f;--good:#2c9f70;--bad:#d85c65;--tel:#121a22;--tel2:#1d2933;
    --key:#74efc5;--dim:#788f9e;
  }
  *{box-sizing:border-box}html,body{margin:0;min-height:100%}
  body{
    display:flex;color:var(--ink);font:16px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;
    background:linear-gradient(145deg,#e7f4ec,#f6eadb);
  }
  button{font:inherit;border:0;cursor:pointer}
  #wrap{flex:1;min-width:0;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
  #badge{font-size:12px;font-weight:800;letter-spacing:.1em;color:#758a83;text-transform:uppercase}
  #phasecue{font-size:34px;height:40px}
  #stagecard{
    width:min(820px,100%);background:var(--paper);border-radius:30px;padding:20px;
    display:grid;gap:14px;box-shadow:0 25px 62px -35px #405b4f;border:1px solid #fff;
  }
  #story{
    min-height:190px;border-radius:23px;background:linear-gradient(#e7f5ed,#f8fbf6);
    border:2px solid #d1e4d9;position:relative;padding:17px;display:flex;flex-direction:column;justify-content:center;
  }
  #scene{min-height:120px;display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
  .sceneRow{min-width:105px;min-height:65px;border-radius:18px;background:#ffffffbb;padding:11px;display:flex;flex-wrap:wrap;gap:7px;align-content:center;justify-content:center}
  .object{width:25px;height:25px;border-radius:50%;background:var(--one);border:2px solid #a74838;box-shadow:inset 0 -3px #0002}
  .sceneRow:nth-child(even) .object{background:var(--two);border-color:#2b607e;border-radius:5px;background-image:repeating-linear-gradient(45deg,transparent 0 4px,#fff5 4px 7px)}
  .object.away{opacity:.25;transform:translateY(-12px)}
  .action{font-size:34px;color:#789084}
  .bin{min-width:77px;min-height:70px;border:3px solid #91a89b;border-top:0;border-radius:0 0 20px 20px;padding:8px;display:flex;flex-wrap:wrap;align-content:end;justify-content:center;gap:4px}
  .mystery{width:76px;height:76px;border:4px dashed var(--accent);border-radius:20px;display:grid;place-items:center;font-size:35px;background:#fff9e9}
  #beats{display:flex;justify-content:center;gap:14px;height:16px;margin-top:7px}
  #beats i{width:11px;height:11px;border-radius:50%;background:#cadbd1}#beats i.live{background:var(--accent);box-shadow:0 0 0 5px #efb43f33}
  #replayStory{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;background:#dbeae1;color:#587266;font-size:20px}
  #builder{border-radius:22px;background:var(--model);border:2px solid #d9dfeb;padding:13px;display:grid;gap:11px}
  #palette{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
  .piece{
    min-width:65px;height:58px;border-radius:13px;background:#fff;border:3px solid transparent;padding:7px;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .piece:hover:not(:disabled){transform:translateY(-2px)}.piece.chosen{border-color:var(--accent);background:#fff8e6}
  .miniBar{height:25px;border:2px solid #a94839;border-radius:7px;background:repeating-linear-gradient(90deg,var(--one) 0 12px,#f09b83 12px 14px);position:relative}
  .miniBar.blue{border-color:#2d6685;background:repeating-linear-gradient(90deg,var(--two) 0 12px,#7eb4d0 12px 14px)}
  .miniBar::after{content:"";position:absolute;inset:5px;background:radial-gradient(circle,#fff 0 2px,transparent 3px);background-size:13px 13px}
  #model{
    min-height:80px;border:3px dashed #aeb9cd;border-radius:16px;background:#fff;display:flex;
    align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;padding:10px;
  }
  .modelPiece{height:38px;border-radius:9px;background:repeating-linear-gradient(90deg,var(--one) 0 15px,#f09b83 15px 18px);border:2px solid #a94839}
  .modelPiece:nth-child(even){background:repeating-linear-gradient(90deg,var(--two) 0 15px,#7eb4d0 15px 18px);border-color:#2d6685}
  #answers{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
  .answer{width:75px;min-height:67px;border-radius:15px;background:#fff;border:3px solid transparent;display:grid;place-items:center}
  .answer.selected{border-color:var(--accent);background:#fff8e7}.answer.correct{border-color:var(--good);background:#e4f8ef}.answer.wrong{border-color:var(--bad);background:#ffe9ec}
  .answerDots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:54px}.answerDots i{width:10px;height:10px;border-radius:50%;background:#596b7b}
  #controls{display:flex;justify-content:center;align-items:center;gap:14px}
  .round{width:49px;height:49px;border-radius:50%;background:#e5ebe7;color:#607569;font-size:22px}
  #go{
    width:70px;height:70px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;
    box-shadow:0 12px 25px -12px #9f731b;opacity:.35;pointer-events:none;
  }
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.05s infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
  #builder.good{box-shadow:0 0 0 5px #78cba655}#builder.bad{animation:shake .4s;box-shadow:0 0 0 4px #e59aa155}
  #progress{display:flex;justify-content:center;gap:7px;height:11px}
  #progress i{width:10px;height:10px;border-radius:50%;background:#d9e1de}
  #progress i.ok{background:var(--good)}#progress i.no{background:var(--bad)}
  #ghost{
    position:fixed;left:0;top:0;z-index:60;font-size:40px;opacity:0;pointer-events:none;
    transition:transform .44s cubic-bezier(.2,.7,.2,1),opacity .2s;filter:drop-shadow(0 3px 4px #0004);
  }
  #ghost.show{opacity:.95}#ghost.tap{animation:tap .34s}@keyframes tap{50%{scale:.78}}
  #telemetry{
    width:355px;flex:0 0 355px;min-height:100vh;background:var(--tel);color:#c5d3dc;
    display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  #telemetry h3{margin:0;padding:13px 14px;background:var(--tel2);color:#fff;font-size:12px;letter-spacing:.09em;text-transform:uppercase}
  #difficulty{padding:10px 13px;border-bottom:1px solid #2c3c48}
  #diffhead{display:flex;justify-content:space-between;color:#a1b3bf;font-size:11px}
  #diffbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:7px 0}
  #diffbar i{height:8px;border-radius:8px;background:#2c404c}#diffbar i.live{background:var(--accent)}
  #dtrend{font-size:11px;color:#748997}
  #mlist{padding:11px 13px;display:flex;flex-direction:column;gap:8px}
  .mrow{display:grid;grid-template-columns:105px 1fr;gap:7px}.mid{color:var(--key);font-weight:800}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--dim);font-size:11px;margin-top:-4px}
  #logwrap{margin-top:auto;border-top:1px solid #2c3c48}
  #logwrap b{display:block;padding:8px 12px 3px;color:#879ca9;font-size:11px;letter-spacing:.08em}
  #log{height:225px;overflow:auto;padding:2px 12px 12px;white-space:pre-wrap}
  #log div{padding:3px 0;border-bottom:1px dotted #293943}#log .t{color:#5c7382}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;min-height:0;height:355px;flex:none}}
  @media(max-width:580px){#stagecard{padding:12px}.sceneRow{min-width:75px}.piece{min-width:54px}#story{min-height:170px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="wrap">
  <div id="badge">QUANT-WORD-01 · Story Model</div>
  <div id="phasecue">👁️</div>
  <section id="stagecard">
    <div id="story"><div id="scene"></div><div id="beats"></div><button id="replayStory" aria-label="replay story">▶</button></div>
    <div id="builder"><div id="palette"></div><div id="model"></div><div id="answers"></div></div>
    <div id="controls"><button class="round" id="replayDemo" aria-label="replay demonstration">↻</button><button id="go" aria-label="submit">✓</button></div>
    <div id="progress"></div>
  </section>
</main>
<aside id="telemetry">
  <h3>Live telemetry · per-child</h3>
  <div id="difficulty"><div id="diffhead"><span>DIFFICULTY</span><span id="dlevel"></span></div><div id="diffbar"></div><div id="dtrend"></div></div>
  <div id="mlist"></div>
  <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
</aside>
<div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const p=(key,units,blue=false)=>({key,units,blue});
const a=(n,err='none')=>({n,err});
const ITEMS=[
  {level:1,label:'join',frames:[{rows:[2],action:'➕'},{rows:[2,3],action:'➜'},{rows:[5],unknown:true}],pieces:[p('two',2),p('three',3,true),p('four',4),p('five',5,true)],accepted:[['two','three']],answers:[a(4,'one-short'),a(5),a(6,'one-extra')],correct:1},
  {level:2,label:'separate',frames:[{rows:[7],action:'➖'},{rows:[4],away:3,action:'➜'},{rows:[4],unknown:true}],pieces:[p('start7',7),p('away3',3,true),p('stay4',4),p('away2',2,true)],accepted:[['start7','away3'],['stay4','away3']],answers:[a(3,'removed-not-left'),a(4),a(10,'joined')],correct:1},
  {level:3,label:'compare',frames:[{rows:[7,4],action:'↔'},{rows:[4,3],action:'➜'},{rows:[3],unknown:true}],pieces:[p('long7',7),p('short4',4,true),p('gap3',3),p('sum11',11,true)],accepted:[['long7','short4'],['short4','gap3']],answers:[a(11,'sum-not-gap'),a(4,'shorter-set'),a(3)],correct:2},
  {level:4,label:'equal groups',frames:[{groups:[2],action:'➕'},{groups:[2,2],action:'➕'},{groups:[2,2,2],unknown:true}],pieces:[p('g1',2),p('g2',2,true),p('g3',2),p('extra',3,true)],accepted:[['g1','g2','g3']],answers:[a(3,'group-count'),a(5,'one-short'),a(6)],correct:2},
  {level:5,label:'two-step',frames:[{rows:[4],action:'➕'},{rows:[7],action:'➖'},{rows:[5],unknown:true}],pieces:[p('start4',4),p('join3',3,true),p('leave2',2),p('after7',7,true)],accepted:[['start4','join3','leave2'],['after7','leave2']],answers:[a(9,'joined-only'),a(5),a(2,'last-action-only')],correct:1},
  {level:6,label:'share and remainder',frames:[{rows:[11],action:'↘'},{groups:[3,3,3],away:2,action:'↔'},{groups:[3,3,3],unknown:true}],pieces:[p('all11',11),p('groups9',9,true),p('gA',3),p('gB',3,true),p('gC',3),p('rem2',2,true)],accepted:[['all11','groups9'],['gA','gB','gC','rem2']],answers:[a(3,'group-size'),a(2),a(9,'shared-total')],correct:1}
];
const DEMO={level:1,label:'demo',frames:[{rows:[2],action:'➕'},{rows:[2,3],action:'➜'},{rows:[5],unknown:true}],pieces:[p('two',2),p('three',3,true),p('four',4)],accepted:[['two','three']],answers:[a(4,'one-short'),a(5),a(6,'one-extra')],correct:1};
const WARM={level:1,label:'warm-up',frames:[{rows:[1],action:'➕'},{rows:[1,2],action:'➜'},{rows:[3],unknown:true}],pieces:[p('one',1),p('two',2,true),p('three',3)],accepted:[['one','two']],answers:[a(2,'part-only'),a(3),a(4,'one-extra')],correct:1};
let phase='demo',cur=null,chosen=new Set(),answer=-1,locked=true,animToken=0,scoredIndex=0;
const T={scored:0,correct:0,poly:'—',path:[],prog:[],plan:'—',level:1,startLevel:1,maxSolved:0,results:[],itemStart:0};
const METERS=[
  {id:'M-ACC',name:'Valid model plus unique answer',get:()=>T.scored?`${T.correct}/${T.scored} · ${Math.round(100*T.correct/T.scored)}%`:'—'},
  {id:'M-POLY',name:'Entities, relations, and answer captured',get:()=>T.poly},
  {id:'M-PATH',name:'Model-piece and answer sequence',get:()=>T.path.length?T.path.slice(-10).join('→'):'—'},
  {id:'M-PROG',name:'Model completion trajectory',get:()=>T.prog.length?T.prog.join('→')+'%':'—'},
  {id:'M-PLANFUL',name:'Situation-model versus answer-first path',get:()=>T.plan},
  {id:'M-DIFFREACH',name:'Deepest visual story structure solved',get:()=>T.maxSolved?`level ${T.maxSolved} · ${ITEMS[T.maxSolved-1].label}`:'—'},
  {id:'M-LEARNRATE',name:'Adaptive level gain per item',get:()=>T.scored?`${((T.level-T.startLevel)/T.scored).toFixed(2)} level/trial`:'—'}
];
function buildTelemetry(){
  $('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');
  $('#diffbar').innerHTML=ITEMS.map(()=>'<i></i>').join('');
  $('#progress').innerHTML=ITEMS.map(()=>'<i></i>').join('');
}
function renderMeters(){
  METERS.forEach(m=>$('#v_'+m.id).textContent=m.get());
  $('#dlevel').textContent=`${T.level} / 6 · ${ITEMS[T.level-1].label}`;
  [...$('#diffbar').children].forEach((x,i)=>x.classList.toggle('live',i<T.level));
  $('#dtrend').textContent=`path ${T.results.join('')||'·'} · success raises, miss lowers`;
}
function log(message){
  const elapsed=T.itemStart?Math.round(performance.now()-T.itemStart):0;
  const row=document.createElement('div');row.innerHTML=`<span class="t">+${elapsed}ms</span> ${message}`;
  $('#log').appendChild(row);$('#log').scrollTop=$('#log').scrollHeight;
}
function objects(count,away=false){return Array.from({length:count},()=>`<i class="object${away?' away':''}"></i>`).join('')}
function renderFrame(frame){
  let html='';
  if(frame.groups)html=frame.groups.map(count=>`<div class="bin">${objects(count)}</div>`).join('');
  else html=(frame.rows||[]).map(count=>`<div class="sceneRow">${objects(count)}</div>`).join('');
  if(frame.away)html+=`<span class="action">↗</span><div class="sceneRow">${objects(frame.away,true)}</div>`;
  if(frame.action)html+=`<span class="action">${frame.action}</span>`;
  if(frame.unknown)html+='<div class="mystery">?</div>';
  $('#scene').innerHTML=html;
}
async function playStory(replay=true){
  const token=++animToken;locked=true;if(replay){T.path.push('▶');log('story replay')}
  $('#beats').innerHTML=cur.frames.map(()=>'<i></i>').join('');renderBuilder();
  for(let i=0;i<cur.frames.length;i++){
    if(token!==animToken)return;[...$('#beats').children].forEach((x,j)=>x.classList.toggle('live',i===j));
    renderFrame(cur.frames[i]);await sleep(430);
  }
  if(token!==animToken)return;locked=false;T.itemStart=performance.now();renderBuilder();
}
function miniBar(piece,model=false){
  const width=clamp(piece.units*(model?15:10),24,model?175:115);
  return `<span class="${model?'modelPiece':'miniBar'}${piece.blue&&!model?' blue':''}" style="width:${width}px"></span>`;
}
function answerDots(n){return `<span class="answerDots">${Array.from({length:n},()=>'<i></i>').join('')}</span>`}
function bestModelRatio(){
  return Math.max(...cur.accepted.map(set=>set.filter(key=>chosen.has(key)).length/Math.max(set.length,chosen.size,1)));
}
function exactModel(){return cur.accepted.some(set=>set.length===chosen.size&&set.every(key=>chosen.has(key)))}
function updatePartial(record=false){
  const points=Math.round((bestModelRatio()*3+(answer===cur.correct?1:0))/4*100);
  T.poly=`${points}% constraints`;
  if(record&&(T.prog.at(-1)!==points))T.prog.push(points);
}
function renderBuilder(){
  $('#palette').innerHTML=cur.pieces.map(piece=>`<button class="piece${chosen.has(piece.key)?' chosen':''}" data-key="${piece.key}" ${locked?'disabled':''}>${miniBar(piece)}</button>`).join('');
  $('#model').innerHTML=cur.pieces.filter(piece=>chosen.has(piece.key)).map(piece=>miniBar(piece,true)).join('');
  $('#answers').innerHTML=cur.answers.map((option,i)=>`<button class="answer${answer===i?' selected':''}" data-i="${i}" ${locked?'disabled':''}>${answerDots(option.n)}</button>`).join('');
  $('#go').classList.toggle('ready',!locked&&chosen.size>0&&answer>=0);updatePartial(false);renderMeters();
}
function choosePiece(key,ghost=false){
  if(locked)return;
  if(chosen.has(key)){chosen.delete(key);T.path.push('−'+key);T.plan='revised model'}
  else{chosen.add(key);T.path.push('+'+key);if(T.path.length===1)T.plan='model-before-answer'}
  updatePartial(true);renderBuilder();if(!ghost)log(`model ${T.path.at(-1)} · ${T.poly}`);
}
function chooseAnswer(index,ghost=false){
  if(locked)return;answer=index;T.path.push('a'+cur.answers[index].n);
  if(T.plan==='—')T.plan='answer-first';updatePartial(true);renderBuilder();if(!ghost)log(`answer tile ${cur.answers[index].n} · ${T.poly}`);
}
function feedback(correct){
  $('#builder').className=correct?'good':'bad';
  document.querySelectorAll('.answer').forEach((x,i)=>{if(i===cur.correct)x.classList.add('correct');if(i===answer&&!correct)x.classList.add('wrong')});
}
async function submit(){
  if(locked||answer<0||!chosen.size)return;locked=true;const correct=exactModel()&&answer===cur.correct;renderBuilder();feedback(correct);
  if(phase==='warmup'){
    log(`WARM-UP ${correct?'modeled':'corrective model'} · UNSCORED`);
    if(!correct){await sleep(420);chosen=new Set(cur.accepted[0]);answer=cur.correct;renderBuilder();feedback(true)}
    await sleep(750);startScored();return;
  }
  T.scored++;if(correct){T.correct++;T.maxSolved=Math.max(T.maxSolved,cur.level)}
  T.results.push(correct?'↑':'↓');T.level=clamp(T.level+(correct?1:-1),1,6);
  $('#progress').children[scoredIndex].classList.add(correct?'ok':'no');
  log(`SUBMIT level ${cur.level} ${cur.label} → ${correct?'CORRECT MODEL':'MISS'} · ${T.poly} · ${T.plan}`);
  renderMeters();scoredIndex++;await sleep(900);scoredIndex<6?startScored():finish();
}
function center(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function ghostTo(el){const p=center(el);$('#ghost').style.transform=`translate(${p.x-10}px,${p.y-10}px)`;await sleep(430)}
async function ghostTap(){$('#ghost').classList.remove('tap');void $('#ghost').offsetWidth;$('#ghost').classList.add('tap');await sleep(320)}
function reset(){
  Object.assign(T,{scored:0,correct:0,poly:'—',path:[],prog:[],plan:'—',level:1,startLevel:1,maxSolved:0,results:[],itemStart:0});
  scoredIndex=0;[...$('#progress').children].forEach(x=>x.className='');renderMeters();
}
async function loadItem(item,cue){
  cur=item;chosen=new Set();answer=-1;T.path=[];T.prog=[];T.plan='—';T.poly='0% constraints';$('#builder').className='';
  $('#phasecue').textContent=cue;await playStory(false);log(`${phase.toUpperCase()} · level ${cur.level} · ${cur.label}`);
}
async function runDemo(){
  animToken++;reset();phase='demo';await loadItem(DEMO,'👁️');$('#ghost').classList.add('show');log('ghost-hand demo · wordless');
  for(const key of DEMO.accepted[0]){const piece=[...document.querySelectorAll('.piece')].find(x=>x.dataset.key===key);await ghostTo(piece);await ghostTap();choosePiece(key,true)}
  await ghostTo($('#answers').children[DEMO.correct]);await ghostTap();chooseAnswer(DEMO.correct,true);
  await ghostTo($('#go'));await ghostTap();locked=true;renderBuilder();feedback(true);
  await sleep(450);$('#ghost').classList.remove('show');startWarmup();
}
async function startWarmup(){phase='warmup';await loadItem(WARM,'⭐')}
async function startScored(){phase='scored';await loadItem(ITEMS[T.level-1],'🎯');log(`SCORED ${scoredIndex+1}/6`)}
function finish(){phase='done';locked=true;renderBuilder();$('#phasecue').textContent='🏆';log(`DONE · ${T.correct}/${T.scored} · peak ${T.maxSolved}`);renderMeters()}
$('#palette').addEventListener('click',event=>{const piece=event.target.closest('.piece');if(piece)choosePiece(piece.dataset.key)});
$('#answers').addEventListener('click',event=>{const answerButton=event.target.closest('.answer');if(answerButton)chooseAnswer(+answerButton.dataset.i)});
$('#go').addEventListener('click',submit);
$('#replayStory').addEventListener('click',()=>{if(cur&&phase!=='demo'&&phase!=='done')playStory(true)});
$('#replayDemo').addEventListener('click',runDemo);
buildTelemetry();renderMeters();runDemo();
</script>
</body>
</html>
