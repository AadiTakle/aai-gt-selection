<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-update-01 — Last Ones In (running memory / updating)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;--tile:#232c4d;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #stage{width:440px;min-height:180px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
  #big{font-size:96px;transition:transform .12s,opacity .12s;opacity:0;transform:scale(.6)}
  #big.show{opacity:1;transform:scale(1)}
  #cue{font-size:26px;height:32px}
  .slots,.tray{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .slot{width:58px;height:58px;border-radius:12px;border:2px dashed var(--edge);display:flex;align-items:center;justify-content:center;font-size:36px;background:#141a30;cursor:pointer}
  .slot.filled{border-style:solid;border-color:var(--accent);background:var(--tile)}
  .slot.ok{border-color:var(--good)}.slot.no{border-color:var(--bad)}
  .chip{width:56px;height:56px;border-radius:12px;border:1px solid var(--edge);background:#20284a;font-size:34px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .chip:active{transform:scale(.94)}
  .counter{display:flex;align-items:center;gap:10px;background:#141a30;border:1px solid var(--edge);border-radius:12px;padding:8px 12px}
  .counter .v{font-size:26px;min-width:34px;text-align:center}
  .counter button{width:38px;height:38px;font-size:20px;padding:0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:7px 11px;background:#182042}
  .seg button.on{background:var(--warn);color:#3a2c00;font-weight:600}
  .tel{width:315px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🎞️ Last Ones In <span class="badge" id="bmode">Report the last few</span></h1>
    <p class="sub" id="task">Things stream by and stop when you least expect it. Then tap the <b>last few</b> you saw, in order.</p>
  </div>
  <div id="stage">
    <div id="big">🍎</div>
    <div id="cue">👀</div>
    <div class="slots" id="resp"></div>
  </div>
  <div class="tray" id="tray"></div>
  <div class="row">
    <div class="seg" id="modeseg">
      <button data-m="run" class="on">Last-k stream</button>
      <button data-m="count">Keep counts</button>
      <button data-m="track">Latest per bin</button>
    </div>
    <button id="submit" style="display:none">✔ Submit</button>
  </div>
  <div class="row">
    <button class="pri" id="go">▶ Watch how it works</button>
    <button id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>

<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const big=$("#big"),cue=$("#cue"),resp=$("#resp"),tray=$("#tray");
const VOCAB=["🍎","🐶","⭐","🚗","🌙","🎈"];
const CATS=[{icon:"🍏",name:"fruit",items:["🍎","🍌","🍇"]},{icon:"🐾",name:"animal",items:["🐶","🐱","🐰"]},{icon:"🌈",name:"sky",items:["⭐","🌙","☁️"]}];
const COUNT_TARGETS=["🍎","⭐"];

let mode="run", k=2, nCounters=2, streamMin=6,streamMax=9;
const T={phase:"idle",mode:"run",trial:0,k:2,
  correct:0,total:0,poly:[],firstLat:[],rt:[],revis:0,
  recencyHit:0,recencyTot:0,intrusion:0,novelErr:0,
  updateCurve:{}, log:[]};
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function med(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m;}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop();}
function render(){
  const acc=T.total?Math.round(100*T.correct/T.total):0;
  const poly=T.poly.length?Math.round(100*mean(T.poly)):0;
  const uc=Object.entries(T.updateCurve).sort().map(([load,arr])=>`${load}:${Math.round(100*mean(arr))}%`).join("  ");
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-update-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>shell</span><b>${({run:"running span",count:"symbol counter",track:"keep-track"})[T.mode]}</b></div>
  <div class="kv"><span>load (k / #bins)</span><b>${T.mode==="run"?("last "+k):("bins "+nCounters)}</b></div>
  <div class="kv"><span>trial</span><b>${T.trial}</b></div>
  <h2>Accuracy</h2>
  <div class="kv"><span>all-correct <span class="m">M-ACC</span></span><b>${acc}% <span class="m">(${T.correct}/${T.total})</span></b></div>
  <div class="kv"><span>partial credit <span class="m">M-POLY</span></span><b>${poly}%</b></div>
  <div class="kv"><span>recency (last item) <span class="m">M-SERIALPOS</span></span><b>${T.recencyTot?Math.round(100*T.recencyHit/T.recencyTot):0}%</b></div>
  <h2>Updating cost <span class="m">M-UPDATECOST</span></h2>
  <div class="kv"><span>acc by load</span><b style="font-size:11px">${uc||"—"}</b></div>
  <h2>Error type <span class="m">M-ERRTYPE</span></h2>
  <div class="kv"><span>intrusions (older item)</span><b>${T.intrusion}</b></div>
  <div class="kv"><span>novel errors</span><b>${T.novelErr}</b></div>
  <h2>Process</h2>
  <div class="kv"><span>first-move lat <span class="m">M-RTFIRST</span></span><b>${Math.round(med(T.firstLat))} ms</b></div>
  <div class="kv"><span>response CV <span class="m">M-RTVAR</span></span><b>${cv(T.rt).toFixed(2)}</b></div>
  <div class="kv"><span>revisions <span class="m">M-REV</span></span><b>${T.revis}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();

function rand(a){return a[Math.random()*a.length|0];}
function buildStream(){
  const len=streamMin+ (Math.random()*(streamMax-streamMin+1)|0);
  const s=[];
  if(mode==="track"){const cats=CATS.slice(0,nCounters);for(let i=0;i<len;i++){const c=rand(cats);s.push(rand(c.items));}}
  else {for(let i=0;i<len;i++)s.push(rand(VOCAB));}
  return s;
}
async function present(s){
  cue.textContent="👀";
  for(const e of s){big.textContent=e;big.classList.add("show");await sleep(720);big.classList.remove("show");await sleep(180);}
  big.textContent="";
}

// build response UI per mode; returns a scorer
function buildResponse(stream){
  resp.innerHTML="";tray.innerHTML="";$("#submit").style.display="none";
  if(mode==="run"){
    for(let i=0;i<k;i++){const s=document.createElement("div");s.className="slot";s.dataset.k=i;resp.appendChild(s);}
    VOCAB.forEach(e=>{const c=document.createElement("div");c.className="chip";c.textContent=e;tray.appendChild(c);});
  } else if(mode==="count"){
    COUNT_TARGETS.slice(0,nCounters).forEach((e,idx)=>{
      const c=document.createElement("div");c.className="counter";c.dataset.e=e;c.dataset.v="0";
      c.innerHTML=`<span style="font-size:30px">${e}</span><button data-d="-1">−</button><span class="v">0</span><button data-d="1">+</button>`;
      resp.appendChild(c);});
    $("#submit").style.display="inline-block";
  } else { // track: latest per bin
    CATS.slice(0,nCounters).forEach(cat=>{
      const wrap=document.createElement("div");wrap.style.cssText="display:flex;flex-direction:column;align-items:center;gap:4px";
      const lbl=document.createElement("div");lbl.style.fontSize="24px";lbl.textContent=cat.icon;
      const slot=document.createElement("div");slot.className="slot";slot.dataset.cat=cat.name;
      wrap.appendChild(lbl);wrap.appendChild(slot);resp.appendChild(wrap);
      cat.items.forEach(e=>{const c=document.createElement("div");c.className="chip";c.textContent=e;c.dataset.cat=cat.name;tray.appendChild(c);});
    });
    $("#submit").style.display="inline-block";
  }
}

let awaiting=false;
async function runTrial(scored){
  $("#go").disabled=true;$("#replay").disabled=true;
  const stream=buildStream();
  await sleep(250);await present(stream);
  cue.textContent="✋";
  buildResponse(stream);
  $("#phasehint").textContent=scored?"Answer now.":"Practice — answer now.";
  const t0=performance.now();let last=t0;awaiting=true;let firstDone=false;
  const load = mode==="run"? ("k"+k) : ("b"+nCounters);
  await new Promise(res=>{
    function firstMove(){if(!firstDone){firstDone=true;if(scored)T.firstLat.push(performance.now()-t0);}last=performance.now();}
    if(mode==="run"){
      tray.onclick=e=>{const c=e.target.closest(".chip");if(!c||!awaiting)return;
        const slot=resp.querySelector(".slot:not(.filled)");if(!slot)return;firstMove();
        slot.textContent=c.textContent;slot.classList.add("filled");
        if(scored&&T.recencyTot!==undefined){}
        if(scored)T.rt.push(performance.now()-last);
        if(![...resp.querySelectorAll(".slot")].some(s=>!s.classList.contains("filled"))){awaiting=false;res();}
        render();};
      resp.onclick=e=>{const slot=e.target.closest(".slot");if(!slot||!slot.classList.contains("filled")||!awaiting)return;
        slot.classList.remove("filled");slot.textContent="";T.revis++;render();};
    } else if(mode==="count"){
      resp.onclick=e=>{const b=e.target.closest("button");if(!b||!awaiting)return;firstMove();
        const c=b.closest(".counter");let v=Math.max(0,+c.dataset.v+ +b.dataset.d);c.dataset.v=v;c.querySelector(".v").textContent=v;
        if(scored)T.rt.push(performance.now()-last);T.revis+= (+b.dataset.d<0?1:0);render();};
      $("#submit").onclick=()=>{if(awaiting){awaiting=false;res();}};
    } else {
      tray.onclick=e=>{const c=e.target.closest(".chip");if(!c||!awaiting)return;firstMove();
        const slot=resp.querySelector(`.slot[data-cat="${c.dataset.cat}"]`);
        if(slot.classList.contains("filled"))T.revis++;
        slot.textContent=c.textContent;slot.classList.add("filled");slot.dataset.val=c.textContent;
        if(scored)T.rt.push(performance.now()-last);render();};
      $("#submit").onclick=()=>{if(awaiting){awaiting=false;res();}};
    }
  });
  tray.onclick=null;resp.onclick=null;$("#submit").onclick=null;
  // ---- score ----
  let nCorrect=0,nItems=0;
  if(mode==="run"){
    const lastK=stream.slice(-k);const slots=[...resp.querySelectorAll(".slot")];
    slots.forEach((s,i)=>{nItems++;const ok=s.textContent===lastK[i];
      if(ok){nCorrect++;s.classList.add("ok");}else{s.classList.add("no");
        if(scored){ stream.slice(0,-k).includes(s.textContent)?T.intrusion++:T.novelErr++; }}
      if(i===k-1&&scored){T.recencyTot++;if(ok)T.recencyHit++;}});
  } else if(mode==="count"){
    const counters=[...resp.querySelectorAll(".counter")];
    counters.forEach(c=>{nItems++;const truth=stream.filter(x=>x===c.dataset.e).length;const got=+c.dataset.v;
      if(got===truth){nCorrect++;c.style.borderColor="var(--good)";}else{c.style.borderColor="var(--bad)";if(scored)T.novelErr++;}});
  } else {
    CATS.slice(0,nCounters).forEach(cat=>{nItems++;
      const seen=stream.filter(x=>cat.items.includes(x));const truth=seen.length?seen[seen.length-1]:null;
      const slot=resp.querySelector(`.slot[data-cat="${cat.name}"]`);const got=slot.dataset.val||null;
      if(got===truth){nCorrect++;slot.classList.add("ok");}else{slot.classList.add("no");
        if(scored){ (got&&cat.items.includes(got))?T.intrusion++:T.novelErr++; }}});
  }
  const all=nCorrect===nItems;cue.textContent=all?"✅":"↔️";
  if(scored){T.total++;if(all)T.correct++;T.poly.push(nItems?nCorrect/nItems:0);
    (T.updateCurve[load]=T.updateCurve[load]||[]).push(nItems?nCorrect/nItems:0);
    logE(`${T.mode} ${load}: ${nCorrect}/${nItems}`);
    // adaptive: raise load when correct
    if(mode==="run")k=all?Math.min(4,k+1):Math.max(2,k-1);
    else nCounters=all?Math.min(mode==="count"?2:3,nCounters+ (all?1:0)):Math.max(1,nCounters-1);
    T.k=k;T.trial++;}
  render();await sleep(950);
  $("#go").disabled=false;$("#replay").disabled=false;cue.textContent="";resp.innerHTML="";tray.innerHTML="";$("#submit").style.display="none";
  return all;
}

// ---------- ghost-hand demo ----------
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;$("#replay").disabled=true;
  const sm=mode;mode="run";const kk=k;k=2;
  const stream=["🐶","🚗","🌙","⭐","🍎"]; // last 2 = 🍎 after ⭐ -> report ⭐,🍎
  await sleep(250);await present(stream.map(x=>x));
  cue.textContent="✋";buildResponse(stream);
  const ghost=document.createElement("div");ghost.textContent="👆";ghost.style.cssText="position:fixed;font-size:28px;z-index:9;transition:left .35s,top .35s;pointer-events:none";document.body.appendChild(ghost);
  const lastK=stream.slice(-2);
  for(let i=0;i<2;i++){
    const chip=[...tray.querySelectorAll(".chip")].find(c=>c.textContent===lastK[i]);
    const slot=resp.querySelector(".slot:not(.filled)");
    const r=chip.getBoundingClientRect();ghost.style.left=(r.left+16)+"px";ghost.style.top=(r.top+8)+"px";
    await sleep(500);slot.textContent=chip.textContent;slot.classList.add("filled","ok");await sleep(220);
  }
  cue.textContent="✅";await sleep(650);ghost.remove();
  mode=sm;k=kk;resp.innerHTML="";tray.innerHTML="";
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice one";$("#go").onclick=warmup;
  $("#phasehint").textContent="Now you try — this practice one is NOT scored.";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;

async function warmup(){T.phase="warm-up (unscored)";render();await runTrial(false);
  T.phase="idle";$("#go").textContent="▶ Start scored round";$("#go").onclick=startScored;
  $("#phasehint").textContent="These count. The load rises when you're right (harder).";render();}
let left=0;
async function startScored(){T.phase="scored";render();left=7;$("#go").disabled=true;await loop();}
async function loop(){await runTrial(true);left--;if(left>0)await loop();else finish();}
function finish(){T.phase="done";render();cue.textContent="🏁";$("#go").disabled=false;
  $("#go").textContent="▶ Another round";$("#go").onclick=startScored;
  $("#phasehint").textContent="Done. Notice accuracy dropping as load rises — that slope is the updating cost.";}

$("#modeseg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  mode=b.dataset.m;T.mode=mode;k=2;nCounters=2;[...$("#modeseg").children].forEach(x=>x.classList.toggle("on",x===b));
  $("#bmode").textContent=({run:"Report the last few",count:"Keep the counts",track:"Latest in each bin"})[mode];
  $("#task").innerHTML=({run:"Things stream by and stop when you least expect it. Then tap the <b>last few</b> you saw, in order.",
    count:"Watch the parade and keep a running <b>count</b> of the target items. Enter the totals at the end.",
    track:"Watch the parade. At the end, tap the <b>most recent</b> item you saw in each bin."})[mode];
  logE(`shell → ${mode}`);render();});
</script>
</body>
</html>
