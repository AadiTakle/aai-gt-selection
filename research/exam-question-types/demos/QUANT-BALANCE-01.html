<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUANT-BALANCE-01 — Balance Beam Equivalence</title>
<style>
:root{--bg:#0f1226;--panel:#1b2140;--panel2:#232a52;--accent:#5eead4;--accent2:#f59e0b;--good:#4ade80;--bad:#f87171;--ink:#eef1ff;--muted:#9aa3c7}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(1100px 700px at 70% -10%,#213a5e,#0f1226 60%);min-height:100vh}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1120px;margin:0 auto;padding:18px}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid #313a6b;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.phasebar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#2b336a;color:var(--muted);border:1px solid #3a447f}
.pill.on{background:var(--accent);color:#053;font-weight:700}
.prompt{text-align:center;color:var(--muted);min-height:22px;margin-bottom:4px}
.scene{position:relative;height:260px;margin:0 auto}
.fulcrum{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:74px solid #414c86}
.post{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:8px;height:78px;background:#4b568f;border-radius:4px}
.beam{position:absolute;left:50%;top:70px;width:420px;height:14px;background:linear-gradient(90deg,#7d88c9,#5a67b8);border-radius:8px;transform-origin:50% 50%;transform:translateX(-50%) rotate(0deg);transition:transform .5s cubic-bezier(.4,0,.2,1)}
.hang{position:absolute;top:12px;width:2px;height:46px;background:#8ea0ff}
.hang.l{left:34px}.hang.r{right:34px}
.pan{position:absolute;top:56px;width:130px;min-height:64px;border-radius:0 0 60px 60px;background:#2b336a;border:2px solid #4b568f;border-top:4px solid #6b78c0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px}
.pan.l{left:-30px}.pan.r{right:-30px}
.pan .content{font-size:26px;font-weight:800}
.pan .slot{display:inline-block;min-width:40px;padding:2px 8px;border-radius:8px;background:var(--accent2);color:#3a2500;border:2px dashed #fff}
.pan .cap{font-size:11px;color:var(--muted)}
.state{text-align:center;font-weight:800;margin-top:8px;min-height:24px}
.state.level{color:var(--good)}.state.tilt{color:var(--accent2)}
.controls{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px;flex-wrap:wrap}
.step{width:52px;height:48px;border-radius:12px;background:#2b336a;border:2px solid #3a447f;color:var(--ink);font-size:24px;font-weight:800;cursor:pointer}
.step:hover{border-color:var(--accent)}
.aval{font-size:30px;font-weight:800;min-width:56px;text-align:center}
.row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
button.act{font:600 15px system-ui;padding:10px 18px;border-radius:12px;border:0;cursor:pointer;background:var(--accent);color:#053}
button.act.ghost{background:#2b336a;color:var(--ink);border:1px solid #3a447f}
button.act:disabled{opacity:.4}
.fb{text-align:center;font-weight:700;min-height:26px;margin-top:8px}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.hand{position:fixed;font-size:32px;z-index:40;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:left .4s ease,top .4s ease}
.tele{font-size:13px}.tele h2{font-size:14px;margin:0 0 8px;color:var(--accent)}
.metrics{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-bottom:10px}
.metrics div:nth-child(odd){color:var(--muted)}.metrics b{font-variant-numeric:tabular-nums}
.log{height:180px;overflow:auto;background:#12172f;border:1px solid #2a336a;border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-acc{color:var(--good)}.t-err{color:var(--bad)}.t-sys{color:var(--muted)}.t-evt{color:#9fb0ff}
.legend{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <h1>Balance Beam Equivalence</h1>
    <div class="sub">Set the number so BOTH sides weigh the same and the beam is level.</div>
    <div class="phasebar" id="phasebar"></div>
    <div class="prompt" id="prompt"></div>
    <div class="scene" id="scene" style="max-width:460px">
      <div class="beam" id="beam">
        <div class="hang l"></div><div class="hang r"></div>
        <div class="pan l" id="panL"></div>
        <div class="pan r" id="panR"></div>
      </div>
      <div class="post"></div><div class="fulcrum"></div>
    </div>
    <div class="state" id="stateTxt"></div>
    <div class="controls" id="controls">
      <button class="step" id="minus">&#8722;</button>
      <div class="aval" id="aval">0</div>
      <button class="step" id="plus">&#43;</button>
    </div>
    <div class="row">
      <button class="act" id="lockBtn">Lock (level!)</button>
      <button class="act ghost" id="nextBtn" style="display:none">Next</button>
    </div>
    <div class="fb" id="fb"></div>
    <div class="hand" id="hand">&#128070;</div>
  </main>
  <aside class="card tele">
    <h2>Live telemetry</h2>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="legend">Logs M-ACC, M-EFF, M-REV, M-EXPLORE, M-PROG and proposed <b>M-EQREL</b> (relational vs operational =).</div>
  </aside>
</div>
<script>
(function(){
  "use strict";
  var el=function(id){return document.getElementById(id)};
  var beam=el('beam'),panL=el('panL'),panR=el('panR'),stateTxt=el('stateTxt'),
      aval=el('aval'),minus=el('minus'),plus=el('plus'),lockBtn=el('lockBtn'),nextBtn=el('nextBtn'),
      hand=el('hand'),fb=el('fb'),prompt=el('prompt');
  var T0=Date.now();function perf(){return Date.now()-T0;}

  var Tel={scored:0,correct:0,effSum:0,effN:0,revTotal:0,eqrel:{relational:0,operational:0,other:0},
    push:function(cls,msg){var d=document.createElement('div');d.className=cls;d.textContent='['+(perf()/1000).toFixed(2)+'s] '+msg;
      var g=el('log');g.appendChild(d);g.scrollTop=g.scrollHeight;},
    render:function(){
      var acc=Tel.scored?Math.round(100*Tel.correct/Tel.scored)+'% ('+Tel.correct+'/'+Tel.scored+')':'—';
      var eff=Tel.effN?Math.round(100*Tel.effSum/Tel.effN)+'%':'—';
      var eq=Tel.eqrel.relational+Tel.eqrel.operational+Tel.eqrel.other;
      var eqStr=eq?('rel '+Tel.eqrel.relational+' / op '+Tel.eqrel.operational+' / oth '+Tel.eqrel.other):'—';
      el('metrics').innerHTML=
        '<div>M-ACC accuracy</div><b>'+acc+'</b>'+
        '<div>M-EFF vs optimal</div><b>'+eff+'</b>'+
        '<div>M-REV dir-changes</div><b>'+Tel.revTotal+'</b>'+
        '<div>M-EQREL signature</div><b style="font-size:11px">'+eqStr+'</b>';
    }};

  // A = child's adjustable addend on the RIGHT slot. Balanced when Rbase + A == L.
  var items=[
    {phase:'demo',  L:3, Lhtml:'3', Rbase:1, Rhtml:'1', correctA:2, aStart:0},
    {phase:'warmup',L:1, Lhtml:'&#127822;', Rbase:0, Rhtml:'', correctA:1, aStart:0, apple:true},
    {phase:'scored',L:7, Lhtml:'3 + 4', Rbase:5, Rhtml:'5', correctA:2, aStart:0, eqItem:true, operational:[7,12]},
    {phase:'scored',L:8, Lhtml:'8', Rbase:5, Rhtml:'5', correctA:3, aStart:0}
  ];
  var labels={demo:'1 Watch',warmup:'2 Try',scored:'3 Balance'};
  var i=-1,cur=null,A=0,itemStart=0,answered=false,adjustCount=0,lastDir=0,dirChanges=0,seen={},firstCommit=null;

  function renderPhasebar(){el('phasebar').innerHTML=['demo','warmup','scored'].map(function(p){
    return '<span class="pill'+(cur&&cur.phase===p?' on':'')+'">'+labels[p]+'</span>';}).join('');}

  function leftTotal(){return cur.L;}
  function rightTotal(){return cur.Rbase+A;}
  function drawPans(){
    panL.innerHTML='<div class="cap">left</div><div class="content">'+cur.Lhtml+'</div>';
    var slot = cur.apple? repeatApple(A) : '<span class="slot">'+A+'</span>';
    var plus = cur.Rhtml? (cur.Rhtml+' + '):'';
    panR.innerHTML='<div class="cap">right</div><div class="content">'+plus+slot+'</div>';
  }
  function repeatApple(n){var s='';for(var k=0;k<n;k++)s+='\uD83C\uDF4E';return '<span class="slot">'+(s||'0')+'</span>';}

  function updateBeam(){
    var diff=rightTotal()-leftTotal(); // >0 right heavier -> tip right (positive rotate)
    var ang=Math.max(-16,Math.min(16, diff*4));
    beam.style.transform='translateX(-50%) rotate('+ang+'deg)';
    aval.textContent=A;
    drawPans();
    if(diff===0){stateTxt.textContent='LEVEL \u2696 ('+leftTotal()+' = '+rightTotal()+')';stateTxt.className='state level';}
    else{stateTxt.textContent=(diff>0?'right heavier':'left heavier')+' ('+leftTotal()+(diff>0?' < ':' > ')+rightTotal()+')';stateTxt.className='state tilt';}
  }

  function adjust(d){
    if(answered||cur.phase==='demo')return;
    var nA=Math.max(0,Math.min(15,A+d)); if(nA===A)return;
    A=nA; adjustCount++; seen[A]=1;
    if(d!==lastDir && lastDir!==0){dirChanges++;Tel.revTotal++;}
    lastDir=d;
    Tel.push('t-evt','set A='+A+'  (diff='+(rightTotal()-leftTotal())+')');
    updateBeam();
  }
  minus.onclick=function(){adjust(-1);};plus.onclick=function(){adjust(1);};

  lockBtn.onclick=function(){ if(answered||cur.phase==='demo')return; commit(); };

  function classifyEq(){
    if(!cur.eqItem)return null;
    if(A===cur.correctA)return 'relational';
    if(cur.operational.indexOf(A)>=0)return 'operational';
    return 'other';
  }

  function commit(){
    answered=true;
    var ok=(rightTotal()===leftTotal());
    var need=Math.abs(cur.correctA-cur.aStart), used=adjustCount;
    var eff= used>0? Math.min(1,need/used) : (ok?1:0);
    var eq=classifyEq();
    if(cur.phase==='scored'){
      Tel.scored++; if(ok)Tel.correct++;
      if(ok){Tel.effSum+=eff;Tel.effN++;}
      if(eq){Tel.eqrel[eq]++;}
      Tel.push(ok?'t-acc':'t-err','LOCK A='+A+(ok?' BALANCED':' NOT level (need '+cur.correctA+')')+
        '  EFF='+Math.round(eff*100)+'% adj='+adjustCount+' dirChg='+dirChanges+(eq?'  EQREL='+eq:''));
      if(ok)chime();
    } else {
      Tel.push('t-sys',cur.phase.toUpperCase()+': A='+A+(ok?' balanced':' not level')+' — not scored');
    }
    fb.textContent= ok? (cur.phase==='warmup'?'Balanced! Now the real ones.':'Perfectly level!') : 'Not level yet — right='+rightTotal()+', left='+leftTotal()+'.';
    fb.className='fb '+(ok?'good':'bad');
    lockBtn.disabled=true; nextBtn.style.display='inline-block'; Tel.render();
  }
  nextBtn.onclick=function(){lockBtn.disabled=false;load();};

  function load(){
    i++; if(i>=items.length)return finish();
    cur=items[i]; A=cur.aStart; answered=false; adjustCount=0; lastDir=0; dirChanges=0; seen={}; firstCommit=null;
    fb.textContent='';fb.className='fb'; nextBtn.style.display='none';
    renderPhasebar();
    prompt.textContent = cur.eqItem? 'Make both sides equal (careful — the left is 3 + 4!).' :
      (cur.phase==='demo'?'Watch the beam become level.':'Add to the right side until it is level.');
    el('controls').style.visibility = cur.phase==='demo'?'hidden':'visible';
    updateBeam();
    itemStart=perf();
    Tel.push('t-sys','LOAD '+cur.phase+' left='+cur.Lhtml.replace('&#127822;','apple')+' rightBase='+cur.Rbase+' correctA='+cur.correctA);
    Tel.render();
    if(cur.phase==='demo')ghost();
  }

  function ghost(){
    // hand taps + until level (A: 0->2)
    var steps=cur.correctA; var t=500;
    hand.style.opacity='0';
    for(var k=1;k<=steps;k++){(function(k){setTimeout(function(){
      var r=plus.getBoundingClientRect();hand.style.opacity='1';hand.style.left=(r.left+r.width/2-10)+'px';hand.style.top=(r.top+r.height/2)+'px';
      setTimeout(function(){A=k;updateBeam();Tel.push('t-sys','ghost: +1 (A='+A+')');},180);
    },t+k*650);})(k);}
    var end=t+steps*650+400;
    setTimeout(function(){var r=lockBtn.getBoundingClientRect();hand.style.left=(r.left+r.width/2-10)+'px';hand.style.top=(r.top+r.height/2)+'px';},end);
    setTimeout(function(){chime();fb.textContent='Level!';fb.className='fb good';Tel.push('t-sys','ghost: lock (level)');},end+500);
    setTimeout(function(){hand.style.opacity='0';fb.textContent='';load();},end+1500);
  }

  function chime(){try{var a=new(window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(520,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(780,a.currentTime+.16);g.gain.setValueAtTime(.1,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.32);o.start();o.stop(a.currentTime+.34);}catch(e){}}

  function finish(){
    prompt.textContent='';stateTxt.textContent='';el('controls').style.visibility='hidden';fb.textContent='';
    el('scene').innerHTML='<div style="text-align:center;padding:40px 0"><div style="font-size:44px">\u2696\uFE0F</div>'+
      '<div style="color:var(--muted)">Balanced! EQREL signature shows relational vs operational thinking.</div></div>';
    Tel.push('t-sys','SESSION complete: '+Tel.correct+'/'+Tel.scored+' scored');
  }
  window.addEventListener('blur',function(){Tel.push('t-sys','engagement: focus lost');});
  Tel.render(); load();
})();
</script>
</body>
</html>
