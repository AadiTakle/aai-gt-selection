<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUANT-BALANCE-01 · Balance Lab</title>
<style>
  :root{
    --lav:#f1ebff;--mint:#e7faf2;--ink:#30364e;--card:#fff;
    --purple:#7664ce;--green:#2ea985;--gold:#e6a844;--good:#26b879;--bad:#ef6672;
    --beam:#66708d;--tel:#111628;--tel2:#1d2440;--key:#82f4d1;--dim:#7785ae;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    min-height:100vh;display:flex;color:var(--ink);
    font:16px/1.35 ui-rounded,"Avenir Next",system-ui,sans-serif;
    background:linear-gradient(145deg,var(--lav),var(--mint));
  }
  button{font:inherit}
  #wrap{
    flex:1;min-width:0;padding:18px;display:flex;flex-direction:column;
    align-items:center;gap:12px;
  }
  #badge{
    color:#7e84a3;font-size:12px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;
  }
  #phasecue{height:42px;font-size:34px}
  #stagecard{
    width:min(820px,100%);min-height:560px;padding:22px;border-radius:32px;
    background:rgba(255,255,255,.95);box-shadow:0 25px 62px -32px #595178;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;
  }
  #examples{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:66px}
  .mini-scale{
    min-width:150px;height:62px;border-radius:18px;background:#f4f1ff;
    border:2px solid #dcd5f3;display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .mini-side{min-width:48px;display:flex;gap:3px;justify-content:center}
  .mini-beam{width:25px;height:3px;background:var(--beam);position:relative}
  .mini-beam::after{content:"";position:absolute;left:10px;top:3px;border:5px solid transparent;border-bottom:0;border-top:10px solid var(--beam)}
  #scale{width:min(590px,100%);height:230px;position:relative}
  #post{
    position:absolute;left:50%;bottom:18px;width:18px;height:150px;transform:translateX(-50%);
    border-radius:10px 10px 2px 2px;background:linear-gradient(90deg,#56617e,#7c87a4,#56617e);
  }
  #post::after{
    content:"";position:absolute;left:-52px;bottom:-12px;width:122px;height:22px;
    border-radius:50% 50% 8px 8px;background:#4f5872;
  }
  #beam{
    position:absolute;left:8%;right:8%;top:72px;height:12px;border-radius:8px;
    background:linear-gradient(#818ca9,#59637e);transform-origin:center;
    transition:transform .35s ease;
  }
  #beam::after{
    content:"";position:absolute;left:50%;top:-7px;width:25px;height:25px;
    border-radius:50%;background:var(--gold);transform:translateX(-50%);
  }
  .hanger{position:absolute;top:5px;width:38%;height:126px}
  .hanger.left{left:1%}.hanger.right{right:1%}
  .string{position:absolute;left:50%;top:0;width:3px;height:76px;background:#7b86a2}
  .pan{
    position:absolute;left:5%;right:5%;bottom:0;min-height:55px;padding:9px;
    border:4px solid #79839e;border-top:0;border-radius:8px 8px 34px 34px;
    background:#f8faff;display:flex;gap:5px;align-items:center;justify-content:center;
  }
  #rightpan{border-style:dashed;background:#f6fffb;cursor:pointer}
  #rightpan.good{border-color:var(--good);background:#eafff4}
  #rightpan.bad{border-color:var(--bad);background:#fff0f2}
  .piece{
    width:37px;height:37px;border:0;border-radius:12px;background:#fff;
    display:grid;place-items:center;font-size:28px;line-height:1;cursor:pointer;
    box-shadow:0 3px 0 #d9ddeb;
  }
  .piece.orb{color:#438bce}.piece.star{color:#e5a42d}
  .piece.diamond{color:#8a60ce}.piece.triangle{color:#35a580}
  #tray{
    min-height:70px;padding:10px 14px;border-radius:22px;background:#edf2ff;
    border:3px solid #d4dcf2;display:flex;gap:9px;align-items:center;justify-content:center;
    flex-wrap:wrap;
  }
  #tray .piece{width:48px;height:48px;font-size:34px;box-shadow:0 5px 0 #cbd4e8}
  #tray .piece.used{opacity:.18;pointer-events:none;transform:translateY(4px)}
  #controls{display:flex;gap:18px;align-items:center}
  #replay,#go{border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center}
  #replay{width:50px;height:50px;color:var(--purple);background:#eeeaff;font-size:24px}
  #go{
    width:76px;height:76px;color:#fff;font-size:34px;background:linear-gradient(145deg,var(--purple),var(--green));
    box-shadow:0 11px 26px -9px var(--purple);opacity:.34;pointer-events:none;
  }
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  .shake{animation:shake .4s}
  @keyframes shake{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
  #ghost{
    position:fixed;left:0;top:0;z-index:90;font-size:42px;opacity:0;pointer-events:none;
    filter:drop-shadow(0 3px 4px #0004);transition:transform .46s ease,opacity .2s;
  }
  #ghost.show{opacity:.94}#ghost.tap{animation:tap .34s}
  @keyframes tap{50%{scale:.78}}
  #telemetry{
    width:336px;flex:0 0 336px;background:var(--tel);color:#cbd6f8;
    display:flex;flex-direction:column;font:13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  #telemetry h3{
    margin:0;padding:13px 14px;background:var(--tel2);color:#fff;
    font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  }
  #difficulty{padding:11px 13px;border-bottom:1px solid #293351}
  .cap{display:flex;justify-content:space-between;color:#8998c1;font-size:11px}
  #dbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:7px}
  #dbar i{height:9px;border-radius:5px;background:#2b3452}
  #dbar i.on{background:linear-gradient(90deg,#82f4d1,#a894ff)}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:7px}
  .mid{color:var(--key);font-weight:800}.mval{color:#fff;text-align:right}
  .mname{grid-column:1/3;color:var(--dim);font-size:11px}
  #logwrap{border-top:1px solid #293351;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 3px;color:#8998c1;font-size:11px}
  #log{height:178px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:3px 0;border-bottom:1px dotted #26304d}#log .t{color:#6474a4}
  @media(max-width:860px){
    body{flex-direction:column}#telemetry{width:100%;flex:none;min-height:350px}
    #stagecard{min-height:520px}#scale{height:210px}.hanger{width:42%}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="wrap">
  <div id="badge">QUANT-BALANCE-01 · Balance Lab</div>
  <div id="phasecue">👁️</div>
  <section id="stagecard">
    <div id="examples"></div>
    <div id="scale">
      <div id="post"></div>
      <div id="beam">
        <div class="hanger left"><i class="string"></i><div class="pan" id="leftpan"></div></div>
        <div class="hanger right"><i class="string"></i><div class="pan" id="rightpan"></div></div>
      </div>
    </div>
    <div id="tray"></div>
    <div id="controls">
      <button id="replay" aria-label="Replay demonstration">↻</button>
      <button id="go" aria-label="Check balance">⚖</button>
    </div>
  </section>
</main>
<aside id="telemetry">
  <h3>Live telemetry · per-child</h3>
  <div id="difficulty">
    <div class="cap"><span>DIFFICULTY</span><span id="dlabel">1 / 6</span></div>
    <div id="dbar"></div>
  </div>
  <div id="mlist"></div>
  <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
</aside>
<div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ICON={orb:'●',star:'★',diamond:'◆',triangle:'▲'};
const ITEMS=[
  {w:{orb:1},examples:[],target:['orb','orb'],stock:['orb','orb','orb'],solution:['orb','orb'],max:3,relations:1,label:'direct match'},
  {w:{orb:1,star:2},examples:[[['star'],['orb','orb']]],target:['star'],stock:['orb','orb','orb'],solution:['orb','orb'],max:3,relations:1,label:'one hidden weight'},
  {w:{orb:1,star:2,diamond:3},examples:[[['star'],['orb','orb']],[['diamond'],['star','orb']]],target:['diamond','orb'],stock:['star','star','orb'],solution:['star','star'],max:2,relations:2,label:'two linked weights'},
  {w:{orb:1,star:3,diamond:5,triangle:8},examples:[[['star'],['orb','orb','orb']],[['diamond'],['star','orb','orb']],[['triangle'],['diamond','star']]],target:['triangle'],stock:['diamond','star','orb'],solution:['diamond','star'],max:2,relations:3,label:'substitution chain'},
  {w:{orb:1,star:2,diamond:4,triangle:7},examples:[[['star'],['orb','orb']],[['diamond'],['star','star']],[['triangle'],['diamond','star','orb']]],target:['triangle'],stock:['diamond','star','orb','diamond'],solution:['diamond','star','orb'],max:3,relations:3,label:'three-piece decomposition'},
  {w:{orb:1,star:3,diamond:6,triangle:10},examples:[[['star'],['orb','orb','orb']],[['diamond'],['star','star']],[['triangle'],['diamond','star','orb']]],target:['triangle','star'],stock:['diamond','diamond','star','orb','orb'],solution:['diamond','diamond','orb'],max:3,relations:4,label:'four linked constraints'}
];
const DEMO={w:{star:1},examples:[],target:['star','star'],stock:['star','star','star'],solution:['star','star'],preset:[0],max:3,relations:1,label:'matching pair'};
const WARM={w:{orb:1},examples:[],target:['orb','orb'],stock:['orb','orb','orb'],solution:['orb','orb'],max:3,relations:1,label:'matching pair'};
let phase='demo',cur=null,onPan=[],path=[],locked=true,trial=0,level=1;
const T={scored:0,correct:0,lastPoly:'—',lastPath:'—',lastPlan:'—',lastErr:'—',maxLevel:0,levels:[]};
function piece(shape,where,index){
  return `<button class="piece ${shape}" data-where="${where}" data-index="${index}" aria-label="Shape weight">${ICON[shape]}</button>`;
}
function cluster(arr){return arr.map((s,i)=>`<span class="piece ${s}" aria-hidden="true">${ICON[s]}</span>`).join('');}
function total(arr){return arr.reduce((n,s)=>n+cur.w[s],0);}
function counts(arr){return arr.reduce((o,s)=>(o[s]=(o[s]||0)+1,o),{});}
function sameLoad(a,b){
  const x=counts(a),y=counts(b);
  return Object.keys({...x,...y}).every(k=>(x[k]||0)===(y[k]||0));
}
function solutionIndices(){
  const used=new Set();
  return cur.solution.map(shape=>{
    const i=cur.stock.findIndex((s,j)=>s===shape&&!used.has(j));
    used.add(i);return i;
  });
}
function matchedRequired(){
  const have=counts(onPan.map(i=>cur.stock[i])),need=counts(cur.solution);
  return Object.keys(need).reduce((n,k)=>n+Math.min(need[k],have[k]||0),0);
}
function poly(){
  if(!cur)return 0;
  return Math.floor(cur.relations*matchedRequired()/cur.solution.length);
}
function planfulness(){
  if(!path.length)return '—';
  const useful=path.filter(x=>x.useful).length/path.length;
  return `${useful.toFixed(2)} · ${useful===1?'direct':'revising'}`;
}
function examplesHTML(){
  return cur.examples.map(e=>`<div class="mini-scale"><div class="mini-side">${cluster(e[0])}</div><i class="mini-beam"></i><div class="mini-side">${cluster(e[1])}</div></div>`).join('');
}
function renderItem(item){
  cur=item;onPan=(item.preset||[]).slice();path=[];
  $('#examples').innerHTML=examplesHTML();$('#leftpan').innerHTML=cluster(item.target);
  renderLoad();updateDifficulty();renderMeters();
}
function renderLoad(){
  const shapes=onPan.map(i=>cur.stock[i]);
  $('#rightpan').innerHTML=onPan.map(i=>piece(cur.stock[i],'pan',i)).join('')||'?';
  $('#tray').innerHTML=cur.stock.map((s,i)=>piece(s,'tray',i)).join('');
  onPan.forEach(i=>{const b=document.querySelector(`#tray .piece[data-index="${i}"]`);if(b)b.classList.add('used');});
  const delta=total(shapes)-total(cur.target);
  $('#beam').style.transform=`rotate(${Math.max(-8,Math.min(8,delta*2))}deg)`;
  $('#rightpan').className='pan';
  $('#go').classList.toggle('ready',onPan.length>0);
  renderMeters();
}
function addPiece(i,ghosted=false){
  if(locked&&!ghosted||onPan.includes(i)||onPan.length>=cur.max)return;
  const shape=cur.stock[i],before=counts(onPan.map(x=>cur.stock[x])),need=counts(cur.solution);
  onPan.push(i);path.push({a:'+',shape,useful:(before[shape]||0)<(need[shape]||0)});
  if(!ghosted)log(`add ${shape}`);renderLoad();
}
function removePiece(i){
  if(locked)return;
  const at=onPan.indexOf(i);if(at<0)return;
  const shape=cur.stock[i],need=counts(cur.solution),before=counts(onPan.map(x=>cur.stock[x]));
  onPan.splice(at,1);path.push({a:'−',shape,useful:(before[shape]||0)>(need[shape]||0)});
  log(`remove ${shape}`);renderLoad();
}
function errorType(){
  const load=onPan.map(i=>cur.stock[i]),a=total(load),b=total(cur.target);
  if(a<b)return matchedRequired()?'one-relation-only':'under-balance';
  if(a>b)return 'over-balance';
  return 'alternate-load';
}
function feedback(ok){
  $('#rightpan').classList.add(ok?'good':'bad');
  if(ok)$('#beam').style.transform='rotate(0deg)';
  else{$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),430);}
}
function submit(){
  if(locked||!onPan.length)return;
  const ok=sameLoad(onPan.map(i=>cur.stock[i]),cur.solution);
  if(phase==='warmup'){
    locked=true;feedback(ok);log(`warm-up ${ok?'balanced':'corrective placement'} · UNSCORED`);
    if(!ok)setTimeout(()=>{onPan=solutionIndices();renderLoad();feedback(true);},430);
    setTimeout(startScored,1100);return;
  }
  locked=true;T.scored++;if(ok)T.correct++;
  T.lastPoly=`${poly()} / ${cur.relations}`;
  T.lastPath=path.length?path.map(x=>x.a+x.shape[0]).join(' → '):'none';
  T.lastPlan=planfulness();T.lastErr=ok?'—':errorType();
  if(ok)T.maxLevel=Math.max(T.maxLevel,level);
  T.levels.push({trial:T.scored,level,ok});feedback(ok);
  log(`SCORED ${T.scored}/6 · L${level} · ${ok?'balanced':'miss '+T.lastErr} · poly ${T.lastPoly}`);
  level=Math.max(1,Math.min(6,level+(ok?1:-1)));updateDifficulty();renderMeters();
  setTimeout(()=>{trial++;trial<6?startScored():finish();},960);
}
function learnRate(){return T.scored?((Math.max(1,T.maxLevel)-1)/T.scored).toFixed(2)+' levels/trial':'—';}
const METERS=[
  {id:'M-ACC',name:'Exact balanced load',get:()=>T.scored?`${T.correct}/${T.scored} · ${Math.round(100*T.correct/T.scored)}%`:'—'},
  {id:'M-POLY',name:'Linked equivalence constraints',get:()=>cur?`${poly()} / ${cur.relations}`:T.lastPoly},
  {id:'M-PATH',name:'Ordered add / remove path',get:()=>path.length?path.map(x=>x.a+x.shape[0]).join(' → '):T.lastPath},
  {id:'M-PLANFUL',name:'Informative action fraction',get:()=>path.length?planfulness():T.lastPlan},
  {id:'M-ERRTYPE',name:'Balance error type',get:()=>T.lastErr},
  {id:'M-DIFFREACH',name:'Maximum relation chain solved',get:()=>T.maxLevel?`level ${T.maxLevel} / 6`:'—'},
  {id:'M-LEARNRATE',name:'Within-session ceiling growth',get:learnRate}
];
function buildMeters(){
  $('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');
  $('#dbar').innerHTML=Array.from({length:6},()=>'<i></i>').join('');
}
function renderMeters(){METERS.forEach(m=>{$('#v_'+m.id).textContent=m.get();});}
function updateDifficulty(){
  $('#dlabel').textContent=`${level} / 6`;
  [...$('#dbar').children].forEach((x,i)=>x.classList.toggle('on',i<level));
}
function log(msg){
  const d=document.createElement('div');
  d.innerHTML=`<span class="t">${new Date().toLocaleTimeString([],{minute:'2-digit',second:'2-digit'})}</span> ${msg}`;
  $('#log').appendChild(d);$('#log').scrollTop=$('#log').scrollHeight;
}
function startWarmup(){phase='warmup';locked=false;$('#phasecue').textContent='⭐';renderItem(WARM);log('warm-up · direct pair · unscored');}
function startScored(){phase='scored';locked=false;$('#phasecue').textContent='🎯';renderItem(ITEMS[level-1]);log(`item ${trial+1}/6 · level ${level} · ${cur.label}`);}
function finish(){phase='done';locked=true;$('#phasecue').textContent='🏆';$('#go').classList.remove('ready');log(`DONE · ${T.correct}/${T.scored} · ceiling ${T.maxLevel}`);}
const ghost=$('#ghost');
function ghostShow(on){ghost.classList.toggle('show',on);}
async function ghostTo(el){
  const r=el.getBoundingClientRect();
  ghost.style.transform=`translate(${r.left+r.width/2-12}px,${r.top+r.height/2-10}px)`;
  await sleep(470);
}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(330);}
async function runDemo(){
  phase='demo';locked=true;$('#phasecue').textContent='👁️';renderItem(DEMO);log('ghost-hand demo · wordless balancing');
  ghostShow(true);await sleep(260);await ghostTo($('#leftpan'));await ghostTo($('#rightpan'));
  const spare=cur.stock.findIndex((s,i)=>s==='star'&&!onPan.includes(i));
  await ghostTo(document.querySelector(`#tray .piece[data-index="${spare}"]`));await ghostTap();addPiece(spare,true);
  await ghostTo($('#go'));await ghostTap();feedback(true);await sleep(420);
  ghostShow(false);startWarmup();
}
$('#tray').addEventListener('click',e=>{const b=e.target.closest('.piece');if(b)addPiece(+b.dataset.index);});
$('#rightpan').addEventListener('click',e=>{const b=e.target.closest('.piece');if(b)removePiece(+b.dataset.index);});
$('#go').addEventListener('click',submit);
$('#replay').addEventListener('click',()=>{if(phase!=='demo')location.reload();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
