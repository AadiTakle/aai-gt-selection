<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CX-diverge-02 — What-If World</title>
<style>
  :root{--bg:#160f24;--card:#221636;--ink:#f3ecff;--muted:#b3a2d6;--acc:#c48bff;--gold:#ffd35c;--pink:#ff8ad0;}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(circle at 30% 0%,#2c1b47,#160f24)}
  header{padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  .badge{font-size:12px;color:var(--muted);border:1px solid #4a3a6b;padding:2px 8px;border-radius:999px}
  .wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:0 20px 30px;max-width:1100px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .stage{background:var(--card);border-radius:18px;padding:18px;min-height:460px;position:relative;overflow:hidden}
  .phaseTag{position:absolute;top:12px;right:14px;font-size:12px;color:var(--gold);background:#3a2a17;border:1px solid #6b4f1f;padding:3px 10px;border-radius:999px}
  .premise{text-align:center;font-size:20px;font-weight:800;margin:6px 0 2px;color:var(--gold)}
  .world{font-size:64px;text-align:center;margin:2px 0}
  .prompt{text-align:center;color:var(--muted);min-height:22px}
  .entry{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
  input[type=text]{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid #4a3a6b;background:#160f24;color:var(--ink);width:min(340px,70vw)}
  button{font:inherit;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600}
  .add{background:var(--acc);color:#1a0a2b}
  .ghost-btn{background:#37275a;color:#e9dcff}
  .modeToggle{position:absolute;top:12px;left:14px;display:flex;gap:6px}
  .modeToggle button{padding:6px 10px;font-size:13px;background:#2a1c44;color:#d9c9ff;border:1px solid #4a3a6b}
  .modeToggle button.on{background:var(--acc);color:#1a0a2b}
  .palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
  .palette div{font-size:13px;background:#160f24;border:1px solid #4a3a6b;border-radius:12px;padding:6px 8px;cursor:pointer;display:flex;gap:5px;align-items:center}
  .palette div span{font-size:22px}
  .field{position:relative;height:210px;margin-top:8px;border-top:1px dashed #4a3a6b}
  .bubble{position:absolute;bottom:0;background:#160f24;border:2px solid var(--acc);color:var(--ink);padding:6px 12px;border-radius:14px;animation:rise 6s linear forwards;white-space:nowrap;font-size:14px}
  .bubble .cat{font-size:10px;color:var(--pink);display:block;text-align:center}
  @keyframes rise{0%{transform:translateY(0) scale(.9);opacity:0}12%{opacity:1;transform:translateY(-10px) scale(1)}100%{transform:translateY(-200px);opacity:.12}}
  .combo{position:absolute;bottom:8px;left:14px;font-weight:800;color:var(--gold);font-size:18px}
  .ghost{position:absolute;font-size:38px;pointer-events:none;transition:left .8s ease,top .8s ease;z-index:6;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
  .tele{background:#160f24;border:1px solid #3a2c5b;border-radius:18px;padding:14px;height:fit-content;position:sticky;top:12px}
  .tele h3{margin:0 0 8px;font-size:14px;letter-spacing:.5px;color:var(--gold)}
  .metrics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:12px;background:#221636;border:1px solid #4a3a6b;border-radius:8px;padding:4px 8px}
  .chip b{color:var(--gold)}
  .log{font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#cdb8f0;max-height:210px;overflow:auto;background:#0f0a1c;border-radius:10px;padding:8px}
  .log div{border-bottom:1px solid #241a3a;padding:1px 0}
  .note{font-size:11px;color:var(--muted);margin-top:8px}
  .cta{display:flex;gap:10px;justify-content:center;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>🌈 What-If World</h1>
  <span class="badge">CX-diverge-02</span>
  <span class="badge">bands: 2–3 · 4–5 · 6–8</span>
  <span class="badge">divergent thinking · consequences</span>
</header>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="modeToggle" id="modeToggle" style="display:none">
      <button id="mText" class="on">Aa type</button>
      <button id="mPic">🖼️ tap</button>
    </div>
    <div class="phaseTag" id="phaseTag">demo</div>
    <div class="premise" id="premise">What if…?</div>
    <div class="world" id="world">✨</div>
    <div class="prompt" id="prompt"></div>
    <div class="entry" id="entry" style="display:none">
      <input type="text" id="idea" placeholder="what would happen…" autocomplete="off">
      <button class="add" id="addBtn">Poof! →</button>
    </div>
    <div class="palette" id="palette" style="display:none"></div>
    <div class="field" id="field"><div class="combo" id="combo"></div></div>
    <div class="ghost" id="ghost" style="display:none">👆</div>
    <div class="cta" id="cta"></div>
  </div>
  <div class="tele">
    <h3>LIVE TELEMETRY</h3>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="note">M-IDEAFLU (outcome count) · M-FLEX (different domains) · M-ORIG (rare vs common) · M-ELAB (words/idea) · M-RTFIRST (latency to first idea) · M-ENGAGE (focus).</div>
  </div>
</div>
<script>
const T={ev:[],m:{},t0:performance.now(),
  now(){return Math.round(performance.now()-this.t0)},
  log(a,d){const t=this.now();this.ev.push(Object.assign({t,a},d||{}));
    const el=document.getElementById('log');const line=document.createElement('div');
    line.textContent='+'+(t/1000).toFixed(2)+'s  '+a+(d?'  '+JSON.stringify(d):'');el.prepend(line);},
  set(k,v){this.m[k]=v;this.render();},
  render(){document.getElementById('metrics').innerHTML=
    Object.entries(this.m).map(([k,v])=>'<span class="chip"><b>'+k+'</b> '+v+'</span>').join('');}};
const $=s=>document.querySelector(s);
const field=$('#field'),ghost=$('#ghost'),phaseTag=$('#phaseTag');

/* consequence-domain dictionary (weather/people/animals/food/feelings/world) */
const CATS={
  weather:['rain','snow','sky','cloud','storm','sun','wet','flood','wind','ice','fog'],
  people:['kid','people','dentist','doctor','mom','dad','teacher','everyone','baby','person','friend','hair'],
  animals:['dog','cat','bird','bug','ant','fish','animal','worm','bee','pet','mouse'],
  food:['eat','candy','sweet','sugar','tooth','teeth','cavity','sticky','tummy','sick','chew','lick'],
  feelings:['happy','sad','scared','excited','worried','love','cry','laugh','afraid','fun'],
  world:['house','street','road','car','ground','pile','cover','everywhere','stuck','mountain','roof','float']};
function categorize(txt){const t=txt.toLowerCase();
  for(const c in CATS){if(CATS[c].some(k=>t.includes(k)))return c;}return 'new-idea';}

const PROMPTS={
  demo:{premise:'What if it rained CANDY forever?',world:'🍬'},
  warm:{premise:'What if dogs could talk?',world:'🐶',common:['bark','talk','say','woof','tell']},
  item:{premise:'What if it rained CANDY forever?',world:'🍬',
        common:['eat','eat candy','sticky','happy','candy everywhere','sweet','lots of candy']}
};
const PIC_IDEAS=[['🦷','toothaches everywhere','food'],['🚗','cars get stuck','world'],['🐜','ants take over','animals'],
  ['🩺','dentists get rich','people'],['🌊','sticky candy floods','weather'],['😱','people run inside','feelings'],
  ['🏠','roofs made of candy','world'],['🐦','birds get sick','animals'],['😀','kids never sad','feelings'],
  ['🧹','no one can clean up','people']];

let ideas=[],cats=new Set(),orig=0,words=0,combo=0,cur=null,scored=false,startT=0,firstT=null;
T.set('phase','demo');T.set('ideas_M-IDEAFLU',0);T.set('domains_M-FLEX',0);T.set('original_M-ORIG',0);
T.set('avg_words_M-ELAB','0');T.set('firstIdea_M-RTFIRST','—');

function addIdea(txt,cat){
  txt=txt.trim();if(!txt)return;
  const norm=txt.toLowerCase();
  if(ideas.some(i=>i.norm===norm)){T.log('duplicate_ignored',{txt});flash('#ff6b8a');return;}
  cat=cat||categorize(txt);
  const isOrig=scored?!cur.common.some(c=>norm.includes(c)):true;
  const w=txt.split(/\s+/).length;
  const rel=T.now()-startT;
  ideas.push({txt,norm,cat,isOrig,w,t:rel});
  const newCat=!cats.has(cat);cats.add(cat);
  if(scored){
    if(firstT===null){firstT=rel;T.set('firstIdea_M-RTFIRST',(firstT/1000).toFixed(2)+'s');T.log('first_idea (M-RTFIRST)',{ms:firstT});}
    if(isOrig)orig++;words+=w;
    if(newCat){combo++;$('#combo').textContent='🔥 x'+combo+' new kind!';}else{$('#combo').textContent='';}
    T.set('ideas_M-IDEAFLU',ideas.length);T.set('domains_M-FLEX',cats.size);
    T.set('original_M-ORIG',orig);T.set('avg_words_M-ELAB',(words/ideas.length).toFixed(1));
  }
  T.log(scored?'outcome':'warmup_outcome',{txt,domain:cat,rare:isOrig,words:w});
  bubble(txt,cat,isOrig);
}
function bubble(txt,cat,isOrig){
  const b=document.createElement('div');b.className='bubble';
  b.style.left=(8+Math.random()*72)+'%';
  b.style.borderColor=isOrig?'var(--gold)':'var(--acc)';
  b.innerHTML=(isOrig?'⭐ ':'')+txt+'<span class="cat">'+cat+'</span>';
  field.appendChild(b);setTimeout(()=>b.remove(),6000);
}
function flash(c){$('#idea').style.borderColor=c;setTimeout(()=>$('#idea').style.borderColor='',400);}

function setScene(p){$('#premise').textContent=p.premise;$('#world').textContent=p.world;}

/* ---- flow ---- */
function runGhost(){
  phaseTag.textContent='demo';setScene(PROMPTS.demo);ghost.style.display='block';
  const demos=[['a giant candy mountain','world'],['kids dance with joy','feelings'],['a worried dentist','people']];
  let i=0;ghost.style.left='50%';ghost.style.top='62%';
  const step=()=>{if(i>=demos.length){ghost.style.display='none';startWarm();return;}
    ghost.style.left=(28+i*20)+'%';ghost.style.top=(58-i*4)+'%';
    setTimeout(()=>{bubble(demos[i][0],demos[i][1],true);i++;setTimeout(step,1500);},700);};
  setTimeout(step,700);
}
function startWarm(){
  scored=false;cur=PROMPTS.warm;phaseTag.textContent='warm-up (practice)';setScene(cur);
  $('#prompt').textContent='Practice: what would happen? (not scored)';
  $('#entry').style.display='flex';$('#modeToggle').style.display='flex';
  T.set('phase','warm-up');T.log('phase_warmup');
  let count=0;const onAdd=()=>{count++;if(count>=2){$('#cta').innerHTML='<button class="add" onclick="startItem()">I\'m ready → real one</button>';}};
  bindEntry(onAdd);
}
function startItem(){
  ideas=[];cats=new Set();orig=0;words=0;combo=0;scored=true;cur=PROMPTS.item;startT=T.now();firstT=null;
  phaseTag.textContent='scored';$('#cta').innerHTML='';$('#combo').textContent='';setScene(cur);
  $('#prompt').innerHTML='<b>What would happen?</b> Say many different <i>kinds</i> of things!';
  T.set('phase','scored');T.set('ideas_M-IDEAFLU',0);T.set('domains_M-FLEX',0);T.set('original_M-ORIG',0);
  T.set('firstIdea_M-RTFIRST','—');T.log('phase_scored',{premise:cur.premise});
  bindEntry(()=>{});
  $('#cta').innerHTML='<button class="ghost-btn" onclick="finish()">Done → results</button>';
}
function bindEntry(onAdd){
  $('#addBtn').onclick=()=>{const v=$('#idea').value;if(v.trim()){addIdea(v);$('#idea').value='';onAdd();}};
  $('#idea').onkeydown=e=>{if(e.key==='Enter'){$('#addBtn').click();}};
  $('#idea').oninput=()=>{if(!$('#idea').dataset.f){$('#idea').dataset.f=1;T.log('first_keystroke');}};
  const pal=$('#palette');pal.innerHTML='';
  PIC_IDEAS.forEach(([emo,label,cat])=>{const d=document.createElement('div');
    d.innerHTML='<span>'+emo+'</span>'+label;d.title=label;
    d.onclick=()=>{addIdea(label,cat);onAdd();};pal.appendChild(d);});
  $('#mText').onclick=()=>{$('#mText').classList.add('on');$('#mPic').classList.remove('on');$('#entry').style.display='flex';pal.style.display='none';T.log('mode_text');};
  $('#mPic').onclick=()=>{$('#mPic').classList.add('on');$('#mText').classList.remove('on');$('#entry').style.display='none';pal.style.display='flex';T.log('mode_picture');};
}
function finish(){
  T.log('SESSION_END',{fluency:ideas.length,flexibility:cats.size,originality:orig,
    avg_words:+(words/(ideas.length||1)).toFixed(1),first_idea_ms:firstT});
  $('#prompt').innerHTML='<b style="color:var(--gold);font-size:20px">Wild imagination! 🎉</b>';
  $('#entry').style.display='none';$('#palette').style.display='none';$('#modeToggle').style.display='none';
  $('#combo').textContent='';
  $('#prompt').innerHTML+='<div class="note">Fluency '+ideas.length+' · '+cats.size+' domains · '+orig+
    ' rare outcomes · '+(words/(ideas.length||1)).toFixed(1)+' words/idea'+(firstT!==null?' · first idea '+(firstT/1000).toFixed(2)+'s':'')+
    '. <b>Domain-spanning</b> and <b>rare-but-fitting</b> consequences are the least-coachable tail signals.</div>';
  $('#cta').innerHTML='<button class="add" onclick="location.reload()">↺ Play again</button>';
  T.set('phase','done');
}
window.addEventListener('blur',()=>T.log('off_task_blur (M-ENGAGE)'));
runGhost();
</script>
</body>
</html>
