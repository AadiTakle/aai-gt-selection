<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-retrocue-01 — Late Whistle (retro-cue selective working memory)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;
    --accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
  h1{font-size:19px;margin:.2rem 0}
  .sub{color:var(--mut);font-size:13px;margin:0 0 6px;text-align:center;max-width:520px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--accent);font-size:12px}
  #stage{position:relative;width:420px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .grid{display:grid;grid-template-columns:repeat(4,74px);grid-template-rows:repeat(4,74px);gap:8px}
  .cell{border-radius:14px;background:#10152a;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;cursor:default;transition:transform .08s}
  .cell.live{cursor:pointer}
  .cell.live:active{transform:scale(.94)}
  .dot{width:48px;height:48px;border-radius:50%;box-shadow:0 0 12px currentColor}
  .cell.sel{outline:3px solid var(--warn);outline-offset:-3px}
  .cell.hit{outline:3px solid var(--good);outline-offset:-3px}
  .cell.miss{outline:3px dashed var(--good);outline-offset:-3px}
  .cell.fa{outline:3px solid var(--bad);outline-offset:-3px}
  #whistle{min-height:52px;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
  #whistle .flag{width:34px;height:34px;border-radius:8px;box-shadow:0 0 12px currentColor}
  #ghost{position:absolute;font-size:28px;left:0;top:0;transition:left .42s cubic-bezier(.5,0,.3,1),top .42s cubic-bezier(.5,0,.3,1);pointer-events:none;filter:drop-shadow(0 3px 3px #0008);z-index:9;opacity:0}
  #cue{font-size:26px;height:32px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:9px 16px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:330px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}
  .kv .m{color:var(--mut);font-size:10px}
  .note{font-size:10px;color:var(--mut);margin-top:6px}
  .log{margin-top:6px;max-height:140px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🔦 Late Whistle <span class="badge" id="lvl">3 lights</span></h1>
    <p class="sub">Colored fireflies land, then fly away. ONLY AFTER they are gone does a flag say which color to tap back — so you must remember them ALL, then pick out just that color. Take your time: it is not a speed game.</p>
  </div>
  <div id="stage">
    <div class="grid" id="grid"></div>
    <div id="whistle"></div>
    <div id="ghost">👆</div>
  </div>
  <div id="cue">👀</div>
  <div class="row">
    <button class="pri" id="go">▶ Watch how it works</button>
    <button id="done" style="display:none">✓ Done</button>
  </div>
  <p class="sub" id="hint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const stage=$("#stage"),ghost=$("#ghost"),cue=$("#cue"),gridEl=$("#grid"),whistleEl=$("#whistle");
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.rate=.98;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const NCELL=16;
const COLORS=[{k:"red",c:"#ff6b8a"},{k:"blue",c:"#5cc8ff"},{k:"green",c:"#5ce39a"},{k:"yellow",c:"#ffd166"},{k:"purple",c:"#b18cff"}];
const cmap=Object.fromEntries(COLORS.map(c=>[c.k,c.c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
let cells=[]; // {color:key|null}
const T={phase:"idle",setN:3,trials:0,cleanCued:0,maxSpan:0,
  cuedItemAcc:[],allItemAcc:[],err:{intrusion:0,omission:0,swap:0},revs:0,firstRT:[],consist:{},log:[]};
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function consistency(){let p=0,ag=0;for(const k in T.consist){const a=T.consist[k];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){p++;if(a[i]===a[j])ag++;}}return p?Math.round(100*ag/p):"—";}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>50)T.log.pop();}
function render(){
  const cAcc=Math.round(100*mean(T.cuedItemAcc)),aAcc=Math.round(100*mean(T.allItemAcc));
  const benefit=(T.cuedItemAcc.length&&T.allItemAcc.length)?(cAcc-aAcc):null;
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-retrocue-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>trials</span><b>${T.trials}</b></div>
  <h2>Capacity (accuracy, not speed)</h2>
  <div class="kv"><span>cued-subset span <span class="m">M-SPAN</span></span><b>${T.maxSpan||"—"} lights</b></div>
  <div class="kv"><span>cued-report accuracy <span class="m">M-ACC</span></span><b>${T.cuedItemAcc.length?cAcc+"%":"—"}</b></div>
  <div class="kv"><span>report-all accuracy <span class="m">M-ACC</span></span><b>${T.allItemAcc.length?aAcc+"%":"—"}</b></div>
  <div class="kv"><span>retro-cue benefit</span><b>${benefit===null?"—":(benefit>=0?"+":"")+benefit+" pts"}</b></div>
  <div class="kv"><span>consistency <span class="m">M-CONSIST</span></span><b>${consistency()}${consistency()==="—"?"":"%"}</b></div>
  <h2>Error grain <span class="m">M-ERRTYPE</span></h2>
  <div class="kv"><span>intrusion (wrong color)</span><b>${T.err.intrusion}</b></div>
  <div class="kv"><span>omission (missed a light)</span><b>${T.err.omission}</b></div>
  <div class="kv"><span>de-selects <span class="m">M-REV</span></span><b>${T.revs}</b></div>
  <div class="kv"><span>select latency <span class="m">M-RTFIRST</span></span><b>${Math.round(mean(T.firstRT))} ms</b></div>
  <div class="note">The cue arrives AFTER the array is gone, so the benefit isolates INTERNAL attention (selecting inside memory), not perceptual filtering at encoding. Higher cued span with few intrusions = strong within-WM selection.</div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
function drawEmpty(live){gridEl.innerHTML="";cells.forEach((c,i)=>{const d=document.createElement("div");d.className="cell"+(live?" live":"");d.dataset.i=i;gridEl.appendChild(d);});}
function drawDots(){gridEl.querySelectorAll(".cell").forEach((el,i)=>{el.innerHTML=cells[i].color?`<div class="dot" style="background:${cmap[cells[i].color]};color:${cmap[cells[i].color]}"></div>`:"";});}
render();drawEmpty(false);
function centerOf(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2};}
function place(setN){
  cells=Array.from({length:NCELL},()=>({color:null}));
  const idx=shuffle([...Array(NCELL).keys()]).slice(0,setN);
  // ensure the eventual cue color has >=2 members when possible
  const pal=shuffle([...COLORS]);
  idx.forEach((ci,j)=>{cells[ci].color=pal[j%Math.max(2,Math.min(pal.length,Math.ceil(setN/2)))].k;});
  return idx;
}
function cueColorFrom(){const cnt={};cells.forEach(c=>{if(c.color)cnt[c.color]=(cnt[c.color]||0)+1;});
  const cand=Object.keys(cnt);cand.sort((a,b)=>cnt[b]-cnt[a]);return cand[0];}
let cur=null;
function collectResponse(correctSet,label){
  return new Promise(res=>{
    drawEmpty(true);const sel=new Set();let t0=performance.now(),firstDone=false;
    $("#done").style.display="";$("#done").disabled=false;
    function onCell(e){const el=e.target.closest(".cell.live");if(!el)return;const i=+el.dataset.i;
      if(!firstDone){firstDone=true;if(cur&&cur.scored)T.firstRT.push(performance.now()-t0);}
      if(sel.has(i)){sel.delete(i);el.classList.remove("sel");if(cur&&cur.scored)T.revs++;}
      else{sel.add(i);el.classList.add("sel");}
    }
    gridEl.addEventListener("click",onCell);
    $("#done").onclick=()=>{gridEl.removeEventListener("click",onCell);$("#done").style.display="none";
      const cset=new Set(correctSet);let hits=0,fa=0;
      cset.forEach(i=>{if(sel.has(i))hits++;});
      sel.forEach(i=>{if(!cset.has(i))fa++;});
      const miss=cset.size-hits;
      // paint feedback
      gridEl.querySelectorAll(".cell").forEach(el=>{const i=+el.dataset.i;el.classList.remove("sel");
        if(cset.has(i)&&sel.has(i))el.classList.add("hit");
        else if(cset.has(i))el.classList.add("miss");
        else if(sel.has(i))el.classList.add("fa");});
      // show what colors had been there (ghost recall aid on feedback)
      res({hits,fa,miss,size:cset.size});
    };
  });
}
async function runTrial(scored,forceAll){
  const setN=T.setN;const reportAll=forceAll||(T.trials%3===2);
  cur={scored,setN,reportAll};
  const idx=await showArrayReturn(setN);
  let correctSet,label,cueColor=null;
  if(reportAll){correctSet=idx;label="Tap ALL the spots that had a light.";whistleEl.innerHTML=`<span>🎏</span> Tap ALL the spots`;say("Tap all the spots that had a light.");}
  else{cueColor=cueColorFrom();correctSet=[];cells.forEach((c,i)=>{if(c.color===cueColor)correctSet.push(i);});
    whistleEl.innerHTML=`<span class="flag" style="background:${cmap[cueColor]};color:${cmap[cueColor]}"></span> Tap the <b style="color:${cmap[cueColor]}">${cueColor}</b> ones`;say("Tap the "+cueColor+" ones.");}
  cue.textContent="👆";
  const r=await collectResponse(correctSet,label);
  const clean=(r.hits===r.size&&r.fa===0);
  const acc=r.size?r.hits/r.size - 0.5*r.fa/Math.max(1,r.size):0;
  if(scored){
    T.trials++;
    if(reportAll)T.allItemAcc.push(Math.max(0,acc)); else T.cuedItemAcc.push(Math.max(0,acc));
    (T.consist[setN+(reportAll?"a":"c")]=T.consist[setN+(reportAll?"a":"c")]||[]).push(clean?1:0);
    if(r.fa>0)T.err.intrusion+=r.fa; if(r.miss>0)T.err.omission+=r.miss;
    if(!reportAll&&clean){T.cleanCued++;if(setN>T.maxSpan)T.maxSpan=setN;}
    logE(`${reportAll?"ALL":"cue"} n${setN} hit${r.hits}/${r.size} fa${r.fa} ${clean?"CLEAN":""}`);
    if(!reportAll)T.setN=clean?Math.min(8,T.setN+1):Math.max(2,T.setN-1);
  }
  $("#lvl").textContent=T.setN+" lights";
  render();await sleep(1100);
}
async function showArrayReturn(setN){const idx=place(setN);drawEmpty(false);drawDots();cue.textContent="🔦";
  say("");await sleep(400+230*setN);gridEl.querySelectorAll(".cell").forEach(el=>el.innerHTML="");cue.textContent="…";await sleep(750);return idx;}
async function ghostTap(i){ghost.style.opacity="1";const el=gridEl.querySelectorAll(".cell")[i];const c=centerOf(el);ghost.style.left=(c.x-12)+"px";ghost.style.top=(c.y-6)+"px";await sleep(460);el.classList.add("sel");}
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;
  cells=Array.from({length:NCELL},()=>({color:null}));
  const spots=[1,6,9];const cols=["red","blue","red"];spots.forEach((s,j)=>cells[s].color=cols[j]);
  drawEmpty(false);drawDots();cue.textContent="🔦";await sleep(1500);
  gridEl.querySelectorAll(".cell").forEach(el=>el.innerHTML="");cue.textContent="…";await sleep(800);
  whistleEl.innerHTML=`<span class="flag" style="background:${cmap.red};color:${cmap.red}"></span> Tap the <b style="color:${cmap.red}">red</b> ones`;say("Now... tap the red ones.");
  drawEmpty(true);cue.textContent="👆";await sleep(600);
  await ghostTap(1);await sleep(250);await ghostTap(9);await sleep(250); // the two red spots
  cue.textContent="✅";gridEl.querySelectorAll(".cell")[1].classList.add("hit");gridEl.querySelectorAll(".cell")[9].classList.add("hit");await sleep(1200);
  ghost.style.opacity="0";whistleEl.innerHTML="";drawEmpty(false);
  $("#go").disabled=false;$("#go").textContent="▶ Try a practice one";$("#go").onclick=warmup;
  T.phase="idle";$("#hint").textContent="See? The flag came AFTER the lights left — so hold them all, then pick the color. Now you try (not scored).";render();
}
$("#go").onclick=demo;
async function warmup(){$("#go").disabled=true;T.phase="warm-up (unscored)";render();T.setN=3;
  await runTrial(false,false);
  T.phase="idle";$("#go").disabled=false;$("#go").textContent="▶ Start scored rounds";$("#go").onclick=startScored;
  $("#hint").textContent="Great! Next ones count. Get a color exactly right and one more light is added.";render();}
let left=0;
async function startScored(){$("#go").disabled=true;$("#go").style.display="none";T.phase="scored";T.setN=3;render();left=9;await loop();}
async function loop(){if(left<=0){finish();return;}await runTrial(true,false);left--;if(left>0)await loop();else finish();}
function finish(){T.phase="done";cue.textContent="🏁";whistleEl.innerHTML="";$("#go").style.display="";$("#go").disabled=false;$("#go").textContent="▶ Run another block";$("#go").onclick=startScored;
  $("#hint").textContent=`Done. Cued-subset span ${T.maxSpan} lights. Intrusions (tapping a wrong color) show binding failures inside memory.`;render();}
</script>
</body>
</html>
