<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-FILTER-01 · Star Filter</title>
<style>
  :root{--bg1:#1a1030;--bg2:#100b24;--ink:#ece6ff;--card:#1d1740;--accent:#b78dff;--good:#22b573;--bad:#ff6b6b;--cell:#241c4a;--tel-bg:#0a0f1e;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(circle at 25% 15%,var(--bg2),var(--bg1));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#b19be0;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px}
  #stagecard{background:var(--card);border-radius:26px;padding:24px;box-shadow:0 18px 50px -22px #000;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:520px;width:100%}
  #cueSwatch{width:60px;height:60px;border-radius:50%;display:none;box-shadow:0 0 24px 6px #ffffff33}
  #grid{display:grid;grid-template-columns:repeat(4,68px);grid-template-rows:repeat(4,68px);gap:8px}
  .cell{background:var(--cell);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:default;transition:.15s;box-shadow:inset 0 0 0 2px #362a5e}
  .cell.pick{cursor:pointer}
  .cell.sel{box-shadow:inset 0 0 0 4px #fff}
  .cell.correct{box-shadow:inset 0 0 0 4px var(--good)}
  .cell.wrong{box-shadow:inset 0 0 0 4px var(--bad)}
  #done{font:inherit;border:0;cursor:pointer;border-radius:20px;background:var(--accent);color:#1d1740;font-weight:700;padding:10px 26px;opacity:.4;pointer-events:none;transition:.2s}
  #done.ready{opacity:1;pointer-events:auto}
  #diffwrap{width:100%;max-width:340px}
  #diffbar{height:8px;background:#241c4a;border-radius:5px;overflow:hidden}
  #difffill{height:100%;background:linear-gradient(90deg,#7fffcf,#b78dff);width:20%;transition:.3s}
  #difflabel{font-size:11px;color:#7183b8;text-align:center;margin-top:4px;letter-spacing:.05em}
  button.round{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #replay{width:50px;height:50px;background:#241c4a;color:var(--accent);font-size:22px}
  .shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;transition:transform .5s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
  #ghost.show{opacity:.95}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#141e38;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #1c2745;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:210px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #1c2745}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-FILTER-01 · Star Filter</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="cueSwatch"></div>
      <div id="grid"></div>
      <button id="done">DONE</button>
      <div id="diffwrap"><div id="diffbar"><div id="difffill"></div></div><div id="difflabel">TARGETS 2</div></div>
      <button class="round" id="replay" title="replay demo">↻</button>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const last=a=>a[a.length-1];
const NC=16;
const COLORS=['#ff6b6b','#ffd166','#7fd858','#5b9dff','#c77bff','#40e0d0'];
function zScore(p){p=Math.min(0.995,Math.max(0.005,p));const a1=-3.969683028665376e+01,a2=2.209460984245205e+02,a3=-2.759285104469687e+02,a4=1.383577518672690e+02,a5=-3.066479806614716e+01,a6=2.506628277459239e+00;
  const b1=-5.447609879822406e+01,b2=1.615858368580409e+02,b3=-1.556989798598866e+02,b4=6.680131188771972e+01,b5=-1.328068155288572e+01;
  const c1=-7.784894002430293e-03,c2=-3.223964580411365e-01,c3=-2.400758277161838e+00,c4=-2.549732539343734e+00,c5=4.374664141464968e+00,c6=2.938163982698783e+00;
  const d1=7.784695709041462e-03,d2=3.224671290700398e-01,d3=2.445134137142996e+00,d4=3.754408661907416e+00;
  const plow=0.02425;let q,r;
  if(p<plow){q=Math.sqrt(-2*Math.log(p));return(((((c1*q+c2)*q+c3)*q+c4)*q+c5)*q+c6)/((((d1*q+d2)*q+d3)*q+d4)*q+1);}
  else if(p<=1-plow){q=p-0.5;r=q*q;return(((((a1*r+a2)*r+a3)*r+a4)*r+a5)*r+a6)*q/(((((b1*r+b2)*r+b3)*r+b4)*r+b5)*r+1);}
  q=Math.sqrt(-2*Math.log(1-p));return -(((((c1*q+c2)*q+c3)*q+c4)*q+c5)*q+c6)/((((d1*q+d2)*q+d3)*q+d4)*q+1);}

function buildGrid(){const g=$('#grid');g.innerHTML='';for(let i=0;i<NC;i++){const d=document.createElement('div');d.className='cell';d.dataset.i=i;g.appendChild(d);}}
function cellEl(i){return $('#grid').children[i];}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function clearGrid(){$$('.cell').forEach(c=>{c.style.background='';c.textContent='';c.classList.remove('sel','pick','correct','wrong');});}

/* ---------- telemetry ---------- */
let level=2,maxLevel=0;
const T={scored:0,exact:0,hits:0,tgtCells:0,fas:0,nonTgtCells:0,rts:[],revisions:0,extraTaps:[],blurMs:0};
document.addEventListener('visibilitychange',()=>{if(document.hidden)T._blurStart=Date.now();else if(T._blurStart){T.blurMs+=Date.now()-T._blurStart;T._blurStart=0;}});
function dprime(){if(!T.tgtCells||!T.nonTgtCells)return '\u2014';const hr=T.hits/T.tgtCells,far=T.fas/T.nonTgtCells;const d=zScore(hr)-zScore(far);return isFinite(d)?d.toFixed(2):'\u2014';}
const METERS=[
 {id:'M-ACC',name:'Item accuracy (exact set match)',get:()=>T.scored?`${T.exact}/${T.scored}  ${Math.round(100*T.exact/T.scored)}%`:'\u2014'},
 {id:'M-RT',name:'Response time (submit)',get:()=>T.rts.length?`${last(T.rts)} ms (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-DPRIME',name:'Signal-detection sensitivity (d\u2032)',get:()=>dprime()},
 {id:'M-UPDATECOST',name:'Updating cost (extra taps)',get:()=>T.extraTaps.length?`${mean(T.extraTaps)} extra/trial`:'\u2014'},
 {id:'M-SPAN',name:'Current target count',get:()=>`${level}`},
 {id:'M-REV',name:'Revisions (deselections)',get:()=>`${T.revisions}`},
 {id:'M-FALSEALARM',name:'False-alarm rate',get:()=>T.nonTgtCells?`${T.fas}/${T.nonTgtCells}  ${Math.round(100*T.fas/T.nonTgtCells)}%`:'\u2014'},
 {id:'M-ENGAGE',name:'Engagement (off-task time)',get:()=>T.blurMs?`${T.blurMs} ms blurred`:'0 ms \u00b7 engaged'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
let tStart=Date.now();
function log(msg){const t=Date.now()-tStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
function setDiff(){const pct=Math.min(100,Math.round((level-2)/5*100));$('#difffill').style.width=pct+'%';$('#difflabel').textContent='TARGETS '+level;}
function setCue(i){$('#phasecue').textContent=i;}

/* ---------- ghost ---------- */
const ghost=$('#ghost');function ghostShow(v){ghost.classList.toggle('show',v);}
async function ghostTo(el){const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(480);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(400);}

/* ---------- trial logic ---------- */
let phase='demo',locked=true,targetCells=[],distractCells=[],targetColor='',sel=[],tapCount=0,submitStart=0;
function pickCells(n,used){const pool=[];for(let i=0;i<NC;i++)if(!used.has(i))pool.push(i);const out=[];for(let k=0;k<n;k++){const idx=Math.floor(Math.random()*pool.length);out.push(pool.splice(idx,1)[0]);}return out;}
async function runTrial(nt,nd){clearGrid();sel=[];tapCount=0;
  targetColor=COLORS[Math.floor(Math.random()*COLORS.length)];
  $('#cueSwatch').style.display='block';$('#cueSwatch').style.background=targetColor;
  await sleep(700);$('#cueSwatch').style.display='none';
  const used=new Set();targetCells=pickCells(nt,used);targetCells.forEach(i=>used.add(i));
  distractCells=pickCells(nd,used);distractCells.forEach(i=>used.add(i));
  const others=COLORS.filter(c=>c!==targetColor);
  targetCells.forEach(i=>{cellEl(i).textContent='\u2b50';cellEl(i).style.color=targetColor;});
  distractCells.forEach(i=>{cellEl(i).textContent='\u2b50';cellEl(i).style.color=others[Math.floor(Math.random()*others.length)];});
  await sleep(900);
  [...targetCells,...distractCells].forEach(i=>{cellEl(i).textContent='';cellEl(i).style.color='';});
  $$('.cell').forEach(c=>c.classList.add('pick'));submitStart=Date.now();$('#done').classList.add('ready');}
function toggleCell(i){if(locked||phase==='demo')return;const el=cellEl(i);const pos=sel.indexOf(i);
  if(pos!==-1){sel.splice(pos,1);el.classList.remove('sel');T.revisions++;log(`revise: deselect cell ${i+1}`);}else{sel.push(i);el.classList.add('sel');}
  tapCount++;renderMeters();}
function submit(){if(locked||phase==='demo'||!$('#done').classList.contains('ready'))return;locked=true;$('#done').classList.remove('ready');$$('.cell').forEach(c=>c.classList.remove('pick'));
  const rt=Date.now()-submitStart;const tgtSet=new Set(targetCells);const selSet=new Set(sel);
  const hits=targetCells.filter(i=>selSet.has(i)).length;const fas=sel.filter(i=>!tgtSet.has(i)).length;
  const exact=hits===targetCells.length&&fas===0;
  sel.forEach(i=>cellEl(i).classList.add(tgtSet.has(i)?'correct':'wrong'));
  targetCells.forEach(i=>{if(!selSet.has(i))cellEl(i).classList.add('wrong');});
  if(phase==='warmup'){log(`warm-up ${exact?'exact':'partial ('+hits+'/'+targetCells.length+')'} \u2014 UNSCORED`);setTimeout(()=>{phase='scored';nextScored();},1200);return;}
  T.scored++;T.rts.push(rt);T.hits+=hits;T.tgtCells+=targetCells.length;T.fas+=fas;T.nonTgtCells+=(NC-targetCells.length);
  T.extraTaps.push(Math.max(0,tapCount-targetCells.length));
  if(exact){T.exact++;maxLevel=Math.max(maxLevel,level);level=Math.min(7,level+1);log(`SCORED targets ${targetCells.length}/distractors ${distractCells.length} \u2192 EXACT \u2714 \u2192 targets up to ${level}`);}
  else{$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),450);level=Math.max(2,level-1);log(`SCORED targets ${targetCells.length}/distractors ${distractCells.length} \u2192 ${hits}/${targetCells.length} hits, ${fas} false alarms \u2192 targets down to ${level}`);}
  setDiff();renderMeters();
  setTimeout(()=>{if(T.scored>=7)finish();else nextScored();},1300);}
function nextScored(){setCue('\ud83c\udfaf');const nd=level+1;log(`\u2014 SCORED trial ${T.scored+1}: ${level} targets, ${nd} distractors \u2014`);runTrial(level,nd).then(renderMeters);}
function startWarmup(){phase='warmup';setCue('\u2b50');log('\u2014 warm-up (unscored): hold only the cued colour \u2014');runTrial(1,1).then(renderMeters);}
function finish(){phase='done';setCue('\ud83c\udfc6');locked=true;clearGrid();$('#done').classList.remove('ready');
  log(`\u2014 DONE \u00b7 exact ${T.exact}/${T.scored} \u00b7 ceiling targets ${maxLevel} \u2014`);}
async function runDemo(){phase='demo';setCue('\ud83d\udc41\ufe0f');locked=true;clearGrid();
  log('ghost-hand demo (wordless, <10s)');
  targetColor='#5b9dff';$('#cueSwatch').style.display='block';$('#cueSwatch').style.background=targetColor;await sleep(700);$('#cueSwatch').style.display='none';
  targetCells=[5,10];distractCells=[2];
  targetCells.forEach(i=>{cellEl(i).textContent='\u2b50';cellEl(i).style.color=targetColor;});
  distractCells.forEach(i=>{cellEl(i).textContent='\u2b50';cellEl(i).style.color='#aaa';});
  await sleep(900);[...targetCells,...distractCells].forEach(i=>{cellEl(i).textContent='';cellEl(i).style.color='';});
  ghostShow(true);
  for(const i of targetCells){await ghostTo(cellEl(i));await ghostTap();cellEl(i).classList.add('correct');}
  await ghostTo($('#done'));await ghostTap();
  await sleep(400);ghostShow(false);setCue('\u2705');await sleep(600);startWarmup();}
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.cell');if(c)toggleCell(+c.dataset.i);});
$('#done').addEventListener('click',submit);
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildGrid();buildMeters();renderMeters();setDiff();runDemo();
</script>
</body>
</html>
