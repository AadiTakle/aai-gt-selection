<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-NBACK-01 · Burrow Echo</title>
<style>
  :root{--bg1:#eef9f0;--bg2:#eef0ff;--ink:#26304a;--card:#fff;--accent:#39a85c;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:16px;width:440px;max-width:100%}
  #instr{font-size:14px;color:#666;min-height:20px;text-align:center}
  #nlab{font-size:13px;color:var(--accent);font-weight:800}
  #burrows{display:flex;gap:12px}
  .burrow{width:74px;height:74px;border-radius:50% 50% 45% 45%;background:#d8c3a6;display:flex;align-items:center;justify-content:center;
    font-size:40px;position:relative;box-shadow:inset 0 -8px 0 #c2a884}
  .burrow.pop{background:#e6d3b6}
  #matchbtn{width:200px;height:66px;border-radius:18px;background:var(--accent);color:#fff;font-size:22px;font-weight:800;border:0;cursor:pointer}
  #matchbtn:active{transform:scale(.97)}
  #fb{font-size:14px;min-height:18px;font-weight:700}
  #controls{display:flex;gap:12px;align-items:center}
  #replay{width:44px;height:44px;background:#eef1ff;color:#5b6cff;font-size:20px;border-radius:50%;border:0;cursor:pointer}
  #ghost{position:fixed;left:0;top:0;font-size:34px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .4s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:180px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:880px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:260px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-NBACK-01 · Burrow Echo</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="instr"></div>
      <div id="nlab"></div>
      <div id="burrows"></div>
      <button id="matchbtn">MATCH!</button>
      <div id="fb"></div>
      <div id="controls"><button id="replay" title="replay demo">↻</button></div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
const sd=a=>{if(a.length<2)return null;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.round(Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)))};
function ndtri(p){p=Math.min(.99,Math.max(.01,p));// rational approx of inverse normal
  const a=[-39.6968,220.9460,-275.9285,138.3577,-30.6648,2.5066],b=[-54.4760,161.5858,-155.6989,66.8013,-13.2801];
  const c=[-.00778,-.32239,-2.40076,-2.54973,4.37466,2.93816],d=[.00778,.32246,2.44513,3.75440];
  const pl=.02425;let q,r,x;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));x=(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
  else if(p<=1-pl){q=p-.5;r=q*q;x=(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)}
  else{q=Math.sqrt(-2*Math.log(1-p));x=-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
  return x}
const POOL=['🦊','🐦','🦉','🐢','🦔'];
const LEVELS={
 warm:{n:1,isi:1700,seq:[0,0,1,2,2]},
 s1:{n:2,isi:1150,seq:[0,1,0,1,2,1,3,3,2,2,0,2]}
};
const T={hits:0,targets:0,fa:0,nontargets:0,lureTaps:0,lures:0,rts:[],correct:0,total:0,scored:false,maxN:0};
const METERS=[
 {id:'M-ACC',name:'Hits / targets',get:()=>T.targets?`${T.hits}/${T.targets}`:'—'},
 {id:'M-RT',name:'Match RT (mean)',get:()=>mean(T.rts)==null?'—':mean(T.rts)+' ms'},
 {id:'M-DPRIME',name:"Sensitivity d'",get:()=>{if(!T.targets||!T.nontargets)return '—';const h=(T.hits+.5)/(T.targets+1),f=(T.fa+.5)/(T.nontargets+1);return (ndtri(h)-ndtri(f)).toFixed(2)}},
 {id:'M-UPDATECOST',name:'n level (updating load)',get:()=>T.maxN?T.maxN+'-back':'—'},
 {id:'M-FALSEALARM',name:'Lure intrusions',get:()=>T.lures?`${T.lureTaps}/${T.lures}`:'0'},
 {id:'M-RTVAR',name:'RT variability (SD)',get:()=>sd(T.rts)==null?'—':sd(T.rts)+' ms'},
 {id:'M-SPAN',name:'Max n at criterion',get:()=>T.maxN?T.maxN:'—'},
 {id:'M-ENGAGE',name:'Trials seen',get:()=>T.total+''},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const d=document.createElement('div');d.innerHTML=`<span class="t">•</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(380)}

let phase='demo';const setCue=i=>$('#phasecue').textContent=i;
function buildBurrows(k){const b=$('#burrows');b.innerHTML='';for(let i=0;i<k;i++){const d=document.createElement('div');d.className='burrow';b.appendChild(d)}}
function fb(msg,ok){const f=$('#fb');f.textContent=msg;f.style.color=ok?'var(--good)':'var(--bad)'}
let tapped=false,tapT0=0,curPop=-1;
function onMatch(){if(tapped)return;tapped=true;$('#matchbtn').style.transform='scale(.97)';setTimeout(()=>$('#matchbtn').style.transform='',120)}
async function playStream(L,scored){buildBurrows(4);T.maxN=Math.max(T.maxN,L.n);$('#nlab').textContent=`match the critter from ${L.n} back`;
  for(let i=0;i<L.seq.length;i++){const sym=POOL[L.seq[i]];const isTarget=i>=L.n&&L.seq[i]===L.seq[i-L.n];
    const isLure=!isTarget&&i>=1&&L.seq[i]===L.seq[i-1]&&L.n!==1; // 1-back repeat when doing 2-back
    if(scored){if(isTarget)T.targets++;else T.nontargets++;if(isLure)T.lures++;}
    const burrowIdx=i%4;const bur=$$('.burrow')[burrowIdx];tapped=false;tapT0=performance.now();
    // show
    bur.classList.add('pop');bur.textContent=sym;
    await sleep(L.isi*0.78);
    // evaluate
    const rt=Math.round(performance.now()-tapT0);
    if(scored){T.total++;
      if(isTarget&&tapped){T.hits++;T.correct++;T.rts.push(rt);fb('match! ✓ '+rt+'ms',true);log(`${sym} TARGET tapped ✓ rt ${rt}`)}
      else if(isTarget&&!tapped){fb('missed a match',false);log(`${sym} TARGET missed`)}
      else if(!isTarget&&tapped){T.fa++;if(isLure){T.lureTaps++;log(`${sym} LURE tapped ✗ (false alarm)`)}else log(`${sym} tapped ✗ (false alarm)`);fb('not a match ✗',false)}
      else{T.correct++;fb('',true)}
      renderMeters()}
    bur.classList.remove('pop');bur.textContent='';
    await sleep(L.isi*0.22)}
}
async function startWarmup(){phase='warmup';setCue('⭐');$('#instr').textContent='Warm-up: tap MATCH when the critter is the SAME as the one just before. (unscored)';log('— warm-up 1-back (unscored) —');await playStream(LEVELS.warm,false);startScored()}
async function startScored(){phase='scored';setCue('🎯');$('#instr').textContent='SCORED: tap MATCH when the critter is the same as TWO burrows back. Ignore near-tricks.';log('— SCORED 2-back stream —');await playStream(LEVELS.s1,true);finish()}
function finish(){phase='done';setCue('🏆');$('#nlab').textContent='';fb('done!',true);
  const h=(T.hits+.5)/(T.targets+1),f=(T.fa+.5)/(T.nontargets+1);const dp=(ndtri(h)-ndtri(f)).toFixed(2);
  $('#instr').textContent='Done! Great updating.';log(`— DONE · hits ${T.hits}/${T.targets} · false alarms ${T.fa} · d' ${dp} —`);renderMeters()}
async function runDemo(){phase='demo';setCue('👁️');$('#instr').textContent='';$('#nlab').textContent='';buildBurrows(4);log('ghost-hand demo (wordless, <10s)');gShow(true);
  const b=$$('.burrow');b[0].textContent='🦊';await sleep(700);b[0].textContent='';b[1].textContent='🐦';await sleep(700);b[1].textContent='';b[2].textContent='🦊';await sleep(200);
  await gTo($('#matchbtn'));$('#matchbtn').style.transform='scale(.95)';fb('same as before! ✓',true);await sleep(500);$('#matchbtn').style.transform='';b[2].textContent='';gShow(false);await sleep(500);startWarmup()}
$('#matchbtn').addEventListener('pointerdown',onMatch);
$('#replay').addEventListener('click',()=>{if(phase==='done')runDemo()});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
