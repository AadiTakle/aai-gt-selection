<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-SHAPEFIT-01 · Shape Smith</title>
<style>
  :root{--bg1:#f3eefe;--bg2:#eef4ff;--ink:#26304a;--card:#fff;--accent:#8b5cf6;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:12px}
  #instr{font-size:14px;color:#666;min-height:20px;text-align:center;max-width:420px}
  #grid{display:grid;gap:4px;background:#e5ddf6;padding:8px;border-radius:12px}
  .cell{width:54px;height:54px;border-radius:8px;background:transparent}
  .cell.out{background:#faf7ff;box-shadow:inset 0 0 0 2px #e0d5f7;cursor:pointer}
  .cell.p0{background:#8b5cf6}.cell.p1{background:#22b0c8}.cell.p2{background:#e8863b}
  .cell.shake{animation:sh .3s}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  #tray{display:flex;gap:14px;align-items:center}
  .tp{padding:8px;border-radius:12px;background:#f3eefe;border:3px solid #e0d5f7;cursor:pointer;display:grid;gap:2px}
  .tp.sel{border-color:var(--accent);background:#e9defc}
  .tp .pc{width:16px;height:16px;border-radius:3px}
  .tp .pc.on{background:var(--accent)}.tp .pc.off{background:transparent}
  #tools{display:flex;gap:10px}
  button{font:inherit;border:0;cursor:pointer;border-radius:12px}
  .tool{background:#eef1ff;color:#5b6cff;padding:8px 14px;font-weight:700}
  #replay{width:42px;height:42px;background:#eef1ff;color:#5b6cff;font-size:19px;border-radius:50%}
  #ghost{position:fixed;left:0;top:0;font-size:32px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .45s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:170px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:880px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:260px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-SHAPEFIT-01 · Shape Smith</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="instr"></div>
      <div id="grid"></div>
      <div id="tray"></div>
      <div id="tools"><button class="tool" id="rot">⟳ rotate</button><button class="tool" id="replay">↻</button></div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// pieces: base offsets
const PIECES={domino:[[0,0],[0,1]], Lmino:[[0,0],[1,0],[1,1]]};
function rotOffsets(offs){let o=offs.map(([r,c])=>[c,-r]);const mr=Math.min(...o.map(x=>x[0])),mc=Math.min(...o.map(x=>x[1]));return o.map(([r,c])=>[r-mr,c-mc])}
function norm(offs){const mr=Math.min(...offs.map(x=>x[0])),mc=Math.min(...offs.map(x=>x[1]));return offs.map(([r,c])=>[r-mr,c-mc])}
const LEVELS={
 warm:{rows:2,cols:3,out:['0,0','0,1'],pieces:['domino'],opt:1},
 s1:{rows:2,cols:3,out:['0,0','0,1','0,2','1,0','1,1','1,2'],pieces:['Lmino','Lmino'],opt:2}
};
const T={itemStart:0,placements:0,firstLat:null,firstActed:false,opt:0,rots:0,removes:0,scored:0,correct:0};
const METERS=[
 {id:'M-ACC',name:'Silhouette filled (scored)',get:()=>T.scored?`${T.correct}/${T.scored}`:'—'},
 {id:'M-EFF',name:'Placements vs optimal',get:()=>T.opt?`${T.opt}/${T.placements}`:'—'},
 {id:'M-PATH',name:'Placements',get:()=>T.placements+''},
 {id:'M-REV',name:'Piece removals',get:()=>T.removes+''},
 {id:'M-RTFIRST',name:'First-action latency (plan)',get:()=>T.firstLat==null?'—':T.firstLat+' ms'},
 {id:'M-EXPLORE',name:'Rotations tried',get:()=>T.rots+''},
 {id:'M-PROG',name:'Cells covered',get:()=>L?`${occCount()}/${L.out.length}`:'—'},
 {id:'M-PERSIST',name:'Time-on-task (ms)',get:()=>T.itemStart?(Date.now()-T.itemStart):'—'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const t=T.itemStart?Date.now()-T.itemStart:0;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-6}px,${c.y-4}px)`;await sleep(430)}

let phase='demo',L=null,occ={},selIdx=0,curOffs=null,remaining=[],locked=false;
const setCue=i=>$('#phasecue').textContent=i;
function occCount(){return Object.keys(occ).length}
function render(){const g=$('#grid');g.style.gridTemplateColumns=`repeat(${L.cols},54px)`;g.innerHTML='';
  for(let r=0;r<L.rows;r++)for(let c=0;c<L.cols;c++){const d=document.createElement('div');d.className='cell';d.dataset.r=r;d.dataset.c=c;
    if(L.out.includes(r+','+c))d.classList.add('out');
    if(occ[r+','+c]!=null)d.classList.add('p'+(occ[r+','+c]%3));
    g.appendChild(d)}}
function newLevel(spec){L=spec;occ={};remaining=spec.pieces.slice();selIdx=0;curOffs=norm(PIECES[remaining[0]]);
  T.itemStart=Date.now();T.placements=0;T.firstActed=false;T.firstLat=null;T.opt=spec.opt;T.rots=0;T.removes=0;locked=false;render();renderTray();renderMeters()}
function tryPlace(r,c){if(locked||!remaining.length)return;const cells=curOffs.map(([dr,dc])=>[r+dr,c+dc]);
  const ok=cells.every(([rr,cc])=>L.out.includes(rr+','+cc)&&occ[rr+','+cc]==null);
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first action (after planning)')}
  if(!ok){const el=$(`.cell[data-r="${r}"][data-c="${c}"]`);if(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),300)}log('does not fit there');return}
  const pieceNo=L.pieces.length-remaining.length;cells.forEach(([rr,cc])=>occ[rr+','+cc]=pieceNo);T.placements++;remaining.shift();
  log(`placed ${L.pieces[pieceNo]} (${T.placements}/${L.pieces.length})`);
  if(remaining.length){curOffs=norm(PIECES[remaining[0]])}render();renderTray();renderMeters();
  if(occCount()===L.out.length)solved()}
function removeAt(r,c){if(locked)return;const pn=occ[r+','+c];if(pn==null)return;
  // remove all cells of that piece, push piece back
  const removedCells=Object.keys(occ).filter(k=>occ[k]===pn);removedCells.forEach(k=>delete occ[k]);
  remaining.unshift(L.pieces[pn]);T.placements=Math.max(0,T.placements-1);T.removes++;curOffs=norm(PIECES[remaining[0]]);
  log('removed a piece (revision)');render();renderTray();renderMeters()}
function solved(){locked=true;setCue(phase==='scored'?'🏆':'⭐');$('#instr').textContent='The silhouette is full! 🎉';
  if(phase==='scored'){T.scored++;T.correct++;log(`SOLVED · placements ${T.placements} (optimal ${T.opt}) · rotations ${T.rots} · removals ${T.removes}`);renderMeters();setTimeout(finish,1400)}
  else{log('warm-up solved (unscored)');setTimeout(startScored,1300)}}
function finish(){phase='done';locked=true;setCue('🏆');$('#instr').textContent='Done! Elegant fit.'}
function rotate(){if(locked||!remaining.length)return;curOffs=rotOffsets(curOffs);T.rots++;renderTray();renderMeters();log('rotate piece')}
function renderTray(){const t=$('#tray');t.innerHTML='';
  if(!remaining.length){t.innerHTML='<span style="color:#aab;font-size:13px">all pieces placed</span>';return}
  const offs=curOffs;const maxr=Math.max(...offs.map(o=>o[0])),maxc=Math.max(...offs.map(o=>o[1]));
  const d=document.createElement('div');d.className='tp sel';d.style.gridTemplateColumns=`repeat(${maxc+1},16px)`;
  for(let r=0;r<=maxr;r++)for(let c=0;c<=maxc;c++){const cell=document.createElement('div');cell.className='pc '+(offs.some(o=>o[0]===r&&o[1]===c)?'on':'off');d.appendChild(cell)}
  const label=document.createElement('span');label.style.cssText='font-size:12px;color:#777;margin-left:6px';label.textContent='next piece — rotate then tap the outline';
  t.appendChild(d);t.appendChild(label)}
function startWarmup(){phase='warmup';setCue('⭐');$('#instr').textContent='Warm-up: drop the piece into the outline. (unscored)';newLevel(LEVELS.warm);log('— warm-up (unscored) —')}
function startScored(){phase='scored';setCue('🎯');$('#instr').textContent='SCORED: fill the whole outline. Rotate the piece, then tap where it goes. Tap a placed piece to take it back.';newLevel(LEVELS.s1);log('— SCORED: fit both L-pieces —')}
async function runDemo(){phase='demo';setCue('👁️');$('#instr').textContent='';newLevel(LEVELS.warm);log('ghost-hand demo (wordless, <10s)');gShow(true);await sleep(400);
  const cell=$('.cell[data-r="0"][data-c="0"]');await gTo(cell);gShow(false);tryPlace(0,0);await sleep(900);$('#instr').textContent='';startWarmup()}
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.cell.out');if(!c)return;const r=+c.dataset.r,cc=+c.dataset.c;
  if(occ[r+','+cc]!=null)removeAt(r,cc);else tryPlace(r,cc)});
$('#rot').addEventListener('click',rotate);
$('#replay').addEventListener('click',()=>{if(phase==='done')runDemo()});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
