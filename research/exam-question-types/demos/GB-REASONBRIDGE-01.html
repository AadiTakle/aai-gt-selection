<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-REASONBRIDGE-01 · Best Because</title>
<style>
  :root{--bg1:#eafaff;--bg2:#eef1ff;--ink:#26304a;--card:#fff;--accent:#0e9bd6;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:14px;width:480px;max-width:100%}
  #instr{font-size:14px;color:#666;min-height:20px;text-align:center}
  #claim{font-size:16px;font-weight:800;color:#0b6f9c;background:#e2f5fd;border-radius:14px;padding:12px 16px;text-align:center}
  #strength{width:100%;height:16px;background:#e7ecff;border-radius:8px;overflow:hidden}
  #strength i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
  #cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .card{width:150px;min-height:92px;border-radius:14px;background:#f6f8ff;border:3px solid #e2e8fb;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px;text-align:center}
  .card:active{transform:scale(.97)}.card.sel{border-color:var(--accent);background:#e2f5fd}
  .card .e{font-size:32px}.card .c{font-size:12px;color:#556}
  .card.right{border-color:var(--good);background:#e7fbf1}.card.dim{opacity:.5}
  #row{display:flex;gap:12px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:12px}
  #confirm{background:var(--accent);color:#fff;padding:9px 20px;font-weight:800}
  #replayaud{background:#eef1ff;color:#5b6cff;padding:9px 14px;font-weight:700}
  #fb{font-size:14px;min-height:18px;font-weight:700}
  #replay{width:44px;height:44px;background:#eef1ff;color:#5b6cff;font-size:20px;border-radius:50%;border:0;cursor:pointer}
  #ghost{position:fixed;left:0;top:0;font-size:34px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .45s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:170px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:900px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:250px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-REASONBRIDGE-01 · Best Because</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="instr"></div>
      <div id="claim"></div>
      <div id="strength"><i></i></div>
      <div id="cards"></div>
      <div id="row"><button id="confirm">✓ choose</button><button id="replayaud">🔊 replay</button><button id="replay" title="replay demo">↻</button></div>
      <div id="fb"></div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function speak(t){try{if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(t);u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){}}
// strength: 2 strong support, 1 weak, 0 irrelevant, -1 against(counter)
const ITEMS={
 warm:{claim:'We should wear coats outside.',counter:false,reasons:[{e:'❄️',c:'it is snowing',s:2},{e:'🔢',c:'it is Tuesday',s:0}]},
 s1:{claim:'We should bring umbrellas today.',counter:true,reasons:[{e:'🌧️',c:'dark rain clouds',s:2},{e:'🟢',c:'the grass is green',s:0},{e:'📅',c:'it is Tuesday',s:0},{e:'☀️',c:'clear sunny sky',s:-1}]},
 s2:{claim:'This plant needs more water.',counter:true,reasons:[{e:'🥀',c:'leaves are droopy and dry',s:2},{e:'🪴',c:'the pot is blue',s:0},{e:'💧',c:'soil is bone dry',s:2},{e:'🌊',c:'water is dripping out the bottom',s:-1}]}
};
const T={correct:0,total:0,poly:0,maxPoly:0,firstLat:null,revs:0,counters:0,counterTot:0,path:[]};
const METERS=[
 {id:'M-ACC',name:'Best reason chosen',get:()=>T.total?`${T.correct}/${T.total}`:'—'},
 {id:'M-POLY',name:'Link-strength score',get:()=>T.maxPoly?`${T.poly}/${T.maxPoly}`:'—'},
 {id:'M-RTFIRST',name:'First-choice latency',get:()=>T.firstLat==null?'—':T.firstLat+' ms'},
 {id:'M-LURETYPE',name:'Weak/irrelevant picks',get:()=>T.lure||0},
 {id:'M-INFDEPTH',name:'Counter-reasons found',get:()=>T.counterTot?`${T.counters}/${T.counterTot}`:'—'},
 {id:'M-REV',name:'Re-selections',get:()=>T.revs+''},
 {id:'M-PATH',name:'Choice sequence',get:()=>T.path.length?T.path.join(' '):'—'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const d=document.createElement('div');d.innerHTML=`<span class="t">•</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(460)}

let phase='demo',cur=null,sel=-1,step='support',firstT=0,firstDone=false;
const setCue=i=>$('#phasecue').textContent=i;
function present(item){cur=item;sel=-1;step='support';firstDone=false;firstT=performance.now();
  $('#claim').textContent='“'+item.claim+'”';speak(item.claim);$('#strength').querySelector('i').style.width='0%';
  $('#cards').innerHTML=item.reasons.map((r,i)=>`<div class="card" data-i="${i}"><div class="e">${r.e}</div><div class="c">${r.c}</div></div>`).join('');
  $('#instr').textContent=phase==='scored'?'Tap the reason that BEST supports the claim, then choose.':'Warm-up: tap the reason that supports it, then choose. (unscored)'}
function selectCard(i){if(step==='done')return;if(!firstDone){firstDone=true;T.firstLat=Math.round(performance.now()-firstT);log('first choice (after listening)')}
  if(sel>=0&&sel!==i)T.revs++;sel=i;$$('.card').forEach(c=>c.classList.toggle('sel',+c.dataset.i===i));
  const s=cur.reasons[i].s;const pct=step==='support'?Math.max(0,s)/2*100:0;$('#strength').querySelector('i').style.width=pct+'%';
  T.path.push(step==='support'?'S'+i:'C'+i)}
function confirm(){if(sel<0||step==='done')return;const scored=phase==='scored';
  if(step==='support'){const s=cur.reasons[sel].s;
    if(scored){T.total++;T.maxPoly+=2;T.poly+=Math.max(0,s);if(s<2){T.lure=(T.lure||0)+1}}
    if(s===2){if(scored)T.correct++;$('#cards').children[sel].classList.add('right');$('#fb').textContent='Strong reason! 🎉';$('#fb').style.color='var(--good)';log(`${scored?'SCORED ':''}support: strength ${s} ✓`)}
    else{$('#fb').textContent='That is weak — a stronger reason exists.';$('#fb').style.color='var(--bad)';log(`${scored?'SCORED ':''}support: strength ${s}`)}
    renderMeters();
    if(cur.counter&&scored){step='counter';sel=-1;$$('.card').forEach(c=>c.classList.remove('sel'));$('#instr').textContent='Now tap the reason a rival would give AGAINST the claim.';setTimeout(()=>{},10);return}
    finishItem(scored)}
  else{ // counter step
    const s=cur.reasons[sel].s;T.counterTot++;if(s===-1){T.counters++;$('#cards').children[sel].classList.add('right');$('#fb').textContent='Yes — that argues against it! 🎉';$('#fb').style.color='var(--good)';log('counter-reason ✓')}
    else{$('#fb').textContent='That does not argue against it.';$('#fb').style.color='var(--bad)';log('counter-reason ✗')}
    renderMeters();finishItem(scored)}}
let q=[],qi=0;
function finishItem(scored){step='done';if(!scored){setTimeout(startScored,1100);return}qi++;if(qi>=q.length){setTimeout(finish,900);return}setTimeout(()=>{$('#fb').textContent='';present(q[qi])},1100)}
function startWarmup(){phase='warmup';setCue('⭐');present(ITEMS.warm)}
function startScored(){phase='scored';setCue('🎯');q=[ITEMS.s1,ITEMS.s2];qi=0;$('#fb').textContent='';present(q[0]);log('— SCORED best-reason + counter —')}
function finish(){phase='done';setCue('🏆');$('#instr').textContent='Done! Strong reasoning.';$('#claim').textContent='';$('#cards').innerHTML='';log(`— DONE · best ${T.correct}/${T.total} · counters ${T.counters}/${T.counterTot} · link score ${T.poly}/${T.maxPoly} —`);renderMeters()}
async function runDemo(){phase='demo';setCue('👁️');present(ITEMS.warm);$('#instr').textContent='';log('ghost-hand demo (wordless, <10s)');gShow(true);await sleep(1100);
  const good=$('.card[data-i="0"]');await gTo(good);selectCard(0);await sleep(300);await gTo($('#confirm'));gShow(false);$('#cards').children[0].classList.add('right');$('#strength').querySelector('i').style.width='100%';$('#fb').textContent='strong reason! 🎉';$('#fb').style.color='var(--good)';await sleep(1000);$('#fb').textContent='';T.path=[];step='support';startWarmup()}
$('#cards').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)selectCard(+c.dataset.i)});
$('#confirm').addEventListener('click',confirm);
$('#replayaud').addEventListener('click',()=>{if(cur){speak(cur.claim);log('audio replay')}});
$('#replay').addEventListener('click',()=>{if(phase==='done')runDemo()});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
