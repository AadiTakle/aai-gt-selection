<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-FAMILYSORT-01 · Sort the Families</title>
<style>
  :root{
    --bg1:#eefaf3; --bg2:#eef2ff; --ink:#26304a; --card:#ffffff;
    --accent:#5b6cff; --good:#22b573; --bad:#ff6b6b;
    --famA:#3aa0ff; --famB:#ff8a3a; --famC:#a05bff;
    --tel-bg:#11162a; --tel-ink:#c8d6ff; --tel-key:#7fffcf; --tel-dim:#7183b8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:16px;max-width:600px;width:100%}
  #legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .lchip{display:flex;align-items:center;gap:6px;font-size:12px;color:#7a84a8}
  .lchip .dot{width:16px;height:16px;border-radius:50%}
  #pool{display:grid;gap:12px;justify-content:center}
  .cardf{width:84px;height:84px;border-radius:16px;background:#fff;border:4px solid #e6e9f5;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.13s;position:relative;-webkit-tap-highlight-color:transparent}
  .cardf:hover{transform:translateY(-3px)}
  .cardf .fam{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;
    display:flex;align-items:center;justify-content:center;font-weight:700;opacity:0;transform:scale(.4);transition:.13s}
  .cardf.tag .fam{opacity:1;transform:scale(1)}
  .cardf.hit{box-shadow:0 0 0 4px #b4ecd0}
  .cardf.miss{box-shadow:0 0 0 4px #ffd0d0}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:74px;height:74px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:50px;height:50px;background:#eef1ff;color:#5b6cff;font-size:22px}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .55s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}
  @keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff;word-break:break-word}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:190px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}
  #log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-FAMILYSORT-01 · Sort the Families</div>
    <div id="phasecue">&#128065;&#65039;</div>
    <div id="stagecard">
      <div id="legend"></div>
      <div id="pool"></div>
      <div id="controls">
        <button id="replay" title="replay demo">&#8635;</button>
        <button id="go" title="submit">&#10003;</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">&#128072;<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const FAMCOL=['#3aa0ff','#ff8a3a','#a05bff'];

const PAL={red:'#e6194b',green:'#2ca25f',blue:'#4363d8',orange:'#f58231',purple:'#911eb4'};
function polyPts(cx,cy,r,n,rot){let p=[];for(let i=0;i<n;i++){let a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function baseShape(shape,color,cx,cy,r){const f='fill="'+color+'"';
  switch(shape){
    case 'circle':return `<circle cx="${cx}" cy="${cy}" r="${r}" ${f}/>`;
    case 'square':return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="4" ${f}/>`;
    case 'triangle':return `<polygon points="${polyPts(cx,cy,r,3,-Math.PI/2)}" ${f}/>`;
    case 'diamond':return `<polygon points="${polyPts(cx,cy,r,4,-Math.PI/2)}" ${f}/>`;
    case 'hexagon':return `<polygon points="${polyPts(cx,cy,r,6,-Math.PI/2)}" ${f}/>`;
  } return '';}
function figSVG(fr,box=64){const color=PAL[fr.color]||fr.color;const n=fr.count||1;let inner='';
  if(n===1)inner=baseShape(fr.shape,color,box/2,box/2,box*0.30);
  else{const pos=n===2?[[.32,.5],[.68,.5]]:[[.26,.5],[.5,.5],[.74,.5]];
    const r=box*0.14;pos.slice(0,n).forEach(p=>inner+=baseShape(fr.shape,color,p[0]*box,p[1]*box,r));}
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${inner}</svg>`;}

/* generate a set that partitions uniquely into nFam families by a chosen dimension */
function genItem(nFam,dim,n){
  n=n||6;const figs=[];
  const shapes=['circle','square','triangle','diamond','hexagon'];
  if(dim==='color'){const cols=shuffle(['red','green','blue']).slice(0,nFam);
    for(let i=0;i<n;i++){const fam=i%nFam;figs.push({shape:shuffle(shapes)[0],color:cols[fam],count:1+((Math.random()*3)|0),fam});}}
  else if(dim==='shape'){const shs=shuffle(shapes).slice(0,nFam);const cols=['red','green','blue','orange','purple'];
    for(let i=0;i<n;i++){const fam=i%nFam;figs.push({shape:shs[fam],color:shuffle(cols)[0],count:1+((Math.random()*3)|0),fam});}}
  else if(dim==='count'){ // family by number of items (1 vs 2 vs 3)
    const counts=shuffle([1,2,3]).slice(0,nFam);const cols=['red','green','blue','orange','purple'];
    for(let i=0;i<n;i++){const fam=i%nFam;figs.push({shape:shuffle(shapes)[0],color:shuffle(cols)[0],count:counts[fam],fam});}}
  else { // conjunction: family by (shape AND fill/count parity)
    const shs=shuffle(shapes).slice(0,2);
    for(let i=0;i<n;i++){const fam=i%2;figs.push({shape:shs[fam],color:fam===0?'blue':'orange',count:1+((Math.random()*3)|0),fam});}
    nFam=2;}
  return {nFam,dim,figs:shuffle(figs)};}

const T={scored:0,correct:0,firstLat:null,path:[],rev:0,explore:0,polyLast:'\u2014',lastErr:'\u2014',itemStart:0,firstActed:false,assigns:{}};
const METERS=[
 {id:'M-ACC',name:'Item accuracy (whole partition)',get:()=>T.scored?`${T.correct}/${T.scored}  ${Math.round(100*T.correct/T.scored)}%`:'\u2014'},
 {id:'M-POLY',name:'Partial-credit (figures placed right)',get:()=>T.polyLast},
 {id:'M-PATH',name:'Assignment order',get:()=>T.path.length?T.path.join(' '):'\u2014'},
 {id:'M-REV',name:'Revisions (re-tags)',get:()=>T.rev+''},
 {id:'M-EXPLORE',name:'Exploration (total taps)',get:()=>T.explore+''},
 {id:'M-ERRTYPE',name:'Error type (misassign basis)',get:()=>T.lastErr},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>
  `<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');
  d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}

const ghost=$('#ghost');
function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(550);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(450);}

let phase='demo',cur=null,tags=[],locked=true,scoredIndex=0;
const scoredItems=[genItem(2,'shape',6),genItem(2,'count',6)];
function setCue(i){$('#phasecue').innerHTML=i;}
function dimName(d){return d==='color'?'color':d==='shape'?'shape kind':d==='count'?'how many':'shape + color';}
function renderLegend(){const el=$('#legend');el.innerHTML='';
  for(let f=0;f<cur.nFam;f++){const c=document.createElement('div');c.className='lchip';
    c.innerHTML=`<span class="dot" style="background:${FAMCOL[f]}"></span>family ${f+1}`;el.appendChild(c);}
  const q=document.createElement('div');q.className='lchip';q.innerHTML='<span class="dot" style="background:#e6e9f5"></span>tap to choose';el.appendChild(q);}
function renderPool(){const el=$('#pool');const cols=Math.min(cur.figs.length,4);el.style.gridTemplateColumns=`repeat(${cols},1fr)`;el.innerHTML='';
  cur.figs.forEach((fr,i)=>{const d=document.createElement('div');d.className='cardf'+(tags[i]>=0?' tag':'');d.dataset.i=i;
    const famcol=tags[i]>=0?FAMCOL[tags[i]]:'#e6e9f5';d.style.borderColor=famcol;
    d.innerHTML=figSVG(fr)+`<span class="fam" style="background:${tags[i]>=0?FAMCOL[tags[i]]:'#c9d0e6'}">${tags[i]>=0?tags[i]+1:''}</span>`;
    el.appendChild(d);});}
function renderItem(item){cur=item;tags=item.figs.map(()=>-1);renderLegend();renderPool();$('#go').classList.remove('ready');
  T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;T.path=[];T.rev=0;T.explore=0;T.polyLast='\u2014';T.lastErr='\u2014';renderMeters();}
function ready(){return tags.every(t=>t>=0);}
function onCard(el){if(locked)return;const i=+el.dataset.i;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first tap');}
  T.explore++;const prev=tags[i];
  tags[i]=(tags[i]+1)% (cur.nFam+1);if(tags[i]===cur.nFam)tags[i]=-1; // cycle families then back to unassigned
  if(prev>=0)T.rev++;
  if(tags[i]>=0)T.path.push('f'+(tags[i]+1)+'#'+(i+1));
  renderPool();$('#go').classList.toggle('ready',ready());renderMeters();}
function score(){let nc=0,wrong=null;cur.figs.forEach((fr,i)=>{if(tags[i]===fr.fam)nc++;else if(wrong===null)wrong=i;});
  const correct=nc===cur.figs.length;let err='none';
  if(!correct&&wrong!==null){err='misgrouped fig'+(wrong+1)+' (by '+ (cur.dim==='conj'?'one attribute only':'surface') +')';}
  return {nc,tot:cur.figs.length,correct,err};}
function submit(){if(!ready())return;const s=score();T.polyLast=s.nc+' / '+s.tot+' figures';T.lastErr=s.err;
  const cards=$$('#pool .cardf');cur.figs.forEach((fr,i)=>cards[i].classList.add(tags[i]===fr.fam?'hit':'miss'));
  if(phase==='warmup'){log('warm-up '+(s.correct?'correct':s.nc+'/'+s.tot)+' — UNSCORED');locked=true;$('#go').classList.remove('ready');setTimeout(nextPhase,1100);return;}
  T.scored++;if(s.correct)T.correct++;else{$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),450);}
  locked=true;$('#go').classList.remove('ready');
  log(`SUBMIT item ${scoredIndex+1} · sort by ${dimName(cur.dim)} \u2192 ${s.correct?'CORRECT':'partial'} · POLY ${s.nc}/${s.tot} · retags ${T.rev}`);
  renderMeters();setTimeout(nextPhase,1300);}
function nextPhase(){if(phase==='warmup'){scoredIndex=0;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<scoredItems.length?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('&#11088;');locked=false;renderItem(genItem(2,'color',4));log('— warm-up (unscored): tap each figure into its color family —');}
function startScored(){phase='scored';setCue('&#127919;');locked=false;renderItem(scoredItems[scoredIndex]);
  log(`— SCORED item ${scoredIndex+1}: find the hidden families (${dimName(cur.dim)}) —`);}
function finish(){phase='done';setCue('&#127942;');locked=true;log(`— DONE · accuracy ${T.correct}/${T.scored} —`);}
async function runDemo(){phase='demo';setCue('&#128065;&#65039;');locked=true;
  const d=genItem(2,'color',4);renderItem(d);log('ghost-hand demo (wordless, <10s): each figure to its family');
  ghostShow(true);await sleep(350);locked=false;
  for(let i=0;i<d.figs.length;i++){const el=$$('#pool .cardf')[i];const need=d.figs[i].fam;
    await ghostTo(el);
    // tap the right number of times to land on the correct family
    let taps=((need - tags[i]) % (d.nFam+1) + (d.nFam+1)) % (d.nFam+1);if(taps===0)taps=d.nFam+1;
    for(let k=0;k<taps;k++){await ghostTap();onCard(el);await sleep(90);}
    await sleep(120);}
  await sleep(250);await ghostTo($('#go'));await ghostTap();
  const cards=$$('#pool .cardf');d.figs.forEach((fr,i)=>cards[i].classList.add('hit'));
  await sleep(600);ghostShow(false);locked=true;await sleep(400);startWarmup();}

$('#pool').addEventListener('click',e=>{const c=e.target.closest('.cardf');if(c)onCard(c);});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
