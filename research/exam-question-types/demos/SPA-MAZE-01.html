<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPA-MAZE-01 · Plan-the-Path</title>
<style>
  :root{--bg1:#eafaf0;--bg2:#eef4ff;--ink:#26304a;--card:#fff;--accent:#12a15f;--good:#22b573;--bad:#ff6b6b;--wall:#26304a;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:14px}
  #mazewrap{position:relative}
  #maze{display:grid;background:#fff;border-radius:4px}
  .cell{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;background:#f7f9ff;border:3px solid transparent;cursor:pointer}
  .cell.path{background:#d7f3e2}
  .cell.reject{background:#ffe3e3}
  #walkerLayer{position:absolute;left:0;top:0;pointer-events:none}
  #walker{position:absolute;font-size:22px;transition:left .28s,top .28s;transform:translate(-50%,-50%)}
  #row{display:flex;gap:18px;align-items:flex-start}
  .pad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:4px}
  .pad button{padding:0;border-radius:9px;font-size:16px}
  .pad .sp{visibility:hidden}
  button{font:inherit;border:0;cursor:pointer;border-radius:11px;background:#eef7f0;color:var(--accent);font-weight:700}
  #undo{background:#ffe9ec;color:#c0455a}
  #go{background:var(--accent);color:#fff;padding:10px 22px;font-size:16px;opacity:.4;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #replay{width:44px;height:44px;font-size:19px;border-radius:50%}
  .btnrow{display:flex;gap:10px;align-items:center}
  .shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .hotkeys{font-size:11px;color:#a3aecb}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;transition:transform .5s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}#ghost .ring{position:absolute;left:-6px;top:-6px;width:26px;height:26px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #diffmeter{margin:0 12px 8px;background:#1b2340;border-radius:8px;padding:8px 10px}
  #diffmeter .bar{height:8px;background:#232c4d;border-radius:6px;overflow:hidden;margin-top:6px}
  #diffmeter .bar>i{display:block;height:100%;background:linear-gradient(90deg,#7fffcf,#12a15f);width:0%;transition:width .3s}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:190px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}#row{flex-direction:column;align-items:center}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">SPA-MAZE-01 · Plan-the-Path</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="mazewrap"><div id="maze"></div><div id="walkerLayer"><div id="walker">🐣</div></div></div>
      <div id="row">
        <div class="pad">
          <div class="sp"></div><button id="up">⬆︎</button><div class="sp"></div>
          <button id="left">⬅︎</button><button id="undo" title="undo last step">↩︎</button><button id="right">➡︎</button>
          <div class="sp"></div><button id="down">⬇︎</button><div class="sp"></div>
        </div>
        <div class="btnrow">
          <button id="replay" title="replay demo">↻</button>
          <button id="go">GO ✓</button>
        </div>
      </div>
      <div class="hotkeys">hotkeys: arrow keys move · backspace/opposite-direction undoes a step</div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="diffmeter">difficulty <span id="dlab">1/6</span><div class="bar"><i id="dbar"></i></div></div>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,last=a=>a[a.length-1];
const CELL=34;

/* ---------- maze generation ---------- */
function edgeKey(a,b){const[r1,c1]=a,[r2,c2]=b;return (r1<r2||(r1===r2&&c1<c2))?`${r1},${c1}-${r2},${c2}`:`${r2},${c2}-${r1},${c1}`;}
function neighborsOf(r,c,R,C){const out=[];if(r>0)out.push([r-1,c]);if(r<R-1)out.push([r+1,c]);if(c>0)out.push([r,c-1]);if(c<C-1)out.push([r,c+1]);return out;}
function carve(R,C){
  const open=new Set();const visited=Array.from({length:R},()=>Array(C).fill(false));
  const stack=[[0,0]];visited[0][0]=true;
  while(stack.length){
    const[r,c]=stack[stack.length-1];
    const nbs=neighborsOf(r,c,R,C).filter(([nr,nc])=>!visited[nr][nc]);
    if(!nbs.length){stack.pop();continue;}
    const[nr,nc]=nbs[Math.floor(Math.random()*nbs.length)];
    open.add(edgeKey([r,c],[nr,nc]));visited[nr][nc]=true;stack.push([nr,nc]);
  }
  return open;
}
function braid(R,C,open,p){
  let extra=0;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)neighborsOf(r,c,R,C).forEach(([nr,nc])=>{
    const k=edgeKey([r,c],[nr,nc]);
    if(!open.has(k)&&Math.random()<p){open.add(k);extra++;}
  });
  return extra;
}
function bfsDist(R,C,open,a,b){
  const key=p=>p[0]+','+p[1];const dist=new Map([[key(a),0]]);const q=[a];let qi=0;
  while(qi<q.length){const cur=q[qi++];for(const nb of neighborsOf(cur[0],cur[1],R,C)){if(open.has(edgeKey(cur,nb))&&!dist.has(key(nb))){dist.set(key(nb),dist.get(key(cur))+1);q.push(nb);}}}
  return dist.has(key(b))?dist.get(key(b)):Infinity;
}
function permute(arr){if(arr.length<=1)return[arr];const res=[];arr.forEach((v,i)=>{const rest=arr.slice(0,i).concat(arr.slice(i+1));permute(rest).forEach(p=>res.push([v,...p]));});return res;}
function optimalLength(R,C,open,start,goal,gems){
  if(!gems.length)return bfsDist(R,C,open,start,goal);
  let best=Infinity;
  permute(gems).forEach(order=>{let total=0,cur=start;for(const g of order){total+=bfsDist(R,C,open,cur,g);cur=g;}total+=bfsDist(R,C,open,cur,goal);best=Math.min(best,total);});
  return best;
}
const LEVELS=[
  {R:5,C:5,braid:0.05,gems:0},
  {R:6,C:6,braid:0.06,gems:0},
  {R:6,C:7,braid:0.08,gems:1},
  {R:7,C:8,braid:0.09,gems:1},
  {R:8,C:8,braid:0.10,gems:2},
  {R:9,C:9,braid:0.12,gems:2},
];
function genItem(lvl){
  const cfg=LEVELS[lvl];const R=cfg.R,C=cfg.C;
  const start=[0,0],goal=[R-1,C-1];
  let open,extra=0;
  for(let t=0;t<6;t++){open=carve(R,C);extra=braid(R,C,open,cfg.braid);if(extra>=2)break;}
  const allCells=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(!(r===0&&c===0)&&!(r===R-1&&c===C-1))allCells.push([r,c]);
  const gems=[];
  while(gems.length<cfg.gems&&allCells.length){
    const idx=Math.floor(Math.random()*allCells.length);
    gems.push(allCells.splice(idx,1)[0]);
  }
  const optimal=optimalLength(R,C,open,start,goal,gems);
  return {R,C,open,start,goal,gems,optimal,lvl};
}

/* ---------- state ---------- */
let cur=null,phase='demo',locked=false,scoredIndex=0,level=0;
let path=[],rejectCell=null;
const T={scored:0,exact:0,rts:[],rtFirsts:[],revisions:0,itemStart:0,firstActed:false,maxLevel:0,levelSeries:[],hardMs:0};
function effStr(){return cur?`${Math.max(path.length-1,0)} steps / optimal ${cur.optimal}`:'\u2014';}
function polyStr(){if(!cur)return'\u2014';const taken=Math.max(path.length-1,1);return Math.min(100,Math.round(100*cur.optimal/taken))+'%';}
function learnRate(){if(T.levelSeries.length<2)return'\u2014';const gained=last(T.levelSeries)-T.levelSeries[0];return `${gained>=0?'+':''}${gained} lvl / ${T.levelSeries.length} trials`;}
const METERS=[
 {id:'M-ACC',name:'Item accuracy (optimal route chosen)',get:()=>T.scored?`${T.exact}/${T.scored}  ${Math.round(100*T.exact/T.scored)}%`:'\u2014'},
 {id:'M-EFF',name:'Efficiency vs optimal',get:()=>effStr()},
 {id:'M-PATH',name:'Move sequence',get:()=>path.length?`${path.length-1} steps`:'\u2014'},
 {id:'M-RTFIRST',name:'First-move latency',get:()=>T.rtFirsts.length?`${last(T.rtFirsts)} ms`:'\u2014'},
 {id:'M-REV',name:'Revisions (backtracks)',get:()=>T.revisions},
 {id:'M-PERSIST',name:'Persistence on hard items',get:()=>T.hardMs?`${T.hardMs} ms`:'\u2014'},
 {id:'M-DIFFREACH',name:'Ceiling / max level reached',get:()=>T.maxLevel+1+'/'+LEVELS.length},
 {id:'M-POLY',name:'Closeness-to-optimal score',get:()=>polyStr()},
 {id:'M-LEARNRATE',name:'Within-session learning rate',get:()=>learnRate()},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});$('#dbar').style.width=(100*(level+1)/LEVELS.length)+'%';$('#dlab').textContent=(level+1)+'/'+LEVELS.length;}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(480);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(380);}

/* ---------- render ---------- */
function inPath(r,c){return path.some(p=>p[0]===r&&p[1]===c);}
function isGem(r,c){return cur.gems.some(g=>g[0]===r&&g[1]===c);}
function gemVisited(g){return path.some(p=>p[0]===g[0]&&p[1]===g[1]);}
function cellEl(r,c){return $(`#maze .cell[data-r="${r}"][data-c="${c}"]`);}
function renderMaze(){
  const maze=$('#maze');maze.innerHTML='';
  maze.style.gridTemplateColumns=`repeat(${cur.C},${CELL}px)`;
  maze.style.gridTemplateRows=`repeat(${cur.R},${CELL}px)`;
  for(let r=0;r<cur.R;r++)for(let c=0;c<cur.C;c++){
    const d=document.createElement('div');d.className='cell';d.dataset.r=r;d.dataset.c=c;
    const wallTop=r>0&&!cur.open.has(edgeKey([r,c],[r-1,c]));
    const wallLeft=c>0&&!cur.open.has(edgeKey([r,c],[r,c-1]));
    const wallBottom=r===cur.R-1||!cur.open.has(edgeKey([r,c],[r+1,c]));
    const wallRight=c===cur.C-1||!cur.open.has(edgeKey([r,c],[r,c+1]));
    d.style.borderTopColor=(r===0||wallTop)?'var(--wall)':'transparent';
    d.style.borderLeftColor=(c===0||wallLeft)?'var(--wall)':'transparent';
    d.style.borderBottomColor=wallBottom?'var(--wall)':'transparent';
    d.style.borderRightColor=wallRight?'var(--wall)':'transparent';
    if(r===cur.start[0]&&c===cur.start[1]);
    else if(r===cur.goal[0]&&c===cur.goal[1])d.textContent='🚩';
    else if(isGem(r,c))d.textContent=gemVisited([r,c])?'':'💎';
    if(inPath(r,c))d.classList.add('path');
    maze.appendChild(d);
  }
  positionWalker();
}
function positionWalker(){
  const p=last(path)||cur.start;
  $('#walker').style.left=(p[1]*(CELL+0)+CELL/2+4)+'px';
  $('#walker').style.top=(p[0]*(CELL+0)+CELL/2+4)+'px';
}
function updateGoState(){
  const atGoal=last(path)&&last(path)[0]===cur.goal[0]&&last(path)[1]===cur.goal[1];
  const gemsOk=cur.gems.every(g=>gemVisited(g));
  $('#go').classList.toggle('ready',phase!=='demo'&&!locked&&atGoal&&gemsOk);
}

/* ---------- gameplay ---------- */
function markFirstAction(){if(!T.firstActed){T.firstActed=true;T.rtFirsts.push(Date.now()-T.itemStart);}}
function tryStepTo(r,c){
  if(locked)return;
  markFirstAction();
  const end=last(path);
  const isAdjOpen=Math.abs(end[0]-r)+Math.abs(end[1]-c)===1&&cur.open.has(edgeKey(end,[r,c]));
  const prev=path.length>1?path[path.length-2]:null;
  if(prev&&prev[0]===r&&prev[1]===c){path.pop();T.revisions++;log(`↩︎ backtrack to (${r+1},${c+1})`);}
  else if(isAdjOpen&&!inPath(r,c)){path.push([r,c]);log(`step → (${r+1},${c+1})`);}
  else{
    log(`✗ blocked at (${r+1},${c+1})`);
    const cell=cellEl(r,c);if(cell){cell.classList.add('reject');setTimeout(()=>cell.classList.remove('reject'),300);}
    $('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),350);
    return;
  }
  renderMaze();renderMeters();updateGoState();
}
function tryDir(dr,dc){const end=last(path);tryStepTo(end[0]+dr,end[1]+dc);}
function undo(){if(locked||path.length<=1)return;const p=path[path.length-2];tryStepTo(p[0],p[1]);}
function renderItem(item){
  cur=item;path=[item.start];T.revisions=0;T.itemStart=Date.now();T.firstActed=false;
  renderMaze();renderMeters();updateGoState();
}
async function animateWalk(){
  locked=true;
  const seq=path.slice();
  for(const p of seq){$('#walker').style.left=(p[1]*CELL+CELL/2+4)+'px';$('#walker').style.top=(p[0]*CELL+CELL/2+4)+'px';await sleep(180);}
}
async function submit(){
  if(locked)return;
  locked=true;
  const rt=Date.now()-T.itemStart;
  await animateWalk();
  const taken=path.length-1;
  const exact=taken===cur.optimal;
  if(phase==='warmup'){log(exact?'warm-up optimal! — UNSCORED':`warm-up solved in ${taken} (optimal ${cur.optimal}) — UNSCORED`);setTimeout(nextPhase,1000);return;}
  T.scored++;T.rts.push(rt);
  if(exact)T.exact++;
  if(level>=T.maxLevel)T.hardMs=Math.max(T.hardMs,rt);
  T.levelSeries.push(level);
  T.maxLevel=exact?Math.max(T.maxLevel,level):T.maxLevel;
  level=exact?Math.min(level+1,LEVELS.length-1):Math.max(level-1,0);
  log(`SUBMIT lvl${cur.lvl+1} → ${taken} steps (optimal ${cur.optimal})${exact?' OPTIMAL':' not shortest'} · rev ${T.revisions}`);
  renderMeters();
  setTimeout(nextPhase,1200);
}
function nextPhase(){
  locked=false;
  if(phase==='warmup'){scoredIndex=0;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<6?startScored():finish();}
}
function startWarmup(){phase='warmup';locked=false;$('#phasecue').textContent='\u2b50';renderItem(genItem(0));log('— warm-up (unscored) —');}
function startScored(){phase='scored';$('#phasecue').textContent='\ud83c\udfaf';renderItem(genItem(level));log(`— SCORED item ${scoredIndex+1}/6 · level ${level+1} · optimal ${cur.optimal} steps —`);}
function finish(){phase='done';$('#phasecue').textContent='\ud83c\udfc6';locked=true;log(`— DONE · optimal routes ${T.exact}/${T.scored} · ceiling level ${T.maxLevel+1} —`);}

async function runDemo(){
  phase='demo';$('#phasecue').textContent='\ud83d\udc41\ufe0f';locked=true;
  const R=3,C=3,start=[0,0],goal=[2,2];
  const open=new Set([edgeKey([0,0],[0,1]),edgeKey([0,1],[0,2]),edgeKey([0,2],[1,2]),edgeKey([1,2],[2,2])]);
  renderItem({R,C,open,start,goal,gems:[],optimal:4,lvl:-1});
  log('ghost-hand demo (wordless, <10s)');ghostShow(true);await sleep(300);
  const steps=[[0,1],[0,2],[1,2],[2,2]];
  for(const[r,c] of steps){await ghostTo(cellEl(r,c));await ghostTap();tryStepTo(r,c);await sleep(120);}
  await sleep(200);await ghostTo($('#go'));await ghostTap();await submit();
  await sleep(300);ghostShow(false);await sleep(300);startWarmup();
}

$('#maze').addEventListener('click',e=>{const d=e.target.closest('.cell');if(!d||locked||phase==='demo'||phase==='done')return;tryStepTo(+d.dataset.r,+d.dataset.c);});
$('#up').addEventListener('click',()=>{if(!locked&&phase!=='demo'&&phase!=='done')tryDir(-1,0);});
$('#down').addEventListener('click',()=>{if(!locked&&phase!=='demo'&&phase!=='done')tryDir(1,0);});
$('#left').addEventListener('click',()=>{if(!locked&&phase!=='demo'&&phase!=='done')tryDir(0,-1);});
$('#right').addEventListener('click',()=>{if(!locked&&phase!=='demo'&&phase!=='done')tryDir(0,1);});
$('#undo').addEventListener('click',()=>{if(!locked&&phase!=='demo'&&phase!=='done')undo();});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
document.addEventListener('keydown',e=>{
  if(locked||phase==='demo'||phase==='done')return;
  if(e.key==='ArrowUp'){e.preventDefault();tryDir(-1,0);}
  else if(e.key==='ArrowDown'){e.preventDefault();tryDir(1,0);}
  else if(e.key==='ArrowLeft'){e.preventDefault();tryDir(0,-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();tryDir(0,1);}
  else if(e.key==='Backspace'){e.preventDefault();undo();}
});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
