<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-nback-01 — Match Parade (n-back / dual n-back)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;--tile:#232c4d;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:460px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #stage{width:340px;height:340px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;padding:16px}
  #center{font-size:150px;transition:transform .1s,opacity .12s;opacity:0;transform:scale(.6)}
  #center.show{opacity:1;transform:scale(1)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;width:100%;height:100%}
  .cell{background:var(--tile);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700}
  .cell.on{background:#2f6df0;box-shadow:0 0 22px 4px #2f6df088;color:#fff}
  #ring{position:absolute;inset:8px;border-radius:16px;pointer-events:none;box-shadow:inset 0 0 0 0 transparent;transition:box-shadow .1s}
  #ring.tgt{box-shadow:inset 0 0 0 4px #ffd86b}
  .btns{display:flex;gap:14px}
  .big{font:600 17px system-ui;padding:16px 26px;border-radius:14px;border:2px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer;min-width:140px}
  .big:active{transform:scale(.97)}
  .big.flash{background:var(--good);color:#05261a;border-color:transparent}
  .big.wrong{background:var(--bad);border-color:transparent}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:7px 12px;background:#182042}
  .seg button.on{background:var(--warn);color:#3a2c00;font-weight:600}
  #cue{font-size:26px;height:32px}
  .tel{width:315px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>👾 Match Parade <span class="badge" id="bmode">2-back</span></h1>
    <p class="sub">Tap <b>MATCH</b> when what you see now is the same as <b id="ntxt">2</b> steps ago. Keep watching — it never stops!</p>
  </div>
  <div id="stage">
    <div id="ring"></div>
    <div id="center">🐵</div>
    <div class="grid" id="grid" style="display:none"></div>
  </div>
  <div id="cue">👀</div>
  <div class="btns" id="btns">
    <button class="big" id="mMatch">MATCH! ✋</button>
  </div>
  <div class="row">
    <div class="seg" id="nseg">
      <button data-n="1">1-back</button>
      <button data-n="2" class="on">2-back</button>
      <button data-n="3">3-back</button>
    </div>
    <div class="seg" id="modeseg">
      <button data-m="single" class="on">Single</button>
      <button data-m="dual">Dual (where+what)</button>
    </div>
    <label class="sub" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="adapt" checked> adaptive n</label>
  </div>
  <div class="row">
    <button class="pri" id="go">▶ Watch how it works</button>
    <button id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>

<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const center=$("#center"), grid=$("#grid"), ring=$("#ring"), cue=$("#cue"), btns=$("#btns");
const EMO=["🐵","🐶","🐸","🦊","🐼","🐷","🦁","🐨"];
const LET=["A","B","C","D","E","F"];
for(let i=0;i<9;i++){const d=document.createElement("div");d.className="cell";grid.appendChild(d);}
const gcells=[...grid.children];

let N=2, modeDual=false;
const T={phase:"idle",n:2,mode:"single",stepMs:2500,
  hit:0,miss:0,fa:0,cr:0,target:0,
  hitRT:[],lures:0,dprime:0,acc:0,
  blocks:0,driftAcc:[],nMax:0,updateCost:[],log:[]};
function qnorm(p){p=Math.min(1-1e-6,Math.max(1e-6,p));
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239];
  const b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572];
  const c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783];
  const d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];const pl=0.02425;
  if(p<pl){const q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p<=1-pl){const q=p-.5,r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
  const q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m;}
function dprime(){const t=T.target,nt=T.cr+T.fa;if(!t||!nt)return 0;
  let h=T.hit/t,f=T.fa/nt;h=Math.min(1-0.5/t,Math.max(0.5/t,h));f=Math.min(1-0.5/nt,Math.max(0.5/nt,f));
  return qnorm(h)-qnorm(f);}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop();}
function render(){
  const tot=T.hit+T.miss+T.fa+T.cr;const acc=tot?Math.round(100*(T.hit+T.cr)/tot):0;
  T.dprime=dprime();
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-nback-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>level</span><b>${T.n}-back ${T.mode==="dual"?"(dual)":""}</b></div>
  <div class="kv"><span>step pace</span><b>${T.stepMs} ms</b></div>
  <div class="kv"><span>max n sustained <span class="m">M-NLEVEL</span></span><b>${T.nMax||"—"}</b></div>
  <h2>Signal detection</h2>
  <div class="kv"><span>hits / targets</span><b>${T.hit}/${T.target}</b></div>
  <div class="kv"><span>misses</span><b>${T.miss}</b></div>
  <div class="kv"><span>false alarms</span><b>${T.fa}</b></div>
  <div class="kv"><span>sensitivity d′ <span class="m">M-DPRIME</span></span><b>${T.dprime.toFixed(2)}</b></div>
  <div class="kv"><span>overall acc <span class="m">M-ACC</span></span><b>${acc}%</b></div>
  <div class="kv"><span>lure FAs (n±1) <span class="m">M-ERRTYPE</span></span><b>${T.lures}</b></div>
  <h2>Timing (worst-perf lens)</h2>
  <div class="kv"><span>hit RT median <span class="m">M-RT</span></span><b>${Math.round(median(T.hitRT))} ms</b></div>
  <div class="kv"><span>hit-RT CV <span class="m">M-RTVAR</span></span><b>${cv(T.hitRT).toFixed(2)}</b></div>
  <div class="kv"><span>lapses(&gt;1.5s) <span class="m">M-LAPSE</span></span><b>${T.hitRT.filter(x=>x>1500).length}</b></div>
  <h2>Load & drift</h2>
  <div class="kv"><span>updating cost/level <span class="m">M-UPDATECOST</span></span><b>${T.updateCost.length?T.updateCost.map(x=>x+"%").join(" → "):"—"}</b></div>
  <div class="kv"><span>drift (acc by block) <span class="m">M-DRIFT</span></span><b>${T.driftAcc.length?T.driftAcc.map(x=>x+"%").join(","):"—"}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
function median(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}
render();

function setStage(){
  if(modeDual){center.style.display="none";grid.style.display="grid";btns.innerHTML=
    '<button class="big" id="mPos">WHERE ▣</button><button class="big" id="mLet">WHAT 🔤</button>';}
  else{center.style.display="block";grid.style.display="none";btns.innerHTML='<button class="big" id="mMatch">MATCH! ✋</button>';}
}

// step state
let step=null;
function bindButtons(){
  btns.querySelectorAll(".big").forEach(b=>b.onclick=()=>respond(b));
}
function respond(b){
  if(!step||step.done)return;const now=performance.now();
  if(!modeDual){
    if(step.rPos!=null)return; // one response per step
    step.rPos=now-step.onset;flash(b);
  }else{
    if(b.id==="mPos"){if(step.rPos!=null)return;step.rPos=now-step.onset;flash(b);}
    else{if(step.rLet!=null)return;step.rLet=now-step.onset;flash(b);}
  }
}
function flash(b){b.classList.add("flash");setTimeout(()=>b.classList.remove("flash"),180);}

function genStream(len){
  // returns arrays for emo (single) OR pos+let (dual). ~33% targets, some lures.
  const emo=[],pos=[],let_=[];
  for(let i=0;i<len;i++){
    // EMO / single stream
    let e;
    if(i>=N && Math.random()<0.34){e=emo[i-N];}         // target
    else{ do{e=EMO[Math.random()*EMO.length|0];}while(i>=N&&e===emo[i-N]); 
          // inject lure ~ off by one
          if(i>=N+1 && Math.random()<0.25){e=emo[i-N+1];} }
    emo.push(e);
    // POS + LET for dual (independent targets)
    let p,l;
    if(i>=N && Math.random()<0.34)p=pos[i-N]; else{do{p=Math.random()*9|0;}while(i>=N&&p===pos[i-N]);}
    if(i>=N && Math.random()<0.34)l=let_[i-N]; else{do{l=LET[Math.random()*LET.length|0];}while(i>=N&&l===let_[i-N]);}
    pos.push(p);let_.push(l);
  }
  return {emo,pos,let_};
}

async function runBlock(scored,len){
  const S=genStream(len);
  let blkHit=0,blkTgt=0,blkTot=0,blkGood=0;
  for(let i=0;i<len;i++){
    step={i,onset:0,rPos:null,rLet:null,done:false};
    // targets
    const tgtE = i>=N && S.emo[i]===S.emo[i-N];
    const tgtP = i>=N && S.pos[i]===S.pos[i-N];
    const tgtL = i>=N && S.let_[i]===S.let_[i-N];
    const isLure = !tgtE && i>=N+1 && S.emo[i]===S.emo[i-N+1];
    // present
    ring.className="";
    if(!modeDual){center.textContent=S.emo[i];center.classList.add("show");}
    else{gcells.forEach(c=>c.className="cell");gcells[S.pos[i]].classList.add("on");gcells[S.pos[i]].textContent=S.let_[i];}
    step.onset=performance.now();cue.textContent="👀";
    await sleep(700);
    if(!modeDual)center.classList.remove("show");
    else{gcells[S.pos[i]].classList.remove("on");gcells[S.pos[i]].textContent="";}
    // rest of step (response window continues)
    await sleep(T.stepMs-700);
    step.done=true;
    // classify
    if(!modeDual){
      const resp=step.rPos!=null;
      if(tgtE){ blkTgt++; if(scored)T.target++; if(resp){if(scored){T.hit++;T.hitRT.push(step.rPos);}blkHit++;} else if(scored)T.miss++; }
      else { if(resp){ if(scored){T.fa++; if(isLure)T.lures++;} } else if(scored)T.cr++; }
      if(scored){blkTot++; if((tgtE&&resp)||(!tgtE&&!resp))blkGood++;}
    }else{
      // WHERE stream
      const rp=step.rPos!=null, rl=step.rLet!=null;
      if(tgtP){ if(scored)T.target++; blkTgt++; if(rp){if(scored){T.hit++;T.hitRT.push(step.rPos);}blkHit++;}else if(scored)T.miss++; }
      else { if(rp){if(scored)T.fa++;} else if(scored)T.cr++; }
      if(tgtL){ if(scored)T.target++; blkTgt++; if(rl){if(scored){T.hit++;T.hitRT.push(step.rLet);}blkHit++;}else if(scored)T.miss++; }
      else { if(rl){if(scored)T.fa++;} else if(scored)T.cr++; }
      if(scored){blkTot+=2; if(tgtP===rp)blkGood++; if(tgtL===rl)blkGood++;}
    }
    render();
  }
  cue.textContent="";
  return {acc:blkTot?Math.round(100*blkGood/blkTot):0};
}

// ---------- ghost-hand demo ----------
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();
  $("#go").disabled=true;$("#replay").disabled=true;
  const saveDual=modeDual,saveN=N;modeDual=false;N=1;setStage();
  const seq=["🐸","🐶","🐶","🦊"]; // the two 🐶 in a row => 1-back match on 3rd
  const btn=btns.querySelector(".big");
  const ghost=document.createElement("div");ghost.textContent="👆";ghost.style.cssText="position:fixed;font-size:30px;z-index:9;transition:left .35s,top .35s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  for(let i=0;i<seq.length;i++){
    center.textContent=seq[i];center.classList.add("show");cue.textContent="👀";
    const isMatch=i>0&&seq[i]===seq[i-1];
    if(isMatch){
      const r=btn.getBoundingClientRect();ghost.style.opacity="1";ghost.style.left=(r.left+r.width/2-10)+"px";ghost.style.top=(r.top+6)+"px";
      await sleep(420);btn.classList.add("flash");ring.className="tgt";await sleep(220);btn.classList.remove("flash");
    } else await sleep(700);
    center.classList.remove("show");ring.className="";await sleep(300);
  }
  cue.textContent="✅";await sleep(500);ghost.remove();
  modeDual=saveDual;N=saveN;setStage();bindButtons();
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice round";$("#go").onclick=warmup;
  $("#phasehint").textContent="Now you try — this practice round is NOT scored.";render();
}

async function warmup(){
  T.phase="warm-up (unscored)";render();$("#go").disabled=true;$("#replay").disabled=true;
  const saveN=N;N=1;$("#bmode").textContent="1-back (practice)";
  await runBlock(false,7);
  N=saveN;$("#bmode").textContent=T.n+"-back";
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Start scored game";$("#go").onclick=startScored;
  $("#phasehint").textContent="These next rounds count. If you do well, n goes up (harder).";render();
}

async function startScored(){
  T.phase="scored";render();$("#go").disabled=true;$("#replay").disabled=true;
  const nBlocks=3;let prevAcc=null;
  for(let bk=0;bk<nBlocks;bk++){
    T.blocks++;
    const r=await runBlock(true,12);
    T.driftAcc.push(r.acc);
    if(T.hit>0 && T.n>T.nMax && r.acc>=70)T.nMax=T.n;
    if(prevAcc!=null)T.updateCost.push(prevAcc-r.acc);
    prevAcc=r.acc;
    logE(`block ${T.blocks}: ${T.n}-back acc ${r.acc}% d'=${T.dprime.toFixed(2)}`);
    // adaptive n staircase
    if($("#adapt").checked){
      if(r.acc>=80)setN(Math.min(3,N+1));
      else if(r.acc<55)setN(Math.max(1,N-1));
    }
    render();await sleep(600);
  }
  T.phase="done";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Play again";$("#go").onclick=startScored;
  $("#phasehint").textContent=`Done. Peak sustained level: ${T.nMax||"n/a"}-back, d′=${T.dprime.toFixed(2)}. Consistency (low CV, few lapses) matters more than raw speed.`;
  cue.textContent="🏁";render();
}

function setN(n){N=n;T.n=n;[...$("#nseg").children].forEach(x=>x.classList.toggle("on",+x.dataset.n===n));
  $("#bmode").textContent=n+"-back"+(modeDual?" · dual":"");$("#ntxt").textContent=n;render();}

$("#go").onclick=demo;$("#replay").onclick=demo;
$("#nseg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setN(+b.dataset.n);});
$("#modeseg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  modeDual=b.dataset.m==="dual";[...$("#modeseg").children].forEach(x=>x.classList.toggle("on",x===b));
  setStage();bindButtons();$("#bmode").textContent=T.n+"-back"+(modeDual?" · dual":"");logE(`mode → ${b.dataset.m}`);render();});
setStage();bindButtons();
</script>
</body>
</html>
