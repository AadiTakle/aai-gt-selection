<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-ODDBALL-01 · Odd One Out</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;--socket:#c9d3ef;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:20px;max-width:600px;width:100%}
  #field{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;background:linear-gradient(160deg,#dfe7ff,#eef1ff);border:3px solid #cfd8ff;border-radius:18px;padding:18px}
  .opt{background:#fff;border:3px solid #e2e8fb;border-radius:14px;width:92px;height:92px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
  .opt:hover{transform:translateY(-3px);border-color:#c3ccf5}
  .opt.sel{border-color:var(--accent);box-shadow:0 0 0 4px #c9d0ff;transform:translateY(-4px) scale(1.03)}
  .opt.correct{border-color:var(--good);box-shadow:0 0 0 4px #b4ecd0}
  .opt.wrong{border-color:var(--bad);box-shadow:0 0 0 4px #ffd0d0}
  .opt.gone{opacity:.25;transform:scale(.7)}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:76px;height:76px;background:var(--accent);color:#fff;font-size:32px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:52px;height:52px;background:#eef1ff;color:#5b6cff;font-size:24px}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;transition:transform .7s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}
  @keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mid.prop{color:#ffd479}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:210px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-ODDBALL-01 · Odd One Out</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="field"></div>
      <div id="controls">
        <button id="replay" title="replay demo">↻</button>
        <button id="go" title="submit">✓</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length),last=a=>a[a.length-1],maxv=a=>Math.max(...a);
function sd(a){if(a.length<2)return 0;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1));}
function median(a){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
const PAL={red:'#e6194b',green:'#2ca25f',blue:'#4363d8',orange:'#f58231',purple:'#911eb4'};
const COLORKEYS=Object.keys(PAL),SH=['circle','square','triangle','diamond','star','hexagon'];
function polyPts(cx,cy,r,n,rot){let p=[];for(let i=0;i<n;i++){let a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function starPts(cx,cy,r,n){let p=[];for(let i=0;i<2*n;i++){let rr=i%2?r*0.45:r;let a=-Math.PI/2+i*Math.PI/n;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(' ');}
function oneShape(shape,color,cx,cy,r){const f='fill="'+color+'"';switch(shape){
  case 'circle':return `<circle cx="${cx}" cy="${cy}" r="${r}" ${f}/>`;
  case 'square':return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="3" ${f}/>`;
  case 'triangle':return `<polygon points="${polyPts(cx,cy,r,3,-Math.PI/2)}" ${f}/>`;
  case 'diamond':return `<polygon points="${polyPts(cx,cy,r,4,-Math.PI/2)}" ${f}/>`;
  case 'hexagon':return `<polygon points="${polyPts(cx,cy,r,6,-Math.PI/2)}" ${f}/>`;
  case 'star':return `<polygon points="${starPts(cx,cy,r,5)}" ${f}/>`;}return '';}
function tileSVG(a,box=84){const color=PAL[a.color]||a.color,n=a.count||1;let inner='';
  if(n===1)inner=oneShape(a.shape,color,box/2,box/2,box*0.30);
  else{const pos=n===2?[[.3,.5],[.7,.5]]:n===3?[[.24,.5],[.5,.5],[.76,.5]]:[[.3,.3],[.7,.3],[.3,.7],[.7,.7]];
    const r=box*(n>=4?.13:.15);pos.slice(0,n).forEach(p=>inner+=oneShape(a.shape,color,p[0]*box,p[1]*box,r));}
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${inner}</svg>`;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- odd-one-out generator (AIG) ---------- */
const VALS={shape:SH,color:COLORKEYS,count:[1,2,3]};
function randFig(){return{shape:SH[(Math.random()*SH.length)|0],color:COLORKEYS[(Math.random()*COLORKEYS.length)|0],count:1+((Math.random()*3)|0)};}
function genOdd(nFig,salient){
  const C=['shape','color','count'][(Math.random()*3)|0];const vs=shuffle(VALS[C]);const v=vs[0],vOdd=vs[1];
  const figs=[];for(let i=0;i<nFig;i++){const f=randFig();f[C]=v;if(salient){/*keep others varied but tame*/}figs.push(f);}
  const oddIdx=(Math.random()*nFig)|0;const odd=randFig();odd[C]=vOdd;figs[oddIdx]=odd;
  const decoyAttr=['shape','color','count'].filter(a=>a!==C)[(Math.random()*2)|0];
  let decoyIdx=-1;for(let i=0;i<nFig;i++){if(i!==oddIdx){decoyIdx=i;break;}}
  if(decoyIdx>=0){const dv=VALS[decoyAttr];figs[decoyIdx][decoyAttr]=decoyAttr==='count'?3:dv[dv.length-1];
    for(let i=0;i<nFig;i++){if(i!==decoyIdx&&i!==oddIdx&&figs[i][decoyAttr]===figs[decoyIdx][decoyAttr])figs[i][decoyAttr]=decoyAttr==='count'?1:dv[0];}}
  return {figs,oddIdx,C,decoyIdx,decoyAttr};}

/* ---------- telemetry ---------- */
const T={scored:0,correct:0,rts:[],crts:[],firstLat:null,lastErr:'\u2014',itemStart:0,firstActed:false};
function cvStr(){if(T.crts.length<2)return `n=${T.crts.length} correct (need \u22652)`;return `CV ${Math.round(100*sd(T.crts)/mean(T.crts))}%  (n=${T.crts.length})`;}
function lapseStr(){if(!T.rts.length)return '\u2014';const thr=median(T.rts)*1.4;const slow=T.rts.filter(x=>x>thr).length;return `slowest ${maxv(T.rts)}ms · ${slow} slow`;}
const METERS=[
 {id:'M-ACC',name:'Item accuracy (running)',get:()=>T.scored?`${T.correct}/${T.scored}  ${Math.round(100*T.correct/T.scored)}%`:'\u2014'},
 {id:'M-RT',name:'Response time — total',get:()=>T.rts.length?`${last(T.rts)} ms  (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-RTVAR',name:'Intra-individual RT variability',get:()=>cvStr()},
 {id:'M-LAPSE',name:'Lapse rate (worst-performance)',get:()=>lapseStr()},
 {id:'M-ERRTYPE',name:'Error type (alt-rule near-miss)',get:()=>T.lastErr},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(650);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(480);}

/* ---------- flow ---------- */
let phase='demo',cur=null,staged=-1,locked=false,trial=0;
const scoredTrials=[genOdd(4,true),genOdd(4,true),genOdd(5,false),genOdd(6,false),genOdd(6,false)];
function setCue(i){$('#phasecue').textContent=i;}
function disableField(d){locked=d;}
function renderTrial(item){cur=item;const f=$('#field');f.innerHTML='';
  item.figs.forEach((fig,i)=>{const b=document.createElement('div');b.className='opt';b.dataset.i=i;b.innerHTML=tileSVG(fig);f.appendChild(b);});
  $('#go').classList.remove('ready');staged=-1;T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;renderMeters();}
function onFig(el){if(locked||phase==='demo'||phase==='done')return;const idx=+el.dataset.i;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first tap · figure '+idx);}
  staged=idx;$$('#field .opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');$('#go').classList.add('ready');}
function feedback(correct){const opt=$$('#field .opt')[staged];if(opt)opt.classList.add(correct?'correct':'wrong');
  if(!correct){$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),450);$$('#field .opt')[cur.oddIdx].classList.add('correct');}
  else $$('#field .opt')[cur.oddIdx].classList.add('correct');
  disableField(true);$('#go').classList.remove('ready');}
function submit(){if(staged===-1)return;const rt=Date.now()-T.itemStart;const correct=staged===cur.oddIdx;
  if(phase==='warmup'){feedback(correct);log('warm-up '+(correct?'correct':'incorrect')+' — UNSCORED');setTimeout(nextPhase,900);return;}
  T.scored++;T.rts.push(rt);
  if(correct){T.correct++;T.crts.push(rt);T.lastErr='none';}
  else T.lastErr=staged===cur.decoyIdx?'near-miss (used '+cur.decoyAttr+')':'random';
  feedback(correct);
  log(`trial ${T.scored} (${cur.figs.length} figs, rule=${cur.C}) \u2192 ${correct?'CORRECT':'wrong'} · RT ${rt}ms`);
  renderMeters();setTimeout(nextPhase,900);}
function nextPhase(){if(phase==='warmup'){trial=0;startScored();}else if(phase==='scored'){trial++;trial<scoredTrials.length?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('\u2b50');disableField(false);renderTrial(genOdd(4,true));log('— warm-up (unscored): one obvious odd one —');}
function startScored(){phase='scored';setCue('\ud83c\udfaf');disableField(false);renderTrial(scoredTrials[trial]);log(`— SCORED trial ${trial+1}/${scoredTrials.length} —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');disableField(true);log(`— DONE · acc ${T.correct}/${T.scored} · ${cvStr()} · ${lapseStr()} —`);}
async function runDemo(){phase='demo';setCue('\ud83d\udc41\ufe0f');disableField(true);
  cur={figs:[{shape:'triangle',color:'blue',count:1},{shape:'triangle',color:'blue',count:1},{shape:'triangle',color:'blue',count:1},{shape:'circle',color:'blue',count:1}],oddIdx:3,C:'shape',decoyIdx:0,decoyAttr:'color'};
  renderTrial(cur);log('ghost-hand demo (wordless, <10s)');ghostShow(true);await sleep(300);
  const opts=$$('#field .opt');for(let i=0;i<3;i++){await ghostTo(opts[i]);await sleep(120);}
  await ghostTo(opts[3]);await ghostTap();opts[3].classList.add('correct');opts[3].classList.add('sel');
  await sleep(450);await ghostTo($('#go'));await ghostTap();await sleep(350);ghostShow(false);await sleep(500);startWarmup();}
$('#field').addEventListener('click',e=>{const o=e.target.closest('.opt');if(o)onFig(o);});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
