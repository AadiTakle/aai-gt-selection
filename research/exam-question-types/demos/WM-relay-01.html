<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-relay-01 — Brain Arcade Relay (integrated EF)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;--tile:#232c4d;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:480px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #banner{display:flex;align-items:center;gap:10px;font-size:22px;padding:6px 18px;border-radius:99px;border:2px solid var(--edge);background:#141a30;transition:border-color .2s,background .2s}
  #banner.hold{border-color:#7aa2ff}#banner.stop{border-color:#ff8f5c}#banner.switch{border-color:#4be08a}
  #banner .icon{font-size:26px}
  #play{width:470px;min-height:240px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px;position:relative;cursor:default}
  #play.tap{cursor:pointer}
  #big{font-size:92px;min-height:100px;display:flex;align-items:center;justify-content:center;transition:transform .1s,opacity .1s;opacity:0;transform:scale(.6)}
  #big.show{opacity:1;transform:scale(1)}
  #cuemini{font-size:22px;height:28px;color:var(--warn)}
  .slots,.tray{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .slot{width:56px;height:56px;border-radius:12px;border:2px dashed var(--edge);display:flex;align-items:center;justify-content:center;font-size:34px;background:#141a30}
  .slot.filled{border-style:solid;border-color:var(--accent);background:var(--tile)}
  .slot.ok{border-color:var(--good)}.slot.no{border-color:var(--bad)}
  .chip{width:54px;height:54px;border-radius:12px;border:1px solid var(--edge);background:#20284a;font-size:32px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .yn{display:flex;gap:40px}
  .ynb{width:110px;height:60px;font-size:22px;font-weight:600;border-radius:14px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  .ynb.ok{background:var(--good);color:#062a17}.ynb.no{background:var(--bad);color:#3a0011}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.pri{background:var(--accent);color:#062033;border:none;font-weight:600;padding:9px 15px;border-radius:10px;cursor:pointer;font-size:15px}
  button.pri:disabled{opacity:.4}
  .tel{width:322px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:140px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🕹️ Brain Arcade Relay <span class="badge">The mini-game keeps swapping</span></h1>
    <p class="sub">Watch the banner. <b>🧠 Hold</b> = tap back the last 2. <b>🛑 Stop</b> = tap butterflies, freeze on bees. <b>🔀 Switch</b> = answer the asked feature.</p>
  </div>
  <div id="banner"><span class="icon" id="stIcon">👀</span><span id="stLbl">get ready</span></div>
  <div id="play">
    <div id="big"></div>
    <div id="cuemini"></div>
    <div class="slots hidden" id="resp"></div>
    <div class="tray hidden" id="tray"></div>
    <div class="yn hidden" id="yn">
      <button class="ynb" id="btnY">YES ✓</button>
      <button class="ynb" id="btnN">NO ✕</button>
    </div>
  </div>
  <div class="row"><button class="pri" id="go">▶ Watch how it works</button></div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>

<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const big=$("#big"),cuemini=$("#cuemini"),resp=$("#resp"),tray=$("#tray"),play=$("#play");
const HOLDSET=["🍎","⭐","🚗","🌙","🐶","🎈"];
const rand=a=>a[Math.random()*a.length|0];
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sd=a=>a.length<2?0:Math.sqrt(mean(a.map(x=>(x-mean(a))**2)));
const cv=a=>{const m=mean(a);return m?sd(a)/m:0;};
const T={phase:"idle",correct:0,total:0,
  st:{hold:[],stop:[],switch:[]}, rtC:[], firstRT:[], laterRT:[],
  comm:0,nogo:0, blur:0, driftE:[],driftL:[], log:[]};
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop();}
window.addEventListener("blur",()=>{T.blur++;render();});
function stAcc(k){const a=T.st[k];return a.length?Math.round(100*mean(a)):0;}
function consist(){const parts=Object.values(T.st).filter(a=>a.length>=2).map(a=>1-2*sd(a));
  return parts.length?Math.max(0,Math.round(100*mean(parts))):0;}
function render(){
  const acc=T.total?Math.round(100*T.correct/T.total):0;
  const gsc=(T.firstRT.length&&T.laterRT.length)?Math.round(mean(T.firstRT)-mean(T.laterRT)):0;
  const drift=(T.driftE.length&&T.driftL.length)?(Math.round(100*mean(T.driftL))-Math.round(100*mean(T.driftE))):0;
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-relay-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>overall accuracy <span class="m">M-ACC</span></span><b>${acc}% <span class="m">(${T.correct}/${T.total})</span></b></div>
  <h2>Component profile <span class="m">M-ACC by station</span></h2>
  <div class="kv"><span>🧠 hold (updating)</span><b>${stAcc("hold")}%</b></div>
  <div class="kv"><span>🛑 stop (inhibition)</span><b>${stAcc("stop")}%</b></div>
  <div class="kv"><span>🔀 switch (shifting)</span><b>${stAcc("switch")}%</b></div>
  <h2>Global switch cost <span class="m">M-SWITCHCOST</span></h2>
  <div class="kv"><span>post-rotation RT</span><b>${T.firstRT.length?Math.round(mean(T.firstRT)):0} ms</b></div>
  <div class="kv"><span>within-station RT</span><b>${T.laterRT.length?Math.round(mean(T.laterRT)):0} ms</b></div>
  <div class="kv"><span>cost (post−within)</span><b>${gsc>0?"+":""}${gsc} ms</b></div>
  <h2>Inhibition <span class="m">M-COMM</span></h2>
  <div class="kv"><span>commission (bee taps)</span><b>${T.comm}/${T.nogo}</b></div>
  <h2>Composite gating</h2>
  <div class="kv"><span>RT variability <span class="m">M-RTVAR</span></span><b>${cv(T.rtC).toFixed(2)}</b></div>
  <div class="kv"><span>cross-station consist <span class="m">M-CONSIST</span></span><b>${consist()}%</b></div>
  <div class="kv"><span>drift late−early <span class="m">M-DRIFT</span></span><b>${drift>0?"+":""}${drift}%</b></div>
  <div class="kv"><span>focus-loss <span class="m">M-ENGAGE</span></span><b>${T.blur}</b></div>
  <div class="kv"><span>operating point <span class="m">M-SPEEDACC</span></span><b>${acc}% @ ${Math.round(mean(T.rtC))}ms</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();

function setStation(st){const b=$("#banner");b.className=st;
  const map={hold:["🧠","Hold: tap back the last 2"],stop:["🛑","Stop: tap 🦋, freeze on 🐝"],switch:["🔀","Switch: answer the feature"]};
  $("#stIcon").textContent=map[st][0];$("#stLbl").textContent=map[st][1];}
function showEls(o){resp.classList.toggle("hidden",!o.resp);tray.classList.toggle("hidden",!o.tray);$("#yn").classList.toggle("hidden",!o.yn);play.classList.toggle("tap",!!o.tap);}

// ---- STOP trial (go/no-go) ----
function stopTrial(scored,isFirst){return new Promise(res=>{
  showEls({});const nogo=Math.random()<0.28;T.nogo+=scored&&nogo?1:0;
  big.textContent=nogo?"🐝":"🦋";big.classList.add("show");
  const onset=performance.now();let done=false;const win=1150;
  function finish(tapped,rt){if(done)return;done=true;play.onclick=null;play.classList.remove("tap");
    let ok;if(nogo){ok=!tapped;if(tapped&&scored)T.comm++;}else{ok=tapped;}
    big.style.filter=ok?"none":"grayscale(1)";
    if(scored){T.total++;T.st.stop.push(ok?1:0);(driftIdx<half?T.driftE:T.driftL).push(ok?1:0);
      if(ok)T.correct++;
      if(!nogo&&tapped){T.rtC.push(rt);(isFirst?T.firstRT:T.laterRT).push(rt);}
      logE(`stop ${nogo?"nogo":"go"} ${ok?"✔":"✗"}`);render();}
    setTimeout(()=>{big.classList.remove("show");big.style.filter="none";res();},420);}
  play.classList.add("tap");play.onclick=()=>finish(true,performance.now()-onset);
  setTimeout(()=>finish(false,0),win);
});}

// ---- SWITCH trial (cued feature judgment) ----
let prevSwitch=null;
function switchTrial(scored,isFirst){return new Promise(res=>{
  showEls({yn:true});const byColor=Math.random()<0.5;
  const isRed=Math.random()<0.5;const isStar=Math.random()<0.5;
  cuemini.textContent=byColor?"red?":"star?";
  big.textContent=(isStar?"★":"●");
  big.style.color=isRed?"#ff5c5c":"#4da1ff";
  const yes=byColor?isRed:isStar;
  const isSw = prevSwitch!==null && prevSwitch!==byColor; prevSwitch=byColor;
  const onset=performance.now();let done=false;
  function pick(ans){if(done)return;done=true;$("#btnY").onclick=$("#btnN").onclick=null;
    const ok=ans===yes;const rt=performance.now()-onset;
    (ans?$("#btnY"):$("#btnN")).classList.add(ok?"ok":"no");
    if(scored){T.total++;T.st.switch.push(ok?1:0);(driftIdx<half?T.driftE:T.driftL).push(ok?1:0);
      if(ok)T.correct++;T.rtC.push(rt);(isFirst?T.firstRT:T.laterRT).push(rt);
      logE(`switch ${byColor?"col":"shp"}${isSw?"·sw":""} ${ok?"✔":"✗"} ${Math.round(rt)}ms`);render();}
    cuemini.textContent="";big.style.color="";
    setTimeout(()=>{$("#btnY").className="ynb";$("#btnN").className="ynb";res();},380);}
  $("#btnY").onclick=()=>pick(true);$("#btnN").onclick=()=>pick(false);
});}

// ---- HOLD trial (running/hold last 2) ----
function holdTrial(scored){return new Promise(async res=>{
  showEls({});const seq=[rand(HOLDSET),rand(HOLDSET),rand(HOLDSET)];
  for(const e of seq){big.textContent=e;big.classList.add("show");await sleep(620);big.classList.remove("show");await sleep(150);}
  cuemini.textContent="last 2?";showEls({resp:true,tray:true});
  resp.innerHTML="";for(let i=0;i<2;i++){const d=document.createElement("div");d.className="slot";resp.appendChild(d);}
  tray.innerHTML="";HOLDSET.forEach(e=>{const c=document.createElement("div");c.className="chip";c.textContent=e;tray.appendChild(c);});
  const lastK=seq.slice(-2);let done=false;
  tray.onclick=e=>{const c=e.target.closest(".chip");if(!c||done)return;
    const s=resp.querySelector(".slot:not(.filled)");if(!s)return;s.textContent=c.textContent;s.classList.add("filled");
    if(![...resp.querySelectorAll(".slot")].some(x=>!x.classList.contains("filled"))){done=true;tray.onclick=null;
      const ss=[...resp.querySelectorAll(".slot")];let nc=0;ss.forEach((sl,i)=>{const ok=sl.textContent===lastK[i];
        if(ok){nc++;sl.classList.add("ok");}else sl.classList.add("no");});
      const all=nc===2;
      if(scored){T.total++;T.st.hold.push(all?1:0);(driftIdx<half?T.driftE:T.driftL).push(all?1:0);if(all)T.correct++;
        logE(`hold ${nc}/2 ${all?"✔":"✗"}`);render();}
      cuemini.textContent="";setTimeout(()=>{showEls({});res();},520);}
  };
});}

// ---- relay driver ----
let driftIdx=0,half=9;
async function runRelay(scored){
  $("#go").disabled=true;
  const cycle=["hold","stop","switch"];const blocks=scored?[...cycle,...cycle]:["hold","stop","switch"];
  driftIdx=0;let count=0;blocks.forEach(b=>count+=b==="stop"?4:b==="switch"?4:2);half=Math.ceil(count/2);
  for(const st of blocks){
    setStation(st);await sleep(560);
    if(st==="hold"){for(let i=0;i<2;i++){await holdTrial(scored);driftIdx++;}}
    else if(st==="stop"){for(let i=0;i<4;i++){await stopTrial(scored,i===0);driftIdx++;}}
    else {prevSwitch=null;for(let i=0;i<4;i++){await switchTrial(scored,i===0);driftIdx++;}}
  }
  $("#stIcon").textContent="🏁";$("#stLbl").textContent="round complete";$("#go").disabled=false;
}

async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;
  const ghost=document.createElement("div");ghost.textContent="👆";
  ghost.style.cssText="position:fixed;font-size:30px;z-index:20;transition:left .4s,top .4s;pointer-events:none";document.body.appendChild(ghost);
  // HOLD demo
  setStation("hold");showEls({});await sleep(500);
  const seq=["🍎","⭐"];for(const e of seq){big.textContent=e;big.classList.add("show");await sleep(560);big.classList.remove("show");await sleep(140);}
  cuemini.textContent="last 2?";showEls({resp:true,tray:true});
  resp.innerHTML="";for(let i=0;i<2;i++){const d=document.createElement("div");d.className="slot";resp.appendChild(d);}
  tray.innerHTML="";HOLDSET.forEach(e=>{const c=document.createElement("div");c.className="chip";c.textContent=e;tray.appendChild(c);});
  for(let i=0;i<2;i++){const chip=[...tray.querySelectorAll(".chip")].find(c=>c.textContent===seq[i]);const s=resp.querySelector(".slot:not(.filled)");
    const r=chip.getBoundingClientRect();ghost.style.left=(r.left+14)+"px";ghost.style.top=(r.top+6)+"px";await sleep(520);
    s.textContent=chip.textContent;s.classList.add("filled","ok");await sleep(200);}
  cuemini.textContent="✅";await sleep(500);showEls({});cuemini.textContent="";
  // STOP demo
  setStation("stop");big.textContent="🦋";big.classList.add("show");
  let r=play.getBoundingClientRect();ghost.style.left=(r.left+r.width/2)+"px";ghost.style.top=(r.top+40)+"px";await sleep(650);
  big.style.filter="none";await sleep(300);big.classList.remove("show");await sleep(250);
  big.textContent="🐝";big.classList.add("show");ghost.style.top=(r.top-40)+"px";await sleep(750);big.classList.remove("show");await sleep(250);
  // SWITCH demo
  setStation("switch");showEls({yn:true});big.textContent="★";big.style.color="#ff5c5c";cuemini.textContent="red?";
  let by=$("#btnY").getBoundingClientRect();ghost.style.left=(by.left+40)+"px";ghost.style.top=(by.top-4)+"px";await sleep(750);
  $("#btnY").classList.add("ok");await sleep(520);$("#btnY").className="ynb";cuemini.textContent="";big.style.color="";
  ghost.remove();showEls({});T.phase="idle";$("#go").disabled=false;
  $("#stIcon").textContent="👀";$("#stLbl").textContent="get ready";$("#banner").className="";
  $("#go").textContent="▶ Try a practice relay";$("#go").onclick=warmup;
  $("#phasehint").textContent="Now you try a short practice relay — NOT scored.";render();
}
async function warmup(){T.phase="warm-up (unscored)";render();await runRelay(false);
  T.phase="idle";$("#go").textContent="▶ Start scored relay";$("#go").onclick=startScored;
  $("#phasehint").textContent="This relay counts. Reset fast each time the station swaps.";render();}
async function startScored(){T.phase="scored";render();await runRelay(true);finish();}
function finish(){T.phase="done";render();
  $("#go").textContent="▶ Another relay";$("#go").onclick=startScored;
  $("#phasehint").textContent="Done. Component profile + a low global switch cost = coherent EF control (not speed).";}
$("#go").onclick=demo;
</script>
</body>
</html>
