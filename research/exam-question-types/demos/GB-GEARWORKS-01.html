<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-GEARWORKS-01 · Gearworks</title>
<style>
  :root{--bg1:#fef6e7;--bg2:#e9f0ff;--ink:#26304a;--card:#fff;--accent:#3d7bff;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:18px;max-width:560px;width:100%}
  #target{font-size:18px;font-weight:700;display:flex;gap:8px;align-items:center}
  #target .arw{font-size:34px;color:var(--accent)}
  #machine{display:flex;align-items:center;gap:10px;background:linear-gradient(160deg,#eef3ff,#fff);
    padding:16px;border-radius:18px;border:3px solid #d7e2ff}
  .wheel{width:70px;height:70px;display:flex;align-items:center;justify-content:center;font-size:46px;
    border-radius:50%;user-select:none}
  .slot{width:74px;height:74px;border:3px dashed #c7d2f2;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:44px;cursor:pointer;background:#f7faff;transition:.12s}
  .slot:hover{background:#eef4ff}
  .fixed{color:#7a5b32}
  .spin{animation:spin 1.1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  #flag{font-size:46px}
  #hint{font-size:13px;color:#93a; min-height:16px}
  #controls{display:flex;gap:14px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:70px;height:70px;background:var(--accent);color:#fff;font-size:24px;font-weight:700;
    box-shadow:0 10px 24px -8px var(--accent);animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  #replay{width:48px;height:48px;background:#eef1ff;color:#5b6cff;font-size:22px}
  .shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .7s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:200px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-GEARWORKS-01 · Gearworks</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="target">Make flag spin: <span class="arw" id="tgt">↻</span></div>
      <div id="machine"></div>
      <div id="hint">tap a peg: empty → ⚙ gear (flips) → ◍ pulley (same)</div>
      <div id="controls">
        <button id="replay" title="replay demo">↻</button>
        <button id="go" title="run">RUN ▶</button>
      </div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// crank is a gear spinning CW(+1). Each wheel: 'G' gear (flips), 'P' pulley (same), null empty (breaks chain)
// dir(flag)=+1 * product over filled wheels of (G?-1:+1); requires ALL filled to connect.
const N=3;
const LEVELS={warm:{target:-1,opt:1},s1:{target:+1,opt:0}}; // target +1=CW ↻, -1=CCW ↺ ; opt=min gears for parity
const T={scored:0,correct:0,runs:0,firstLat:null,itemStart:0,firstActed:false,placements:0,rev:0,used:0,opt:0,lastErr:'—',rts:[]};
const METERS=[
 {id:'M-ACC',name:'Correct (scored)',get:()=>T.scored?`${T.correct}/${T.scored}`:'—'},
 {id:'M-RT',name:'Response time to RUN',get:()=>T.rts.length?T.rts[T.rts.length-1]+' ms':'—'},
 {id:'M-RTFIRST',name:'First-action latency',get:()=>T.firstLat==null?'—':T.firstLat+' ms'},
 {id:'M-EFF',name:'Gears used vs minimal',get:()=>T.opt!=null&&T.usedG!=null?`${T.opt}/${T.usedG}`:'—'},
 {id:'M-PATH',name:'Placements logged',get:()=>T.placements+''},
 {id:'M-ERRTYPE',name:'Error type',get:()=>T.lastErr},
 {id:'M-REV',name:'Revisions',get:()=>T.rev+''},
 {id:'M-HYP',name:'RUN presses (tests)',get:()=>T.runs+''},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const t=T.itemStart?Date.now()-T.itemStart:0;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(700)}

let phase='demo',level=null,wheels=[];
const setCue=i=>$('#phasecue').textContent=i;
function renderMachine(){const m=$('#machine');m.innerHTML='';
  const crank=document.createElement('div');crank.className='wheel fixed';crank.id='crank';crank.textContent='⚙';m.appendChild(crank);
  for(let i=0;i<N;i++){const s=document.createElement('div');s.className='slot';s.dataset.i=i;
    s.textContent=wheels[i]==='G'?'⚙':wheels[i]==='P'?'◍':'';m.appendChild(s)}
  const flag=document.createElement('div');flag.className='wheel';flag.id='flag';flag.textContent='🚩';m.appendChild(flag)}
function newLevel(L){level={...L};wheels=Array(N).fill(null);T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;
  T.placements=0;T.rev=0;T.runs=0;T.opt=L.opt;T.usedG=null;T.lastErr='—';$('#tgt').textContent=L.target>0?'↻':'↺';renderMachine();renderMeters()}
function onSlot(el){if(phase==='demo'||phase==='done')return;const i=+el.dataset.i;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first placement')}
  const cur=wheels[i];const nxt=cur===null?'G':cur==='G'?'P':null;
  if(cur!==null)T.rev++;wheels[i]=nxt;T.placements++;log('peg'+i+': '+(nxt||'empty'));renderMachine();renderMeters()}
function computeFlag(){if(wheels.some(w=>w===null))return null; // chain broken
  let d=1;wheels.forEach(w=>{if(w==='G')d*=-1});return d}
async function spinAll(dir){ // animate: crank CW, each wheel per its dir, flag per dir
  let d=1;$('#crank').classList.add('spin');$('#crank').style.animationDirection='normal';
  $$('#machine .slot').forEach((s,i)=>{if(wheels[i]==='G')d*=-1;if(wheels[i]){s.classList.add('spin');s.style.animationDirection=d>0?'normal':'reverse'}});
  const f=$('#flag');f.classList.add('spin');f.style.animationDirection=dir>0?'normal':'reverse';await sleep(1400);
  $$('.spin').forEach(x=>{if(x.id!=='crank')x.classList.remove('spin')})}
function stopSpin(){$$('.spin').forEach(x=>x.classList.remove('spin'))}
async function run(){if(phase==='demo'||phase==='done')return;T.runs++;T.rts.push(Date.now()-T.itemStart);
  T.usedG=wheels.filter(w=>w==='G').length;const dir=computeFlag();renderMeters();
  if(dir===null){T.lastErr='chain broken (empty peg)';log('RUN → no motion (empty peg)');$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),420);renderMeters();return}
  await spinAll(dir);const ok=dir===level.target;
  if(ok){T.lastErr='none';stopSpin();$('#flag').textContent='🎉';
    if(phase==='scored'){T.scored++;T.correct++;setCue('🏆');log(`SOLVED scored · flag ${dir>0?'CW':'CCW'} · gears ${T.usedG} (min ${T.opt}) · RT ${T.rts[T.rts.length-1]}ms · firstLat ${T.firstLat}ms · rev ${T.rev}`);renderMeters();setTimeout(finish,1200)}
    else{log('warm-up solved (unscored)');setTimeout(startScored,1200)}}
  else{T.lastErr='wrong direction';stopSpin();log('RUN → flag '+(dir>0?'CW':'CCW')+' ✗ (need '+(level.target>0?'CW':'CCW')+')');
    $('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),420);setTimeout(()=>{$('#flag').textContent='🚩'},600);renderMeters()}}
function startWarmup(){phase='warmup';setCue('⭐');newLevel(LEVELS.warm);log('— warm-up (unscored): make flag ↺ —')}
function startScored(){phase='scored';setCue('🎯');newLevel(LEVELS.s1);log('— SCORED: make flag ↻ (CW). gears flip, pulleys keep direction —')}
function finish(){phase='done';log(`— DONE · correct ${T.correct}/${T.scored} —`)}
async function runDemo(){phase='demo';setCue('👁️');newLevel(LEVELS.warm);log('ghost-hand demo (wordless, <10s)');gShow(true);await sleep(300);
  // warm target is CCW(-1): one gear + two pulleys => odd gears => flip once => CCW
  const slots=$$('#machine .slot');
  await gTo(slots[0]);wheels[0]='G';renderMachine();await sleep(250);
  const s1=$$('#machine .slot');await gTo(s1[1]);wheels[1]='P';renderMachine();await sleep(200);
  const s2=$$('#machine .slot');await gTo(s2[2]);wheels[2]='P';renderMachine();await sleep(250);
  await gTo($('#go'));gShow(false);await sleep(150);
  const dir=computeFlag();await spinAll(dir);stopSpin();$('#flag').textContent='🎉';
  await sleep(900);startWarmup();
}
$('#machine').addEventListener('click',e=>{const s=e.target.closest('.slot');if(s)onSlot(s)});
$('#go').addEventListener('click',run);
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo()});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
