<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GB-FROGPOND-01 — Frog Pond</title>
<style>
:root{--bg:#0f1226;--panel:#1b2140;--panel2:#232a52;--accent:#5eead4;--accent2:#f59e0b;--good:#4ade80;--bad:#f87171;--ink:#eef1ff;--muted:#9aa3c7}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 20% -10%,#123a3a,#0f1226 60%);min-height:100vh}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1120px;margin:0 auto;padding:18px}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid #313a6b;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.phasebar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#2b336a;color:var(--muted);border:1px solid #3a447f}
.pill.on{background:var(--accent);color:#053;font-weight:700}
.prompt{font-size:15px;color:var(--muted);min-height:22px;margin:6px 0;text-align:center}
.objs{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:60px;font-size:34px}
.numeral{font-size:52px;font-weight:800;text-align:center;color:var(--accent2)}
.stage{position:relative;padding:20px 6px}
.pond{position:relative;height:150px;background:linear-gradient(180deg,#0e5b63,#0a3f52);border-radius:16px;border:1px solid #1e6f74;display:flex;align-items:center;justify-content:space-around;padding:0 8px;overflow:hidden}
.pad{position:relative;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#79d67a,#2f8f4f);border:3px solid #93e59a;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#083d1a;cursor:pointer;transition:transform .15s}
.pad:hover{transform:scale(1.08)}
.pad.correct{box-shadow:0 0 0 4px var(--good)}.pad.wrong{box-shadow:0 0 0 4px var(--bad)}
.frog{position:absolute;top:-6px;font-size:40px;z-index:6;transition:left .5s cubic-bezier(.34,1.56,.64,1),top .3s ease;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.hand{position:absolute;font-size:34px;z-index:20;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:left .7s ease,top .5s ease;opacity:0}
.row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}
button.act{font:600 15px system-ui;padding:11px 20px;border-radius:12px;border:0;cursor:pointer;background:var(--accent);color:#053}
button.act.ghost{background:#2b336a;color:var(--ink);border:1px solid #3a447f}
.fb{min-height:26px;text-align:center;font-weight:700;margin-top:12px}.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.tele{font-size:13px}.tele h2{font-size:14px;margin:0 0 8px;color:var(--accent)}
.metrics{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-bottom:10px}
.metrics div:nth-child(odd){color:var(--muted)}.metrics b{font-variant-numeric:tabular-nums}
.log{height:230px;overflow:auto;background:#12172f;border:1px solid #2a336a;border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-acc{color:var(--good)}.t-err{color:var(--bad)}.t-evt{color:#9fb0ff}.t-sys{color:var(--muted)}
.legend{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <h1>Frog Pond</h1>
    <div class="sub">Tap the lily pad with the right number so the frog hops there.</div>
    <div class="phasebar" id="phasebar"></div>
    <div class="prompt" id="prompt"></div>
    <div class="objs" id="objs"></div>
    <div class="stage">
      <div class="pond" id="pond"><div class="frog" id="frog">&#128058;</div></div>
      <div class="row"><button class="act ghost" id="nextBtn" style="display:none">Next</button></div>
      <div class="fb" id="fb"></div>
    </div>
    <div class="hand" id="hand">&#128070;</div>
  </main>
  <aside class="card tele">
    <h2>Live telemetry</h2>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="legend">Logs M-ACC, M-PAE (position % error), M-RT, M-RTFIRST, M-ERRTYPE, M-DIFFREACH (max range solved).</div>
  </aside>
</div>
<script>
(function(){
  "use strict";
  var el=function(id){return document.getElementById(id)};
  var pond=el('pond'),frog=el('frog'),hand=el('hand'),prompt=el('prompt'),objs=el('objs'),fb=el('fb'),nextBtn=el('nextBtn');
  var T0=Date.now();function now(){return Date.now()-T0;}
  var Tel={scored:0,correct:0,paeSum:0,paeN:0,rtSum:0,rtN:0,firstSum:0,firstN:0,maxReach:0,
    push:function(c,m){var d=document.createElement('div');d.className=c;d.textContent='['+(now()/1000).toFixed(2)+'s] '+m;var L=el('log');L.appendChild(d);L.scrollTop=L.scrollHeight;},
    render:function(){var acc=Tel.scored?Math.round(100*Tel.correct/Tel.scored)+'% ('+Tel.correct+'/'+Tel.scored+')':'\u2014';
      var pae=Tel.paeN?(Tel.paeSum/Tel.paeN).toFixed(1)+'%':'\u2014',rt=Tel.rtN?Math.round(Tel.rtSum/Tel.rtN)+' ms':'\u2014',fr=Tel.firstN?Math.round(Tel.firstSum/Tel.firstN)+' ms':'\u2014';
      el('metrics').innerHTML='<div>M-ACC accuracy</div><b>'+acc+'</b><div>M-PAE mean err</div><b>'+pae+'</b><div>M-RT mean</div><b>'+rt+'</b><div>M-RTFIRST mean</div><b>'+fr+'</b><div>M-DIFFREACH max</div><b>'+(Tel.maxReach||'\u2014')+'</b>';}};

  // pads are the number line as discrete stepping stones. target = one pad value.
  var items=[
    {phase:'demo',   pads:[0,1,2,3,4,5], target:3, show:'obj', icon:'\ud83d\udc1e'},
    {phase:'warmup', pads:[0,1,2,3,4,5], target:2, show:'obj', icon:'\ud83e\udd8b'},
    {phase:'scored', pads:[0,2,4,6,8,10],target:6, show:'obj', icon:'\ud83c\udf3c'},
    {phase:'scored', pads:[0,2,4,6,8,10],target:10,show:'num'},
    {phase:'scored', pads:[0,5,10,15,20,25],target:15,show:'num'}
  ];
  var phaseName={demo:'Ghost demo',warmup:'Warm-up (not scored)',scored:'Scored item'};
  var idx=-1,cur=null,firstAction=0,itemStart=0,answered=false;

  function renderPhasebar(){var order=['demo','warmup','scored'],lab={demo:'1 Watch',warmup:'2 Try',scored:'3 Solve'};
    el('phasebar').innerHTML=order.map(function(p){var on=cur&&cur.phase===p?' on':'';return '<span class="pill'+on+'">'+lab[p]+'</span>';}).join('')+(cur?'<span class="pill">'+phaseName[cur.phase]+'</span>':'');}

  function padEls(){return [].slice.call(pond.querySelectorAll('.pad'));}
  function hopTo(padEl){var pr=pond.getBoundingClientRect(),br=padEl.getBoundingClientRect();frog.style.left=(br.left-pr.left+br.width/2-20)+'px';frog.style.top='2px';}

  function loadItem(){idx++;if(idx>=items.length){finish();return;}cur=items[idx];
    firstAction=0;answered=false;fb.textContent='';fb.className='fb';nextBtn.style.display='none';renderPhasebar();
    padEls().forEach(function(n){n.remove();});
    cur.pads.forEach(function(v){var p=document.createElement('div');p.className='pad';p.textContent=v;p.dataset.v=v;
      p.onclick=function(){if(cur.phase==='demo'||answered)return;if(!firstAction){firstAction=now();Tel.push('t-evt','first action (tap pad)');}choose(p,v);};pond.appendChild(p);});
    frog.style.left='4px';frog.style.top='72px';
    if(cur.show==='obj'){prompt.textContent='Count them, then tap that lily pad.';objs.innerHTML='';for(var i=0;i<cur.target;i++){var s=document.createElement('span');s.textContent=cur.icon;objs.appendChild(s);}}
    else{prompt.textContent='Tap the lily pad with this number.';objs.innerHTML='<span class="numeral">'+cur.target+'</span>';}
    itemStart=now();Tel.push('t-sys','LOAD '+cur.phase+' item (target '+cur.target+', pads '+cur.pads.join('/')+')');
    if(cur.phase==='demo')ghost();Tel.render();}

  function choose(padEl,v){answered=true;var rt=now()-itemStart,ok=(v===cur.target),span=cur.pads[cur.pads.length-1]-cur.pads[0],pae=100*Math.abs(v-cur.target)/span;
    hopTo(padEl);padEl.classList.add(ok?'correct':'wrong');
    if(cur.phase==='scored'){Tel.scored++;if(ok){Tel.correct++;if(cur.target>Tel.maxReach)Tel.maxReach=cur.target;}Tel.paeSum+=pae;Tel.paeN++;Tel.rtSum+=rt;Tel.rtN++;if(firstAction){Tel.firstSum+=(firstAction-itemStart);Tel.firstN++;}
      var et=ok?'correct':(Math.abs(v-cur.target)<=(cur.pads[1]-cur.pads[0])?'near-miss':(v>cur.target?'over':'under'));
      Tel.push(ok?'t-acc':'t-err','SCORED target '+cur.target+': tapped '+v+'  PAE='+pae.toFixed(1)+'%  RT='+rt+'ms  err='+et);}
    else Tel.push('t-sys',cur.phase.toUpperCase()+': tapped '+v+' \u2014 not scored');
    fb.textContent=ok?(cur.phase==='warmup'?'Ribbit! Now the real ones.':'The frog landed right!'):'The frog wanted pad '+cur.target+'.';
    fb.className='fb '+(ok?'good':'bad');nextBtn.style.display='inline-block';Tel.render();}

  nextBtn.onclick=function(){loadItem();};

  function ghost(){var pads=padEls(),t;for(var i=0;i<pads.length;i++)if(+pads[i].dataset.v===cur.target)t=pads[i];hand.style.opacity='0';
    setTimeout(function(){var pr=pond.getBoundingClientRect();hand.style.transition='none';hand.style.left=(pond.offsetLeft+8)+'px';hand.style.top=(pond.offsetTop+90)+'px';hand.style.opacity='1';Tel.push('t-sys','ghost: look at count');},300);
    setTimeout(function(){var pr=pond.getBoundingClientRect(),br=t.getBoundingClientRect();hand.style.transition='left .7s ease,top .5s ease';hand.style.left=(pond.offsetLeft+br.left-pr.left+18)+'px';hand.style.top=(pond.offsetTop+40)+'px';Tel.push('t-sys','ghost: reach pad '+cur.target);},1100);
    setTimeout(function(){hopTo(t);t.classList.add('correct');beep();Tel.push('t-sys','ghost: tap \u2192 frog hops');},2100);
    setTimeout(function(){hand.style.opacity='0';t.classList.remove('correct');loadItem();},3200);}

  function beep(){try{var a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='triangle';o.frequency.setValueAtTime(520,a.currentTime);o.frequency.exponentialRampToValueAtTime(880,a.currentTime+.12);g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.28);o.start();o.stop(a.currentTime+.3);}catch(e){}}

  function finish(){prompt.textContent='';objs.innerHTML='';document.querySelector('.stage').innerHTML='<div style="text-align:center;padding:30px 0"><div style="font-size:44px">\ud83c\udf89</div><div style="color:var(--muted)">Sample complete. Telemetry captured on the right.</div></div>';Tel.push('t-sys','SESSION complete: '+Tel.correct+'/'+Tel.scored+' scored correct');}
  window.addEventListener('blur',function(){Tel.push('t-sys','engagement: focus lost');});
  Tel.render();loadItem();
})();
</script>
</body>
</html>
