<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-dig-01 — Dino Dig (self-ordered spatial search)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #field{display:grid;gap:12px;padding:12px;background:#141a30;border:1px solid var(--edge);border-radius:18px}
  .spot{width:80px;height:80px;border-radius:14px;background:#3a2e1e;border:2px solid #5a4630;display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer}
  .spot:active{transform:scale(.96)}
  .spot.empty{background:#241d12;color:#8b7a55}.spot.exhausted{background:#123a26;border-color:var(--good)}
  .spot.wrong{border-color:var(--bad);background:#3a1420}
  #museum{font-size:26px;height:34px}
  #verdict{font-size:18px;height:26px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.ctl{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🦕 Dino Dig <span class="badge" id="blevel">4 spots</span></h1>
    <p class="sub">Dig holes to find fossils 🦴. Once a hole gives a fossil it is empty forever — never dig that one again. Find every fossil without wasting a dig!</p>
  </div>
  <div id="museum"></div>
  <div id="field"></div>
  <div id="verdict"></div>
  <div class="row">
    <button class="pri ctl" id="go">▶ Watch how it works</button>
    <button class="ctl" id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const field=$("#field"),museum=$("#museum"),verdict=$("#verdict");
const T={phase:"idle",n:4,maxClean:0,rounds:0,cleanRounds:0,between:0,withinRev:0,digs:0,finds:0,
  starts:[],searches:0,t0:0,persistMs:0,log:[]};
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop()}
function eff(){return T.digs?Math.round(100*T.finds/T.digs):0}
function strat(){if(T.searches<1)return 0;const s=new Set(T.starts);return Math.round(100*(1-(s.size-1)/Math.max(1,T.searches)));}
function render(){
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-dig-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>rounds / digs</span><b>${T.rounds} / ${T.digs}</b></div>
  <h2>Monitoring errors <span class="m">M-BETWEENERR</span></h2>
  <div class="kv"><span>re-dug a spent hole</span><b>${T.between}</b></div>
  <div class="kv"><span>within-search re-digs</span><b>${T.withinRev}</b></div>
  <h2>Strategy <span class="m">M-SEARCHSTRAT</span></h2>
  <div class="kv"><span>systematic-sweep index</span><b>${strat()}%</b></div>
  <h2>Economy <span class="m">M-EFF</span></h2>
  <div class="kv"><span>finds / digs</span><b>${eff()}%</b></div>
  <h2>Above-grade ceiling <span class="m">M-DIFFREACH</span></h2>
  <div class="kv"><span>largest clean field</span><b>${T.maxClean} spots</b></div>
  <h2>Task commitment <span class="m">M-PERSIST</span></h2>
  <div class="kv"><span>time on field</span><b>${(T.persistMs/1000).toFixed(1)}s</b></div>
  <div class="kv"><span>dig path <span class="m">M-PATH</span></span><b>logged</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();

let exhausted,emptyThis,hidden,roundErr,active,firstThisSearch;
function build(){field.style.gridTemplateColumns=`repeat(${Math.min(4,T.n)},1fr)`;field.innerHTML="";
  for(let i=0;i<T.n;i++){const d=document.createElement("div");d.className="spot"+(exhausted.has(i)?" exhausted":"");d.dataset.i=i;d.textContent=exhausted.has(i)?"🦴":"";d.onpointerdown=()=>dig(i,d);field.appendChild(d);}}
function hideFossil(){const avail=[];for(let i=0;i<T.n;i++)if(!exhausted.has(i))avail.push(i);hidden=avail.length?avail[Math.floor(Math.random()*avail.length)]:-1;emptyThis=new Set();firstThisSearch=true;}
function dig(i,el){if(!active)return;
  if(firstThisSearch){T.starts.push(i);T.searches++;firstThisSearch=false;}
  if(exhausted.has(i)){T.between++;roundErr++;el.classList.add("wrong");setTimeout(()=>el.classList.remove("wrong"),240);verdict.textContent="🔁 that hole is already empty!";logE("between-search error");render();return;}
  T.digs++;
  if(i===hidden){T.finds++;exhausted.add(i);el.className="spot exhausted";el.textContent="🦴";museum.textContent="🦴".repeat(exhausted.size);verdict.textContent="✨ fossil!";
    if(exhausted.size>=T.n){active=false;T.rounds++;T.persistMs=performance.now()-T.t0;
      if(roundErr===0){T.maxClean=Math.max(T.maxClean,T.n);T.cleanRounds++;verdict.textContent="🌟 whole field cleared clean!";if(T.phase==="scored"&&T.n<8){T.n++;$("#blevel").textContent=T.n+" spots";logE("clean → grow to "+T.n);}}
      render();setTimeout(()=>{if(T.phase==="scored"||T.phase.startsWith("warm"))startRound();},800);return;}
    hideFossil();render();return;}
  // empty spot
  if(emptyThis.has(i)){T.withinRev++;verdict.textContent="↩ dug that one already this hunt";}
  else{emptyThis.add(i);el.classList.add("empty");el.textContent="·";verdict.textContent="empty…";}
  render();
}
function startRound(){exhausted=new Set();roundErr=0;active=true;T.t0=performance.now();museum.textContent="";verdict.textContent="";build();hideFossil();}

async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;$("#replay").disabled=true;
  T.n=4;exhausted=new Set();active=false;build();hidden=2;
  const ghost=document.createElement("div");ghost.textContent="👆";ghost.style.cssText="position:fixed;font-size:30px;z-index:9;transition:left .45s,top .45s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  const spots=[...field.children];await sleep(400);ghost.style.opacity="1";
  let r=spots[0].getBoundingClientRect();ghost.style.left=(r.left+r.width/2-12)+"px";ghost.style.top=(r.top+16)+"px";await sleep(600);spots[0].classList.add("empty");spots[0].textContent="·";verdict.textContent="empty…";await sleep(500);
  r=spots[2].getBoundingClientRect();ghost.style.left=(r.left+r.width/2-12)+"px";ghost.style.top=(r.top+16)+"px";await sleep(600);spots[2].className="spot exhausted";spots[2].textContent="🦴";museum.textContent="🦴";verdict.textContent="✨ fossil! this hole is done now";await sleep(900);
  ghost.remove();T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice round";$("#go").onclick=warmup;
  $("#phasehint").textContent="Find every fossil; never re-dig a hole that already gave one. Practice (not scored).";exhausted=new Set();build();museum.textContent="";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;
function warmup(){T.phase="warm-up (unscored)";T.n=4;$("#phasehint").textContent="Not scored — clear a field, then start.";
  $("#go").textContent="▶ Start scored game";$("#go").onclick=startScored;startRound();render();}
function startScored(){T.phase="scored";T.n=4;T.rounds=0;T.digs=0;T.finds=0;T.between=0;T.withinRev=0;T.starts=[];T.searches=0;T.cleanRounds=0;$("#blevel").textContent="4 spots";
  $("#phasehint").textContent="These count. A tidy, systematic sweep with no wasted digs is the goal.";$("#go").textContent="(playing…)";$("#go").disabled=true;$("#replay").disabled=true;
  startRound();render();
  const iv=setInterval(()=>{if(T.rounds>=4){clearInterval(iv);active=false;T.phase="done";$("#go").disabled=false;$("#go").textContent="▶ Play again";$("#go").onclick=startScored;$("#replay").disabled=false;
    $("#phasehint").textContent=`Done. Largest clean field ${T.maxClean} spots; between-search errors ${T.between}; strategy ${strat()}%.`;render();}},500);
}
</script>
</body>
</html>
