<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CX-persist-01 — Don't-Give-Up Vault</title>
<style>
  :root{--bg:#0f1226;--card:#1b1f3b;--ink:#f2f4ff;--muted:#9aa3d0;--gold:#ffd35c;--good:#5ce6a3;--bad:#ff6b8a;}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 30% 0%,#242a55,#0f1226);color:var(--ink)}
  header{padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  .badge{font-size:12px;color:var(--muted);border:1px solid #38407a;padding:2px 8px;border-radius:999px}
  .wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:0 20px 30px;max-width:1100px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .stage{background:var(--card);border-radius:18px;padding:20px;min-height:420px;position:relative;overflow:hidden}
  .vault{display:flex;flex-direction:column;align-items:center;gap:14px}
  .phaseTag{position:absolute;top:12px;right:14px;font-size:12px;color:var(--gold);background:#2b2140;border:1px solid #5a4a1f;padding:3px 10px;border-radius:999px}
  .prompt{font-size:15px;color:var(--muted);min-height:22px;text-align:center}
  .slots,.tray{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0}
  .slot{width:58px;height:58px;border-radius:14px;border:4px dashed #55608f;display:flex;align-items:center;justify-content:center;background:#141735;cursor:pointer;transition:transform .1s}
  .slot.req{border-style:solid}
  .gem{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25);cursor:pointer;transition:transform .1s}
  .gem:active{transform:scale(.9)}
  .tray .gem{width:46px;height:46px}
  .gem.sel{outline:4px solid #fff;outline-offset:2px}
  .btns{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  button{font:inherit;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600}
  .check{background:var(--good);color:#03301c}
  .stop{background:#39406e;color:#dfe3ff}
  .ghost{position:absolute;font-size:40px;pointer-events:none;transition:left .8s ease,top .8s ease,transform .2s;z-index:5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
  .shake{animation:sh .4s}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .pop{animation:pop .5s}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .tele{background:#12152e;border:1px solid #2a3060;border-radius:18px;padding:14px;height:fit-content;position:sticky;top:12px}
  .tele h3{margin:0 0 8px;font-size:14px;letter-spacing:.5px;color:var(--gold)}
  .metrics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:12px;background:#1c2145;border:1px solid #333c76;border-radius:8px;padding:4px 8px}
  .chip b{color:var(--gold)}
  .log{font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#b9c0ef;max-height:230px;overflow:auto;background:#0c0f22;border-radius:10px;padding:8px}
  .log div{border-bottom:1px solid #171b38;padding:1px 0}
  .mini{transform:scale(.8)}
  .note{font-size:11px;color:var(--muted);margin-top:8px}
  a.replay{color:var(--gold);cursor:pointer;font-size:13px;text-decoration:underline}
</style>
</head>
<body>
<header>
  <h1>🔐 Don't-Give-Up Vault</h1>
  <span class="badge">CX-persist-01</span>
  <span class="badge">bands: K–1 · 2–3 · 4–5 · 6–8</span>
  <span class="badge">measures persistence, not just accuracy</span>
</header>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="phaseTag" id="phaseTag">demo</div>
    <div class="vault" id="vault"></div>
    <div class="ghost" id="ghost" style="display:none">👆</div>
  </div>
  <div class="tele">
    <h3>LIVE TELEMETRY</h3>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="note">Behavioral signals: M-PERSIST (time on hard locks), M-RESUME (retries + re-attempt latency + quit timing), M-PATH, M-REV, M-RTFIRST, M-ENGAGE.</div>
  </div>
</div>

<script>
/* ---------- telemetry core ---------- */
const T={ev:[],m:{},t0:performance.now(),
  now(){return Math.round(performance.now()-this.t0)},
  log(a,d){const t=this.now();this.ev.push(Object.assign({t,a},d||{}));
    const el=document.getElementById('log');const line=document.createElement('div');
    line.textContent='+'+(t/1000).toFixed(2)+'s  '+a+(d?'  '+JSON.stringify(d):'');
    el.prepend(line);},
  set(k,v){this.m[k]=v;this.render();},
  render(){document.getElementById('metrics').innerHTML=
    Object.entries(this.m).map(([k,v])=>'<span class="chip"><b>'+k+'</b> '+v+'</span>').join('');}
};
const COLORS={r:'#ff6b6b',b:'#5aa9ff',g:'#5ce6a3',y:'#ffd35c',p:'#c58bff'};
const $=s=>document.querySelector(s);
const vault=$('#vault'),ghost=$('#ghost'),phaseTag=$('#phaseTag');

/* ---------- state ---------- */
let selected=null;           // selected gem index in tray
let lock=null;               // current lock runtime
let lockStats={retries:0,longest:0,quits:0,solved:0};
T.set('phase','demo');T.set('time_on_lock','0.0s');T.set('retries',0);T.set('longest_persist','0.0s');T.set('quits',0);

/* ---------- lock builder ---------- */
function buildLock(cfg,onEnd){
  vault.innerHTML='';
  lock={cfg,placed:new Array(cfg.slots.length).fill(null),tray:cfg.tray.slice(),
        start:performance.now(),firstAction:null,checks:0,removes:0,onEnd};
  selected=null;
  const prompt=document.createElement('div');prompt.className='prompt';
  prompt.textContent=cfg.scored? '🎯 Open this vault' : '⭐ Practice — no score';
  vault.appendChild(prompt);

  const slots=document.createElement('div');slots.className='slots';
  cfg.slots.forEach((need,i)=>{
    const s=document.createElement('div');s.className='slot req';s.style.borderColor=COLORS[need];
    s.dataset.i=i;s.onclick=()=>slotClick(i);slots.appendChild(s);
  });
  vault.appendChild(slots);

  const trayWrap=document.createElement('div');trayWrap.className='tray';
  renderTray(trayWrap);
  vault.appendChild(trayWrap);

  const btns=document.createElement('div');btns.className='btns';
  const chk=document.createElement('button');chk.className='check';chk.textContent='✓ Check';chk.onclick=check;
  const stop=document.createElement('button');stop.className='stop';stop.textContent="I'm done → Next";stop.onclick=quit;
  btns.appendChild(chk);btns.appendChild(stop);
  vault.appendChild(btns);
  lock.trayWrap=trayWrap;lock.slotsEl=slots;
  tick();
}
function renderTray(wrap){
  wrap.innerHTML='';
  lock.tray.forEach((c,idx)=>{
    if(c===null)return;
    const g=document.createElement('div');g.className='gem'+(selected===idx?' sel':'');
    g.style.background=COLORS[c];g.onclick=()=>{selected=idx;markFirst();renderTray(wrap);T.log('select_gem',{color:c});};
    wrap.appendChild(g);
  });
}
function markFirst(){if(lock.firstAction===null){lock.firstAction=Math.round(performance.now()-lock.start);T.log('first_action',{ms:lock.firstAction});T.set('first_action',(lock.firstAction/1000).toFixed(2)+'s');}}
function slotClick(i){
  markFirst();
  if(lock.placed[i]!==null){ // remove back to tray
    const c=lock.placed[i];lock.placed[i]=null;lock.tray.push(c);lock.removes++;
    T.log('remove_gem',{slot:i,color:c});T.set('revisions_M-REV',lock.removes);
    redraw();return;
  }
  if(selected===null){T.log('slot_empty_tap',{slot:i});return;}
  const c=lock.tray[selected];lock.placed[i]=c;lock.tray[selected]=null;
  T.log('place_gem',{slot:i,color:c});selected=null;redraw();
}
function redraw(){
  [...lock.slotsEl.children].forEach((s,i)=>{
    s.innerHTML='';
    if(lock.placed[i]!==null){const g=document.createElement('div');g.className='gem';g.style.background=COLORS[lock.placed[i]];s.appendChild(g);}
  });
  renderTray(lock.trayWrap);
}
function check(){
  lock.checks++;
  const ok=lock.cfg.slots.every((need,i)=>lock.placed[i]===need);
  const dt=Math.round(performance.now()-lock.start);
  if(ok){
    T.log('SOLVED',{ms:dt,checks:lock.checks});
    lock.slotsEl.classList.add('pop');
    if(lock.cfg.scored){lockStats.solved++;lockStats.longest=Math.max(lockStats.longest,dt);T.set('longest_persist',(lockStats.longest/1000).toFixed(1)+'s');}
    setTimeout(()=>endLock('solved'),700);
  }else{
    if(lock.cfg.scored){lockStats.retries++;T.set('retries',lockStats.retries);}
    lock.lastFail=performance.now();
    T.log('wrong_attempt→retry',{attempt:lock.checks});
    lock.slotsEl.classList.remove('shake');void lock.slotsEl.offsetWidth;lock.slotsEl.classList.add('shake');
  }
}
function quit(){
  const dt=Math.round(performance.now()-lock.start);
  const sinceFail=lock.lastFail?Math.round(performance.now()-lock.lastFail):null;
  if(lock.cfg.scored){lockStats.quits++;lockStats.longest=Math.max(lockStats.longest,dt);
    T.set('quits',lockStats.quits);T.set('longest_persist',(lockStats.longest/1000).toFixed(1)+'s');}
  T.log('VOLUNTARY_QUIT',{ms_on_lock:dt,quit_after_fail_ms:sinceFail,attempts:lock.checks});
  endLock('quit');
}
let ticker=null;
function tick(){clearInterval(ticker);ticker=setInterval(()=>{
  if(!lock)return;const dt=(performance.now()-lock.start)/1000;T.set('time_on_lock',dt.toFixed(1)+'s');},100);}
function endLock(reason){clearInterval(ticker);const cb=lock.onEnd;lock=null;cb&&cb(reason);}

/* ---------- flow: demo → warmup → scored locks ---------- */
function ghostMove(x,y,cb,d=800){ghost.style.left=x+'px';ghost.style.top=y+'px';setTimeout(cb,d);}
function runGhost(){
  // wordless: solve an easy 2-slot lock, then tap "stop" on nothing (simulated) — <=10s
  phaseTag.textContent='demo';ghost.style.display='block';
  const demoCfg={slots:['r','b'],tray:['b','r'],scored:false,demo:true};
  buildLock(demoCfg);
  const slotEls=lock.slotsEl.children, trayEls=lock.trayWrap.children;
  const seq=[];
  const R=el=>{const r=el.getBoundingClientRect(),s=$('#stage').getBoundingClientRect();return[r.left-s.left+r.width/2-20,r.top-s.top+r.height/2-20];};
  setTimeout(()=>{ // pick red gem (tray[1]) -> slot0
    let[x,y]=R(trayEls[1]);ghostMove(x,y,()=>{trayEls[1].click();
      let[x2,y2]=R(slotEls[0]);ghostMove(x2,y2,()=>{slotEls[0].click();
        let t=lock.trayWrap.children;let[x3,y3]=R(t[0]);ghostMove(x3,y3,()=>{t[0].click();
          let[x4,y4]=R(slotEls[1]);ghostMove(x4,y4,()=>{slotEls[1].click();
            let cb=[...vault.querySelectorAll('button')][0];let[x5,y5]=R(cb);
            ghostMove(x5,y5,()=>{ghost.style.transform='scale(.8)';cb.click();
              setTimeout(()=>{ghost.style.display='none';ghost.style.transform='';startWarmup();},1200);});
          });});});});
  },600);
}
function startWarmup(){
  phaseTag.textContent='warm-up (practice)';T.set('phase','warm-up');T.log('phase_warmup');
  buildLock({slots:['g','y'],tray:['y','g','r'],scored:false},()=> startScored());
}
let scoredIdx=0;
const scoredLocks=[
  {slots:['r','b','y'],tray:['y','r','b','g'],scored:true},              // solvable, medium
  {slots:['p','p','p','g'],tray:['p','p','g','r','b'],scored:true}       // NEAR-UNSOLVABLE: needs 3 purple, only 2 exist
];
function startScored(){
  if(scoredIdx>=scoredLocks.length){return finish();}
  phaseTag.textContent='scored lock '+(scoredIdx+1)+'/'+scoredLocks.length;
  T.set('phase','scored '+(scoredIdx+1));T.log('phase_scored',{lock:scoredIdx+1});
  buildLock(scoredLocks[scoredIdx],()=>{scoredIdx++;startScored();});
}
function finish(){
  clearInterval(ticker);
  vault.innerHTML='<div class="prompt" style="font-size:20px;color:var(--gold)">🏆 All done!</div>'+
    '<div class="prompt">The second lock was <b>impossible on purpose</b>. What we learned:</div>'+
    '<div class="metrics" style="justify-content:center;margin-top:12px">'+
    '<span class="chip"><b>locks solved</b> '+lockStats.solved+'</span>'+
    '<span class="chip"><b>retries after fail</b> '+lockStats.retries+'</span>'+
    '<span class="chip"><b>longest persistence</b> '+(lockStats.longest/1000).toFixed(1)+'s</span>'+
    '<span class="chip"><b>voluntary quits</b> '+lockStats.quits+'</span></div>'+
    '<div class="btns"><button class="check" onclick="restart()">↺ Play again</button></div>'+
    '<div class="note" style="text-align:center">Two children can miss the same impossible lock — the one who kept trying longer and probed more arrangements shows the <b>task-commitment</b> signal CogAT never sees.</div>';
  T.log('SESSION_END',{solved:lockStats.solved,retries:lockStats.retries,longest_ms:lockStats.longest,quits:lockStats.quits});
  T.set('phase','done');
}
function restart(){location.reload();}
/* engagement gate: log blur/idle */
window.addEventListener('blur',()=>T.log('off_task_blur (M-ENGAGE)'));
runGhost();
</script>
</body>
</html>
