<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-CONCEPT-01 · Mystery Gate</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:640px;width:100%}
  #gatewrap{display:flex;align-items:center;gap:14px}
  #gate{width:90px;height:120px;border-radius:12px;border:4px solid #b9c4ee;background:repeating-linear-gradient(90deg,#dbe3ff,#dbe3ff 10px,#c9d3ef 10px,#c9d3ef 20px);display:flex;align-items:center;justify-content:center;font-size:34px;transition:.25s}
  #gate.open{background:#eafaf1;border-color:var(--good)}
  #gate.shut{background:#fdeeee;border-color:var(--bad)}
  #preview{width:96px;height:96px;background:#f6f8ff;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid #e6ebfb}
  .trays{display:flex;gap:12px;width:100%;justify-content:center}
  .tray{flex:1;min-height:64px;border-radius:12px;border:2px dashed #cdd6f4;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
  .tray.acc{background:#f0fbf5}.tray.rej{background:#fdf2f2}
  .tray b{width:100%;font-size:11px;color:#8a93b5;text-transform:uppercase;letter-spacing:.06em}
  .palette{display:flex;flex-direction:column;gap:8px;width:100%}
  .prow{display:flex;gap:8px;align-items:center;justify-content:center}
  .chip{width:52px;height:44px;border-radius:10px;border:2px solid #dde3f7;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s}
  .chip.sel{border-color:var(--accent);box-shadow:0 0 0 3px #dfe4ff}
  .sw{width:26px;height:26px;border-radius:6px}
  #probe{display:none;flex-direction:column;align-items:center;gap:12px}
  #probe.on{display:flex}
  .gatebtns{display:flex;gap:26px}
  .gbtn{width:96px;height:96px;border-radius:16px;border:3px solid #cdd6f4;background:#fff;cursor:pointer;font-size:40px;display:flex;align-items:center;justify-content:center}
  #tools{display:flex;gap:14px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #send{width:auto;height:auto;border-radius:14px;padding:12px 22px;background:var(--accent);color:#fff;font-size:18px;font-weight:700}
  #know{width:auto;height:auto;border-radius:14px;padding:12px 18px;background:#ffd479;color:#5b4600;font-size:15px;font-weight:700}
  #hint{width:48px;height:48px;background:#fff7e0;color:#e0a300;font-size:22px}
  #replay{width:46px;height:46px;background:#eef1ff;color:#5b6cff;font-size:20px}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;transition:transform .7s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:98px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:190px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-CONCEPT-01 · Mystery Gate</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="gatewrap">
        <div id="preview"></div>
        <div id="gate">🚪</div>
      </div>
      <div class="trays">
        <div class="tray acc" id="trayA"><b>opened ✓</b></div>
        <div class="tray rej" id="trayR"><b>bounced ✗</b></div>
      </div>
      <div class="palette" id="palette">
        <div class="prow" data-feat="shape"></div>
        <div class="prow" data-feat="color"></div>
        <div class="prow" data-feat="count"></div>
      </div>
      <div id="probe">
        <div id="probeFig" style="width:110px;height:110px;display:flex;align-items:center;justify-content:center;background:#f6f8ff;border-radius:14px"></div>
        <div class="gatebtns"><button class="gbtn" id="pOpen">🟢</button><button class="gbtn" id="pShut">🔴</button></div>
      </div>
      <div id="tools">
        <button id="replay" title="replay demo">↻</button>
        <button id="hint" title="reveal one opener">💡</button>
        <button id="send">Send ▶</button>
        <button id="know">I know it!</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const SHAPES=['triangle','circle','square'],COLORS={red:'#e6194b',blue:'#4363d8',green:'#2ca25f'},COUNTS=[1,2,3];
const CK=Object.keys(COLORS);
function oneShape(shape,color,cx,cy,r){switch(shape){
  case 'circle':return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>`;
  case 'square':return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="3" fill="${color}"/>`;
  case 'triangle':return `<polygon points="${cx},${cy-r} ${cx-r},${cy+r} ${cx+r},${cy+r}" fill="${color}"/>`;}return '';}
function figSVG(f,box=84){const col=COLORS[f.color],n=f.count;let inner='';
  const pos=n===1?[[.5,.5]]:n===2?[[.32,.5],[.68,.5]]:[[.28,.5],[.5,.5],[.72,.5]];
  const r=box*(n===1?.28:.15);pos.forEach(p=>inner+=oneShape(f.shape,col,p[0]*box,p[1]*box,r));
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${inner}</svg>`;}
const featKey=f=>f.shape+'/'+f.color+'/'+f.count;
function diffFeats(a,b){return (a.shape!==b.shape)+(a.color!==b.color)+(a.count!==b.count);}

/* hidden rules (AIG) */
const RULES={
  red:{test:f=>f.color==='red',desc:'red opens the gate'},
  tri:{test:f=>f.shape==='triangle',desc:'triangles open the gate'},
  two:{test:f=>f.count>=2,desc:'2 or more shapes open the gate'}};

/* telemetry */
const T={tests:[],hints:0,classAcc:0,classN:0,itemStart:0};
function hypStr(){if(T.tests.length<2)return '\u2014';let ctrl=0;for(let i=1;i<T.tests.length;i++)if(diffFeats(T.tests[i-1].f,T.tests[i].f)===1)ctrl++;
  return `${ctrl}/${T.tests.length-1} one-var (${Math.round(100*ctrl/(T.tests.length-1))}%)`;}
function effStr(){const n=T.tests.length;if(!n)return '\u2014';const opt=3;return `${n} tests · ${Math.round(100*Math.min(1,opt/Math.max(n,opt)))}% vs opt`;}
function progStr(){if(!T.tests.length)return '\u2014';return T.tests.map(t=>t.accept?'A':'r').join('');}
function pathStr(){if(!T.tests.length)return '\u2014';return T.tests.map(t=>featKey(t.f)[0]+featKey(t.f).split('/')[1][0]+t.f.count+(t.accept?'\u2713':'\u2717')).join(' ');}
const METERS=[
 {id:'M-ACC',name:'Final classification accuracy',get:()=>T.classN?`${T.classAcc}/${T.classN}  ${Math.round(100*T.classAcc/T.classN)}%`:'\u2014'},
 {id:'M-HYP',name:'Hypothesis-search: one-variable tests',get:()=>hypStr()},
 {id:'M-EXPLORE',name:'Tests the child designed',get:()=>T.tests.length+''},
 {id:'M-EFF',name:'Tests vs disambiguating optimum',get:()=>effStr()},
 {id:'M-PROG',name:'Evidence trajectory (A=open r=bounce)',get:()=>progStr()},
 {id:'M-PATH',name:'Self-chosen test sequence',get:()=>pathStr()},
 {id:'M-HINT',name:'Scaffold / hint usage',get:()=>T.hints+''},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');const ghostShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(640);}

/* palette build */
function paintPalette(){
  const rowS=$('.prow[data-feat="shape"]');rowS.innerHTML=SHAPES.map(s=>`<div class="chip" data-feat="shape" data-val="${s}"><svg width="30" height="30" viewBox="0 0 30 30">${oneShape(s,'#5b6cff',15,15,10)}</svg></div>`).join('');
  const rowC=$('.prow[data-feat="color"]');rowC.innerHTML=CK.map(c=>`<div class="chip" data-feat="color" data-val="${c}"><span class="sw" style="background:${COLORS[c]}"></span></div>`).join('');
  const rowN=$('.prow[data-feat="count"]');rowN.innerHTML=COUNTS.map(n=>`<div class="chip" data-feat="count" data-val="${n}" style="font-weight:700;font-size:20px;color:#5b6cff">${n}</div>`).join('');
}
let sel={shape:'triangle',color:'red',count:1};
function refreshSel(){$$('.chip').forEach(c=>c.classList.toggle('sel',c.dataset.val==String(sel[c.dataset.feat])));$('#preview').innerHTML=figSVG(sel,84);}

/* flow */
let phase='demo',rule=null,probes=[],probeIdx=0,figStart=0,scoredDone=false;
function setCue(i){$('#phasecue').textContent=i;}
function clearTrays(){$('#trayA').innerHTML='<b>opened ✓</b>';$('#trayR').innerHTML='<b>bounced ✗</b>';}
function toTray(f,accept){const box=accept?$('#trayA'):$('#trayR');const e=document.createElement('div');e.innerHTML=figSVG(f,30);box.appendChild(e.firstChild);}
async function sendFig(f){$('#gate').className='';await sleep(20);const acc=rule.test(f);
  $('#gate').classList.add(acc?'open':'shut');$('#gate').textContent=acc?'🎉':'⛔';
  toTray(f,acc);const rt=Date.now()-figStart;figStart=Date.now();
  if(phase!=='demo')T.tests.push({f:{...f},accept:acc,rt});
  log(`test ${f.color} ${f.shape} x${f.count} → ${acc?'OPEN ✓':'bounce ✗'}`);renderMeters();
  setTimeout(()=>{$('#gate').className='';$('#gate').textContent='🚪';},700);}
function startClassify(){phase='classify';$('#palette').style.display='none';$('#preview').style.display='none';$('#gate').style.display='none';$('#probe').classList.add('on');$('#send').style.display='none';$('#know').style.display='none';showProbe();}
function showProbe(){if(probeIdx>=probes.length){finishRound();return;}const f=probes[probeIdx];$('#probeFig').innerHTML=figSVG(f,100);figStart=Date.now();log(`classify probe ${probeIdx+1}: does it open?`);}
function classify(guessOpen){if(phase!=='classify')return;const f=probes[probeIdx];const truth=rule.test(f);const ok=guessOpen===truth;
  T.classN++;if(ok)T.classAcc++;log(`answer ${guessOpen?'OPEN':'shut'} · truth ${truth?'open':'shut'} · ${ok?'✓':'✗'}`);probeIdx++;renderMeters();setTimeout(showProbe,420);}
function makeProbes(){const set=[];while(set.length<3){const f={shape:SHAPES[Math.random()*3|0],color:CK[Math.random()*3|0],count:COUNTS[Math.random()*3|0]};if(!set.some(x=>featKey(x)===featKey(f)))set.push(f);}return set;}
function startRound(rk,scored){phase='play';rule=RULES[rk];T.tests=[];T.classAcc=0;T.classN=0;probeIdx=0;probes=makeProbes();T.itemStart=Date.now();figStart=Date.now();
  clearTrays();$('#palette').style.display='';$('#preview').style.display='';$('#gate').style.display='';$('#probe').classList.remove('on');$('#send').style.display='';$('#know').style.display='';
  refreshSel();renderMeters();setCue(scored?'\ud83c\udfaf':'\u2b50');log(`— ${scored?'SCORED':'warm-up'}: invent test figures, find the secret rule, then classify 3 —`);}
function finishRound(){if(phase==='done')return;
  if(!scoredDone){scoredDone=true;log(`round done · rule was: ${rule.desc}`);setTimeout(()=>startRound('tri',true),700);}
  else{phase='done';setCue('\ud83c\udfc6');log(`— DONE · classify acc ${T.classAcc}/${T.classN} · rule: ${rule.desc} —`);}}
async function runDemo(){phase='demo';scoredDone=false;rule=RULES.red;setCue('\ud83d\udc41\ufe0f');clearTrays();$('#palette').style.display='';$('#preview').style.display='';$('#gate').style.display='';$('#probe').classList.remove('on');$('#send').style.display='';$('#know').style.display='';T.tests=[];T.classAcc=0;T.classN=0;T.itemStart=Date.now();renderMeters();
  log('ghost-hand demo (wordless, <10s): build a figure, send it, watch the gate');
  ghostShow(true);sel={shape:'circle',color:'red',count:1};refreshSel();await ghostTo($('#preview'));await sleep(200);await ghostTo($('#send'));await sendFig(sel);await sleep(650);
  sel={shape:'circle',color:'blue',count:1};refreshSel();await ghostTo($('#preview'));await sleep(200);await ghostTo($('#send'));await sendFig(sel);await sleep(650);
  ghostShow(false);clearTrays();log('demo done — your turn (warm-up)');startRound('red',false);}
/* handlers */
paintPalette();
$('#palette').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c||phase==='demo'||phase==='classify'||phase==='done')return;sel[c.dataset.feat]=c.dataset.feat==='count'?+c.dataset.val:c.dataset.val;refreshSel();});
$('#send').addEventListener('click',()=>{if(phase==='play')sendFig(sel);});
$('#know').addEventListener('click',()=>{if(phase==='play'){log('child: "I know it!" → classify phase');startClassify();}});
$('#hint').addEventListener('click',()=>{if(phase!=='play')return;T.hints++;let f;for(let k=0;k<200;k++){f={shape:SHAPES[Math.random()*3|0],color:CK[Math.random()*3|0],count:COUNTS[Math.random()*3|0]};if(rule.test(f))break;}toTray(f,true);log('hint: revealed one figure that opens the gate');renderMeters();});
$('#pOpen').addEventListener('click',()=>classify(true));
$('#pShut').addEventListener('click',()=>classify(false));
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
