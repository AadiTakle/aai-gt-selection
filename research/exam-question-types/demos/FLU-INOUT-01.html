<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-INOUT-01 · Guest List</title>
<style>
  :root{--bg1:#f0eaff;--bg2:#eafff7;--ink:#26304a;--card:#fff;--good:#22b573;--bad:#ff6b6b;--accent:#7a5bff;--socket:#c9d3ef;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:26px;padding:20px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:600px;width:100%}
  #club{width:100%;background:linear-gradient(160deg,#f3eeff,#eef7ff);border:3px solid #d9d0ff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:center}
  #club .lab{font-size:11px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #members{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:64px;align-items:center}
  .cell{background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;width:60px;height:60px;box-shadow:0 2px 0 #eef1f8 inset}
  .cell.join{animation:join .5s ease}@keyframes join{0%{transform:scale(.4);opacity:.2}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  #gatewrap{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center}
  #gatelab{font-size:11px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #guest{width:96px;height:96px;border-radius:16px;background:#fff;border:3px solid #e2e8fb;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -12px #46508a}
  #guest.arrive{animation:arrive .4s ease}@keyframes arrive{0%{transform:translateY(-24px) scale(.7);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
  #guest.inYes{animation:goIn .5s ease forwards}@keyframes goIn{100%{transform:translateY(-70px) scale(.5);opacity:0}}
  #guest.outNo{animation:goOut .5s ease forwards}@keyframes goOut{100%{transform:translateX(120px) scale(.6) rotate(18deg);opacity:0}}
  #guest.wrong{border-color:var(--bad);box-shadow:0 0 0 4px #ffd0d0}
  #controls{display:flex;gap:22px;align-items:center}
  .dbtn{width:96px;height:76px;border:0;border-radius:20px;cursor:pointer;font-size:34px;color:#fff;transition:.12s;-webkit-tap-highlight-color:transparent;opacity:.4;pointer-events:none}
  .dbtn.live{opacity:1;pointer-events:auto}
  .dbtn:active{transform:scale(.94)}
  #inBtn{background:var(--good);box-shadow:0 10px 22px -10px var(--good)}
  #outBtn{background:var(--bad);box-shadow:0 10px 22px -10px var(--bad)}
  button{font:inherit;border:0;cursor:pointer}
  #go{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;opacity:.3;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:46px;height:46px;border-radius:50%;background:#eef1ff;color:#5b6cff;font-size:20px}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;transition:transform .7s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:330px;flex:0 0 330px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:190px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:880px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-INOUT-01 · Guest List</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="club"><div class="lab">the club</div><div id="members"></div></div>
      <div id="gatewrap"><div id="gatelab">at the door</div><div id="guest"></div></div>
      <div id="controls">
        <button id="outBtn" class="dbtn" title="keep out">✗</button>
        <button id="replay" title="replay demo">↻</button>
        <button id="go" title="finish">✓</button>
        <button id="inBtn" class="dbtn" title="let in">✓</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,last=a=>a[a.length-1];
const PAL={red:'#e6194b',green:'#2ca25f',blue:'#4363d8',orange:'#f58231',purple:'#911eb4'};
const COLORKEYS=Object.keys(PAL),SH=['circle','square','triangle','diamond','star','hexagon'];
function polyPts(cx,cy,r,n,rot){let p=[];for(let i=0;i<n;i++){let a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function starPts(cx,cy,r,n){let p=[];for(let i=0;i<2*n;i++){let rr=i%2?r*0.45:r;let a=-Math.PI/2+i*Math.PI/n;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(' ');}
function oneShape(shape,color,cx,cy,r){switch(shape){
  case 'circle':return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>`;
  case 'square':return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="3" fill="${color}"/>`;
  case 'triangle':return `<polygon points="${polyPts(cx,cy,r,3,-Math.PI/2)}" fill="${color}"/>`;
  case 'diamond':return `<polygon points="${polyPts(cx,cy,r,4,-Math.PI/2)}" fill="${color}"/>`;
  case 'hexagon':return `<polygon points="${polyPts(cx,cy,r,6,-Math.PI/2)}" fill="${color}"/>`;
  case 'star':return `<polygon points="${starPts(cx,cy,r,5)}" fill="${color}"/>`;}return '';}
function tileSVG(a,box=60){const color=PAL[a.color]||a.color;const inner=oneShape(a.shape,color,box/2,box/2,box*0.32);
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${inner}</svg>`;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

/* inverse normal (Acklam) for d-prime */
function invNorm(p){if(p<=0)return -6;if(p>=1)return 6;
  const a=[-3.969683028665376e1,2.209460984245205e2,-2.759285104469687e2,1.383577518672690e2,-3.066479806614716e1,2.506628277459239e0];
  const b=[-5.447609879822406e1,1.615858368580409e2,-1.556989798598866e2,6.680131188771972e1,-1.328068155288572e1];
  const c=[-7.784894002430293e-3,-3.223964580411365e-1,-2.400758277161838e0,-2.549732539343734e0,4.374664141464968e0,2.938163982698783e0];
  const d=[7.784695709041462e-3,3.224671290700398e-1,2.445134137142996e0,3.754408661907416e0];
  const pl=0.02425,ph=1-pl;let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p<=ph){q=p-0.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
  q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}

/* ---------- round generation (AIG): a single-attribute club rule + belongers/violators ---------- */
function genRound(nMember,nNon){const ruleAttr=Math.random()<0.5?'color':'shape';
  const val=ruleAttr==='color'?COLORKEYS[(Math.random()*COLORKEYS.length)|0]:SH[(Math.random()*SH.length)|0];
  const other=ruleAttr==='color'?'shape':'color';const otherPool=ruleAttr==='color'?SH:COLORKEYS;
  function make(isMember){const g={};g[ruleAttr]=isMember?val:pickNot(ruleAttr==='color'?COLORKEYS:SH,val);
    g[other]=otherPool[(Math.random()*otherPool.length)|0];return {shape:g.shape,color:g.color};}
  function pickNot(pool,v){let x=v;let k=0;while(x===v&&k++<12)x=pool[(Math.random()*pool.length)|0];return x;}
  const members=[make(true),make(true),make(true)];
  const guests=[];for(let i=0;i<nMember;i++)guests.push({attr:make(true),isMember:true});
  for(let i=0;i<nNon;i++)guests.push({attr:make(false),isMember:false});
  return {ruleAttr,val,members,guests:shuffle(guests)};}

/* ---------- telemetry: M-ACC, M-RT, M-DPRIME, M-FALSEALARM, M-ERRTYPE ---------- */
const T={dec:0,correct:0,rts:[],hit:0,miss:0,fa:0,cr:0,lastErr:'\u2014',guestStart:0};
function nSig(){return T.hit+T.miss;}function nNoise(){return T.fa+T.cr;}
function dprime(){if(!nSig()||!nNoise())return '\u2014';const hr=(T.hit+0.5)/(nSig()+1),fr=(T.fa+0.5)/(nNoise()+1);return (invNorm(hr)-invNorm(fr)).toFixed(2);}
function faStr(){return nNoise()?`${T.fa}/${nNoise()}  (${Math.round(100*T.fa/nNoise())}%)`:'\u2014';}
const METERS=[
 {id:'M-ACC',name:'Decision accuracy (running)',get:()=>T.dec?`${T.correct}/${T.dec}  ${Math.round(100*T.correct/T.dec)}%`:'\u2014'},
 {id:'M-RT',name:'Decision time (per guest)',get:()=>T.rts.length?`${last(T.rts)} ms  (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-DPRIME',name:'Sensitivity d-prime (rule vs bias)',get:()=>dprime()==='\u2014'?'\u2014':`${dprime()}  (H ${T.hit}/${nSig()} · FA ${T.fa}/${nNoise()})`},
 {id:'M-FALSEALARM',name:'Let in a stranger (commission)',get:()=>faStr()},
 {id:'M-ERRTYPE',name:'Error type (miss vs false alarm)',get:()=>T.lastErr},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
let logStart=Date.now();
function log(msg){const t=Date.now()-logStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(700);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(480);}

/* ---------- flow ---------- */
let phase='demo',round=null,gi=0,locked=true;
function setCue(i){$('#phasecue').textContent=i;}
function liveBtns(v){$('#inBtn').classList.toggle('live',v);$('#outBtn').classList.toggle('live',v);}
function renderClub(r){$('#members').innerHTML=r.members.map(m=>`<div class="cell">${tileSVG(m)}</div>`).join('');}
function showGuest(g){const el=$('#guest');el.className='';el.innerHTML=tileSVG(g.attr,80);void el.offsetWidth;el.classList.add('arrive');T.guestStart=Date.now();}
function joinClub(g){const m=document.createElement('div');m.className='cell join';m.innerHTML=tileSVG(g.attr);$('#members').appendChild(m);}
function nextGuest(){if(!round||gi>=round.guests.length){endRound();return;}
  const g=round.guests[gi];showGuest(g);liveBtns(true);locked=false;
  log(`guest ${gi+1}/${round.guests.length} at door`);}
function decide(letIn){if(locked||phase==='demo'||phase==='done')return;const g=round.guests[gi];const rt=Date.now()-T.guestStart;
  const correct=(letIn===g.isMember);liveBtns(false);locked=true;
  const el=$('#guest');
  if(letIn){joinClub(g);el.classList.add('inYes');}else{el.classList.add('outNo');}
  if(!correct)el.classList.add('wrong');
  if(phase==='scored'){T.dec++;if(correct)T.correct++;T.rts.push(rt);
    if(g.isMember&&letIn)T.hit++;else if(g.isMember&&!letIn)T.miss++;else if(!g.isMember&&letIn)T.fa++;else T.cr++;
    if(!correct)T.lastErr=g.isMember?'miss (bounced a member)':'false alarm (let in a stranger)';
    log(`decision ${letIn?'IN':'OUT'} · ${g.isMember?'member':'stranger'} \u2192 ${correct?'correct':'WRONG'} · RT ${rt}ms`);
    renderMeters();
  }else{log(`warm-up ${letIn?'IN':'OUT'} · ${correct?'correct':'wrong'} — UNSCORED`);}
  gi++;setTimeout(nextGuest,650);}
function endRound(){liveBtns(false);
  if(phase==='warmup'){setTimeout(startScored,500);return;}
  if(phase==='scored'){$('#gatelab').textContent='all done';$('#guest').innerHTML='🎉';$('#go').classList.add('ready');}}
function startWarmup(){phase='warmup';setCue('\u2b50');round=genRound(1,1);gi=0;renderClub(round);$('#gatelab').textContent='at the door';
  log(`— warm-up (unscored): club shares one ${round.ruleAttr} —`);nextGuest();}
function startScored(){phase='scored';setCue('\ud83c\udfaf');round=genRound(3,3);gi=0;renderClub(round);$('#gatelab').textContent='at the door';
  log(`— SCORED round: 6 guests · club rule = same ${round.ruleAttr} —`);nextGuest();}
function finish(){phase='done';setCue('\ud83c\udfc6');locked=true;$('#go').classList.remove('ready');
  log(`— DONE · acc ${T.correct}/${T.dec} · d' ${dprime()} · FA ${faStr()} —`);}
async function runDemo(){phase='demo';setCue('\ud83d\udc41\ufe0f');locked=true;liveBtns(false);
  round=genRound(0,0);// members only for the demo club
  const ra=round.ruleAttr,val=round.val;renderClub(round);
  // build two demo guests: one member, one stranger
  const memberG={attr:{shape:ra==='shape'?val:SH[(Math.random()*SH.length)|0],color:ra==='color'?val:COLORKEYS[(Math.random()*COLORKEYS.length)|0]},isMember:true};
  const strangerColor=ra==='color'?COLORKEYS.filter(c=>c!==val)[0]:COLORKEYS[(Math.random()*COLORKEYS.length)|0];
  const strangerShape=ra==='shape'?SH.filter(s=>s!==val)[0]:SH[(Math.random()*SH.length)|0];
  const strangerG={attr:{shape:strangerShape,color:strangerColor},isMember:false};
  log(`ghost-hand demo (wordless, <10s): club shares one ${ra}`);
  ghostShow(true);await ghostTo($('#members'));await sleep(300);
  showGuest(memberG);await sleep(500);await ghostTo($('#inBtn'));await ghostTap();joinClub(memberG);$('#guest').classList.add('inYes');await sleep(600);
  showGuest(strangerG);await sleep(500);await ghostTo($('#outBtn'));await ghostTap();$('#guest').classList.add('outNo');await sleep(600);
  ghostShow(false);await sleep(300);startWarmup();}
$('#inBtn').addEventListener('click',()=>decide(true));
$('#outBtn').addEventListener('click',()=>decide(false));
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))finish();});
$('#replay').addEventListener('click',()=>{if(phase==='done'||phase==='scored'||phase==='warmup')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
