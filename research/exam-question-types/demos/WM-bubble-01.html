<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WM-bubble-01 · Bubble Pop Memory</title>
<style>
  :root{--bg1:#e6f3ff;--bg2:#eaf9ff;--ink:#1a3450;--card:#fff;--accent:#2e9bff;--good:#22b573;--bad:#ff6b6b;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#7a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #2a5a8a;display:flex;flex-direction:column;align-items:center;gap:18px;max-width:600px;width:100%}
  #stream{width:100%;height:160px;position:relative;background:linear-gradient(180deg,#eaf6ff,#f4fbff);border-radius:18px;border:3px solid #cfe4ff;overflow:hidden}
  .bubble{position:absolute;left:50%;transform:translateX(-50%);width:130px;height:60px;background:#fff;border:3px solid var(--accent);border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#1a3450;box-shadow:0 6px 16px -6px #2e9bff88;}
  #controls{display:flex;gap:20px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:16px;padding:14px 26px;font-size:18px;font-weight:800}
  #seenbtn{background:var(--good);color:#fff}
  #newbtn{background:#eef1ff;color:#5b6cff}
  #seenbtn:disabled,#newbtn:disabled{opacity:.35;pointer-events:none}
  #hotkeys{font-size:12px;color:#7a93b5}
  #replay{width:44px;height:44px;background:#eaf6ff;color:#2e9bff;font-size:20px;border-radius:50%;padding:0}
  .flashg{animation:flashg .4s}@keyframes flashg{0%{background:#d3f5e0}100%{background:transparent}}
  .flashr{animation:flashr .4s}@keyframes flashr{0%{background:#ffd9d9}100%{background:transparent}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;transition:transform .5s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:210px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">WM-bubble-01 · Bubble Pop Memory</div>
    <div id="phasecue">🫧</div>
    <div id="stagecard">
      <div id="stream"></div>
      <div id="controls">
        <button id="replay" title="replay demo">↻</button>
        <button id="newbtn" title="new (J)">🆕 NEW <span style="font-weight:400">(J)</span></button>
        <button id="seenbtn" title="seen (F)">✅ SEEN <span style="font-weight:400">(F)</span></button>
      </div>
      <div id="hotkeys">Keys: F = seen before · J = new word</div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,last=a=>a[a.length-1],sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.round(Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length));};

/* ---------- small embedded word bank + lure-similar near-neighbours ---------- */
const WORDS=['CAT','DOG','SUN','MOON','TREE','FISH','BIRD','STAR','LAMP','DESK','BOOK','CHAIR','APPLE','GRAPE','MOUSE','HOUSE','CLOUD','RIVER','TABLE','PLANT','SHEEP','HORSE','TIGER','ROBOT','PENCIL'];
const LURES={'CAT':'COT','DOG':'DOT','SUN':'RUN','MOON':'NOON','TREE':'THREE','FISH':'DISH','BIRD':'BIRD ','STAR':'SCAR','LAMP':'LAMB','DESK':'DISK','BOOK':'LOOK','CHAIR':'CHAIN','APPLE':'AMPLE','GRAPE':'GRACE','MOUSE':'HOUSE','HOUSE':'MOUSE','CLOUD':'CROWD','RIVER':'RIDER','TABLE':'CABLE','PLANT':'PLANK','SHEEP':'SHEET','HORSE':'HOUSE','TIGER':'TIMER','ROBOT':'ROBIN','PENCIL':'PENCEL'};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
// Build a stream: some repeats (targets = SEEN), some brand-new words, and lure-similar near-neighbours of seen words (hard "new" foils).
function genStream(listLen,lureRate){
  const vocab=shuffle(WORDS);
  const stream=[];const seenSoFar=new Set();
  for(let i=0;i<listLen;i++){
    const repeatChance=i>3 && Math.random()<0.38;
    if(repeatChance && seenSoFar.size){
      const seenArr=[...seenSoFar];const w=seenArr[(Math.random()*seenArr.length)|0];
      stream.push({w,isOld:true});
    } else if(Math.random()<lureRate && seenSoFar.size){
      const seenArr=[...seenSoFar];const base=seenArr[(Math.random()*seenArr.length)|0];
      stream.push({w:LURES[base]||base+'S',isOld:false,lure:true});
    } else {
      const fresh=vocab.find(w=>!seenSoFar.has(w) && !stream.some(s=>s.w===w));
      const w=fresh||vocab[(Math.random()*vocab.length)|0];
      stream.push({w,isOld:false});seenSoFar.add(w);
    }
  }
  return stream;
}
function levelParams(l){return {listLen:Math.min(10+l*2,26), lureRate:Math.min(0.15+l*0.06,0.5)};}

/* ---------- state ---------- */
let level=1,maxLevel=1,phase='demo',locked=true;
let stream=[],idx=0,T={hits:0,miss:0,fa:0,cr:0,rts:[],itemStart:0,seenSet:new Set(),scoredRounds:0,exact:0,scored:0,updateCosts:[]};
function dprimeCalc(){
  const hitRate=Math.min(0.99,Math.max(0.01,T.hits/Math.max(1,T.hits+T.miss)));
  const faRate=Math.min(0.99,Math.max(0.01,T.fa/Math.max(1,T.fa+T.cr)));
  const z=p=>{ // inverse normal approx (Abramowitz-Stegun rational approx)
    const a1=-3.969683028665376e+01,a2=2.209460984245205e+02,a3=-2.759285104469687e+02,a4=1.383577518672690e+02,a5=-3.066479806614716e+01,a6=2.506628277459239e+00;
    const b1=-5.447609879822406e+01,b2=1.615858368580409e+02,b3=-1.556989798598866e+02,b4=6.680131188771972e+01,b5=-1.328068155288572e+01;
    const c1=-7.784894002430293e-03,c2=-3.223964580411365e-01,c3=-2.400758277161838e+00,c4=-2.549732539343734e+00,c5=4.374664141464968e+00,c6=2.938163982698783e+00;
    const d1=7.784695709041462e-03,d2=3.224671290700398e-01,d3=2.445134137142996e+00,d4=3.754408661907416e+00;
    const plow=0.02425;
    if(p<plow){const q=Math.sqrt(-2*Math.log(p));return (((((c1*q+c2)*q+c3)*q+c4)*q+c5)*q+c6)/((((d1*q+d2)*q+d3)*q+d4)*q+1);}
    if(p>1-plow){const q=Math.sqrt(-2*Math.log(1-p));return -(((((c1*q+c2)*q+c3)*q+c4)*q+c5)*q+c6)/((((d1*q+d2)*q+d3)*q+d4)*q+1);}
    const q=p-0.5,r=q*q;return (((((a1*r+a2)*r+a3)*r+a4)*r+a5)*r+a6)*q/(((((b1*r+b2)*r+b3)*r+b4)*r+b5)*r+1);
  };
  return (z(hitRate)-z(faRate)).toFixed(2);
}
function accStr(){return T.scored?`${T.exact}/${T.scored}  ${Math.round(100*T.exact/T.scored)}%`:'\u2014';}
function faStr(){return `${T.fa} false alarms`;}
function updateCostStr(){return T.updateCosts.length?`${mean(T.updateCosts)} ms`:'\u2014';}
function rtvarStr(){return T.rts.length>1?`sd ${sd(T.rts)} ms`:'\u2014';}
function learnRate(){return T.scoredRounds?`n reached ${maxLevel} in ${T.scoredRounds} rounds`:'\u2014';}
const METERS=[
 {id:'M-ACC',name:'Recognition accuracy',get:accStr},
 {id:'M-DPRIME',name:"Sensitivity (d')",get:dprimeCalc},
 {id:'M-FALSEALARM',name:'False alarms (new marked seen)',get:faStr},
 {id:'M-UPDATECOST',name:'Update cost (RT after lure)',get:updateCostStr},
 {id:'M-RTVAR',name:'Response-time variability',get:rtvarStr},
 {id:'M-DIFFREACH',name:'Difficulty reached (list length)',get:()=>`level ${maxLevel}`},
 {id:'M-LEARNRATE',name:'Learning rate across rounds',get:learnRate},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(450);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(380);}

/* ---------- render ---------- */
let curBubble=null,wasLureBefore=false;
function paintBubble(w){$('#stream').innerHTML='';const b=document.createElement('div');b.className='bubble';b.style.bottom='50px';b.textContent=w;$('#stream').appendChild(b);curBubble=b;}
function respond(said){if(locked||phase==='demo'||phase==='done')return;
  const item=stream[idx];const rt=Date.now()-T.itemStart;
  const correct=said===item.isOld;
  curBubble.classList.add(correct?'flashg':'flashr');
  T.rts.push(rt);
  if(item.lure)T.updateCosts.push(rt);
  if(said && item.isOld)T.hits++; else if(said && !item.isOld)T.fa++;
  else if(!said && item.isOld)T.miss++; else T.cr++;
  log(`"${item.w}"${item.isOld?' (OLD)':item.lure?' (LURE-new)':' (new)'} \u2192 ${said?'SEEN':'NEW'} ${correct?'\u2713':'\u2717'}`);
  advance();
}
function advance(){locked=true;idx++;
  if(idx>=stream.length){finishRound();return;}
  setTimeout(()=>{T.itemStart=Date.now();paintBubble(stream[idx].w);locked=false;},350);
}
function finishRound(){locked=true;
  const roundExact = T.fa===0 && T.miss===0; // simplistic per-round exactness proxy
  if(phase==='warmup'){log('— warm-up round complete — UNSCORED —');setTimeout(nextPhase,1000);return;}
  T.scored++;T.scoredRounds++;
  const dp=parseFloat(dprimeCalc());
  if(dp>=1.2){T.exact++;level=Math.min(8,level+1);}else if(dp<0.5){level=Math.max(1,level-1);}
  maxLevel=Math.max(maxLevel,level);
  log(`— ROUND END: hits ${T.hits} miss ${T.miss} FA ${T.fa} CR ${T.cr} \u00b7 d'=${dp} \u2192 next level ${level} —`);
  renderMeters();setTimeout(nextPhase,1400);
}
function nextPhase(){locked=false;
  if(phase==='warmup'){startScored();}
  else if(phase==='scored'){T.roundIdx=(T.roundIdx||0)+1;T.roundIdx<5?startScored():finish();}
}
function setCue(i){$('#phasecue').textContent=i;}
function newRound(l){const p=levelParams(l);stream=genStream(p.listLen,p.lureRate);idx=0;
  T.hits=0;T.miss=0;T.fa=0;T.cr=0;T.updateCosts=[];T.itemStart=Date.now();
  paintBubble(stream[0].w);$('#seenbtn').disabled=false;$('#newbtn').disabled=false;renderMeters();}
function startWarmup(){phase='warmup';setCue('\u2b50');newRound(1);log('— warm-up (unscored): tap SEEN if this word appeared before, NEW if not —');}
function startScored(){phase='scored';setCue('\ud83c\udfaf');newRound(level);log(`— SCORED round: ${levelParams(level).listLen} words, level ${level} —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');locked=true;$('#seenbtn').disabled=true;$('#newbtn').disabled=true;
  log(`— DONE \u00b7 d'=${dprimeCalc()} \u00b7 max level ${maxLevel} —`);}
async function runDemo(){phase='demo';setCue('\ud83d\udc41\ufe0f');locked=true;
  stream=[{w:'CAT',isOld:false},{w:'DOG',isOld:false},{w:'CAT',isOld:true}];idx=0;T.itemStart=Date.now();
  paintBubble(stream[0].w);log('ghost-hand demo (wordless, <10s)');ghostShow(true);await sleep(300);
  await ghostTo($('#newbtn'));await ghostTap();idx=1;paintBubble(stream[1].w);await sleep(250);
  await ghostTo($('#newbtn'));await ghostTap();idx=2;paintBubble(stream[2].w);await sleep(250);
  await ghostTo($('#seenbtn'));await ghostTap();await sleep(300);ghostShow(false);await sleep(400);startWarmup();}
$('#seenbtn').addEventListener('click',()=>respond(true));
$('#newbtn').addEventListener('click',()=>respond(false));
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
document.addEventListener('keydown',e=>{if(phase==='demo'||phase==='done'||locked)return;
  if(e.key.toLowerCase()==='f')respond(true); else if(e.key.toLowerCase()==='j')respond(false);});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
