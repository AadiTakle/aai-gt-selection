<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-bubble-01 — Bubble Pop Memory (n-back)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #stage{width:420px;height:250px;background:linear-gradient(#0d2135,#123049);border:1px solid var(--edge);border-radius:20px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  #bubble{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffffaa,#5cc8ff55);display:flex;align-items:center;justify-content:center;font-size:56px;opacity:0;transition:opacity .12s,transform .12s}
  #bubble.show{opacity:1}
  #history{position:absolute;top:8px;left:8px;display:flex;gap:4px;font-size:20px;opacity:.5}
  #pop{font-size:22px;padding:14px 34px;border-radius:16px;border:2px solid var(--accent);background:#173a52;color:var(--ink);cursor:pointer;font-weight:700}
  #pop:active{transform:scale(.96)}#pop.flash{background:var(--good);border-color:transparent;color:#06251a}#pop.wrong{background:var(--bad);border-color:transparent}
  #verdict{font-size:24px;height:32px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.ctl{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🫧 Bubble Pop Memory <span class="badge" id="blevel">1-back</span></h1>
    <p class="sub">Bubbles float by one at a time. Tap <b>POP</b> whenever the bubble is the same as the one from <b>n bubbles ago</b>. Consistency matters, not speed.</p>
  </div>
  <div id="stage"><div id="history"></div><div id="bubble"></div></div>
  <button id="pop">🫧 POP (match!)</button>
  <div id="verdict"></div>
  <div class="row">
    <button class="pri ctl" id="go">▶ Watch how it works</button>
    <button class="ctl" id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const POOL=["🐰","🦊","🐸","🐼","🐷","🐨"];
const bubble=$("#bubble"),history=$("#history"),pop=$("#pop"),verdict=$("#verdict");
const T={phase:"idle",n:1,maxn:1,seq:[],hits:0,tgt:0,fa:0,nontgt:0,miss:0,rt:[],lastErr:false,postErr:[],base:[],
  loadAcc:{1:[0,0],2:[0,0],3:[0,0]},log:[]};
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m}
function ppf(p){p=Math.min(0.99,Math.max(0.01,p));const a=[-39.69,220.95,-275.93,138.36,-30.66,2.506],b=[-54.48,161.59,-155.70,66.80,-13.28];
  const pl=0.02425;let q,r;if(p<pl){q=Math.sqrt(-2*Math.log(p));return (((((a[0]*q+a[1])*q+a[2])*q+a[3])*q+a[4])*q+a[5])/((((b[0]*q+b[1])*q+b[2])*q+b[3])*q+1);}
  if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));return -(((((a[0]*q+a[1])*q+a[2])*q+a[3])*q+a[4])*q+a[5])/((((b[0]*q+b[1])*q+b[2])*q+b[3])*q+1);}
  q=p-0.5;r=q*q;return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
function dprime(){const H=T.tgt?Math.min(1-1e-3,Math.max(1e-3,T.hits/T.tgt)):0.5;const F=T.nontgt?Math.min(1-1e-3,Math.max(1e-3,T.fa/T.nontgt)):0.5;return (ppf(H)-ppf(F));}
function faRate(){return T.nontgt?Math.round(100*T.fa/T.nontgt):0}
function updcost(){const a1=T.loadAcc[1],a2=T.loadAcc[2];const p1=a1[1]?a1[0]/a1[1]:null,p2=a2[1]?a2[0]/a2[1]:null;return (p1!=null&&p2!=null)?Math.round(100*(p1-p2)):0;}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop()}
function render(){
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-bubble-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>current load</span><b>${T.n}-back</b></div>
  <h2>Sensitivity <span class="m">M-DPRIME</span></h2>
  <div class="kv"><span>d-prime</span><b>${dprime().toFixed(2)}</b></div>
  <div class="kv"><span>hits / targets <span class="m">M-ACC</span></span><b>${T.hits}/${T.tgt}</b></div>
  <h2>Impulsivity</h2>
  <div class="kv"><span>false-alarm rate <span class="m">M-FALSEALARM</span></span><b>${faRate()}%</b></div>
  <h2>Updating efficiency <span class="m">M-UPDATECOST</span></h2>
  <div class="kv"><span>acc drop 1→2-back</span><b>${updcost()}%</b></div>
  <h2>Above-grade ceiling <span class="m">M-DIFFREACH</span></h2>
  <div class="kv"><span>highest n reached</span><b>${T.maxn}-back</b></div>
  <h2>Consistency</h2>
  <div class="kv"><span>hit-RT CV <span class="m">M-RTVAR</span></span><b>${cv(T.rt).toFixed(2)}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();

let cur=null;
pop.onpointerdown=()=>{if(!cur||cur.popped||cur.done)return;cur.popped=true;cur.rt=performance.now()-cur.onset;pop.classList.add(cur.isTarget?"flash":"wrong");setTimeout(()=>pop.classList.remove("flash","wrong"),200);};
async function step(scored){
  let e;const isTarget=T.seq.length>=T.n&&Math.random()<0.35;
  if(isTarget)e=T.seq[T.seq.length-T.n];else{do{e=POOL[Math.floor(Math.random()*POOL.length)];}while(T.seq.length>=T.n&&e===T.seq[T.seq.length-T.n]);}
  T.seq.push(e);
  history.innerHTML=T.seq.slice(-T.n).map(x=>`<span>${x}</span>`).join("");
  bubble.textContent=e;bubble.classList.add("show");cur={onset:performance.now(),isTarget,popped:false,done:false,rt:null};
  const dur=1500;await sleep(dur);cur.done=true;bubble.classList.remove("show");
  if(scored){
    const load=T.n;const rec=T.loadAcc[load]||(T.loadAcc[load]=[0,0]);
    if(isTarget){T.tgt++;rec[1]++;if(cur.popped){T.hits++;rec[0]++;T.rt.push(cur.rt);(T.lastErr?T.postErr:T.base).push(cur.rt);verdict.textContent="✅";T.lastErr=false;}else{T.miss++;verdict.textContent="🐢 missed";T.lastErr=true;logE(`miss (${T.n}-back)`);}}
    else{T.nontgt++;if(cur.popped){T.fa++;verdict.textContent="❌ not a match";T.lastErr=true;logE("false alarm");}else{verdict.textContent="·";}}
  }
  render();await sleep(300);verdict.textContent="";
}
async function block(scored,len){for(let i=0;i<len;i++)await step(scored);}

async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;$("#replay").disabled=true;
  T.seq=[];bubble.textContent="🐰";bubble.classList.add("show");history.innerHTML="<span>🐰</span>";await sleep(900);bubble.classList.remove("show");await sleep(300);
  bubble.textContent="🐰";bubble.classList.add("show");history.innerHTML="<span>🐰</span>";
  const ghost=document.createElement("div");ghost.textContent="👆";ghost.style.cssText="position:fixed;font-size:30px;z-index:9;transition:left .5s,top .5s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  const r=pop.getBoundingClientRect();await sleep(400);ghost.style.opacity="1";ghost.style.left=(r.left+r.width/2-12)+"px";ghost.style.top=(r.top+8)+"px";
  await sleep(600);pop.classList.add("flash");verdict.textContent="✅ same as 1 ago!";await sleep(500);pop.classList.remove("flash");bubble.classList.remove("show");
  ghost.remove();T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice round";$("#go").onclick=warmup;
  $("#phasehint").textContent="Pop only when it repeats from n-ago. Practice (not scored).";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;
async function warmup(){T.phase="warm-up (unscored)";render();$("#go").disabled=true;$("#replay").disabled=true;T.seq=[];await block(false,5);
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;$("#go").textContent="▶ Start scored game";$("#go").onclick=startScored;
  $("#phasehint").textContent="These count. Stay steady — a false pop hurts as much as a miss.";render();}
async function startScored(){T.phase="scored";render();$("#go").disabled=true;$("#replay").disabled=true;T.seq=[];
  for(let b=0;b<3;b++){await block(true,8);
    const d=dprime();if(d>=1.5&&T.n<3){T.n++;T.maxn=Math.max(T.maxn,T.n);$("#blevel").textContent=T.n+"-back";logE(`level up → ${T.n}-back`);}
    else if(d<0.5&&T.n>1){T.n--;$("#blevel").textContent=T.n+"-back";}
    T.seq=[];render();}
  T.phase="done";$("#go").disabled=false;$("#replay").disabled=false;$("#go").textContent="▶ Play again";$("#go").onclick=startScored;
  $("#phasehint").textContent=`Done. d-prime ${dprime().toFixed(2)} at ${T.maxn}-back ceiling; false-alarm rate ${faRate()}%.`;verdict.textContent="🏁";render();}
</script>
</body>
</html>
