<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS-TRAIL-01 — Dot-to-Dot Dash (ordered connect-the-sequence speed)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;
    --accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
  h1{font-size:19px;margin:.2rem 0}
  .sub{color:var(--mut);font-size:13px;margin:0 0 6px;text-align:center;max-width:500px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--accent);font-size:12px}
  #board{position:relative;width:500px;height:300px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;overflow:hidden}
  svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .node{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#20284a;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;cursor:pointer;transition:transform .07s,background .12s,box-shadow .12s;z-index:2}
  .node:active{transform:scale(.9)}
  .node.next{box-shadow:0 0 0 3px var(--warn)}
  .node.done{background:var(--good);color:#04231b;border-color:transparent}
  .node.err{background:var(--bad)}
  #ghost{position:absolute;font-size:26px;left:0;top:0;transition:left .38s cubic-bezier(.5,0,.3,1),top .38s cubic-bezier(.5,0,.3,1);pointer-events:none;filter:drop-shadow(0 3px 3px #0008);z-index:9;opacity:0}
  #cue{font-size:26px;height:32px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:9px 16px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button.on{background:var(--warn);color:#3a2c00;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}
  .kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>✏️ Dot-to-Dot Dash <span class="badge" id="bmode">1→2→3</span></h1>
    <p class="sub">Connect the dots <b>in order</b> as fast as you can. Tapping the wrong dot won't connect — so accuracy is built in; only your clean run time counts.</p>
  </div>
  <div id="board"><svg id="lines"></svg><div id="ghost">👆</div></div>
  <div id="cue">👀</div>
  <div class="row">
    <button class="pri" id="go">▶ Watch how it works</button>
    <button id="mode" title="numbers vs number-letter alternation">Switch mode (1→A→2→B)</button>
  </div>
  <p class="sub" id="hint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const board=$("#board"),lines=$("#lines"),ghost=$("#ghost"),cue=$("#cue");
const LET="ABCDEFGH";
const T={phase:"idle",mode:"A",count:5,trials:0,
  timesA:[],timesB:[],segRT:[],errN:0,taps:0,seq:[],accSeries:[],log:[],running:false};
function med(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}
function sd(a){if(a.length<2)return 0;const m=a.reduce((s,v)=>s+v,0)/a.length;return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/a.length);}
function cv(a){const m=a.length?a.reduce((s,v)=>s+v,0)/a.length:0;return m?Math.round(100*sd(a)/m):0;}
function drift(){if(T.accSeries.length<4)return"—";const h=T.accSeries.length>>1;const m=x=>x.reduce((s,v)=>s+v,0)/x.length;return Math.round(m(T.accSeries.slice(h))-m(T.accSeries.slice(0,h)))+"ms";}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>50)T.log.pop();}
function render(){
  const switchCost=(T.timesA.length&&T.timesB.length)?Math.round(med(T.timesB)-med(T.timesA)):null;
  $("#tel").innerHTML=`
  <h2>Live telemetry · PS-TRAIL-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>mode · dots</span><b>${T.mode==="A"?"numbers":"alternating"} · ${T.count}</b></div>
  <div class="kv"><span>clean trails</span><b>${T.trials}</b></div>
  <h2>Speed (clean runs only)</h2>
  <div class="kv"><span>median part-A time <span class="m">M-RT</span></span><b>${T.timesA.length?Math.round(med(T.timesA)):"—"} ms</b></div>
  <div class="kv"><span>median part-B time <span class="m">M-RT</span></span><b>${T.timesB.length?Math.round(med(T.timesB)):"—"} ms</b></div>
  <div class="kv"><span>segment consistency <span class="m">M-RTVAR</span></span><b>${cv(T.segRT)}%</b></div>
  <div class="kv"><span>drift <span class="m">M-DRIFT</span></span><b>${drift()}</b></div>
  <h2>Flexibility & accuracy</h2>
  <div class="kv"><span>switch cost B−A <span class="m">M-SWITCHCOST</span></span><b>${switchCost==null?"—":switchCost+" ms"}</b></div>
  <div class="kv"><span>sequence errors <span class="m">M-ERRTYPE·M-FALSEALARM</span></span><b>${T.errN}</b></div>
  <div class="kv"><span>tap efficiency <span class="m">M-EFF</span></span><b>${T.taps?Math.round(100*(T.taps-T.errN)/T.taps):"—"}%</b></div>
  <div class="kv"><span>path <span class="m">M-PATH</span></span><b>${T.seq.slice(-8).join(">")||"—"}</b></div>
  <div class="kv"><span>engagement <span class="m">M-ENGAGE</span></span><b>${T.running?"active":"idle"}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();
function centerOf(el){const r=el.getBoundingClientRect(),s=board.getBoundingClientRect();return{x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2};}
function seqLabels(){const out=[];if(T.mode==="A"){for(let i=1;i<=T.count;i++)out.push(String(i));}
  else{const pairs=Math.ceil(T.count/2);for(let i=0;i<pairs;i++){out.push(String(i+1));if(out.length<T.count)out.push(LET[i]);}}
  return out.slice(0,T.count);}
function place(labels){
  const pts=[];const W=500,H=300,pad=34;let tries=0;
  while(pts.length<labels.length&&tries<4000){tries++;const x=pad+Math.random()*(W-2*pad),y=pad+Math.random()*(H-2*pad);
    if(pts.every(p=>Math.hypot(p.x-x,p.y-y)>62)){pts.push({x,y});}}
  return pts;
}
let nodes=[],order=[],idx=0,startT=0,lastT=0;
function build(){
  const labels=seqLabels();const pts=place(labels);
  board.querySelectorAll(".node").forEach(n=>n.remove());lines.innerHTML="";
  nodes=labels.map((lab,i)=>{const d=document.createElement("div");d.className="node";d.textContent=lab;d.dataset.k=i;
    d.style.left=pts[i].x+"px";d.style.top=pts[i].y+"px";board.appendChild(d);return {el:d,lab,x:pts[i].x,y:pts[i].y};});
  order=labels.slice();idx=0;highlight();
}
function highlight(){nodes.forEach((n,i)=>n.el.classList.toggle("next",i===idx&&T.phase!=="demo"));}
function drawLine(a,b){const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",a.x);l.setAttribute("y1",a.y);l.setAttribute("x2",b.x);l.setAttribute("y2",b.y);l.setAttribute("stroke","#5cc8ff");l.setAttribute("stroke-width","4");l.setAttribute("stroke-linecap","round");lines.appendChild(l);}
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;$("#mode").disabled=true;
  const save=T.count,sm=T.mode;T.count=3;T.mode="A";build();cue.textContent="👀";ghost.style.opacity="1";
  for(let i=0;i<nodes.length;i++){const n=nodes[i];ghost.style.left=(n.x-12)+"px";ghost.style.top=(n.y-24)+"px";await sleep(560);
    n.el.classList.add("done");if(i>0)drawLine(nodes[i-1],nodes[i]);}
  cue.textContent="✅";await sleep(800);ghost.style.opacity="0";T.count=save;T.mode=sm;
  $("#go").disabled=false;$("#mode").disabled=false;$("#go").textContent="▶ Try a practice one";$("#go").onclick=warmup;
  T.phase="idle";$("#hint").textContent="Now you try — this practice one is NOT scored.";render();
}
$("#go").onclick=demo;
function trail(scored){
  return new Promise(res=>{
    build();idx=0;startT=0;lastT=0;let errThis=0;cue.textContent="✏️";
    function onClick(e){const nd=e.target.closest(".node");if(!nd)return;const k=+nd.dataset.k;const now=performance.now();
      if(scored)T.taps++;
      if(k===idx){
        if(idx===0){startT=now;lastT=now;}
        else{if(scored){T.segRT.push(now-lastT);}lastT=now;drawLine(nodes[idx-1],nodes[k]);}
        nodes[k].el.classList.remove("next");nodes[k].el.classList.add("done");T.seq.push(order[k]);idx++;highlight();
        if(idx===nodes.length){board.removeEventListener("click",onClick);const total=now-startT;
          if(scored){T.trials++;T.accSeries.push(total);(T.mode==="A"?T.timesA:T.timesB).push(total);
            logE(`${T.mode} n${T.count}: ${Math.round(total)}ms, ${errThis} err`);}
          cue.textContent="🏁";render();setTimeout(res,600);}
      } else { // wrong: no advance, flash
        nd.classList.add("err");setTimeout(()=>nd.classList.remove("err"),300);errThis++;if(scored)T.errN++;
        logE(`misfire on ${order[k]} (want ${order[idx]})`);render();
      }
    }
    board.addEventListener("click",onClick);
  });
}
async function warmup(){$("#go").disabled=true;$("#mode").disabled=true;T.phase="warm-up (unscored)";const c=T.count;T.count=4;render();await trail(false);T.count=c;
  T.phase="idle";$("#go").disabled=false;$("#mode").disabled=false;$("#go").textContent="▶ Start scored trails";$("#go").onclick=startScored;
  $("#hint").textContent="Great! These count. Try both modes — the difference (B minus A) is the switch cost.";render();}
let left=0;
async function startScored(){$("#go").disabled=true;$("#mode").disabled=true;T.phase="scored";T.running=true;render();left=6;await loop();}
async function loop(){if(left<=0){finish();return;}await trail(true);left--;
  if(T.trials&&T.trials%2===0&&T.count<8)T.count++;
  await sleep(650);if(left>0)await loop();else finish();}
function finish(){T.phase="done";T.running=false;cue.textContent="🏁";$("#go").disabled=false;$("#mode").disabled=false;$("#go").textContent="▶ Run more trails";$("#go").onclick=startScored;
  const sc=(T.timesA.length&&T.timesB.length)?Math.round(med(T.timesB)-med(T.timesA)):null;
  $("#hint").textContent=`Done. ${sc==null?"Try both modes to get a switch cost.":"Switch cost ≈ "+sc+" ms."} Consistency (CV ${cv(T.segRT)}%), not fastest single trail, is the tail signal.`;render();}
$("#mode").onclick=()=>{T.mode=T.mode==="A"?"B":"A";$("#mode").classList.toggle("on",T.mode==="B");$("#bmode").textContent=T.mode==="A"?"1→2→3":"1→A→2→B";$("#mode").textContent=T.mode==="A"?"Switch mode (1→A→2→B)":"Number mode (1→2→3)";logE("mode → "+(T.mode==="A"?"numbers":"alternating"));build();render();};
build();
</script>
</body>
</html>
