<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-WATERWORKS-01 · Aqueduct Lab</title>
<style>
  :root{--bg1:#e8fbff;--bg2:#e6f0ff;--ink:#26304a;--card:#fff;--accent:#1c9bd8;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:14px}
  #instr{font-size:14px;color:#666;min-height:20px;text-align:center;max-width:420px}
  #grid{display:grid;gap:4px;background:#cfe8f4;padding:8px;border-radius:12px}
  .cell{width:58px;height:58px;border-radius:9px;background:#f2fafd;display:flex;align-items:center;justify-content:center;
    position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .cell.rock{background:#6b7688;cursor:default}
  .cell.src{background:#d5f3ff}.cell.tank{background:#d9fff0}
  .pipe{position:absolute;inset:0}
  .pipe i{position:absolute;background:#7fbfe0;border-radius:3px}
  .pipe.on i{background:#1c9bd8}
  .cell.water .pipe i{background:#2fa8e6;box-shadow:0 0 8px #7fdcff}
  #tray{display:flex;gap:12px}
  .tp{width:64px;height:56px;border-radius:12px;background:#eef6ff;border:3px solid #d7e6ff;display:flex;align-items:center;
    justify-content:center;cursor:pointer;position:relative}
  .tp.sel{border-color:var(--accent);background:#dcefff}
  .tp svg{width:44px;height:40px}
  #row{display:flex;gap:14px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:12px}
  #flow{background:var(--accent);color:#fff;padding:10px 20px;font-weight:700;font-size:17px;border-radius:14px}
  #replay{width:44px;height:44px;background:#eef1ff;color:#5b6cff;font-size:20px;border-radius:50%}
  #ghost{position:fixed;left:0;top:0;font-size:34px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .5s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:180px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:880px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:260px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-WATERWORKS-01 · Aqueduct Lab</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="instr"></div>
      <div id="grid"></div>
      <div id="tray"></div>
      <div id="row"><button id="flow">💧 FLOW</button><button id="replay" title="replay demo">↻</button></div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const OPP={L:'R',R:'L',U:'D',D:'U'},DELTA={L:[0,-1],R:[0,1],U:[-1,0],D:[1,0]};
// piece openings by type+rotation
const DEF={straight:[['L','R'],['U','D']],elbow:[['U','R'],['R','D'],['D','L'],['L','U']]};
// segments to draw (as tiny bars from center to each opening)
function pipeSVG(){return ''}
// LEVELS: rows x cols grid; source feeds cell (sr,0) from its LEFT; tank drains (tr,cols-1) to its RIGHT
const LEVELS={
 warm:{rows:1,cols:3,sr:0,tr:0,rocks:[],opt:1,pre:{'0,0':{type:'straight',rot:0},'0,2':{type:'straight',rot:0}}}, // middle gap
 s1:{rows:3,cols:5,sr:1,tr:1,rocks:['1,2'],opt:5,pre:{'1,0':{type:'straight',rot:0},'1,4':{type:'straight',rot:0}}}
};
const T={itemStart:0,placements:0,firstLat:null,firstActed:false,opt:0,runs:0,used:0,progress:0,scored:0,correct:0,cells:null};
const METERS=[
 {id:'M-ACC',name:'Level filled (scored)',get:()=>T.scored?`${T.correct}/${T.scored}`:'—'},
 {id:'M-EFF',name:'Pieces vs optimal',get:()=>T.opt&&T.used?`${T.opt}/${T.used}  ${Math.round(100*T.opt/Math.max(T.used,1))}%`:'—'},
 {id:'M-PATH',name:'Placements + rotations',get:()=>T.placements+''},
 {id:'M-EXPLORE',name:'Distinct cells used',get:()=>T.cells?T.cells.size:0},
 {id:'M-RTFIRST',name:'First-action latency (plan)',get:()=>T.firstLat==null?'—':T.firstLat+' ms'},
 {id:'M-HYP',name:'FLOW test runs',get:()=>T.runs+''},
 {id:'M-PROG',name:'Path connected (last run)',get:()=>T.runs?Math.round(100*T.progress)+'%':'—'},
 {id:'M-PERSIST',name:'Time-on-task (ms)',get:()=>T.itemStart?(Date.now()-T.itemStart):'—'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const t=T.itemStart?Date.now()-T.itemStart:0;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-6}px,${c.y-4}px)`;await sleep(500)}

let phase='demo',L=null,placed={},selType='straight',locked=false;
const setCue=i=>$('#phasecue').textContent=i;
function key(r,c){return r+','+c}
function bars(op){ // build inner bars for a set of openings
  const seg={L:'left:0;top:22px;width:26px;height:14px',R:'right:0;top:22px;width:26px;height:14px',
             U:'left:22px;top:0;width:14px;height:26px',D:'left:22px;bottom:0;width:14px;height:26px'};
  const hub='left:20px;top:20px;width:18px;height:18px;border-radius:50%';
  return `<i style="${hub}"></i>`+op.map(o=>`<i style="${seg[o]}"></i>`).join('')}
function render(){const g=$('#grid');g.style.gridTemplateColumns=`repeat(${L.cols},58px)`;g.innerHTML='';
  for(let r=0;r<L.rows;r++)for(let c=0;c<L.cols;c++){const d=document.createElement('div');d.className='cell';d.dataset.r=r;d.dataset.c=c;
    if(L.rocks.includes(key(r,c)))d.classList.add('rock'),d.textContent='🪨';
    if(r===L.sr&&c===0)d.classList.add('src');
    if(r===L.tr&&c===L.cols-1)d.classList.add('tank');
    const p=placed[key(r,c)];
    if(p){const op=DEF[p.type][p.rot];d.innerHTML=`<div class="pipe on">${bars(op)}</div>`;}
    if(r===L.sr&&c===0)d.insertAdjacentHTML('beforeend','<span style="position:absolute;left:-2px;font-size:22px">🚰</span>');
    if(r===L.tr&&c===L.cols-1)d.insertAdjacentHTML('beforeend','<span style="position:absolute;right:-2px;font-size:22px">🛢️</span>');
    g.appendChild(d)}}
function newLevel(spec){L=spec;placed={};for(const k in spec.pre)placed[k]={...spec.pre[k]};
  T.itemStart=Date.now();T.placements=0;T.firstActed=false;T.firstLat=null;T.opt=spec.opt;T.runs=0;T.used=Object.keys(placed).length;T.progress=0;T.cells=new Set(Object.keys(placed));locked=false;
  render();renderMeters()}
function onCell(r,c){if(locked)return;const k=key(r,c);
  if(L.rocks.includes(k))return; if(r===L.sr&&c===0)return; if(r===L.tr&&c===L.cols-1)return;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first action (after planning)')}
  T.placements++;
  if(placed[k]){placed[k].rot=(placed[k].rot+1)%DEF[placed[k].type].length;log(`rotate ${placed[k].type} at ${k}`)}
  else{placed[k]={type:selType,rot:0};T.cells.add(k);log(`place ${selType} at ${k}`)}
  T.used=Object.keys(placed).length;render();renderMeters()}
function openings(k){const p=placed[k];return p?DEF[p.type][p.rot]:null}
function runFlow(){ // BFS from source; returns {reached, filledCells}
  const start=key(L.sr,0),tank=key(L.tr,L.cols-1);
  const wet=new Set(),q=[];
  // source feeds (sr,0) from LEFT: (sr,0) must have opening L
  if(openings(start)&&openings(start).includes('L')){wet.add(start);q.push([L.sr,0])}
  while(q.length){const[r,c]=q.shift();const op=openings(key(r,c));
    for(const o of op){const[dr,dc]=DELTA[o];const nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=L.rows||nc>=L.cols)continue;
      const nk=key(nr,nc);if(wet.has(nk))continue;const nop=openings(nk);if(nop&&nop.includes(OPP[o])){wet.add(nk);q.push([nr,nc])}}}
  const reached=wet.has(tank)&&openings(tank).includes('R');
  return {reached,wet}}
async function flow(){if(locked)return;T.runs++;const {reached,wet}=runFlow();
  const total=(L.rows*L.cols)-L.rocks.length; T.progress=Math.min(1,wet.size/ (L.opt+1));
  // animate
  const order=[...wet];for(const k of order){const[r,c]=k.split(',').map(Number);const el=$(`.cell[data-r="${r}"][data-c="${c}"]`);if(el){el.classList.add('water');await sleep(140)}}
  renderMeters();
  if(reached){locked=true;$('#instr').textContent='The tank filled! 💧';setCue(phase==='scored'?'🏆':'⭐');
    if(phase==='scored'){T.scored++;T.correct++;log(`FILLED · pieces ${T.used} (optimal ${T.opt}) · runs ${T.runs} · firstLat ${T.firstLat}ms`);renderMeters();setTimeout(finish,1400)}
    else{log('warm-up filled (unscored)');setTimeout(startScored,1300)}}
  else{log(`run ${T.runs}: not connected yet — adjust pipes`);setTimeout(()=>{$$('.cell').forEach(x=>x.classList.remove('water'))},700)}}
function finish(){phase='done';locked=true;setCue('🏆');$('#instr').textContent='Done! Great flow engineering.'}
function renderTray(){const t=$('#tray');t.innerHTML='';
  [['straight','↔'],['elbow','⌐']].forEach(([ty,gl])=>{const d=document.createElement('div');d.className='tp'+(selType===ty?' sel':'');d.dataset.ty=ty;
    d.innerHTML=`<div class="pipe on" style="position:relative;width:44px;height:40px">${ty==='straight'?'<i style="left:0;top:14px;width:44px;height:12px;background:#1c9bd8;border-radius:3px"></i>':'<i style="left:16px;top:0;width:12px;height:24px;background:#1c9bd8;border-radius:3px"></i><i style="left:16px;top:14px;width:28px;height:12px;background:#1c9bd8;border-radius:3px"></i>'}</div>`;
    t.appendChild(d)})}
function startWarmup(){phase='warmup';setCue('⭐');$('#instr').textContent='Warm-up: put a pipe in the gap, then tap FLOW. (unscored)';newLevel(LEVELS.warm);renderTray();log('— warm-up (unscored) —')}
function startScored(){phase='scored';setCue('🎯');$('#instr').textContent='SCORED: connect 🚰 to 🛢️. Tap tray, tap a cell to place; tap a pipe to rotate. Then FLOW.';newLevel(LEVELS.s1);renderTray();log('— SCORED: route water around the rock —')}
async function runDemo(){phase='demo';setCue('👁️');$('#instr').textContent='';newLevel(LEVELS.warm);renderTray();log('ghost-hand demo (wordless, <10s)');gShow(true);await sleep(300);
  const mid=$('.cell[data-r="0"][data-c="1"]');await gTo(mid);placed['0,1']={type:'straight',rot:0};T.cells.add('0,1');render();await sleep(300);
  const fb=$('#flow');await gTo(fb);gShow(false);const {wet}=runFlow();for(const k of wet){const[r,c]=k.split(',').map(Number);$(`.cell[data-r="${r}"][data-c="${c}"]`).classList.add('water');await sleep(150)}
  $('#instr').textContent='';await sleep(700);startWarmup()}
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.cell');if(c)onCell(+c.dataset.r,+c.dataset.c)});
$('#tray').addEventListener('click',e=>{const t=e.target.closest('.tp');if(t){selType=t.dataset.ty;renderTray()}});
$('#flow').addEventListener('click',flow);
$('#replay').addEventListener('click',()=>{if(phase==='done')runDemo()});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
