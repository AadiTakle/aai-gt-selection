<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUANT-NUMANALOGY-01 — Number Analogy Bridge</title>
<style>
:root{--bg:#0f1226;--panel:#1b2140;--panel2:#232a52;--accent:#5eead4;--accent2:#f59e0b;--good:#4ade80;--bad:#f87171;--ink:#eef1ff;--muted:#9aa3c7}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 20% -10%,#26305e,#0f1226 60%);min-height:100vh}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1120px;margin:0 auto;padding:18px}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid #313a6b;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.phasebar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#2b336a;color:var(--muted);border:1px solid #3a447f}
.pill.on{background:var(--accent);color:#053;font-weight:700}
.prompt{font-size:15px;color:var(--muted);min-height:22px;margin:6px 0;text-align:center}
.analogy{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0 6px}
.cell{min-width:66px;min-height:66px;padding:8px 12px;border-radius:14px;background:#2b336a;border:2px solid #3a447f;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cell .n{font-size:34px;font-weight:800}
.cell .dots{font-size:12px;color:var(--muted);max-width:90px;text-align:center;line-height:1.1}
.cell.q{border-color:var(--accent2);background:#3a3050}
.arrow{position:relative;font-size:22px;color:var(--accent);font-weight:800;display:flex;flex-direction:column;align-items:center}
.arrow small{font-size:12px;color:var(--muted)}
.colon{font-size:30px;font-weight:800;color:var(--muted)}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.opt{font-size:26px;font-weight:800;padding:12px 20px;border-radius:12px;background:#2b336a;border:2px solid #3a447f;color:var(--ink);cursor:pointer;min-width:64px}
.opt:hover{border-color:var(--accent)}.opt.correct{border-color:var(--good);box-shadow:0 0 0 3px rgba(74,222,128,.4)}.opt.wrong{border-color:var(--bad);box-shadow:0 0 0 3px rgba(248,113,113,.4)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}
button.act{font:600 15px system-ui;padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--accent);color:#053}
button.act.ghost{background:#2b336a;color:var(--ink);border:1px solid #3a447f}
.fb{min-height:26px;text-align:center;font-weight:700;margin-top:12px}.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.hand{position:absolute;font-size:32px;z-index:20;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:left .7s ease,top .5s ease;opacity:0}
.tele{font-size:13px}.tele h2{font-size:14px;margin:0 0 8px;color:var(--accent)}
.metrics{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-bottom:10px}
.metrics div:nth-child(odd){color:var(--muted)}.metrics b{font-variant-numeric:tabular-nums}
.log{height:230px;overflow:auto;background:#12172f;border:1px solid #2a336a;border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-acc{color:var(--good)}.t-err{color:var(--bad)}.t-evt{color:#9fb0ff}.t-sys{color:var(--muted)}
.legend{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <main class="card" style="position:relative">
    <h1>Number Analogy Bridge</h1>
    <div class="sub">A goes to B the same way C goes to __. Tap "Show how" to see the bridge.</div>
    <div class="phasebar" id="phasebar"></div>
    <div class="prompt" id="prompt"></div>
    <div class="analogy" id="analogy"></div>
    <div class="row"><button class="act ghost" id="showBtn">Show how</button></div>
    <div class="opts" id="opts"></div>
    <div class="row"><button class="act ghost" id="nextBtn" style="display:none">Next</button></div>
    <div class="fb" id="fb"></div>
    <div class="hand" id="hand">&#128070;</div>
  </main>
  <aside class="card tele">
    <h2>Live telemetry</h2>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="legend">Logs M-ACC, M-RULEID (relations integrated), M-RT, M-ERRTYPE (additive-vs-multiplicative lure), M-POLY, M-DIFFREACH.</div>
  </aside>
</div>
<script>
(function(){
  "use strict";
  var el=function(id){return document.getElementById(id)};
  var analogy=el('analogy'),opts=el('opts'),prompt=el('prompt'),fb=el('fb'),showBtn=el('showBtn'),nextBtn=el('nextBtn'),hand=el('hand');
  var T0=Date.now();function now(){return Date.now()-T0;}
  var Tel={scored:0,correct:0,rtSum:0,rtN:0,poly:0,polyMax:0,maxRule:0,err:{},
    push:function(c,m){var d=document.createElement('div');d.className=c;d.textContent='['+(now()/1000).toFixed(2)+'s] '+m;var L=el('log');L.appendChild(d);L.scrollTop=L.scrollHeight;},
    render:function(){var acc=Tel.scored?Math.round(100*Tel.correct/Tel.scored)+'% ('+Tel.correct+'/'+Tel.scored+')':'\u2014';
      var rt=Tel.rtN?Math.round(Tel.rtSum/Tel.rtN)+' ms':'\u2014';
      var errs=Object.keys(Tel.err).map(function(k){return k+':'+Tel.err[k];}).join(' ')||'\u2014';
      el('metrics').innerHTML='<div>M-ACC accuracy</div><b>'+acc+'</b><div>M-RULEID max rules</div><b>'+(Tel.maxRule||'\u2014')+'</b>'+
        '<div>M-RT mean</div><b>'+rt+'</b><div>M-POLY score</div><b>'+Tel.poly+'/'+Tel.polyMax+'</b><div>M-DIFFREACH</div><b>'+(Tel.maxReach||'\u2014')+'</b>'+
        '<div>M-ERRTYPE</div><b style="font-size:11px">'+errs+'</b>';}};
  Tel.maxReach=0;

  // rule: fn(x)->y ; rules= number of independent relations (1 or 2). options keyed to lures.
  function opt(v,tag){return {v:v,tag:tag};}
  var items=[
    {phase:'demo',   a:2,b:4,   c:3, ans:6,  rule:'x2',  rules:1, diff:1,
      options:[opt(6,'correct'),opt(5,'additive'),opt(9,'wrong'),opt(4,'copy')]},
    {phase:'warmup', a:5,b:10,  c:4, ans:8,  rule:'x2',  rules:1, diff:1,
      options:[opt(8,'correct'),opt(6,'additive'),opt(9,'off1'),opt(12,'wrong')]},
    {phase:'scored', a:3,b:6,   c:7, ans:14, rule:'x2',  rules:1, diff:2,
      options:[opt(14,'correct'),opt(10,'additive'),opt(13,'off1'),opt(21,'wrong')]},
    {phase:'scored', a:2,b:5,   c:6, ans:9,  rule:'+3',  rules:1, diff:2,
      options:[opt(9,'correct'),opt(12,'multiplicative'),opt(8,'off1'),opt(18,'wrong')]},
    {phase:'scored', a:2,b:5,   c:4, ans:9,  rule:'x2+1',rules:2, diff:3,
      options:[opt(9,'correct'),opt(8,'partial'),opt(6,'additive'),opt(7,'off1')]}
  ];
  var phaseName={demo:'Ghost demo',warmup:'Warm-up (not scored)',scored:'Scored item'};
  var idx=-1,cur=null,itemStart=0,answered=false,firstAction=0;

  function renderPhasebar(){var order=['demo','warmup','scored'],lab={demo:'1 Watch',warmup:'2 Try',scored:'3 Solve'};
    el('phasebar').innerHTML=order.map(function(p){var on=cur&&cur.phase===p?' on':'';return '<span class="pill'+on+'">'+lab[p]+'</span>';}).join('')+(cur?'<span class="pill">'+phaseName[cur.phase]+'</span>':'');}

  function cell(n,q){var d=document.createElement('div');d.className='cell'+(q?' q':'');var s=document.createElement('div');s.className='n';s.textContent=q?'?':n;d.appendChild(s);
    var dots=document.createElement('div');dots.className='dots';dots.textContent=q?'':'\u25cf'.repeat(Math.min(n,12));d.appendChild(dots);return d;}
  function arrow(lbl){var d=document.createElement('div');d.className='arrow';d.innerHTML='\u2192<small class="rl" style="visibility:hidden">'+lbl+'</small>';return d;}

  function loadItem(){idx++;if(idx>=items.length){finish();return;}cur=items[idx];answered=false;firstAction=0;
    fb.textContent='';fb.className='fb';nextBtn.style.display='none';opts.innerHTML='';renderPhasebar();
    prompt.textContent='A \u2192 B, so C \u2192 ?';
    analogy.innerHTML='';analogy.appendChild(cell(cur.a));var ar1=arrow(cur.rule);analogy.appendChild(ar1);analogy.appendChild(cell(cur.b));
    var col=document.createElement('div');col.className='colon';col.textContent='::';analogy.appendChild(col);
    analogy.appendChild(cell(cur.c));var ar2=arrow(cur.rule);analogy.appendChild(ar2);analogy.appendChild(cell(null,true));
    showBtn.style.display='inline-block';showBtn.disabled=false;
    cur.options.forEach(function(o){var b=document.createElement('button');b.className='opt';b.textContent=o.v;b.dataset.tag=o.tag;
      b.onclick=function(){if(cur.phase==='demo'||answered)return;if(!firstAction){firstAction=now();Tel.push('t-evt','first action (tap option)');}choose(b,o);};opts.appendChild(b);});
    itemStart=now();Tel.push('t-sys','LOAD '+cur.phase+' item ('+cur.a+':'+cur.b+' :: '+cur.c+':? rule '+cur.rule+', rules='+cur.rules+')');
    if(cur.phase==='demo')ghost();Tel.render();}

  showBtn.onclick=function(){revealBridge();Tel.push('t-evt','used Show-how bridge');};
  function revealBridge(){[].slice.call(analogy.querySelectorAll('.rl')).forEach(function(s){s.style.visibility='visible';s.textContent=cur.rule;});}

  function choose(b,o){answered=true;var rt=now()-itemStart,ok=(o.v===cur.ans);
    b.classList.add(ok?'correct':'wrong');
    if(cur.phase==='scored'){Tel.scored++;Tel.polyMax+=2;if(ok){Tel.correct++;Tel.poly+=2;if(cur.rules>Tel.maxRule)Tel.maxRule=cur.rules;if(cur.diff>Tel.maxReach)Tel.maxReach=cur.diff;}
      else{Tel.poly+=(o.tag==='partial'||o.tag==='off1')?1:0;Tel.err[o.tag]=(Tel.err[o.tag]||0)+1;}
      Tel.rtSum+=rt;Tel.rtN++;
      Tel.push(ok?'t-acc':'t-err','SCORED '+cur.a+':'+cur.b+'::'+cur.c+':'+cur.ans+' chose '+o.v+'  RT='+rt+'ms  lure='+(ok?'\u2014':o.tag)+'  rules='+cur.rules);}
    else Tel.push('t-sys',cur.phase.toUpperCase()+': chose '+o.v+' ('+(ok?'right':o.tag)+') \u2014 not scored');
    if(!ok){[].slice.call(opts.children).forEach(function(x){if(+x.textContent===cur.ans)x.classList.add('correct');});}
    fb.textContent=ok?(cur.phase==='warmup'?'Yes! Now the real ones.':'Correct \u2014 same relation!'):'The rule was '+cur.rule+' \u2192 '+cur.ans+'.';
    fb.className='fb '+(ok?'good':'bad');[].slice.call(opts.children).forEach(function(x){x.style.pointerEvents='none';});
    revealBridge();nextBtn.style.display='inline-block';Tel.render();}

  nextBtn.onclick=function(){loadItem();};

  function ghost(){showBtn.disabled=true;var target;[].slice.call(opts.children).forEach(function(x){if(+x.textContent===cur.ans)target=x;});hand.style.opacity='0';
    setTimeout(function(){var r=showBtn.getBoundingClientRect(),wr=showBtn.offsetParent.getBoundingClientRect();hand.style.left=(showBtn.offsetLeft+30)+'px';hand.style.top=(showBtn.offsetTop-4)+'px';hand.style.opacity='1';Tel.push('t-sys','ghost: tap Show-how');},400);
    setTimeout(function(){revealBridge();beep();Tel.push('t-sys','ghost: bridge shows '+cur.rule);},1200);
    setTimeout(function(){if(target){hand.style.left=(target.offsetLeft+30)+'px';hand.style.top=(target.offsetTop-2)+'px';}Tel.push('t-sys','ghost: apply same rule to C');},2000);
    setTimeout(function(){if(target){target.classList.add('correct');beep();}Tel.push('t-sys','ghost: pick '+cur.ans);},2800);
    setTimeout(function(){hand.style.opacity='0';loadItem();},3700);}

  function beep(){try{var a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(700,a.currentTime);o.frequency.exponentialRampToValueAtTime(1040,a.currentTime+.14);g.gain.setValueAtTime(.1,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.28);o.start();o.stop(a.currentTime+.3);}catch(e){}}

  function finish(){prompt.textContent='';analogy.innerHTML='';opts.innerHTML='';showBtn.style.display='none';
    fb.innerHTML='<div style="font-size:44px">\ud83c\udf89</div><div style="color:var(--muted)">Sample complete. Telemetry captured on the right.</div>';fb.className='fb';
    Tel.push('t-sys','SESSION complete: '+Tel.correct+'/'+Tel.scored+' scored correct');}
  window.addEventListener('blur',function(){Tel.push('t-sys','engagement: focus lost');});
  Tel.render();loadItem();
})();
</script>
</body>
</html>
