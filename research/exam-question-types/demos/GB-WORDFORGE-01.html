<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-WORDFORGE-01 · Word Forge</title>
<style>
  :root{--bg1:#fff3e6;--bg2:#ffe9f2;--ink:#3a2a1a;--card:#fff;--accent:#ff8a3d;--good:#22b573;--bad:#ff6b6b;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#a08060;text-transform:uppercase;font-weight:700}
  #howto{max-width:600px;width:100%;background:#fff;border:1px solid #ffd9a8;border-left:5px solid var(--accent);border-radius:12px;padding:12px 16px;box-shadow:0 8px 24px -18px #7a5a3a}
  #howto h1{margin:0 0 4px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
  #howto p{margin:0;font-size:14px;color:#5a4a3a;line-height:1.5}
  #phasecue{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:#ffe9d0;color:#d9701f;border:2px solid #ffcfa6;min-height:30px}
  #phasecue[data-phase="warmup"]{background:#fff7e6;color:#a9791b;border-color:#ffe1a6}
  #phasecue[data-phase="scored"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  #phasecue[data-phase="done"]{background:#ffedd8;color:#9a531f;border-color:#ffcfa6}
  #status{min-height:22px;font-size:14px;font-weight:700;text-align:center}
  #status.ok{color:var(--good)} #status.no{color:var(--bad)} #status.neutral{color:#a08060}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #7a5a3a;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:640px;width:100%}
  #timerbar{width:100%;height:10px;background:#ffe0c2;border-radius:6px;overflow:hidden}
  #timerfill{height:100%;background:linear-gradient(90deg,#ffb15e,#ff8a3d);width:100%;transition:width .2s linear}
  #rack{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .tile{width:46px;height:46px;background:#ffd9a8;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #e0a860;user-select:none}
  .tile.used{opacity:.35;cursor:default;box-shadow:none;transform:translateY(3px)}
  #slot{display:flex;gap:6px;min-height:52px;align-items:center;justify-content:center;background:#fff6ec;border:3px dashed #ffcf9a;border-radius:14px;padding:6px 14px;min-width:220px}
  .slotletter{width:40px;height:40px;background:#fff;border:2px solid #ffb15e;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
  #shelf{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:36px}
  .gem{padding:6px 12px;border-radius:14px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#22b573,#1a8f5a)}
  .gem.rare{background:linear-gradient(135deg,#b06bff,#7a3dff)}
  .gem.long{background:linear-gradient(135deg,#ff6bb0,#ff3d8a)}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #enter{width:72px;height:72px;background:var(--accent);color:#fff;font-size:26px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #enter.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #clear{width:50px;height:50px;background:#ffe6d0;color:#c06a2a;font-size:20px}
  #replay{width:50px;height:50px;background:#ffe6d0;color:#c06a2a;font-size:22px}
  .shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;transition:transform .5s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:210px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-WORDFORGE-01 · Word Forge</div>
    <header id="howto">
      <h1>How to use — Word Forge</h1>
      <p>Tap letters to build a real word, then press the check (<b>✓</b>) to keep it. Make as many words as you can before time runs out — tap <b>⌫</b> to clear.</p>
    </header>
    <div id="phasecue" data-phase="demo">Watch the example</div>
    <div id="stagecard">
      <div id="timerbar"><div id="timerfill"></div></div>
      <div id="rack"></div>
      <div id="slot"></div>
      <div id="shelf"></div>
      <div id="controls">
        <button id="replay" title="replay demo">↻</button>
        <button id="clear" title="clear">⌫</button>
        <button id="enter" title="enter">✓</button>
      </div>
      <div id="status" class="neutral">Watch the example, then try it yourself.</div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost"><svg viewBox="0 0 24 24" width="32" height="32" fill="#ffffff" stroke="#ff8a3d" stroke-width="1.6" stroke-linejoin="round"><path d="M5 2.5 L5 18 L9 14 L12 21 L14.7 19.9 L11.7 13.2 L17.5 13 Z"/></svg><span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,last=a=>a[a.length-1];

/* ---------- lexicon (small embedded word bank, frequency-tagged) ---------- */
const LEXICON=[
 ['CAT',1],['DOG',1],['SUN',1],['RUN',1],['HAT',1],['BAT',1],['RAT',1],['TAN',1],['ANT',1],['NAP',1],
 ['CATS',2],['STAR',2],['ARTS',2],['RATS',2],['TARS',2],['CARS',2],['SCAR',2],['ARCS',2],
 ['STARE',3],['RATES',3],['TEARS',3],['STEAR',0],['TASER',3],['CRATE',3],['TRACE',3],['REACT',3],
 ['CARTS',3],['TRACT',4],['ACTOR',3],['CANTO',4],
];
const VALID=new Set(LEXICON.map(w=>w[0]));
function freqBand(w){const e=LEXICON.find(x=>x[0]===w);return e?e[1]:1;}
const RACKS={
 1:'CATSRN', // easy: cat/rat/tan/ant/nap-ish letters (short high-freq)
 2:'CARSTNE', // medium: adds vocab for star/arts/tears
 3:'CARSTEIO', // adds actor/canto potential
};
function rackFor(level){const key=Math.min(3,Math.max(1,level));return RACKS[key];}
function timeBudget(level){return Math.max(28,50-level*5);}

/* ---------- state ---------- */
let level=1,maxLevel=1,phase='demo',locked=true;
let tiles=[],slot=[],usedIdx=new Set(),found=new Set();
let T={words:[],rt0:0,firstWordT:null,lens:new Set(),roots:new Set(),errs:0,timerId:null,timeLeft:0,itemStart:0,scoredRounds:0,levels:[]};
function idealFlu(){return T.words.length;}
function vocabLvl(){if(!T.words.length)return '\u2014';const best=Math.max(...T.words.map(w=>freqBand(w.w)));return ['common','uncommon','rare','very rare'][best]||'common';}
function rtFirstStr(){return T.firstWordT!=null?`${T.firstWordT} ms`:'\u2014';}
function flexStr(){return `${T.lens.size} lengths / ${T.roots.size} stems`;}
function persistStr(){return `${T.errs} invalid tries logged`;}
function accStr(){return T.words.length+T.errs?`${T.words.length}/${T.words.length+T.errs}`:'\u2014';}
function learnRate(){return T.scoredRounds?`+${(maxLevel-1)} levels / ${T.scoredRounds} rounds`:'\u2014';}
const METERS=[
 {id:'M-ACC',name:'Valid-word rate (valid / all tries)',get:accStr},
 {id:'M-RT',name:'Response time (round total)',get:()=>T.itemStart?`${Date.now()-T.itemStart} ms`:'\u2014'},
 {id:'M-IDEAFLU',name:'Ideational fluency (distinct valid words)',get:idealFlu},
 {id:'M-VOCABLVL',name:'Vocabulary level (rarest word band)',get:vocabLvl},
 {id:'M-RTFIRST',name:'Time to first valid word',get:rtFirstStr},
 {id:'M-FLEX',name:'Flexibility (length/stem variety)',get:flexStr},
 {id:'M-PERSIST',name:'Persistence (invalid attempts)',get:persistStr},
 {id:'M-DIFFREACH',name:'Difficulty reached (rack level)',get:()=>`level ${maxLevel}`},
 {id:'M-LEARNRATE',name:'Learning rate across rounds',get:learnRate},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(480);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(400);}

/* ---------- render ---------- */
function paintRack(){$('#rack').innerHTML='';tiles.forEach((ch,i)=>{const d=document.createElement('div');d.className='tile'+(usedIdx.has(i)?' used':'');d.textContent=ch;d.dataset.i=i;
  if(!usedIdx.has(i))d.addEventListener('click',()=>tapTile(i));$('#rack').appendChild(d);});}
function tileEl(i){return $('#rack').children[i];}
function paintSlot(){$('#slot').innerHTML=slot.map(ch=>`<div class="slotletter">${ch}</div>`).join('');}
function paintShelf(){$('#shelf').innerHTML=[...found].map(w=>{const cls=w.length>=5?'gem long':freqBand(w)>=3?'gem rare':'gem';return `<span class="${cls}">${w}</span>`;}).join('');}
function tapTile(i){if(locked||phase==='demo'||phase==='done')return;
  usedIdx.add(i);slot.push(tiles[i]);paintRack();paintSlot();$('#enter').classList.toggle('ready',slot.length>=2);}
function clearSlot(){usedIdx.clear();slot=[];paintRack();paintSlot();$('#enter').classList.remove('ready');}
function submitWord(){const w=slot.join('');
  if(w.length>=2 && VALID.has(w) && !found.has(w)){
    found.add(w);T.words.push({w});T.lens.add(w.length);T.roots.add(w.slice(0,2));
    if(T.firstWordT==null)T.firstWordT=Date.now()-T.itemStart;
    setStatus('ok','\u2713 "'+w+'" — nice!');
    log(`+ "${w}" valid \u2192 gem (${freqBand(w)>=3?'rare':'common'})`);
    paintShelf();clearSlot();renderMeters();
  } else {
    T.errs++;setStatus('no','\u2717 "'+(w||'(empty)')+'" is not a word - try again');log(`\u2717 "${w||'(empty)'}" invalid`);
    $('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),400);
    clearSlot();renderMeters();
  }
}
function startTimer(seconds,onDone){T.timeLeft=seconds;const total=seconds;
  $('#timerfill').style.width='100%';
  clearInterval(T.timerId);
  T.timerId=setInterval(()=>{T.timeLeft-=0.2;const pct=Math.max(0,100*T.timeLeft/total);$('#timerfill').style.width=pct+'%';
    if(T.timeLeft<=0){clearInterval(T.timerId);onDone();}},200);
}

/* ---------- flow ---------- */
const PHASE={demo:'Watch the example',warmup:'Warm-up · not scored',scored:'Scored',done:'Done'};
function setCue(k,extra){const el=$('#phasecue');el.dataset.phase=k;el.textContent=extra?PHASE[k]+' '+extra:PHASE[k];}
function setStatus(kind,msg){const el=$('#status');if(!el)return;el.className=kind;el.textContent=msg;}
function newRound(level_,scored){
  tiles=rackFor(level_).split('');usedIdx.clear();slot=[];found=new Set();
  T.firstWordT=null;T.itemStart=Date.now();
  paintRack();paintSlot();paintShelf();$('#enter').classList.remove('ready');
  const secs=timeBudget(level_);
  if(scored) startTimer(secs, ()=>endScoredRound());
  renderMeters();
}
function endScoredRound(){locked=true;
  const gained=found.size;
  T.scoredRounds++;
  if(gained>=2){level=Math.min(3,level+1);} else if(gained===0){level=Math.max(1,level-1);}
  maxLevel=Math.max(maxLevel,level);
  log(`— ROUND END: ${gained} words forged \u2192 next level ${level} —`);
  renderMeters();
  setTimeout(nextPhase,1400);
}
function nextPhase(){locked=false;
  if(phase==='warmup'){startScored();}
  else if(phase==='scored'){T.roundIdx=(T.roundIdx||0)+1;T.roundIdx<5?startScored():finish();}
}
function startWarmup(){phase='warmup';locked=false;setCue('warmup');setStatus('neutral','Practice - build any real word, then press \u2713.');newRound(1,false);log('— warm-up (unscored): forge any real word, then tap ✓ —');
  // unscored warmup ends after first valid word or 15s
  const chk=setInterval(()=>{if(found.size>0){clearInterval(chk);locked=true;log('warm-up word forged — UNSCORED');setTimeout(nextPhase,900);}},300);
  setTimeout(()=>{clearInterval(chk);if(phase==='warmup'){locked=true;log('warm-up time up — UNSCORED');nextPhase();}},15000);
}
function startScored(){phase='scored';locked=false;setCue('scored',((T.roundIdx||0)+1)+'/5');setStatus('neutral','Build as many real words as you can before time runs out.');newRound(level,true);log(`— SCORED round: rack level ${level}, ${timeBudget(level)}s —`);}
function finish(){phase='done';setCue('done');setStatus('ok','\u2713 Done');locked=true;clearInterval(T.timerId);log(`— DONE · ${idealFlu()} words forged · max level ${maxLevel} —`);}
async function runDemo(){phase='demo';setCue('demo');setStatus('neutral','Watch the example, then try it yourself.');locked=true;
  tiles='CATS'.split('');usedIdx.clear();slot=[];found=new Set();T.itemStart=Date.now();
  paintRack();paintSlot();paintShelf();log('ghost-hand demo (wordless, <10s)');ghostShow(true);await sleep(300);
  for(const ch of ['C','A','T']){const i=tiles.findIndex((c,idx)=>c===ch&&!usedIdx.has(idx));await ghostTo(tileEl(i));await ghostTap();tapTile(i);}
  await sleep(150);await ghostTo($('#enter'));await ghostTap();submitWord();await sleep(500);
  const i=tiles.findIndex((c,idx)=>c==='S'&&!usedIdx.has(idx));await ghostTo(tileEl(i));await ghostTap();tapTile(i);
  await sleep(150);await ghostTo($('#enter'));await ghostTap();submitWord();await sleep(400);
  ghostShow(false);await sleep(400);startWarmup();}
$('#enter').addEventListener('click',()=>{if($('#enter').classList.contains('ready'))submitWord();});
$('#clear').addEventListener('click',()=>{if(!locked&&phase!=='demo'&&phase!=='done')clearSlot();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo'){clearInterval(T.timerId);runDemo();}});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
