<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-WORDFORGE-01 · Word Forge</title>
<style>
  :root{--bg1:#f0ecff;--bg2:#e9f5ff;--ink:#26304a;--card:#fff;--accent:#7c3aed;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:14px;width:440px;max-width:100%}
  #timer{font-size:13px;color:#a05;font-weight:700}
  #slot{min-height:56px;display:flex;gap:6px;align-items:center;justify-content:center}
  #slot .s{width:44px;height:52px;border-radius:10px;background:#efeaff;border:2px solid #d9cffb;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;text-transform:uppercase}
  #rack{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .tile{width:52px;height:60px;border-radius:12px;background:#fff;border:3px solid #e2d9fb;font-size:30px;font-weight:800;
    text-transform:uppercase;cursor:pointer;box-shadow:0 4px 0 #ddd2f5;transition:.08s;-webkit-tap-highlight-color:transparent}
  .tile:active{transform:translateY(2px)}
  #row{display:flex;gap:10px;align-items:center}
  .act{padding:10px 16px;border-radius:12px;font-weight:700;cursor:pointer;border:0;font-size:15px}
  #enter{background:var(--accent);color:#fff}#back{background:#eee}
  #shelf{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;justify-content:center}
  .gem{padding:4px 10px;border-radius:20px;font-size:14px;font-weight:700;color:#fff}
  #controls{display:flex;gap:14px;align-items:center}
  #replay{width:44px;height:44px;background:#eef1ff;color:#5b6cff;font-size:20px;border:0;cursor:pointer;border-radius:50%}
  .shake{animation:shake .35s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #ghost{position:fixed;left:0;top:0;font-size:36px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .45s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:180px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-WORDFORGE-01 · Word Forge</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="timer"></div>
      <div id="slot"></div>
      <div id="rack"></div>
      <div id="row"><button class="act" id="back">⌫</button><button class="act" id="enter">ENTER ✓</button></div>
      <div id="shelf"></div>
      <div id="controls"><button id="replay" title="replay demo">↻</button></div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
// small validated lexicon (words formable from demo/warm/scored racks). rarity: 1 common,2 mid,3 rare
const LEX={cat:1,cats:1,act:1,acts:2,cot:2,cots:3,oat:2,oats:2,sac:3,taco:2,coat:2,coats:2,oca:3,taos:3,
 rat:1,rats:1,rate:1,rates:2,tar:2,tars:3,tsar:3,star:1,stare:2,spare:2,pear:2,pears:2,reap:2,reaps:3,
 ear:1,ears:1,sea:1,seat:2,east:2,tea:1,teas:2,ate:1,eat:1,eats:2,tap:1,taps:2,pat:1,pats:2,par:2,pars:3,
 part:2,parts:2,past:2,paste:2,spat:3,taper:3,tapers:3,prates:3,pastel:3,plates:3,petal:3,pales:3,tapes:2,apes:2,ape:2,
 art:1,arts:2,rap:2,raps:3,asp:3,spa:2,pea:1,peas:2,sap:2,tsars:3,strap:3,traps:3,parts_:0};
const RARCOL={1:'#8a93b5',2:'#3d7bff',3:'#e14b8a'};
function canForm(word,rack){const r={};rack.forEach(c=>r[c.toLowerCase()]=(r[c.toLowerCase()]||0)+1);
  for(const ch of word){if(!r[ch])return false;r[ch]--}return true}

const T={attempts:0,valid:0,words:new Set(),rts:[],firstValid:null,itemStart:0,lens:new Set(),maxLen:0,maxRar:0};
const METERS=[
 {id:'M-ACC',name:'Valid / attempts',get:()=>T.attempts?`${T.valid}/${T.attempts}`:'—'},
 {id:'M-RT',name:'Time per submit (mean)',get:()=>mean(T.rts)==null?'—':mean(T.rts)+' ms'},
 {id:'M-IDEAFLU',name:'Distinct valid words (fluency)',get:()=>T.words.size+''},
 {id:'M-VOCABLVL',name:'Rarest band · longest',get:()=>T.maxRar?`band ${T.maxRar} · ${T.maxLen} letters`:'—'},
 {id:'M-RTFIRST',name:'Time to first valid word',get:()=>T.firstValid==null?'—':T.firstValid+' ms'},
 {id:'M-FLEX',name:'Distinct word lengths',get:()=>T.lens.size+''},
 {id:'M-PERSIST',name:'Time-on-task (ms)',get:()=>T.itemStart?(Date.now()-T.itemStart):'—'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const d=document.createElement('div');d.innerHTML=`<span class="t">•</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(420)}

let phase='demo',rack=[],slot=[],lastSubmit=0,timeLeft=0,timerId=null;
const setCue=i=>$('#phasecue').textContent=i;
function renderRack(){$('#rack').innerHTML=rack.map((c,i)=>`<button class="tile" data-i="${i}">${c}</button>`).join('')}
function renderSlot(){$('#slot').innerHTML=slot.length?slot.map(c=>`<div class="s">${c}</div>`).join(''):'<div class="s" style="opacity:.4"></div>'}
function newRack(letters){rack=letters.slice();slot=[];renderRack();renderSlot();$('#shelf').innerHTML='';
  Object.assign(T,{attempts:0,valid:0,words:new Set(),rts:[],firstValid:null,itemStart:Date.now(),lens:new Set(),maxLen:0,maxRar:0});lastSubmit=Date.now();renderMeters()}
function tapLetter(i){if(phase==='demo'||phase==='done')return;const c=rack[i].toLowerCase();
  // enforce multiplicity: count uses in slot
  const used=slot.filter(x=>x===c).length;const avail=rack.filter(x=>x.toLowerCase()===c).length;
  if(used>=avail)return;slot.push(c);renderSlot();say(c)}
function back(){slot.pop();renderSlot()}
function enter(){if(phase==='demo'||phase==='done'||!slot.length)return;const w=slot.join('');T.attempts++;
  const rt=Date.now()-lastSubmit;lastSubmit=Date.now();
  const ok=(w in LEX)&&LEX[w]>0&&canForm(w,rack);
  if(ok&&!T.words.has(w)){T.valid++;T.rts.push(rt);T.words.add(w);T.lens.add(w.length);T.maxLen=Math.max(T.maxLen,w.length);T.maxRar=Math.max(T.maxRar,LEX[w]);
    if(T.firstValid==null)T.firstValid=Date.now()-T.itemStart;
    const g=document.createElement('span');g.className='gem';g.style.background=RARCOL[LEX[w]];g.textContent=w+' +'+(w.length*LEX[w]);$('#shelf').appendChild(g);
    log(`✓ "${w}" (len ${w.length}, band ${LEX[w]}) rt ${rt}ms`)}
  else if(ok&&T.words.has(w)){log(`"${w}" already found`)}
  else{$('#slot').classList.add('shake');setTimeout(()=>$('#slot').classList.remove('shake'),350);log(`✗ "${w}" not a word`)}
  slot=[];renderSlot();renderMeters()}
function startTimer(sec){timeLeft=sec;$('#timer').textContent='⏳ '+timeLeft+'s';clearInterval(timerId);
  timerId=setInterval(()=>{timeLeft--;$('#timer').textContent='⏳ '+timeLeft+'s';if(timeLeft<=0){clearInterval(timerId);if(phase==='scored')finish()}},1000)}
function startWarmup(){phase='warmup';setCue('⭐');newRack(['C','A','T','S','O']);$('#timer').textContent='warm-up — try a word!';log('— warm-up (unscored): make any word, tap ENTER —')}
function startScored(){phase='scored';setCue('🎯');newRack(['S','T','A','R','E','P']);log('— SCORED: make as many words as you can! —');startTimer(35)}
function finish(){phase='done';clearInterval(timerId);setCue('🏆');$('#timer').textContent='time!';log(`— DONE · ${T.words.size} words · rarest band ${T.maxRar} · longest ${T.maxLen} —`);renderMeters()}
async function runDemo(){phase='demo';setCue('👁️');newRack(['S','T','A','R','E','P']);$('#timer').textContent='';log('ghost-hand demo (wordless, <10s)');gShow(true);await sleep(300);
  const spell=async wrd=>{slot=[];for(const ch of wrd){const i=rack.findIndex((c,k)=>c.toLowerCase()===ch&&slot.filter(x=>x===ch).length<rack.filter(x=>x.toLowerCase()===ch).length);await gTo($(`.tile[data-i="${i}"]`));slot.push(ch);renderSlot()}await gTo($('#enter'));};
  await spell('star');const g=document.createElement('span');g.className='gem';g.style.background=RARCOL[1];g.textContent='star';$('#shelf').appendChild(g);slot=[];renderSlot();await sleep(300);
  await spell('rate');const g2=document.createElement('span');g2.className='gem';g2.style.background=RARCOL[1];g2.textContent='rate';$('#shelf').appendChild(g2);slot=[];renderSlot();await sleep(400);
  gShow(false);await sleep(400);startWarmup()}
$('#rack').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)tapLetter(+t.dataset.i)});
$('#back').addEventListener('click',back);$('#enter').addEventListener('click',enter);
$('#replay').addEventListener('click',()=>{if(phase==='done'||phase==='warmup')runDemo()});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
