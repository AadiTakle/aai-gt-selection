<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPA-SHADOW-01 · Shadow Play</title>
<style>
  :root{--bg1:#fff8ea;--bg2:#eef1ff;--ink:#2a2a3a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;--tel-bg:#161421;--tel-ink:#d8d2ff;--tel-key:#9ffcd0;--tel-dim:#8a83a8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#9a90b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:640px;width:100%}
  #scene{display:flex;align-items:center;gap:16px;background:linear-gradient(180deg,#fffdf6,#f3f0ff);border-radius:16px;padding:16px 22px}
  #light{font-size:34px;text-align:center}
  #light .arw{font-size:22px;color:#e0a300}
  #object{cursor:pointer;user-select:none}
  #spinhint{font-size:11px;color:#a99;text-align:center}
  #cands{display:flex;gap:14px}
  .cand{padding:8px;border-radius:14px;border:3px solid #e8e5f5;background:#fff;cursor:pointer;transition:.12s}
  .cand.sel{border-color:var(--accent);box-shadow:0 0 0 3px #e0e3ff}
  .cand.good{border-color:var(--good);background:#eafaf1}.cand.bad{border-color:var(--bad);background:#fdeeee}
  #conf{display:none;gap:12px;align-items:center}#conf.on{display:flex}
  .cbtn{border-radius:12px;padding:8px 14px;border:2px solid #e2dff0;background:#fff;cursor:pointer;font:inherit}
  #tools{display:flex;gap:12px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:14px}
  #confirm{padding:11px 22px;background:var(--accent);color:#fff;font-weight:700;opacity:.4;pointer-events:none}
  #confirm.ready{opacity:1;pointer-events:auto}
  #replay{width:46px;height:46px;border-radius:50%;background:#f0ecff;color:#5b6cff;font-size:20px}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;transition:transform .6s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#221f31;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #2e2a3d;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#a99fc4;font-size:11px;letter-spacing:.08em}
  #log{height:180px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #29253a}#log .t{color:#6f6790}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:270px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">SPA-SHADOW-01 · Shadow Play</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="scene">
        <div id="light"></div>
        <div><div id="object"></div><div id="spinhint">tap to spin &amp; inspect</div></div>
      </div>
      <div style="font-size:14px;color:#8a83a8">which shadow does it cast?</div>
      <div id="cands"></div>
      <div id="conf"><span style="font-size:13px;color:#8a83a8">how sure?</span><button class="cbtn" data-c="1">🤔 not sure</button><button class="cbtn" data-c="3">😎 sure</button></div>
      <div id="tools">
        <button id="replay" title="replay demo">↻</button>
        <button id="confirm">Lock ✓</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;

/* silhouettes (shadow shapes) */
function silSVG(name,box=64){const g='#3a3f55';const c=box/2;let s='';switch(name){
  case 'circle':s=`<circle cx="${c}" cy="${c}" r="26" fill="${g}"/>`;break;
  case 'ring':s=`<path d="M${c} ${c-26} a26 26 0 1 0 0.1 0 Z M${c} ${c-12} a12 12 0 1 1 -0.1 0 Z" fill="${g}" fill-rule="evenodd"/>`;break;
  case 'triangle':s=`<polygon points="${c},${c-28} ${c-27},${c+26} ${c+27},${c+26}" fill="${g}"/>`;break;
  case 'rectT':s=`<rect x="${c-15}" y="${c-28}" width="30" height="56" rx="3" fill="${g}"/>`;break;
  case 'rectW':s=`<rect x="${c-28}" y="${c-15}" width="56" height="30" rx="3" fill="${g}"/>`;break;
  case 'square':s=`<rect x="${c-22}" y="${c-22}" width="44" height="44" rx="3" fill="${g}"/>`;break;}
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${s}</svg>`;}

/* object illustrations */
function objSVG(name,box=110){const c=box/2;let s='';switch(name){
  case 'sphere':s=`<defs><radialGradient id="sg" cx="40%" cy="35%"><stop offset="0" stop-color="#9fd0ff"/><stop offset="1" stop-color="#3f7fd0"/></radialGradient></defs><circle cx="${c}" cy="${c}" r="38" fill="url(#sg)"/>`;break;
  case 'cone':s=`<ellipse cx="${c}" cy="${c+34}" rx="34" ry="11" fill="#c9761f"/><polygon points="${c},${c-40} ${c-34},${c+34} ${c+34},${c+34}" fill="#f0912f"/><polygon points="${c},${c-40} ${c},${c+34} ${c+34},${c+34}" fill="#d97c22"/>`;break;
  case 'cup':s=`<ellipse cx="${c}" cy="${c-30}" rx="26" ry="9" fill="#2f8f8f"/><ellipse cx="${c}" cy="${c-30}" rx="18" ry="6" fill="#1c5c5c"/><path d="M${c-26} ${c-30} L${c-22} ${c+34} Q${c} ${c+44} ${c+22} ${c+34} L${c+26} ${c-30}" fill="#37a8a8"/>`;break;}
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}"><g id="objg" style="transform-box:fill-box;transform-origin:center">${s}</g></svg>`;}
const LIGHT={top:'☀️<div class="arw">⬇</div>',side:'☀️<div class="arw">➡</div>'};
const COMPLEX={sphere:1,cone:2,cup:3};

/* telemetry */
const T={acc:0,n:0,rts:[],firsts:[],revs:0,explore:0,confs:[],errTypes:[],maxC:0,itemStart:0,firstTap:null};
function errStr(){if(!T.errTypes.length)return 'none';const c={};T.errTypes.forEach(e=>c[e]=(c[e]||0)+1);return Object.entries(c).map(([k,v])=>k+':'+v).join(' ');}
const METERS=[
 {id:'M-ACC',name:'Shadow correct / items',get:()=>T.n?`${T.acc}/${T.n}`:'\u2014'},
 {id:'M-RT',name:'Response time (mean)',get:()=>T.rts.length?mean(T.rts)+' ms':'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency (mean)',get:()=>T.firsts.length?mean(T.firsts)+' ms':'\u2014'},
 {id:'M-REV',name:'Selection changes',get:()=>T.revs+''},
 {id:'M-EXPLORE',name:'Object spins (inspection)',get:()=>T.explore+''},
 {id:'M-CONF',name:'Confidence taps',get:()=>T.confs.length?T.confs.join(','):'\u2014'},
 {id:'M-ERRTYPE',name:'Error (wrong-dir vs collapse)',get:()=>errStr()},
 {id:'M-DIFFREACH',name:'Hardest object solved',get:()=>T.maxC||'\u2014'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');const ghostShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(560);}

/* items */
const ITEMS={
  demo:{obj:'sphere',dir:'side',cands:[{n:'circle',t:'correct'},{n:'square',t:'other'},{n:'triangle',t:'other'}]},
  warm:{obj:'cone',dir:'side',cands:[{n:'triangle',t:'correct'},{n:'circle',t:'wrong-direction'},{n:'square',t:'other'}]},
  s1:{obj:'cone',dir:'top',conf:true,cands:[{n:'circle',t:'correct'},{n:'triangle',t:'wrong-direction'},{n:'square',t:'other'}]},
  s2:{obj:'cup',dir:'top',conf:true,cands:[{n:'ring',t:'correct'},{n:'circle',t:'feature-collapse'},{n:'rectT',t:'wrong-direction'}]}};
let phase='demo',cur=null,cand=[],sel=-1,spin=0,seq=['warm','s1','s2'],si=0;
function setCue(i){$('#phasecue').textContent=i;}
function renderScene(){$('#light').innerHTML=LIGHT[cur.dir];$('#object').innerHTML=objSVG(cur.obj);applySpin();}
function applySpin(){const g=$('#objg');if(g)g.style.transform=`rotate(${spin}deg)`;}
function renderCands(){cand=cur.cands.slice();for(let i=cand.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[cand[i],cand[j]]=[cand[j],cand[i]];}
  $('#cands').innerHTML=cand.map((c,i)=>`<div class="cand" data-i="${i}">${silSVG(c.n)}</div>`).join('');sel=-1;$('#confirm').classList.remove('ready');$('#conf').classList.remove('on');}
function spinObj(){if(phase==='demo'||phase==='done')return;spin=(spin+30)%360;T.explore++;applySpin();renderMeters();}
function selectCand(i){if(phase==='demo'||phase==='done'||phase==='conf')return;if(T.firstTap===null){T.firstTap=Date.now()-T.itemStart;}
  if(sel!==-1&&sel!==i)T.revs++;sel=i;$$('.cand').forEach(el=>el.classList.toggle('sel',+el.dataset.i===i));$('#confirm').classList.add('ready');}
function confirm(){if(sel===-1||phase==='demo'||phase==='done')return;const rt=Date.now()-T.itemStart;const ch=cand[sel];const ok=ch.t==='correct';
  if(cur.scored){T.n++;if(ok){T.acc++;T.maxC=Math.max(T.maxC,COMPLEX[cur.obj]);}else T.errTypes.push(ch.t);T.rts.push(rt);if(T.firstTap!=null)T.firsts.push(T.firstTap);}
  $$('.cand')[sel].classList.add(ok?'good':'bad');if(!ok){const ci=cand.findIndex(c=>c.t==='correct');$$('.cand')[ci].classList.add('good');}
  log(`pick ${ch.n} · ${ok?'✓ correct shadow':'✗ ('+ch.t+')'} · rt ${rt}ms`);renderMeters();$('#confirm').classList.remove('ready');
  if(cur.conf){phase='conf';$('#conf').classList.add('on');}else next();}
function confTap(c){if(phase!=='conf')return;T.confs.push(c);log('confidence: '+(c===3?'sure':'not sure'));renderMeters();$('#conf').classList.remove('on');next();}
function next(){phase='between';setTimeout(()=>{si++;si<seq.length?startItem(seq[si]):finish();},700);}
function startItem(key){cur={...ITEMS[key],scored:key.startsWith('s')};phase='play';spin=0;T.itemStart=Date.now();T.firstTap=null;renderScene();renderCands();renderMeters();setCue(cur.scored?'\ud83c\udfaf':'\u2b50');
  log(`— ${cur.scored?'SCORED':'warm-up'}: light is ${cur.dir==='top'?'above ⬇':'to the side ➡'} — pick the shadow —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');log(`— DONE · shadows ${T.acc}/${T.n} · hardest ${T.maxC} —`);}
async function runDemo(){phase='demo';si=0;cur={...ITEMS.demo};spin=0;T.itemStart=Date.now();renderScene();renderCands();
  log('ghost-hand demo (wordless): the light throws a shadow — match its shape');ghostShow(true);await sleep(400);
  await ghostTo($('#object'));spin=30;applySpin();await sleep(300);spin=0;applySpin();
  const ci=cand.findIndex(c=>c.t==='correct');await ghostTo($$('.cand')[ci]);$$('.cand')[ci].classList.add('sel');await sleep(300);$$('.cand')[ci].classList.add('good');await sleep(700);
  ghostShow(false);log('demo done — your turn (warm-up)');startItem(seq[0]);}
$('#object').addEventListener('click',spinObj);
$('#cands').addEventListener('click',e=>{const c=e.target.closest('.cand');if(c)selectCand(+c.dataset.i);});
$('#confirm').addEventListener('click',()=>{if($('#confirm').classList.contains('ready'))confirm();});
$('#conf').addEventListener('click',e=>{const b=e.target.closest('.cbtn');if(b)confTap(+b.dataset.c);});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
