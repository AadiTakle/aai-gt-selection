<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-echodrum-01 — Echo Drums (span + count + same-drum 1-back)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #drums{display:flex;gap:16px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:20px}
  .drum{width:110px;height:110px;border-radius:16px 16px 20px 20px;display:flex;align-items:center;justify-content:center;font-size:56px;cursor:pointer;border:4px solid #0006;transition:transform .08s,box-shadow .12s,filter .12s;filter:brightness(.82)}
  .drum:active{transform:scale(.96)}
  .drum.glow{filter:brightness(1.35);box-shadow:0 0 26px 6px #ffffff66;transform:translateY(-6px)}
  .drum.pick{outline:4px solid var(--accent);outline-offset:3px}
  .slots{display:flex;gap:10px;min-height:34px;align-items:center}
  .slot{width:30px;height:30px;border-radius:8px;border:2px dashed var(--edge);display:flex;align-items:center;justify-content:center;font-size:20px}
  .slot.full{border-style:solid;border-color:var(--accent)}
  .paw{font:600 17px system-ui;padding:16px 26px;border-radius:14px;border:2px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer;min-width:150px}
  .paw.flash{background:var(--good);color:#05261a;border-color:transparent}
  .pad{width:52px;height:52px;border-radius:12px;border:2px solid var(--edge);background:#20284a;color:var(--ink);font-size:22px;font-weight:700;cursor:pointer}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:7px 11px;background:#182042}
  .seg button.on{background:var(--warn);color:#3a2c00;font-weight:600}
  #cue{font-size:26px;height:32px}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:140px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🥁 Echo Drums <span class="badge" id="bmode">echo · forward</span></h1>
    <p class="sub" id="prompt">Watch the drums glow, then <b>tap them back in the same order</b>.</p>
  </div>
  <div id="drums"></div>
  <div class="slots" id="slots"></div>
  <div id="cue">👀</div>
  <div class="row" id="answerRow"></div>
  <div class="row">
    <div class="seg" id="modeseg">
      <button data-m="echo" class="on">Echo (span)</button>
      <button data-m="count">Count (bongs)</button>
      <button data-m="same">Same (1-back)</button>
    </div>
    <div class="seg" id="orderseg">
      <button data-o="fwd" class="on">▶ forward</button>
      <button data-o="rev">◀ reverse</button>
      <button data-o="sort">▲ by size</button>
    </div>
  </div>
  <div class="row">
    <button class="pri" id="go">▶ Watch how it works</button>
    <button id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// drums: {emoji, color, size} — size = real-life size rank for the SORT mode
const DRUMS=[{e:"🐭",c:"#e05a7a",s:1},{e:"🐰",c:"#5cc8ff",s:2},{e:"🐶",c:"#ffd166",s:3},{e:"🐻",c:"#7bd88f",s:4}];
const drumsEl=$("#drums");
DRUMS.forEach((d,i)=>{const b=document.createElement("div");b.className="drum";b.style.background=d.c;b.textContent=d.e;b.dataset.i=i;drumsEl.appendChild(b);});
const dEls=[...drumsEl.children];

let mode="echo",order="fwd";
const T={phase:"idle",span:2,fwdMax:0,revMax:0,revisions:0,
  cHit:0,cTot:0, hit:0,miss:0,fa:0,cr:0,target:0,hitRT:[],
  orderErr:0,itemErr:0,blockAcc:[],blur:0,log:[]};

function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m;}
function qnorm(p){p=Math.min(1-1e-6,Math.max(1e-6,p));const a=[-39.6968302,220.9460984,-275.928510,138.357751,-30.6647980,2.50662827];
  const b=[-54.4760987,161.585836,-155.698979,66.8013118,-13.2806815];const c=[-.00778489,-.322396458,-2.40075827,-2.54973253,4.37466414,2.93816398];
  const d=[.00778469,.322467129,2.44513413,3.75440866];const pl=.02425;
  if(p<pl){const q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p<=1-pl){const q=p-.5,r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
  const q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
function dprime(){const t=T.target,nt=T.cr+T.fa;if(!t||!nt)return 0;let h=T.hit/t,f=T.fa/nt;
  h=Math.min(1-.5/t,Math.max(.5/t,h));f=Math.min(1-.5/nt,Math.max(.5/nt,f));return qnorm(h)-qnorm(f);}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>50)T.log.pop();}
function render(){
  const manip=(T.fwdMax&&T.revMax)?(T.fwdMax-T.revMax):null;
  const acc=(T.hit+T.miss+T.fa+T.cr)?Math.round(100*(T.hit+T.cr)/(T.hit+T.miss+T.fa+T.cr)):0;
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-echodrum-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>mode</span><b>${mode}${mode==="echo"?" · "+order:""}</b></div>
  <h2>Span (storage + manipulation)</h2>
  <div class="kv"><span>forward span <span class="m">M-SPAN</span></span><b>${T.fwdMax||"—"}</b></div>
  <div class="kv"><span>reverse span <span class="m">M-SPAN</span></span><b>${T.revMax||"—"}</b></div>
  <div class="kv"><span>manipulation cost <span class="m">M-MANIPCOST</span></span><b>${manip==null?"—":manip}</b></div>
  <div class="kv"><span>recall revisions <span class="m">M-REV</span></span><b>${T.revisions}</b></div>
  <div class="kv"><span>order vs item err <span class="m">M-ERRTYPE</span></span><b>${T.orderErr}/${T.itemErr}</b></div>
  <h2>Counting span</h2>
  <div class="kv"><span>counting accuracy <span class="m">M-PROCACC</span></span><b>${T.cTot?Math.round(100*T.cHit/T.cTot)+"%":"—"}</b></div>
  <h2>Same-drum 1-back</h2>
  <div class="kv"><span>hits/targets</span><b>${T.hit}/${T.target}</b></div>
  <div class="kv"><span>sensitivity d′ <span class="m">M-DPRIME</span></span><b>${dprime().toFixed(2)}</b></div>
  <div class="kv"><span>match acc <span class="m">M-ACC</span></span><b>${acc}%</b></div>
  <h2>Consistency & engagement</h2>
  <div class="kv"><span>hit-RT CV <span class="m">M-RTVAR</span></span><b>${cv(T.hitRT).toFixed(2)}</b></div>
  <div class="kv"><span>block acc series <span class="m">M-CONSIST</span></span><b>${T.blockAcc.length?T.blockAcc.map(x=>x+"%").join(","):"—"}</b></div>
  <div class="kv"><span>focus-loss (blur) <span class="m">M-ENGAGE</span></span><b>${T.blur}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
window.addEventListener("blur",()=>{T.blur++;render();});
function setSlots(k){const s=$("#slots");s.innerHTML="";for(let i=0;i<k;i++){const d=document.createElement("div");d.className="slot";s.appendChild(d);}}
async function glow(i,ms=520){dEls[i].classList.add("glow");await sleep(ms);dEls[i].classList.remove("glow");await sleep(160);}

// ---- ECHO span ----
async function echoRound(scored){
  const k=T.span;const seq=[];for(let i=0;i<k;i++)seq.push(Math.random()*DRUMS.length|0);
  $("#cue").textContent="👀";for(const i of seq)await glow(i);
  let target=seq.slice();
  if(order==="rev")target=seq.slice().reverse();
  if(order==="sort")target=seq.slice().sort((a,b)=>DRUMS[a].s-DRUMS[b].s);
  setSlots(k);$("#cue").textContent="👆";
  const picks=[];
  await new Promise(res=>{ dEls.forEach(el=>el.onclick=()=>{const i=+el.dataset.i;
      picks.push(i);el.classList.add("pick");setTimeout(()=>el.classList.remove("pick"),150);
      $("#slots").children[picks.length-1].textContent=DRUMS[i].e;$("#slots").children[picks.length-1].classList.add("full");
      if(picks.length===k){setTimeout(res,150);} }); });
  dEls.forEach(el=>el.onclick=null);
  const ok=picks.every((v,idx)=>v===target[idx]);
  // error typing: right items wrong order vs wrong items
  if(!ok){const sameSet=[...picks].sort().join()===[...target].sort().join();if(sameSet)T.orderErr++;else T.itemErr++;}
  $("#cue").textContent=ok?"✅":"↺";
  if(scored){ if(ok){T.span=Math.min(DRUMS.length,k+1);
      if(order==="fwd")T.fwdMax=Math.max(T.fwdMax,k); else T.revMax=Math.max(T.revMax,k);}
    else T.span=Math.max(2,k-1);
    logE(`echo ${order} k=${k} ${ok?"ok":"miss"} → span ${T.span}`);}
  render();return ok;
}
// ---- COUNT span (counting span) ----
async function countRound(scored){
  const turns=3;const counts=[];
  for(let t=0;t<turns;t++){const drum=Math.random()*DRUMS.length|0;const k=1+(Math.random()*3|0);counts.push(k);
    $("#cue").textContent="👂 count the bongs";
    for(let b=0;b<k;b++)await glow(drum,360);
    await sleep(300);}
  $("#cue").textContent="👆 tap the counts in order";
  const row=$("#answerRow");row.innerHTML="";setSlots(turns);
  const picks=[];
  await new Promise(res=>{ for(let n=1;n<=4;n++){const b=document.createElement("button");b.className="pad";b.textContent=n;
      b.onclick=()=>{picks.push(n);$("#slots").children[picks.length-1].textContent=n;$("#slots").children[picks.length-1].classList.add("full");
        if(picks.length===turns)setTimeout(res,150);};row.appendChild(b);} });
  row.innerHTML="";
  let hits=0;for(let i=0;i<turns;i++){T.cTot++;if(picks[i]===counts[i]){hits++;T.cHit++;}}
  const ok=hits===turns;$("#cue").textContent=ok?"✅":"↺";
  if(scored)logE(`count ${counts.join("-")} vs ${picks.join("-")} (${hits}/${turns})`);
  render();return ok;
}
// ---- SAME 1-back ----
let step=null;
function buildSameBtn(){const row=$("#answerRow");row.innerHTML='<button class="paw" id="paw">SAME! ✋</button>';
  $("#paw").onclick=()=>{if(!step||step.done||step.r!=null)return;step.r=performance.now()-step.onset;
    $("#paw").classList.add("flash");setTimeout(()=>$("#paw").classList.remove("flash"),150);};}
async function sameBlock(scored,len){
  const S=[];for(let i=0;i<len;i++){let e;if(i>=1&&Math.random()<.34)e=S[i-1];else{do{e=Math.random()*DRUMS.length|0;}while(i>=1&&e===S[i-1]);}S.push(e);}
  let good=0,tot=0;
  for(let i=0;i<len;i++){step={onset:0,r:null,done:false};
    await glow(S[i],620);step.onset=performance.now()-620; // response window during+after
    await sleep(900);step.done=true;
    const tgt=i>=1&&S[i]===S[i-1];const resp=step.r!=null;
    if(tgt){if(scored){T.target++;if(resp){T.hit++;T.hitRT.push(Math.max(0,step.r));}else T.miss++;}if(resp)good++;}
    else{if(scored){if(resp)T.fa++;else T.cr++;}if(!resp)good++;}
    if(scored)tot++;render();}
  $("#cue").textContent="";return tot?Math.round(100*good/tot):0;
}

// ---- phase machine ----
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";$("#go").disabled=true;$("#replay").disabled=true;
  setSlots(3);render();
  const seq=[0,2,3];const ghost=document.createElement("div");ghost.textContent="👆";
  ghost.style.cssText="position:fixed;font-size:30px;z-index:9;transition:left .3s,top .3s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  $("#cue").textContent="👀";for(const i of seq)await glow(i);
  $("#cue").textContent="👆";
  for(let n=0;n<seq.length;n++){const el=dEls[seq[n]];const r=el.getBoundingClientRect();
    ghost.style.opacity="1";ghost.style.left=(r.left+r.width/2-10)+"px";ghost.style.top=(r.top+r.height/2-10)+"px";
    await sleep(430);el.classList.add("pick");$("#slots").children[n].textContent=DRUMS[seq[n]].e;$("#slots").children[n].classList.add("full");
    await sleep(200);el.classList.remove("pick");}
  $("#cue").textContent="✅";await sleep(500);ghost.remove();
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice round";$("#go").onclick=warmup;
  $("#phasehint").textContent="Now you try — this practice round is NOT scored.";render();
}
async function warmup(){
  T.phase="warm-up (unscored)";$("#go").disabled=true;$("#replay").disabled=true;render();
  if(mode==="echo")await echoRound(false); else if(mode==="count")await countRound(false); else{buildSameBtn();await sameBlock(false,6);}
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Start scored game";$("#go").onclick=startScored;
  $("#phasehint").textContent="These rounds count. Do well and it gets harder (above grade).";render();
}
async function startScored(){
  T.phase="scored";$("#go").disabled=true;$("#replay").disabled=true;render();
  if(mode==="echo"){for(let r=0;r<5;r++){await echoRound(true);await sleep(500);}}
  else if(mode==="count"){for(let r=0;r<3;r++){await countRound(true);await sleep(500);}}
  else{buildSameBtn();for(let bk=0;bk<3;bk++){const acc=await sameBlock(true,12);T.blockAcc.push(acc);logE(`same block ${bk+1}: acc ${acc}%`);await sleep(500);}}
  T.phase="done";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Play again";$("#go").onclick=startScored;
  $("#phasehint").textContent="Done. Consistency matters more than raw speed; reverse span shows manipulation cost.";
  $("#cue").textContent="🏁";render();
}
function setMode(m){mode=m;[...$("#modeseg").children].forEach(x=>x.classList.toggle("on",x.dataset.m===m));
  $("#orderseg").style.display=m==="echo"?"inline-flex":"none";
  $("#answerRow").innerHTML="";if(m==="same")buildSameBtn();
  $("#slots").innerHTML="";
  $("#bmode").textContent=m==="echo"?"echo · "+order:m;
  $("#prompt").innerHTML=m==="echo"?"Watch the drums glow, then <b>tap them back</b> (forward, reverse, or by size).":
    m==="count"?"Count how many times a drum <b>bongs</b> each turn, then tap the counts back in order.":
    "Tap <b>SAME</b> when a drum is the same as the one just before.";
  logE("mode → "+m);render();}
$("#go").onclick=demo;$("#replay").onclick=demo;
$("#modeseg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.m);});
$("#orderseg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;order=b.dataset.o;
  [...$("#orderseg").children].forEach(x=>x.classList.toggle("on",x===b));$("#bmode").textContent="echo · "+order;logE("order → "+order);render();});
setMode("echo");render();
</script>
</body>
</html>
