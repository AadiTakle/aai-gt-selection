<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-tug-01 — True Tug (numerical Stroop / conflict)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #cue{font-size:16px;color:var(--warn);height:22px}
  #arena{width:460px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .side{flex:1;height:150px;border-radius:16px;background:#101a30;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .side:active{transform:scale(.98)}.side.flash{border-color:var(--good);background:#123a26}.side.wrong{border-color:var(--bad);background:#3a1420}
  .side .num{font-weight:800;color:#cfe3ff}
  .dots{display:flex;flex-wrap:wrap;gap:3px;width:90px;justify-content:center}
  .dot{background:#7fd7ff;border-radius:50%}
  #rope{font-size:30px}
  #verdict{font-size:22px;height:30px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.ctl{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🪢 True Tug <span class="badge" id="blevel">combo 0</span></h1>
    <p class="sub">Pull the rope toward the side that is truly <b>bigger in number</b> — don't be fooled by how big or crowded it looks. Sometimes the rule flips to <b>smaller</b>!</p>
  </div>
  <div id="cue"></div>
  <div id="arena"><div class="side" data-s="L"></div><div id="rope">🟫🟫🔘🟫🟫</div><div class="side" data-s="R"></div></div>
  <div id="verdict"></div>
  <div class="row">
    <button class="pri ctl" id="go">▶ Watch how it works</button>
    <button class="ctl" id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const sides=[...document.querySelectorAll(".side")],cue=$("#cue"),verdict=$("#verdict");
const T={phase:"idle",trial:0,acc:[0,0],rtCong:[],rtIncong:[],rtSwitch:[],rtRepeat:[],err:{size:0,slip:0},
  combo:0,maxCombo:0,lastRule:null,log:[]};
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function med(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m}
function pct(p){return p[1]?Math.round(100*p[0]/p[1]):0}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop()}
function bump(ok){if(ok){T.combo++;T.maxCombo=Math.max(T.maxCombo,T.combo);}else T.combo=0;$("#blevel").textContent="combo "+T.combo;}
function render(){
  const conEff=Math.round(med(T.rtIncong)-med(T.rtCong))||0,swCost=Math.round(med(T.rtSwitch)-med(T.rtRepeat))||0;
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-tug-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>trials</span><b>${T.trial}</b></div>
  <h2>Accuracy <span class="m">M-ACC</span></h2>
  <div class="kv"><span>correct</span><b>${pct(T.acc)}%</b></div>
  <h2>Size-value conflict <span class="m">M-CONGEFF</span></h2>
  <div class="kv"><span>incong − cong RT</span><b>${conEff} ms</b></div>
  <h2>Rule switch <span class="m">M-SWITCHCOST</span></h2>
  <div class="kv"><span>switch − repeat RT</span><b>${swCost} ms</b></div>
  <h2>Error type <span class="m">M-ERRTYPE</span></h2>
  <div class="kv"><span>fooled by size</span><b>${T.err.size}</b></div>
  <div class="kv"><span>true magnitude slip</span><b>${T.err.slip}</b></div>
  <h2>Controlled speed</h2>
  <div class="kv"><span>combo <span class="m">M-COMBO</span></span><b>${T.combo}/${T.maxCombo}</b></div>
  <div class="kv"><span>RT CV <span class="m">M-RTVAR</span></span><b>${cv([...T.rtCong,...T.rtIncong]).toFixed(2)}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();

let cur=null;
sides.forEach(el=>el.addEventListener("pointerdown",()=>{if(!cur||cur.done)return;cur.done=true;cur.rt=performance.now()-cur.onset;cur.resp=el.dataset.s;
  const ok=cur.resp===cur.correct;el.classList.add(ok?"flash":"wrong");setTimeout(()=>el.classList.remove("flash","wrong"),220);cur.ok=ok;cur.resolve();}));

function paint(){
  let L=1+Math.floor(Math.random()*9),R;do{R=1+Math.floor(Math.random()*9);}while(R===L);
  const bigger=L>R?"L":"R",smaller=L>R?"R":"L";
  const conflict=Math.random()<0.6;const useDots=T.phase!=="scored"?false:Math.random()<0.35;
  function fill(el,val,side){el.innerHTML="";
    const physicalBig=conflict?(side===smaller):(side===bigger); // if conflict, physical bigness goes to the smaller value
    if(useDots){const d=document.createElement("div");d.className="dots";const ds=physicalBig?16:8;for(let i=0;i<val;i++){const p=document.createElement("div");p.className="dot";p.style.width=ds+"px";p.style.height=ds+"px";d.appendChild(p);}el.appendChild(d);}
    else{const n=document.createElement("span");n.className="num";n.style.fontSize=(physicalBig?64:30)+"px";n.textContent=val;el.appendChild(n);}}
  fill(sides[0],L,"L");fill(sides[1],R,"R");
  return {bigger,smaller,cong:!conflict};
}
async function trial(scored){
  const rule=Math.random()<0.7?"MORE":"LESS";const isSwitch=T.lastRule!==null&&T.lastRule!==rule;
  cue.textContent=rule==="MORE"?"🔺 pull toward the BIGGER number":"🔻 pull toward the SMALLER number";
  const cfg=paint();cur={correct:rule==="MORE"?cfg.bigger:cfg.smaller,cong:cfg.cong,other:rule==="MORE"?cfg.smaller:cfg.bigger,onset:performance.now(),done:false,rt:null,ok:false};
  await sleep(250);
  await new Promise(res=>{cur.resolve=res;setTimeout(()=>{if(!cur.done){cur.done=true;cur.timeout=true;res();}},2800);});
  if(scored){T.trial++;T.acc[1]++;
    if(cur.timeout){verdict.textContent="🐢";bump(false);logE(`${rule}: too slow`);}
    else if(cur.ok){T.acc[0]++;bump(true);(cur.cong?T.rtCong:T.rtIncong).push(cur.rt);(isSwitch?T.rtSwitch:T.rtRepeat).push(cur.rt);verdict.textContent="✅";}
    else{bump(false);if(!cur.cong&&cur.resp!==cur.correct){T.err.size++;logE("fooled by size");}else{T.err.slip++;logE("magnitude slip");}verdict.textContent="❌";}
    T.lastRule=rule;}
  render();await sleep(400);verdict.textContent="";sides.forEach(s=>s.innerHTML="");
}
async function block(scored,len){for(let i=0;i<len;i++)await trial(scored);}

async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;$("#replay").disabled=true;
  cue.textContent="🔺 pull toward the BIGGER number";
  sides[0].innerHTML='<span class="num" style="font-size:30px">8</span>';sides[1].innerHTML='<span class="num" style="font-size:64px">3</span>';
  const ghost=document.createElement("div");ghost.textContent="👆";ghost.style.cssText="position:fixed;font-size:30px;z-index:9;transition:left .5s,top .5s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  const r=sides[0].getBoundingClientRect();await sleep(500);ghost.style.opacity="1";ghost.style.left=(r.left+r.width/2-12)+"px";ghost.style.top=(r.top+r.height/2)+"px";
  await sleep(800);sides[0].classList.add("flash");verdict.textContent="✅ 8 is bigger than 3!";await sleep(700);sides[0].classList.remove("flash");
  ghost.remove();sides.forEach(s=>s.innerHTML="");T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice round";$("#go").onclick=warmup;
  $("#phasehint").textContent="Bigger number wins — not bigger-looking. Practice (not scored).";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;
async function warmup(){T.phase="warm-up (unscored)";render();$("#go").disabled=true;$("#replay").disabled=true;await block(false,4);
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;$("#go").textContent="▶ Start scored game";$("#go").onclick=startScored;
  $("#phasehint").textContent="These count. Don't let a big-looking small number trick you.";render();}
async function startScored(){T.phase="scored";render();$("#go").disabled=true;$("#replay").disabled=true;await block(true,16);
  T.phase="done";$("#go").disabled=false;$("#replay").disabled=false;$("#go").textContent="▶ Play again";$("#go").onclick=startScored;
  $("#phasehint").textContent=`Done. Conflict cost ${Math.round(med(T.rtIncong)-med(T.rtCong))||0}ms; fooled-by-size errors ${T.err.size}.`;verdict.textContent="🏁";render();}
</script>
</body>
</html>
