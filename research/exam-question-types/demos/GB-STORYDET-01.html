<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-STORYDET-01 · Story Detective</title>
<style>
  :root{--bg1:#fff0f6;--bg2:#eef4ff;--ink:#26304a;--card:#fff;--accent:#e14b8a;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:14px;width:460px;max-width:100%}
  #scene{font-size:70px;min-height:80px}
  #caption{font-size:15px;color:#555;text-align:center;min-height:44px;background:#faf7fb;border-radius:12px;padding:8px 12px;width:100%}
  #prompt{font-size:16px;font-weight:700;min-height:24px;text-align:center;display:flex;align-items:center;gap:8px;justify-content:center}
  #opts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .opt{width:110px;min-height:96px;border-radius:16px;border:3px solid #efd9e6;background:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;font-size:38px;transition:.1s}
  .opt small{font-size:12px;color:#778;font-weight:700}
  .opt:hover{border-color:var(--accent);transform:translateY(-3px)}
  .opt.ok{border-color:var(--good);background:#e7fbef}.opt.no{border-color:var(--bad);background:#fdecec}
  .btn{padding:9px 16px;border-radius:12px;border:0;font-weight:700;cursor:pointer;font-size:15px}
  #play{background:var(--accent);color:#fff}#replay-narr{background:#eef2ff;color:#5b6cff}
  #row{display:flex;gap:12px}
  #controls{display:flex;gap:14px;align-items:center}
  #replay{width:44px;height:44px;background:#eef1ff;color:#5b6cff;font-size:20px;border:0;cursor:pointer;border-radius:50%}
  #ghost{position:fixed;left:0;top:0;font-size:36px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .5s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:180px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-STORYDET-01 · Story Detective</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="scene">🐶</div>
      <div id="caption"></div>
      <div id="row"><button class="btn" id="play">▶ Play story</button><button class="btn" id="replay-narr">↺ Replay clue</button></div>
      <div id="prompt"></div>
      <div id="opts"></div>
      <div id="controls"><button id="replay" title="replay demo">↻</button></div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
function say(t){return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.onend=res;u.onerror=res;speechSynthesis.cancel();speechSynthesis.speak(u);setTimeout(res,t.length*70+400)}catch(e){res()}})}
const DEPTH={1:'literal',2:'bridging',3:'causal',4:'predictive'};

const STORY={scene:'🐶',lines:[
  "Pip the puppy was very hungry.",
  "He saw a tasty bone up on the table.",
  "Pip pushed a chair over so he could climb up high.",
  "But the bone rolled off and slid under the couch.",
  "Pip sat down right next to the couch and waited."],
 qs:[
  {level:1,scene:'🐶',p:"What did Pip want?",opts:[{i:'🦴',l:'the bone',c:true},{i:'⚽',l:'a ball',lure:'surface'},{i:'💧',l:'water',lure:'thematic'}]},
  {level:2,scene:'🪑',p:"Why did Pip push the chair?",opts:[{i:'🧗',l:'to climb up',c:true},{i:'😴',l:'to sleep',lure:'thematic'},{i:'🍽️',l:'to eat it',lure:'surface'}]},
  {level:3,scene:'🛋️',p:"Why did Pip wait by the couch?",opts:[{i:'🦴',l:'bone rolled there',c:true},{i:'🥱',l:'he was tired',lure:'plausible-uncaused'},{i:'🎾',l:'to play',lure:'thematic'}]},
  {level:4,scene:'🤔',p:"What will Pip do next?",opts:[{i:'🔦',l:'get bone under couch',c:true},{i:'🚪',l:'leave the room',lure:'plausible-uncaused'},{i:'🪑',l:'eat the chair',lure:'absurd'}]}]};
const WARM={scene:'🐱',lines:["A cat named Sox saw a red ball."],
 qs:[{level:1,scene:'🐱',p:"What did Sox see?",opts:[{i:'⚽',l:'a ball',c:true},{i:'🐟',l:'a fish',lure:'thematic'},{i:'🧶',l:'yarn',lure:'thematic'}]}]};

const T={correct:0,total:0,rts:[],hints:0,maxDepth:0,lastErr:'—',lure:{},answered:0,totalQ:0};
const METERS=[
 {id:'M-ACC',name:'Comprehension accuracy',get:()=>T.total?`${T.correct}/${T.total}`:'—'},
 {id:'M-INFDEPTH',name:'Deepest inference correct',get:()=>T.maxDepth?`L${T.maxDepth} (${DEPTH[T.maxDepth]})`:'—'},
 {id:'M-RT',name:'Answer RT (mean)',get:()=>mean(T.rts)==null?'—':mean(T.rts)+' ms'},
 {id:'M-HINT',name:'Re-listens used',get:()=>T.hints+''},
 {id:'M-ERRTYPE',name:'Last error type',get:()=>T.lastErr},
 {id:'M-LURETYPE',name:'Lure profile (errors)',get:()=>Object.keys(T.lure).length?Object.entries(T.lure).map(([k,v])=>k+':'+v).join(' '):'—'},
 {id:'M-PROG',name:'Questions answered',get:()=>T.answered+'/'+T.totalQ},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const d=document.createElement('div');d.innerHTML=`<span class="t">•</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(480)}

let phase='demo',story=null,qi=0,t0=0,curQ=null,lastClue='';
const setCue=i=>$('#phasecue').textContent=i;
async function playStory(s){$('#scene').textContent=s.scene;for(const line of s.lines){$('#caption').textContent=line;lastClue=line;await say(line);await sleep(150)}}
function showQ(q){curQ=q;$('#scene').textContent=q.scene;$('#prompt').textContent='🔊 '+q.p;lastClue=q.p;
  const opts=q.opts.map((o,i)=>`<div class="opt" data-i="${i}"><div>${o.i}</div><small>${o.l}</small></div>`).join('');$('#opts').innerHTML=opts;
  say(q.p);t0=performance.now()}
function answer(i){if(!curQ||phase==='demo'||phase==='done')return;const o=curQ.opts[i];const rt=Math.round(performance.now()-t0);
  const el=$(`.opt[data-i="${i}"]`);T.total++;T.answered++;T.rts.push(rt);
  if(o.c){T.correct++;el.classList.add('ok');T.maxDepth=Math.max(T.maxDepth,curQ.level);T.lastErr='none';log(`Q L${curQ.level} ${DEPTH[curQ.level]}: ✓ rt ${rt}ms`)}
  else{el.classList.add('no');T.lure[o.lure]=(T.lure[o.lure]||0)+1;T.lastErr=o.lure+' lure';log(`Q L${curQ.level}: ✗ chose "${o.l}" (${o.lure} lure)`);
    const ci=curQ.opts.findIndex(x=>x.c);$(`.opt[data-i="${ci}"]`).classList.add('ok')}
  renderMeters();$$('.opt').forEach(x=>x.style.pointerEvents='none');
  setTimeout(()=>{qi++;if(qi<story.qs.length)showQ(story.qs[qi]);else roundDone()},1100)}
function roundDone(){if(phase==='warmup'){log('warm-up done (unscored)');startScored();return}
  phase='done';setCue('🏆');$('#prompt').textContent='Case closed! 🕵️';$('#opts').innerHTML='';log(`— DONE · acc ${T.correct}/${T.total} · deepest L${T.maxDepth} —`);renderMeters()}
async function startWarmup(){phase='warmup';setCue('⭐');story=WARM;qi=0;T.totalQ=WARM.qs.length;Object.assign(T,{correct:0,total:0,rts:[],hints:0,maxDepth:0,lure:{},answered:0,totalQ:WARM.qs.length});
  log('— warm-up (unscored): listen, then tap the answer —');await playStory(WARM);await sleep(200);showQ(WARM.qs[0])}
async function startScored(){phase='scored';setCue('🎯');story=STORY;qi=0;Object.assign(T,{correct:0,total:0,rts:[],hints:0,maxDepth:0,lure:{},answered:0,totalQ:STORY.qs.length});
  log('— SCORED: deeper inference questions —');await playStory(STORY);await sleep(200);showQ(STORY.qs[0])}
async function runDemo(){phase='demo';setCue('👁️');story=WARM;$('#scene').textContent='🐱';log('ghost-hand demo (wordless, <10s)');gShow(true);
  $('#caption').textContent=WARM.lines[0];await say(WARM.lines[0]);await sleep(300);
  const q=WARM.qs[0];$('#prompt').textContent='🔊 '+q.p;$('#opts').innerHTML=q.opts.map((o,i)=>`<div class="opt" data-i="${i}"><div>${o.i}</div><small>${o.l}</small></div>`).join('');await sleep(400);
  await gTo($('.opt[data-i="0"]'));$('.opt[data-i="0"]').classList.add('ok');await sleep(800);gShow(false);await sleep(300);
  $('#opts').innerHTML='';$('#prompt').textContent='';startWarmup()}
$('#opts').addEventListener('click',e=>{const o=e.target.closest('.opt');if(o)answer(+o.dataset.i)});
$('#play').addEventListener('click',()=>{if(story&&phase!=='demo')playStory(story)});
$('#replay-narr').addEventListener('click',()=>{if(phase==='scored'||phase==='warmup'){T.hints++;log('re-listen (hint)');say(lastClue);renderMeters()}});
$('#replay').addEventListener('click',()=>{if(phase==='done'||phase==='warmup'||phase==='scored')runDemo()});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
