<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-RULEPICK-01 · Name the Secret Rule</title>
<style>
  :root{
    --bg1:#eef4ff; --bg2:#f7ecff; --ink:#26304a; --card:#ffffff;
    --accent:#5b6cff; --good:#22b573; --bad:#ff6b6b;
    --tel-bg:#11162a; --tel-ink:#c8d6ff; --tel-key:#7fffcf; --tel-dim:#7183b8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:26px;padding:20px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:14px;max-width:600px;width:100%}
  .rowlabel{font-size:12px;letter-spacing:.1em;color:#98a2c4;text-transform:uppercase}
  #examples{display:flex;flex-direction:column;gap:8px;align-items:center;padding:12px 16px;border-radius:16px;
    background:linear-gradient(160deg,#eaf0ff,#f4f0ff)}
  .expair{display:flex;align-items:center;gap:10px}
  .gbox{background:#fff;border-radius:8px;padding:4px;border:2px solid #e4e9f7}
  .toarrow{font-size:20px;color:#8b96c4}
  #hintlamp{display:flex;align-items:center;gap:6px;font-size:13px;color:#9a7b3a;background:#fff8ea;
    border:2px solid #ffe6b0;border-radius:12px;padding:6px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #hintlamp:hover{background:#fff3d8}
  #hintlamp.spent{opacity:.5;pointer-events:none}
  #cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .rcard{background:#fff;border:3px solid #e2e8fb;border-radius:16px;padding:8px 10px;cursor:pointer;transition:.13s;
    display:flex;flex-direction:column;align-items:center;gap:4px;-webkit-tap-highlight-color:transparent}
  .rcard:hover{transform:translateY(-3px);border-color:#c3ccf5}
  .rcard.sel{border-color:var(--accent);box-shadow:0 0 0 4px #c9d0ff}
  .rcard.hit{border-color:var(--good);box-shadow:0 0 0 4px #b4ecd0}
  .rcard.miss{border-color:var(--bad);box-shadow:0 0 0 4px #ffd0d0}
  .rcard .mini{display:flex;align-items:center;gap:6px}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:72px;height:72px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:50px;height:50px;background:#eef1ff;color:#5b6cff;font-size:22px}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .58s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}
  @keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff;word-break:break-word}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:180px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}
  #log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-RULEPICK-01 · Name the Secret Rule</div>
    <div id="phasecue">&#128065;&#65039;</div>
    <div id="stagecard">
      <div class="rowlabel">watch: before &#8594; after</div>
      <div id="examples"></div>
      <div id="hintlamp">&#128161; one more clue</div>
      <div class="rowlabel">which rule did that? &#183; tap one</div>
      <div id="cards"></div>
      <div id="controls">
        <button id="replay" title="replay demo">&#8635;</button>
        <button id="go" title="submit">&#10003;</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">&#128072;<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const last=a=>a[a.length-1];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

const PAL={red:'#e6194b',green:'#2ca25f',blue:'#4363d8',orange:'#f58231',purple:'#911eb4'};
const INPUT_COLORS=['red','green','orange','purple'];
function clone(g){return {cells:g.cells.map(r=>r.slice()),color:g.color};}
function eqGrid(a,b){if(a.color!==b.color)return false;for(let r=0;r<3;r++)for(let c=0;c<3;c++)if(a.cells[r][c]!==b.cells[r][c])return false;return true;}
const RULES={
  shiftR:{name:'slide right',fn:g=>{const n=clone(g);for(let r=0;r<3;r++)for(let c=0;c<3;c++)n.cells[r][(c+1)%3]=g.cells[r][c];return n;}},
  shiftD:{name:'slide down',fn:g=>{const n=clone(g);for(let r=0;r<3;r++)for(let c=0;c<3;c++)n.cells[(r+1)%3][c]=g.cells[r][c];return n;}},
  reflectH:{name:'flip L\u2013R',fn:g=>{const n=clone(g);for(let r=0;r<3;r++)for(let c=0;c<3;c++)n.cells[r][2-c]=g.cells[r][c];return n;}},
  rotate:{name:'turn \u21bb',fn:g=>{const n=clone(g);for(let r=0;r<3;r++)for(let c=0;c<3;c++)n.cells[c][2-r]=g.cells[r][c];return n;}},
  recolor:{name:'paint blue',fn:g=>{const n=clone(g);n.color='blue';return n;}},
};
function makeInput(){const color=INPUT_COLORS[(Math.random()*INPUT_COLORS.length)|0];
  const all=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)all.push([r,c]);
  const on=shuffle(all).slice(0,3);const cells=[[0,0,0],[0,0,0],[0,0,0]];on.forEach(([r,c])=>cells[r][c]=1);
  return {cells,color};}
function disambiguatingInput(hidden,allKeys){for(let tries=0;tries<80;tries++){const inp=makeInput();
  const ho=RULES[hidden].fn(inp);let ok=true;
  for(const k of allKeys){if(k===hidden)continue;if(eqGrid(RULES[k].fn(inp),ho)){ok=false;break;}}
  if(eqGrid(ho,inp))ok=false; // rule must visibly change this input
  if(ok)return inp;}return makeInput();}
function gridSVG(g,cell=14){const gap=2,s=3*cell+2*gap;let r='';
  for(let i=0;i<3;i++)for(let j=0;j<3;j++){const on=g.cells[i][j],x=j*(cell+gap),y=i*(cell+gap);
    r+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="2" fill="${on?(PAL[g.color]||g.color):'#e7ecf8'}"/>`;}
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">${r}</svg>`;}

function genItem(hiddenKey,distractors){const allKeys=[hiddenKey,...distractors];
  const candKeys=shuffle(allKeys);
  const examples=[];for(let e=0;e<3;e++){const inp=disambiguatingInput(hiddenKey,allKeys);examples.push({inp,out:RULES[hiddenKey].fn(inp)});}
  const cards=candKeys.map(k=>{const inp=makeInput();return {key:k,inp,out:RULES[k].fn(inp)};});
  return {hiddenKey,candKeys,cards,examples,correctIdx:candKeys.indexOf(hiddenKey)};}

const T={scored:0,correct:0,rts:[],firstLat:null,hints:0,switches:0,lastErr:'\u2014',hypLast:'\u2014',itemStart:0,firstActed:false};
const METERS=[
 {id:'M-ACC',name:'Item accuracy (running)',get:()=>T.scored?`${T.correct}/${T.scored}  ${Math.round(100*T.correct/T.scored)}%`:'\u2014'},
 {id:'M-RT',name:'Response time — total',get:()=>T.rts.length?`${last(T.rts)} ms (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency (hypothesis search)',get:()=>T.firstLat==null?'\u2014':T.firstLat+' ms'},
 {id:'M-HINT',name:'Scaffold / extra examples used',get:()=>T.hints+''},
 {id:'M-PROG',name:'Progress (selection revisions)',get:()=>T.switches+''},
 {id:'M-ERRTYPE',name:'Error type (which wrong rule)',get:()=>T.lastErr},
 {id:'M-HYP',name:'Hypothesis-search efficiency',get:()=>T.hypLast},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>
  `<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');
  d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}

const ghost=$('#ghost');
function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(580);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(470);}

let phase='demo',cur=null,sel=-1,shown=1,locked=true,scoredIndex=0;
const scoredItems=[genItem('shiftD',['shiftR','rotate']),genItem('rotate',['reflectH','shiftR','recolor'])];
function setCue(i){$('#phasecue').innerHTML=i;}
function renderExamples(){const el=$('#examples');el.innerHTML='';
  for(let i=0;i<shown;i++){const ex=cur.examples[i];const row=document.createElement('div');row.className='expair';
    row.innerHTML=`<div class="gbox">${gridSVG(ex.inp,16)}</div><span class="toarrow">\u2192</span><div class="gbox">${gridSVG(ex.out,16)}</div>`;el.appendChild(row);}
  const lamp=$('#hintlamp');lamp.classList.toggle('spent',shown>=cur.examples.length);}
function renderCards(){const el=$('#cards');el.innerHTML='';
  cur.cards.forEach((cd,i)=>{const d=document.createElement('div');d.className='rcard'+(sel===i?' sel':'');d.dataset.i=i;
    d.innerHTML=`<div class="mini"><div class="gbox">${gridSVG(cd.inp,10)}</div><span class="toarrow">\u2192</span><div class="gbox">${gridSVG(cd.out,10)}</div></div>`;
    el.appendChild(d);});}
function renderItem(item){cur=item;sel=-1;shown=1;renderExamples();renderCards();$('#go').classList.remove('ready');
  T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;T.hints=0;T.switches=0;T.lastErr='\u2014';T.hypLast='\u2014';renderMeters();}
function onCard(el){if(locked)return;const i=+el.dataset.i;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first pick');}
  if(sel!==-1&&sel!==i){T.switches++;log('revised choice \u2192 card '+(i+1));}
  sel=i;$$('#cards .rcard').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');
  $('#go').classList.add('ready');renderMeters();}
function onHint(){if(locked||shown>=cur.examples.length)return;shown++;T.hints++;log('revealed clue #'+shown);renderExamples();renderMeters();}
function submit(){if(sel===-1)return;const rt=Date.now()-T.itemStart;const correct=sel===cur.correctIdx;
  const cards=$$('#cards .rcard');cards[sel].classList.add(correct?'hit':'miss');if(!correct)cards[cur.correctIdx].classList.add('hit');
  T.hypLast=(1+T.hints)+' example'+((1+T.hints)>1?'s':'')+' used';
  if(phase==='warmup'){log('warm-up '+(correct?'correct':'answer shown')+' — UNSCORED');locked=true;$('#go').classList.remove('ready');setTimeout(nextPhase,1100);return;}
  T.scored++;T.rts.push(rt);T.lastErr=correct?'none':('chose "'+RULES[cur.candKeys[sel]].name+'"');
  if(correct)T.correct++;
  locked=true;$('#go').classList.remove('ready');
  log(`SUBMIT item ${scoredIndex+1} · hidden="${RULES[cur.hiddenKey].name}" \u2192 ${correct?'CORRECT':'wrong'} · clues ${1+T.hints} · revisions ${T.switches} · RT ${rt}ms`);
  renderMeters();setTimeout(nextPhase,1350);}
function nextPhase(){if(phase==='warmup'){scoredIndex=0;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<scoredItems.length?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('&#11088;');locked=false;renderItem(genItem('recolor',['shiftR','reflectH']));log('— warm-up (unscored): which rule changed the grid? —');}
function startScored(){phase='scored';setCue('&#127919;');locked=false;renderItem(scoredItems[scoredIndex]);
  log(`— SCORED item ${scoredIndex+1}: find the rule behind before\u2192after —`);}
function finish(){phase='done';setCue('&#127942;');locked=true;log(`— DONE · accuracy ${T.correct}/${T.scored} —`);}
async function runDemo(){phase='demo';setCue('&#128065;&#65039;');locked=true;
  const d=genItem('shiftR',['reflectH','recolor']);renderItem(d);log('ghost-hand demo (wordless, <10s): spot the rule');
  ghostShow(true);await sleep(350);
  const ex=$$('#examples .gbox');await ghostTo(ex[0]);await ghostTo(ex[1]);await sleep(200);
  locked=false;const correctCard=$$('#cards .rcard')[d.correctIdx];await ghostTo(correctCard);await ghostTap();onCard(correctCard);
  await sleep(250);await ghostTo($('#go'));await ghostTap();
  const cards=$$('#cards .rcard');cards[d.correctIdx].classList.add('hit');
  await sleep(650);ghostShow(false);locked=true;await sleep(400);startWarmup();}

$('#cards').addEventListener('click',e=>{const c=e.target.closest('.rcard');if(c)onCard(c);});
$('#hintlamp').addEventListener('click',onHint);
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
