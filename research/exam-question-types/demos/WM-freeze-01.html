<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-freeze-01 — Freeze Dance (go/no-go, stop-signal, statue)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #stage{width:420px;height:250px;border:2px solid var(--edge);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:100px;cursor:pointer;user-select:none;background:#141a30;transition:background .1s}
  #stage.go{background:#123a26}#stage.stop{background:#3a1420}#stage.nogo{background:#2a2140}
  #verdict{font-size:22px;height:30px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.ctl{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🕺 Freeze Dance <span class="badge" id="blevel">SSD 250ms</span></h1>
    <p class="sub">Tap the stage when the dancer 💃 moves. <b>Freeze</b> (don't tap) for the statue 🗿. If the dancer turns 🔴 after you start — pull back and don't tap!</p>
  </div>
  <div id="stage">🎵</div>
  <div id="verdict"></div>
  <div class="row">
    <button class="pri ctl" id="go">▶ Watch how it works</button>
    <button class="ctl" id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const stage=$("#stage"),verdict=$("#verdict");
const T={phase:"idle",trial:0,goHit:0,goN:0,goRT:[],comm:0,nogoN:0,fa:0,stopN:0,stopFail:0,ssd:250,ssdList:[],
  lastErr:false,postErr:[],base:[],onTask:0,opps:0,log:[]};
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function med(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m}
function ssrt(){const s=med(T.goRT)-mean(T.ssdList);return T.ssdList.length?Math.round(s):0}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop()}
function render(){
  const pes=Math.round(mean(T.postErr)-mean(T.base))||0;
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-freeze-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>trials</span><b>${T.trial}</b></div>
  <h2>Inhibition</h2>
  <div class="kv"><span>commission (statue tapped) <span class="m">M-COMM</span></span><b>${T.comm}/${T.nogoN}</b></div>
  <div class="kv"><span>stop-signal RT <span class="m">M-SSRT</span></span><b>${ssrt()} ms</b></div>
  <div class="kv"><span>false alarms <span class="m">M-FALSEALARM</span></span><b>${T.fa}</b></div>
  <h2>Go performance</h2>
  <div class="kv"><span>go hits</span><b>${T.goHit}/${T.goN}</b></div>
  <div class="kv"><span>go-RT median</span><b>${Math.round(med(T.goRT))} ms</b></div>
  <h2>Control & consistency</h2>
  <div class="kv"><span>go-RT CV <span class="m">M-RTVAR</span></span><b>${cv(T.goRT).toFixed(2)}</b></div>
  <div class="kv"><span>post-error slowing <span class="m">M-POSTERR</span></span><b>${pes>0?"+":""}${pes} ms</b></div>
  <div class="kv"><span>on-task <span class="m">M-ENGAGE</span></span><b>${T.opps?Math.round(100*T.onTask/T.opps):100}%</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();

let cur=null;
stage.onpointerdown=()=>{if(!cur||cur.done)return;cur.tapT=performance.now()-cur.onset;cur.tapped=true;
  if(cur.type==="go"){cur.done=true;stage.classList.remove("go");}
};
async function trial(scored){
  const r=Math.random();const type=r<0.6?"go":(r<0.8?"nogo":"stop");
  await sleep(400);
  cur={type,onset:0,tapped:false,tapT:null,done:false,stopped:false};
  if(type==="go"){stage.textContent="💃";stage.className="go";cur.onset=performance.now();
    await sleep(1100);cur.done=true;stage.className="";
    if(scored){T.trial++;T.goN++;T.opps++;if(cur.tapped){T.goHit++;T.onTask++;T.goRT.push(cur.tapT);(T.lastErr?T.postErr:T.base).push(cur.tapT);verdict.textContent="✅";T.lastErr=false;}else{verdict.textContent="🐢 missed the beat";T.lastErr=true;logE("missed go");}}
  } else if(type==="nogo"){stage.textContent="🗿";stage.className="nogo";cur.onset=performance.now();
    await sleep(1100);cur.done=true;stage.className="";
    if(scored){T.trial++;T.nogoN++;T.opps++;if(cur.tapped){T.comm++;verdict.textContent="❌ don't tap the statue!";T.lastErr=true;logE("commission (statue)");}else{T.onTask++;verdict.textContent="🧊 froze — nice";}}
  } else { // stop-signal: dancer then turns red at ssd
    stage.textContent="💃";stage.className="go";cur.onset=performance.now();
    await sleep(T.ssd);
    if(!cur.tapped){stage.textContent="🔴";stage.className="stop";}
    await sleep(900);cur.done=true;stage.className="";
    if(scored){T.trial++;T.stopN++;T.opps++;
      if(cur.tapped){T.stopFail++;T.fa++;T.ssd=Math.max(50,T.ssd-50);verdict.textContent="❌ should have stopped";T.lastErr=true;logE("stop failed");}
      else{T.ssdList.push(T.ssd);T.ssd=Math.min(700,T.ssd+50);T.onTask++;verdict.textContent="🛑 stopped in time!";}
      $("#blevel").textContent="SSD "+T.ssd+"ms";}
  }
  render();await sleep(350);verdict.textContent="";
}
async function block(scored,len){for(let i=0;i<len;i++)await trial(scored);}

async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;$("#replay").disabled=true;
  const ghost=document.createElement("div");ghost.textContent="👆";ghost.style.cssText="position:fixed;font-size:30px;z-index:9;transition:left .4s,top .4s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  const r=stage.getBoundingClientRect();
  stage.textContent="💃";stage.className="go";await sleep(300);ghost.style.opacity="1";ghost.style.left=(r.left+r.width/2-12)+"px";ghost.style.top=(r.top+r.height/2)+"px";
  await sleep(600);verdict.textContent="✅ tapped the dance";await sleep(500);stage.className="";
  stage.textContent="🗿";stage.className="nogo";verdict.textContent="";ghost.style.top=(r.top-30)+"px";await sleep(700);verdict.textContent="🧊 freeze — no tap!";await sleep(700);stage.className="";
  ghost.remove();T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice round";$("#go").onclick=warmup;
  $("#phasehint").textContent="Tap for the dancer, freeze for the statue, pull back on red. Practice (not scored).";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;
async function warmup(){T.phase="warm-up (unscored)";render();$("#go").disabled=true;$("#replay").disabled=true;await block(false,5);
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;$("#go").textContent="▶ Start scored game";$("#go").onclick=startScored;
  $("#phasehint").textContent="These count. Freezing when you should beats fast tapping.";render();}
async function startScored(){T.phase="scored";render();$("#go").disabled=true;$("#replay").disabled=true;await block(true,16);
  T.phase="done";$("#go").disabled=false;$("#replay").disabled=false;$("#go").textContent="▶ Play again";$("#go").onclick=startScored;
  $("#phasehint").textContent=`Done. SSRT ${ssrt()}ms; statue commissions ${T.comm}/${T.nogoN}. Control beats speed.`;verdict.textContent="🏁";render();}
</script>
</body>
</html>
