<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-STACK-01 · Stack the Panel</title>
<style>
  :root{
    --bg1:#eef4ff; --bg2:#f7ecff; --ink:#26304a; --card:#ffffff;
    --accent:#5b6cff; --good:#22b573; --bad:#ff6b6b; --socket:#c9d3ef;
    --tel-bg:#11162a; --tel-ink:#c8d6ff; --tel-key:#7fffcf; --tel-dim:#7183b8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px;filter:saturate(1.2)}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:18px;max-width:560px;width:100%}
  #machine{position:relative;padding:16px;border-radius:20px;
    background:linear-gradient(160deg,#dfe7ff,#eef1ff);border:3px solid #cfd8ff}
  #lights{display:flex;gap:8px;justify-content:center;margin-top:12px}
  #lights span{width:14px;height:14px;border-radius:50%;background:#cbd5f5;transition:.25s}
  #lights.on span{background:var(--good);box-shadow:0 0 12px var(--good)}
  .matrix{display:grid;gap:8px;background:#c7d2f2;padding:8px;border-radius:14px}
  .rowlab{display:grid;gap:8px}
  .cell{background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;
    width:88px;height:88px;position:relative}
  .op{display:flex;align-items:center;justify-content:center;font-size:26px;color:#8a93b5;font-weight:700;width:26px}
  .cell.empty{background:repeating-linear-gradient(45deg,#eef2ff,#eef2ff 8px,#e2e9ff 8px,#e2e9ff 16px);
    border:3px dashed var(--socket)}
  .cell.filled-anim{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}
  #tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .opt{background:#fff;border:3px solid #e2e8fb;border-radius:14px;width:84px;height:84px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;
    -webkit-tap-highlight-color:transparent}
  .opt:hover{transform:translateY(-3px);border-color:#c3ccf5}
  .opt.sel{border-color:var(--accent);box-shadow:0 0 0 4px #c9d0ff;transform:translateY(-3px)}
  .opt.correct{border-color:var(--good);box-shadow:0 0 0 4px #b4ecd0}
  .opt.wrong{border-color:var(--bad);box-shadow:0 0 0 4px #ffd0d0}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:76px;height:76px;background:var(--accent);color:#fff;font-size:32px;
    box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:52px;height:52px;background:#eef1ff;color:#5b6cff;font-size:24px}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .7s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;
    border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}
  @keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);
    display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;
    background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:200px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}
  #log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-STACK-01 · Stack the Panel</div>
    <div id="phasecue">&#128065;</div>
    <div id="stagecard">
      <div id="machine">
        <div id="matrix" class="matrix"></div>
        <div id="lights"><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <div id="tray"></div>
      <div id="controls">
        <button id="replay" title="replay demo">&#8635;</button>
        <button id="go" title="submit">&#10003;</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">&#128070;<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const last=a=>a[a.length-1];

/* ---------- panel (2x2 mark grid) rendering ---------- */
const DOTC='#4363d8';
function maskSVG(mask,color,box=82){
  const pos=[[.3,.3],[.7,.3],[.3,.7],[.7,.7]];
  let inner=`<rect x="5" y="5" width="${box-10}" height="${box-10}" rx="10" fill="#f5f8ff" stroke="#dce4ff"/>`;
  inner+=`<line x1="${box/2}" y1="12" x2="${box/2}" y2="${box-12}" stroke="#e7ecff"/>`;
  inner+=`<line x1="12" y1="${box/2}" x2="${box-12}" y2="${box/2}" stroke="#e7ecff"/>`;
  for(let i=0;i<4;i++) if(mask&(1<<i)) inner+=`<circle cx="${pos[i][0]*box}" cy="${pos[i][1]*box}" r="${box*0.13}" fill="${color}"/>`;
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${inner}</svg>`;
}
function applyOp(a,b,op){return op==='OR'?(a|b):op==='XOR'?(a^b):(a&b);}
const OPSYM={OR:'&#8746;',XOR:'&#8853;',AND:'&#8745;'};
const RULELOAD={OR:1,AND:1,XOR:2};

/* ---------- item generation (AIG: logical-combination grammar) ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function mkRow(op){let a,b,c,guard=0;
  do{a=1+((Math.random()*15)|0);b=1+((Math.random()*15)|0);c=applyOp(a,b,op);guard++;}
  while((c===0||a===b||a===c||b===c)&&guard<60);
  return {a,b,c};
}
function genItem(op){
  const rows=[mkRow(op),mkRow(op),mkRow(op)];
  const A=rows[2].a,B=rows[2].b,C=rows[2].c;
  const cand=[{m:C,tag:'correct'}];
  const push=(m,tag)=>{if(m!==0&&!cand.some(o=>o.m===m))cand.push({m,tag});};
  push(A|B,'combo:union'); push(A&B,'combo:intersection'); push(A^B,'combo:xor');
  push(A,'source:A'); push(B,'source:B');
  let g=0; while(cand.length<4&&g++<30){push(1+((Math.random()*15)|0),'random');}
  return {op,rows,options:shuffle(cand.slice(0,4)),ruleLoad:RULELOAD[op]};
}

/* ---------- telemetry ---------- */
const T={scored:0,correct:0,rts:[],firstLat:null,lastErr:'\u2014',maxLoad:0,lastRule:'\u2014',
  itemStart:0,firstActed:false};
const METERS=[
 {id:'M-ACC',name:'Item accuracy (running)',get:()=>T.scored?`${T.correct}/${T.scored}  ${Math.round(100*T.correct/T.scored)}%`:'\u2014'},
 {id:'M-RT',name:'Response time — total',get:()=>T.rts.length?`${last(T.rts)} ms  (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency (study rows first)',get:()=>T.firstLat==null?'\u2014':T.firstLat+' ms'},
 {id:'M-ERRTYPE',name:'Error type (combination-error key)',get:()=>T.lastErr},
 {id:'M-RULEID',name:'Rule dimensionality solved (logical load)',get:()=>T.lastRule},
 {id:'M-DIFFREACH',name:'Max difficulty reached (hardest op)',get:()=>T.maxLoad?T.maxLoad+' (1=OR/AND, 2=XOR)':'\u2014'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>
  `<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span>`
  +`<span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');
  d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}

/* ---------- ghost hand ---------- */
const ghost=$('#ghost');
function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(720);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(520);}

/* ---------- flow ---------- */
let phase='demo',cur=null,staged=-1,locked=false,scoredIndex=0;
const scoredItems=[genItem('OR'),genItem('XOR')];
function setCue(i){$('#phasecue').innerHTML=i;}
function lights(on){$('#lights').classList.toggle('on',on);}
function disableTray(d){locked=d;}
function renderItem(item){cur=item;const m=$('#matrix');m.style.gridTemplateColumns='88px 26px 88px 26px 88px';m.innerHTML='';
  item.rows.forEach((row,ri)=>{
    const cA=document.createElement('div');cA.className='cell';cA.innerHTML=maskSVG(row.a,DOTC);m.appendChild(cA);
    const op1=document.createElement('div');op1.className='op';op1.innerHTML=OPSYM[item.op];m.appendChild(op1);
    const cB=document.createElement('div');cB.className='cell';cB.innerHTML=maskSVG(row.b,DOTC);m.appendChild(cB);
    const eq=document.createElement('div');eq.className='op';eq.innerHTML='=';m.appendChild(eq);
    const cC=document.createElement('div');cC.className='cell';
    if(ri===2){cC.classList.add('empty');cC.id='emptycell';}else cC.innerHTML=maskSVG(row.c,DOTC);
    m.appendChild(cC);
  });
  const tray=$('#tray');tray.innerHTML='';
  item.options.forEach((o,i)=>{const b=document.createElement('div');b.className='opt';b.dataset.i=i;b.innerHTML=maskSVG(o.m,DOTC);tray.appendChild(b);});
  lights(false);$('#go').classList.remove('ready');
  staged=-1;T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;renderMeters();}
function fillEmpty(mask){const cell=$('#emptycell');if(!cell)return;cell.classList.remove('empty');
  cell.classList.add('filled-anim');cell.innerHTML=maskSVG(mask,DOTC);setTimeout(()=>cell.classList.remove('filled-anim'),300);}
function onOpt(el){if(locked||phase==='demo'||phase==='done')return;const idx=+el.dataset.i;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first tap · option '+idx);}
  staged=idx;$$('#tray .opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');
  fillEmpty(cur.options[idx].m);$('#go').classList.add('ready');renderMeters();}
function feedback(correct){const opt=$$('#tray .opt')[staged];if(opt)opt.classList.add(correct?'correct':'wrong');
  if(correct)lights(true);else{$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),450);
    const ci=cur.options.findIndex(o=>o.tag==='correct');$$('#tray .opt')[ci].classList.add('correct');}
  disableTray(true);$('#go').classList.remove('ready');}
function submit(){if(staged===-1)return;const opt=cur.options[staged];const rt=Date.now()-T.itemStart;const correct=opt.tag==='correct';
  if(phase==='warmup'){feedback(correct);log('warm-up '+(correct?'correct':'incorrect')+' — UNSCORED');setTimeout(nextPhase,950);return;}
  T.scored++;T.rts.push(rt);
  if(correct){T.correct++;T.maxLoad=Math.max(T.maxLoad,cur.ruleLoad);T.lastErr='none';T.lastRule=cur.ruleLoad+' / '+cur.ruleLoad+' satisfied';}
  else{T.lastErr=opt.tag; T.lastRule='0 / '+cur.ruleLoad+' satisfied';}
  feedback(correct);
  log(`SUBMIT scored ${scoredIndex+1} · op=${cur.op} \u2192 ${correct?'CORRECT':'wrong ['+opt.tag+']'} · RT ${rt}ms · firstLat ${T.firstLat}ms`);
  renderMeters();setTimeout(nextPhase,1200);}
function nextPhase(){if(phase==='warmup'){scoredIndex=0;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<scoredItems.length?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('&#11088;');disableTray(false);renderItem(genItem('OR'));log('— warm-up (unscored): OR / overlay —');}
function startScored(){phase='scored';setCue('&#127919;');disableTray(false);renderItem(scoredItems[scoredIndex]);
  log(`— SCORED item ${scoredIndex+1}: combine rule = ${cur.op} (load ${cur.ruleLoad}) —`);}
function finish(){phase='done';setCue('&#127942;');disableTray(true);lights(true);
  log(`— DONE · accuracy ${T.correct}/${T.scored} · ceiling load ${T.maxLoad} —`);}
async function runDemo(){phase='demo';setCue('&#128065;');disableTray(true);
  const d=genItem('OR');renderItem(d);log('ghost-hand demo (wordless, <10s): rows 1-2 teach the overlay rule');
  const ci=d.options.findIndex(o=>o.tag==='correct');
  ghostShow(true);await sleep(300);
  const cells=$$('#matrix .cell');
  await ghostTo(cells[6]);await sleep(180);await ghostTo(cells[7]);await sleep(180);
  await ghostTo($('#matrix .cell.empty'));await sleep(220);
  await ghostTo($$('#tray .opt')[ci]);await ghostTap();
  $$('#tray .opt')[ci].classList.add('correct');fillEmpty(d.options[ci].m);lights(true);
  await sleep(500);await ghostTo($('#go'));await ghostTap();await sleep(350);ghostShow(false);await sleep(450);startWarmup();}

$('#tray').addEventListener('click',e=>{const o=e.target.closest('.opt');if(o)onOpt(o);});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
