<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-PORTAL-01 · Portal Planner</title>
<style>
  :root{--bg1:#eef0ff;--bg2:#e9fbff;--ink:#26304a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:16px}
  .pegs{display:flex;gap:26px;align-items:flex-end}
  .peg{width:74px;display:flex;flex-direction:column-reverse;align-items:center;gap:5px;cursor:pointer;
    background:linear-gradient(#f4f7ff,#e9eeff);border-radius:12px;padding:8px 0 10px;border:3px solid #d7deff;min-height:150px;justify-content:flex-start}
  .peg .base{width:64px;height:8px;border-radius:4px;background:#c3ccef;margin-top:4px}
  .peg.sel{border-color:var(--accent);box-shadow:0 0 0 4px #cdd3ff}
  .orb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;
    color:#fff;font-weight:700;box-shadow:inset 0 -5px 8px rgba(0,0,0,.18)}
  .lift{transform:translateY(-10px) scale(1.08)}
  .goal .peg{min-height:auto;padding:6px 0;background:#f6f8ff;border-style:dashed}
  .goal .orb{width:26px;height:26px;font-size:13px}
  #goalwrap{font-size:13px;color:#777;display:flex;flex-direction:column;align-items:center;gap:6px}
  #controls{display:flex;gap:14px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #replay{width:48px;height:48px;background:#eef1ff;color:#5b6cff;font-size:22px}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .6s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:200px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-PORTAL-01 · Portal Planner</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="goalwrap"><span>goal</span><div id="goal" class="pegs goal"></div></div>
      <div id="pegs" class="pegs"></div>
      <div id="controls"><button id="replay" title="replay demo">↻</button></div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const COL={R:'#e6194b',B:'#4363d8',G:'#3cb44b'};const GLYPH={R:'★',B:'●',G:'▲'};
function key(st){return st.map(p=>p.join('')).join('|')}
function moves(st){const out=[];for(let i=0;i<3;i++){if(!st[i].length)continue;for(let j=0;j<3;j++){if(i===j)continue;
  const s=st.map(p=>p.slice());const b=s[i].pop();s[j].push(b);out.push([s,i,j,b])}}return out}
function distTo(goal){const dist={[key(goal)]:0};const q=[goal];
  while(q.length){const st=q.shift();const d=dist[key(st)];for(const[ns]of moves(st)){const k=key(ns);if(!(k in dist)){dist[k]=d+1;q.push(ns)}}}return dist}

const T={itemStart:0,moves:0,firstLat:null,firstActed:false,opt:0,prevMove:null,rev:0,hint:0,scored:0,correct:0};
const METERS=[
 {id:'M-ACC',name:'Solved (scored)',get:()=>T.scored?`${T.correct}/${T.scored}`:'—'},
 {id:'M-EFF',name:'Moves over minimum',get:()=>T.opt?`${T.moves} (min ${T.opt}, +${Math.max(0,T.moves-T.opt)})`:'—'},
 {id:'M-RTFIRST',name:'Preplanning latency',get:()=>T.firstLat==null?'—':T.firstLat+' ms'},
 {id:'M-PATH',name:'Moves made',get:()=>T.moves+''},
 {id:'M-REV',name:'Undo/reversal moves',get:()=>T.rev+''},
 {id:'M-HINT',name:'Hints used',get:()=>T.hint+''},
 {id:'M-PROG',name:'Distance to goal',get:()=>T._dg==null?'—':T._dg},
 {id:'M-PERSIST',name:'Time-on-task (ms)',get:()=>T.itemStart?(Date.now()-T.itemStart):'—'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const t=T.itemStart?Date.now()-T.itemStart:0;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(600)}

let phase='demo',state,goal,distGoal,picked=-1,locked=false;
const setCue=i=>$('#phasecue').textContent=i;
function renderGoal(){const g=$('#goal');g.innerHTML='';goal.forEach(p=>{const pe=document.createElement('div');pe.className='peg';
  p.forEach(b=>{const o=document.createElement('div');o.className='orb';o.style.background=COL[b];o.textContent=GLYPH[b];pe.appendChild(o)});
  const base=document.createElement('div');base.className='base';pe.appendChild(base);g.appendChild(pe)})}
function render(){const pg=$('#pegs');pg.innerHTML='';state.forEach((p,i)=>{const pe=document.createElement('div');pe.className='peg'+(picked===i?' sel':'');pe.dataset.i=i;
  p.forEach((b,bi)=>{const o=document.createElement('div');o.className='orb'+(picked===i&&bi===p.length-1?' lift':'');o.style.background=COL[b];o.textContent=GLYPH[b];pe.appendChild(o)});
  const base=document.createElement('div');base.className='base';pe.appendChild(base);pg.appendChild(pe)});
  T._dg=distGoal[key(state)];renderMeters()}
function newLevel(start,g){state=start.map(p=>p.slice());goal=g.map(p=>p.slice());distGoal=distTo(goal);
  T.itemStart=Date.now();T.moves=0;T.firstActed=false;T.firstLat=null;T.opt=distGoal[key(state)];T.rev=0;T.hint=0;picked=-1;locked=false;
  renderGoal();render()}
function tapPeg(i){if(locked)return;
  if(picked===-1){if(!state[i].length)return;picked=i;render();return}
  if(picked===i){picked=-1;render();return}
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first move (after preplanning)')}
  const b=state[picked].pop();state[i].push(b);const thisMove=b+':'+picked+'>'+i;
  if(T.prevMove&&T.prevMove===b+':'+i+'>'+picked)T.rev++;T.prevMove=thisMove;
  T.moves++;log(`move ${GLYPH[b]} peg${picked}→peg${i}  (dist→${distGoal[key(state)]})`);picked=-1;render();
  if(key(state)===key(goal))solved()}
function solved(){locked=true;
  if(phase==='scored'){T.scored++;T.correct++;setCue('🏆');log(`SOLVED · moves ${T.moves} (min ${T.opt}, over ${T.moves-T.opt}) · preplan ${T.firstLat}ms · reversals ${T.rev}`);renderMeters();setTimeout(finish,1200)}
  else{log('warm-up solved (unscored)');setTimeout(startScored,1100)}}
function startWarmup(){phase='warmup';setCue('⭐');newLevel([['B'],['R'],[]],[['B'],[],['R']]);log('— warm-up (unscored): make pegs match the goal —')}
function startScored(){phase='scored';setCue('🎯');newLevel([['G','B','R'],[],[]],[['R'],['G'],['B']]);log('— SCORED: match the goal in fewest moves (plan ahead) —')}
function finish(){phase='done';locked=true}
async function runDemo(){phase='demo';setCue('👁️');newLevel([['B'],['R'],[]],[['B'],[],['R']]);log('ghost-hand demo (wordless, <10s)');gShow(true);await sleep(400);
  const pegs=$$('#pegs .peg');await gTo(pegs[1]);picked=1;render();await sleep(400);
  await gTo($$('#pegs .peg')[2]);const b=state[1].pop();state[2].push(b);picked=-1;render();await sleep(500);
  gShow(false);await sleep(700);startWarmup()}
$('#pegs').addEventListener('click',e=>{const p=e.target.closest('.peg');if(p)tapPeg(+p.dataset.i)});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo()});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
