<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPA-VIEWS-01 · Three Views</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f0ecff;--ink:#26304a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:640px;width:100%}
  #struct{background:#f6f8ff;border-radius:16px;padding:6px}
  #turn{display:flex;gap:10px;align-items:center;font-size:13px;color:#8a93b5}
  .rot{width:40px;height:34px;border-radius:10px;border:2px solid #d3ddf3;background:#fff;cursor:pointer;font-size:18px}
  .vrow{display:flex;align-items:center;gap:12px;width:100%;justify-content:center}
  .vlabel{width:64px;text-align:center;font-size:26px}
  .cands{display:flex;gap:10px}
  .cand{padding:6px;border-radius:12px;border:3px solid #e8ecf8;background:#fff;cursor:pointer;transition:.12s}
  .cand.sel{border-color:var(--accent);box-shadow:0 0 0 3px #dfe4ff}
  .cand.good{border-color:var(--good);background:#eafaf1}.cand.bad{border-color:var(--bad);background:#fdeeee}
  #tools{display:flex;gap:14px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:14px}
  #submit{padding:11px 24px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;opacity:.4;pointer-events:none}
  #submit.ready{opacity:1;pointer-events:auto}
  #replay{width:46px;height:46px;border-radius:50%;background:#eef1ff;color:#5b6cff;font-size:20px}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;transition:transform .6s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:180px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:270px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">SPA-VIEWS-01 · Three Views</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="struct"></div>
      <div id="turn"><span>spin to look:</span><button class="rot" id="rotL">↺</button><button class="rot" id="rotR">↻</button></div>
      <div id="questions"></div>
      <div id="tools">
        <button id="replay" title="replay demo">↻</button>
        <button id="submit">Submit views</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;

/* ---- isometric render ---- */
function proj(X,Y,Z,ox,oy){const s=20;return[ox+(X-Y)*s*0.87, oy+(X+Y)*s*0.5-Z*s];}
function cube(x,y,z,ox,oy){const c=(a,b,cc)=>proj(a,b,cc,ox,oy);
  const top=[c(x,y,z+1),c(x+1,y,z+1),c(x+1,y+1,z+1),c(x,y+1,z+1)];
  const left=[c(x,y+1,z+1),c(x+1,y+1,z+1),c(x+1,y+1,z),c(x,y+1,z)];
  const right=[c(x+1,y,z+1),c(x+1,y+1,z+1),c(x+1,y+1,z),c(x+1,y,z)];
  const pp=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<polygon points="${pp(left)}" fill="#8ea2e6" stroke="#3f4f9e" stroke-width="1"/><polygon points="${pp(right)}" fill="#6d84d8" stroke="#3f4f9e" stroke-width="1"/><polygon points="${pp(top)}" fill="#c3d0ff" stroke="#3f4f9e" stroke-width="1"/>`;}
function drawStruct(vox,W=200,H=170){const ox=W*0.5,oy=H*0.42;
  const sorted=vox.slice().sort((a,b)=>(a.x+a.y+a.z)-(b.x+b.y+b.z));
  let s='';sorted.forEach(v=>s+=cube(v.x,v.y,v.z,ox,oy));
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>`;}
function rotZ(vox){ // rotate 90deg about z: (x,y)->(y,-x) then normalize
  let r=vox.map(v=>({x:v.y,y:-v.x,z:v.z}));const minX=Math.min(...r.map(v=>v.x)),minY=Math.min(...r.map(v=>v.y));
  return r.map(v=>({x:v.x-minX,y:v.y-minY,z:v.z}));}

/* views from voxels */
function dims(vox){return{mx:Math.max(...vox.map(v=>v.x)),my:Math.max(...vox.map(v=>v.y)),mz:Math.max(...vox.map(v=>v.z))};}
function topView(vox){const{mx,my}=dims(vox);const g=[];for(let y=my;y>=0;y--){const row=[];for(let x=0;x<=mx;x++)row.push(vox.some(v=>v.x===x&&v.y===y)?1:0);g.push(row);}return g;}
function frontView(vox){const{mx,mz}=dims(vox);const g=[];for(let z=mz;z>=0;z--){const row=[];for(let x=0;x<=mx;x++)row.push(vox.some(v=>v.x===x&&v.z===z)?1:0);g.push(row);}return g;}
function sideView(vox){const{my,mz}=dims(vox);const g=[];for(let z=mz;z>=0;z--){const row=[];for(let y=0;y<=my;y++)row.push(vox.some(v=>v.y===y&&v.z===z)?1:0);g.push(row);}return g;}
const gkey=g=>g.map(r=>r.join('')).join('/');
function gridSVG(g,cell=15){const rows=g.length,cols=g[0].length,W=cols*cell+4,H=rows*cell+4;let s='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)s+=`<rect x="${2+c*cell}" y="${2+r*cell}" width="${cell-1.5}" height="${cell-1.5}" rx="2" fill="${g[r][c]?'#5b6cff':'#e6ebf7'}"/>`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>`;}
function perturb(g){const g2=g.map(r=>r.slice());const filled=[];g2.forEach((r,ri)=>r.forEach((v,ci)=>{if(v)filled.push([ri,ci]);}));if(filled.length>1){const[ri,ci]=filled[Math.random()*filled.length|0];g2[ri][ci]=0;}return g2;}

/* telemetry */
const T={acc:0,asked:0,poly:[],rts:[],firsts:[],revs:0,errTypes:[],explore:0,maxOcc:0,itemStart:0,firstTap:null};
function polyStr(){if(!T.poly.length)return '\u2014';const l=T.poly[T.poly.length-1];return `${l.c}/${l.t} views`;}
function errStr(){if(!T.errTypes.length)return 'none';const c={};T.errTypes.forEach(e=>c[e]=(c[e]||0)+1);return Object.entries(c).map(([k,v])=>k+':'+v).join(' ');}
const METERS=[
 {id:'M-ACC',name:'Views correct / asked',get:()=>T.asked?`${T.acc}/${T.asked}`:'\u2014'},
 {id:'M-POLY',name:'Views right this item (of 3)',get:()=>polyStr()},
 {id:'M-RT',name:'Response time (mean)',get:()=>T.rts.length?mean(T.rts)+' ms':'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency (mean)',get:()=>T.firsts.length?mean(T.firsts)+' ms':'\u2014'},
 {id:'M-REV',name:'Selection changes',get:()=>T.revs+''},
 {id:'M-ERRTYPE',name:'Error type (occlusion vs view-swap)',get:()=>errStr()},
 {id:'M-EXPLORE',name:'Structure rotations used',get:()=>T.explore+''},
 {id:'M-DIFFREACH',name:'Max occlusion depth solved',get:()=>T.maxOcc||'\u2014'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');const ghostShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(560);}

/* structures */
const STR={
  warm:[{x:0,y:0,z:0},{x:1,y:0,z:0},{x:0,y:1,z:0}],
  scored:[{x:0,y:0,z:0},{x:1,y:0,z:0},{x:0,y:1,z:0},{x:0,y:0,z:1},{x:0,y:0,z:2}]};
const VIEWDEF=[{k:'top',icon:'⬇️',fn:topView},{k:'front',icon:'➡️',fn:frontView},{k:'side',icon:'↘️',fn:sideView}];
let phase='demo',vox=[],curViews=[],seq=[],si=0;
function setCue(i){$('#phasecue').textContent=i;}
function renderStruct(){$('#struct').innerHTML=drawStruct(vox);}
function occlusionDepth(v){const d=dims(v);let hidden=0;v.forEach(a=>{if(v.some(b=>b.x===a.x&&b.y===a.y&&b.z>a.z))hidden++;});return d.mz;}
function buildQuestions(views){ // views: array of view keys to ask
  curViews=views.map(k=>{const def=VIEWDEF.find(d=>d.k===k);const correct=def.fn(vox);
    const others=VIEWDEF.filter(d=>d.k!==k).map(d=>d.fn(vox));
    let cands=[{g:correct,type:'correct'}];
    const sib=others.find(o=>gkey(o)!==gkey(correct));if(sib)cands.push({g:sib,type:'view-swap'});
    const pert=perturb(correct);if(gkey(pert)!==gkey(correct))cands.push({g:pert,type:'occlusion'});
    while(cands.length<3)cands.push({g:others[cands.length%others.length],type:'view-swap'});
    for(let i=cands.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[cands[i],cands[j]]=[cands[j],cands[i]];}
    return{k,icon:def.icon,cands,correctKey:gkey(correct),sel:-1};});
  const wrap=$('#questions');wrap.innerHTML='';
  curViews.forEach((q,qi)=>{const row=document.createElement('div');row.className='vrow';
    row.innerHTML=`<div class="vlabel">${q.icon}</div><div class="cands">${q.cands.map((c,ci)=>`<div class="cand" data-q="${qi}" data-c="${ci}">${gridSVG(c.g)}</div>`).join('')}</div>`;
    wrap.appendChild(row);});
  $('#submit').classList.remove('ready');}
function selectCand(qi,ci){if(phase==='demo'||phase==='done')return;if(T.firstTap===null){T.firstTap=Date.now()-T.itemStart;}
  const q=curViews[qi];if(q.sel!==-1&&q.sel!==ci)T.revs++;q.sel=ci;
  $$(`.cand[data-q="${qi}"]`).forEach(el=>el.classList.toggle('sel',+el.dataset.c===ci));
  if(curViews.every(x=>x.sel!==-1))$('#submit').classList.add('ready');}
function submit(){if(!curViews.every(x=>x.sel!==-1))return;const rt=Date.now()-T.itemStart;let c=0;
  curViews.forEach((q,qi)=>{const chosen=q.cands[q.sel];const ok=gkey(chosen.g)===q.correctKey;T.asked++;if(ok){T.acc++;c++;}else T.errTypes.push(chosen.type);
    const el=$$(`.cand[data-q="${qi}"]`)[q.sel];el.classList.add(ok?'good':'bad');});
  T.poly.push({c,t:curViews.length});T.rts.push(rt);if(T.firstTap!=null)T.firsts.push(T.firstTap);
  if(c===curViews.length)T.maxOcc=Math.max(T.maxOcc,occlusionDepth(vox));
  log(`submit · ${c}/${curViews.length} views correct · rt ${rt}ms`);renderMeters();
  $('#submit').classList.remove('ready');phase='between';setTimeout(()=>{si++;si<seq.length?startItem(seq[si]):finish();},1100);}
function startItem(cfg){phase=cfg.warm?'warmup':'scored';vox=cfg.vox.map(v=>({...v}));T.itemStart=Date.now();T.firstTap=null;renderStruct();buildQuestions(cfg.views);renderMeters();setCue(cfg.warm?'\u2b50':'\ud83c\udfaf');
  log(`— ${cfg.warm?'warm-up':'SCORED'}: pick the flat picture for each arrow (⬇️top ➡️front ↘️side) —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');log(`— DONE · views ${T.acc}/${T.asked} —`);}
function rotate(dir){if(phase==='demo'||phase==='done')return;vox=rotZ(vox);if(dir<0){vox=rotZ(rotZ(vox));}T.explore++;renderStruct();log('rotated structure (inspection)');renderMeters();}
async function runDemo(){phase='demo';si=0;vox=STR.warm.map(v=>({...v}));T.itemStart=Date.now();renderStruct();buildQuestions(['top']);
  log('ghost-hand demo (wordless): spin to look, then snap the matching flat view');ghostShow(true);await sleep(300);
  await ghostTo($('#rotR'));vox=rotZ(vox);renderStruct();buildQuestions(['top']);await sleep(300);
  const q=curViews[0];const ci=q.cands.findIndex(c=>gkey(c.g)===q.correctKey);await ghostTo($$(`.cand[data-q="0"]`)[ci]);$$(`.cand[data-q="0"]`)[ci].classList.add('sel');await sleep(300);$$(`.cand[data-q="0"]`)[ci].classList.add('good');await sleep(600);
  ghostShow(false);log('demo done — your turn (warm-up)');
  seq=[{warm:true,vox:STR.warm,views:['top']},{vox:STR.scored,views:['top','front','side']}];startItem(seq[0]);}
$('#questions').addEventListener('click',e=>{const c=e.target.closest('.cand');if(c)selectCand(+c.dataset.q,+c.dataset.c);});
$('#rotL').addEventListener('click',()=>rotate(-1));$('#rotR').addEventListener('click',()=>rotate(1));
$('#submit').addEventListener('click',()=>{if($('#submit').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
