<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CX-delay-01 — The Waiting Game</title>
<style>
  :root{--bg:#101826;--card:#182437;--ink:#eef4ff;--muted:#9fb4d4;--acc:#ffd35c;--good:#7be0a3;}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(circle at 30% 0%,#20304a,#101826)}
  header{padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  .badge{font-size:12px;color:var(--muted);border:1px solid #34486a;padding:2px 8px;border-radius:999px}
  .wrap{display:grid;grid-template-columns:1fr 330px;gap:16px;padding:0 20px 30px;max-width:1100px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .stage{background:var(--card);border-radius:18px;padding:18px;position:relative;min-height:440px;text-align:center}
  .phaseTag{position:absolute;top:12px;right:14px;font-size:12px;color:var(--acc);background:#233047;border:1px solid #4f5f22;padding:3px 10px;border-radius:999px}
  .prompt{color:var(--muted);min-height:22px;margin-bottom:6px}
  .jar{font-size:90px;margin:6px 0;transition:transform .2s}
  .reward{font-size:34px;font-weight:800;color:var(--acc)}
  .growbar{height:16px;background:#0e1626;border:1px solid #34486a;border-radius:999px;max-width:420px;margin:10px auto;overflow:hidden}
  .growbar>div{height:100%;width:0;background:linear-gradient(90deg,#7be0a3,#ffd35c);transition:width .2s}
  .chest{max-width:420px;margin:0 auto;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
  .row{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  button{font:inherit;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;font-weight:700}
  .take{background:var(--good);color:#04331e}
  .fidget{background:#26344d;color:#cfe0ff;font-size:26px;border-radius:50%;width:70px;height:70px;padding:0}
  .prizePick span{font-size:34px;cursor:pointer;margin:0 6px;filter:grayscale(.5);opacity:.7}
  .prizePick span.on{filter:none;opacity:1;transform:scale(1.15)}
  .ghost{position:absolute;font-size:38px;pointer-events:none;z-index:6;transition:left .6s ease,top .6s ease;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}
  .tele{background:#0e1626;border:1px solid #2a3c5a;border-radius:18px;padding:14px;height:fit-content;position:sticky;top:12px}
  .tele h3{margin:0 0 8px;font-size:14px;color:var(--acc);letter-spacing:.5px}
  .metrics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:12px;background:#182437;border:1px solid #34486a;border-radius:8px;padding:4px 8px}
  .chip b{color:var(--acc)}
  .log{font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#bcd0f0;max-height:210px;overflow:auto;background:#0a111d;border-radius:10px;padding:8px}
  .log div{border-bottom:1px solid #16223a;padding:1px 0}
  .note{font-size:11px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>⏳ The Waiting Game</h1>
  <span class="badge">CX-delay-01</span>
  <span class="badge">bands: K–1 · 2–3 · 4–5</span>
  <span class="badge">delay of gratification</span>
</header>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="phaseTag" id="phaseTag">demo</div>
    <div class="prompt" id="prompt">Watch…</div>
    <div class="jar" id="jar">🫙</div>
    <div class="reward" id="reward">＋2</div>
    <div class="growbar"><div id="grow"></div></div>
    <div class="chest"><span>now = small</span><span id="capLabel">wait = BIG 🎁</span></div>
    <div class="row" id="pickRow" style="display:none">
      <div class="prizePick" id="pick">Pick your prize: <span data-p="⭐" class="on">⭐</span><span data-p="🍬">🍬</span><span data-p="🪙">🪙</span></div>
    </div>
    <div class="row" id="controls" style="display:none">
      <button class="take" id="take">Take it now →</button>
      <button class="fidget" id="fidget" title="something to do while you wait">🌀</button>
    </div>
    <div class="ghost" id="ghost" style="display:none">👆</div>
  </div>
  <div class="tele">
    <h3>LIVE TELEMETRY</h3>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="note">M-DELAY (time willingly waited + choice to delay), M-PERSIST, M-PATH (self-distraction with the fidget = a regulation strategy), M-ENGAGE.</div>
  </div>
</div>
<script>
const T={ev:[],m:{},t0:performance.now(),now(){return Math.round(performance.now()-this.t0)},
  log(a,d){const t=this.now();this.ev.push(Object.assign({t,a},d||{}));const el=document.getElementById('log');
    const line=document.createElement('div');line.textContent='+'+(t/1000).toFixed(2)+'s  '+a+(d?'  '+JSON.stringify(d):'');el.prepend(line);},
  set(k,v){this.m[k]=v;this.render();},
  render(){document.getElementById('metrics').innerHTML=Object.entries(this.m).map(([k,v])=>'<span class="chip"><b>'+k+'</b> '+v+'</span>').join('');}};
const $=s=>document.querySelector(s);
const jar=$('#jar'),reward=$('#reward'),grow=$('#grow'),ghost=$('#ghost'),phaseTag=$('#phaseTag');
let prize='⭐',scored=false,waiting=false,waitStart=0,fidget=0,cap=22000,timer=null,cur=2;
T.set('phase','demo');T.set('reward_now',2);T.set('wait_time_M-DELAY','0.0s');T.set('delayed?','–');T.set('fidget_taps_M-PATH',0);

$('#pick').querySelectorAll('span').forEach(s=>s.onclick=()=>{prize=s.dataset.p;
  $('#pick').querySelectorAll('span').forEach(o=>o.classList.remove('on'));s.classList.add('on');
  T.log('prize_chosen',{prize});renderReward();});
function rewardAt(ms){return Math.min(20,2+Math.round(18*Math.min(1,ms/cap)));}
function renderReward(){reward.innerHTML='＋'+cur+' '+prize.repeat(Math.min(6,Math.ceil(cur/4)||1));}
function startWait(isScored){
  scored=isScored;waiting=true;waitStart=performance.now();fidget=0;cur=2;
  $('#controls').style.display='flex';renderReward();
  if(isScored)$('#pickRow').style.display='flex';
  T.log(isScored?'WAIT_START (scored)':'wait_start (warmup)');
  timer=setInterval(()=>{
    const ms=performance.now()-waitStart;cur=rewardAt(ms);
    grow.style.width=Math.min(100,100*ms/cap)+'%';
    jar.style.transform='scale('+(1+Math.min(.4,ms/cap*.4))+')';
    renderReward();
    if(scored)T.set('reward_now',cur),T.set('wait_time_M-DELAY',(ms/1000).toFixed(1)+'s');
    if(ms>=cap){collect('reached_big');}
  },100);
}
$('#take').onclick=()=>{if(waiting)collect('took_early');};
$('#fidget').onclick=()=>{if(!waiting)return;fidget++;$('#fidget').style.transform='rotate('+(fidget*40)+'deg)';
  if(scored){T.set('fidget_taps_M-PATH',fidget);T.log('self_distract_fidget',{n:fidget});}};
function collect(reason){
  clearInterval(timer);waiting=false;const ms=performance.now()-waitStart;
  const delayed=ms>=cap*0.5;
  jar.textContent='🎉';$('#controls').style.display='none';
  if(scored){
    T.set('wait_time_M-DELAY',(ms/1000).toFixed(1)+'s');T.set('delayed?',delayed?'yes':'no');T.set('reward_now',cur);
    T.log('COLLECT',{reason,wait_ms:Math.round(ms),reward:cur,delayed,fidget_taps:fidget});
    finish(ms,delayed);
  }else{
    T.log('warmup_collect',{reason,wait_ms:Math.round(ms)});
    $('#prompt').innerHTML='Good — you tried it! <button class="take" onclick="startItem()">Real one →</button>';
    jar.textContent='🫙';grow.style.width='0';jar.style.transform='';
  }
}

/* ---- flow ---- */
function runGhost(){
  ghost.style.display='block';$('#prompt').textContent='Take now = small…  or wait = BIG!';
  $('#controls').style.display='flex';
  const stage=$('#stage').getBoundingClientRect();
  const R=el=>{const r=el.getBoundingClientRect();return[r.left-stage.left+r.width/2-19,r.top-stage.top+r.height/2-19];};
  // run 1: grab immediately (small)
  cur=2;renderReward();
  let[x,y]=R($('#take'));ghost.style.left=x+'px';ghost.style.top=y+'px';
  setTimeout(()=>{jar.textContent='🙂';reward.innerHTML='＋2 ⭐ (small)';
    setTimeout(()=>{ // run 2: wait for big
      jar.textContent='🫙';reward.innerHTML='＋2';grow.style.width='0';$('#prompt').textContent='…this time, WAIT and watch it grow…';
      let step=0;const iv=setInterval(()=>{step++;grow.style.width=Math.min(100,step*14)+'%';
        cur=Math.min(20,2+step*3);reward.innerHTML='＋'+cur+' ⭐';jar.style.transform='scale('+(1+step*.05)+')';
        ghost.style.top=(R($('#jar'))[1])+'px';ghost.style.left=(R($('#jar'))[0])+'px';
        if(step>=6){clearInterval(iv);jar.textContent='🎉';reward.innerHTML='＋20 ⭐⭐⭐ BIG!';
          setTimeout(()=>{ghost.style.display='none';reset();startWarm();},1100);}},450);
    },900);},900);
}
function reset(){jar.textContent='🫙';jar.style.transform='';grow.style.width='0';reward.innerHTML='＋2';$('#controls').style.display='none';}
function startWarm(){
  scored=false;phaseTag.textContent='warm-up (practice)';reset();
  $('#prompt').textContent='Practice: wait a little, or take it now — your choice.';
  T.set('phase','warm-up');T.log('phase_warmup');
  cap=6000;startWait(false);
}
function startItem(){
  reset();phaseTag.textContent='scored';cap=22000;
  $('#prompt').innerHTML='<b>Now for real:</b> take the small prize now, or wait for it to grow BIG. You can grab it anytime.';
  T.set('phase','scored');T.set('delayed?','–');T.set('fidget_taps_M-PATH',0);T.log('phase_scored');
  startWait(true);
}
function finish(ms,delayed){
  phaseTag.textContent='done';
  $('#prompt').innerHTML='<b style="color:var(--acc);font-size:19px">All done! 🏆</b>'+
    '<div class="note">Waited '+(ms/1000).toFixed(1)+'s ('+(delayed?'chose to delay for the bigger prize':'took the sooner prize')+
    '), used the fidget '+fidget+'× to self-distract. Willingly waiting for a larger-later reward is a self-control signal that predicts achievement independently of IQ — and shows the most variance in the youngest children, where reasoning tests are least reliable.</div>';
  $('#pickRow').style.display='none';
  $('#stage').insertAdjacentHTML('beforeend','<div class="row"><button class="take" onclick="location.reload()">↺ Play again</button></div>');
  T.set('phase','done');
}
window.addEventListener('blur',()=>T.log('off_task_blur (M-ENGAGE)'));
runGhost();
</script>
</body>
</html>
