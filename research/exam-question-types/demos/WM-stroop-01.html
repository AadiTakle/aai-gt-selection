<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-stroop-01 — Opposite World (Stroop / day-night)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #stage{width:420px;height:210px;background:var(--panel);border:1px solid var(--edge);border-radius:20px;display:flex;align-items:center;justify-content:center;gap:40px;position:relative}
  #stim{font-size:120px;opacity:0;transition:opacity .1s,transform .1s;transform:scale(.7)}
  #stim.show{opacity:1;transform:scale(1)}
  .word{font-weight:800;letter-spacing:2px}
  .numpair{display:flex;gap:60px;align-items:center;opacity:0;transition:opacity .1s}
  .numpair.show{opacity:1}
  .numpair span{font-weight:800;line-height:1}
  #cue{font-size:26px;height:32px}
  .ans{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .ans button{font-size:26px;min-width:96px;height:66px;border-radius:16px;border:2px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer;font-weight:600}
  .ans button:active{transform:scale(.96)}
  .ans .sw{width:80px;height:66px}
  .ans button.flash{outline:4px solid var(--good)}
  .ans button.wrong{outline:4px solid var(--bad)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.ctl{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:7px 12px;background:#182042}
  .seg button.on{background:var(--warn);color:#3a2c00;font-weight:600}
  .tel{width:315px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🌗 Opposite World <span class="badge" id="bmode">Day / Night</span></h1>
    <p class="sub" id="task">See the <b>sun ☀️</b> → tap <b>night 🌙</b>. See the <b>moon 🌙</b> → tap <b>day ☀️</b>. Always the opposite!</p>
  </div>
  <div id="stage"><div id="stim"></div></div>
  <div id="cue">👀</div>
  <div class="ans" id="ans"></div>
  <div class="row">
    <div class="seg" id="modeseg">
      <button data-m="dn" class="on">Day / Night</button>
      <button data-m="ink">Ink color</button>
      <button data-m="num">Bigger number</button>
    </div>
  </div>
  <div class="row">
    <button class="pri ctl" id="go">▶ Watch how it works</button>
    <button class="ctl" id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>

<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const stage=$("#stage"),stim=$("#stim"),cue=$("#cue"),ansEl=$("#ans");
let mode="dn";
const COLORS=[{k:"red",c:"#ff5b6e"},{k:"blue",c:"#4a9bff"},{k:"green",c:"#4ade80"},{k:"yellow",c:"#ffd166"}];
const T={phase:"idle",mode:"dn",trial:0,
  rt:{cong:[],incong:[]},acc:{cong:[0,0],incong:[0,0]},
  lapses:0,capture:0,other:0,postErrRT:[],baseRT:[],lastErr:false,log:[]};
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function med(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m;}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop();}
function accPct(p){return p[1]?Math.round(100*p[0]/p[1]):0;}
function render(){
  const eff=Math.round(med(T.rt.incong)-med(T.rt.cong));
  const allRT=[...T.rt.cong,...T.rt.incong];
  const pes=Math.round(mean(T.postErrRT)-mean(T.baseRT))||0;
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-stroop-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>shell</span><b>${({dn:"day/night",ink:"ink color",num:"numeric magnitude"})[T.mode]}</b></div>
  <div class="kv"><span>trials</span><b>${T.trial}</b></div>
  <h2>RT by congruency <span class="m">M-RT</span></h2>
  <div class="kv"><span>congruent</span><b>${T.mode==="dn"?"n/a":Math.round(med(T.rt.cong))+" ms"}</b></div>
  <div class="kv"><span>incongruent</span><b>${Math.round(med(T.rt.incong))} ms</b></div>
  <div class="kv"><span>Stroop effect <span class="m">M-CONGEFF</span></span><b>${T.mode==="dn"?"—":(isNaN(eff)?0:eff)+" ms"}</b></div>
  <h2>Accuracy <span class="m">M-ACC</span></h2>
  <div class="kv"><span>congruent</span><b>${T.mode==="dn"?"n/a":accPct(T.acc.cong)+"%"}</b></div>
  <div class="kv"><span>incongruent</span><b>${accPct(T.acc.incong)}%</b></div>
  <h2>Error type <span class="m">M-ERRTYPE</span></h2>
  <div class="kv"><span>capture (read/prepotent)</span><b>${T.capture}</b></div>
  <div class="kv"><span>other errors</span><b>${T.other}</b></div>
  <h2>Consistency</h2>
  <div class="kv"><span>RT variability CV <span class="m">M-RTVAR</span></span><b>${cv(allRT).toFixed(2)}</b></div>
  <div class="kv"><span>lapses(&gt;1.2s) <span class="m">M-LAPSE</span></span><b>${T.lapses}</b></div>
  <div class="kv"><span>post-error slowing <span class="m">M-POSTERR</span></span><b>${pes>0?"+":""}${pes} ms</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();

function rand(a){return a[Math.random()*a.length|0];}
function buildButtons(){
  ansEl.innerHTML="";
  if(mode==="dn"){
    [["day","☀️"],["night","🌙"]].forEach(([k,e])=>{const b=document.createElement("button");b.dataset.a=k;b.textContent=e+" "+k;ansEl.appendChild(b);});
  } else if(mode==="ink"){
    COLORS.forEach(c=>{const b=document.createElement("button");b.className="sw";b.dataset.a=c.k;b.style.background=c.c;ansEl.appendChild(b);});
  } else {
    [["L","◀"],["R","▶"]].forEach(([k,e])=>{const b=document.createElement("button");b.dataset.a=k;b.textContent=(k==="L"?"◀ left":"right ▶");ansEl.appendChild(b);});
  }
}
// build a trial => {render stimulus, correct, cong, prepotentAnswer}
function makeTrial(){
  if(mode==="dn"){
    const s=Math.random()<.5?"sun":"moon";
    stim.className="";stim.textContent=s==="sun"?"☀️":"🌙";
    return {correct:s==="sun"?"night":"day",prepotent:s==="sun"?"day":"night",cong:null};
  } else if(mode==="ink"){
    const word=rand(COLORS),ink=Math.random()<.4?word:rand(COLORS.filter(c=>c!==word));
    stim.className="word";stim.textContent=word.k.toUpperCase();stim.style.color=ink.c;
    return {correct:ink.k,prepotent:word.k,cong:word===ink};
  } else {
    let a,b;do{a=1+(Math.random()*9|0);b=1+(Math.random()*9|0);}while(a===b);
    const bigNum=a>b?"L":"R"; // left is a
    const cong=Math.random()<.45;
    // physical sizes: congruent => numerically bigger is physically bigger
    let szA,szB;const big="86px",small="46px";
    if(cong){szA=a>b?big:small;szB=b>a?big:small;} else {szA=a>b?small:big;szB=b>a?small:big;}
    stim.className="numpair";stim.innerHTML=`<span style="font-size:${szA}">${a}</span><span style="font-size:${szB}">${b}</span>`;
    return {correct:bigNum,prepotent:(parseFloat(szA)>parseFloat(szB)?"L":"R"),cong};
  }
}

let cur=null;
ansEl.addEventListener("pointerdown",e=>{const b=e.target.closest("button");if(!b||!cur||cur.done)return;
  cur.done=true;cur.rt=performance.now()-cur.onset;cur.resp=b.dataset.a;cur.ok=b.dataset.a===cur.spec.correct;
  b.classList.add(cur.ok?"flash":"wrong");setTimeout(()=>b.classList.remove("flash","wrong"),200);cur.resolve&&cur.resolve();});

async function trial(scored){
  const spec=makeTrial();
  cue.textContent="";await sleep(300);
  (mode==="num"?stim:stim).classList.add("show");
  cur={spec,onset:performance.now(),done:false,resolve:null};
  await new Promise(res=>{cur.resolve=res;setTimeout(()=>{if(!cur.done){cur.done=true;cur.timeout=true;res();}},3000);});
  stim.classList.remove("show");
  if(scored){
    T.trial++;
    if(cur.timeout){cue.textContent="🐢";T.lastErr=true;logE("too slow");}
    else{
      const key=spec.cong===false?"incong":(spec.cong===true?"cong":"incong"); // day/night counts as incongruent
      T.acc[key][1]++;
      if(cur.ok){T.acc[key][0]++;T.rt[key].push(cur.rt);if(cur.rt>1200)T.lapses++;(T.lastErr?T.postErrRT:T.baseRT).push(cur.rt);cue.textContent="✅";}
      else{ if(cur.resp===spec.prepotent)T.capture++;else T.other++; cue.textContent="❌"; }
      T.lastErr=!cur.ok;
      logE(`${key}: ${cur.resp}=${cur.ok?"ok":(cur.resp===spec.prepotent?"CAPTURE":"err")} ${Math.round(cur.rt)}ms`);
    }
  }
  render();await sleep(520);cue.textContent="";
}
async function runBlock(scored,len){for(let i=0;i<len;i++)await trial(scored);}

// ghost-hand demo (day/night): show sun -> tap NIGHT
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;$("#replay").disabled=true;
  const sm=mode;mode="dn";buildButtons();
  stim.className="";stim.textContent="☀️";stim.classList.add("show");
  const ghost=document.createElement("div");ghost.textContent="👆";ghost.style.cssText="position:fixed;font-size:30px;z-index:9;transition:left .45s,top .45s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  const nightBtn=[...ansEl.children].find(b=>b.dataset.a==="night");const r=nightBtn.getBoundingClientRect();
  await sleep(650);ghost.style.opacity="1";ghost.style.left=(r.left+r.width/2-12)+"px";ghost.style.top=(r.top+8)+"px";
  await sleep(550);nightBtn.classList.add("flash");cue.textContent="✅";await sleep(280);nightBtn.classList.remove("flash");
  stim.classList.remove("show");await sleep(400);ghost.remove();
  mode=sm;buildButtons();
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice one";$("#go").onclick=warmup;
  $("#phasehint").textContent="Do the OPPOSITE. Practice one (not scored).";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;

async function warmup(){T.phase="warm-up (unscored)";render();$("#go").disabled=true;$("#replay").disabled=true;
  await runBlock(false,4);T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Start scored game";$("#go").onclick=startScored;
  $("#phasehint").textContent="These count. Fight the urge to do the obvious thing.";render();}
async function startScored(){T.phase="scored";render();$("#go").disabled=true;$("#replay").disabled=true;
  await runBlock(true,14);
  T.phase="done";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Play again";$("#go").onclick=startScored;
  const eff=Math.round(med(T.rt.incong)-med(T.rt.cong));
  $("#phasehint").textContent=`Done. ${mode==="dn"?"Capture errors ("+T.capture+") reveal weak inhibition":"Stroop effect = "+(isNaN(eff)?0:eff)+"ms (smaller = better)"}. Capture-error count is a purer inhibition index than speed.`;
  cue.textContent="🏁";render();}

$("#modeseg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  mode=b.dataset.m;T.mode=mode;[...$("#modeseg").children].forEach(x=>x.classList.toggle("on",x===b));buildButtons();
  $("#bmode").textContent=({dn:"Day / Night",ink:"Ink color",num:"Bigger number"})[mode];
  $("#task").innerHTML=({dn:"See the <b>sun ☀️</b> → tap <b>night 🌙</b>. See the <b>moon 🌙</b> → tap <b>day ☀️</b>. Always the opposite!",
    ink:"Tap the <b>color of the INK</b> — not the word that's written. (e.g., the word RED shown in blue → tap blue.)",
    num:"Tap the digit that is the <b>bigger NUMBER</b> — ignore how big the digits look."})[mode];
  logE(`shell → ${mode}`);render();});
buildButtons();
</script>
</body>
</html>
