<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUANT-PROPORTION-01 — Ratio Mixer</title>
<style>
:root{--bg:#0f1226;--panel:#1b2140;--panel2:#232a52;--accent:#5eead4;--accent2:#f59e0b;--good:#4ade80;--bad:#f87171;--ink:#eef1ff;--muted:#9aa3c7}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(1100px 700px at 40% -10%,#3a1d40,#0f1226 60%);min-height:100vh}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1120px;margin:0 auto;padding:18px}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid #313a6b;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.phasebar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#2b336a;color:var(--muted);border:1px solid #3a447f}
.pill.on{background:var(--accent);color:#053;font-weight:700}
.prompt{text-align:center;color:var(--muted);min-height:22px;margin-bottom:8px}
.glasses{display:flex;gap:30px;justify-content:center;align-items:flex-end;margin:6px 0}
.gl{display:flex;flex-direction:column;align-items:center;gap:4px}
.glass{width:96px;height:150px;border:3px solid #8ea0ff;border-top:0;border-radius:0 0 26px 26px;position:relative;overflow:hidden;background:#12172f}
.liquid{position:absolute;left:0;right:0;bottom:0;height:78%;transition:background .35s}
.glab{font-size:13px;color:var(--muted)}
.scoops{font-size:14px;font-weight:800}
.meterwrap{max-width:320px;margin:8px auto 0}
.meter{height:16px;border-radius:8px;background:#2b336a;overflow:hidden;border:1px solid #3a447f}
.meterfill{height:100%;width:0;background:linear-gradient(90deg,#f87171,#f59e0b,#4ade80);transition:width .3s}
.meterlab{text-align:center;font-size:12px;color:var(--muted);margin-top:4px}
.controls{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap}
.step{width:52px;height:48px;border-radius:12px;background:#2b336a;border:2px solid #3a447f;color:var(--ink);font-size:24px;font-weight:800;cursor:pointer}
.step:hover{border-color:var(--accent)}
.bval{font-size:26px;font-weight:800;min-width:70px;text-align:center}
.buy{display:flex;gap:20px;justify-content:center;margin:10px 0}
.buycard{width:180px;border-radius:14px;background:#2b336a;border:2px solid #3a447f;padding:14px;text-align:center;cursor:pointer}
.buycard:hover{border-color:var(--accent)}
.buycard.win{border-color:var(--good)}.buycard.lose{border-color:var(--bad)}
.buycard .apples{font-size:24px;min-height:30px}.buycard .price{font-size:22px;font-weight:800;margin-top:6px}
.buycard .unit{font-size:12px;color:var(--muted);min-height:16px}
.row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
button.act{font:600 15px system-ui;padding:10px 18px;border-radius:12px;border:0;cursor:pointer;background:var(--accent);color:#053}
button.act.ghost{background:#2b336a;color:var(--ink);border:1px solid #3a447f}
button.act:disabled{opacity:.4}
.fb{text-align:center;font-weight:700;min-height:24px;margin-top:8px}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.hand{position:fixed;font-size:32px;z-index:40;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:left .4s ease,top .4s ease}
.tele{font-size:13px}.tele h2{font-size:14px;margin:0 0 8px;color:var(--accent)}
.metrics{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-bottom:10px}
.metrics div:nth-child(odd){color:var(--muted)}.metrics b{font-variant-numeric:tabular-nums}
.log{height:180px;overflow:auto;background:#12172f;border:1px solid #2a336a;border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-acc{color:var(--good)}.t-err{color:var(--bad)}.t-sys{color:var(--muted)}.t-evt{color:#9fb0ff}
.legend{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <h1>Ratio Mixer</h1>
    <div class="sub">Match the target color by keeping the SAME ratio — or pick the better buy.</div>
    <div class="phasebar" id="phasebar"></div>
    <div class="prompt" id="prompt"></div>
    <div id="mixArea">
      <div class="glasses">
        <div class="gl"><div class="glass"><div class="liquid" id="tLiq"></div></div><div class="glab">target</div><div class="scoops" id="tScoops"></div></div>
        <div class="gl"><div class="glass"><div class="liquid" id="cLiq"></div></div><div class="glab">yours</div><div class="scoops" id="cScoops"></div></div>
      </div>
      <div class="meterwrap" id="meterwrap"><div class="meter"><div class="meterfill" id="meterfill"></div></div><div class="meterlab" id="meterlab">color match</div></div>
      <div class="controls">
        <span style="color:var(--muted);font-size:13px">blue scoops</span>
        <button class="step" id="minus">&#8722;</button><div class="bval" id="bval">0</div><button class="step" id="plus">&#43;</button>
      </div>
    </div>
    <div class="buy" id="buyArea" style="display:none"></div>
    <div class="row">
      <button class="act" id="serveBtn">Serve it</button>
      <button class="act ghost" id="nextBtn" style="display:none">Next</button>
    </div>
    <div class="fb" id="fb"></div>
    <div class="hand" id="hand">&#128070;</div>
  </main>
  <aside class="card tele">
    <h2>Live telemetry</h2>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="legend">Logs M-ACC, M-EFF, M-REV, M-PROG and proposed <b>M-PROPSTRAT</b> (multiplicative vs additive).</div>
  </aside>
</div>
<script>
(function(){
  "use strict";
  var el=function(id){return document.getElementById(id)};
  var tLiq=el('tLiq'),cLiq=el('cLiq'),tScoops=el('tScoops'),cScoops=el('cScoops'),
      meterfill=el('meterfill'),meterlab=el('meterlab'),meterwrap=el('meterwrap'),
      minus=el('minus'),plus=el('plus'),bval=el('bval'),serveBtn=el('serveBtn'),nextBtn=el('nextBtn'),
      mixArea=el('mixArea'),buyArea=el('buyArea'),fb=el('fb'),hand=el('hand'),prompt=el('prompt');
  var T0=Date.now();function perf(){return Date.now()-T0;}

  var Tel={scored:0,correct:0,effSum:0,effN:0,revTotal:0,strat:{multiplicative:0,additive:0,other:0},
    push:function(cls,msg){var d=document.createElement('div');d.className=cls;d.textContent='['+(perf()/1000).toFixed(2)+'s] '+msg;
      var g=el('log');g.appendChild(d);g.scrollTop=g.scrollHeight;},
    render:function(){
      var acc=Tel.scored?Math.round(100*Tel.correct/Tel.scored)+'% ('+Tel.correct+'/'+Tel.scored+')':'—';
      var eff=Tel.effN?Math.round(100*Tel.effSum/Tel.effN)+'%':'—';
      var s=Tel.strat.multiplicative+Tel.strat.additive+Tel.strat.other;
      var sStr=s?('mult '+Tel.strat.multiplicative+' / add '+Tel.strat.additive+' / oth '+Tel.strat.other):'—';
      el('metrics').innerHTML=
        '<div>M-ACC accuracy</div><b>'+acc+'</b>'+
        '<div>M-EFF vs optimal</div><b>'+eff+'</b>'+
        '<div>M-REV dir-changes</div><b>'+Tel.revTotal+'</b>'+
        '<div>M-PROPSTRAT</div><b style="font-size:11px">'+sStr+'</b>';
    }};

  var items=[
    {phase:'demo',kind:'mix',tR:1,tB:1,redFixed:2,startB:0,correctB:2,meter:true},
    {phase:'warmup',kind:'mix',tR:1,tB:1,redFixed:1,startB:0,correctB:1,meter:true},
    {phase:'scored',kind:'mix',tR:1,tB:2,redFixed:3,startB:0,correctB:6,addFoil:4,meter:true},
    {phase:'scored',kind:'buy',a:{n:2,cost:6},b:{n:5,cost:10},better:'b'},
    {phase:'scored',kind:'mix',tR:2,tB:3,redFixed:4,startB:0,correctB:6,addFoil:5,meter:false}
  ];
  var labels={demo:'1 Watch',warmup:'2 Try',scored:'3 Mix'};
  var i=-1,cur=null,B=0,itemStart=0,answered=false,adjustCount=0,lastDir=0,dirChanges=0,startCloseness=0,lastCloseness=0;

  function renderPhasebar(){el('phasebar').innerHTML=['demo','warmup','scored'].map(function(p){
    return '<span class="pill'+(cur&&cur.phase===p?' on':'')+'">'+labels[p]+'</span>';}).join('');}

  function mixColor(red,blue){var f=(red+blue)===0?0:blue/(red+blue);
    var r=Math.round(239+(59-239)*f),g=Math.round(68+(130-68)*f),b=Math.round(68+(246-68)*f);
    return 'rgb('+r+','+g+','+b+')';}
  function closeness(){var tr=cur.tB/cur.tR, crr=cur.redFixed===0?0:B/cur.redFixed;
    if(tr===0)return 0; return Math.max(0,1-Math.min(1,Math.abs(crr-tr)/tr));}

  function drawMix(){
    tLiq.style.background=mixColor(cur.tR,cur.tB); tScoops.textContent=cur.tR+' red : '+cur.tB+' blue';
    cLiq.style.background=mixColor(cur.redFixed,B); cScoops.textContent=cur.redFixed+' red : '+B+' blue';
    bval.textContent=B;
    if(cur.meter){var c=closeness();meterfill.style.width=Math.round(c*100)+'%';
      meterlab.textContent=c>=0.999?'perfect match!':'color match '+Math.round(c*100)+'%';}
  }

  function adjust(d){
    if(answered||cur.phase==='demo')return;
    var nB=Math.max(0,Math.min(12,B+d)); if(nB===B)return;
    B=nB; adjustCount++;
    if(d!==lastDir&&lastDir!==0){dirChanges++;Tel.revTotal++;} lastDir=d;
    drawMix();
    var c=cur.meter?closeness():null; if(c!=null)lastCloseness=c;
    Tel.push('t-evt','blue='+B+(c!=null?'  match='+Math.round(c*100)+'%':'')); 
  }
  minus.onclick=function(){adjust(-1);};plus.onclick=function(){adjust(1);};

  function classifyStrat(){
    if(B===cur.correctB)return 'multiplicative';
    if(cur.addFoil!=null&&B===cur.addFoil)return 'additive';
    return 'other';
  }

  serveBtn.onclick=function(){ if(answered||cur.phase==='demo')return; if(cur.kind==='mix')commitMix(); };

  function commitMix(){
    answered=true;
    var ok=(B===cur.correctB);
    var need=Math.abs(cur.correctB-cur.startB), used=adjustCount, eff=used>0?Math.min(1,need/used):(ok?1:0);
    var strat=classifyStrat();
    if(cur.phase==='scored'){
      Tel.scored++; if(ok){Tel.correct++;Tel.effSum+=eff;Tel.effN++;}
      Tel.strat[strat]++;
      Tel.push(ok?'t-acc':'t-err','SERVE blue='+B+(ok?' MATCH':' off (need '+cur.correctB+')')+
        '  EFF='+Math.round(eff*100)+'% adj='+adjustCount+' PROPSTRAT='+strat+(cur.meter?'':' [blind]'));
      if(ok)chime();
    } else { Tel.push('t-sys',cur.phase.toUpperCase()+': blue='+B+(ok?' match':' off')+' — not scored'); }
    if(!cur.meter){meterwrap.style.display='block';meterfill.style.width=Math.round(closeness()*100)+'%';meterlab.textContent='(revealed) match '+Math.round(closeness()*100)+'%';}
    fb.textContent= ok?(cur.phase==='warmup'?'Same color! Now the real mixes.':'Perfect ratio match!'):'Colors differ — ratio was off.';
    fb.className='fb '+(ok?'good':'bad');
    serveBtn.disabled=true; nextBtn.style.display='inline-block'; Tel.render();
  }

  function buildBuy(){
    buyArea.innerHTML='';
    [['a',cur.a],['b',cur.b]].forEach(function(pair){
      var key=pair[0],o=pair[1];
      var c=document.createElement('div');c.className='buycard';c.id='card_'+key;
      var apples='';for(var k=0;k<o.n;k++)apples+='\uD83C\uDF4E';
      c.innerHTML='<div class="apples">'+apples+'</div><div class="price">$'+o.cost+'</div><div class="unit" id="unit_'+key+'"></div>';
      c.onclick=function(){ if(answered)return; chooseBuy(key); };
      buyArea.appendChild(c);
    });
  }
  function chooseBuy(key){
    answered=true;
    var ok=(key===cur.better);
    Tel.scored++; if(ok)Tel.correct++;
    el('unit_a').textContent='$'+(cur.a.cost/cur.a.n).toFixed(2)+' each';
    el('unit_b').textContent='$'+(cur.b.cost/cur.b.n).toFixed(2)+' each';
    el('card_'+cur.better).classList.add('win'); if(!ok)el('card_'+key).classList.add('lose');
    Tel.push(ok?'t-acc':'t-err','BEST-BUY chose '+key+(ok?' OK':' WRONG(better='+cur.better+')')+'  (unit rates shown)');
    if(ok)chime();
    fb.textContent= ok?'Best value!':'The other was cheaper per item.';
    fb.className='fb '+(ok?'good':'bad');
    nextBtn.style.display='inline-block'; Tel.render();
  }

  nextBtn.onclick=function(){serveBtn.disabled=false;load();};

  function load(){
    i++; if(i>=items.length)return finish();
    cur=items[i]; answered=false; B=(cur.startB||0); adjustCount=0; lastDir=0; dirChanges=0;
    fb.textContent='';fb.className='fb'; nextBtn.style.display='none';
    renderPhasebar();
    if(cur.kind==='mix'){
      mixArea.style.display='block'; buyArea.style.display='none'; serveBtn.style.display='inline-block';
      document.querySelector('.controls').style.visibility = cur.phase==='demo'?'hidden':'visible';
      meterwrap.style.display = cur.meter?'block':'none';
      prompt.textContent = cur.phase==='demo'?'Watch: add blue until the colors match.':
        (cur.meter?'Add blue scoops so your glass matches the target color.':'No meter this time — reason out the ratio, then serve.');
      startCloseness=closeness(); drawMix();
      itemStart=perf();
      Tel.push('t-sys','LOAD '+cur.phase+' mix target '+cur.tR+':'+cur.tB+' redFixed='+cur.redFixed+' correctB='+cur.correctB+(cur.meter?'':' [blind]'));
    } else {
      mixArea.style.display='none'; buyArea.style.display='flex'; serveBtn.style.display='none';
      prompt.textContent='Which is the better buy (more for your money)?';
      buildBuy(); itemStart=perf();
      Tel.push('t-sys','LOAD '+cur.phase+' best-buy A('+cur.a.n+'/$'+cur.a.cost+') vs B('+cur.b.n+'/$'+cur.b.cost+')');
    }
    Tel.render();
    if(cur.phase==='demo')ghost();
  }

  function ghost(){
    var steps=cur.correctB;var t=500;hand.style.opacity='0';
    for(var k=1;k<=steps;k++){(function(k){setTimeout(function(){
      var r=plus.getBoundingClientRect();hand.style.opacity='1';hand.style.left=(r.left+r.width/2-10)+'px';hand.style.top=(r.top+r.height/2)+'px';
      setTimeout(function(){B=k;drawMix();Tel.push('t-sys','ghost: +blue (blue='+B+', match '+Math.round(closeness()*100)+'%)');},170);
    },t+k*650);})(k);}
    var end=t+steps*650+400;
    setTimeout(function(){var r=serveBtn.getBoundingClientRect();hand.style.left=(r.left+r.width/2-10)+'px';hand.style.top=(r.top+r.height/2)+'px';},end);
    setTimeout(function(){chime();fb.textContent='Colors match!';fb.className='fb good';Tel.push('t-sys','ghost: serve (match)');},end+500);
    setTimeout(function(){hand.style.opacity='0';fb.textContent='';load();},end+1500);
  }
  function chime(){try{var a=new(window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(560,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(840,a.currentTime+.15);g.gain.setValueAtTime(.1,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.3);o.start();o.stop(a.currentTime+.32);}catch(e){}}

  function finish(){
    prompt.textContent='';mixArea.style.display='none';buyArea.style.display='none';serveBtn.style.display='none';fb.textContent='';
    document.querySelector('#mixArea').style.display='none';
    var host=document.querySelector('.prompt');
    host.innerHTML='';
    var box=document.createElement('div');box.style.textAlign='center';box.style.padding='24px';
    box.innerHTML='<div style="font-size:44px">\uD83E\uDDEA</div><div style="color:var(--muted)">Mixed! PROPSTRAT shows multiplicative vs additive reasoning.</div>';
    host.appendChild(box);
    Tel.push('t-sys','SESSION complete: '+Tel.correct+'/'+Tel.scored+' — strat mult '+Tel.strat.multiplicative+' add '+Tel.strat.additive);
  }
  window.addEventListener('blur',function(){Tel.push('t-sys','engagement: focus lost');});
  Tel.render(); load();
})();
</script>
</body>
</html>
