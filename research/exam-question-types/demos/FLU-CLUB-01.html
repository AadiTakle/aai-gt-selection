<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-CLUB-01 · Join the Club</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;--socket:#c9d3ef;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:20px;max-width:600px;width:100%}
  .club{display:flex;gap:12px;align-items:center;background:linear-gradient(160deg,#fff4e6,#ffe9f2);border:3px solid #ffd6a8;border-radius:18px;padding:14px}
  .club .cell{width:82px;height:82px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .club .slot{border:3px dashed var(--socket);background:repeating-linear-gradient(45deg,#fff,#fff 8px,#fdeede 8px,#fdeede 16px)}
  .club .slot.filled-anim{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}
  .club.accept{box-shadow:0 0 0 5px #b4ecd0}
  #tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .opt{background:#fff;border:3px solid #e2e8fb;border-radius:14px;width:86px;height:86px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
  .opt:hover{transform:translateY(-3px);border-color:#c3ccf5}
  .opt.sel{border-color:var(--accent);box-shadow:0 0 0 4px #c9d0ff;transform:translateY(-3px)}
  .opt.correct{border-color:var(--good);box-shadow:0 0 0 4px #b4ecd0}
  .opt.wrong{border-color:var(--bad);box-shadow:0 0 0 4px #ffd0d0}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:76px;height:76px;background:var(--accent);color:#fff;font-size:32px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:52px;height:52px;background:#eef1ff;color:#5b6cff;font-size:24px}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;transition:transform .7s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}
  @keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mid.prop{color:#ffd479}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:210px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-CLUB-01 · Join the Club</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="club" class="club"></div>
      <div id="tray"></div>
      <div id="controls">
        <button id="replay" title="replay demo">↻</button>
        <button id="go" title="submit">✓</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length),last=a=>a[a.length-1];
const PAL={red:'#e6194b',green:'#2ca25f',blue:'#4363d8',orange:'#f58231',purple:'#911eb4'};
const COLORKEYS=Object.keys(PAL),SH=['circle','square','triangle','diamond','star','hexagon'];
const VALS={shape:SH,color:COLORKEYS};
function polyPts(cx,cy,r,n,rot){let p=[];for(let i=0;i<n;i++){let a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function starPts(cx,cy,r,n){let p=[];for(let i=0;i<2*n;i++){let rr=i%2?r*0.45:r;let a=-Math.PI/2+i*Math.PI/n;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(' ');}
function oneShape(shape,color,cx,cy,r){const f='fill="'+color+'"';switch(shape){
  case 'circle':return `<circle cx="${cx}" cy="${cy}" r="${r}" ${f}/>`;
  case 'square':return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="3" ${f}/>`;
  case 'triangle':return `<polygon points="${polyPts(cx,cy,r,3,-Math.PI/2)}" ${f}/>`;
  case 'diamond':return `<polygon points="${polyPts(cx,cy,r,4,-Math.PI/2)}" ${f}/>`;
  case 'hexagon':return `<polygon points="${polyPts(cx,cy,r,6,-Math.PI/2)}" ${f}/>`;
  case 'star':return `<polygon points="${starPts(cx,cy,r,5)}" ${f}/>`;}return '';}
function tileSVG(a,box=80){const color=PAL[a.color]||a.color,n=a.count||1;let inner='';
  if(n===1)inner=oneShape(a.shape,color,box/2,box/2,box*0.30);
  else{const pos=n===2?[[.3,.5],[.7,.5]]:n===3?[[.24,.5],[.5,.5],[.76,.5]]:[[.3,.3],[.7,.3],[.3,.7],[.7,.7]];
    const r=box*(n>=4?.13:.15);pos.slice(0,n).forEach(p=>inner+=oneShape(a.shape,color,p[0]*box,p[1]*box,r));}
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${inner}</svg>`;}
function sceneSVG(s,box=80){const cx=box/2,cy=box/2;return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">`
  +`<circle cx="${cx}" cy="${cy}" r="28" fill="none" stroke="#4363d8" stroke-width="4"/>`
  +`<rect x="6" y="55" width="${box-12}" height="6" rx="3" fill="#f58231"/>`
  +`<circle cx="${s.x}" cy="${s.y}" r="7" fill="#e6194b"/></svg>`;}
function inRing(x,y){return (x-40)*(x-40)+(y-40)*(y-40)<24*24;}
function above(y){return y<50;}
function sampleDot(wIn,wAbove){for(let k=0;k<500;k++){const x=10+Math.random()*60,y=10+Math.random()*60;if(inRing(x,y)===wIn&&above(y)===wAbove)return{x:Math.round(x),y:Math.round(y)};}return{x:40,y:wAbove?26:66};}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function randFig(){return{shape:SH[(Math.random()*SH.length)|0],color:COLORKEYS[(Math.random()*COLORKEYS.length)|0],count:1+((Math.random()*3)|0)};}
function otherVal(attr,not){const c=VALS[attr].filter(x=>x!==not);return c[(Math.random()*c.length)|0];}
function payloadSVG(kind,p){return kind==='scene'?sceneSVG(p):tileSVG(p);}

/* ---------- club generators (AIG) ---------- */
function genSingle(forceC){const C=forceC||['shape','color'][(Math.random()*2)|0];const v=shuffle(VALS[C])[0];
  const members=[];for(let i=0;i<3;i++){const f=randFig();f[C]=v;members.push(f);}
  const correct=randFig();correct[C]=v;const trap=['shape','color'].find(a=>a!==C);
  const opts=[{payload:correct,tag:'correct'}];
  const d1=randFig();d1[C]=otherVal(C,v);d1[trap]=members[0][trap];opts.push({payload:d1,tag:'trap:matched-'+trap});
  const d2=randFig();d2[C]=otherVal(C,v);opts.push({payload:d2,tag:'random'});
  const d3=randFig();d3[C]=otherVal(C,v);opts.push({payload:d3,tag:'random'});
  return {kind:'tile',members,options:shuffle(opts),rule:'share '+C};}
function genDual(){const v1=shuffle(SH)[0],v2=shuffle(COLORKEYS)[0];
  const members=[];for(let i=0;i<3;i++)members.push({shape:v1,color:v2,count:1+((Math.random()*3)|0)});
  const opts=[{payload:{shape:v1,color:v2,count:1+((Math.random()*3)|0)},tag:'correct'},
   {payload:{shape:v1,color:otherVal('color',v2),count:1+((Math.random()*3)|0)},tag:'partial:only-shape'},
   {payload:{shape:otherVal('shape',v1),color:v2,count:1+((Math.random()*3)|0)},tag:'partial:only-color'},
   {payload:{shape:otherVal('shape',v1),color:otherVal('color',v2),count:1+((Math.random()*3)|0)},tag:'random'}];
  return {kind:'tile',members,options:shuffle(opts),rule:'share shape AND color'};}
function genSpatial(){const members=[sampleDot(true,true),sampleDot(true,true),sampleDot(true,true)];
  const opts=[{payload:sampleDot(true,true),tag:'correct'},{payload:sampleDot(true,false),tag:'partial:not-above'},
   {payload:sampleDot(false,true),tag:'partial:not-inside'},{payload:sampleDot(false,false),tag:'random'}];
  return {kind:'scene',members,options:shuffle(opts),rule:'dot inside ring AND above bar'};}
function errType(tag){if(tag==='correct')return 'none';const d=tag.split(':')[1];
  if(tag.indexOf('partial:')===0)return 'near-miss ('+d+')';if(tag.indexOf('trap:')===0)return 'near-miss ('+d+')';return 'random';}

/* ---------- telemetry ---------- */
const T={scored:0,correct:0,rts:[],firstLat:null,lastErr:'\u2014',itemStart:0,firstActed:false,explored:new Set(),nOpt:4};
const METERS=[
 {id:'M-ACC',name:'Item accuracy (running)',get:()=>T.scored?`${T.correct}/${T.scored}  ${Math.round(100*T.correct/T.scored)}%`:'\u2014'},
 {id:'M-RT',name:'Response time — total',get:()=>T.rts.length?`${last(T.rts)} ms  (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-EXPLORE',name:'Exploration (options inspected)',get:()=>`${T.explored.size}/${T.nOpt} options`},
 {id:'M-RTFIRST',name:'First-action latency (rule induction)',get:()=>T.firstLat==null?'\u2014':T.firstLat+' ms'},
 {id:'M-ERRTYPE',name:'Error type (which attribute matched)',get:()=>T.lastErr},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(680);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(480);}

/* ---------- flow ---------- */
let phase='demo',cur=null,staged=-1,locked=false,scoredIndex=0;
const scoredItems=[genDual(),genSpatial()];
function setCue(i){$('#phasecue').textContent=i;}
function disableTray(d){locked=d;}
function renderItem(item){cur=item;T.explored=new Set();T.nOpt=item.options.length;
  const club=$('#club');club.innerHTML='';club.classList.remove('accept');
  item.members.forEach(m=>{const c=document.createElement('div');c.className='cell';c.innerHTML=payloadSVG(item.kind,m);club.appendChild(c);});
  const slot=document.createElement('div');slot.className='cell slot';slot.id='clubslot';club.appendChild(slot);
  const tray=$('#tray');tray.innerHTML='';
  item.options.forEach((o,i)=>{const b=document.createElement('div');b.className='opt';b.dataset.i=i;b.innerHTML=payloadSVG(item.kind,o.payload);tray.appendChild(b);});
  $('#go').classList.remove('ready');staged=-1;T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;renderMeters();}
function fillSlot(){const slot=$('#clubslot');if(!slot||staged<0)return;slot.classList.remove('slot');slot.classList.add('filled-anim');slot.innerHTML=payloadSVG(cur.kind,cur.options[staged].payload);setTimeout(()=>slot.classList.remove('filled-anim'),300);}
function onOpt(el){if(locked||phase==='demo'||phase==='done')return;const idx=+el.dataset.i;T.explored.add(idx);
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first tap · option '+idx);}
  staged=idx;$$('#tray .opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');
  const slot=$('#clubslot');if(slot){if(!slot.classList.contains('slot'))slot.className='cell slot';}
  fillSlot();$('#go').classList.add('ready');renderMeters();}
function feedback(correct){const opt=$$('#tray .opt')[staged];if(opt)opt.classList.add(correct?'correct':'wrong');
  if(correct)$('#club').classList.add('accept');
  else{$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),450);
    const ci=cur.options.findIndex(o=>o.tag==='correct');$$('#tray .opt')[ci].classList.add('correct');}
  disableTray(true);$('#go').classList.remove('ready');}
function submit(){if(staged===-1)return;const opt=cur.options[staged];const rt=Date.now()-T.itemStart;const correct=opt.tag==='correct';
  if(phase==='warmup'){feedback(correct);log('warm-up '+(correct?'correct':'incorrect')+' — UNSCORED');setTimeout(nextPhase,950);return;}
  T.scored++;T.rts.push(rt);if(correct)T.correct++;T.lastErr=errType(opt.tag);
  feedback(correct);
  log(`SUBMIT item ${scoredIndex+1} (${cur.rule}) \u2192 ${correct?'CORRECT':'wrong ['+opt.tag+']'} · RT ${rt}ms · explored ${T.explored.size}/${T.nOpt}`);
  renderMeters();setTimeout(nextPhase,1150);}
function nextPhase(){if(phase==='warmup'){scoredIndex=0;startScored();}else if(phase==='scored'){scoredIndex++;scoredIndex<scoredItems.length?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('\u2b50');disableTray(false);renderItem(genSingle());log('— warm-up (unscored): share one property —');}
function startScored(){phase='scored';setCue('\ud83c\udfaf');disableTray(false);renderItem(scoredItems[scoredIndex]);log(`— SCORED item ${scoredIndex+1}: ${cur.rule} —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');disableTray(true);log(`— DONE · accuracy ${T.correct}/${T.scored} —`);}
async function runDemo(){phase='demo';setCue('\ud83d\udc41\ufe0f');disableTray(true);const d=genSingle('color');renderItem(d);log('ghost-hand demo (wordless, <10s)');
  const ci=d.options.findIndex(o=>o.tag==='correct');ghostShow(true);await sleep(300);
  for(const c of $$('#club .cell:not(.slot)')){await ghostTo(c);await sleep(120);}
  await ghostTo($$('#tray .opt')[ci]);await ghostTap();staged=ci;$$('#tray .opt')[ci].classList.add('correct','sel');
  const slot=$('#clubslot');if(slot)slot.className='cell slot';fillSlot();$('#club').classList.add('accept');
  await sleep(500);await ghostTo($('#go'));await ghostTap();await sleep(350);ghostShow(false);await sleep(500);startWarmup();}
$('#tray').addEventListener('click',e=>{const o=e.target.closest('.opt');if(o)onOpt(o);});
$('#tray').addEventListener('pointerover',e=>{const o=e.target.closest('.opt');if(o&&!locked&&phase!=='demo'&&phase!=='done'){T.explored.add(+o.dataset.i);renderMeters();}});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
