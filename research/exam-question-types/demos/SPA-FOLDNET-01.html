<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],sleep=ms=>new Promise(r=>setTimeout(r,ms)),ctx=$('#solidCanvas').getContext('2d');
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,V=(x,y,z)=>[x,y,z];
// Minimal 3D: rotate (yaw,pitch) + orthographic project; painter's-algorithm faces.
function proj(p,yaw,pit,s,cx,cy){const cy_=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pit),sp=Math.sin(pit);let x=p[0]*cy_+p[2]*sy,z=-p[0]*sy+p[2]*cy_,y=p[1]*cp-z*sp;z=p[1]*sp+z*cp;return{x:cx+x*s,y:cy-y*s,z};}
function drawFaces(c,verts,faces,yaw,pit,s,cx,cy){const P=verts.map(v=>proj(v,yaw,pit,s,cx,cy));faces.map(f=>({f,depth:f.idx.reduce((a,i)=>a+P[i].z,0)/f.idx.length})).sort((a,b)=>a.depth-b.depth).forEach(({f})=>{c.beginPath();f.idx.forEach((i,k)=>k?c.lineTo(P[i].x,P[i].y):c.moveTo(P[i].x,P[i].y));c.closePath();c.fillStyle=f.fill;c.fill();c.strokeStyle='#28304f';c.lineWidth=2;c.stroke()});}
const COLOR=['#ef6b8f','#5267df','#28ad9c','#f5ad32','#9b6be8','#3eb7d3','#f07f4f','#62b86c'];
function solid(verts,idx){return{verts,faces:idx.map((x,i)=>({idx:x,fill:COLOR[i%COLOR.length]}))};}
function prism(n,rx=1,ry=1,z=.8){const verts=[];for(const zz of [-z,z])for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;verts.push(V(rx*Math.cos(a),ry*Math.sin(a),zz))}const faces=[[...Array(n).keys()].reverse(),[...Array(n).keys()].map(i=>i+n)];for(let i=0;i<n;i++)faces.push([i,(i+1)%n,(i+1)%n+n,i+n]);return solid(verts,faces);}
const SHAPES={
 cube:{family:'box',faces:6,sig:'6 square',solid:prism(4,1,1,1)},
 rect:{family:'box',faces:6,sig:'6 rectangle',solid:prism(4,1.35,.72,.82)},
 tetra:{family:'pyramid',faces:4,sig:'4 triangle',solid:solid([V(0,1.2,0),V(-1,-.8,-.8),V(1,-.8,-.8),V(0,-.8,1.1)],[[0,1,2],[0,2,3],[0,3,1],[1,3,2]])},
 pyramid:{family:'pyramid',faces:5,sig:'1 square 4 triangle',solid:solid([V(-1,-.8,-1),V(1,-.8,-1),V(1,-.8,1),V(-1,-.8,1),V(0,1.25,0)],[[0,1,2,3],[0,4,1],[1,4,2],[2,4,3],[3,4,0]])},
 tri:{family:'prism',faces:5,sig:'2 triangle 3 rectangle',solid:prism(3,1.05,1,.9)},
 pent:{family:'prism',faces:7,sig:'2 pentagon 5 rectangle',solid:prism(5,1,1,.82)},
 hex:{family:'prism',faces:8,sig:'2 hexagon 6 rectangle',solid:prism(6,1,1,.82)}
};
const LIB={1:['cube'],2:['tetra','pyramid'],3:['tri'],4:['rect'],5:['pent','hex']};
const DIST={
 cube:['rect','pyramid','tri'],rect:['cube','tri','pyramid'],tetra:['pyramid','tri','cube'],pyramid:['tetra','tri','cube'],tri:['pyramid','rect','pent'],pent:['hex','tri','rect'],hex:['pent','tri','rect']
};
const T={scored:0,correct:0,rts:[],first:0,revs:0,folds:0,orbits:0,error:'—',maxSolved:0,level:1,startLevel:1,itemStart:0,rapid:false,blur:false,lastActivity:performance.now()};
let phase='demo',kind='cube',options=[],selected=-1,trial=0,locked=true,folding=false,folded=false,yaw=-.62,pitch=.4,drag=false,lx=0,ly=0;
function learnRate(){return T.scored?((T.maxSolved-T.startLevel)/T.scored).toFixed(2):'0.00';}
function rtText(){if(!T.rts.length)return'—';return T.rapid||T.blur?'gated':`${T.rts.at(-1)} ms · μ ${mean(T.rts)}`;}
const METERS=[
 {id:'M-ACC',name:'Exact net-to-solid accuracy',get:()=>T.scored?`${T.correct}/${T.scored} · ${Math.round(100*T.correct/T.scored)}%`:'—'},
 {id:'M-RT',name:'Commit time, engagement-gated',get:rtText},
 {id:'M-RTFIRST',name:'Time to first fold or choice',get:()=>T.first?`${Math.round(T.first)} ms`:'—'},
 {id:'M-REV',name:'Solid-choice revisions',get:()=>String(T.revs)},
 {id:'M-EXPLORE',name:'External fold and orbit use',get:()=>`${T.folds} folds · ${T.orbits} orbits`},
 {id:'M-ERRTYPE',name:'Last topology near-miss',get:()=>T.error},
 {id:'M-DIFFREACH',name:'Hardest net level solved',get:()=>`${T.maxSolved}/5 · Δ/trial ${learnRate()}`}
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{$('#v_'+m.id).textContent=m.get()});$('#mountFill').style.width=(T.level/5*100)+'%';$('#mountText').textContent=`${T.level}/5 · Δ ${learnRate()}`;}
function log(msg){const d=document.createElement('div');d.innerHTML=`<span class="t">+${Math.round(Math.max(0,performance.now()-T.itemStart))}ms</span> ${msg}`;$('#log').appendChild(d);$('#log').scrollTop=$('#log').scrollHeight;}
function first(){if(!T.first){T.first=performance.now()-T.itemStart;log(`first action @ ${Math.round(T.first)}ms`)}}
function svgEl(name,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',name);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e;}
function rect(x,y,w,h,c,i){const r=svgEl('rect',{x,y,width:w,height:h,rx:3,fill:c,stroke:'#5f6171','stroke-width':2});if(i!=null){const t=svgEl('text',{x:x+w/2,y:y+h/2+6,'text-anchor':'middle','font-size':18,'font-weight':900,fill:'#fff'});t.textContent='◆●▲✚⬟✦'[i%6];$('#netSvg').append(r,t)}else $('#netSvg').append(r);}
function poly(points,c,i){const p=svgEl('polygon',{points:points.map(x=>x.join(',')).join(' '),fill:c,stroke:'#5f6171','stroke-width':2});$('#netSvg').append(p);if(i!=null){const x=points.reduce((s,p)=>s+p[0],0)/points.length,y=points.reduce((s,p)=>s+p[1],0)/points.length,t=svgEl('text',{x,y:y+6,'text-anchor':'middle','font-size':17,'font-weight':900,fill:'#fff'});t.textContent='◆●▲✚⬟✦'[i%6];$('#netSvg').append(t)}}
function drawNet(k){const s=$('#netSvg');s.innerHTML='';if(k==='cube'){const a=50,x=105,y=105;[[-1,0],[0,0],[1,0],[2,0],[0,-1],[0,1]].forEach((p,i)=>rect(x+p[0]*a,y+p[1]*a,a,a,COLOR[i],i))}
 else if(k==='rect'){const widths=[64,38,64,38],h=48,x=78,y=106;let xx=x;widths.forEach((w,i)=>{rect(xx,y,w,h,COLOR[i],i);xx+=w});rect(x,y-38,64,38,COLOR[4],4);rect(x+64+38,y+h,64,38,COLOR[5],5)}
 else if(k==='pyramid'){const x=145,y=95,a=70;rect(x,y,a,a,COLOR[0],0);poly([[x,y],[x+a,y],[x+a/2,y-62]],COLOR[1],1);poly([[x+a,y],[x+a,y+a],[x+a+62,y+a/2]],COLOR[2],2);poly([[x+a,y+a],[x,y+a],[x+a/2,y+a+62]],COLOR[3],3);poly([[x,y+a],[x,y],[x-62,y+a/2]],COLOR[4],4)}
 else if(k==='tetra'){const h=66,cx=180,cy=130,tri=[[cx,cy-h],[cx-58,cy+34],[cx+58,cy+34]];poly(tri,COLOR[0],0);poly([[cx,cy-h],[cx-58,cy+34],[cx-116,cy-h]],COLOR[1],1);poly([[cx,cy-h],[cx+58,cy+34],[cx+116,cy-h]],COLOR[2],2);poly([[cx-58,cy+34],[cx+58,cy+34],[cx,cy+102]],COLOR[3],3)}
 else{const n=k==='tri'?3:k==='pent'?5:6,w=k==='tri'?70:k==='pent'?48:41,h=65,x=(360-n*w)/2,y=98,r=w/(2*Math.sin(Math.PI/n));for(let i=0;i<n;i++)rect(x+i*w,y,w,h,COLOR[i],i);const ngon=(cx,cy)=>Array.from({length:n},(_,i)=>[cx+r*Math.cos(-Math.PI/2+i*2*Math.PI/n),cy+r*Math.sin(-Math.PI/2+i*2*Math.PI/n)]);poly(ngon(x+w/2,y-r),COLOR[n%8],n);poly(ngon(x+(n-1.5)*w,y+h+r),COLOR[(n+1)%8],n+1)}}
function icon(k,color){const common=`fill="${color}bb" stroke="${color}" stroke-width="4" stroke-linejoin="round"`;let body='';
 if(k==='cube')body=`<polygon points="24,28 54,12 82,29 52,46" ${common}/><polygon points="24,28 52,46 52,76 24,57" ${common}/><polygon points="52,46 82,29 82,59 52,76" ${common}/>`;
 else if(k==='rect')body=`<polygon points="12,32 55,14 88,28 45,47" ${common}/><polygon points="12,32 45,47 45,72 12,58" ${common}/><polygon points="45,47 88,28 88,53 45,72" ${common}/>`;
 else if(k==='tetra')body=`<polygon points="50,9 16,72 84,72" ${common}/><path d="M50 9L50 72M16 72L50 42L84 72" fill="none" stroke="#fff" stroke-width="2"/>`;
 else if(k==='pyramid')body=`<polygon points="50,8 12,65 50,78 88,65" ${common}/><path d="M50 8L50 78M12 65L88 65" fill="none" stroke="#fff" stroke-width="2"/>`;
 else{const n=k==='tri'?3:k==='pent'?5:6,pts=Array.from({length:n},(_,i)=>[31+22*Math.cos(-Math.PI/2+i*2*Math.PI/n),42+24*Math.sin(-Math.PI/2+i*2*Math.PI/n)]),pts2=pts.map(p=>[p[0]+31,p[1]-11]);body=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" ${common}/><polygon points="${pts2.map(p=>p.join(',')).join(' ')}" ${common}/>`+pts.map((p,i)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${pts2[i][0]}" y2="${pts2[i][1]}" stroke="${color}" stroke-width="4"/>`).join('')}

function buildOptions(){const raw=[kind,...DIST[kind]],shift=(trial+T.level)%4;options=[...raw.slice(shift),...raw.slice(0,shift)];$('#options').innerHTML=options.map((k,i)=>`<button class="option" data-i="${i}" aria-label="choice ${i+1}"><span class="key">${i+1}</span>${icon(k,COLOR[i])}</button>`).join('');}
function panelDefs(k){if(k==='cube'||k==='rect')return[
 ['square','translate3d(0,0,0)','translate3d(0,0,35px)'],['square','translate3d(70px,0,0)','translate3d(35px,0,0) rotateY(90deg)'],['square','translate3d(140px,0,0)','translate3d(0,0,-35px) rotateY(180deg)'],['square','translate3d(-70px,0,0)','translate3d(-35px,0,0) rotateY(-90deg)'],['square','translate3d(0,-70px,0)','translate3d(0,-35px,0) rotateX(90deg)'],['square','translate3d(0,70px,0)','translate3d(0,35px,0) rotateX(-90deg)']];
 if(k==='pyramid')return[['square','translate3d(0,0,0)','translate3d(0,25px,0) rotateX(90deg)'],['tri','translate3d(0,-62px,0)','translate3d(0,-20px,22px) rotateX(55deg)'],['tri','translate3d(62px,0,0) rotateZ(90deg)','translate3d(20px,0,22px) rotateY(-55deg)'],['tri','translate3d(0,62px,0) rotateZ(180deg)','translate3d(0,20px,22px) rotateX(-55deg)'],['tri','translate3d(-62px,0,0) rotateZ(-90deg)','translate3d(-20px,0,22px) rotateY(55deg)']];
 if(k==='tetra')return[['tri','translate3d(0,0,0)','translate3d(0,18px,0) rotateX(90deg)'],['tri','translate3d(-60px,-36px,0) rotateZ(-60deg)','translate3d(-18px,-8px,18px) rotateY(60deg)'],['tri','translate3d(60px,-36px,0) rotateZ(60deg)','translate3d(18px,-8px,18px) rotateY(-60deg)'],['tri','translate3d(0,70px,0) rotateZ(180deg)','translate3d(0,18px,18px) rotateX(-60deg)']];
 const n=k==='tri'?3:k==='pent'?5:6,out=[];for(let i=0;i<n;i++)out.push(['rect',`translate3d(${(i-(n-1)/2)*52}px,0,0)`,`rotateY(${i*360/n}deg) translateZ(${n<5?25:40}px)`]);out.push(['poly','translate3d(-35px,-70px,0)','translate3d(0,-35px,0) rotateX(90deg)'],['poly','translate3d(35px,70px,0)','translate3d(0,35px,0) rotateX(90deg)']);return out;
}
function regularClip(n){return'polygon('+Array.from({length:n},(_,i)=>`${50+48*Math.cos(-Math.PI/2+i*2*Math.PI/n)}% ${50+48*Math.sin(-Math.PI/2+i*2*Math.PI/n)}%`).join(',')+')';}
function buildPanels(){const o=$('#foldObject');o.innerHTML='';panelDefs(kind).forEach((d,i)=>{const e=document.createElement('div');e.className='foldFace';e.dataset.flat=d[1];e.dataset.fold=d[2];e.style.transform=d[1];e.style.background=COLOR[i%COLOR.length];if(d[0]==='tri')e.style.clipPath='polygon(50% 0,100% 100%,0 100%)';if(d[0]==='rect'){e.style.width='52px';e.style.height='70px'}if(d[0]==='poly')e.style.clipPath=regularClip(kind==='tri'?3:kind==='pent'?5:6);e.textContent='◆●▲✚⬟✦'[i%6];o.appendChild(e)});o.style.transform='rotateX(0deg) rotateY(0deg)';$('#solidCanvas').style.opacity=0;folded=false;}
function drawSolid(){ctx.clearRect(0,0,360,260);const g=ctx.createRadialGradient(180,120,10,180,130,190);g.addColorStop(0,'#344079');g.addColorStop(1,'#131936');ctx.fillStyle=g;ctx.fillRect(0,0,360,260);drawFaces(ctx,SHAPES[kind].solid.verts,SHAPES[kind].solid.faces,yaw,pitch,70,180,132);}
function setItem(k,fresh=true){kind=k;drawNet(k);buildOptions();buildPanels();selected=-1;locked=phase==='demo';$('#lock').disabled=true;$('#phasecue').textContent=phase==='demo'?'👁️':phase==='warmup'?'⭐':'🎯';if(fresh){T.itemStart=performance.now();T.first=0;T.revs=0;T.folds=0;T.orbits=0;T.error='—';T.rapid=false;T.blur=false;T.lastActivity=performance.now()}renderMeters();}
async function foldReplay(track=true){if(folding)return;folding=true;if(track&&phase!=='demo'){first();T.folds++;log('fold scaffold replay');renderMeters()}buildPanels();const faces=$$('.foldFace'),animations=faces.map((e,i)=>e.animate([{transform:e.dataset.flat},{transform:e.dataset.fold}],{duration:850+i*55,easing:'cubic-bezier(.25,.75,.2,1)',fill:'forwards'}));await Promise.all(animations.map(a=>a.finished.catch(()=>{})));folded=true;drawSolid();$('#solidCanvas').style.opacity=1;const st=performance.now();while(performance.now()-st<650){yaw+=.018;drawSolid();await new Promise(requestAnimationFrame)}folding=false;}
function choose(i,modality='tap'){if(locked||folding||i<0||i>3)return;first();if(selected>=0&&selected!==i)T.revs++;selected=i;$$('.option').forEach((o,k)=>o.classList.toggle('sel',k===i));$('#lock').disabled=false;log(`solid choice ${i+1} [${options[i]}] via ${modality}`);renderMeters();}
function activity(){T.lastActivity=performance.now()}addEventListener('pointerdown',activity);addEventListener('keydown',activity);document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='scored')T.blur=true});function gate(rt){T.rapid=rt<350||performance.now()-T.lastActivity>22000;if(T.rapid||T.blur)log(`RT gate: ${T.rapid?'rapid/idle':'blur'}`);}
function errType(a,b){const A=SHAPES[a],B=SHAPES[b];if(A.faces===B.faces)return'right face-count / wrong face-shape';if(A.family===B.family)return'near family / wrong side-count';return'wrong solid family';}
async function submit(){if(locked||selected<0||folding)return;locked=true;$('#lock').disabled=true;const rt=Math.round(performance.now()-T.itemStart),pick=options[selected],ok=pick===kind;$$('.option')[selected].classList.add(ok?'good':'bad');$$('.option')[options.indexOf(kind)].classList.add('good');
 if(phase==='warmup'){log(`warm-up ${ok?'correct':'guided reveal'} · unscored`);$('#phasecue').textContent=ok?'✅':'↻';if(!folded)await foldReplay(false);await sleep(700);startScored();return}
 T.scored++;T.rts.push(rt);gate(rt);if(ok){T.correct++;T.maxSolved=Math.max(T.maxSolved,T.level);T.level=Math.min(5,T.level+1);T.error='—'}else{T.level=Math.max(1,T.level-1);T.error=errType(pick,kind)}$('#phasecue').textContent=ok?'✅':'🔎';log(`LOCK ${ok?'correct':'miss '+T.error} · ${pick}→${kind} · L${T.level} · ${rt}ms`);renderMeters();await sleep(950);trial++;trial<6?startScored():finish();}
function startWarmup(){phase='warmup';setItem('cube',true);locked=false;log('warm-up · unscored');}
function startScored(){phase='scored';const choices=LIB[T.level],k=choices[(trial+T.level)%choices.length];setItem(k,true);locked=false;log(`scored ${trial+1}/6 · L${T.level} · net ${k}`);}
function finish(){phase='done';locked=true;$('#phasecue').textContent='🏆';$('#lock').disabled=true;$$('.option').forEach(o=>o.disabled=true);log(`DONE · ${T.correct}/${T.scored} · max L${T.maxSolved} · Δ ${learnRate()}`);renderMeters();}
const stage=$('#foldStage');stage.addEventListener('pointerdown',e=>{if(!folded||locked)return;drag=true;lx=e.clientX;ly=e.clientY;stage.classList.add('drag');stage.setPointerCapture(e.pointerId);first()});stage.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lx)*.008;pitch+=(e.clientY-ly)*.006;lx=e.clientX;ly=e.clientY;drawSolid()});function endDrag(){if(drag){drag=false;stage.classList.remove('drag');T.orbits++;log('orbit gesture');renderMeters()}}stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
const ghost=$('#ghost');async function ghostTo(el){const r=el.getBoundingClientRect();ghost.style.transform=`translate(${r.left+r.width/2-12}px,${r.top+r.height/2-10}px)`;await sleep(460)}async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(330)}
async function runDemo(){phase='demo';setItem('cube',false);ghost.classList.add('show');await ghostTo($('#foldBtn'));await ghostTap();await foldReplay(false);const o=$$('.option')[options.indexOf('cube')];await ghostTo(o);await ghostTap();o.classList.add('sel','good');await sleep(350);ghost.classList.remove('show');startWarmup();}
$('#options').addEventListener('click',e=>{const o=e.target.closest('.option');if(o)choose(+o.dataset.i,'tap')});$('#foldBtn').addEventListener('click',()=>{if(phase!=='done')foldReplay(true)});$('#lock').addEventListener('click',submit);
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(/^[1-4]$/.test(e.key))choose(+e.key-1,'key');else if(e.key==='Enter')submit();else if(k==='f')foldReplay(true);else if(k==='j'&&folded){yaw-=.12;T.orbits++;drawSolid();renderMeters()}else if(k==='l'&&folded){yaw+=.12;T.orbits++;drawSolid();renderMeters()}else if(k==='i'&&folded){pitch-=.1;T.orbits++;drawSolid();renderMeters()}else if(k==='k'&&folded){pitch+=.1;T.orbits++;drawSolid();renderMeters()}else return;e.preventDefault()});
buildMeters();setItem('cube',false);renderMeters();runDemo();
</script>
