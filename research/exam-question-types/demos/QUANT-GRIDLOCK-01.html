<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUANT-GRIDLOCK-01 — Number Grid Lock</title>
<style>
:root{--bg:#0f1226;--panel:#1b2140;--panel2:#232a52;--accent:#5eead4;--accent2:#f59e0b;--good:#4ade80;--bad:#f87171;--ink:#eef1ff;--muted:#9aa3c7}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 20% -10%,#26305e,#0f1226 60%);min-height:100vh}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1120px;margin:0 auto;padding:18px}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid #313a6b;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.phasebar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#2b336a;color:var(--muted);border:1px solid #3a447f}
.pill.on{background:var(--accent);color:#053;font-weight:700}
.prompt{font-size:15px;color:var(--muted);min-height:22px;margin:6px 0 10px;text-align:center}
.safe{display:flex;justify-content:center;margin-bottom:8px}
.grid{display:grid;gap:8px;background:#12172f;border:2px solid #3a447f;border-radius:16px;padding:14px;box-shadow:inset 0 0 20px rgba(0,0,0,.4)}
.cell{width:60px;height:60px;border-radius:12px;background:linear-gradient(180deg,#2b336a,#20264d);border:1px solid #3a447f;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.cell.blank{background:#171d3d;border:2px dashed var(--accent);color:var(--accent2);cursor:pointer}
.cell.lit{border-color:var(--good);box-shadow:0 0 12px rgba(74,222,128,.6)}
.cell.open{background:linear-gradient(180deg,#86efac,#22c55e);color:#053;border-color:#16a34a}
.stepper{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid #3a447f;background:#2b336a;color:var(--ink);font-size:22px;cursor:pointer}
.stepper .val{font-weight:800;font-size:22px;color:var(--accent2);min-width:46px;text-align:center}
.row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap}
button.act{font:600 15px system-ui;padding:10px 18px;border-radius:12px;border:0;cursor:pointer;background:var(--accent);color:#053}
button.act.ghost{background:#2b336a;color:var(--ink);border:1px solid #3a447f}
button.act:disabled{opacity:.4;cursor:default}
.fb{min-height:26px;text-align:center;font-weight:700;margin-top:8px}.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.hand{position:fixed;font-size:30px;z-index:20;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:left .5s cubic-bezier(.4,0,.2,1),top .5s ease;opacity:0}
.tele{font-size:13px}.tele h2{font-size:14px;margin:0 0 8px;color:var(--accent)}
.metrics{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-bottom:10px}
.metrics div:nth-child(odd){color:var(--muted)}.metrics b{font-variant-numeric:tabular-nums}
.log{height:236px;overflow:auto;background:#12172f;border:1px solid #2a336a;border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-acc{color:var(--good)}.t-err{color:var(--bad)}.t-evt{color:#9fb0ff}.t-sys{color:var(--muted)}
.legend{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <h1>Number Grid Lock</h1>
    <div class="sub">Dial the missing number so every row and column follows its pattern. Crack the safe!</div>
    <div class="phasebar" id="phasebar"></div>
    <div class="prompt" id="prompt"></div>
    <div class="safe"><div class="grid" id="grid"></div></div>
    <div class="stepper" id="stepper" style="display:none">
      <button id="minus">&#8722;</button><div class="val" id="val">0</div><button id="plus">+</button>
    </div>
    <div class="row">
      <button class="act ghost" id="peekBtn" style="display:none">Peek the pattern</button>
      <button class="act" id="openBtn" style="display:none">Open</button>
      <button class="act ghost" id="nextBtn" style="display:none">Next</button>
    </div>
    <div class="fb" id="fb"></div>
    <div class="hand" id="hand">&#128070;</div>
  </main>
  <aside class="card tele">
    <h2>Live telemetry</h2>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="legend">Logs <b>M-ACC</b>, <b>M-RTFIRST</b> (encode time), <b>M-RULEID</b> (co-acting rules solved), <b>M-DIFFREACH</b> (hardest lock), <b>M-HINT</b> (peeks used).</div>
  </aside>
</div>
<script>
(function(){
  "use strict";
  var el=function(id){return document.getElementById(id)};
  var grid=el('grid'),hand=el('hand'),prompt=el('prompt'),fb=el('fb'),openBtn=el('openBtn'),nextBtn=el('nextBtn'),peekBtn=el('peekBtn'),stepper=el('stepper'),valEl=el('val');
  var T0=Date.now();function perf(){return Date.now()-T0;}
  var Tel={scored:0,correct:0,firstSum:0,firstN:0,ruleMax:0,diffMax:0,hints:0,
    push:function(c,m){var d=document.createElement('div');d.className=c;d.textContent='['+(perf()/1000).toFixed(2)+'s] '+m;var L=el('log');L.appendChild(d);L.scrollTop=L.scrollHeight;},
    render:function(){
      var acc=this.scored?Math.round(100*this.correct/this.scored)+'% ('+this.correct+'/'+this.scored+')':'—';
      var first=this.firstN?Math.round(this.firstSum/this.firstN)+' ms':'—';
      el('metrics').innerHTML='<div>M-ACC accuracy</div><b>'+acc+'</b>'+
        '<div>M-RTFIRST mean</div><b>'+first+'</b>'+
        '<div>M-RULEID max rules</div><b>'+(this.ruleMax||'—')+'</b>'+
        '<div>M-DIFFREACH level</div><b>'+(this.diffMax||'—')+'</b>'+
        '<div>M-HINT peeks</div><b>'+this.hints+'</b>';
    }};

  var items=[
    {phase:'demo',  g:[[2,4],[3,null]], ans:6, rules:1, diff:1, hint:'each row DOUBLES across'},
    {phase:'warmup',g:[[1,2,3,null]],   ans:4, rules:1, diff:1, hint:'+1 across'},
    {phase:'scored',g:[[3,6],[4,null]], ans:8, rules:1, diff:1, hint:'double across'},
    {phase:'scored',g:[[1,3,5],[2,4,6],[3,5,null]], ans:7, rules:2, diff:2, hint:'+2 across, +1 down'},
    {phase:'scored',g:[[2,5,8],[6,9,12],[10,13,null]], ans:16, rules:2, diff:3, hint:'+3 across, +4 down'}
  ];
  var labels={demo:'1 Watch',warmup:'2 Try',scored:'3 Solve'};
  var idx=-1,cur=null,val=0,br=0,bc=0,firstAction=0,itemStart=0,locked=false;

  function phasebar(){el('phasebar').innerHTML=['demo','warmup','scored'].map(function(p){return '<span class="pill'+(cur&&cur.phase===p?' on':'')+'">'+labels[p]+'</span>';}).join('');}
  function draw(){
    var rows=cur.g.length,cols=cur.g[0].length;
    grid.style.gridTemplateColumns='repeat('+cols+',60px)';grid.innerHTML='';
    for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){(function(r,c){
      var v=cur.g[r][c];var cell=document.createElement('div');
      if(v===null){cell.className='cell blank';cell.id='blank';cell.textContent=val||'?';
        cell.onclick=function(){first();};}
      else{cell.className='cell';cell.textContent=v;}
      grid.appendChild(cell);
    })(r,c);}
  }
  function first(){if(firstAction===0&&cur.phase!=='demo'){firstAction=perf();Tel.firstSum+=(firstAction-itemStart);Tel.firstN++;Tel.push('t-evt','first action on blank (encode '+(firstAction-itemStart)+'ms)');}}
  function setVal(v){if(locked||cur.phase==='demo')return;first();val=Math.max(0,Math.min(20,v));var b=el('blank');if(b){b.textContent=val;}openBtn.style.display='inline-block';}
  el('plus').onclick=function(){setVal(val+1);valEl.textContent=val;};
  el('minus').onclick=function(){setVal(val-1);valEl.textContent=val;};
  peekBtn.onclick=function(){if(locked)return;Tel.hints++;Tel.push('t-evt','M-HINT: peeked -> '+cur.hint);fb.textContent='Pattern: '+cur.hint;fb.className='fb';Tel.render();};
  openBtn.onclick=function(){
    if(locked||cur.phase==='demo')return;locked=true;openBtn.style.display='none';stepper.style.display='none';peekBtn.style.display='none';
    var correct=(val===cur.ans);var b=el('blank');
    if(b){b.classList.remove('blank');b.classList.add(correct?'open':'');b.style.border=correct?'':'2px solid var(--bad)';b.textContent=val;}
    if(correct){[].slice.call(grid.children).forEach(function(c){c.classList.add('lit');});}
    if(cur.phase==='scored'){
      Tel.scored++;if(correct){Tel.correct++;Tel.ruleMax=Math.max(Tel.ruleMax,cur.rules);Tel.diffMax=Math.max(Tel.diffMax,cur.diff);}
      Tel.push(correct?'t-acc':'t-err','SCORED lock '+cur.g.length+'x'+cur.g[0].length+': dialed '+val+' (ans '+cur.ans+') rules='+cur.rules+' diff='+cur.diff);
    }else{Tel.push('t-sys',cur.phase.toUpperCase()+': dialed '+val+' (ans '+cur.ans+') — not scored');}
    fb.textContent=correct?(cur.phase==='warmup'?'Cracked it! Now the real safes.':'Cracked! Every line holds.'):'No click — it opens at '+cur.ans+'.';
    fb.className='fb '+(correct?'good':'bad');if(correct)beep();nextBtn.style.display='inline-block';Tel.render();
  };
  function loadItem(){
    idx++;if(idx>=items.length){finish();return;}
    cur=items[idx];locked=false;val=0;firstAction=0;itemStart=perf();
    var g=cur.g;for(var r=0;r<g.length;r++)for(var c=0;c<g[0].length;c++)if(g[r][c]===null){br=r;bc=c;}
    fb.textContent='';fb.className='fb';nextBtn.style.display='none';openBtn.style.display='none';valEl.textContent='0';
    stepper.style.display=cur.phase==='demo'?'none':'flex';
    peekBtn.style.display=(cur.phase==='scored')?'inline-block':'none';
    phasebar();
    prompt.textContent=cur.phase==='demo'?'Watch: find the pattern along the row, then fill the blank.':'Dial the blank so every row and column follows its pattern, then Open.';
    draw();
    Tel.push('t-sys','LOAD '+cur.phase+': '+g.length+'x'+g[0].length+' ans='+cur.ans+' rules='+cur.rules+' diff='+cur.diff);
    if(cur.phase==='demo')ghost();
    Tel.render();
  }
  nextBtn.onclick=loadItem;
  function ghost(){
    setTimeout(function(){var b=el('blank');var r=b.getBoundingClientRect();hand.style.opacity='1';hand.style.left=(r.left+r.width/2)+'px';hand.style.top=(r.top+r.height/2)+'px';},700);
    var steps=[2,4,6];
    steps.forEach(function(v,i){setTimeout(function(){var b=el('blank');if(b)b.textContent=v;},1200+i*450);});
    setTimeout(function(){var b=el('blank');if(b){b.textContent=cur.ans;b.classList.remove('blank');b.classList.add('open');}[].slice.call(grid.children).forEach(function(c){c.classList.add('lit');});beep();fb.textContent='Each row doubles, so the blank = '+cur.ans+'.';fb.className='fb good';hand.style.opacity='0';},1200+3*450+300);
    setTimeout(loadItem,1200+3*450+1500);
  }
  function beep(){try{var a=new(window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='triangle';o.frequency.setValueAtTime(500,a.currentTime);o.frequency.exponentialRampToValueAtTime(900,a.currentTime+.14);g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.3);o.start();o.stop(a.currentTime+.32);}catch(e){}}
  function finish(){prompt.textContent='';el('safe')&&0;document.querySelector('.safe').innerHTML='<div style="text-align:center;padding:30px 0;color:var(--muted)"><div style="font-size:44px">&#128275;</div><div>Sample complete. Telemetry captured on the right.</div></div>';stepper.style.display='none';nextBtn.style.display='none';peekBtn.style.display='none';Tel.push('t-sys','SESSION complete: '+Tel.correct+'/'+Tel.scored+' correct; max rules '+Tel.ruleMax);}
  window.addEventListener('blur',function(){Tel.push('t-sys','engagement: focus lost');});
  Tel.render();loadItem();
})();
</script>
</body>
</html>
