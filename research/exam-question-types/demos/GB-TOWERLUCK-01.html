<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GB-TOWERLUCK-01 — Lucky Tower</title>
<style>
:root{--bg:#0f1226;--panel:#1b2140;--panel2:#232a52;--accent:#5eead4;--accent2:#f59e0b;--good:#4ade80;--bad:#f87171;--ink:#eef1ff;--muted:#9aa3c7}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 70% -10%,#3a2a12,#0f1226 60%);min-height:100vh}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1120px;margin:0 auto;padding:18px}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid #313a6b;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.phasebar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#2b336a;color:var(--muted);border:1px solid #3a447f}
.pill.on{background:var(--accent);color:#053;font-weight:700}
.prompt{font-size:15px;color:var(--muted);min-height:22px;margin:6px 0;text-align:center}
.hud{display:flex;justify-content:space-between;font-weight:700;margin:8px 2px}.hud .haul{color:var(--accent2)}.hud .bank{color:var(--good)}
.tower{display:flex;flex-direction:column-reverse;gap:6px;padding:12px;background:#16203a;border-radius:14px;border:1px solid #26406a;min-height:280px;justify-content:flex-start}
.floor{position:relative;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:10px;background:#22304f;border:1px solid #33507f;color:var(--muted);opacity:.5}
.floor .rw{font-weight:800;color:var(--accent2)}.floor .rk{font-size:12px}
.floor.here{opacity:1;background:#2b3f66;border-color:var(--accent);box-shadow:0 0 0 2px rgba(94,234,212,.3)}
.floor.here .climber{position:absolute;left:-2px;top:-16px;font-size:26px}
.floor.done{opacity:1;background:#1e3a2a;border-color:var(--good)}
.floor.fell{opacity:1;background:#3a1e26;border-color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
button.act{font:600 16px system-ui;padding:12px 22px;border-radius:12px;border:0;cursor:pointer;background:var(--accent2);color:#3a2400}
button.act.cash{background:var(--good);color:#053}button.act.ghost{background:#2b336a;color:var(--ink);border:1px solid #3a447f}
button.act:disabled{opacity:.4;cursor:default}
.fb{min-height:26px;text-align:center;font-weight:700;margin-top:10px}.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.hand{position:absolute;font-size:32px;z-index:20;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:left .4s ease,top .4s ease;opacity:0}
.tele{font-size:13px}.tele h2{font-size:14px;margin:0 0 8px;color:var(--accent)}
.metrics{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-bottom:10px}
.metrics div:nth-child(odd){color:var(--muted)}.metrics b{font-variant-numeric:tabular-nums}
.log{height:220px;overflow:auto;background:#12172f;border:1px solid #2a336a;border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-acc{color:var(--good)}.t-err{color:var(--bad)}.t-evt{color:#9fb0ff}.t-sys{color:var(--muted)}
.legend{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <h1>Lucky Tower</h1>
    <div class="sub">Climb for a bigger prize, but a trapdoor may drop you. Cash out whenever you want.</div>
    <div class="phasebar" id="phasebar"></div>
    <div class="prompt" id="prompt"></div>
    <div class="hud"><span class="haul">This climb: <span id="haul">0</span></span><span class="bank">Banked: <span id="bankv">0</span></span></div>
    <div class="tower" id="tower"></div>
    <div class="row">
      <button class="act" id="climbBtn">Climb higher</button>
      <button class="act cash" id="cashBtn">Cash out</button>
      <button class="act ghost" id="nextBtn" style="display:none">Next climb</button>
    </div>
    <div class="fb" id="fb"></div>
    <div class="hand" id="hand">&#128070;</div>
  </main>
  <aside class="card tele">
    <h2>Live telemetry</h2>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="legend">Risk: M-CONF (floors risked / wager), M-EXPLORE, M-PATH (climb/cash sequence). Persistence: M-RESUME (re-climb after a fall), M-PERSIST, M-CHOICE, M-ENGAGE.</div>
  </aside>
</div>
<script>
(function(){
  "use strict";
  var el=function(id){return document.getElementById(id)};
  var tower=el('tower'),haulEl=el('haul'),bankEl=el('bankv'),prompt=el('prompt'),fb=el('fb'),
      climbBtn=el('climbBtn'),cashBtn=el('cashBtn'),nextBtn=el('nextBtn'),hand=el('hand');
  var T0=Date.now();function now(){return Date.now()-T0;}
  var FLOORS=6;
  var Tel={banked:0,falls:0,retries:0,climbs:[],prevFloor:null,
    push:function(c,m){var d=document.createElement('div');d.className=c;d.textContent='['+(now()/1000).toFixed(2)+'s] '+m;var L=el('log');L.appendChild(d);L.scrollTop=L.scrollHeight;},
    render:function(){var s=Tel.climbs.filter(function(x){return x.scored;});
      var avg=s.length?(s.reduce(function(a,x){return a+x.floor;},0)/s.length).toFixed(1):'\u2014';
      var mx=s.length?Math.max.apply(null,s.map(function(x){return x.floor;})):'\u2014';
      el('metrics').innerHTML='<div>M-CONF avg floors</div><b>'+avg+'</b><div>Max floor risked</div><b>'+mx+'</b>'+
        '<div>Banked total</div><b>'+Tel.banked+'</b><div>Falls</div><b>'+Tel.falls+'</b>'+
        '<div>M-RESUME re-climbs</div><b>'+Tel.retries+'</b><div>M-CHOICE cash-outs</div><b>'+s.filter(function(x){return x.cashed;}).length+'</b>';}};

  // reward per floor grows; fall chance grows with height. hard round = tall risky tower (persistence).
  var rounds=[
    {phase:'demo',   reward:[0,2,4,7,11,16,22], fall:[0,0,0,0,0,0,0], hard:false},
    {phase:'warmup', reward:[0,2,5,9,14,20,27], fall:[0,.05,.12,.2,.3,.42,.55], hard:false},
    {phase:'scored', reward:[0,3,7,12,18,25,33], fall:[0,.08,.18,.28,.4,.52,.66], hard:false},
    {phase:'scored', reward:[0,4,9,15,22,30,40], fall:[0,.1,.22,.34,.46,.58,.72], hard:false},
    {phase:'scored', reward:[0,5,12,20,30,42,60], fall:[0,.15,.3,.45,.6,.72,.85], hard:true}
  ];
  var phaseName={demo:'Ghost demo',warmup:'Warm-up (not scored)',scored:'Scored climb'};
  var idx=-1,cur=null,floor=0,ended=false,roundStart=0;

  function renderPhasebar(){var order=['demo','warmup','scored'],lab={demo:'1 Watch',warmup:'2 Try',scored:'3 Climb'};
    el('phasebar').innerHTML=order.map(function(p){var on=cur&&cur.phase===p?' on':'';return '<span class="pill'+on+'">'+lab[p]+'</span>';}).join('')+(cur?'<span class="pill">'+phaseName[cur.phase]+'</span>':'');}

  function drawTower(){tower.innerHTML='';for(var f=1;f<=FLOORS;f++){var d=document.createElement('div');d.className='floor'+(f===floor?' here':'');d.dataset.f=f;
    d.innerHTML='<span class="rk">Floor '+f+' \u00b7 fall '+Math.round(cur.fall[f]*100)+'%</span><span class="rw">'+cur.reward[f]+'</span>'+(f===floor?'<span class="climber">&#129485;</span>':'');tower.appendChild(d);}}

  function loadRound(){idx++;if(idx>=rounds.length){finish();return;}cur=rounds[idx];floor=0;ended=false;
    fb.textContent='';fb.className='fb';nextBtn.style.display='none';climbBtn.style.display='inline-block';cashBtn.style.display='inline-block';
    climbBtn.disabled=false;cashBtn.disabled=true;haulEl.textContent='0';renderPhasebar();drawTower();
    prompt.textContent=cur.hard?'A tall, risky tower. How high will you go?':'Climb for a bigger prize.';
    roundStart=now();Tel.push('t-sys','ROUND '+idx+' start ('+cur.phase+(cur.hard?', hard':'')+')');
    if(cur.phase==='demo')ghost();Tel.render();}

  climbBtn.onclick=function(){if(ended||cur.phase==='demo')return;
    if(Math.random()<cur.fall[floor+1]){fall();return;}
    floor++;haulEl.textContent=cur.reward[floor];cashBtn.disabled=false;drawTower();
    Tel.push('t-evt','climb to floor '+floor+' (prize '+cur.reward[floor]+', next fall '+Math.round((cur.fall[floor+1]||0)*100)+'%)');
    if(floor>=FLOORS){ended=true;Tel.banked+=cur.reward[floor];bankEl.textContent=Tel.banked;fb.textContent='Top floor! +'+cur.reward[floor];fb.className='fb good';
      climbBtn.disabled=true;cashBtn.disabled=true;markDone();recordScored(true);nextBtn.style.display='inline-block';}
    Tel.render();};

  function fall(){ended=true;Tel.falls++;var here=tower.querySelector('.floor.here');if(here){here.classList.add('fell');here.classList.remove('here');}
    fb.textContent='Trapdoor! You fell and lost this climb.';fb.className='fb bad';climbBtn.disabled=true;cashBtn.disabled=true;
    if(cur.hard)Tel.persistFall=true;recordScored(false);
    Tel.push('t-err','ROUND '+idx+' FALL from floor '+floor+' (lost '+cur.reward[floor]+')');
    nextBtn.textContent=cur.hard?'Try again':'Next climb';nextBtn.dataset.retry=cur.hard?'1':'';nextBtn.style.display='inline-block';Tel.render();}

  cashBtn.onclick=function(){if(ended||cur.phase==='demo'||floor===0)return;ended=true;Tel.banked+=cur.reward[floor];bankEl.textContent=Tel.banked;
    markDone();fb.textContent='Cashed out '+cur.reward[floor]+'!';fb.className='fb good';climbBtn.disabled=true;cashBtn.disabled=true;
    recordScored(true,true);Tel.push('t-acc','ROUND '+idx+' CASH at floor '+floor+' (+'+cur.reward[floor]+')');
    nextBtn.textContent='Next climb';nextBtn.dataset.retry='';nextBtn.style.display='inline-block';Tel.render();}

  function markDone(){var here=tower.querySelector('.floor.here');if(here){here.classList.add('done');here.classList.remove('here');}}
  function recordScored(success,cashed){if(cur.phase!=='scored')return;var rev='';if(Tel.prevFloor!==null&&floor<Tel.prevFloor)rev=' (pulled back)';
    Tel.climbs.push({floor:floor,scored:true,cashed:!!cashed,success:success});Tel.prevFloor=floor;}

  nextBtn.onclick=function(){if(nextBtn.dataset.retry==='1'){Tel.retries++;nextBtn.dataset.retry='';Tel.push('t-evt','RESUME: re-climb hard tower after fall');
      floor=0;ended=false;haulEl.textContent='0';drawTower();fb.textContent='';fb.className='fb';climbBtn.disabled=false;cashBtn.disabled=true;nextBtn.style.display='none';roundStart=now();Tel.render();return;}
    loadRound();};

  function ghost(){climbBtn.disabled=true;cashBtn.disabled=true;var steps=[400,1100,1800];
    steps.forEach(function(t){setTimeout(function(){hand.style.opacity='1';hand.style.left=(climbBtn.offsetLeft+30)+'px';hand.style.top=(climbBtn.offsetTop-4)+'px';
      floor++;haulEl.textContent=cur.reward[floor];drawTower();beep(560);Tel.push('t-sys','ghost: climb to '+floor);},t);});
    setTimeout(function(){hand.style.left=(cashBtn.offsetLeft+30)+'px';hand.style.top=(cashBtn.offsetTop-4)+'px';},2400);
    setTimeout(function(){markDone();beep(880);fb.textContent='Ghost cashed out \u2014 prize is safe!';fb.className='fb good';Tel.push('t-sys','ghost: cash out (safe)');},2900);
    setTimeout(function(){hand.style.opacity='0';fb.textContent='';fb.className='fb';loadRound();},3900);}

  function beep(f){try{var a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='square';o.frequency.setValueAtTime(f,a.currentTime);g.gain.setValueAtTime(.06,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.2);o.start();o.stop(a.currentTime+.22);}catch(e){}}

  function finish(){prompt.textContent='';tower.style.display='none';document.querySelectorAll('.row,.hud').forEach(function(n){n.style.display='none';});
    fb.innerHTML='<div style="font-size:44px">\ud83c\udf89</div><div style="color:var(--muted)">Sample complete. Banked '+Tel.banked+'. Telemetry captured on the right.</div>';fb.className='fb';
    Tel.push('t-sys','SESSION complete: banked='+Tel.banked+', falls='+Tel.falls+', re-climbs='+Tel.retries);}
  window.addEventListener('blur',function(){Tel.push('t-sys','engagement: focus lost (M-ENGAGE)');});
  Tel.render();loadRound();
})();
</script>
</body>
</html>
