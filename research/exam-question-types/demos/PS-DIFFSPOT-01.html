<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS-DIFFSPOT-01 — Difference Detectives (localize-the-mismatch speed)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;
    --accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
  h1{font-size:19px;margin:.2rem 0}
  .sub{color:var(--mut);font-size:13px;margin:0 0 6px;text-align:center;max-width:500px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--accent);font-size:12px}
  #stage{position:relative;width:520px;min-height:210px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:center;gap:18px}
  .pane{display:grid;gap:6px;padding:8px;border-radius:12px;background:#10152a}
  .pane.right{outline:2px dashed #2a3358}
  .cell{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:8px;background:#1a2140}
  .pane.right .cell{cursor:pointer;transition:transform .06s}
  .pane.right .cell:active{transform:scale(.9)}
  .cell.ok{background:var(--good)}
  .cell.no{background:var(--bad)}
  .vs{font-size:20px;color:var(--mut)}
  #combo{position:absolute;top:8px;right:14px;font-size:13px;color:var(--warn)}
  #ghost{position:absolute;font-size:28px;left:0;top:0;transition:left .4s cubic-bezier(.5,0,.3,1),top .4s cubic-bezier(.5,0,.3,1);pointer-events:none;filter:drop-shadow(0 3px 3px #0008);z-index:9;opacity:0}
  #cue{font-size:26px;height:32px}
  #bar{width:520px;height:8px;background:#10152a;border-radius:99px;overflow:hidden}
  #bar>div{height:100%;width:100%;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .2s}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:9px 16px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}
  .kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🔍 Difference Detectives <span class="badge" id="blvl">easy</span></h1>
    <p class="sub">The two pictures are the same except for <b>one</b> tile. Tap the tile on the right that is different — as fast as you can while staying right. Speed only counts when you're correct.</p>
  </div>
  <div id="stage">
    <div id="combo"></div>
    <div class="pane left" id="paneL"></div>
    <div class="vs">🟰❓</div>
    <div class="pane right" id="paneR"></div>
    <div id="ghost">👆</div>
  </div>
  <div id="bar"><div></div></div>
  <div id="cue">👀</div>
  <div class="row"><button class="pri" id="go">▶ Watch how it works</button></div>
  <p class="sub" id="hint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const paneL=$("#paneL"),paneR=$("#paneR"),stage=$("#stage"),ghost=$("#ghost"),cue=$("#cue");
const FAM={sq:["🟥","🟧","🟨","🟩","🟦","🟪"],ci:["🔴","🟠","🟡","🟢","🔵","🟣"],st:["⭐","✨","🌟","💫"]};
const ALL=[...FAM.sq,...FAM.ci];
function famOf(e){for(const k in FAM)if(FAM[k].includes(e))return k;return"?";}
const T={phase:"idle",level:1,trials:0,correct:0,rt:[],allrt:[],combo:0,maxCombo:0,fa:0,
  band:null,accSeries:[],log:[],running:false};
function med(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}
function sd(a){if(a.length<2)return 0;const m=a.reduce((s,v)=>s+v,0)/a.length;return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/a.length);}
function cv(a){const m=a.length?a.reduce((s,v)=>s+v,0)/a.length:0;return m?Math.round(100*sd(a)/m):0;}
function lapse(){if(T.allrt.length<4)return 0;const b=[...T.allrt].sort((x,y)=>x-y);const q=b.slice(Math.floor(b.length*.75));return Math.round(med(q));}
function drift(){if(T.accSeries.length<6)return"—";const h=T.accSeries.length>>1;const m=x=>x.reduce((s,v)=>s+v,0)/x.length;return Math.round(100*(m(T.accSeries.slice(h))-m(T.accSeries.slice(0,h))))+"%";}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>50)T.log.pop();}
function render(){
  const acc=T.trials?Math.round(100*T.correct/T.trials):0;
  $("#combo").textContent=T.combo?("🔥 "+T.combo):"";
  $("#tel").innerHTML=`
  <h2>Live telemetry · PS-DIFFSPOT-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>level (grid · subtlety)</span><b>${T.level}</b></div>
  <div class="kv"><span>trials</span><b>${T.trials}</b></div>
  <h2>Accuracy first</h2>
  <div class="kv"><span>accuracy <span class="m">M-ACC</span></span><b>${acc}% <span class="m">(${T.correct}/${T.trials})</span></b></div>
  <div class="kv"><span>false alarms <span class="m">M-FALSEALARM</span></span><b>${T.fa}</b></div>
  <div class="kv"><span>accuracy-gated combo <span class="m">M-COMBO</span></span><b>${T.combo} <span class="m">(max ${T.maxCombo})</span></b></div>
  <h2>Speed = consistency, not peak</h2>
  <div class="kv"><span>median correct RT <span class="m">M-RT</span></span><b>${Math.round(med(T.rt))} ms</b></div>
  <div class="kv"><span>RT variability (CV) <span class="m">M-RTVAR</span></span><b>${cv(T.rt)}%</b></div>
  <div class="kv"><span>lapse (slow tail) <span class="m">M-LAPSE</span></span><b>${lapse()} ms</b></div>
  <div class="kv"><span>speed×accuracy <span class="m">M-SPEEDACC</span></span><b>${T.rt.length?Math.round(med(T.rt))+"ms@"+acc+"%":"—"}</b></div>
  <div class="kv"><span>drift <span class="m">M-DRIFT</span></span><b>${drift()}</b></div>
  <div class="kv"><span>engagement <span class="m">M-ENGAGE</span></span><b>${T.running?"active":"idle"}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();
function centerOf(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2};}
function dims(){const l=T.level;const cols=l<=1?3:l<=3?4:5;const rows=l<=2?2:3;return[rows,cols];}
function makeTiles(n){const t=[];for(let i=0;i<n;i++)t.push(ALL[Math.random()*ALL.length|0]);return t;}
function mutate(e){ // subtle at higher levels: change color within family; blatant: change family
  const subtle=T.level>=3;const fam=famOf(e);
  if(subtle){const arr=FAM[fam].filter(x=>x!==e);return arr[Math.random()*arr.length|0];}
  const other=fam==="sq"?"ci":"sq";const arr=FAM[other];return arr[Math.random()*arr.length|0];
}
let curDiff=-1,shownAt=0,adaptBand=1400;
function draw(forceDiff){
  const [rows,cols]=dims();const n=rows*cols;const tiles=makeTiles(n);
  const di=forceDiff!=null?forceDiff:(Math.random()*n|0);curDiff=di;
  const right=[...tiles];right[di]=mutate(tiles[di]);
  for(const p of [paneL,paneR]){p.style.gridTemplateColumns=`repeat(${cols},1fr)`;}
  paneL.innerHTML=tiles.map(e=>`<div class="cell">${e}</div>`).join("");
  paneR.innerHTML=right.map((e,i)=>`<div class="cell" data-i="${i}">${e}</div>`).join("");
}
async function ghostTo(el){ghost.style.opacity="1";const c=centerOf(el);ghost.style.left=(c.x-12)+"px";ghost.style.top=(c.y-24)+"px";await sleep(520);}
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;
  T.level=1;draw(2);cue.textContent="👀";await sleep(700);
  const tgt=paneR.children[curDiff];await ghostTo(tgt);tgt.classList.add("ok");cue.textContent="✅";await sleep(900);
  ghost.style.opacity="0";
  $("#go").disabled=false;$("#go").textContent="▶ Try a practice one";$("#go").onclick=warmup;
  T.phase="idle";$("#hint").textContent="Now you try — this practice one is NOT scored.";render();
}
$("#go").onclick=demo;
function trial(scored){
  return new Promise(res=>{
    draw();shownAt=performance.now();cue.textContent="🔍";
    function onClick(e){const c=e.target.closest(".cell");if(!c||!c.dataset.i)return;
      paneR.removeEventListener("click",onClick);
      const i=+c.dataset.i,rt=performance.now()-shownAt,ok=i===curDiff;
      c.classList.add(ok?"ok":"no");if(!ok)paneR.children[curDiff].classList.add("ok");
      if(scored){
        T.trials++;T.allrt.push(rt);T.accSeries.push(ok?1:0);
        if(ok){T.correct++;T.rt.push(rt);
          adaptBand=0.85*adaptBand+0.15*rt;
          if(rt<=adaptBand*1.15){T.combo++;if(T.combo>T.maxCombo)T.maxCombo=T.combo;}else T.combo=Math.max(0,T.combo);
          T.level=Math.min(5,T.level+ (T.combo&&T.combo%3===0?1:0));
        } else {T.fa++;T.combo=0;T.level=Math.max(1,T.level-1);}
        logE(`${ok?"hit":"FA"} lvl${T.level} ${Math.round(rt)}ms`);
      }
      render();setTimeout(res,ok?260:520);
    }
    paneR.addEventListener("click",onClick);
  });
}
async function warmup(){$("#go").disabled=true;T.phase="warm-up (unscored)";T.level=1;render();cue.textContent="🔍";await trial(false);
  T.phase="idle";$("#go").disabled=false;$("#go").textContent="▶ Start timed block";$("#go").onclick=startBlock;
  $("#hint").textContent="Great! Now a timed block. Stay accurate — the combo only builds on correct+quick taps.";render();}
async function startBlock(){$("#go").disabled=true;T.phase="scored";T.running=true;T.level=1;T.combo=0;render();
  const dur=45000,t0=performance.now();const bar=$("#bar>div");
  while(performance.now()-t0<dur){bar.style.width=(100*(1-(performance.now()-t0)/dur))+"%";await trial(true);}
  bar.style.width="0%";T.running=false;finish();
}
function finish(){T.phase="done";cue.textContent="🏁";$("#go").disabled=false;$("#go").textContent="▶ Run another block";$("#go").onclick=startBlock;
  const acc=T.trials?Math.round(100*T.correct/T.trials):0;
  $("#hint").textContent=`Done. ${acc}% accurate, median ${Math.round(med(T.rt))}ms, consistency CV ${cv(T.rt)}%. Low CV at high accuracy — not raw speed — is the tail signal.`;render();}
draw(0);
</script>
</body>
</html>
