<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VER-WORDTRAIN-01 · Word Train</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px}
  #stagecard{background:var(--card);border-radius:26px;padding:24px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:680px;width:100%}
  .band{border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
  #trackBand{background:linear-gradient(160deg,#eafaf1,#eef1ff);border:3px solid #bfe8cf;min-height:74px}
  #track{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;min-height:52px}
  .engine{font-size:34px}
  .car{background:#fff;border:3px solid var(--good);border-radius:12px;padding:6px 10px;font-size:26px;display:flex;flex-direction:column;align-items:center;animation:pop .25s}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  #poolBand{background:linear-gradient(160deg,#e8f0ff,#f2ecff);border:3px solid #cfd8ff}
  #pool{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .card{display:flex;flex-direction:column;align-items:center;gap:4px;background:#f4f6ff;border:3px solid #d7deff;border-radius:14px;padding:10px 12px;cursor:pointer;transition:.12s;position:relative;min-width:70px}
  .card:hover{border-color:#b9c2ee;transform:translateY(-2px)}
  .card .ic{font-size:28px}
  .card .wd{font-size:11px;font-weight:700;color:#5060a0}
  .card .hk{position:absolute;top:2px;left:4px;font-size:9px;color:#a7b0d8;font-weight:700}
  .card.used{opacity:.25;pointer-events:none}
  .card.wrongFlash{border-color:var(--bad);background:#fff0f0;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
  #controls{display:flex;gap:16px;align-items:center}
  button.rd{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:64px;height:64px;background:var(--accent);color:#fff;font-size:26px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:50px;height:50px;background:#eef1ff;color:#5b6cff;font-size:22px}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;transition:transform .55s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #diffmeter{width:100%;display:flex;align-items:center;gap:8px;font-size:11px;color:#8a93b5}
  #diffbar{flex:1;height:8px;background:#e4e9ff;border-radius:6px;overflow:hidden}
  #diffbar i{display:block;height:100%;background:linear-gradient(90deg,#5b6cff,#ff8fd0);width:0%;transition:.3s}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:210px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">VER-WORDTRAIN-01 · Word Train</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="trackBand" class="band"><div id="track"><span class="engine">🚂</span></div></div>
      <div id="poolBand" class="band"><div id="pool"></div></div>
      <div id="diffmeter">🌱<div id="diffbar"><i id="diffbarfill"></i></div>🌳</div>
      <div id="controls">
        <button class="rd" id="replay" title="replay demo">↻</button>
        <button class="rd" id="go" title="submit">✓</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,last=a=>a[a.length-1];

/* ---------- chain-relation bank: level 1 (concrete taxonomic) -> 6 (abstract lexical) ---------- */
const BANK=[
 {lvl:1,rel:'animals',vocab:1,fit:[{ic:'\ud83d\udc36',wd:'dog'},{ic:'\ud83d\udc31',wd:'cat'},{ic:'\ud83d\udc26',wd:'bird'}],no:[{ic:'\ud83d\ude97',wd:'car'},{ic:'\ud83c\udf4e',wd:'apple'},{ic:'\ud83e\udea4',wd:'chair'}]},
 {lvl:2,rel:'fruit',vocab:1,fit:[{ic:'\ud83c\udf4e',wd:'apple'},{ic:'\ud83c\udf4c',wd:'banana'},{ic:'\ud83c\udf47',wd:'grape'}],no:[{ic:'\ud83d\udc36',wd:'dog'},{ic:'\ud83d\ude97',wd:'car'},{ic:'\ud83e\udea4',wd:'chair'}]},
 {lvl:3,rel:'things that are cold',vocab:2,fit:[{ic:'\ud83e\uddca',wd:'ice'},{ic:'\u2603\ufe0f',wd:'snowman'},{ic:'\ud83c\udf66',wd:'ice cream'}],no:[{ic:'\ud83d\udd25',wd:'fire'},{ic:'\u2600\ufe0f',wd:'sun'},{ic:'\ud83e\udea4',wd:'chair'}]},
 {lvl:4,rel:'things you wear',vocab:3,fit:[{ic:'\ud83d\udc55',wd:'shirt'},{ic:'\ud83d\udc5f',wd:'shoe'},{ic:'\ud83c\udfa9',wd:'hat'}],no:[{ic:'\ud83c\udf4e',wd:'apple'},{ic:'\ud83d\ude97',wd:'car'},{ic:'\ud83c\udf33',wd:'tree'}]},
 {lvl:5,rel:'things that can fly',vocab:4,fit:[{ic:'\ud83d\udc26',wd:'bird'},{ic:'\u2708\ufe0f',wd:'plane'},{ic:'\ud83e\ude81',wd:'kite'}],no:[{ic:'\ud83d\ude97',wd:'car'},{ic:'\ud83d\udc1f',wd:'fish'},{ic:'\ud83e\udea4',wd:'chair'}]},
 {lvl:6,rel:'words that mean "happy"',vocab:6,fit:[{ic:'\ud83d\ude0a',wd:'glad'},{ic:'\ud83d\ude04',wd:'joyful'},{ic:'\ud83d\ude42',wd:'cheerful'}],no:[{ic:'\ud83d\ude22',wd:'sad'},{ic:'\ud83d\ude20',wd:'angry'},{ic:'\ud83d\ude34',wd:'tired'}]},
];
function byLevel(l){return BANK.find(b=>b.lvl===l);}
function buildPool(item){const cards=[...item.fit.map(c=>({...c,fit:true})),...item.no.map(c=>({...c,fit:false}))];
  for(let i=cards.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[cards[i],cards[j]]=[cards[j],cards[i]];}return cards;}

/* ---------- telemetry ---------- */
const T={scored:0,fullCredit:0,polys:[],path:[],taps:0,maxLevel:1,bestVocab:0,itemStart:0};
function polyStr(){if(!T.polys.length)return '\u2014';return `${last(T.polys).toFixed(2)}  (mean ${mean(T.polys.map(p=>p*100))/100})`;}
function effStr(){if(!T.taps)return '\u2014';return `${T.taps} taps this session / 3 optimal per item`;}
const METERS=[
 {id:'M-ACC',name:'Full-credit accuracy (all 3, no wrongs)',get:()=>T.scored?`${T.fullCredit}/${T.scored}  ${Math.round(100*T.fullCredit/T.scored)}%`:'\u2014'},
 {id:'M-POLY',name:'Partial credit per round',get:()=>polyStr()},
 {id:'M-PATH',name:'Tap order (card word chosen)',get:()=>T.path.length?T.path.slice(-6).join(' \u2192 '):'\u2014'},
 {id:'M-EFF',name:'Taps vs optimal (3/round)',get:()=>effStr()},
 {id:'M-DIFFREACH',name:'Ceiling / max level reached',get:()=>`L${T.maxLevel}/6`},
 {id:'M-VOCABLVL',name:'Word frequency ceiling solved',get:()=>T.bestVocab?`L${T.bestVocab}/6`:'\u2014'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});$('#diffbarfill').style.width=(T.maxLevel/6*100)+'%';}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(520);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(430);}

/* ---------- render ---------- */
let cur=null,pool=null,added=[],level=1,locked=false;
function renderItem(item){cur=item;pool=buildPool(item);added=[];T.itemStart=Date.now();
  $('#track').innerHTML='<span class="engine">\ud83d\ude82</span>';
  $('#pool').innerHTML=pool.map((c,i)=>`<div class="card" data-i="${i}"><span class="hk">${i+1}</span><span class="ic">${c.ic}</span><span class="wd">${c.wd}</span></div>`).join('');
  $('#go').classList.toggle('ready',false);renderMeters();}
function addCard(i){if(locked||!cur)return;const c=pool[i];const el=$$('#pool .card')[i];if(el.classList.contains('used'))return;
  T.taps++;T.path.push(c.wd);
  if(c.fit){el.classList.add('used');added.push(c);const car=document.createElement('span');car.className='car';car.innerHTML=`<span>${c.ic}</span>`;$('#track').appendChild(car);}
  else{el.classList.add('wrongFlash');setTimeout(()=>el.classList.remove('wrongFlash'),380);added.push({...c,wrong:true});}
  $('#go').classList.toggle('ready',added.filter(a=>a.fit).length>0);
  renderMeters();}
function finishRound(){if(!$('#go').classList.contains('ready'))return;locked=true;$('#go').classList.remove('ready');
  const correctIn=added.filter(a=>a.fit).length,wrongIn=added.filter(a=>!a.fit).length;
  const poly=Math.max(0,(correctIn-wrongIn))/cur.fit.length;const full=(correctIn===cur.fit.length&&wrongIn===0);
  if(phase==='warmup'){log(`warm-up: ${correctIn}/${cur.fit.length} correct, ${wrongIn} wrong — UNSCORED`);setTimeout(nextPhase,1300);return;}
  T.scored++;T.polys.push(poly);if(full){T.fullCredit++;T.maxLevel=Math.max(T.maxLevel,level);T.bestVocab=Math.max(T.bestVocab,cur.vocab);}
  log(`ROUND L${level} [${cur.rel}] \u2192 ${correctIn}/${cur.fit.length} correct, ${wrongIn} wrong \u00b7 poly ${poly.toFixed(2)}${full?' FULL':''}`);
  level=full?Math.min(6,level+1):Math.max(1,level-1);
  renderMeters();setTimeout(nextPhase,1400);}
const TOTAL_SCORED=6;let phase='demo',scoredIndex=0;
function setCue(i){$('#phasecue').textContent=i;}
function nextPhase(){locked=false;if(phase==='warmup'){scoredIndex=0;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<TOTAL_SCORED?startScored():finish();}}
function startWarmup(){phase='warmup';locked=false;setCue('\u2b50');level=1;renderItem(byLevel(1));log('— warm-up (unscored) —');}
function startScored(){phase='scored';setCue('\ud83c\udfaf');renderItem(byLevel(level));log(`— SCORED round ${scoredIndex+1}/${TOTAL_SCORED} · level ${level} [${byLevel(level).rel}] —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');locked=true;log(`— DONE · full-credit rounds ${T.fullCredit}/${T.scored} · ceiling L${T.maxLevel} —`);renderMeters();}
async function runDemo(){phase='demo';setCue('\ud83d\udc41\ufe0f');locked=true;
  const item=byLevel(1);renderItem(item);log('ghost-hand demo (wordless, <10s)');ghostShow(true);await sleep(300);
  for(let i=0;i<pool.length;i++){if(pool[i].fit){const el=$$('#pool .card')[i];await ghostTo(el);await ghostTap();addCard(i);await sleep(150);}}
  await sleep(300);await ghostTo($('#go'));await ghostTap();finishRound();
  await sleep(700);ghostShow(false);await sleep(400);T.itemStart=Date.now();startWarmup();}
$('#pool').addEventListener('click',e=>{const c=e.target.closest('.card');if(c&&!locked&&phase!=='demo'&&phase!=='done')addCard(+c.dataset.i);});
$('#go').addEventListener('click',finishRound);
document.addEventListener('keydown',e=>{if(locked||phase==='demo'||phase==='done')return;const n=+e.key;if(n>=1&&n<=6)addCard(n-1);if(e.key==='Enter')finishRound();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
