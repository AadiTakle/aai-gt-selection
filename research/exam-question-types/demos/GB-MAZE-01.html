<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-MAZE-01 · Gem Trail</title>
<style>
  :root{--bg1:#eafff4;--bg2:#e6f0ff;--ink:#26304a;--card:#fff;--accent:#12b886;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:14px}
  #maze{display:grid;gap:3px;background:#cbe8dc;padding:6px;border-radius:12px;position:relative}
  .c{width:52px;height:52px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:28px;
    background:#f4fbf8;cursor:pointer;transition:.1s;-webkit-tap-highlight-color:transparent}
  .c.wall{background:#3b4a63;cursor:default}
  .c.trail{background:#c9f5e4}
  .c.reach:hover{background:#d6f0ff;outline:3px solid #9ad}
  #avatar{position:absolute;font-size:30px;transition:left .14s,top .14s;pointer-events:none}
  #controls{display:flex;gap:14px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #replay{width:48px;height:48px;background:#eef1ff;color:#5b6cff;font-size:22px}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .55s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:200px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-MAZE-01 · Gem Trail</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="maze"><div id="avatar">🐿️</div></div>
      <div id="controls"><button id="replay" title="replay demo">↻</button></div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SZ=55; // 52 + 3
const MAZES={
 warm:["S.G",".#.","..E"],
 s1:["S..#G","##.#.",".....",".###.","G...E"]
};
function parse(rows){const g=rows.map(r=>r.split(''));const walls=new Set(),gems=new Set();let start,exit;
  for(let r=0;r<g.length;r++)for(let c=0;c<g[r].length;c++){const ch=g[r][c];
    if(ch==='#')walls.add(r+','+c);if(ch==='S')start=[r,c];if(ch==='E')exit=[r,c];if(ch==='G')gems.add(r+','+c)}
  return{rows:g.length,cols:g[0].length,walls,gems:[...gems],start,exit}}
function bfs(m,a,b){const key=p=>p[0]+','+p[1];const q=[[a,0]],seen=new Set([key(a)]);
  while(q.length){const[[r,c],d]=q.shift();if(r===b[0]&&c===b[1])return d;
    for(const[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc;
      if(nr<0||nc<0||nr>=m.rows||nc>=m.cols)continue;if(m.walls.has(nr+','+nc))continue;const k=nr+','+nc;
      if(!seen.has(k)){seen.add(k);q.push([[nr,nc],d+1])}}}return Infinity}
function perms(a){if(a.length<=1)return[a];const out=[];a.forEach((x,i)=>{for(const p of perms(a.slice(0,i).concat(a.slice(i+1))))out.push([x,...p])});return out}
function optimal(m){const gems=m.gems.map(g=>g.split(',').map(Number));let best=Infinity;
  for(const order of perms(gems)){let d=0,cur=m.start;for(const g of order){d+=bfs(m,cur,g);cur=g}d+=bfs(m,cur,m.exit);best=Math.min(best,d)}return best}

const T={itemStart:0,steps:0,firstLat:null,firstActed:false,opt:0,gemsGot:0,gemsTotal:0,back:0,visited:null,scored:0,correct:0};
const METERS=[
 {id:'M-ACC',name:'Level completed (scored)',get:()=>T.scored?`${T.correct}/${T.scored}`:'—'},
 {id:'M-EFF',name:'Steps vs optimal',get:()=>T.opt?`${T.opt}/${T.steps}  ${T.steps?Math.round(100*T.opt/T.steps):0}%`:'—'},
 {id:'M-PATH',name:'Steps taken',get:()=>T.steps+''},
 {id:'M-RTFIRST',name:'First-move latency (plan)',get:()=>T.firstLat==null?'—':T.firstLat+' ms'},
 {id:'M-EXPLORE',name:'Distinct cells visited',get:()=>T.visited?T.visited.size:0},
 {id:'M-REV',name:'Backtrack steps',get:()=>T.back+''},
 {id:'M-PERSIST',name:'Time-on-task (ms)',get:()=>T.itemStart?(Date.now()-T.itemStart):'—'},
 {id:'M-PROG',name:'Gems collected',get:()=>T.gemsGot+'/'+T.gemsTotal},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const t=T.itemStart?Date.now()-T.itemStart:0;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(520)}

let phase='demo',m=null,pos=null,gemsLeft=null,prev=null,locked=false;
const setCue=i=>$('#phasecue').textContent=i;
function cellEl(r,c){return $(`.c[data-r="${r}"][data-c="${c}"]`)}
function render(){const mz=$('#maze');mz.style.gridTemplateColumns=`repeat(${m.cols},52px)`;
  [...mz.querySelectorAll('.c')].forEach(x=>x.remove());
  for(let r=0;r<m.rows;r++)for(let c=0;c<m.cols;c++){const d=document.createElement('div');d.className='c';d.dataset.r=r;d.dataset.c=c;
    if(m.walls.has(r+','+c))d.classList.add('wall');
    if(gemsLeft.has(r+','+c))d.textContent='💎';
    if(r===m.exit[0]&&c===m.exit[1])d.textContent='🚪';
    mz.appendChild(d)}
  markReach();placeAvatar(false)}
function markReach(){$$('.c').forEach(x=>x.classList.remove('reach'));if(locked)return;
  for(const[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){const nr=pos[0]+dr,nc=pos[1]+dc;
    if(nr<0||nc<0||nr>=m.rows||nc>=m.cols)continue;if(m.walls.has(nr+','+nc))continue;const e=cellEl(nr,nc);if(e)e.classList.add('reach')}}
function placeAvatar(anim){const a=$('#avatar');a.style.transition=anim?'':'none';a.style.left=(6+pos[1]*SZ+11)+'px';a.style.top=(6+pos[0]*SZ+11)+'px';if(!anim)requestAnimationFrame(()=>a.style.transition='')}
function newLevel(rows){m=parse(rows);pos=m.start.slice();prev=null;gemsLeft=new Set(m.gems);
  T.itemStart=Date.now();T.steps=0;T.firstActed=false;T.firstLat=null;T.opt=optimal(m);T.gemsGot=0;T.gemsTotal=m.gems.length;T.back=0;T.visited=new Set([m.start.join(',')]);locked=false;
  render();renderMeters()}
function move(r,c){if(locked)return;const adj=Math.abs(r-pos[0])+Math.abs(c-pos[1])===1;
  if(!adj||m.walls.has(r+','+c))return;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first move (after planning)')}
  if(prev&&prev[0]===r&&prev[1]===c)T.back++;
  prev=pos.slice();pos=[r,c];T.steps++;T.visited.add(r+','+c);cellEl(r,c).classList.add('trail');
  if(gemsLeft.has(r+','+c)){gemsLeft.delete(r+','+c);T.gemsGot++;cellEl(r,c).textContent='';log('💎 gem! ('+T.gemsGot+'/'+T.gemsTotal+')')}
  placeAvatar(true);markReach();renderMeters();
  if(pos[0]===m.exit[0]&&pos[1]===m.exit[1]){if(gemsLeft.size===0)complete();else log('reached door but gems remain')}}
function complete(){locked=true;markReach();$('#avatar').textContent='🎉';
  if(phase==='scored'){T.scored++;T.correct++;setCue('🏆');log(`SOLVED · steps ${T.steps} (optimal ${T.opt}) · backtracks ${T.back} · firstLat ${T.firstLat}ms`);renderMeters();setTimeout(finish,1200)}
  else{log('warm-up solved (unscored)');setTimeout(()=>{$('#avatar').textContent='🐿️';startScored()},1100)}}
function startWarmup(){phase='warmup';setCue('⭐');newLevel(MAZES.warm);log('— warm-up (unscored): grab 💎, reach 🚪 —')}
function startScored(){phase='scored';setCue('🎯');newLevel(MAZES.s1);log('— SCORED: collect all 💎 then 🚪 in fewest steps —')}
function finish(){phase='done';locked=true;markReach()}
async function runDemo(){phase='demo';setCue('👁️');newLevel(MAZES.warm);log('ghost-hand demo (wordless, <10s)');gShow(true);await sleep(300);
  const route=[[0,1],[0,2]/*gem*/,[1,2],[2,2]/*exit*/];
  for(const[r,c]of route){await gTo(cellEl(r,c));pos=[r,c];if(gemsLeft.has(r+','+c)){gemsLeft.delete(r+','+c);cellEl(r,c).textContent=''}cellEl(r,c).classList.add('trail');placeAvatar(true);await sleep(120)}
  $('#avatar').textContent='🎉';gShow(false);await sleep(900);startWarmup()}
$('#maze').addEventListener('click',e=>{const c=e.target.closest('.c');if(c&&!c.classList.contains('wall'))move(+c.dataset.r,+c.dataset.c)});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo()});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
