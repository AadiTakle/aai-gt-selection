<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUANT-MOBILE-01 — Hanging Mobile Balancer</title>
<style>
:root{--bg:#0f1226;--panel:#1b2140;--panel2:#232a52;--accent:#5eead4;--accent2:#f59e0b;--good:#4ade80;--bad:#f87171;--ink:#eef1ff;--muted:#9aa3c7}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 20% -10%,#26305e,#0f1226 60%);min-height:100vh}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1120px;margin:0 auto;padding:18px}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid #313a6b;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.phasebar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#2b336a;color:var(--muted);border:1px solid #3a447f}
.pill.on{background:var(--accent);color:#053;font-weight:700}
.prompt{font-size:15px;color:var(--muted);min-height:22px;margin:6px 0 6px;text-align:center}
.stage{position:relative;height:300px;margin:0 auto}
.mount{position:absolute;left:50%;top:6px;width:2px;height:26px;background:#4a5288;transform:translateX(-50%)}
.pivot{position:absolute;left:50%;top:30px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:20px solid #5a67b8;transform:translateX(-50%)}
.levelline{position:absolute;left:8%;right:8%;top:40px;border-top:1px dashed #3a447f}
.group{position:absolute;left:50%;top:32px;width:0;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.beam{position:absolute;left:-220px;top:0;width:440px;height:10px;border-radius:6px;background:linear-gradient(90deg,#7d8ad6,#5a67b8)}
.hook{position:absolute;top:8px;width:1px;height:34px;background:#4a5288}
.pan{position:absolute;top:40px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
.pip{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a7f3d0,#34d399);border:1px solid #10b981}
.pip.q{background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b);border-color:#d97706}
.hooklbl{position:absolute;top:78px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap;text-align:center}
.hooklbl b{color:var(--accent2)}
.stepper{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid #3a447f;background:#2b336a;color:var(--ink);font-size:20px;cursor:pointer}
.stepper .val{font-weight:800;font-size:20px;color:var(--accent2);min-width:40px;text-align:center}
.row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap}
button.act{font:600 15px system-ui;padding:10px 18px;border-radius:12px;border:0;cursor:pointer;background:var(--accent);color:#053}
button.act.ghost{background:#2b336a;color:var(--ink);border:1px solid #3a447f}
button.act:disabled{opacity:.4;cursor:default}
.fb{min-height:26px;text-align:center;font-weight:700;margin-top:8px}.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.hand{position:fixed;font-size:30px;z-index:20;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:left .5s cubic-bezier(.4,0,.2,1),top .5s ease;opacity:0}
.tele{font-size:13px}.tele h2{font-size:14px;margin:0 0 8px;color:var(--accent)}
.metrics{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-bottom:10px}
.metrics div:nth-child(odd){color:var(--muted)}.metrics b{font-variant-numeric:tabular-nums}
.log{height:236px;overflow:auto;background:#12172f;border:1px solid #2a336a;border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-acc{color:var(--good)}.t-err{color:var(--bad)}.t-evt{color:#9fb0ff}.t-sys{color:var(--muted)}
.legend{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <h1>Hanging Mobile Balancer</h1>
    <div class="sub">Set the glowing weight so the bar hangs perfectly LEVEL (both sides equal).</div>
    <div class="phasebar" id="phasebar"></div>
    <div class="prompt" id="prompt"></div>
    <div class="stage" id="stage">
      <div class="mount"></div><div class="pivot"></div><div class="levelline"></div>
      <div class="group" id="group"><div class="beam"></div></div>
    </div>
    <div class="stepper" id="stepper" style="display:none">
      <button id="minus">&#8722;</button><div class="val" id="val">0</div><button id="plus">+</button>
    </div>
    <div class="row">
      <button class="act" id="lockBtn" style="display:none">Lock (level)</button>
      <button class="act ghost" id="nextBtn" style="display:none">Next</button>
    </div>
    <div class="fb" id="fb"></div>
    <div class="hand" id="hand">&#128070;</div>
  </main>
  <aside class="card tele">
    <h2>Live telemetry</h2>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="legend">Logs <b>M-ACC</b>, <b>M-EQREL</b> (relational vs operational first commit), <b>M-PROPSTRAT</b> (multiplicative vs additive on torque), <b>M-REV</b> (stepper changes), <b>M-EFF</b> (moves vs optimal).</div>
  </aside>
</div>
<script>
(function(){
  "use strict";
  var el=function(id){return document.getElementById(id)};
  var group=el('group'),hand=el('hand'),prompt=el('prompt'),fb=el('fb'),lockBtn=el('lockBtn'),nextBtn=el('nextBtn'),stepper=el('stepper'),valEl=el('val');
  var T0=Date.now();function perf(){return Date.now()-T0;}
  var Tel={scored:0,correct:0,revs:0,effSum:0,effN:0,eqrel:{rel:0,op:0},prop:{mul:0,add:0},
    push:function(c,m){var d=document.createElement('div');d.className=c;d.textContent='['+(perf()/1000).toFixed(2)+'s] '+m;var L=el('log');L.appendChild(d);L.scrollTop=L.scrollHeight;},
    render:function(){
      var acc=this.scored?Math.round(100*this.correct/this.scored)+'% ('+this.correct+'/'+this.scored+')':'—';
      var eq=(this.eqrel.rel+this.eqrel.op)?('rel '+this.eqrel.rel+' / op '+this.eqrel.op):'—';
      var pr=(this.prop.mul+this.prop.add)?('mult '+this.prop.mul+' / add '+this.prop.add):'—';
      var eff=this.effN?Math.round(100*this.effSum/this.effN)+'%':'—';
      el('metrics').innerHTML='<div>M-ACC accuracy</div><b>'+acc+'</b>'+
        '<div>M-EQREL first commit</div><b>'+eq+'</b>'+
        '<div>M-PROPSTRAT torque</div><b>'+pr+'</b>'+
        '<div>M-REV changes</div><b>'+this.revs+'</b>'+
        '<div>M-EFF vs optimal</div><b>'+eff+'</b>';
    }};

  // hooks: {side:-1|1, d, w}  target: {side,d} start 0. ans = value making torque equal.
  var items=[
    {phase:'demo',mode:'equiv',fixed:[{s:-1,d:1,w:3},{s:1,d:1,w:1}],target:{s:1,d:1},ans:2},
    {phase:'warmup',mode:'equiv',fixed:[{s:-1,d:1,w:1}],target:{s:1,d:1},ans:1},
    {phase:'scored',mode:'equiv',fixed:[{s:-1,d:1,w:5}],target:{s:1,d:1},ans:5,opErr:[]},
    {phase:'scored',mode:'equiv',fixed:[{s:-1,d:1,w:3},{s:-1,d:2,w:4}],target:{s:1,d:1},ans:7,note:'3+4=_',opErr:[]},
    {phase:'scored',mode:'noncanon',fixed:[{s:-1,d:1,w:3},{s:-1,d:1.5,w:4}],disp:'3 + 4',target:{s:1,d:1},rhs:5,ans:2,opErr:[7,12]},
    {phase:'scored',mode:'torque',fixed:[{s:-1,d:3,w:2}],target:{s:1,d:1},ans:6,addTrap:2}
  ];
  var labels={demo:'1 Watch',warmup:'2 Try',scored:'3 Solve'};
  var idx=-1,cur=null,val=0,firstCommit=null,revs=0,locked=false,itemStart=0;

  function phasebar(){el('phasebar').innerHTML=['demo','warmup','scored'].map(function(p){return '<span class="pill'+(cur&&cur.phase===p?' on':'')+'">'+labels[p]+'</span>';}).join('');}
  function torque(side){var t=0;cur.fixed.forEach(function(h){if(h.s===side)t+=h.w*h.d;});if(cur.target.s===side)t+=val*cur.target.d; if(cur.mode==='noncanon'&&side===1)t+=cur.rhs*1;return t;}
  function xOf(side,d){return side*d*52;}
  function draw(){
    [].slice.call(group.querySelectorAll('.hook,.pan,.hooklbl')).forEach(function(n){n.remove();});
    var all=cur.fixed.slice();all.push({s:cur.target.s,d:cur.target.d,w:val,q:true});
    if(cur.mode==='noncanon')all.push({s:1,d:1,w:cur.rhs,rhs:true});
    all.forEach(function(h){
      var x=xOf(h.s,h.d);
      var hook=document.createElement('div');hook.className='hook';hook.style.left=(220+x)+'px';group.appendChild(hook);
      var pan=document.createElement('div');pan.className='pan';pan.style.left=(220+x)+'px';
      for(var i=0;i<h.w;i++){var p=document.createElement('div');p.className='pip'+(h.q?' q':'');pan.appendChild(p);}
      group.appendChild(pan);
      var lb=document.createElement('div');lb.className='hooklbl';lb.style.left=(220+x)+'px';
      lb.innerHTML=(h.q?'<b>?='+h.w+'</b>':h.w)+(cur.mode==='torque'?('<br><span style="font-size:10px">dist '+h.d+'</span>'):'');
      group.appendChild(lb);
    });
    var net=torque(1)-torque(-1);
    var deg=Math.max(-16,Math.min(16,net*2.4));
    group.style.transform='rotate('+deg+'deg)';group.style.transformOrigin='220px 0';
    if(Math.abs(net)<0.001){group.style.filter='drop-shadow(0 0 10px #34d399)';}else{group.style.filter='none';}
  }
  function setVal(v){
    if(locked||cur.phase==='demo')return;
    v=Math.max(0,Math.min(12,v));
    if(v!==val){revs++;Tel.revs++;}
    if(firstCommit===null&&v!==0){firstCommit=v;classifyFirst(v);}
    val=v;valEl.textContent=v;draw();lockBtn.style.display='inline-block';
  }
  function classifyFirst(v){
    if(cur.mode==='noncanon'){
      if(v===cur.ans){Tel.eqrel.rel++;Tel.push('t-evt','M-EQREL: first commit '+v+' = RELATIONAL (balances both sides)');}
      else if(cur.opErr.indexOf(v)>=0){Tel.eqrel.op++;Tel.push('t-err','M-EQREL: first commit '+v+' = OPERATIONAL (dumped a running total)');}
      else{Tel.push('t-evt','M-EQREL: first commit '+v+' (other)');}
    }
  }
  el('plus').onclick=function(){setVal(val+1);};
  el('minus').onclick=function(){setVal(val-1);};
  lockBtn.onclick=function(){
    if(locked||cur.phase==='demo')return;locked=true;lockBtn.style.display='none';stepper.style.display='none';
    var correct=(Math.abs(torque(1)-torque(-1))<0.001);
    if(cur.mode==='torque'){
      if(val===cur.ans){Tel.prop.mul++;Tel.push('t-evt','M-PROPSTRAT: '+val+' balances 2x3=6x1 = MULTIPLICATIVE');}
      else if(val===cur.addTrap){Tel.prop.add++;Tel.push('t-err','M-PROPSTRAT: '+val+' = ADDITIVE (matched weight, ignored distance)');}
    }
    if(cur.phase==='scored'){
      Tel.scored++;if(correct)Tel.correct++;
      var opt=cur.ans, eff=Math.min(1,opt/Math.max(revs,opt||1));Tel.effSum+=eff;Tel.effN++;
      Tel.push(correct?'t-acc':'t-err','SCORED '+cur.mode+': locked '+val+' (ans '+cur.ans+') net='+(torque(1)-torque(-1)).toFixed(1)+'  moves='+revs+' eff='+Math.round(eff*100)+'%');
    }else{Tel.push('t-sys',cur.phase.toUpperCase()+': locked '+val+' (ans '+cur.ans+') — not scored');}
    fb.textContent=correct?(cur.phase==='warmup'?'Level! Now the real ones.':'Perfectly level!'):'Not level — it balances at '+cur.ans+'.';
    fb.className='fb '+(correct?'good':'bad');if(correct)beep();nextBtn.style.display='inline-block';Tel.render();
  };
  function loadItem(){
    idx++;if(idx>=items.length){finish();return;}
    cur=items[idx];locked=false;val=0;firstCommit=null;revs=0;itemStart=perf();
    fb.textContent='';fb.className='fb';nextBtn.style.display='none';lockBtn.style.display='none';valEl.textContent='0';
    stepper.style.display=cur.phase==='demo'?'none':'flex';
    phasebar();
    prompt.textContent=cur.phase==='demo'?'Watch: the light side needs more weight to hang level.':
      (cur.mode==='torque'?'Distance matters! Set the weight so the turning effect (weight x distance) matches.':'Set the glowing weight so the bar hangs LEVEL, then Lock.');
    draw();
    Tel.push('t-sys','LOAD '+cur.phase+' '+cur.mode+': ans='+cur.ans+(cur.opErr&&cur.opErr.length?' opErr='+cur.opErr.join('/'):''));
    if(cur.phase==='demo')ghost();
    Tel.render();
  }
  nextBtn.onclick=loadItem;
  function ghost(){
    var seq=[1,2];
    seq.forEach(function(v,i){setTimeout(function(){val=v;valEl.textContent=v;draw();var r=el('stage').getBoundingClientRect();hand.style.opacity='1';hand.style.left=(r.left+r.width*0.62)+'px';hand.style.top=(r.top+120)+'px';},600+i*600);});
    setTimeout(function(){val=cur.ans;draw();beep();fb.textContent='Add '+cur.ans+' and it hangs level (both sides = '+torque(-1)+').';fb.className='fb good';hand.style.opacity='0';},600+2*600+300);
    setTimeout(loadItem,600+2*600+1500);
  }
  function beep(){try{var a=new(window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(560,a.currentTime);o.frequency.exponentialRampToValueAtTime(880,a.currentTime+.15);g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.3);o.start();o.stop(a.currentTime+.32);}catch(e){}}
  function finish(){prompt.textContent='';el('stage').innerHTML='<div style="text-align:center;padding:120px 0 0;color:var(--muted)"><div style="font-size:44px">&#127881;</div><div>Sample complete. Telemetry captured on the right.</div></div>';stepper.style.display='none';nextBtn.style.display='none';Tel.push('t-sys','SESSION complete: '+Tel.correct+'/'+Tel.scored+' correct');}
  window.addEventListener('blur',function(){Tel.push('t-sys','engagement: focus lost');});
  Tel.render();loadItem();
})();
</script>
</body>
</html>
