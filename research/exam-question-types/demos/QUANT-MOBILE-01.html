<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUANT-MOBILE-01 · Hanging Mobile</title>
<style>
  :root{
    --night:#e9efff;--dawn:#fff0eb;--ink:#30374f;--card:#fffdfb;
    --coral:#e87969;--blue:#5677cb;--gold:#e6b64e;--good:#2fba82;--bad:#ef6874;
    --wire:#66728e;--tel:#101528;--tel2:#1c2440;--key:#7ef3d1;--dim:#7786af;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    min-height:100vh;display:flex;color:var(--ink);
    font:16px/1.35 ui-rounded,"Avenir Next",system-ui,sans-serif;
    background:radial-gradient(circle at 20% 12%,#fff 0 3%,transparent 19%),
      linear-gradient(145deg,var(--night),var(--dawn));
  }
  button{font:inherit}
  #wrap{
    flex:1;min-width:0;padding:18px;display:flex;flex-direction:column;
    align-items:center;gap:12px;
  }
  #badge{
    color:#7d86a5;font-size:12px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;
  }
  #phasecue{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:#e9efff;color:var(--blue);border:2px solid #ccd7f2;min-height:30px}
  #phasecue[data-phase="warmup"]{background:#fff7e6;color:#a9791b;border-color:#ffe1a6}
  #phasecue[data-phase="scored"]{background:var(--blue);color:#fff;border-color:var(--blue)}
  #phasecue[data-phase="done"]{background:#e7ecff;color:#3a49c8;border-color:#ccd7f2}
  #howto{max-width:600px;width:100%;background:#fffdfb;border:1px solid #dce2f1;border-left:5px solid var(--blue);border-radius:12px;padding:12px 16px;box-shadow:0 8px 24px -18px #555b81}
  #howto h1{margin:0 0 4px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--blue)}
  #howto p{margin:0;font-size:14px;color:#465074;line-height:1.5}
  #status{min-height:22px;font-size:14px;font-weight:700;text-align:center}
  #status.ok{color:var(--good)} #status.no{color:var(--bad)} #status.neutral{color:#7d86a5}
  #stagecard{
    width:min(830px,100%);min-height:590px;padding:20px;border-radius:32px;
    background:rgba(255,253,251,.96);box-shadow:0 25px 62px -32px #555b81;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  }
  #mobile{
    width:min(650px,100%);height:330px;position:relative;padding-top:14px;
  }
  #ceiling{
    width:110px;height:12px;border-radius:8px;background:#56617d;margin:auto;
    box-shadow:0 5px 0 #3d465e;
  }
  #rootcord{width:4px;height:55px;background:var(--wire);margin:auto}
  #toparm{
    width:74%;height:9px;border-radius:6px;background:linear-gradient(#8490ad,#59647f);
    margin:auto;position:relative;transform:rotate(2deg);transition:transform .38s ease;
  }
  #toparm::before{
    content:"";position:absolute;left:50%;top:-8px;transform:translateX(-50%);
    width:23px;height:23px;border-radius:50%;background:var(--gold);
  }
  .top-hook{
    position:absolute;top:5px;width:4px;height:76px;background:var(--wire);
  }
  .top-hook.left{left:7%}.top-hook.right{right:7%}
  .load{
    position:absolute;top:67px;left:50%;transform:translateX(-50%);
    min-width:88px;min-height:55px;padding:8px;border-radius:20px;
    background:#f8faff;border:3px solid #ccd5ed;display:flex;gap:4px;
    align-items:center;justify-content:center;flex-wrap:wrap;
  }
  #slot{
    border-style:dashed;border-color:var(--coral);background:#fff5f2;
    animation:slot 1.3s ease-in-out infinite;
  }
  @keyframes slot{50%{box-shadow:0 0 24px #e8796966}}
  #branches{
    position:absolute;left:6%;top:154px;width:54%;display:grid;
    grid-template-columns:repeat(2,minmax(140px,1fr));gap:14px;
  }
  .branch{
    height:72px;position:relative;padding-top:7px;
  }
  .lower-arm{
    width:78%;height:6px;border-radius:5px;background:var(--wire);
    margin:auto;position:relative;transition:transform .35s;
  }
  .lower-arm::before{
    content:"";position:absolute;left:50%;top:-22px;width:3px;height:22px;
    background:var(--wire);
  }
  .side{
    position:absolute;top:8px;display:flex;gap:2px;align-items:flex-start;
    justify-content:center;min-width:56px;
  }
  .side.left{left:-7px}.side.right{right:-7px}
  .side::before{content:"";position:absolute;top:-7px;width:2px;height:12px;background:var(--wire)}
  .shape{
    width:27px;height:27px;border-radius:9px;background:#fff;display:grid;
    place-items:center;font-size:22px;line-height:1;box-shadow:0 3px 0 #d9deec;
  }
  .shape.moon{color:#4e7bc5}.shape.star{color:#e2aa37}
  .shape.diamond{color:#8c61ca}.shape.triangle{color:#32a381}
  #options{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:82px}
  .option{
    min-width:96px;min-height:72px;padding:8px;border:3px solid #dce2f1;border-radius:21px;
    background:#fff;display:flex;gap:4px;align-items:center;justify-content:center;
    flex-wrap:wrap;cursor:pointer;box-shadow:0 6px 0 #d7dceb;transition:.15s;
  }
  .option:hover,.option:focus-visible{outline:none;transform:translateY(-3px);border-color:#9aaddd}
  .option.selected{transform:translateY(-4px);border-color:var(--coral);box-shadow:0 8px 0 #efd1ca}
  .option.correct{border-color:var(--good);background:#eafff4}
  .option.wrong{border-color:var(--bad);background:#fff0f2}
  #controls{display:flex;gap:18px;align-items:center}
  #replay,#go{border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center}
  #replay{width:50px;height:50px;color:var(--blue);background:#e9efff;font-size:24px}
  #go{
    width:76px;height:76px;color:#fff;font-size:32px;background:linear-gradient(145deg,var(--blue),var(--coral));
    box-shadow:0 11px 26px -9px var(--blue);opacity:.34;pointer-events:none;
  }
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  .sway{animation:sway .55s ease}
  @keyframes sway{25%{transform:rotate(-4deg)}75%{transform:rotate(5deg)}}
  .cascade .lower-arm,.cascade #toparm{transform:rotate(0)!important;box-shadow:0 0 14px #38c993}
  .sparkle::after{content:"✦  ✧  ✦";position:absolute;inset:35% 0;text-align:center;color:var(--gold);font-size:35px;animation:pop .7s}
  @keyframes pop{from{opacity:0;scale:.3}to{opacity:1;scale:1.2}}
  .shake{animation:shake .4s}
  @keyframes shake{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
  #ghost{
    position:fixed;left:0;top:0;z-index:90;opacity:0;pointer-events:none;
    filter:drop-shadow(0 3px 4px #0004);transition:transform .46s ease,opacity .2s;
  }
  #ghost.show{opacity:.94}#ghost.tap{animation:tap .34s}
  @keyframes tap{50%{scale:.78}}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--blue);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{
    width:336px;flex:0 0 336px;background:var(--tel);color:#cbd6f8;
    display:flex;flex-direction:column;font:13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  #telemetry h3{
    margin:0;padding:13px 14px;background:var(--tel2);color:#fff;
    font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  }
  #difficulty{padding:11px 13px;border-bottom:1px solid #293351}
  .cap{display:flex;justify-content:space-between;color:#8998c1;font-size:11px}
  #dbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:7px}
  #dbar i{height:9px;border-radius:5px;background:#2b3452}
  #dbar i.on{background:linear-gradient(90deg,#7ef3d1,#ff9e8f)}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:7px}
  .mid{color:var(--key);font-weight:800}.mval{color:#fff;text-align:right}
  .mname{grid-column:1/3;color:var(--dim);font-size:11px}
  #logwrap{border-top:1px solid #293351;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 3px;color:#8998c1;font-size:11px}
  #log{height:178px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:3px 0;border-bottom:1px dotted #26304d}#log .t{color:#6474a4}
  @media(max-width:860px){
    body{flex-direction:column}#telemetry{width:100%;flex:none;min-height:350px}
    #stagecard{min-height:550px}#mobile{height:320px}#branches{width:60%;left:1%}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="wrap">
  <div id="badge">QUANT-MOBILE-01 · Hanging Mobile</div>
  <header id="howto">
    <h1>How to use — Hanging Mobile</h1>
    <p>Look at the hanging mobile. Tap the group of shapes that keeps every arm balanced, then press the check (<b>✓</b>) to submit.</p>
  </header>
  <div id="phasecue" data-phase="demo">Watch the example</div>
  <section id="stagecard">
    <div id="mobile">
      <div id="ceiling"></div><div id="rootcord"></div>
      <div id="toparm">
        <div class="top-hook left"><div class="load" id="target"></div></div>
        <div class="top-hook right"><div class="load" id="slot">?</div></div>
      </div>
      <div id="branches"></div>
    </div>
    <div id="options"></div>
    <div id="controls">
      <button id="replay" aria-label="Replay demonstration">↻</button>
      <button id="go" aria-label="Check mobile">✓</button>
    </div>
    <div id="status" class="neutral">Watch the example, then try it yourself.</div>
  </section>
</main>
<aside id="telemetry">
  <h3>Live telemetry · per-child</h3>
  <div id="difficulty">
    <div class="cap"><span>DIFFICULTY</span><span id="dlabel">1 / 6</span></div>
    <div id="dbar"></div>
  </div>
  <div id="mlist"></div>
  <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
</aside>
<div id="ghost"><svg viewBox="0 0 24 24" width="32" height="32" fill="#ffffff" stroke="#5677cb" stroke-width="1.6" stroke-linejoin="round"><path d="M5 2.5 L5 18 L9 14 L12 21 L14.7 19.9 L11.7 13.2 L17.5 13 Z"/></svg><span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ICON={moon:'●',star:'★',diamond:'◆',triangle:'▲'};
const ITEMS=[
  {branches:[[ ['moon'],['star','star'] ]],target:['moon','star'],opts:[
    {c:['moon'],p:1},{c:['star','star','star'],p:2,key:1},{c:['moon','moon'],p:1},{c:['star'],p:0}],constraints:2,depth:2,label:'two-level repeat'},
  {branches:[[ ['moon'],['star','star'] ],[ ['diamond'],['moon','star'] ]],target:['diamond','moon'],opts:[
    {c:['diamond','star'],p:2},{c:['moon','moon','star'],p:3,key:1},{c:['diamond','diamond'],p:1},{c:['moon','star'],p:1}],constraints:3,depth:2,label:'two linked branches'},
  {branches:[[ ['moon'],['star','star'] ],[ ['diamond'],['moon','star'] ],[ ['triangle'],['diamond','moon'] ]],target:['triangle','star'],opts:[
    {c:['triangle'],p:2},{c:['diamond','moon'],p:3},{c:['diamond','diamond'],p:4,key:1},{c:['triangle','moon'],p:2}],constraints:4,depth:3,label:'three linked branches'},
  {branches:[[ ['moon'],['star','star','star'] ],[ ['diamond'],['moon','star','star'] ],[ ['triangle'],['diamond','moon'] ]],target:['triangle','diamond'],opts:[
    {c:['triangle','moon','star'],p:3},{c:['triangle','moon','star','star'],p:4,key:1},{c:['triangle','moon','star','star','star'],p:2},{c:['diamond','diamond','star','star'],p:2}],constraints:4,depth:3,label:'composite missing load'},
  {branches:[[ ['moon'],['star','star'] ],[ ['diamond'],['moon','moon'] ],[ ['triangle'],['diamond','moon','star'] ]],target:['triangle','diamond'],opts:[
    {c:['diamond','diamond','moon'],p:2},{c:['triangle','moon','star'],p:3},{c:['triangle','moon','star','star'],p:4,key:1},{c:['diamond','diamond','diamond'],p:2}],constraints:4,depth:3,label:'deep decomposition'},
  {branches:[[ ['moon'],['star','star','star'] ],[ ['diamond'],['moon','moon','star'] ],[ ['triangle'],['diamond','moon','star'] ]],target:['triangle','diamond'],opts:[
    {c:['triangle','moon','star'],p:2},{c:['diamond','diamond','moon'],p:3},{c:['triangle','moon','moon','star'],p:4,key:1},{c:['triangle','diamond','star'],p:3}],constraints:4,depth:4,label:'minimally cued system'}
];
const DEMO={branches:[[ ['moon'],['moon'] ]],target:['moon'],opts:[
  {c:['star'],p:0},{c:['moon'],p:2,key:1},{c:['moon','moon'],p:1}],constraints:2,depth:2,label:'matching moon'};
const WARM={branches:[[ ['moon'],['star','star'] ]],target:['moon'],opts:[
  {c:['star'],p:1},{c:['star','star'],p:2,key:1},{c:['moon','star'],p:1}],constraints:2,depth:2,label:'two-arm warm-up'};
let phase='demo',cur=null,choice=-1,path=[],prog=[],locked=true,trial=0,level=1;
const T={scored:0,correct:0,lastPath:'—',lastProg:'—',lastPlan:'—',maxLevel:0,levels:[]};
function shapes(arr){return arr.map(s=>`<span class="shape ${s}" aria-hidden="true">${ICON[s]}</span>`).join('');}
function branchHTML(pair){return `<div class="branch"><div class="lower-arm"><div class="side left">${shapes(pair[0])}</div><div class="side right">${shapes(pair[1])}</div></div></div>`;}
function currentPoly(){return choice<0?0:cur.opts[choice].p;}
function planfulness(){
  if(!prog.length)return '—';
  let useful=0,prior=0;
  prog.forEach(v=>{if(v>prior)useful++;prior=v;});
  const score=useful/prog.length;
  return `${score.toFixed(2)} · ${score===1?'ascending':'revising'}`;
}
function renderItem(item){
  cur=item;choice=-1;path=[];prog=[];
  $('#mobile').className='';$('#toparm').style.transform='rotate(2deg)';
  $('#target').innerHTML=shapes(item.target);$('#slot').textContent='?';
  $('#branches').innerHTML=item.branches.map(branchHTML).join('');
  $('#branches').style.gridTemplateColumns=item.branches.length>2?'repeat(2,minmax(140px,1fr))':'1fr';
  $('#options').innerHTML=item.opts.map((o,i)=>`<button class="option" data-i="${i}" aria-label="Mobile load option">${shapes(o.c)}</button>`).join('');
  $('#go').classList.remove('ready');updateDifficulty();renderMeters();
}
function choose(i,ghosted=false){
  if(locked&&!ghosted)return;
  choice=i;path.push(i+1);prog.push(cur.opts[i].p);
  document.querySelectorAll('.option').forEach((b,k)=>b.classList.toggle('selected',k===i));
  $('#slot').innerHTML=shapes(cur.opts[i].c);$('#go').classList.add('ready');
  $('#toparm').classList.remove('sway');void $('#toparm').offsetWidth;$('#toparm').classList.add('sway');
  if(!ghosted)log(`place cluster ${i+1} · ${cur.opts[i].p}/${cur.constraints} constraints`);
  renderMeters();
}
function feedback(ok){
  const b=document.querySelector(`.option[data-i="${choice}"]`);
  if(b)b.classList.add(ok?'correct':'wrong');
  if(ok){$('#mobile').classList.add('cascade','sparkle');$('#toparm').style.transform='rotate(0deg)';}
  else{$('#toparm').style.transform=`rotate(${choice%2?6:-6}deg)`;$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),430);}
}
function submit(){
  if(locked||choice<0)return;
  const ok=!!cur.opts[choice].key;
  if(phase==='warmup'){
    locked=true;feedback(ok);setStatus('neutral',ok?'\u2713 Balanced - practice':'Practice - the balanced answer is shown.');log(`warm-up ${ok?'balanced':'corrective cascade'} · UNSCORED`);
    if(!ok)setTimeout(()=>{choose(cur.opts.findIndex(o=>o.key),true);feedback(true);},440);
    setTimeout(startScored,1120);return;
  }
  setStatus(ok?'ok':'no',ok?'\u2713 Correct':'\u2717 Not quite - the correct group is highlighted');
  locked=true;T.scored++;if(ok)T.correct++;
  T.lastPath=path.join(' → ');T.lastProg=prog.join(' → ')+'/'+cur.constraints;T.lastPlan=planfulness();
  if(ok)T.maxLevel=Math.max(T.maxLevel,level);
  T.levels.push({trial:T.scored,level,ok});feedback(ok);
  log(`SCORED ${T.scored}/6 · L${level} · ${ok?'all arms level':'partial '+currentPoly()+'/'+cur.constraints}`);
  level=Math.max(1,Math.min(6,level+(ok?1:-1)));updateDifficulty();renderMeters();
  setTimeout(()=>{trial++;trial<6?startScored():finish();},980);
}
function learnRate(){return T.scored?((Math.max(1,T.maxLevel)-1)/T.scored).toFixed(2)+' levels/trial':'—';}
const METERS=[
  {id:'M-ACC',name:'All constraints exact',get:()=>T.scored?`${T.correct}/${T.scored} · ${Math.round(100*T.correct/T.scored)}%`:'—'},
  {id:'M-POLY',name:'Constraints satisfied',get:()=>cur?`${currentPoly()} / ${cur.constraints}`:'—'},
  {id:'M-PATH',name:'Candidate placement path',get:()=>path.length?path.join(' → '):T.lastPath},
  {id:'M-PROG',name:'Constraint progress trajectory',get:()=>prog.length?prog.join(' → ')+'/'+cur.constraints:T.lastProg},
  {id:'M-PLANFUL',name:'Monotonic constraint search',get:()=>prog.length?planfulness():T.lastPlan},
  {id:'M-DIFFREACH',name:'Maximum branch depth solved',get:()=>T.maxLevel?`level ${T.maxLevel} / 6`:'—'},
  {id:'M-LEARNRATE',name:'Within-session ceiling growth',get:learnRate}
];
function buildMeters(){
  $('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');
  $('#dbar').innerHTML=Array.from({length:6},()=>'<i></i>').join('');
}
function renderMeters(){METERS.forEach(m=>{$('#v_'+m.id).textContent=m.get();});}
function updateDifficulty(){
  $('#dlabel').textContent=`${level} / 6`;
  [...$('#dbar').children].forEach((x,i)=>x.classList.toggle('on',i<level));
}
function log(msg){
  const d=document.createElement('div');
  d.innerHTML=`<span class="t">${new Date().toLocaleTimeString([],{minute:'2-digit',second:'2-digit'})}</span> ${msg}`;
  $('#log').appendChild(d);$('#log').scrollTop=$('#log').scrollHeight;
}
const PHASE={demo:'Watch the example',warmup:'Warm-up · not scored',scored:'Scored',done:'Done'};
function setCue(k,extra){const el=$('#phasecue');el.dataset.phase=k;el.textContent=extra?PHASE[k]+' '+extra:PHASE[k];}
function setStatus(kind,msg){const el=$('#status');if(!el)return;el.className=kind;el.textContent=msg;}
function startWarmup(){phase='warmup';locked=false;setCue('warmup');setStatus('neutral','Practice - this one is not scored.');renderItem(WARM);log('warm-up · two arms · unscored');}
function startScored(){phase='scored';locked=false;setCue('scored',(trial+1)+'/6');setStatus('neutral','Tap the group of shapes that balances every arm.');renderItem(ITEMS[level-1]);log(`item ${trial+1}/6 · level ${level} · ${cur.label}`);}
function finish(){phase='done';locked=true;setCue('done');setStatus('ok','\u2713 Done');$('#go').classList.remove('ready');log(`DONE · ${T.correct}/${T.scored} · ceiling ${T.maxLevel}`);}
const ghost=$('#ghost');
function ghostShow(on){ghost.classList.toggle('show',on);}
async function ghostTo(el){
  const r=el.getBoundingClientRect();
  ghost.style.transform=`translate(${r.left+r.width/2-12}px,${r.top+r.height/2-10}px)`;
  await sleep(470);
}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(330);}
async function runDemo(){
  phase='demo';locked=true;setCue('demo');setStatus('neutral','Watch the example, then try it yourself.');renderItem(DEMO);log('ghost-hand demo · wordless mobile cascade');
  ghostShow(true);await sleep(250);await ghostTo($('#branches .side.left'));await ghostTo($('#branches .side.right'));
  const key=cur.opts.findIndex(o=>o.key);
  await ghostTo(document.querySelector(`.option[data-i="${key}"]`));await ghostTap();choose(key,true);
  await ghostTo($('#go'));await ghostTap();feedback(true);await sleep(520);
  ghostShow(false);startWarmup();
}
$('#options').addEventListener('click',e=>{const b=e.target.closest('.option');if(b)choose(+b.dataset.i);});
$('#go').addEventListener('click',submit);
$('#replay').addEventListener('click',()=>{if(phase!=='demo')location.reload();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
