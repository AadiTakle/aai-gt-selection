<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CX-sjt-01 — What Would You Do?</title>
<style>
  :root{--bg:#0f1e19;--card:#152c25;--ink:#eafff4;--muted:#93c9b6;--acc:#57e39b;--gold:#ffd35c;}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 0%,#1c3a2f,#0f1e19)}
  header{padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  .badge{font-size:12px;color:var(--muted);border:1px solid #2f5a48;padding:2px 8px;border-radius:999px}
  .wrap{display:grid;grid-template-columns:1fr 330px;gap:16px;padding:0 20px 30px;max-width:1100px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .stage{background:var(--card);border-radius:18px;padding:18px;position:relative;min-height:440px}
  .phaseTag{position:absolute;top:12px;right:14px;font-size:12px;color:var(--gold);background:#24331f;border:1px solid #4f5f22;padding:3px 10px;border-radius:999px}
  .scene{font-size:70px;text-align:center;margin:10px 0}
  .story{text-align:center;font-size:17px;min-height:46px;max-width:520px;margin:0 auto 6px}
  .read{display:block;margin:0 auto 8px;background:#1d3a30;border:1px solid #2f5a48;color:#cdeede;border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:13px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:8px auto}
  @media(max-width:520px){.opts{grid-template-columns:1fr}}
  .opt{background:#0e211b;border:2px solid #2f5a48;border-radius:14px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:transform .1s}
  .opt:active{transform:scale(.98)}
  .opt.sel{border-color:var(--gold);background:#1a2c22}
  .opt .e{font-size:30px}
  .confirm{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap;min-height:20px}
  button.go{font:inherit;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font-weight:700;background:var(--acc);color:#043423}
  .outcome{text-align:center;font-size:16px;color:var(--gold);min-height:24px;margin-top:8px}
  .conf{display:flex;gap:10px;justify-content:center;margin-top:6px}
  .conf span{font-size:30px;cursor:pointer;filter:grayscale(.4);opacity:.7}
  .conf span:hover{filter:none;opacity:1}
  .ghost{position:absolute;font-size:38px;pointer-events:none;z-index:6;transition:left .7s ease,top .7s ease;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}
  .tele{background:#0e211b;border:1px solid #244f3f;border-radius:18px;padding:14px;height:fit-content;position:sticky;top:12px}
  .tele h3{margin:0 0 8px;font-size:14px;color:var(--gold);letter-spacing:.5px}
  .metrics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:12px;background:#152c25;border:1px solid #2f5a48;border-radius:8px;padding:4px 8px}
  .chip b{color:var(--gold)}
  .log{font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#b5e6d3;max-height:210px;overflow:auto;background:#0a1712;border-radius:10px;padding:8px}
  .log div{border-bottom:1px solid #16281f;padding:1px 0}
  .note{font-size:11px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>🤔 What Would You Do?</h1>
  <span class="badge">CX-sjt-01</span>
  <span class="badge">bands: K–1 · 2–3 · 4–5 · 6–8</span>
  <span class="badge">situational judgment</span>
</header>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="phaseTag" id="phaseTag">demo</div>
    <div class="scene" id="scene">🎬</div>
    <div class="story" id="story">Watch…</div>
    <button class="read" id="read" style="display:none">🔊 Read to me</button>
    <div class="opts" id="opts"></div>
    <div class="confirm" id="confirm"></div>
    <div class="outcome" id="outcome"></div>
    <div class="ghost" id="ghost" style="display:none">👆</div>
  </div>
  <div class="tele">
    <h3>LIVE TELEMETRY</h3>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="note">M-POLY (consensus-keyed partial credit), M-RT (decision time), M-EXPLORE (options considered), M-PATH (branch route), M-REV (changed mind), M-CONF (calibration).</div>
  </div>
</div>
<script>
const T={ev:[],m:{},t0:performance.now(),now(){return Math.round(performance.now()-this.t0)},
  log(a,d){const t=this.now();this.ev.push(Object.assign({t,a},d||{}));const el=document.getElementById('log');
    const line=document.createElement('div');line.textContent='+'+(t/1000).toFixed(2)+'s  '+a+(d?'  '+JSON.stringify(d):'');el.prepend(line);},
  set(k,v){this.m[k]=v;this.render();},
  render(){document.getElementById('metrics').innerHTML=Object.entries(this.m).map(([k,v])=>'<span class="chip"><b>'+k+'</b> '+v+'</span>').join('');}};
const $=s=>document.querySelector(s);
const scene=$('#scene'),story=$('#story'),opts=$('#opts'),confirm=$('#confirm'),outcome=$('#outcome'),ghost=$('#ghost'),phaseTag=$('#phaseTag');

/* consensus-keyed scenarios: score 0 (poor) .. 2 (best) */
const WARM={scene:'🐶',text:'You find a lost puppy in the park. What do you do?',
  opts:[{e:'🧑‍🦰',label:'Tell a grown-up',score:2,out:'Good thinking — a grown-up can help find its owner.'},
        {e:'🏃',label:'Run away',score:0,out:'The puppy is still lost…'},
        {e:'🍬',label:'Give it candy',score:0,out:'Candy is not safe for puppies.'}]};
const ITEMS=[
 {scene:'🍽️😟',text:'A new kid is sitting all alone at lunch. What is the BEST thing to do?',
  opts:[
   {e:'🙋',label:'Invite them to sit with you',score:2,out:'They smile — but seem shy.',
     follow:{text:'They came over but seem shy and quiet. Now what?',
       opts:[{e:'❓',label:'Ask them a friendly question',score:2,out:'Great! You help them open up.'},
             {e:'👀',label:'Only talk to your own friends',score:1,out:'They stay quiet — a missed chance.'},
             {e:'📱',label:'Look at your tablet instead',score:0,out:'They feel alone again.'}]}},
   {e:'🚶',label:'Ignore them',score:0,out:'They keep sitting alone.'},
   {e:'😆',label:'Point and laugh',score:0,out:'That hurts their feelings.'},
   {e:'🚫',label:'Say the seat is taken',score:0,out:'They walk away sadly.'}]},
 {scene:'😩📚',text:'Your big project is really hard AND really boring. What do you do?',
  opts:[
   {e:'☕',label:'Take a short break, then keep going',score:2,out:'Smart — you come back refreshed.',
     follow:{text:'You are back but still stuck on one hard part. Now what?',
       opts:[{e:'🔍',label:'Try a new way to solve it',score:2,out:'You find a path forward!'},
             {e:'🙋',label:'Ask for one hint',score:2,out:'A hint gets you unstuck — good self-advocacy.'},
             {e:'😴',label:'Put your head down',score:0,out:'The project stays unfinished.'}]}},
   {e:'🙋',label:'Ask a grown-up for help',score:2,out:'Asking for help is a strong choice.'},
   {e:'🏳️',label:'Give up',score:0,out:'The project does not get done.'},
   {e:'📋',label:'Copy a friend',score:0,out:'You did not learn it — and it is not fair.'}]}
];

let idx=0,scored=false,totalScore=0,maxScore=0,considered=new Set(),revisions=0,sel=null,tStart=0,curFollow=null;
T.set('phase','demo');T.set('judgment_M-POLY','0');T.set('decision_time_M-RT','–');T.set('options_considered_M-EXPLORE',0);T.set('changed_mind_M-REV',0);

function speak(t){try{if(window.speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t));}}catch(e){}}
function renderScenario(sc,isScored){
  scene.textContent=sc.scene;story.textContent=sc.text;outcome.textContent='';confirm.innerHTML='';
  $('#read').style.display='inline-block';$('#read').onclick=()=>{T.log('read_aloud');speak(sc.text);};
  opts.innerHTML='';sel=null;considered=new Set();tStart=performance.now();
  sc.opts.forEach((o,i)=>{
    const d=document.createElement('div');d.className='opt';d.innerHTML='<span class="e">'+o.e+'</span><span>'+o.label+'</span>';
    d.onclick=()=>{
      if(sel!==null&&sel!==i&&isScored){revisions++;T.set('changed_mind_M-REV',revisions);}
      sel=i;considered.add(i);
      [...opts.children].forEach(c=>c.classList.remove('sel'));d.classList.add('sel');
      if(isScored)T.set('options_considered_M-EXPLORE',considered.size);
      T.log('consider_option',{label:o.label});
      confirm.innerHTML='<button class="go">Do it! →</button>';
      confirm.firstChild.onclick=()=>choose(sc,o,isScored);
    };
    opts.appendChild(d);
  });
}
function choose(sc,o,isScored){
  const rt=Math.round(performance.now()-tStart);
  outcome.textContent=o.out;
  if(isScored){totalScore+=o.score;maxScore+=2;
    T.set('judgment_M-POLY',totalScore+'/'+maxScore);T.set('decision_time_M-RT',(rt/1000).toFixed(2)+'s');
    T.log('CHOICE',{label:o.label,consensus_score:o.score,rt_ms:rt,considered:considered.size});
  } else {T.log('warmup_choice',{label:o.label});}
  confirm.innerHTML='';
  if(o.follow){
    curFollow=o.follow;
    if(isScored)askConfidence(()=>{setTimeout(()=>renderScenario({scene:sc.scene,text:o.follow.text,opts:o.follow.opts},isScored),200);});
    else setTimeout(()=>renderScenario({scene:sc.scene,text:o.follow.text,opts:o.follow.opts},isScored),900);
  } else {
    if(isScored)askConfidence(()=>next());
    else setTimeout(()=>next(),900);
  }
}
function askConfidence(cb){
  outcome.innerHTML+='<div class="conf" id="conf">How sure were you? <span data-c="1">😐</span><span data-c="2">🙂</span><span data-c="3">😄</span></div>';
  $('#conf').querySelectorAll('span').forEach(s=>s.onclick=()=>{T.log('confidence_M-CONF',{level:+s.dataset.c});cb();});
  // auto-advance if ignored
  setTimeout(()=>{if(document.getElementById('conf')){cb();}},4000);
}
function next(){
  if(!scored){startItems();return;}
  idx++;
  if(idx>=ITEMS.length){return finish();}
  phaseTag.textContent='scenario '+(idx+1)+'/'+ITEMS.length;
  T.log('phase_scenario',{n:idx+1});renderScenario(ITEMS[idx],true);
}

/* ---- flow ---- */
function runGhost(){
  ghost.style.display='block';scene.textContent='🍎🧑‍🎓';story.textContent='';
  const demoStory='Someone dropped their lunch tray!';story.textContent=demoStory;
  opts.innerHTML='';
  const o1=document.createElement('div');o1.className='opt';o1.innerHTML='<span class="e">🤝</span><span>Help pick it up</span>';
  const o2=document.createElement('div');o2.className='opt';o2.innerHTML='<span class="e">🚶</span><span>Walk away</span>';
  opts.appendChild(o1);opts.appendChild(o2);
  const stage=$('#stage').getBoundingClientRect();
  const R=el=>{const r=el.getBoundingClientRect();return[r.left-stage.left+r.width/2-19,r.top-stage.top+r.height/2-19];};
  setTimeout(()=>{const[x,y]=R(o1);ghost.style.left=x+'px';ghost.style.top=y+'px';
    setTimeout(()=>{o1.classList.add('sel');outcome.textContent='😊 They smile — good choice!';
      setTimeout(()=>{ghost.style.display='none';startWarm();},1400);},900);},700);
}
function startWarm(){
  scored=false;phaseTag.textContent='warm-up (practice)';outcome.textContent='';
  T.set('phase','warm-up');T.log('phase_warmup');
  renderScenario(WARM,false);
}
function startItems(){
  scored=true;idx=0;totalScore=0;maxScore=0;revisions=0;phaseTag.textContent='scenario 1/'+ITEMS.length;
  T.set('phase','scored');T.set('judgment_M-POLY','0');T.set('changed_mind_M-REV',0);
  T.log('phase_scored');renderScenario(ITEMS[0],true);
}
function finish(){
  T.log('SESSION_END',{judgment:totalScore+'/'+maxScore,revisions:revisions});
  scene.textContent='🌟';story.innerHTML='<b style="color:var(--gold)">All done — nice choices!</b>';
  $('#read').style.display='none';opts.innerHTML='';confirm.innerHTML='';
  outcome.innerHTML='<div class="note">Judgment score '+totalScore+'/'+maxScore+' (keyed to an expert-consensus scale, partial credit). '+
    'Branching consequences + decision timing make social/practical judgment measurable — a dimension a reasoning test never touches. '+
    '<b>Caveat:</b> choices are semi-self-report, so we also watch timing and force trade-offs to resist "pick the nice answer" gaming.</div>'+
    '<div class="confirm"><button class="go" onclick="location.reload()">↺ Play again</button></div>';
  T.set('phase','done');
}
window.addEventListener('blur',()=>T.log('off_task_blur (M-ENGAGE)'));
runGhost();
</script>
</body>
</html>
