<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUANT-TARGET-01 · Make the Number</title>
<style>
  :root{--bg1:#eafff3;--bg2:#eaf1ff;--ink:#22304a;--card:#fff;--accent:#2f9e6e;--accent2:#5b6cff;--good:#22b573;--bad:#ff6b6b;--tel-bg:#0f1a22;--tel-ink:#bfeede;--tel-key:#7fffcf;--tel-dim:#6f8b83;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #3a6a55;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:600px;width:100%}
  #target{font-size:22px;color:#5a6b8a}
  #target b{font-size:46px;color:var(--accent);display:inline-block;min-width:80px;text-align:center;transition:.2s}
  #target b.hit{color:#fff;background:var(--good);border-radius:14px;padding:0 12px;box-shadow:0 8px 22px -8px var(--good)}
  #tray{min-height:64px;min-width:280px;border-radius:14px;background:#f5f8ff;border:2px dashed #ccd6ee;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;font-size:26px;flex-wrap:wrap}
  #tray .tok{background:#fff;border-radius:10px;padding:4px 12px;box-shadow:0 4px 10px -6px #6a74b0;font-weight:700}
  #tray .eq{color:#8a93b5}
  #result{font-weight:800}
  .tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .tile{width:58px;height:58px;border-radius:14px;border:2px solid #d3ddf3;background:#fff;font-size:24px;font-weight:800;color:var(--accent2);cursor:pointer}
  .ops{display:flex;gap:10px}
  .op{width:52px;height:52px;border-radius:50%;border:2px solid #d3ddf3;background:#fff;font-size:24px;font-weight:800;color:#c25b8a;cursor:pointer}
  #tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:14px}
  #bank{padding:11px 20px;background:var(--good);color:#fff;font-weight:700;opacity:.4;pointer-events:none}
  #bank.ready{opacity:1;pointer-events:auto}
  #clear{padding:11px 18px;background:#eef1ff;color:#5b6cff;font-weight:700}
  #done{padding:11px 18px;background:var(--accent2);color:#fff;font-weight:700}
  #replay{width:46px;height:46px;border-radius:50%;background:#eef1ff;color:#5b6cff;font-size:20px}
  #banked{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:26px;font-size:14px}
  #banked .b{background:#eafaf1;border:1px solid #b8e6cd;border-radius:8px;padding:2px 8px;color:#1c7a4f}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;transition:transform .6s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#15242e;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #23343c;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#7fae9d;font-size:11px;letter-spacing:.08em}
  #log{height:190px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #1e2d34}#log .t{color:#5c7a70}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">QUANT-TARGET-01 · Make the Number</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="target">make <b id="tgt">5</b></div>
      <div id="tray"><span style="color:#b6c0d8">tap tiles &amp; signs…</span></div>
      <div class="ops"><button class="op" data-op="+">+</button><button class="op" data-op="-">−</button><button class="op" data-op="*">×</button></div>
      <div class="tiles" id="tiles"></div>
      <div id="tools">
        <button id="replay" title="replay demo">↻</button>
        <button id="clear">Clear</button>
        <button id="bank">Bank ✓</button>
        <button id="done">Done</button>
      </div>
      <div id="banked"></div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const OPSYM={'+':'+','-':'−','*':'×'};
function evalTokens(tok){if(!tok.length)return null;let v=tok[0];for(let i=1;i<tok.length;i+=2){const op=tok[i],n=tok[i+1];if(n==null)break;v=op==='+'?v+n:op==='-'?v-n:v*n;}return v;}
/* BFS optimal tiles-used to reach target (left-to-right eval, tiles reusable) */
function optimalTiles(target,tiles,ops,maxTiles=5){let frontier=tiles.map(t=>({v:t,used:1}));const seen=new Set(frontier.map(f=>f.v));
  for(let f of frontier)if(f.v===target)return 1;
  for(let depth=2;depth<=maxTiles;depth++){const nf=[];for(const st of frontier)for(const op of ops)for(const t of tiles){let v=op==='+'?st.v+t:op==='-'?st.v-t:st.v*t;if(v<-50||v>200)continue;const key=v+':'+depth;if(v===target)return depth;nf.push({v,used:depth});}frontier=nf;}
  return maxTiles;}

/* telemetry */
const T={hits:0,attempts:0,path:[],banks:[],effs:[],persist:[],maxTarget:0,itemStart:0,itemHitTime:null};
function effStr(){if(!T.effs.length)return '\u2014';return `${mean(T.effs.map(e=>Math.round(100*e.opt/e.used)))}% (tiles opt/used)`;}
const METERS=[
 {id:'M-ACC',name:'Targets hit (exact) / items',get:()=>T.attempts?`${T.hits}/${T.attempts}`:'\u2014'},
 {id:'M-PATH',name:'Last build sequence',get:()=>T.path.length?T.path.join(''):'\u2014'},
 {id:'M-EFF',name:'Expression elegance vs optimal',get:()=>effStr()},
 {id:'M-EXPLORE',name:'Distinct solutions banked (this item)',get:()=>curBank.length+''},
 {id:'M-PERSIST',name:'Time-on-item before first hit (mean)',get:()=>T.persist.length?mean(T.persist)+' ms':'\u2014'},
 {id:'M-DIFFREACH',name:'Largest target hit',get:()=>T.maxTarget||'\u2014'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');const ghostShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(560);}

let phase='demo',target=5,tiles=[2,3],tok=[],expectNum=true,curBank=[],seq=[],si=0;
function setCue(i){$('#phasecue').textContent=i;}
function paintTiles(){$('#tiles').innerHTML=tiles.map(t=>`<button class="tile" data-n="${t}">${t}</button>`).join('');}
function renderTray(){const wrap=$('#tray');if(!tok.length){wrap.innerHTML='<span style="color:#b6c0d8">tap tiles &amp; signs…</span>';return;}
  let h=tok.map(x=>`<span class="tok">${typeof x==='number'?x:OPSYM[x]}</span>`).join('');const v=evalTokens(tok);
  if(v!=null&&expectNum)h+=`<span class="eq">=</span><span class="tok" id="result">${v}</span>`;wrap.innerHTML=h;
  const hit=(v===target&&expectNum);$('#tgt').classList.toggle('hit',hit);$('#bank').classList.toggle('ready',hit);}
function tapNum(n){if(phase==='demo'||phase==='done'||!expectNum)return;tok.push(n);expectNum=false;T.path.push(n);renderTray();renderMeters();}
function tapOp(op){if(phase==='demo'||phase==='done'||expectNum||!tok.length)return;tok.push(op);expectNum=true;T.path.push(OPSYM[op]);renderTray();}
function clearTray(){if(phase==='demo'||phase==='done')return;tok=[];expectNum=true;T.path.push('|');renderTray();$('#bank').classList.remove('ready');$('#tgt').classList.remove('hit');}
function bank(){const v=evalTokens(tok);if(v!==target||!expectNum)return;const expr=tok.map(x=>typeof x==='number'?x:OPSYM[x]).join(' ');
  if(curBank.includes(expr)){log('already banked that one');return;}
  curBank.push(expr);const used=tok.filter(x=>typeof x==='number').length;const opt=optimalTiles(target,tiles,['+','-','*']);
  T.effs.push({used,opt});$('#banked').innerHTML=curBank.map(e=>`<span class="b">${e} = ${target}</span>`).join('');
  if(T.itemHitTime===null){T.itemHitTime=Date.now();T.persist.push(Date.now()-T.itemStart);T.maxTarget=Math.max(T.maxTarget,target);}
  log(`BANK ✓  ${expr} = ${target} (used ${used} tiles, optimal ${opt})`);tok=[];expectNum=true;renderTray();renderMeters();}
function doneItem(){if(phase==='demo'||phase==='done')return;T.attempts++;if(curBank.length)T.hits++;
  log(`item done · ${curBank.length} solution(s) found for ${target}`);renderMeters();si++;si<seq.length?startItem(seq[si]):finish();}
function startItem(cfg){phase=cfg.warm?'warmup':'scored';target=cfg.target;tiles=cfg.tiles;tok=[];expectNum=true;curBank=[];T.path=[];T.itemStart=Date.now();T.itemHitTime=null;
  $('#tgt').textContent=target;$('#banked').innerHTML='';paintTiles();renderTray();renderMeters();setCue(cfg.warm?'\u2b50':'\ud83c\udfaf');
  log(`— ${cfg.warm?'warm-up':'SCORED'}: make ${target} from tiles [${tiles.join(', ')}] · find more than one way! —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');log(`— DONE · hits ${T.hits}/${T.attempts} · largest ${T.maxTarget} —`);}
async function runDemo(){phase='demo';si=0;target=5;tiles=[2,3];tok=[];expectNum=true;curBank=[];$('#tgt').textContent=5;$('#banked').innerHTML='';paintTiles();renderTray();T.itemStart=Date.now();
  log('ghost-hand demo (wordless): tap 2, tap +, tap 3 → 5 lights up → Bank');ghostShow(true);await sleep(300);
  await ghostTo($('.tile[data-n="2"]'));tok=[2];expectNum=false;renderTray();await sleep(300);
  await ghostTo($('.op[data-op="+"]'));tok.push('+');expectNum=true;renderTray();await sleep(300);
  await ghostTo($('.tile[data-n="3"]'));tok.push(3);expectNum=false;renderTray();await sleep(400);
  await ghostTo($('#bank'));$('#banked').innerHTML='<span class="b">2 + 3 = 5</span>';await sleep(500);
  ghostShow(false);tok=[];expectNum=true;renderTray();$('#banked').innerHTML='';log('demo done — your turn (warm-up)');
  seq=[{warm:true,target:6,tiles:[2,3,4]},{target:12,tiles:[2,3,4,5]},{target:24,tiles:[2,3,4,6]}];startItem(seq[0]);}
$('#tiles').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)tapNum(+t.dataset.n);});
$$('.op').forEach(o=>o.addEventListener('click',()=>tapOp(o.dataset.op)));
$('#clear').addEventListener('click',clearTray);
$('#bank').addEventListener('click',()=>{if($('#bank').classList.contains('ready'))bank();});
$('#done').addEventListener('click',doneItem);
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
