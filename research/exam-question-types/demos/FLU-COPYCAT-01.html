<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-COPYCAT-01 · Copy Machine</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#fff0ea;--ink:#26304a;--card:#fff;--accent:#f5883a;--accent2:#5b6cff;--good:#22b573;--bad:#ff6b6b;--socket:#c9d3ef;--steel:#cfd8ea;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:26px;padding:20px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:600px;width:100%}
  #example{display:flex;gap:10px;align-items:center;justify-content:center;background:linear-gradient(160deg,#eef7ff,#f3eeff);border:2px dashed #c9d6f5;border-radius:14px;padding:8px 16px}
  #example .lab{font-size:11px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700;margin-right:4px}
  .cell{background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;width:66px;height:66px;box-shadow:0 2px 0 #eef1f8 inset}
  .arrow{font-size:22px;color:#8ea0d6}
  .machine{position:relative;width:280px;display:flex;flex-direction:column;align-items:center}
  .funnel{width:0;height:0;border-left:52px solid transparent;border-right:52px solid transparent;border-top:34px solid var(--steel)}
  .inslot{position:absolute;top:-58px;left:50%;transform:translateX(-50%);}
  .inslot.drop{animation:drop 1s ease forwards}
  @keyframes drop{0%{transform:translate(-50%,0)}70%{transform:translate(-50%,58px) scale(.7);opacity:.85}100%{transform:translate(-50%,58px) scale(.3);opacity:0}}
  .body{width:240px;height:96px;background:linear-gradient(160deg,#e7edfb,#d3ddf3);border:3px solid #b7c4e6;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 10px 24px -14px #46508a}
  .gear{font-size:40px;display:inline-block}
  .machine.whir .gear{animation:spin .5s linear infinite}
  .machine.whir .body{animation:rumble .12s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rumble{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  .chute{width:150px;height:22px;background:var(--steel);border-radius:0 0 12px 12px;margin-top:-2px}
  #tray{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-height:90px;align-items:center}
  #tray .hint{color:#9aa6c8;font-size:14px}
  .opt{background:#fff;border:3px solid #e2e8fb;border-radius:16px;width:84px;height:84px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent;opacity:0;transform:translateY(14px)}
  .opt.in{opacity:1;transform:translateY(0)}
  .opt:hover{transform:translateY(-3px);border-color:#c3ccf5}
  .opt.sel{border-color:var(--accent);box-shadow:0 0 0 4px #ffe0c7;transform:translateY(-3px)}
  .opt.correct{border-color:var(--good);box-shadow:0 0 0 4px #b4ecd0}
  .opt.wrong{border-color:var(--bad);box-shadow:0 0 0 4px #ffd0d0}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:72px;height:72px;background:var(--good);color:#fff;font-size:30px;box-shadow:0 10px 24px -8px var(--good);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:50px;height:50px;background:#eef1ff;color:#5b6cff;font-size:22px}
  .shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;transition:transform .7s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:200px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-COPYCAT-01 · Copy Machine</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="example"><span class="lab">machine did</span><div class="cell" id="Acell"></div><div class="arrow">➜</div><div class="cell" id="Bcell"></div></div>
      <div class="machine" id="machine">
        <div class="inslot" id="inslot"><div class="cell" id="Ccell"></div></div>
        <div class="funnel"></div>
        <div class="body"><span class="gear">⚙️</span><span class="gear">⚙️</span></div>
        <div class="chute"></div>
      </div>
      <div id="tray"><span class="hint">…</span></div>
      <div id="controls">
        <button id="replay" title="replay demo">↻</button>
        <button id="go" title="submit">✓</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,last=a=>a[a.length-1];
const PAL={red:'#e6194b',green:'#2ca25f',blue:'#4363d8',orange:'#f58231',purple:'#911eb4'};
const COLORKEYS=Object.keys(PAL),SH=['circle','square','triangle','diamond','star','hexagon'];
const TSET=['shrink','addcount','shade','recolor'];
function polyPts(cx,cy,r,n,rot){let p=[];for(let i=0;i<n;i++){let a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function starPts(cx,cy,r,n){let p=[];for(let i=0;i<2*n;i++){let rr=i%2?r*0.45:r;let a=-Math.PI/2+i*Math.PI/n;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(' ');}
function oneShape(shape,color,cx,cy,r,fill){const solid=fill!=='outline';const f=solid?`fill="${color}"`:`fill="none" stroke="${color}" stroke-width="4"`;switch(shape){
  case 'circle':return `<circle cx="${cx}" cy="${cy}" r="${r}" ${f}/>`;
  case 'square':return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="3" ${f}/>`;
  case 'triangle':return `<polygon points="${polyPts(cx,cy,r,3,-Math.PI/2)}" ${f}/>`;
  case 'diamond':return `<polygon points="${polyPts(cx,cy,r,4,-Math.PI/2)}" ${f}/>`;
  case 'hexagon':return `<polygon points="${polyPts(cx,cy,r,6,-Math.PI/2)}" ${f}/>`;
  case 'star':return `<polygon points="${starPts(cx,cy,r,5)}" ${f}/>`;}return '';}
function tileSVG(a,box=76){const color=PAL[a.color]||a.color,n=a.count||1,sc=a.size||1,fill=a.fill||'solid';let inner='';
  if(n===1)inner=oneShape(a.shape,color,box/2,box/2,box*0.30*sc,fill);
  else{const pos=[[.3,.5],[.7,.5]];const r=box*.16*sc;pos.slice(0,n).forEach(p=>inner+=oneShape(a.shape,color,p[0]*box,p[1]*box,r,fill));}
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${inner}</svg>`;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function clone(a){return{...a};}
function norm(a){return{shape:a.shape,color:a.color,count:a.count||1,size:a.size||1,fill:a.fill||'solid'};}
function eqAttr(a,b){a=norm(a);b=norm(b);return a.shape===b.shape&&a.color===b.color&&a.count===b.count&&Math.abs(a.size-b.size)<.01&&a.fill===b.fill;}
function applyT(a,t){switch(t){
  case 'shrink':a.size=Math.max(0.55,(a.size||1)*0.6);break;
  case 'addcount':a.count=Math.min(2,(a.count||1)+1);break;
  case 'shade':a.fill=(a.fill==='outline')?'solid':'outline';break;
  case 'recolor':{const i=COLORKEYS.indexOf(a.color);a.color=COLORKEYS[(i+2)%COLORKEYS.length];break;}}return a;}
function applyTs(a,ts){ts.forEach(t=>a=applyT(a,t));return a;}
/* predicate: did output reflect transform t relative to input C? (for M-RULEID) */
function reflects(C,out,t){switch(t){
  case 'shrink':return (out.size||1)<(C.size||1)-.01;
  case 'addcount':return (out.count||1)>(C.count||1);
  case 'shade':return (out.fill||'solid')!==(C.fill||'solid');
  case 'recolor':return out.color!==C.color;}return false;}
function rulesSatisfied(C,out,ts){return ts.reduce((n,t)=>n+(reflects(C,out,t)?1:0),0);}

/* ---------- item generation (AIG): infer machine transform from A->B, apply to C ---------- */
function genItem(nT,forced){const ts=forced?forced.ts:shuffle(TSET).slice(0,nT);
  const cols=shuffle(COLORKEYS),shapes=shuffle(SH);
  const shA=forced?forced.shA:shapes[0], shC=forced?forced.shC:shapes[1];
  const A={shape:shA,color:cols[0],count:1,size:1,fill:'solid'};
  const C={shape:shC,color:cols[1],count:1,size:1,fill:'solid'};
  const B=applyTs(clone(A),ts), correct=applyTs(clone(C),ts);
  const opts=[{attr:correct,tag:'correct'}];
  opts.push({attr:clone(C),tag:'no-change'});
  if(ts.length>=2){opts.push({attr:applyT(clone(C),ts[0]),tag:'partial'});}
  else{const other=TSET.filter(t=>!ts.includes(t))[0];opts.push({attr:applyT(clone(C),other),tag:'wrong-transform'});}
  // ensure distinct + fill to 3
  let g=0;while(opts.length<3&&g++<12){const o=applyT(clone(C),TSET[(Math.random()*TSET.length)|0]);if(!opts.some(x=>eqAttr(x.attr,o)))opts.push({attr:o,tag:'wrong-transform'});}
  for(let i=1;i<opts.length;i++){let s=0;while(opts.slice(0,i).some(o=>eqAttr(o.attr,opts[i].attr))&&s++<8){opts[i].attr=applyT(opts[i].attr,TSET[(Math.random()*TSET.length)|0]);}}
  return {ts,A,B,C,correct,options:shuffle(opts)};}
function errType(tag){return tag==='no-change'?'near-miss (nothing changed)':tag==='partial'?'near-miss (only one change)':tag==='wrong-transform'?'near-miss (wrong change)':tag==='correct'?'none':'random';}

/* ---------- telemetry: M-ACC, M-RT, M-RTFIRST, M-ERRTYPE, M-RULEID ---------- */
const T={scored:0,correct:0,rts:[],firstLat:null,lastErr:'\u2014',itemStart:0,firstActed:false,ruleStr:'\u2014'};
const METERS=[
 {id:'M-ACC',name:'Item accuracy (running)',get:()=>T.scored?`${T.correct}/${T.scored}  ${Math.round(100*T.correct/T.scored)}%`:'\u2014'},
 {id:'M-RT',name:'Response time — total',get:()=>T.rts.length?`${last(T.rts)} ms  (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency (infer before act)',get:()=>T.firstLat==null?'\u2014':T.firstLat+' ms'},
 {id:'M-ERRTYPE',name:'Error type (transform foil)',get:()=>T.lastErr},
 {id:'M-RULEID',name:'Rule dimensionality solved',get:()=>T.ruleStr},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(700);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(480);}

/* ---------- flow ---------- */
let phase='demo',cur=null,staged=-1,locked=false,scoredIndex=0;
const scoredItems=[genItem(1),genItem(2)];
function setCue(i){$('#phasecue').textContent=i;}
async function whir(){const m=$('#machine');$('#inslot').classList.add('drop');m.classList.add('whir');await sleep(1000);m.classList.remove('whir');$('#inslot').classList.remove('drop');}
async function revealOptions(item){const tray=$('#tray');tray.innerHTML='';item.options.forEach((o,i)=>{const b=document.createElement('div');b.className='opt';b.dataset.i=i;b.innerHTML=tileSVG(o.attr);tray.appendChild(b);});
  const els=$$('#tray .opt');for(let i=0;i<els.length;i++){await sleep(120);els[i].classList.add('in');}}
function paintExample(item){$('#Acell').innerHTML=tileSVG(item.A,60);$('#Bcell').innerHTML=tileSVG(item.B,60);}
function paintInput(item){$('#Ccell').innerHTML=tileSVG(item.C);}
async function startItem(item){cur=item;staged=-1;T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;T.ruleStr='\u2014';
  paintExample(item);paintInput(item);$('#tray').innerHTML='<span class="hint">…</span>';$('#go').classList.remove('ready');renderMeters();
  await whir();await revealOptions(item);}
function onOpt(el){if(locked||phase==='demo'||phase==='done')return;const idx=+el.dataset.i;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first tap · output '+idx);}
  staged=idx;$$('#tray .opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');
  $('#go').classList.add('ready');}
function feedback(correct){const opt=$$('#tray .opt')[staged];if(opt)opt.classList.add(correct?'correct':'wrong');
  if(!correct){$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),450);const ci=cur.options.findIndex(o=>o.tag==='correct');$$('#tray .opt')[ci].classList.add('correct');}
  locked=true;$('#go').classList.remove('ready');}
function submit(){if(staged===-1)return;const opt=cur.options[staged];const rt=Date.now()-T.itemStart;const correct=opt.tag==='correct';
  const solved=rulesSatisfied(cur.C,opt.attr,cur.ts);T.ruleStr=`${solved} of ${cur.ts.length} rule(s)`;
  if(phase==='warmup'){feedback(correct);log('warm-up '+(correct?'correct':'incorrect')+' — UNSCORED');setTimeout(nextPhase,950);return;}
  T.scored++;T.rts.push(rt);if(correct)T.correct++;T.lastErr=errType(opt.tag);
  feedback(correct);
  log(`SUBMIT item ${scoredIndex+1} (${cur.ts.join('+')}) \u2192 ${correct?'CORRECT':'wrong ['+opt.tag+']'} · RT ${rt}ms · bound ${solved}/${cur.ts.length}`);
  renderMeters();setTimeout(nextPhase,1200);}
function nextPhase(){locked=false;if(phase==='warmup'){scoredIndex=0;startScored();}else if(phase==='scored'){scoredIndex++;scoredIndex<scoredItems.length?startScored():finish();}}
async function startWarmup(){phase='warmup';setCue('\u2b50');log('— warm-up (unscored): one change —');await startItem(genItem(1,{ts:['shrink']}));}
async function startScored(){phase='scored';setCue('\ud83c\udfaf');const it=scoredItems[scoredIndex];log(`— SCORED item ${scoredIndex+1}: ${it.ts.length} change(s) [${it.ts.join('+')}] —`);await startItem(it);}
function finish(){phase='done';setCue('\ud83c\udfc6');locked=true;log(`— DONE · accuracy ${T.correct}/${T.scored} —`);}
async function runDemo(){phase='demo';setCue('\ud83d\udc41\ufe0f');locked=true;
  const d=genItem(1,{ts:['shrink'],shA:'circle',shC:'square'});log('ghost-hand demo (wordless, <10s): watch the machine shrink it');
  await startItem(d);const ci=d.options.findIndex(o=>o.tag==='correct');
  ghostShow(true);await sleep(200);await ghostTo($('#Acell'));await sleep(120);await ghostTo($('#Bcell'));await sleep(200);
  await ghostTo($('#Ccell'));await sleep(200);await ghostTo($$('#tray .opt')[ci]);await ghostTap();
  staged=ci;$$('#tray .opt')[ci].classList.add('correct','sel');
  await sleep(500);await ghostTo($('#go'));await ghostTap();await sleep(350);ghostShow(false);await sleep(500);startWarmup();}
$('#tray').addEventListener('click',e=>{const o=e.target.closest('.opt');if(o)onOpt(o);});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
