<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUANT-BEADRACK-01 — Bead Rack Reasoner</title>
<style>
:root{--bg:#0f1226;--panel:#1b2140;--panel2:#232a52;--accent:#5eead4;--accent2:#f59e0b;--good:#4ade80;--bad:#f87171;--ink:#eef1ff;--muted:#9aa3c7}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 20% -10%,#26305e,#0f1226 60%);min-height:100vh}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1120px;margin:0 auto;padding:18px}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid #313a6b;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.phasebar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#2b336a;color:var(--muted);border:1px solid #3a447f}
.pill.on{background:var(--accent);color:#053;font-weight:700}
.prompt{font-size:15px;color:var(--muted);min-height:22px;margin:6px 0 10px;text-align:center}
.terms{display:flex;flex-direction:column;gap:8px;align-items:center;margin-bottom:12px}
.rack{background:#171d3d;border:1px solid #333c72;border-radius:12px;padding:8px 10px;display:inline-flex;flex-direction:column;gap:6px}
.rrow{display:flex;gap:4px}
.bead{width:20px;height:20px;border-radius:50%;background:#39406e;border:1px solid #4a5288;transition:transform .12s,background .15s}
.bead.on{background:radial-gradient(circle at 35% 30%,#a7f3d0,#34d399);border-color:#10b981}
.bead.on.hi{background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b);border-color:#d97706}
.ans .bead{cursor:pointer}.ans .bead:hover{transform:scale(1.12);border-color:var(--accent)}
.cnt{font-weight:800;font-size:15px;text-align:center;color:var(--accent2);min-height:20px}
.lbl{font-size:12px;color:var(--muted);text-align:center}
.cmp{display:flex;gap:24px;justify-content:center;align-items:center;margin-bottom:8px}
.cmpbox{cursor:pointer;border-radius:14px;padding:6px;border:2px solid transparent}
.cmpbox:hover{border-color:var(--accent)}
.cmpbox.right{border-color:var(--good)}.cmpbox.wrong{border-color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:6px;flex-wrap:wrap}
button.act{font:600 15px system-ui;padding:10px 18px;border-radius:12px;border:0;cursor:pointer;background:var(--accent);color:#053}
button.act.ghost{background:#2b336a;color:var(--ink);border:1px solid #3a447f}
button.act:disabled{opacity:.4;cursor:default}
.fb{min-height:26px;text-align:center;font-weight:700;margin-top:10px}.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.hand{position:fixed;font-size:30px;z-index:20;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:left .5s cubic-bezier(.4,0,.2,1),top .5s ease;opacity:0}
.tele{font-size:13px}.tele h2{font-size:14px;margin:0 0 8px;color:var(--accent)}
.metrics{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-bottom:10px}
.metrics div:nth-child(odd){color:var(--muted)}.metrics b{font-variant-numeric:tabular-nums}
.log{height:236px;overflow:auto;background:#12172f;border:1px solid #2a336a;border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-acc{color:var(--good)}.t-err{color:var(--bad)}.t-evt{color:#9fb0ff}.t-sys{color:var(--muted)}
.legend{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <h1>Bead Rack Reasoner</h1>
    <div class="sub">Slide beads to continue the count, or tap the rack that shows MORE.</div>
    <div class="phasebar" id="phasebar"></div>
    <div class="prompt" id="prompt"></div>
    <div class="terms" id="terms"></div>
    <div class="cmp" id="cmp" style="display:none"></div>
    <div class="row">
      <button class="act" id="lockBtn" style="display:none">Lock it in</button>
      <button class="act ghost" id="nextBtn" style="display:none">Next</button>
    </div>
    <div class="fb" id="fb"></div>
    <div class="hand" id="hand">&#128070;</div>
  </main>
  <aside class="card tele">
    <h2>Live telemetry</h2>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="legend">Logs <b>M-ACC</b>, <b>M-RTFIRST</b> (plan time before first bead), <b>M-DIFFREACH</b> (hardest series step solved), <b>M-SPEEDACC</b> (correct &amp; in-band taps), <b>M-CONSIST</b> (matched-clone agreement).</div>
  </aside>
</div>
<script>
(function(){
  "use strict";
  var el=function(id){return document.getElementById(id)};
  var terms=el('terms'),cmp=el('cmp'),hand=el('hand'),prompt=el('prompt'),fb=el('fb'),lockBtn=el('lockBtn'),nextBtn=el('nextBtn');
  var T0=Date.now();function perf(){return Date.now()-T0;}
  var BAND=4000; // per-child adaptive RT band (demo constant)
  var Tel={scored:0,correct:0,firstSum:0,firstN:0,diffMax:0,inband:0,groupRes:{},
    push:function(c,m){var d=document.createElement('div');d.className=c;d.textContent='['+(perf()/1000).toFixed(2)+'s] '+m;var L=el('log');L.appendChild(d);L.scrollTop=L.scrollHeight;},
    consist:function(){var g=this.groupRes,ks=Object.keys(g),p=0,a=0;ks.forEach(function(k){if(g[k].length>=2){p++;if(g[k].every(function(x){return x===g[k][0];}))a++;}});return p?Math.round(100*a/p)+'% ('+a+'/'+p+')':'—';},
    render:function(){
      var acc=this.scored?Math.round(100*this.correct/this.scored)+'% ('+this.correct+'/'+this.scored+')':'—';
      var first=this.firstN?Math.round(this.firstSum/this.firstN)+' ms':'—';
      var sa=this.scored?Math.round(100*this.inband/this.scored)+'%':'—';
      el('metrics').innerHTML='<div>M-ACC accuracy</div><b>'+acc+'</b>'+
        '<div>M-RTFIRST mean</div><b>'+first+'</b>'+
        '<div>M-DIFFREACH step</div><b>'+(this.diffMax||'—')+'</b>'+
        '<div>M-SPEEDACC in-band</div><b>'+sa+'</b>'+
        '<div>M-CONSIST clones</div><b>'+this.consist()+'</b>';
    }};

  // series: terms[] shown, ans=next; compare: a,b -> 'L'/'R'/'EQ'
  var items=[
    {phase:'demo',  kind:'series', seq:[2,4,6], step:2, ans:8},
    {phase:'warmup',kind:'series', seq:[1,2,3], step:1, ans:4},
    {phase:'scored',kind:'series', seq:[2,4,6], step:2, ans:8},
    {phase:'scored',kind:'series', seq:[3,6,9], step:3, ans:12},
    {phase:'scored',kind:'compare',a:7,b:5, ans:'L', dist:2, group:'d2'},
    {phase:'scored',kind:'compare',a:9,b:7, ans:'L', dist:2, group:'d2'}
  ];
  var labels={demo:'1 Watch',warmup:'2 Try',scored:'3 Solve'};
  var idx=-1,cur=null,chosen=0,firstAction=0,itemStart=0,locked=false;

  function phasebar(){el('phasebar').innerHTML=['demo','warmup','scored'].map(function(p){return '<span class="pill'+(cur&&cur.phase===p?' on':'')+'">'+labels[p]+'</span>';}).join('');}

  function beadRow(count,cap,interactive){
    var r=document.createElement('div');r.className='rack'+(interactive?' ans':'');
    var perRow=10, rows=Math.ceil(cap/perRow);
    for(var row=0;row<rows;row++){
      var rr=document.createElement('div');rr.className='rrow';
      for(var i=0;i<perRow;i++){var gi=row*perRow+i; if(gi>=cap)break;
        var b=document.createElement('div');b.className='bead'+(gi<count?' on'+((gi%10)>=5?' hi':''):'');
        if(interactive){(function(gi){b.onclick=function(){setChosen(gi+1);};})(gi);}
        rr.appendChild(b);
      }
      r.appendChild(rr);
    }
    return r;
  }
  function setChosen(n){
    if(locked||cur.phase==='demo')return;
    if(firstAction===0){firstAction=perf();Tel.firstSum+=(firstAction-itemStart);Tel.firstN++;Tel.push('t-evt','first bead (plan '+(firstAction-itemStart)+'ms)');}
    chosen=n; renderSeries(); el('cnt').textContent='this rack: '+n;
    lockBtn.style.display='inline-block';
  }
  function renderSeries(){
    terms.innerHTML='';
    cur.seq.forEach(function(v){
      var wrap=document.createElement('div');
      wrap.appendChild(beadRow(v,10,false));
      var lab=document.createElement('div');lab.className='lbl';lab.textContent=v;wrap.appendChild(lab);
      terms.appendChild(wrap);
    });
    var qw=document.createElement('div');
    qw.appendChild(beadRow(chosen,12,cur.phase!=='demo'));
    var cn=document.createElement('div');cn.className='cnt';cn.id='cnt';cn.textContent=chosen?('this rack: '+chosen):'slide beads to the next number';
    qw.appendChild(cn);
    terms.appendChild(qw);
  }
  function renderCompare(){
    terms.innerHTML='';cmp.style.display='flex';cmp.innerHTML='';
    [['L',cur.a],['R',cur.b]].forEach(function(pair){
      var box=document.createElement('div');box.className='cmpbox';box.id='box'+pair[0];
      box.appendChild(beadRow(pair[1],10,false));
      box.onclick=function(){pick(pair[0]);};
      cmp.appendChild(box);
    });
    var eq=document.createElement('button');eq.className='act ghost';eq.textContent='EQUAL';eq.onclick=function(){pick('EQ');};
    cmp.appendChild(eq);
  }
  function pick(side){
    if(locked)return;
    if(firstAction===0){firstAction=perf();Tel.firstSum+=(firstAction-itemStart);Tel.firstN++;}
    locked=true;var correct=(side===cur.ans);
    if(side==='L')el('boxL').classList.add(correct?'right':'wrong');
    if(side==='R')el('boxR').classList.add(correct?'right':'wrong');
    score(correct,'compare '+cur.a+' vs '+cur.b+' -> '+side+' (ans '+cur.ans+') dist='+cur.dist);
  }
  lockBtn.onclick=function(){
    if(locked||cur.phase==='demo')return;locked=true;lockBtn.style.display='none';
    var correct=(chosen===cur.ans);
    if(cur.phase==='scored'){Tel.diffMax=Math.max(Tel.diffMax,cur.step);}
    score(correct,'series +'+cur.step+' -> set '+chosen+' (ans '+cur.ans+')');
  };
  function score(correct,desc){
    var rt=perf()-itemStart;
    if(cur.phase==='scored'){
      Tel.scored++;if(correct)Tel.correct++;
      if(correct&&rt<=BAND)Tel.inband++;
      if(cur.group){(Tel.groupRes[cur.group]=Tel.groupRes[cur.group]||[]).push(correct?1:0);}
      Tel.push(correct?'t-acc':'t-err','SCORED: '+desc+'  rt='+rt+'ms'+(correct&&rt<=BAND?' [in-band]':''));
    }else{Tel.push('t-sys',cur.phase.toUpperCase()+': '+desc+' — not scored');}
    fb.textContent=correct?(cur.phase==='warmup'?'Nice! Now the real ones.':'Correct!'):'The answer was '+cur.ans+'.';
    fb.className='fb '+(correct?'good':'bad');
    if(correct)beep();nextBtn.style.display='inline-block';Tel.render();
  }
  function loadItem(){
    idx++;if(idx>=items.length){finish();return;}
    cur=items[idx];locked=false;chosen=0;firstAction=0;itemStart=perf();
    fb.textContent='';fb.className='fb';nextBtn.style.display='none';lockBtn.style.display='none';cmp.style.display='none';
    phasebar();
    if(cur.kind==='series'){prompt.textContent=cur.phase==='demo'?'Watch: each rack shows one more step. How many beads come next?':'Slide beads on the last rack to the number that comes NEXT, then Lock.';renderSeries();}
    else{prompt.textContent='Tap the rack that shows MORE (or EQUAL).';renderCompare();}
    Tel.push('t-sys','LOAD '+cur.phase+' '+cur.kind+': '+(cur.kind==='series'?cur.seq.join(',')+' -> '+cur.ans+' (+'+cur.step+')':cur.a+' vs '+cur.b+' -> '+cur.ans));
    if(cur.phase==='demo')ghost();
    Tel.render();
  }
  nextBtn.onclick=loadItem;
  function ghost(){
    var target=terms.querySelectorAll('.rack');var last=target[target.length-1];
    var steps=[0,1,2];
    steps.forEach(function(s,i){setTimeout(function(){var r=last.getBoundingClientRect();hand.style.opacity='1';hand.style.left=(r.left+20+s*22)+'px';hand.style.top=(r.top+10)+'px';chosen=Math.round(cur.ans*(i+1)/3);renderSeries();},500+i*500);});
    setTimeout(function(){chosen=cur.ans;renderSeries();el('cnt').textContent='next = '+cur.ans;beep();fb.textContent='It grows by +'+cur.step+' each time, so next = '+cur.ans+'.';fb.className='fb good';hand.style.opacity='0';},500+3*500+300);
    setTimeout(loadItem,500+3*500+1400);
  }
  function beep(){try{var a=new(window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(620,a.currentTime);o.frequency.exponentialRampToValueAtTime(960,a.currentTime+.15);g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.3);o.start();o.stop(a.currentTime+.32);}catch(e){}}
  function finish(){prompt.textContent='';terms.innerHTML='<div style="text-align:center;padding:40px 0;color:var(--muted)"><div style="font-size:44px">&#127881;</div><div>Sample complete. Telemetry captured on the right.</div></div>';cmp.style.display='none';nextBtn.style.display='none';Tel.push('t-sys','SESSION complete: '+Tel.correct+'/'+Tel.scored+' correct; M-CONSIST '+Tel.consist());}
  window.addEventListener('blur',function(){Tel.push('t-sys','engagement: focus lost');});
  Tel.render();loadItem();
})();
</script>
</body>
</html>
