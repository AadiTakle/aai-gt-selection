<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-launch-01 — Launch Control (go/no-go, stop-signal, combo)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #pad{width:420px;height:210px;border:2px solid var(--edge);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:96px;background:#101a30;position:relative}
  #pad.abort{background:#3a1420;border-color:var(--bad)}
  #abortlight{position:absolute;top:10px;right:14px;font-size:34px;opacity:0}#abortlight.on{opacity:1}
  #launch{font-size:24px;padding:16px 40px;border-radius:16px;border:2px solid var(--accent);background:#173a52;color:var(--ink);cursor:pointer;font-weight:800}
  #launch:active{transform:scale(.96)}#launch.flash{background:var(--good);border-color:transparent;color:#06251a}#launch.wrong{background:var(--bad);border-color:transparent}
  #verdict{font-size:22px;height:30px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.ctl{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🚀 Launch Control <span class="badge" id="blevel">SSD 250ms · combo 0</span></h1>
    <p class="sub">Tap <b>LAUNCH</b> fast for rockets 🚀. Never launch a bomb 💣. If the 🔴 abort light flashes after you commit — do <b>not</b> tap. Streaks need speed AND accuracy.</p>
  </div>
  <div id="pad"><span id="abortlight">🔴</span>🚀</div>
  <button id="launch">🚀 LAUNCH</button>
  <div id="verdict"></div>
  <div class="row">
    <button class="pri ctl" id="go">▶ Watch how it works</button>
    <button class="ctl" id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=$("#pad"),launch=$("#launch"),verdict=$("#verdict"),abortlight=$("#abortlight");
const T={phase:"idle",trial:0,goN:0,goHit:0,rt:[],comm:0,bombN:0,fa:0,anticip:0,stopN:0,stopFail:0,ssd:250,ssdList:[],
  combo:0,maxCombo:0,lastErr:false,postErr:[],base:[],log:[]};
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function med(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
function ssrt(){return T.ssdList.length?Math.round(med(T.rt)-mean(T.ssdList)):0}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop()}
function bump(ok){if(ok){T.combo++;T.maxCombo=Math.max(T.maxCombo,T.combo);}else T.combo=0;$("#blevel").textContent=`SSD ${T.ssd}ms · combo ${T.combo}`;}
function render(){
  const pes=Math.round(mean(T.postErr)-mean(T.base))||0;
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-launch-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>trials</span><b>${T.trial}</b></div>
  <h2>Inhibition</h2>
  <div class="kv"><span>stop-signal RT <span class="m">M-SSRT</span></span><b>${ssrt()} ms</b></div>
  <div class="kv"><span>bomb launches <span class="m">M-COMM</span></span><b>${T.comm}/${T.bombN}</b></div>
  <div class="kv"><span>false alarm/anticip <span class="m">M-FALSEALARM</span></span><b>${T.fa+T.anticip}</b></div>
  <h2>Speed (gated) <span class="m">M-RT</span></h2>
  <div class="kv"><span>launch-RT median</span><b>${Math.round(med(T.rt))} ms</b></div>
  <h2>Accuracy-gated combo <span class="m">M-COMBO</span></h2>
  <div class="kv"><span>current / best streak</span><b>${T.combo} / ${T.maxCombo}</b></div>
  <h2>Monitoring</h2>
  <div class="kv"><span>post-error slowing <span class="m">M-POSTERR</span></span><b>${pes>0?"+":""}${pes} ms</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();

let cur=null;
launch.onpointerdown=()=>{if(!cur||cur.done)return;const t=performance.now()-cur.onset;
  if(cur.type==="stop"&&cur.aborted){cur.tapped=true;cur.done=true;return;} // tapped after abort -> fail handled at resolve
  cur.tapped=true;cur.rt=t;if(cur.type==="go"){cur.done=true;}
};
async function trial(scored){
  const r=Math.random();const type=r<0.6?"go":(r<0.8?"bomb":"stop");
  await sleep(380);
  cur={type,onset:performance.now(),tapped:false,rt:null,done:false,aborted:false};
  if(type==="go"){pad.textContent="🚀";pad.className="";await sleep(1000);cur.done=true;
    if(scored){T.trial++;T.goN++;if(cur.tapped){if(cur.rt<150){T.anticip++;verdict.textContent="⚡ too quick!";bump(false);T.lastErr=true;}else{T.goHit++;T.rt.push(cur.rt);(T.lastErr?T.postErr:T.base).push(cur.rt);verdict.textContent="✅ liftoff";bump(true);T.lastErr=false;}}else{verdict.textContent="🐢 missed launch";bump(false);T.lastErr=true;}}
  } else if(type==="bomb"){pad.innerHTML='<span id="abortlight">🔴</span>💣';pad.className="";await sleep(1000);cur.done=true;
    if(scored){T.trial++;T.bombN++;if(cur.tapped){T.comm++;T.fa++;verdict.textContent="💥 that was a bomb!";bump(false);T.lastErr=true;logE("bomb launched (commission)");}else{verdict.textContent="🖐️ held — good";bump(true);}}
  } else {pad.innerHTML='<span id="abortlight">🔴</span>🚀';pad.className="";cur.onset=performance.now();
    await sleep(T.ssd);cur.aborted=true;if(!cur.tapped){document.getElementById("abortlight").classList.add("on");pad.className="abort";}
    await sleep(850);cur.done=true;
    if(scored){T.trial++;T.stopN++;if(cur.tapped){T.stopFail++;T.fa++;T.ssd=Math.max(50,T.ssd-50);verdict.textContent="❌ should have aborted";bump(false);T.lastErr=true;logE("abort failed");}else{T.ssdList.push(T.ssd);T.ssd=Math.min(700,T.ssd+50);verdict.textContent="🛑 aborted!";bump(true);}}
  }
  pad.className="";const al=document.getElementById("abortlight");if(al)al.classList.remove("on");
  render();await sleep(320);verdict.textContent="";pad.innerHTML='<span id="abortlight">🔴</span>🚀';
}
async function block(scored,len){for(let i=0;i<len;i++)await trial(scored);}

async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;$("#replay").disabled=true;
  const ghost=document.createElement("div");ghost.textContent="👆";ghost.style.cssText="position:fixed;font-size:30px;z-index:9;transition:left .4s,top .4s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  pad.innerHTML='<span id="abortlight">🔴</span>🚀';const r=launch.getBoundingClientRect();
  await sleep(300);ghost.style.opacity="1";ghost.style.left=(r.left+r.width/2-12)+"px";ghost.style.top=(r.top+8)+"px";
  await sleep(600);launch.classList.add("flash");verdict.textContent="✅ liftoff!";await sleep(500);launch.classList.remove("flash");
  pad.innerHTML='<span id="abortlight">🔴</span>💣';verdict.textContent="";ghost.style.top=(r.top-60)+"px";await sleep(700);verdict.textContent="🖐️ bomb — don't launch!";await sleep(700);
  ghost.remove();pad.innerHTML='<span id="abortlight">🔴</span>🚀';T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice round";$("#go").onclick=warmup;
  $("#phasehint").textContent="Launch rockets, hold on bombs, abort on red. Practice (not scored).";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;
async function warmup(){T.phase="warm-up (unscored)";render();$("#go").disabled=true;$("#replay").disabled=true;await block(false,5);
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;$("#go").textContent="▶ Start scored game";$("#go").onclick=startScored;
  $("#phasehint").textContent="These count. A streak only survives if you're both fast AND right.";render();}
async function startScored(){T.phase="scored";render();$("#go").disabled=true;$("#replay").disabled=true;await block(true,16);
  T.phase="done";$("#go").disabled=false;$("#replay").disabled=false;$("#go").textContent="▶ Play again";$("#go").onclick=startScored;
  $("#phasehint").textContent=`Done. SSRT ${ssrt()}ms; best combo ${T.maxCombo}; bomb launches ${T.comm}/${T.bombN}.`;verdict.textContent="🏁";render();}
</script>
</body>
</html>
