<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VER-BUILDIT-01 · Build-It Buddy</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:680px;width:100%}
  #clues{display:flex;flex-direction:column;gap:6px;width:100%;background:linear-gradient(160deg,#eafaf1,#eef1ff);border:3px solid #bfe8cf;border-radius:16px;padding:12px 16px}
  .clue{font-size:19px;display:flex;gap:8px;align-items:center}
  .clue .no{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
  #gridwrap{overflow:auto;max-width:100%}
  table.lgrid{border-collapse:collapse}
  table.lgrid th,table.lgrid td{border:2px solid #c7d2f2;width:52px;height:52px;text-align:center;font-size:26px;cursor:pointer;background:#f4f7ff}
  table.lgrid th{background:#e2e8ff;font-size:15px;cursor:default}
  table.lgrid td.corner{background:#e2e8ff;cursor:default}
  table.lgrid td.on{background:var(--good);color:#fff}
  table.lgrid td.off{background:#fff;color:#d33}
  table.lgrid td.correct{box-shadow:inset 0 0 0 4px #0a7a44}
  table.lgrid td.wrong{box-shadow:inset 0 0 0 4px var(--bad)}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:72px;height:72px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:50px;height:50px;background:#eef1ff;color:#5b6cff;font-size:22px}
  .shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;transition:transform .55s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mid.prop{color:#ffd479}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:210px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">VER-BUILDIT-01 · Build-It Buddy</div>
    <div id="phasecue">🧩</div>
    <div id="stagecard">
      <div id="clues"></div>
      <div id="gridwrap"><table class="lgrid" id="grid"></table></div>
      <div id="controls">
        <button id="replay" title="replay demo">↻</button>
        <button id="go" title="submit">✓</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,last=a=>a[a.length-1];

/* ---------- logic-grid riddle generator (AIG) ---------- */
const PEOPLE=['🐶','🐱','🦊','🐼','🐸','🦁'];
const THINGS=[['🍎','apple'],['🍌','banana'],['⚽','ball'],['📕','book'],['🎈','balloon'],['🧸','bear']];
// people[i] owns things[perm[i]]; clues encode positive/negative facts about the true mapping,
// plus one contradiction/impossible-option clue that must be filtered as false.
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function genRiddle(n,indirect){
  const people=PEOPLE.slice(0,n);
  const things=shuffle(THINGS.slice(0,n));
  const perm=shuffle([...Array(n).keys()]); // perm[i] = which thing-index person i owns
  const nameOf=t=>things[t][1];
  const clues=[];
  // direct positive clue
  const dp=(Math.random()*n)|0;
  clues.push(`${people[dp]} has the ${nameOf(perm[dp])}.`);
  // negative clues: person does NOT have thing
  const negCount=Math.min(n-1, indirect?3:2);
  const usedNeg=new Set();
  while(usedNeg.size<negCount){
    const pi=(Math.random()*n)|0, ti=(Math.random()*n)|0;
    if(perm[pi]===ti) continue;
    const key=pi+','+ti; if(usedNeg.has(key)) continue; usedNeg.add(key);
    clues.push(`${people[pi]} does not have the ${nameOf(ti)}.`);
  }
  // indirect elimination clue: "if not X, then not Y" style translated as two negatives chained (still simple negative fact)
  if(indirect){
    let pi,ti; do{pi=(Math.random()*n)|0; ti=(Math.random()*n)|0;}while(perm[pi]===ti);
    clues.push(`It is not true that ${people[pi]} has the ${nameOf(ti)}.`);
  }
  // one impossible/contradiction option clue — states a mapping that violates the one-to-one rule (never true, must be ignored)
  let bp,bt; do{bp=(Math.random()*n)|0; bt=(Math.random()*n)|0;}while(perm[bp]===bt);
  let bp2; do{bp2=(Math.random()*n)|0;}while(bp2===bp || perm[bp2]!==bt);
  clues.push(`❌ Impossible: both ${people[bp]} and ${people[bp2]} cannot have the ${nameOf(bt)} — only one friend owns each thing.`);
  return {n,people,things,perm,clues:shuffle(clues)};
}

/* ---------- telemetry ---------- */
let cur=null,answer=null,level=1,maxLevel=1,scoredIdx=0,firstCorrectTrial=null,trialCount=0;
const T={scored:0,exact:0,cellsRight:0,cellsTot:0,path:[],touch:{},itemStart:0,rev:0};
function polyStr(){return T.cellsTot?`${T.cellsRight}/${T.cellsTot}`:'\u2014';}
function accStr(){return T.scored?`${T.exact}/${T.scored}  ${Math.round(100*T.exact/T.scored)}%`:'\u2014';}
function spanStr(){return cur?`${cur.clues.length} clues held`:'\u2014';}
function pathStr(){return T.path.length?`${T.path.length}: ${T.path.slice(-5).join(' ')}`:'\u2014';}
function learnRate(){if(firstCorrectTrial==null)return '\u2014';return `ceiling in ${firstCorrectTrial} trials`;}
const METERS=[
 {id:'M-ACC',name:'Item accuracy (full mapping)',get:accStr},
 {id:'M-POLY',name:'Partial credit (cells correct)',get:polyStr},
 {id:'M-ORALSPAN',name:'Clue span integrated per item',get:spanStr},
 {id:'M-PATH',name:'Placement path (order of taps)',get:pathStr},
 {id:'M-DIFFREACH',name:'Difficulty reached (grid size/indirectness)',get:()=>`level ${maxLevel}`},
 {id:'M-REV',name:'Revisions (re-tapped cells)',get:()=>T.rev},
 {id:'M-LEARNRATE',name:'Learning rate across escalation',get:learnRate},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(500);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(420);}

/* ---------- render ---------- */
let grid=null; // grid[p][t] = 0 unknown,1 on,-1 off
function paintClues(item){$('#clues').innerHTML=item.clues.map((c,i)=>`<div class="clue"><span class="no">${i+1}</span><span>${c}</span></div>`).join('');}
function paintGrid(item,editable){
  const n=item.n;const tbl=$('#grid');tbl.innerHTML='';
  const head=document.createElement('tr');head.appendChild(Object.assign(document.createElement('td'),{className:'corner'}));
  item.things.forEach(t=>{const th=document.createElement('th');th.textContent=t[0];head.appendChild(th);});
  tbl.appendChild(head);
  for(let p=0;p<n;p++){
    const row=document.createElement('tr');
    const th=document.createElement('th');th.textContent=item.people[p];row.appendChild(th);
    for(let t=0;t<n;t++){
      const td=document.createElement('td');td.dataset.p=p;td.dataset.t=t;
      if(editable)td.addEventListener('click',()=>cellTap(p,t));
      row.appendChild(td);
    }
    tbl.appendChild(row);
  }
}
function cellEl(p,t){return $('#grid').querySelector(`td[data-p="${p}"][data-t="${t}"]`);}
function paintCell(p,t){const el=cellEl(p,t);if(!el)return;el.className='';el.textContent='';
  if(grid[p][t]===1){el.classList.add('on');el.textContent='✔';}
  else if(grid[p][t]===-1){el.classList.add('off');el.textContent='✕';}
}
function renderItem(item){cur=item;grid=Array.from({length:item.n},()=>Array(item.n).fill(0));
  T.path=[];T.touch={};T.rev=0;T.itemStart=Date.now();T.cellsTot=item.n;T.cellsRight=0;
  paintClues(item);paintGrid(item,phase!=='demo');
  for(let p=0;p<item.n;p++)for(let t=0;t<item.n;t++)paintCell(p,t);
  $('#go').classList.toggle('ready',phase!=='demo');renderMeters();}
function cellTap(p,t){if(locked||phase==='demo'||phase==='done')return;
  const cyc=[0,1,-1];const idx=cyc.indexOf(grid[p][t]);grid[p][t]=cyc[(idx+1)%3];
  paintCell(p,t);
  const k=p+','+t;T.touch[k]=(T.touch[k]||0)+1;if(T.touch[k]>1)T.rev++;
  T.path.push(`${cur.people[p]}${grid[p][t]===1?'✔':grid[p][t]===-1?'✕':'·'}${cur.things[t][0]}`);
  T.cellsRight=0;for(let pp=0;pp<cur.n;pp++)if(grid[pp][cur.perm[pp]]===1)T.cellsRight++;
  renderMeters();
  checkReady();
}
function checkReady(){$('#go').classList.toggle('ready',phase!=='demo'&&phase!=='done');}
function feedback(exact){for(let p=0;p<cur.n;p++)for(let t=0;t<cur.n;t++){
  const el=cellEl(p,t);const shouldBeOn=cur.perm[p]===t;const isOn=grid[p][t]===1;
  el.classList.add(isOn===shouldBeOn?'correct':'wrong');}
  if(!exact){$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),450);}}

/* ---------- flow ---------- */
let phase='demo',locked=false;
function setCue(i){$('#phasecue').textContent=i;}
function levelParams(l){const n=Math.min(3+Math.floor((l-1)/2),6);const indirect=l>=3;return {n,indirect};}
function submit(){
  T.cellsRight=0;for(let p=0;p<cur.n;p++)if(grid[p][cur.perm[p]]===1)T.cellsRight++;
  const exact=T.cellsRight===cur.n && cur.perm.every((t,p)=>{for(let tt=0;tt<cur.n;tt++)if(tt!==t&&grid[p][tt]===1)return false;return true;});
  feedback(exact);locked=true;$('#go').classList.remove('ready');
  if(phase==='warmup'){log('warm-up '+(exact?'solved':T.cellsRight+'/'+cur.n+' correct')+' — UNSCORED');setTimeout(nextPhase,1200);return;}
  T.scored++;trialCount++;if(exact){T.exact++;if(firstCorrectTrial==null)firstCorrectTrial=trialCount;level++;}else{level=Math.max(1,level-1);}
  maxLevel=Math.max(maxLevel,exact?level-1+1:level);
  log(`SUBMIT ${cur.n}x${cur.n} [${cur.indirect?'indirect':'direct'}] \u2192 ${T.cellsRight}/${cur.n}${exact?' EXACT':''} \u2192 next level ${level}`);
  renderMeters();setTimeout(nextPhase,1400);
}
function nextPhase(){locked=false;
  if(phase==='warmup'){scoredIdx=0;startScored();}
  else if(phase==='scored'){scoredIdx++;scoredIdx<6?startScored():finish();}
}
function startWarmup(){phase='warmup';setCue('\u2b50');const p=levelParams(1);renderItem(genRiddle(p.n,false));log('— warm-up (unscored): find who owns what —');}
function startScored(){phase='scored';setCue('\ud83c\udfaf');const p=levelParams(level);renderItem(genRiddle(p.n,p.indirect));log(`— SCORED item ${scoredIdx+1}: ${p.n}x${p.n}, ${p.indirect?'indirect clues':'direct clues'} (level ${level}) —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');locked=true;log(`— DONE · exact ${T.exact}/${T.scored} · max level ${maxLevel} —`);}
async function runDemo(){phase='demo';setCue('\ud83d\udc41\ufe0f');locked=true;
  const item=genRiddle(3,false);renderItem(item);log('ghost-hand demo (wordless, <10s)');ghostShow(true);await sleep(300);
  for(let p=0;p<item.n;p++){await ghostTo(cellEl(p,item.perm[p]));await ghostTap();grid[p][item.perm[p]]=1;paintCell(p,item.perm[p]);}
  await sleep(300);await ghostTo($('#go'));await ghostTap();await sleep(300);ghostShow(false);await sleep(450);startWarmup();}
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
