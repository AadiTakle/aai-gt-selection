<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPA-VIEW-01 · What Do They See</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:10px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:26px;padding:18px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:560px;width:100%}
  #targetband{background:linear-gradient(160deg,#fff7e6,#eef2ff);border:3px solid #ffe0a3;border-radius:16px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
  #targetband .lbl{font-size:13px;font-weight:800;color:#a9741a;letter-spacing:.02em}
  #target{display:flex;align-items:center;gap:7px}
  .chip{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .arrowr{color:#c6a45a;font-size:16px}
  #stage{position:relative;width:100%;height:300px;perspective:900px;border-radius:18px;background:linear-gradient(180deg,#eaf1ff,#dfe6ff);border:3px solid #d6ddff;overflow:hidden}
  #cam{position:absolute;left:50%;top:52%;width:340px;height:300px;transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(60deg)}
  #ground{position:absolute;left:50%;top:50%;width:300px;height:250px;margin:-125px 0 0 -150px;border-radius:26px;background:repeating-linear-gradient(90deg,#cdd9f7 0 1px,transparent 1px 40px),repeating-linear-gradient(0deg,#cdd9f7 0 1px,transparent 1px 40px),radial-gradient(120% 120% at 50% 40%,#eef3ff,#d3ddfb);box-shadow:0 8px 20px -6px rgba(60,70,120,.4)}
  .pawn{position:absolute;left:50%;top:50%;width:44px;height:50px;border-radius:12px 12px 14px 14px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 6px 8px -3px rgba(0,0,0,.4);text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .viewer{position:absolute;left:50%;top:50%;width:48px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;box-shadow:inset 0 0 0 3px rgba(255,255,255,.4),0 6px 10px -3px rgba(0,0,0,.45)}
  .viewer .num{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#11162a;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.4)}
  .viewer.sel{outline:4px solid var(--accent);outline-offset:2px}
  .viewer.correct{outline:5px solid var(--good)}.viewer.wrong{outline:5px solid var(--bad)}
  .gaze{position:absolute;left:50%;top:50%;height:6px;border-radius:4px;background:linear-gradient(90deg,rgba(120,130,190,.55),rgba(120,130,190,.02));transform-origin:0 50%}
  .gaze.on{height:8px;background:linear-gradient(90deg,rgba(91,108,255,.9),rgba(91,108,255,.05))}
  .shadow{position:absolute;left:50%;top:50%;width:38px;height:15px;margin:-7px 0 0 -19px;border-radius:50%;background:rgba(40,50,90,.28);filter:blur(2px)}
  #ask{font-weight:800;color:#4a4a7a;font-size:15px}
  #controls{display:flex;gap:14px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:62px;height:62px;background:var(--accent);color:#fff;font-size:26px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  #replay{width:46px;height:46px;background:#eef1ff;color:#5b6cff;font-size:20px}
  #keys{font-size:12px;color:#8a93b5;text-align:center}#keys b{color:#5566b0}
  .shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;transition:transform .55s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-4px;width:26px;height:26px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:326px;flex:0 0 326px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #diffwrap{padding:4px 12px 8px;border-top:1px solid #262f52}
  #diffwrap b{display:block;color:#8ea0d6;font-size:11px;letter-spacing:.08em;padding:6px 0}
  #diffmeter{display:flex;gap:3px}.seg{flex:1;height:13px;border-radius:3px;background:#222c4d}
  .seg.done{background:#3350d9}.seg.cur{background:#7fffcf}.seg.ceil{box-shadow:inset 0 0 0 2px #ffd479}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:140px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">SPA-VIEW-01 · What Do They See</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="targetband"><div class="lbl">👀 THIS is the view (left ➜ right)</div><div id="target"></div></div>
      <div id="ask">Whose eyes see this? Tap the viewer.</div>
      <div id="stage"><div id="cam"><div id="ground"></div></div></div>
      <div id="controls"><button id="replay" title="replay demo">↻</button><button id="go" title="lock answer">✓</button></div>
      <div id="keys"><b>1–6</b> pick viewer · <b>Enter</b> lock · imagine standing in their shoes</div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="diffwrap"><b>DIFFICULTY LADDER (M-DIFFREACH · M-LEARNRATE)</b><div id="diffmeter"></div></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const last=a=>a[a.length-1];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const eqA=(a,b)=>a.length===b.length&&a.every((v,i)=>v===b[i]);

const ICONS=[{g:'🌳',c:'#2f9e56'},{g:'🏠',c:'#e5484d'},{g:'🚗',c:'#2f6bd0'},{g:'🌸',c:'#d6409f'},{g:'⭐',c:'#f5a300'},{g:'🎈',c:'#8e4ec6'}];
const VW=[{g:'🧒',c:'#5b6cff'},{g:'🐰',c:'#12a594'},{g:'🐻',c:'#c2410c'},{g:'🦊',c:'#e5484d'},{g:'🐼',c:'#334155'},{g:'🦁',c:'#b8860b'}];
const SCALE=64,VR=2.0;

/* ---------- geometry ---------- */
function viewOrder(objs,v){
  const f=[-v.dx,-v.dy];const fl=Math.hypot(f[0],f[1]);f[0]/=fl;f[1]/=fl;
  const r=[-f[1],f[0]];
  return objs.map((o,i)=>{const rel=[o.x-v.x,o.y-v.y];return {i,ang:Math.atan2(rel[0]*r[0]+rel[1]*r[1],rel[0]*f[0]+rel[1]*f[1])};})
    .sort((a,b)=>a.ang-b.ang);
}
function angWrap(d){while(d>180)d-=360;while(d<-180)d+=360;return d;}
function viewParams(L){const K=clamp(2+Math.floor(L/1.5),2,6);const n=K<=2?2:(K<=4?3:4);return {K,n};}
function genView(L){
  const P=viewParams(L);
  for(let t=0;t<900;t++){
    const icons=shuffle(ICONS).slice(0,P.n);const objs=[];let ok=true;
    for(let k=0;k<P.n;k++){let placed=false;for(let a=0;a<60&&!placed;a++){const ang=Math.random()*Math.PI*2,rad=0.4+Math.random()*0.85;const x=Math.cos(ang)*rad,y=Math.sin(ang)*rad;if(objs.every(o=>Math.hypot(o.x-x,o.y-y)>0.6)){objs.push({g:icons[k].g,c:icons[k].c,x,y});placed=true;}}if(!placed){ok=false;break;}}
    if(!ok)continue;
    const base=Math.random()*Math.PI*2,viewers=[],vic=shuffle(VW);
    for(let k=0;k<P.K;k++){const ang=base+(k/P.K)*Math.PI*2+(Math.random()-.5)*0.35;const dx=Math.cos(ang),dy=Math.sin(ang);viewers.push({x:dx*VR,y:dy*VR,dx,dy,angDeg:ang*180/Math.PI,g:vic[k].g,c:vic[k].c,num:k+1});}
    const target=Math.floor(Math.random()*P.K);
    const tord=viewOrder(objs,viewers[target]);
    let sep=true;for(let i=0;i<tord.length-1;i++)if(Math.abs(tord[i+1].ang-tord[i].ang)<0.24)sep=false;
    if(!sep)continue;
    const order=tord.map(o=>o.i);
    let matches=0;viewers.forEach(v=>{if(eqA(viewOrder(objs,v).map(o=>o.i),order))matches++;});
    if(matches!==1)continue;
    return {level:L,params:P,objs,viewers,target,order};
  }
  const objs=[{g:'🌳',c:'#2f9e56',x:-0.7,y:0.1},{g:'⭐',c:'#f5a300',x:0.7,y:-0.1}];
  const viewers=[{x:0,y:VR,dx:0,dy:1,angDeg:90,g:'🧒',c:'#5b6cff',num:1},{x:0,y:-VR,dx:0,dy:-1,angDeg:-90,g:'🐰',c:'#12a594',num:2}];
  return {level:L,params:viewParams(L),objs,viewers,target:0,order:viewOrder(objs,viewers[0]).map(o=>o.i)};
}

/* ---------- render ---------- */
function renderScene(sc){
  const cam=$('#cam');cam.querySelectorAll('.pawn,.viewer,.gaze,.shadow').forEach(e=>e.remove());
  sc.objs.forEach(o=>{
    const sh=document.createElement('div');sh.className='shadow';sh.style.transform=`translate(-50%,-50%) translate3d(${o.x*SCALE}px,${o.y*SCALE}px,0)`;cam.appendChild(sh);
    const d=document.createElement('div');d.className='pawn';d.style.background=o.c;d.textContent=o.g;
    d.style.transform=`translate(-50%,-50%) translate3d(${o.x*SCALE}px,${o.y*SCALE}px,0) rotateX(-60deg) translateY(-25px)`;cam.appendChild(d);
  });
  sc.viewers.forEach((v,i)=>{
    const dist=Math.hypot(v.x*SCALE,v.y*SCALE),ang=Math.atan2(-v.y,-v.x)*180/Math.PI;
    const gz=document.createElement('div');gz.className='gaze';gz.dataset.v=i;gz.style.width=dist+'px';
    gz.style.transform=`translate(0,-50%) translate3d(${v.x*SCALE}px,${v.y*SCALE}px,0) rotate(${ang}deg)`;cam.appendChild(gz);
    const sh=document.createElement('div');sh.className='shadow';sh.style.transform=`translate(-50%,-50%) translate3d(${v.x*SCALE}px,${v.y*SCALE}px,0)`;cam.appendChild(sh);
    const el=document.createElement('div');el.className='viewer';el.dataset.i=i;el.style.background=v.c;el.innerHTML=`${v.g}<span class="num">${v.num}</span>`;
    el.style.transform=`translate(-50%,-50%) translate3d(${v.x*SCALE}px,${v.y*SCALE}px,0) rotateX(-60deg) translateY(-27px)`;
    el.onclick=()=>selectV(i);cam.appendChild(el);
  });
}
function renderTarget(sc){$('#target').innerHTML=sc.order.map(idx=>`<div class="chip" style="background:${sc.objs[idx].c}">${sc.objs[idx].g}</div>`).join('<span class="arrowr">›</span>');}

/* ---------- telemetry ---------- */
const T={scored:0,correct:0,rts:[],firsts:[],revs:[],explores:[],angErrs:[],lastErr:'\u2014',
  itemStart:0,firstAt:0,rev:0,sampled:new Set(),seq:[],startLevel:1,maxSolved:0};
let level=1,cur=null,phase='demo',locked=false,scoredIdx=0,sel=null;const SCORED_N=6,MAXLEVEL=8;
function first(){if(!T.firstAt)T.firstAt=Date.now()-T.itemStart;}
function pct(){return T.scored?Math.round(100*T.correct/T.scored):0;}
function learnStr(){if(!T.seq.length)return '\u2014';const g=T.maxSolved-T.startLevel,r=(g/T.scored).toFixed(2);const tr=T.seq.map(s=>'L'+s.level+(s.ok?'\u2713':'\u2717'));const sh=tr.length<=5?tr:[tr[0],'\u2026',last(tr)];return `${g>=0?'+':''}${r} lvl/trial [${sh.join(' ')}]`;}
function angErrNow(){if(sel===null||!cur)return '\u2014';const e=Math.abs(angWrap(cur.viewers[sel].angDeg-cur.viewers[cur.target].angDeg));return `${e.toFixed(0)}\u00b0`;}
const METERS=[
 {id:'M-ACC',name:'Item accuracy (right viewer)',get:()=>T.scored?`${T.correct}/${T.scored}  ${pct()}%`:'\u2014'},
 {id:'M-RT',name:'Response time — total',get:()=>T.rts.length?`${last(T.rts)} ms (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency',get:()=>T.firsts.length?`${last(T.firsts)} ms (med ${mean(T.firsts)})`:'\u2014'},
 {id:'M-REV',name:'Answer changes before lock',get:()=>T.revs.length?`${last(T.revs)} (mean ${mean(T.revs)})`:`${T.rev}`},
 {id:'M-EXPLORE',name:'Distinct viewers sampled',get:()=>T.explores.length?`${last(T.explores)} (mean ${mean(T.explores)})`:`${T.sampled.size}`},
 {id:'M-VIEWANG',name:'Perspective angular error',get:()=>T.angErrs.length?`${last(T.angErrs)}\u00b0 (mean |${mean(T.angErrs)}\u00b0|)`:angErrNow()},
 {id:'M-DIFFREACH',name:'Ceiling — max view level solved',get:()=>`L${T.maxSolved} / at L${level}`},
 {id:'M-LEARNRATE',name:'Within-session learning rate',get:()=>learnStr()},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});renderDiff();}
function renderDiff(){let h='';for(let i=1;i<=MAXLEVEL;i++){let c='seg';if(i<=T.maxSolved)c+=' done';if(i===level)c+=' cur';if(i===T.maxSolved&&T.maxSolved>0)c+=' ceil';h+=`<div class="${c}"></div>`;}$('#diffmeter').innerHTML=h;}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}

/* ---------- ghost ---------- */
const ghost=$('#ghost');
function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-9}px,${c.y-6}px)`;await sleep(520);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(430);}

/* ---------- answer + flow ---------- */
function classifyErr(i){
  if(i===cur.target)return null;
  const diff=Math.abs(angWrap(cur.viewers[i].angDeg-cur.viewers[cur.target].angDeg));
  if(diff>=150)return 'systematic:opposite-viewpoint';
  let nearest=-1,best=999;cur.viewers.forEach((v,k)=>{if(k===cur.target)return;const d=Math.abs(angWrap(v.angDeg-cur.viewers[cur.target].angDeg));if(d<best){best=d;nearest=k;}});
  if(i===nearest)return 'near-miss:adjacent-viewpoint';
  return 'random';
}
function selectV(i){
  if(locked||phase==='demo'||phase==='done')return;
  first();if(sel!==null&&sel!==i)T.rev++;
  if(!T.sampled.has(i))T.sampled.add(i);
  sel=i;$$('.viewer').forEach(v=>v.classList.toggle('sel',+v.dataset.i===i));
  $$('.gaze').forEach(g=>g.classList.toggle('on',+g.dataset.v===i));
  $('#go').classList.add('ready');
  const e=Math.abs(angWrap(cur.viewers[i].angDeg-cur.viewers[cur.target].angDeg));
  log(`sample viewer ${i+1} · off ${e.toFixed(0)}\u00b0 from answer`+(T.rev?` (change #${T.rev})`:''));renderMeters();
}
function reveal(ok){$$('.viewer').forEach(v=>{const i=+v.dataset.i;if(i===cur.target)v.classList.add('correct');else if(i===sel&&!ok)v.classList.add('wrong');});if(!ok){$('#stage').classList.add('shake');setTimeout(()=>$('#stage').classList.remove('shake'),450);}}
function submit(){
  if(locked||sel===null)return;const rt=Date.now()-T.itemStart;first();
  const ok=sel===cur.target,err=classifyErr(sel);
  const aerr=Math.abs(angWrap(cur.viewers[sel].angDeg-cur.viewers[cur.target].angDeg));
  if(phase==='warmup'){reveal(ok);locked=true;$('#go').classList.remove('ready');
    log(`warm-up: viewer ${sel+1} — ${ok?'right':'off '+aerr.toFixed(0)+'\u00b0'} · UNSCORED`);
    setTimeout(()=>{locked=false;scoredIdx=0;startScored();},1200);return;}
  T.scored++;T.rts.push(rt);T.firsts.push(T.firstAt);T.revs.push(T.rev);T.explores.push(T.sampled.size);T.angErrs.push(Math.round(aerr));
  if(ok)T.correct++,T.maxSolved=Math.max(T.maxSolved,level);
  T.lastErr=ok?'correct':err;T.seq.push({level,ok});
  reveal(ok);locked=true;$('#go').classList.remove('ready');
  log(`SCORED #${scoredIdx+1} L${level}: ${cur.viewers.length} viewers, ${cur.objs.length} objs · pick ${sel+1} · ans ${cur.target+1} · ${ok?'CORRECT':'ERR['+err+'] '+aerr.toFixed(0)+'\u00b0'} · rev ${T.rev} · ${rt}ms`);
  const prev=level;level=ok?Math.min(level+1,MAXLEVEL):Math.max(level-1,1);
  log(ok?`escalate ${prev}\u2192${level}`:`back off ${prev}\u2192${level}`);renderMeters();
  setTimeout(nextScored,1400);
}
function nextScored(){locked=false;scoredIdx++;if(scoredIdx<SCORED_N)startScored();else finish();}
function setCue(i){$('#phasecue').textContent=i;}
function loadItem(sc){cur=sc;sel=null;T.rev=0;T.sampled=new Set();T.itemStart=Date.now();T.firstAt=0;renderScene(sc);renderTarget(sc);$('#go').classList.remove('ready');renderMeters();}
function startWarmup(){phase='warmup';locked=false;setCue('\u2b50');level=1;loadItem(genView(1));log('— warm-up (unscored): tap the viewer who sees the strip —');}
function startScored(){phase='scored';setCue('\ud83c\udfaf');loadItem(genView(level));log(`— SCORED item ${scoredIdx+1}/${SCORED_N} · level ${level} · ${cur.viewers.length} candidate viewers —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');locked=true;$('#go').classList.remove('ready');log(`— DONE · correct ${T.correct}/${T.scored} (${pct()}%) · ceiling L${T.maxSolved} · mean |ang| ${mean(T.angErrs)}\u00b0 · ${learnStr()} —`);renderMeters();}

async function runDemo(){
  phase='demo';setCue('\ud83d\udc41\ufe0f');locked=true;
  loadItem(genView(1));log('ghost-hand demo (wordless, <10s): match the view to the viewer');
  ghostShow(true);await sleep(300);
  await ghostTo($('#target'));await ghostTap();await sleep(250);
  const el=$$('.viewer').find(v=>+v.dataset.i===cur.target);
  await ghostTo(el);await ghostTap();selectV(cur.target);await sleep(400);
  await ghostTo($('#go'));await ghostTap();await sleep(250);
  ghostShow(false);await sleep(350);startWarmup();
}

$('#go').onclick=()=>{if($('#go').classList.contains('ready'))submit();};
$('#replay').onclick=()=>{if(phase!=='demo')runDemo();};
window.addEventListener('keydown',e=>{
  if(phase==='demo'||phase==='done')return;
  if(e.key>='1'&&e.key<='9'){const i=+e.key-1;if(cur&&i<cur.viewers.length)selectV(i);}
  else if(e.key==='Enter'){if($('#go').classList.contains('ready'))submit();e.preventDefault();}
});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
