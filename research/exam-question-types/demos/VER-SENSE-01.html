<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VER-SENSE-01 · Sentence Sense</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:700px;width:100%}
  .band{border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
  #previewBand{background:linear-gradient(160deg,#e8f0ff,#f2ecff);border:3px solid #cfd8ff;font-size:22px;min-height:40px}
  #foundBand{background:linear-gradient(160deg,#eafaf1,#eef1ff);border:3px solid #bfe8cf;font-size:13px;color:#3a7a55;width:100%}
  #foundList{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  #foundList span{background:#fff;border-radius:10px;padding:3px 8px;border:1px solid #bfe8cf}
  .slotRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
  .chip{display:flex;flex-direction:column;align-items:center;gap:2px;background:#f4f6ff;border:3px solid #d7deff;border-radius:14px;padding:8px 12px;cursor:pointer;font-size:22px;position:relative}
  .chip:hover{border-color:#b9c2ee}
  .chip .wd{font-size:10px;font-weight:700;color:#5060a0}
  .chip.sel{border-color:var(--accent);background:#e7ecff}
  .rowLabel{font-size:10px;color:#8a93b5;text-transform:uppercase;letter-spacing:.06em;width:100%;text-align:center;margin-top:2px}
  #controls{display:flex;gap:16px;align-items:center}
  button.rd{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:64px;height:64px;background:var(--accent);color:#fff;font-size:26px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:50px;height:50px;background:#eef1ff;color:#5b6cff;font-size:22px}
  #attemptDots{display:flex;gap:6px}
  .adot{width:12px;height:12px;border-radius:50%;background:#dfe4ff}
  .adot.valid{background:var(--good)}.adot.invalid{background:var(--bad)}
  .shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;transition:transform .55s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #diffmeter{width:100%;display:flex;align-items:center;gap:8px;font-size:11px;color:#8a93b5}
  #diffbar{flex:1;height:8px;background:#e4e9ff;border-radius:6px;overflow:hidden}
  #diffbar i{display:block;height:100%;background:linear-gradient(90deg,#5b6cff,#ff8fd0);width:0%;transition:.3s}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:210px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">VER-SENSE-01 · Sentence Sense</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="previewBand" class="band"><div id="preview">▢ ▢ ▢</div></div>
      <div id="slots"></div>
      <div id="foundBand" class="band">✅ valid sentences found: <span id="foundCount">0</span><div id="foundList"></div></div>
      <div id="attemptDots"></div>
      <div id="diffmeter">🌱<div id="diffbar"><i id="diffbarfill"></i></div>🌳</div>
      <div id="controls">
        <button class="rd" id="replay" title="replay demo">↻</button>
        <button class="rd" id="go" title="submit">✓</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,last=a=>a[a.length-1];

/* ---------- fixed small word bank + finite slot-grammar rule ---------- */
const S=[{k:'dog',ic:'\ud83d\udc36'},{k:'cat',ic:'\ud83d\udc31'},{k:'bird',ic:'\ud83d\udc26'}];
const V=[{k:'chased',ic:'\ud83c\udfc3'},{k:'ate',ic:'\ud83c\udf7d\ufe0f'},{k:'watched',ic:'\ud83d\udc40'}];
const O=[{k:'mouse',ic:'\ud83d\udc2d'},{k:'bone',ic:'\ud83e\uddb4'},{k:'worm',ic:'\ud83d\udc1b'}];
const ADJ=[{k:'big',ic:'\ud83d\udd35'},{k:'little',ic:'\ud83d\udfe0'}];
function isValid(sel){const{s,v,o}=sel;
  if(v==='watched')return true;
  if(v==='chased')return o!=='bone';
  if(v==='ate')return (s==='dog'&&o==='bone')||(s==='cat'&&o==='mouse')||(s==='bird'&&o==='worm');
  return false;}
/* levels: 1-3 basic S-V-O bank subsets; 4-6 add an Adjective slot (deeper grammar) */
const LEVELS={
 1:{s:S.slice(0,2),v:[V[0],V[2]],o:[O[0],O[2]],adj:false,attempts:4,need:2,inf:'basic-SVO'},
 2:{s:S,v:V,o:O,adj:false,attempts:4,need:2,inf:'basic-SVO'},
 3:{s:S,v:V,o:O,adj:false,attempts:4,need:3,inf:'basic-SVO'},
 4:{s:S,v:V,o:O,adj:true,attempts:4,need:2,inf:'SVO+adjective'},
 5:{s:S,v:V,o:O,adj:true,attempts:4,need:3,inf:'SVO+adjective'},
 6:{s:S,v:V,o:O,adj:true,attempts:4,need:4,inf:'SVO+adjective'},
};
function byLevel(l){return LEVELS[l];}
const INF_RANK={'basic-SVO':0,'SVO+adjective':1};

/* ---------- telemetry ---------- */
const T={totalAttempts:0,validAttempts:0,path:[],revisions:0,maxLevel:1,bestInfRank:-1,bestInf:'\u2014',lastErr:'\u2014',sessionFound:0,roundFound:0,itemStart:0};
const METERS=[
 {id:'M-ACC',name:'Validity rate (valid/attempts)',get:()=>T.totalAttempts?`${T.validAttempts}/${T.totalAttempts}  ${Math.round(100*T.validAttempts/T.totalAttempts)}%`:'\u2014'},
 {id:'M-POLY',name:'Distinct valid sentences (open count)',get:()=>`round ${T.roundFound} · session ${T.sessionFound}`},
 {id:'M-PATH',name:'Slot picks this attempt',get:()=>T.path.length?T.path.slice(-8).join(' \u2192 '):'\u2014'},
 {id:'M-INFDEPTH',name:'Deepest grammar cleared',get:()=>T.bestInf},
 {id:'M-ERRTYPE',name:'Last invalid-attempt reason',get:()=>T.lastErr},
 {id:'M-REV',name:'Revisions (slot re-picks)',get:()=>`${T.revisions}`},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});$('#diffbarfill').style.width=(T.maxLevel/6*100)+'%';}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(520);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(430);}

/* ---------- render ---------- */
let cur=null,level=1,locked=false,sel={},foundSet=new Set(),attemptI=0;
function rowsFor(cfg){const rows=[];if(cfg.adj)rows.push(['adj',ADJ]);rows.push(['s',cfg.s],['v',cfg.v],['o',cfg.o]);return rows;}
function renderSlots(cfg){$('#slots').innerHTML=rowsFor(cfg).map(([key,opts])=>
  `<div class="slotRow" data-key="${key}">${opts.map(o=>`<div class="chip" data-key="${key}" data-val="${o.k}"><span>${o.ic}</span><span class="wd">${o.k}</span></div>`).join('')}<div class="rowLabel">${key.toUpperCase()}</div></div>`).join('');}
function updatePreview(cfg){const parts=[];if(cfg.adj)parts.push(sel.adj?ADJ.find(a=>a.k===sel.adj).ic+' '+sel.adj:'\u25a2');
  parts.push(sel.s?S.find(x=>x.k===sel.s).ic+' '+sel.s:'\u25a2');
  parts.push(sel.v?V.find(x=>x.k===sel.v).ic+' '+sel.v:'\u25a2');
  parts.push(sel.o?O.find(x=>x.k===sel.o).ic+' '+sel.o:'\u25a2');
  $('#preview').textContent=parts.join('  ');
  $('#go').classList.toggle('ready',Object.keys(sel).length===rowsFor(cfg).length);}
function renderFound(){$('#foundCount').textContent=foundSet.size;$('#foundList').innerHTML=[...foundSet].map(s=>`<span>${s}</span>`).join('');}
function renderDots(cfg){$('#attemptDots').innerHTML=Array.from({length:cfg.attempts},()=>'<span class="adot"></span>').join('');}
function newRound(){cur=byLevel(level);sel={};foundSet=new Set();attemptI=0;T.roundFound=0;T.itemStart=Date.now();
  renderSlots(cur);updatePreview(cur);renderFound();renderDots(cur);renderMeters();}
function pickSlot(key,val){if(locked)return;if(sel[key]!==undefined&&sel[key]!==val)T.revisions++;
  sel[key]=val;$$(`.chip[data-key="${key}"]`).forEach(c=>c.classList.toggle('sel',c.dataset.val===val));updatePreview(cur);}
function sentenceKey(){return (cur.adj?sel.adj+' ':'')+sel.s+' '+sel.v+' '+sel.o;}
function submitAttempt(){if(!$('#go').classList.contains('ready')||locked)return;
  T.path=Object.keys(sel).map(k=>k+':'+sel[k]);
  const valid=isValid(sel);const key=sentenceKey();const dup=foundSet.has(key);
  T.totalAttempts++;if(valid)T.validAttempts++;
  const dot=$$('#attemptDots .adot')[attemptI];if(dot)dot.classList.add(valid&&!dup?'valid':'invalid');
  if(valid&&!dup){foundSet.add(key);T.roundFound=foundSet.size;T.sessionFound++;}
  T.lastErr=valid?(dup?'duplicate (already found)':'none (valid)'):'implausible combination';
  log(`attempt ${attemptI+1}/${cur.attempts}: "${key}" \u2192 ${valid?(dup?'VALID (dup)':'VALID (new)'):'INVALID'}`);
  renderFound();renderMeters();
  attemptI++;sel={};$$('.chip').forEach(c=>c.classList.remove('sel'));updatePreview(cur);
  if(attemptI>=cur.attempts){locked=true;setTimeout(finalizeRound,900);}}
function finalizeRound(){const success=foundSet.size>=cur.need;
  if(phase==='warmup'){log(`warm-up round done: ${foundSet.size} valid found — UNSCORED`);setTimeout(nextPhase,1300);return;}
  if(success){T.maxLevel=Math.max(T.maxLevel,level);const r=INF_RANK[cur.inf];if(r>T.bestInfRank){T.bestInfRank=r;T.bestInf=cur.inf;}}
  log(`— ROUND L${level} [${cur.inf}] \u2192 ${foundSet.size}/${cur.need} needed \u00b7 ${success?'PASS':'FAIL'} —`);
  level=success?Math.min(6,level+1):Math.max(1,level-1);
  renderMeters();setTimeout(nextPhase,1000);}
const TOTAL_SCORED=6;let phase='demo',scoredIndex=0;
function setCue(i){$('#phasecue').textContent=i;}
function nextPhase(){locked=false;if(phase==='warmup'){scoredIndex=0;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<TOTAL_SCORED?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('\u2b50');level=1;newRound();log('— warm-up (unscored) —');}
function startScored(){phase='scored';setCue('\ud83c\udfaf');newRound();log(`— SCORED round ${scoredIndex+1}/${TOTAL_SCORED} · level ${level} —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');locked=true;log(`— DONE · session valid sentences ${T.sessionFound} · ceiling L${T.maxLevel} —`);renderMeters();}
async function runDemo(){phase='demo';setCue('\ud83d\udc41\ufe0f');locked=true;level=1;newRound();
  log('ghost-hand demo (wordless, <10s)');ghostShow(true);await sleep(300);
  const demoSel={s:'dog',v:'chased',o:'mouse'};
  for(const k of ['s','v','o']){const el=$$(`.chip[data-key="${k}"][data-val="${demoSel[k]}"]`)[0];await ghostTo(el);await ghostTap();pickSlot(k,demoSel[k]);await sleep(150);}
  await sleep(250);await ghostTo($('#go'));await ghostTap();locked=false;submitAttempt();locked=true;
  await sleep(700);ghostShow(false);await sleep(400);T.itemStart=Date.now();startWarmup();}
$('#slots').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c&&!locked&&phase!=='demo'&&phase!=='done')pickSlot(c.dataset.key,c.dataset.val);});
$('#go').addEventListener('click',()=>{if(phase!=='demo'&&phase!=='done')submitAttempt();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
