<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPA-XSCAN-01 · Scan Stacker</title>
<style>
:root{--ink:#1f3045;--cyan:#18bfe5;--blue:#4361ee;--orange:#ff8b3d;--pink:#ef5da8;--good:#19a873;--bad:#e4485c;--tel:#0a1425;--tel2:#122440}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{display:flex;background:linear-gradient(145deg,#e8f8ff,#fff2df);font:16px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
#wrap{flex:1;min-width:0;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px}#badge{font-size:12px;font-weight:850;letter-spacing:.09em;color:#758497;text-transform:uppercase}#phasecue{height:42px;font-size:34px}
#stagecard{width:min(750px,100%);background:#fff;border-radius:27px;padding:16px;box-shadow:0 24px 60px -32px #1c5577;display:grid;gap:13px}
#canvasWrap{background:#071628;border:2px solid #193858;border-radius:20px;overflow:hidden}canvas{display:block;width:100%;height:auto;aspect-ratio:7/4}
#scanControl{position:relative;padding:8px 10px;background:#eafaff;border:2px solid #b8eaf7;border-radius:15px;display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:8px}.scanIcon{font-size:24px;text-align:center}#slider{width:100%;accent-color:var(--cyan);height:28px}#targetMark{position:absolute;top:9px;bottom:9px;width:4px;border-radius:4px;background:var(--orange);left:50%;pointer-events:none;box-shadow:0 0 0 3px #ffdbbf}
#options{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.option{border:3px solid #e1e8ef;background:#fff;border-radius:16px;padding:8px;min-height:105px;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:4px;cursor:pointer;transition:.15s}.option:hover,.option:focus-visible{outline:none;transform:translateY(-2px);border-color:#83cfe2}.option.sel{border-color:var(--blue);box-shadow:0 0 0 4px #dbe4ff}.option.good{border-color:var(--good);background:#eafff6}.option.bad{border-color:var(--bad);background:#fff0f2}.key{width:26px;height:25px;border-radius:8px;background:#172b42;color:#fff;font-weight:900;display:grid;place-items:center;box-shadow:0 3px 0 #081321}.shapeSvg{width:100%;height:78px}
#hotkeys{text-align:center;color:#728497;font:700 11px ui-monospace,monospace}.kbd{display:inline-grid;place-items:center;height:22px;min-width:23px;padding:0 5px;border:1px solid #c4ced7;border-bottom-width:3px;border-radius:6px;background:#fff;color:#2c4154;margin:0 2px}
#controls{display:flex;justify-content:center;align-items:center;gap:12px}.round{border:0;border-radius:50%;cursor:pointer;font:800 24px system-ui}.round:focus-visible{outline:4px solid #aee8f5;outline-offset:2px}#replay{width:50px;height:50px;background:#e6f8fc;color:#148ca6}#lock{width:66px;height:66px;background:var(--cyan);color:#fff;box-shadow:0 10px 24px -10px #0d92b1}#lock:disabled{opacity:.25;cursor:not-allowed}
#ghost{position:fixed;left:0;top:0;z-index:90;font-size:38px;opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .2s;filter:drop-shadow(0 3px 4px #0006)}#ghost.show{opacity:1}#ghost.tap{animation:tap .34s}@keyframes tap{50%{scale:.76}}
#telemetry{width:335px;flex:0 0 335px;min-height:100vh;background:var(--tel);color:#d5ecff;display:flex;flex-direction:column;font:13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace}#telemetry h3{margin:0;padding:13px 15px;background:var(--tel2);color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
#mountain{margin:12px 12px 4px;padding:10px;border:1px solid #25415f;border-radius:12px}.mountTop{display:flex;justify-content:space-between;color:#81a1c3;font-size:11px}.track{height:9px;background:#1b3550;border-radius:9px;overflow:hidden;margin-top:7px}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#18bfe5,#4361ee,#ef5da8);transition:.3s}
#mlist{padding:8px 12px;display:grid;gap:7px}.mrow{display:grid;grid-template-columns:106px 1fr;gap:6px}.mid{color:#7fffcf;font-weight:800}.mval{color:#fff;text-align:right;overflow-wrap:anywhere}.mname{grid-column:1/3;color:#6b8bad;font-size:11px;margin-top:-4px}#logwrap{border-top:1px solid #1f3854;margin-top:auto}#logwrap b{display:block;padding:8px 12px 4px;color:#7698bb;font-size:11px;letter-spacing:.08em}#log{height:220px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}#log div{padding:3px 0;border-bottom:1px dotted #1c334d}#log .t{color:#56799d}
@media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;min-height:0;height:330px;flex:none}}@media(max-width:560px){#options{grid-template-columns:1fr 1fr}.option{min-height:82px}.shapeSvg{height:58px}}@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="wrap">
  <div id="badge">SPA-XSCAN-01 · Scan Stacker</div>
  <div id="phasecue">👁️</div>
  <main id="stagecard">
    <div id="canvasWrap"><canvas id="scene" width="700" height="400" aria-label="three dimensional solid with a sweeping slice plane"></canvas></div>
    <div id="scanControl"><span class="scanIcon">◁</span><input id="slider" type="range" min="0" max="100" value="50" aria-label="sweep cutting plane"><span class="scanIcon">▷</span><i id="targetMark"></i></div>
    <div id="options" aria-label="cross-section shape choices"></div>
    <div id="hotkeys"><span class="kbd">←</span><span class="kbd">→</span> · <span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span><span class="kbd">4</span> · <span class="kbd">I</span><span class="kbd">J</span><span class="kbd">K</span><span class="kbd">L</span> · <span class="kbd">↵</span></div>
    <div id="controls"><button id="replay" class="round" title="replay forward scan" aria-label="replay scan">↻</button><button id="lock" class="round" title="lock shape" aria-label="lock shape" disabled>✓</button></div>
  </main>
</div>
<aside id="telemetry">
  <h3>Live telemetry · per-child</h3>
  <div id="mountain"><div class="mountTop"><span>CHALLENGE MOUNTAIN</span><span id="mountText">1/5 · Δ 0.00</span></div><div class="track"><i id="mountFill"></i></div></div>
  <div id="mlist"></div>
  <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
</aside>
<div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],sleep=ms=>new Promise(r=>setTimeout(r,ms)),ctx=$('#scene').getContext('2d');
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const V=(x,y,z)=>[x,y,z],add=(a,b)=>a.map((x,i)=>x+b[i]),sub=(a,b)=>a.map((x,i)=>x-b[i]),mul=(a,s)=>a.map(x=>x*s),dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{const n=Math.hypot(...a)||1;return a.map(x=>x/n)};
// Minimal 3D: rotate (yaw,pitch) + orthographic project; painter's-algorithm faces.
function proj(p,yaw,pit,s,cx,cy){const cy_=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pit),sp=Math.sin(pit);let x=p[0]*cy_+p[2]*sy,z=-p[0]*sy+p[2]*cy_,y=p[1]*cp-z*sp;z=p[1]*sp+z*cp;return{x:cx+x*s,y:cy-y*s,z};}
function drawFaces(c,verts,faces,yaw,pit,s,cx,cy){const P=verts.map(v=>proj(v,yaw,pit,s,cx,cy));faces.map(f=>({f,depth:f.idx.reduce((a,i)=>a+P[i].z,0)/f.idx.length})).sort((a,b)=>a.depth-b.depth).forEach(({f})=>{c.beginPath();f.idx.forEach((i,k)=>k?c.lineTo(P[i].x,P[i].y):c.moveTo(P[i].x,P[i].y));c.closePath();c.fillStyle=f.fill;c.fill();c.strokeStyle='#274662';c.lineWidth=2;c.stroke()});}
function solid(verts,faceIdx,colors){return{verts,faces:faceIdx.map((idx,i)=>({idx,fill:colors[i%colors.length]}))};}
const COLORS=['#56c9e8','#42b2db','#319ac8','#79d9ee','#2f91bd','#8ce2f2','#4ebbdc','#2885b1'];
function prismN(n,skew=0){const verts=[];for(const z of [-1,1])for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;verts.push(V(Math.cos(a)+(z>0?skew:0),Math.sin(a),z))}const faces=[[...Array(n).keys()].reverse(),[...Array(n).keys()].map(i=>i+n)];for(let i=0;i<n;i++)faces.push([i,(i+1)%n,(i+1)%n+n,i+n]);return solid(verts,faces,COLORS);}
const SOLIDS={
 cube:solid([V(-1,-1,-1),V(1,-1,-1),V(1,1,-1),V(-1,1,-1),V(-1,-1,1),V(1,-1,1),V(1,1,1),V(-1,1,1)],[[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[1,5,6,2],[0,3,7,4]],COLORS),
 pyramid:solid([V(-1,-1,-1),V(1,-1,-1),V(1,-1,1),V(-1,-1,1),V(0,1.25,0)],[[0,1,2,3],[0,4,1],[1,4,2],[2,4,3],[3,4,0]],COLORS),
 tetra:solid([V(0,1.25,0),V(-1,-.9,-.8),V(1,-.9,-.8),V(0,-.9,1.1)],[[0,1,2],[0,2,3],[0,3,1],[1,3,2]],COLORS),
 tri:prismN(3,.12),
 octa:solid([V(0,1.3,0),V(0,-1.3,0),V(1,0,0),V(0,0,1),V(-1,0,0),V(0,0,-1)],[[0,2,3],[0,3,4],[0,4,5],[0,5,2],[1,3,2],[1,4,3],[1,5,4],[1,2,5]],COLORS),
 pent:prismN(5,.38)
};
function edgesOf(s){const set=new Set(),out=[];s.faces.forEach(f=>f.idx.forEach((a,i)=>{const b=f.idx[(i+1)%f.idx.length],k=a<b?`${a},${b}`:`${b},${a}`;if(!set.has(k)){set.add(k);out.push([a,b])}}));return out;}
function basis(n){const ref=Math.abs(n[1])<.88?[0,1,0]:[1,0,0],u=norm(cross(n,ref)),v=norm(cross(n,u));return{u,v};}
function planeFor(s,pos,tilt,twist){const a=tilt/100*Math.PI*.4,b=twist/100*Math.PI,n=norm([Math.sin(a)*Math.cos(b),Math.cos(a),Math.sin(a)*Math.sin(b)]),ds=s.verts.map(p=>dot(n,p)),lo=Math.min(...ds),hi=Math.max(...ds),d=lo+(.06+.88*pos/100)*(hi-lo);return{n,d,...basis(n)};}
function section(s,pl){const pts=[];for(const [ia,ib] of edgesOf(s)){const a=s.verts[ia],b=s.verts[ib],da=dot(pl.n,a)-pl.d,db=dot(pl.n,b)-pl.d;if(Math.abs(da)<1e-7)pts.push(a);if(da*db< -1e-8){const q=da/(da-db);pts.push(add(a,mul(sub(b,a),q)))}}const u=[];pts.forEach(p=>{if(!u.some(q=>Math.hypot(...sub(p,q))<1e-5))u.push(p)});if(u.length<3)return[];const c=mul(u.reduce(add,V(0,0,0)),1/u.length);return u.sort((a,b)=>Math.atan2(dot(sub(a,c),pl.v),dot(sub(a,c),pl.u))-Math.atan2(dot(sub(b,c),pl.v),dot(sub(b,c),pl.u)));}
function planePatch(pl){const c=mul(pl.n,pl.d),r=1.48;return[add(c,add(mul(pl.u,-r),mul(pl.v,-r))),add(c,add(mul(pl.u,r),mul(pl.v,-r))),add(c,add(mul(pl.u,r),mul(pl.v,r))),add(c,add(mul(pl.u,-r),mul(pl.v,r)))];}
function drawPoly(points,fill,stroke,width=3){if(points.length<3)return;const P=points.map(p=>proj(p,yaw,pitch,112,350,202));ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}
const LIB=[
 {level:1,solid:'cube',tilt:0,twist:0,target:50},
 {level:2,solid:'tetra',tilt:0,twist:0,target:44},
 {level:3,solid:'tri',tilt:38,twist:8,target:53},
 {level:4,solid:'cube',tilt:76,twist:25,target:50},
 {level:5,solid:'octa',tilt:67,twist:68,target:47},
 {level:5,solid:'pent',tilt:82,twist:39,target:57}
];
const PALETTE=['#ef476f','#3a86ff','#20b486','#8b5cf6','#ff9f1c','#06b6d4'];
const T={scored:0,correct:0,rts:[],first:0,revs:0,scrubs:0,bins:new Set(),error:'—',poly:'—',maxSolved:0,level:1,startLevel:1,itemStart:0,replays:0,rapid:false,blur:false,lastActivity:performance.now()};
let phase='demo',item=LIB[0],options=[],selected=-1,trial=0,locked=true,animating=false,yaw=-.63,pitch=.43;
function learnRate(){return T.scored?((T.maxSolved-T.startLevel)/T.scored).toFixed(2):'0.00';}
function targetSides(){const s=SOLIDS[item.solid],pl=planeFor(s,item.target,item.tilt,item.twist);return section(s,pl).length;}
function rtText(){if(!T.rts.length)return'—';return T.rapid||T.blur?'gated':`${T.rts.at(-1)} ms · μ ${mean(T.rts)}`;}
const METERS=[
 {id:'M-ACC',name:'Exact cross-section choice',get:()=>T.scored?`${T.correct}/${T.scored} · ${Math.round(100*T.correct/T.scored)}%`:'—'},
 {id:'M-POLY',name:'Selected/true vertex overlap',get:()=>T.poly},
 {id:'M-RT',name:'Commit time, engagement-gated',get:rtText},
 {id:'M-RTFIRST',name:'Time to first scan or pick',get:()=>T.first?`${Math.round(T.first)} ms`:'—'},
 {id:'M-REV',name:'Shape-choice revisions',get:()=>String(T.revs)},
 {id:'M-EXPLORE',name:'Smooth scan exploration',get:()=>`${T.scrubs} moves · ${T.bins.size} zones`},
 {id:'M-ERRTYPE',name:'Last polygon near-miss',get:()=>T.error},
 {id:'M-DIFFREACH',name:'Hardest scan level solved',get:()=>`${T.maxSolved}/5 · Δ/trial ${learnRate()}`}
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{$('#v_'+m.id).textContent=m.get()});$('#mountFill').style.width=(T.level/5*100)+'%';$('#mountText').textContent=`${T.level}/5 · Δ ${learnRate()}`;}
function log(msg){const d=document.createElement('div');d.innerHTML=`<span class="t">+${Math.round(Math.max(0,performance.now()-T.itemStart))}ms</span> ${msg}`;$('#log').appendChild(d);$('#log').scrollTop=$('#log').scrollHeight;}
function first(){if(!T.first){T.first=performance.now()-T.itemStart;log(`first action @ ${Math.round(T.first)}ms`)}}
function draw(){const s=SOLIDS[item.solid],pos=+$('#slider').value,pl=planeFor(s,pos,item.tilt,item.twist),poly=section(s,pl);ctx.clearRect(0,0,700,400);const g=ctx.createRadialGradient(350,180,20,350,200,420);g.addColorStop(0,'#173c58');g.addColorStop(1,'#06101e');ctx.fillStyle=g;ctx.fillRect(0,0,700,400);
 ctx.strokeStyle='#18334a';for(let x=20;x<690;x+=35){ctx.beginPath();ctx.moveTo(x,15);ctx.lineTo(x,385);ctx.stroke()}for(let y=15;y<395;y+=35){ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(690,y);ctx.stroke()}
 drawFaces(ctx,s.verts,s.faces,yaw,pitch,112,350,202);drawPoly(planePatch(pl),'#ff8b3d38','#ffaf75',2);drawPoly(poly,'#1fe0dd8f','#b8ffff',5);
 const p=proj(mul(pl.n,pl.d),yaw,pitch,112,350,202);ctx.beginPath();ctx.arc(p.x,p.y,8,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#ff8b3d';ctx.lineWidth=4;ctx.stroke();
}
function polySvg(n,color){const pts=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;pts.push(`${50+35*Math.cos(a)},${42+35*Math.sin(a)}`)}return `<svg class="shapeSvg" viewBox="0 0 100 84" aria-hidden="true"><polygon points="${pts.join(' ')}" fill="${color}bb" stroke="${color}" stroke-width="4"/><circle cx="50" cy="42" r="4" fill="#fff"/></svg>`;}
function makeOptions(){const correct=targetSides(),pool=[3,4,5,6,7,8].filter(n=>n!==correct).sort((a,b)=>Math.abs(a-correct)-Math.abs(b-correct)),raw=[correct,...pool.slice(0,3)],shift=(trial+item.level)%4;options=[...raw.slice(shift),...raw.slice(0,shift)];$('#options').innerHTML=options.map((n,i)=>`<button class="option" data-i="${i}" aria-label="choice ${i+1}, ${n} sided shape"><span class="key">${i+1}</span>${polySvg(n,PALETTE[i])}</button>`).join('');}
function positionMark(){const pct=item.target/100;$('#targetMark').style.left=`calc(${pct*100}% + ${42-84*pct}px)`;}
function setItem(next,fresh=true){item=next;$('#slider').value=10;selected=-1;locked=true;$('#lock').disabled=true;makeOptions();positionMark();$('#phasecue').textContent=phase==='demo'?'👁️':phase==='warmup'?'⭐':'🎯';if(fresh){T.itemStart=performance.now();T.first=0;T.revs=0;T.scrubs=0;T.bins=new Set();T.error='—';T.poly='—';T.rapid=false;T.blur=false;T.lastActivity=performance.now()}draw();renderMeters();}
function choose(i,modality='tap'){if(locked||animating||i<0||i>3)return;first();if(selected>=0&&selected!==i)T.revs++;selected=i;$$('.option').forEach((o,k)=>o.classList.toggle('sel',k===i));const a=options[i],b=targetSides();T.poly=Math.round(100*Math.min(a,b)/Math.max(a,b))+'% vertices';$('#lock').disabled=false;log(`shape ${a} sides via ${modality}`);renderMeters();}
function scanInput(track=true){if(locked||animating)return;first();if(track){T.scrubs++;T.bins.add(Math.round(+$('#slider').value/10));}draw();renderMeters();}
$('#slider').addEventListener('input',()=>scanInput(true));
function activity(){T.lastActivity=performance.now()}addEventListener('pointerdown',activity);addEventListener('keydown',activity);document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='scored')T.blur=true});
function gate(rt){T.rapid=rt<400||performance.now()-T.lastActivity>22000;if(T.rapid||T.blur)log(`RT gate: ${T.rapid?'rapid/idle':'blur'}`);}
function errType(a,b){const d=Math.abs(a-b);return d===1?'off-by-one edge':(a%2===b%2?'same-parity shape':'wrong shape family');}
async function submit(){if(locked||selected<0||animating)return;locked=true;$('#lock').disabled=true;const rt=Math.round(performance.now()-T.itemStart),a=options[selected],b=targetSides(),ok=a===b;$$('.option')[selected].classList.add(ok?'good':'bad');$$('.option')[options.indexOf(b)].classList.add('good');
 if(phase==='warmup'){log(`warm-up ${ok?'correct':'guided reveal'} · unscored`);$('#phasecue').textContent=ok?'✅':'↻';await sleep(900);startScored();return}
 T.scored++;T.rts.push(rt);gate(rt);if(ok){T.correct++;T.maxSolved=Math.max(T.maxSolved,item.level);T.level=Math.min(5,T.level+1);T.error='—'}else{T.level=Math.max(1,T.level-1);T.error=errType(a,b)}T.poly=Math.round(100*Math.min(a,b)/Math.max(a,b))+'% vertices';$('#phasecue').textContent=ok?'✅':'🔎';log(`LOCK ${ok?'correct':'miss '+T.error} · ${a}/${b} sides · L${item.level} · ${rt}ms`);renderMeters();await sleep(1000);trial++;trial<6?startScored():finish();
}
async function sweep(trackReplay=false){if(animating)return;animating=true;locked=true;$('#lock').disabled=true;const start=performance.now(),dur=1450;while(true){const q=Math.min(1,(performance.now()-start)/dur),v=q<.62?8+(92-8)*(q/.62):92+(item.target-92)*((q-.62)/.38);$('#slider').value=Math.round(v);draw();if(q>=1)break;await new Promise(requestAnimationFrame)}$('#slider').value=item.target;draw();animating=false;locked=phase==='demo';if(phase!=='demo')locked=false;$('#lock').disabled=selected<0||locked;if(trackReplay){T.replays++;T.scrubs++;T.bins.add(Math.round(item.target/10));log('forward scan replay');renderMeters()}}
function startWarmup(){phase='warmup';setItem({level:1,solid:'tetra',tilt:0,twist:0,target:48},true);log('warm-up · unscored');sweep(false);}
function scoredTemplate(level){const arr=LIB.filter(x=>x.level===level),base=arr[(trial+level)%arr.length];return{...base,target:clamp(base.target+(trial%3-1)*4,20,80)}}
function startScored(){phase='scored';setItem(scoredTemplate(T.level),true);log(`scored ${trial+1}/6 · L${item.level} · ${item.solid} · obliquity ${item.tilt}`);sweep(false);}
function finish(){phase='done';locked=true;$('#phasecue').textContent='🏆';$('#lock').disabled=true;$$('.option').forEach(o=>o.disabled=true);log(`DONE · ${T.correct}/${T.scored} · max L${T.maxSolved} · Δ ${learnRate()}`);renderMeters();}
const ghost=$('#ghost');async function ghostTo(el){const r=el.getBoundingClientRect();ghost.style.transform=`translate(${r.left+r.width/2-12}px,${r.top+r.height/2-10}px)`;await sleep(460)}async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(330)}
async function runDemo(){phase='demo';setItem(LIB[0],false);ghost.classList.add('show');await ghostTo($('#slider'));await sweep(false);const i=options.indexOf(targetSides()),o=$$('.option')[i];await ghostTo(o);await ghostTap();o.classList.add('sel','good');await sleep(380);ghost.classList.remove('show');startWarmup();}
$('#options').addEventListener('click',e=>{const o=e.target.closest('.option');if(o)choose(+o.dataset.i,'tap')});$('#lock').addEventListener('click',submit);$('#replay').addEventListener('click',()=>{if(animating||phase==='demo'||phase==='done')return;sweep(true)});
addEventListener('resize',positionMark);addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(/^[1-4]$/.test(e.key))choose(+e.key-1,'key');else if(e.key==='Enter')submit();else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){if(!locked){$('#slider').value=clamp(+$('#slider').value+(e.key==='ArrowRight'?4:-4),0,100);scanInput(true)}}else if(k==='j'){yaw-=.12;draw()}else if(k==='l'){yaw+=.12;draw()}else if(k==='i'){pitch-=.1;draw()}else if(k==='k'){pitch+=.1;draw()}else return;e.preventDefault()});
buildMeters();setItem(LIB[0],false);renderMeters();runDemo();
</script>
