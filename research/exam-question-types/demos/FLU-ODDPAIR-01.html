<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-ODDPAIR-01 · Odd Pair Out</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#fff;--accent:#5b6cff;--good:#22b573;--bad:#ff6b6b;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px;line-height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:600px;width:100%}
  .pair{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;border:3px solid #eef1fb;cursor:pointer;width:100%;justify-content:center;transition:.12s;background:#fbfcff}
  .pair:hover{border-color:#cdd6f4}
  .pair.sel{border-color:var(--accent);box-shadow:0 0 0 3px #dfe4ff}
  .pair.good{border-color:var(--good);background:#eafaf1}
  .pair.bad{border-color:var(--bad);background:#fdeeee}
  .cell{width:88px;height:88px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -8px #6a74b0}
  .arw{font-size:26px;color:#9aa6d6}
  #conf{display:none;gap:12px;align-items:center}
  #conf.on{display:flex}
  .cbtn{border-radius:12px;padding:8px 14px;border:2px solid #dde3f7;background:#fff;cursor:pointer;font:inherit}
  #tools{display:flex;gap:14px;align-items:center;margin-top:4px}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:auto;height:auto;border-radius:14px;padding:11px 22px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;opacity:.4;pointer-events:none}
  #go.ready{opacity:1;pointer-events:auto}
  #replay{width:46px;height:46px;background:#eef1ff;color:#5b6cff;font-size:20px}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;transition:transform .6s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:98px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}
  .mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:190px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:280px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-ODDPAIR-01 · Odd Pair Out</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="pairs"></div>
      <div id="conf"><span style="font-size:13px;color:#8a93b5">how sure?</span><button class="cbtn" data-c="1">🤔 not sure</button><button class="cbtn" data-c="3">😎 sure</button></div>
      <div id="tools">
        <button id="replay" title="replay demo">↻</button>
        <button id="go">Check ✓</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const COLORS=['#e6194b','#4363d8','#2ca25f','#f58231'];
function arrowSVG(f,box=76){const cx=box/2,cy=box/2,s=(f.big?1.15:0.82)*box*0.3;
  const pts=`0,${-s*0.5} ${s*0.5},0 ${s*0.2},0 ${s*0.2},${s*0.6} ${-s*0.2},${s*0.6} ${-s*0.2},0 ${-s*0.5},0`;
  let dots='';for(let i=0;i<f.dots;i++)dots+=`<circle cx="${8+i*10}" cy="${box-7}" r="3.4" fill="${f.color}"/>`;
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}"><g transform="translate(${cx},${cy}) rotate(${f.rot})"><polygon points="${pts}" fill="${f.color}"/></g>${dots}</svg>`;}
const TF={turn:f=>f.rot=(f.rot+90)%360, grow:f=>f.big=true, add:f=>f.dots=Math.min(3,f.dots+1), recolor:f=>f.color=COLORS[(COLORS.indexOf(f.color)+2)%COLORS.length]};
function baseFig(){return{rot:[0,90,180,270][Math.random()*4|0],big:false,dots:Math.random()<.5?0:1,color:COLORS[Math.random()*COLORS.length|0]};}
function applied(base,tlist){const g={...base};tlist.forEach(t=>TF[t](g));return g;}

/* telemetry */
const T={rts:[],firsts:[],acc:0,n:0,ruleDimMax:0,errTypes:[],conf:[],itemStart:0,firstTap:null};
function errStr(){if(!T.errTypes.length)return 'none';const c={};T.errTypes.forEach(e=>c[e]=(c[e]||0)+1);return Object.entries(c).map(([k,v])=>k+':'+v).join(' ');}
const METERS=[
 {id:'M-ACC',name:'Odd-pair accuracy',get:()=>T.n?`${T.acc}/${T.n}  ${Math.round(100*T.acc/T.n)}%`:'\u2014'},
 {id:'M-RT',name:'Response time (mean)',get:()=>T.rts.length?mean(T.rts)+' ms':'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency (mean)',get:()=>T.firsts.length?mean(T.firsts)+' ms':'\u2014'},
 {id:'M-RULEID',name:'Max relational dims of shared rule solved',get:()=>T.ruleDimMax||'\u2014'},
 {id:'M-ERRTYPE',name:'Error type (near-miss vs other)',get:()=>errStr()},
 {id:'M-CONF',name:'Confidence taps (1 unsure / 3 sure)',get:()=>T.conf.length?T.conf.join(','):'\u2014'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');const ghostShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(560);}

/* items: shared transform list + odd transform list; dims = shared.length */
const ITEMS={
  warm:{shared:['grow'],odd:['turn']},
  s1:{shared:['turn'],odd:['add']},
  s2:{shared:['turn','grow'],odd:['turn']}};
let phase='demo',cur=null,oddIdx=-1,sel=-1,lureIdx=-1,pairs=[];
function setCue(i){$('#phasecue').textContent=i;}
function buildItem(spec){const rows=[];oddIdx=Math.random()*4|0;
  for(let i=0;i<4;i++){const b=baseFig();const tl=(i===oddIdx)?spec.odd:spec.shared;rows.push({base:b,right:applied(b,tl),odd:i===oddIdx});}
  // lure = a matching pair whose right figure shares orientation/color with odd's right (surface similar)
  const odd=rows[oddIdx];let best=-1,bs=-1;rows.forEach((r,i)=>{if(i===oddIdx)return;let s=(r.right.rot===odd.right.rot)+(r.right.color===odd.right.color);if(s>bs){bs=s;best=i;}});lureIdx=best;
  return rows;}
function renderItem(){const wrap=$('#pairs');wrap.innerHTML='';pairs=[];
  cur.rows.forEach((r,i)=>{const el=document.createElement('div');el.className='pair';el.dataset.i=i;
    el.innerHTML=`<div class="cell">${arrowSVG(r.base)}</div><div class="arw">➜</div><div class="cell">${arrowSVG(r.right)}</div>`;
    wrap.appendChild(el);pairs.push(el);});
  sel=-1;$('#go').classList.remove('ready');$('#conf').classList.remove('on');}
function selectPair(i){if(phase==='demo'||phase==='done'||phase==='conf')return;if(T.firstTap===null){T.firstTap=Date.now();T._first=Date.now()-T.itemStart;}
  sel=i;pairs.forEach(p=>p.classList.toggle('sel',+p.dataset.i===i));$('#go').classList.add('ready');}
function check(){if(sel<0)return;const rt=Date.now()-T.itemStart;const ok=cur.rows[sel].odd;
  T.n++;if(ok){T.acc++;T.ruleDimMax=Math.max(T.ruleDimMax,cur.dims);}
  else T.errTypes.push(sel===lureIdx?'near-miss':'other');
  T.rts.push(rt);if(T._first!=null)T.firsts.push(T._first);
  pairs[sel].classList.add(ok?'good':'bad');if(!ok)pairs[oddIdx].classList.add('good');
  log(`pick pair#${sel+1} · ${ok?'✓ odd pair':'✗ (odd was #'+(oddIdx+1)+')'} · dims ${cur.dims} · rt ${rt}ms`);renderMeters();
  $('#go').classList.remove('ready');phase='conf';$('#conf').classList.add('on');}
function confTap(c){if(phase!=='conf')return;T.conf.push(c);log('confidence: '+(c===3?'sure':'not sure'));renderMeters();$('#conf').classList.remove('on');next();}
let seq=['warm','s1','s2'],si=0;
function next(){si++;if(si<seq.length)startItem(seq[si]);else finish();}
function startItem(key){phase=key==='warm'?'warmup':'scored';cur={rows:buildItem(ITEMS[key]),dims:ITEMS[key].shared.length,scored:key!=='warm'};
  T.itemStart=Date.now();T.firstTap=null;T._first=null;renderItem();renderMeters();setCue(key==='warm'?'\u2b50':'\ud83c\udfaf');
  log(`— ${key==='warm'?'warm-up':'SCORED item '+si}: 3 pairs change the same way, 1 is different —`);}
function finish(){phase='done';setCue('\ud83c\udfc6');log(`— DONE · acc ${T.acc}/${T.n} · max dims ${T.ruleDimMax} —`);}
async function runDemo(){phase='demo';si=0;setCue('\ud83d\udc41\ufe0f');cur={rows:buildItem(ITEMS.warm),dims:1};renderItem();T.itemStart=Date.now();
  log('ghost-hand demo (wordless): trace each change, find the different one');ghostShow(true);
  for(let i=0;i<4;i++){await ghostTo(pairs[i].querySelector('.cell'));await ghostTo(pairs[i].querySelectorAll('.cell')[1]);}
  await ghostTo(pairs[oddIdx]);pairs[oddIdx].classList.add('sel');await sleep(400);pairs[oddIdx].classList.add('good');await sleep(500);
  ghostShow(false);log('demo done — your turn (warm-up)');startItem('warm');}
$('#pairs').addEventListener('click',e=>{const p=e.target.closest('.pair');if(p)selectPair(+p.dataset.i);});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))check();});
$('#conf').addEventListener('click',e=>{const b=e.target.closest('.cbtn');if(b)confTap(+b.dataset.c);});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
