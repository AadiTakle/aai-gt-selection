<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-STORYFEEL-01 · How Do They Feel?</title>
<style>
  :root{--bg1:#eefaf3;--bg2:#eef1ff;--ink:#26304a;--card:#fff;--accent:#3ba36b;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:14px;width:480px;max-width:100%}
  #instr{font-size:14px;color:#666;min-height:20px;text-align:center}
  #scene{width:100%;background:#eef7f1;border-radius:16px;padding:14px;text-align:center}
  #sceneart{font-size:48px}#scenetext{font-size:14px;color:#3a5548;font-style:italic;margin-top:6px}
  #emos{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .emo{width:66px;height:66px;border-radius:14px;background:#f0f7f3;border:3px solid #dceae2;font-size:30px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .emo .n{font-size:10px;color:#888}
  .emo.sel{border-color:var(--accent);background:#e4f5eb}
  .emo.right{border-color:var(--good);background:#e7fbf1}.emo.wrong{border-color:var(--bad);background:#ffecec}
  #intwrap{width:280px;display:flex;flex-direction:column;gap:4px}
  #intwrap label{font-size:12px;color:#888;display:flex;justify-content:space-between}
  input[type=range]{width:100%}
  #actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .act{width:132px;min-height:80px;border-radius:14px;background:#f6f8ff;border:3px solid #e2e8fb;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;font-size:12px;color:#556}
  .act .e{font-size:30px}.act.right{border-color:var(--good);background:#e7fbf1}.act.wrong{border-color:var(--bad);background:#ffecec}
  button{font:inherit;border:0;cursor:pointer;border-radius:12px}
  #submit{background:var(--accent);color:#fff;padding:9px 22px;font-weight:800}
  #replayaud{background:#eef1ff;color:#5b6cff;padding:9px 14px;font-weight:700}
  #fb{font-size:14px;min-height:18px;font-weight:700}
  #row{display:flex;gap:12px;align-items:center}
  #replay{width:44px;height:44px;background:#eef1ff;color:#5b6cff;font-size:20px;border-radius:50%;border:0;cursor:pointer}
  #ghost{position:fixed;left:0;top:0;font-size:34px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .45s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:170px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:900px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:250px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-STORYFEEL-01 · How Do They Feel?</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="instr"></div>
      <div id="scene"><div id="sceneart"></div><div id="scenetext"></div></div>
      <div id="emos"></div>
      <div id="intwrap"><label><span>how strong?</span><span id="intval">medium</span></label><input id="intensity" type="range" min="0" max="100" value="50"></div>
      <div id="actions"></div>
      <div id="row"><button id="submit">✓ choose</button><button id="replayaud">🔊 replay</button><button id="replay" title="replay demo">↻</button></div>
      <div id="fb"></div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
function speak(t){try{if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(t);u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){}}
const EMO=[{k:'happy',e:'😀'},{k:'sad',e:'😢'},{k:'angry',e:'😠'},{k:'scared',e:'😨'},{k:'surprised',e:'😲'},{k:'proud',e:'😊'}];
const ITEMS={
 warm:{art:'🧱💥',text:'Maya built a tall tower. Her brother ran by and knocked it all down.',emo:'sad',int:70,
   actions:[{e:'🤝',c:'help rebuild it',good:true},{e:'😂',c:'laugh at her',good:false}]},
 s1:{art:'⚽🎉',text:'Sam scored the winning goal and the whole team cheered for Sam.',emo:'proud',int:85,
   actions:[{e:'🙌',c:'cheer with Sam',good:true},{e:'🙄',c:'walk away',good:false}]},
 s2:{art:'🚚👋',text:'Ava\u2019s best friend is moving far away today. They are saying goodbye.',emo:'sad',int:75,
   actions:[{e:'🤗',c:'hug and plan to call',good:true},{e:'🤷',c:'say who cares',good:false},{e:'🤫',c:'tell her to stop being sad',good:false}]}
};
const T={correct:0,total:0,rts:[],poly:0,polyMax:0,conf:[],confused:'',depth:0,actGood:0,actTot:0,startT:0,firstLat:null};
const METERS=[
 {id:'M-ACC',name:'Feeling correct (scored)',get:()=>T.total?`${T.correct}/${T.total}`:'—'},
 {id:'M-INFDEPTH',name:'Deepest layer reached',get:()=>T.depth?('level '+T.depth+'/3'):'—'},
 {id:'M-POLY',name:'Intensity-calibration',get:()=>T.polyMax?`${T.poly}/${T.polyMax}`:'—'},
 {id:'M-RT',name:'Response time (mean)',get:()=>mean(T.rts)==null?'—':mean(T.rts)+' ms'},
 {id:'M-CONF',name:'Calibration (mean)',get:()=>T.conf.length?mean(T.conf)+' pts':'—'},
 {id:'M-ERRTYPE',name:'Last misread',get:()=>T.confused||'—'},
 {id:'M-RTFIRST',name:'First-action latency',get:()=>T.firstLat==null?'—':T.firstLat+' ms'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const d=document.createElement('div');d.innerHTML=`<span class="t">•</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-8}px,${c.y-6}px)`;await sleep(440)}

let phase='demo',cur=null,sel=null,step='feel',firstDone=false,itemDepth=0;
const setCue=i=>$('#phasecue').textContent=i;
function buildEmos(){$('#emos').innerHTML=EMO.map(x=>`<div class="emo" data-k="${x.k}"><div>${x.e}</div><div class="n">${x.k}</div></div>`).join('')}
function setInt(){const v=+$('#intensity').value;$('#intval').textContent=v<33?'a little':v<66?'medium':'a lot'}
function present(item){cur=item;sel=null;step='feel';firstDone=false;itemDepth=0;$('#intensity').value=50;setInt();T.startT=performance.now();
  $('#sceneart').textContent=item.art;$('#scenetext').textContent='“'+item.text+'”';speak(item.text);
  $$('.emo').forEach(e=>e.className='emo');$('#emos').style.display='flex';$('#intwrap').style.display='flex';$('#actions').style.display='none';$('#actions').innerHTML='';
  $('#instr').textContent=phase==='scored'?'How does the person feel? (no face shown) Tap the feeling, set how strong, then choose.':'Warm-up: how do they feel? (unscored)'}
function selectEmo(k){if(step!=='feel')return;if(!firstDone){firstDone=true;T.firstLat=Math.round(performance.now()-T.startT);log('first action')}sel=k;$$('.emo').forEach(e=>e.classList.toggle('sel',e.dataset.k===k))}
function submitFeel(){if(step!=='feel'||!sel)return;const scored=phase==='scored';const rt=Math.round(performance.now()-T.startT);const chosenInt=+$('#intensity').value;
  const ok=sel===cur.emo;const intErr=Math.abs(chosenInt-cur.int);const calib=intErr<=20?2:intErr<=40?1:0;
  if(scored){T.total++;T.polyMax+=2;if(ok){T.correct++;T.rts.push(rt);T.poly+=calib;T.conf.push(100-intErr);itemDepth=1+(calib>=1?1:0)}else T.confused=sel+'↔'+cur.emo}
  $$('.emo').forEach(e=>{if(e.dataset.k===cur.emo)e.classList.add('right');else if(e.dataset.k===sel&&!ok)e.classList.add('wrong')});
  $('#fb').textContent=ok?'Yes — now, how would you help?':'Think about what happened…';$('#fb').style.color=ok?'var(--good)':'var(--bad)';
  log(`${scored?'SCORED ':''}feeling ${sel} (true ${cur.emo}) ${ok?'✓':'✗'} · intensity err ${intErr}`);renderMeters();
  // move to action step
  step='act';$('#emos').style.display='none';$('#intwrap').style.display='none';$('#actions').style.display='flex';
  $('#actions').innerHTML=cur.actions.map((a,i)=>`<div class="act" data-i="${i}"><div class="e">${a.e}</div><div>${a.c}</div></div>`).join('');
  $('#instr').textContent='Now tap the kindest, most helpful thing to do.'}
function pickAction(i){if(step!=='act')return;step='done';const a=cur.actions[i];const scored=phase==='scored';
  if(scored){T.actTot++;if(a.good){T.actGood++;itemDepth=Math.max(itemDepth, (itemDepth>=1?itemDepth:1)+1);itemDepth=Math.min(3,itemDepth+ (itemDepth<3?1:0));}}
  // recompute depth cleanly: 1 feeling ok already counted; +1 if calib; +1 if action good — approximate to <=3
  $$('.act').forEach(el=>{const idx=+el.dataset.i;if(cur.actions[idx].good)el.classList.add('right');else if(idx===i)el.classList.add('wrong')});
  if(scored)T.depth=Math.max(T.depth,itemDepth);
  $('#fb').textContent=a.good?'Kind choice! 🎉':'a kinder choice was there';$('#fb').style.color=a.good?'var(--good)':'var(--bad)';
  log(`${scored?'SCORED ':''}helping action ${a.good?'✓ good':'✗'} · depth ${itemDepth}`);renderMeters();next(scored)}
let q=[],qi=0;
function next(scored){if(!scored){setTimeout(startScored,1300);return}qi++;if(qi>=q.length){setTimeout(finish,1100);return}setTimeout(()=>{$('#fb').textContent='';present(q[qi])},1300)}
function startWarmup(){phase='warmup';setCue('⭐');present(ITEMS.warm)}
function startScored(){phase='scored';setCue('🎯');q=[ITEMS.s1,ITEMS.s2];qi=0;$('#fb').textContent='';present(q[0]);log('— SCORED situational empathy —')}
function finish(){phase='done';setCue('🏆');$('#instr').textContent='Done! Big-hearted thinking.';$('#actions').style.display='none';$('#emos').style.display='none';$('#intwrap').style.display='none';$('#fb').textContent='';log(`— DONE · feelings ${T.correct}/${T.total} · helpful ${T.actGood}/${T.actTot} · deepest ${T.depth}/3 —`);renderMeters()}
async function runDemo(){phase='demo';setCue('👁️');present(ITEMS.warm);$('#instr').textContent='';log('ghost-hand demo (wordless, <10s)');gShow(true);await sleep(1300);
  await gTo($('.emo[data-k="sad"]'));$('.emo[data-k="sad"]').classList.add('sel');await sleep(300);await gTo($('#intensity'));$('#intensity').value=70;setInt();await sleep(300);
  await gTo($('#submit'));$('.emo[data-k="sad"]').classList.add('right');$('#emos').style.display='none';$('#intwrap').style.display='none';$('#actions').style.display='flex';$('#actions').innerHTML=ITEMS.warm.actions.map((a,i)=>`<div class="act" data-i="${i}"><div class="e">${a.e}</div><div>${a.c}</div></div>`).join('');await sleep(500);
  await gTo($('.act[data-i="0"]'));gShow(false);$('.act[data-i="0"]').classList.add('right');$('#fb').textContent='read the feeling, then help! 🎉';$('#fb').style.color='var(--good)';await sleep(1200);$('#fb').textContent='';startWarmup()}
$('#emos').addEventListener('click',e=>{const em=e.target.closest('.emo');if(em)selectEmo(em.dataset.k)});
$('#submit').addEventListener('click',submitFeel);
$('#actions').addEventListener('click',e=>{const a=e.target.closest('.act');if(a)pickAction(+a.dataset.i)});
$('#intensity').addEventListener('input',setInt);
$('#replayaud').addEventListener('click',()=>{if(cur){speak(cur.text);log('audio replay')}});
$('#replay').addEventListener('click',()=>{if(phase==='done')runDemo()});
buildMeters();buildEmos();renderMeters();runDemo();
</script>
</body>
</html>
