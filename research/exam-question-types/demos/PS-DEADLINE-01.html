<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS-DEADLINE-01 — Beat the Bar (response-deadline speed-accuracy threshold)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;
    --accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}
  .sub{color:var(--mut);font-size:13px;margin:0 0 6px;text-align:center;max-width:500px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--accent);font-size:12px}
  #stage{position:relative;width:470px;min-height:250px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .bar{width:100%;height:16px;background:#10152a;border:1px solid var(--edge);border-radius:99px;overflow:hidden}
  .bar>div{height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--warn),var(--bad));border-radius:99px}
  .cards{display:flex;gap:28px;align-items:center;justify-content:center;min-height:120px}
  .card{width:118px;height:118px;border-radius:18px;background:#10152a;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center}
  .sym{width:70px;height:70px;position:relative}
  .btns{display:flex;gap:16px}
  .big{font-size:20px;font-weight:700;padding:14px 26px;border-radius:16px;border:2px solid var(--edge);cursor:pointer;background:#20284a;color:var(--ink);min-width:150px}
  .big.same{border-color:#2c6}
  .big.diff{border-color:#a45}
  .big:active{transform:scale(.96)}
  .flash.ok{box-shadow:0 0 0 3px var(--good)}
  .flash.no{box-shadow:0 0 0 3px var(--bad)}
  #ghost{position:absolute;font-size:30px;left:0;top:0;transition:left .3s cubic-bezier(.5,0,.3,1),top .3s cubic-bezier(.5,0,.3,1);pointer-events:none;filter:drop-shadow(0 3px 3px #0008);z-index:9;opacity:0}
  #cue{font-size:26px;height:32px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.ctl{font:inherit;padding:9px 16px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:330px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}
  .kv .m{color:var(--mut);font-size:10px}
  .note{font-size:10px;color:var(--mut);margin-top:6px}
  .log{margin-top:6px;max-height:140px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>⏱️ Beat the Bar <span class="badge" id="lvl">2000 ms</span></h1>
    <p class="sub">Are the two cards the SAME or DIFFERENT? Answer before the bar runs out. Get it right in time and the bar gets a little faster. Being fast only counts when you are also right.</p>
  </div>
  <div id="stage">
    <div class="bar"><div id="barfill"></div></div>
    <div class="cards" id="cards"></div>
    <div class="btns">
      <button class="big same" id="bsame">😃 SAME</button>
      <button class="big diff" id="bdiff">🙁 DIFFERENT</button>
    </div>
    <div id="ghost">👆</div>
  </div>
  <div id="cue">👀</div>
  <div class="row">
    <button class="ctl pri" id="go">▶ Watch how it works</button>
  </div>
  <p class="sub" id="hint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const stage=$("#stage"),ghost=$("#ghost"),cue=$("#cue"),cardsEl=$("#cards"),bar=$("#barfill");
const SHAPES=["circle","square","triangle","star","diamond"];
const COLS=["#ff6b8a","#5cc8ff","#5ce39a","#ffd166","#b18cff"];
function shapeSVG(sh,col){const c=col;
  if(sh==="circle")return `<svg viewBox="0 0 70 70" width="70" height="70"><circle cx="35" cy="35" r="30" fill="${c}"/></svg>`;
  if(sh==="square")return `<svg viewBox="0 0 70 70" width="70" height="70"><rect x="8" y="8" width="54" height="54" rx="6" fill="${c}"/></svg>`;
  if(sh==="triangle")return `<svg viewBox="0 0 70 70" width="70" height="70"><polygon points="35,6 64,62 6,62" fill="${c}"/></svg>`;
  if(sh==="star")return `<svg viewBox="0 0 70 70" width="70" height="70"><polygon points="35,4 44,27 68,27 48,42 56,66 35,51 14,66 22,42 2,27 26,27" fill="${c}"/></svg>`;
  return `<svg viewBox="0 0 70 70" width="70" height="70"><polygon points="35,4 66,35 35,66 4,35" fill="${c}"/></svg>`;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const T={phase:"idle",deadline:2000,trials:0,correct:0,inTime:0,
  rtCorrect:[],lapses:0,fa:0,revs:[],lastDir:0,consec:0,log:[]};
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function sd(a){if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)*(x-m))));}
function med(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}
function threshold(){const r=T.revs.slice(-6);return r.length?Math.round(mean(r)):null;}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>50)T.log.pop();}
function render(){
  const acc=T.trials?Math.round(100*T.correct/T.trials):0;
  const cv=med(T.rtCorrect)?Math.round(100*sd(T.rtCorrect)/mean(T.rtCorrect)):0;
  const th=threshold();
  $("#tel").innerHTML=`
  <h2>Live telemetry · PS-DEADLINE-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>trials</span><b>${T.trials}</b></div>
  <div class="kv"><span>current deadline</span><b>${Math.round(T.deadline)} ms</b></div>
  <h2>Speed-accuracy threshold</h2>
  <div class="kv"><span>deadline @ criterion <span class="m">M-SPEEDACC</span></span><b>${th?th+" ms":"—"}</b></div>
  <div class="kv"><span>accuracy (all) <span class="m">M-ACC</span></span><b>${acc}% <span class="m">(${T.correct}/${T.trials})</span></b></div>
  <div class="kv"><span>answered in time</span><b>${T.trials?Math.round(100*T.inTime/T.trials):0}%</b></div>
  <h2>Process</h2>
  <div class="kv"><span>median decision <span class="m">M-RT</span></span><b>${Math.round(med(T.rtCorrect))} ms</b></div>
  <div class="kv"><span>RT variability (CV) <span class="m">M-RTVAR</span></span><b>${cv}%</b></div>
  <div class="kv"><span>missed deadline (lapse) <span class="m">M-LAPSE</span></span><b>${T.lapses}</b></div>
  <div class="kv"><span>impulsive &lt;150ms <span class="m">M-FALSEALARM</span></span><b>${T.fa}</b></div>
  <div class="note">Honest framing: the score is the FASTEST deadline sustained at high accuracy, not raw speed. Short deadline + high accuracy + low CV = strong. Accuracy collapse or &lt;150ms guesses at short deadlines flag impulsive fast-wrong responding.</div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();
function centerOf(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2};}
let cur=null,onset=0,deadTimer=null,answered=true,rafId=null;
function makeTrial(){
  const same=Math.random()<0.5;
  const sh=SHAPES[Math.random()*SHAPES.length|0],col=COLS[Math.random()*COLS.length|0];
  let a={sh,col},b={sh,col};
  if(!same){if(Math.random()<0.5){let s2=sh;while(s2===sh)s2=SHAPES[Math.random()*SHAPES.length|0];b={sh:s2,col};}
    else{let c2=col;while(c2===col)c2=COLS[Math.random()*COLS.length|0];b={sh,col:c2};}}
  return {a,b,same};
}
function drawCards(t){cardsEl.innerHTML="";[t.a,t.b].forEach(x=>{const d=document.createElement("div");d.className="card";
  const s=document.createElement("div");s.className="sym";s.innerHTML=shapeSVG(x.sh,x.col);d.appendChild(s);cardsEl.appendChild(d);});}
function startBar(ms){bar.style.transition="none";bar.style.width="100%";
  // force reflow then animate
  void bar.offsetWidth;bar.style.transition=`width ${ms}ms linear`;bar.style.width="0%";}
function stopBar(){const w=getComputedStyle(bar).width;bar.style.transition="none";bar.style.width=w;}
function clearTimers(){if(deadTimer){clearTimeout(deadTimer);deadTimer=null;}}
function flash(btn,ok){btn.classList.add("flash",ok?"ok":"no");setTimeout(()=>btn.classList.remove("flash","ok","no"),500);}
function updateStair(good){
  const dir=good?-1:1; // good => shorten (harder)
  if(T.lastDir&&dir!==T.lastDir)T.revs.push(T.deadline);
  T.lastDir=dir;
  if(good){T.consec++;if(T.consec>=2){T.deadline=Math.max(450,T.deadline*0.85);T.consec=0;}}
  else{T.consec=0;T.deadline=Math.min(2600,T.deadline*(dir>0?1.18:1));}
  $("#lvl").textContent=Math.round(T.deadline)+" ms";
}
function trial(scored){
  return new Promise(res=>{
    cur=makeTrial();drawCards(cur);answered=false;cue.textContent="👀";
    onset=performance.now();startBar(T.deadline);
    deadTimer=setTimeout(()=>{if(answered)return;answered=true;stopBar();
      // reveal correct with a hint
      cue.textContent="⌛";
      if(scored){T.trials++;T.lapses++;updateStair(false);logE(`n${T.trials} MISS (>${Math.round(T.deadline)}ms)`);}
      render();cleanup();setTimeout(()=>res(),700);
    },T.deadline);
    function choose(sameChosen,btn){
      if(answered)return;answered=true;const rt=performance.now()-onset;clearTimers();stopBar();
      const ok=(sameChosen===cur.same);flash(btn,ok);cue.textContent=ok?"✅":"❌";
      if(scored){T.trials++;T.inTime++;if(ok){T.correct++;T.rtCorrect.push(rt);}
        if(rt<150)T.fa++;
        updateStair(ok);
        logE(`n${T.trials} ${ok?"OK":"wrong"} ${Math.round(rt)}ms @dl${Math.round(T.deadline)}`);}
      render();cleanup();setTimeout(()=>res(),650);
    }
    function onSame(){choose(true,$("#bsame"));}
    function onDiff(){choose(false,$("#bdiff"));}
    $("#bsame").addEventListener("click",onSame);$("#bdiff").addEventListener("click",onDiff);
    function cleanup(){$("#bsame").removeEventListener("click",onSame);$("#bdiff").removeEventListener("click",onDiff);}
  });
}
async function ghostTo(el){ghost.style.opacity="1";const c=centerOf(el);ghost.style.left=(c.x-14)+"px";ghost.style.top=(c.y-30)+"px";await sleep(320);}
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;
  const t={a:{sh:"star",col:"#ffd166"},b:{sh:"star",col:"#ffd166"},same:true};cur=t;drawCards(t);
  cue.textContent="👀";startBar(2000);await sleep(500);
  await ghostTo($("#bsame"));flash($("#bsame"),true);stopBar();clearTimers();cue.textContent="✅";await sleep(900);
  ghost.style.opacity="0";bar.style.width="100%";
  $("#go").disabled=false;$("#go").textContent="▶ Try a practice one";$("#go").onclick=warmup;
  T.phase="idle";$("#hint").textContent="Same cards → tap SAME before the bar empties. Now you try (not scored).";render();
}
$("#go").onclick=demo;
async function warmup(){$("#go").disabled=true;T.phase="warm-up (unscored)";T.deadline=2200;render();
  await trial(false);
  T.phase="idle";$("#go").disabled=false;$("#go").textContent="▶ Start scored round";$("#go").onclick=startScored;
  $("#hint").textContent="Great! Next ones count. Right + in time → the bar speeds up. Miss or wrong → it slows down.";render();}
let left=0;
async function startScored(){$("#go").disabled=true;$("#go").style.display="none";T.phase="scored";T.deadline=2000;T.consec=0;T.lastDir=0;render();left=16;await loop();}
async function loop(){if(left<=0){finish();return;}await trial(true);left--;if(left>0)await loop();else finish();}
function finish(){T.phase="done";cue.textContent="🏁";$("#go").style.display="";$("#go").disabled=false;$("#go").textContent="▶ Run another round";$("#go").onclick=startScored;
  const th=threshold();$("#hint").textContent=`Done. Your fastest reliable deadline was about ${th||Math.round(T.deadline)} ms at ${T.trials?Math.round(100*T.correct/T.trials):0}% correct.`;render();}
cur=makeTrial();drawCards(cur);
</script>
</body>
</html>
