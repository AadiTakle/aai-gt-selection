<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VER-SIMON-01 — Silly Simon (obey or reject spoken commands)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #cmd{min-height:30px;font-size:18px;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:8px 14px;max-width:460px;text-align:center}
  #cmd .spk{color:var(--accent)}
  #grid{display:grid;grid-template-columns:repeat(2,110px);gap:12px}
  .tile{height:92px;background:#20284a;border:2px solid var(--edge);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;cursor:pointer}
  .tile small{font-size:12px;color:var(--mut)}
  .tile:active{transform:scale(.96)} .tile.flash{background:var(--good);border-color:transparent}.tile.wrong{background:var(--bad);border-color:transparent}
  #silly{font-size:20px;padding:12px 22px;border-radius:16px;border:2px solid var(--warn);background:#2a2140;color:var(--warn);cursor:pointer;font-weight:700}
  #silly:active{transform:scale(.96)} #silly.flash{background:var(--good);color:#06251a;border-color:transparent}#silly.wrong{background:var(--bad);color:#2a0a13;border-color:transparent}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.ctl{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  #verdict{font-size:26px;height:32px}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:160px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🫎 Silly Simon <span class="badge" id="blevel">1 condition</span></h1>
    <p class="sub">Do what Simon says by tapping the picture(s). But if Simon says something <b>impossible or silly</b>, tap the giggle button instead of obeying!</p>
  </div>
  <div id="cmd">🔊 <span class="spk">tap ▶ to hear Simon</span></div>
  <div id="grid"></div>
  <button id="silly">😄 that's silly!</button>
  <div id="verdict"></div>
  <div class="row">
    <button class="pri ctl" id="go">▶ Watch how it works</button>
    <button class="ctl" id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const PICS=[{e:"🐶",n:"dog"},{e:"☀️",n:"sun"},{e:"🌳",n:"tree"},{e:"🐟",n:"fish"}];
const ABSURD=["put the elephant inside the acorn","tap the colour of Tuesday","make the fish ride a bicycle","give the sun a haircut","pour the mountain into a cup"];
const grid=$("#grid"),cmd=$("#cmd"),verdict=$("#verdict"),silly=$("#silly");
const T={phase:"idle",trial:0,cond:1,span:0,acc:[0,0],comm:0,err:{wrongpick:0,obeyedAbsurd:0,missedReal:0},first:[],log:[]};
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m}
function pct(p){return p[1]?Math.round(100*p[0]/p[1]):0}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop()}
function render(){
  $("#tel").innerHTML=`
  <h2>Live telemetry · VER-SIMON-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>trials</span><b>${T.trial}</b></div>
  <h2>Accuracy <span class="m">M-ACC</span></h2>
  <div class="kv"><span>correct</span><b>${pct(T.acc)}%</b></div>
  <h2>Oral-direction span <span class="m">M-ORALSPAN</span></h2>
  <div class="kv"><span>max conditions obeyed</span><b>${T.span}</b></div>
  <h2>Impulse control</h2>
  <div class="kv"><span>obeyed-the-silly <span class="m">M-COMM</span></span><b>${T.comm}</b></div>
  <h2>Error type <span class="m">M-ERRTYPE</span></h2>
  <div class="kv"><span>wrong picture</span><b>${T.err.wrongpick}</b></div>
  <div class="kv"><span>obeyed absurd</span><b>${T.err.obeyedAbsurd}</b></div>
  <div class="kv"><span>rejected a real one</span><b>${T.err.missedReal}</b></div>
  <h2>Latency</h2>
  <div class="kv"><span>first-action median <span class="m">M-RTFIRST</span></span><b>${Math.round(median(T.first))} ms</b></div>
  <div class="kv"><span>first-action CV <span class="m">M-RTVAR</span></span><b>${cv(T.first).toFixed(2)}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
function median(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
render();

function paint(){grid.innerHTML="";PICS.forEach((p,i)=>{const d=document.createElement("div");d.className="tile";d.dataset.i=i;d.innerHTML=`${p.e}<small>${p.n}</small>`;grid.appendChild(d)});}
paint();
let cur=null;
function tiles(){return [...document.querySelectorAll(".tile")]}
function arm(handler){cur={done:false,onset:performance.now(),firstDone:false};
  const mark=()=>{if(!cur.firstDone){cur.firstDone=true;T.first.push(performance.now()-cur.onset)}};
  tiles().forEach(t=>t.onpointerdown=()=>{mark();handler("tile",+t.dataset.i,t)});
  silly.onpointerdown=()=>{mark();handler("silly",-1,silly)};
}
function disarm(){tiles().forEach(t=>t.onpointerdown=null);silly.onpointerdown=null;}

async function trial(scored){
  const impossible=Math.random()<0.4;
  let target=-1,text="";
  if(impossible){text=ABSURD[Math.floor(Math.random()*ABSURD.length)];}
  else{target=Math.floor(Math.random()*PICS.length);
    const two=T.cond>=2&&Math.random()<0.6;
    text=two?`tap the ${["small","happy","big"][Math.floor(Math.random()*3)]} ${PICS[target].n}`:`tap the ${PICS[target].n}`;}
  cmd.innerHTML=`🔊 <span class="spk">Simon says:</span> ${text}`;verdict.textContent="";
  await sleep(300);
  return await new Promise(res=>{
    arm((kind,i,el)=>{
      if(cur.done)return;cur.done=true;disarm();
      let ok=false,note="";
      if(impossible){ if(kind==="silly"){ok=true;} else {T.comm++;T.err.obeyedAbsurd++;note="obeyed absurd";} }
      else { if(kind==="tile"&&i===target){ok=true;} else if(kind==="silly"){T.err.missedReal++;note="rejected real";} else {T.err.wrongpick++;note="wrong pic";} }
      el.classList.add(ok?"flash":"wrong");setTimeout(()=>el.classList.remove("flash","wrong"),240);
      if(scored){T.trial++;T.acc[1]++;if(ok){T.acc[0]++;if(!impossible){const c=text.split(" ").length>=4?2:1;T.span=Math.max(T.span,c);}}
        verdict.textContent=ok?"✅":"❌";logE(`${impossible?"[silly] ":""}${ok?"ok":"err"+(note?" "+note:"")}`);}
      render();setTimeout(res,420);
    });
  });
}
async function block(scored,n){for(let i=0;i<n;i++)await trial(scored);}

async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;$("#replay").disabled=true;disarm();
  cmd.innerHTML=`🔊 <span class="spk">Simon says:</span> tap the dog`;
  const ghost=document.createElement("div");ghost.textContent="👆";ghost.style.cssText="position:fixed;font-size:30px;z-index:9;transition:left .5s,top .5s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  const dog=tiles()[0].getBoundingClientRect();
  await sleep(500);ghost.style.opacity="1";ghost.style.left=(dog.left+dog.width/2-12)+"px";ghost.style.top=(dog.top+20)+"px";
  await sleep(600);tiles()[0].classList.add("flash");verdict.textContent="✅";await sleep(500);tiles()[0].classList.remove("flash");
  cmd.innerHTML=`🔊 <span class="spk">Simon says:</span> make the fish ride a bicycle`;verdict.textContent="";
  const sr=silly.getBoundingClientRect();await sleep(500);ghost.style.left=(sr.left+sr.width/2-12)+"px";ghost.style.top=(sr.top+8)+"px";
  await sleep(600);silly.classList.add("flash");verdict.textContent="😄";await sleep(500);silly.classList.remove("flash");
  ghost.remove();T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice one";$("#go").onclick=warmup;
  $("#phasehint").textContent="Obey real commands; tap the giggle button for silly ones. Practice one (not scored).";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;
async function warmup(){T.phase="warm-up (unscored)";render();$("#go").disabled=true;$("#replay").disabled=true;
  await block(false,2);T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Start scored game";$("#go").onclick=startScored;
  $("#phasehint").textContent="These count. Think before you tap — don't get tricked!";render();}
async function startScored(){T.phase="scored";render();$("#go").disabled=true;$("#replay").disabled=true;
  for(let b=0;b<2;b++){await block(true,5);
    if(pct(T.acc)>=80&&T.cond<2){T.cond=2;$("#blevel").textContent="2 conditions";logE("level up → 2 conditions");}render();}
  T.phase="done";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Play again";$("#go").onclick=startScored;
  $("#phasehint").textContent=`Done. Oral-direction span reached ${T.span}; obeyed-the-silly errors ${T.comm}. Consistency beats speed.`;
  verdict.textContent="🏁";render();}
</script>
</body>
</html>
