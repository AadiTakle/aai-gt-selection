<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPA-PIPES-01 · Path Connect</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#eafaf5;--ink:#26304a;--card:#fff;--accent:#0d9488;--good:#22b573;--bad:#ff6b6b;--pipe:#0d9488;--pipeoff:#c7d0e8;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:26px 34px;box-shadow:0 18px 50px -22px #4a4a7a;display:flex;flex-direction:column;align-items:center;gap:14px}
  #stage{position:relative}
  #grid{display:grid;gap:3px;background:#dfe6f7;padding:6px;border-radius:10px}
  .tile{width:46px;height:46px;background:#f6f8fd;border-radius:6px;position:relative;cursor:pointer}
  .tile.solved{background:#e3faf0}
  .arm{position:absolute;background:var(--pipeoff);border-radius:3px}
  .arm.on{background:var(--pipe)}
  .arm.N{left:50%;top:0;width:9px;height:52%;transform:translateX(-50%)}
  .arm.S{left:50%;bottom:0;width:9px;height:52%;transform:translateX(-50%)}
  .arm.E{top:50%;right:0;height:9px;width:52%;transform:translateY(-50%)}
  .arm.W{top:50%;left:0;height:9px;width:52%;transform:translateY(-50%)}
  .hub{position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;background:var(--pipeoff);transform:translate(-50%,-50%)}
  .hub.on{background:var(--pipe)}
  .gem{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;pointer-events:none;z-index:2}
  .stub{position:absolute;font-size:24px;top:50%;transform:translateY(-50%)}
  .stub.start{left:-34px}.stub.goal{right:-34px}
  .shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .glow{animation:glow 1s ease-in-out infinite alternate}@keyframes glow{from{box-shadow:0 0 0 0 rgba(34,181,115,.5)}to{box-shadow:0 0 0 6px rgba(34,181,115,0)}}
  #row{display:flex;gap:12px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:12px;font-weight:700}
  #replay{width:44px;height:44px;background:#eef1ff;color:var(--accent);font-size:19px;border-radius:50%}
  #hint{font-size:12px;color:#8a93b5}
  #ghost{position:fixed;left:0;top:0;font-size:38px;pointer-events:none;z-index:60;opacity:0;transition:transform .5s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}#ghost .ring{position:absolute;left:-6px;top:-6px;width:26px;height:26px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}@keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}.mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #diffmeter{margin:0 12px 8px;background:#1b2340;border-radius:8px;padding:8px 10px}
  #diffmeter .bar{height:8px;background:#232c4d;border-radius:6px;overflow:hidden;margin-top:6px}
  #diffmeter .bar>i{display:block;height:100%;background:linear-gradient(90deg,#7fffcf,#0d9488);width:0%;transition:width .3s}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:190px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">SPA-PIPES-01 · Path Connect</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="stage"><div id="grid"></div></div>
      <div id="row"><button id="replay" title="replay demo">↻</button></div>
      <div id="hint">tap a tile to rotate it 90° — connect the road from 🚙 to 🏁</div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="diffmeter">difficulty <span id="dlab">1/6</span><div class="bar"><i id="dbar"></i></div></div>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">👆<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,last=a=>a[a.length-1];
const OPP={N:'S',S:'N',E:'W',W:'E'};
const CW={N:'E',E:'S',S:'W',W:'N'};
function rotSet(set,k){let s=new Set(set);for(let i=0;i<((k%4)+4)%4;i++)s=new Set([...s].map(d=>CW[d]));return s;}
function setEq(a,b){if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;}
function neighborsOf(r,c,R,C){const out=[];if(r>0)out.push([r-1,c,'N']);if(r<R-1)out.push([r+1,c,'S']);if(c>0)out.push([r,c-1,'W']);if(c<C-1)out.push([r,c+1,'E']);return out;}
function dirTo(from,to){if(to[0]<from[0])return'N';if(to[0]>from[0])return'S';if(to[1]<from[1])return'W';return'E';}

/* ---------- generation ---------- */
function genPath(R,C,start,goal){
  const key=p=>p[0]+','+p[1];
  const visited=new Set([key(start)]);const path=[start];
  function dfs(cur){
    if(cur[0]===goal[0]&&cur[1]===goal[1])return true;
    let nbs=neighborsOf(cur[0],cur[1],R,C).map(n=>[n[0],n[1]]).filter(n=>!visited.has(key(n)));
    nbs.sort((a,b)=>(Math.abs(a[0]-goal[0])+Math.abs(a[1]-goal[1]))-(Math.abs(b[0]-goal[0])+Math.abs(b[1]-goal[1])));
    if(Math.random()<0.45)nbs.reverse();
    for(const n of nbs){
      visited.add(key(n));path.push(n);
      if(dfs(n))return true;
      path.pop();visited.delete(key(n));
    }
    return false;
  }
  dfs(start);
  return path;
}
const BASES={straight:['N','S'],bend:['N','E'],T:['N','E','S'],cross:['N','E','S','W']};
function genItem(lvl){
  const cfg=LEVELS[lvl];const R=cfg.R,C=cfg.C;
  const r0=Math.floor(Math.random()*R),r1=Math.floor(Math.random()*R);
  const start=[r0,0],goal=[r1,C-1];
  let path=[];
  for(let t=0;t<8;t++){const p=genPath(R,C,start,goal);if(p.length>path.length)path=p;if(path.length>=Math.min(R+C,10))break;}
  const pathKeys=new Set(path.map(p=>p[0]+','+p[1]));
  const required=new Map(); // key -> Set of sides
  path.forEach((cell,i)=>{
    const sides=new Set();
    sides.add(i===0?'W':dirTo(cell,path[i-1]));
    sides.add(i===path.length-1?'E':dirTo(cell,path[i+1]));
    required.set(cell[0]+','+cell[1],sides);
  });
  const tiles=[];
  let optimalRot=0;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const k=r+','+c;
    let dirs;
    if(required.has(k)){
      const target=required.get(k);
      let kRot=1+Math.floor(Math.random()*3);
      for(let tries=0;tries<6;tries++){if(!setEq(rotSet(target,kRot),target))break;kRot=1+Math.floor(Math.random()*3);}
      dirs=rotSet(target,kRot);
      let minClicks=4;for(let kk=0;kk<4;kk++)if(setEq(rotSet(dirs,kk),target))minClicks=Math.min(minClicks,kk);
      optimalRot+=minClicks;
    } else {
      const kinds=Object.keys(BASES);const kind=kinds[Math.floor(Math.random()*kinds.length)];
      dirs=rotSet(new Set(BASES[kind]),Math.floor(Math.random()*4));
    }
    tiles.push({r,c,dirs,isPath:required.has(k)});
  }
  const stopCount=cfg.stops;
  const stopCandidates=path.slice(1,-1);
  const stops=[];
  for(let i=0;i<stopCount&&stopCandidates.length;i++){const idx=Math.floor(Math.random()*stopCandidates.length);stops.push(stopCandidates.splice(idx,1)[0]);}
  return {R,C,start,goal,tiles,required,path,stops,optimalRot,lvl};
}
const LEVELS=[
  {R:3,C:4,stops:0},
  {R:4,C:4,stops:0},
  {R:4,C:5,stops:1},
  {R:5,C:5,stops:1},
  {R:5,C:6,stops:2},
  {R:6,C:6,stops:2},
];

/* ---------- state ---------- */
let cur=null,phase='demo',locked=false,scoredIndex=0,level=0;
let rotClicks=0,rtStart=0,rtFirsts=[],revisions=0,touchedCells=new Set(),clickSeq=[];
const T={scored:0,exact:0,rts:[],rtFirsts:[],revisions:0,itemStart:0,firstActed:false,maxLevel:0,levelSeries:[]};
function tileAt(r,c){return cur.tiles.find(t=>t.r===r&&t.c===c);}
function connectedFromStart(){
  const key=p=>p[0]+','+p[1];
  const startCell=cur.start;
  if(!tileAt(...startCell).dirs.has('W'))return false;
  const seen=new Set([key(startCell)]);const q=[startCell];let qi=0;
  while(qi<q.length){
    const cell=q[qi++];const t=tileAt(...cell);
    for(const[nr,nc,dir] of neighborsOf(cell[0],cell[1],cur.R,cur.C)){
      if(t.dirs.has(dir)&&tileAt(nr,nc).dirs.has(OPP[dir])&&!seen.has(key([nr,nc]))){seen.add(key([nr,nc]));q.push([nr,nc]);}
    }
  }
  return seen.has(key(cur.goal))&&tileAt(...cur.goal).dirs.has('E');
}
function polyPct(){
  let ok=0;for(const[k,side] of cur.required){const[r,c]=k.split(',').map(Number);if(setEq(tileAt(r,c).dirs,side))ok++;}
  return Math.round(100*ok/cur.required.size);
}
function effStr(){return cur?`${rotClicks} rotations / optimal ${cur.optimalRot}`:'\u2014';}
function exploreStr(){return `${touchedCells.size} tiles touched`;}
function pathStr(){return clickSeq.length?`${clickSeq.length}: ${clickSeq.slice(-5).join(' ')}`:'\u2014';}
function learnRate(){if(T.levelSeries.length<2)return'\u2014';const gained=last(T.levelSeries)-T.levelSeries[0];return `${gained>=0?'+':''}${gained} lvl / ${T.levelSeries.length} trials`;}
const METERS=[
 {id:'M-ACC',name:'Item accuracy (connected)',get:()=>T.scored?`${T.exact}/${T.scored}  ${Math.round(100*T.exact/T.scored)}%`:'\u2014'},
 {id:'M-POLY',name:'Partial connectivity (%)',get:()=>cur?polyPct()+'%':'\u2014'},
 {id:'M-RT',name:'Response time — total',get:()=>T.rts.length?`${last(T.rts)} ms (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency',get:()=>T.rtFirsts.length?`${last(T.rtFirsts)} ms`:'\u2014'},
 {id:'M-REV',name:'Revisions (re-rotations)',get:()=>T.revisions},
 {id:'M-PATH',name:'Rotation sequence',get:()=>pathStr()},
 {id:'M-EFF',name:'Efficiency vs optimal',get:()=>effStr()},
 {id:'M-EXPLORE',name:'Exploration breadth',get:()=>exploreStr()},
 {id:'M-DIFFREACH',name:'Ceiling / max level reached',get:()=>T.maxLevel+1+'/'+LEVELS.length},
 {id:'M-LEARNRATE',name:'Within-session learning rate',get:()=>learnRate()},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});$('#dbar').style.width=(100*(level+1)/LEVELS.length)+'%';$('#dlab').textContent=(level+1)+'/'+LEVELS.length;}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}
const ghost=$('#ghost');function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(480);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(380);}

/* ---------- render ---------- */
function isStop(r,c){return cur.stops.some(s=>s[0]===r&&s[1]===c);}
function renderGrid(){
  const grid=$('#grid');grid.innerHTML='';
  grid.style.gridTemplateColumns=`repeat(${cur.C},46px)`;
  const solved=connectedFromStart();
  for(let r=0;r<cur.R;r++)for(let c=0;c<cur.C;c++){
    const t=tileAt(r,c);
    const d=document.createElement('div');d.className='tile'+(solved&&t.isPath?' solved':'');d.dataset.r=r;d.dataset.c=c;
    ['N','E','S','W'].forEach(dir=>{const a=document.createElement('div');a.className='arm '+dir+(t.dirs.has(dir)?' on':'');d.appendChild(a);});
    const hub=document.createElement('div');hub.className='hub'+(t.dirs.size?' on':'');d.appendChild(hub);
    if(isStop(r,c)){const g=document.createElement('div');g.className='gem';g.textContent='💎';d.appendChild(g);}
    if(r===cur.start[0]&&c===0){const s=document.createElement('div');s.className='stub start';s.textContent='🚙';d.appendChild(s);}
    if(r===cur.goal[0]&&c===cur.C-1){const s=document.createElement('div');s.className='stub goal';s.textContent='🏁';d.appendChild(s);}
    grid.appendChild(d);
  }
  if(solved)$('#grid').classList.add('glow');else $('#grid').classList.remove('glow');
}
function cellEl(r,c){return $(`.tile[data-r="${r}"][data-c="${c}"]`);}

/* ---------- gameplay ---------- */
function markFirstAction(){if(!T.firstActed){T.firstActed=true;T.rtFirsts.push(Date.now()-T.itemStart);}}
function rotateTile(r,c){
  if(locked)return;
  markFirstAction();
  const t=tileAt(r,c);t.dirs=rotSet(t.dirs,1);
  rotClicks++;clickSeq.push(`(${r+1},${c+1})`);
  if(touchedCells.has(r+','+c))T.revisions++;
  touchedCells.add(r+','+c);
  log(`rotate (${r+1},${c+1})`);
  renderGrid();renderMeters();
  if(connectedFromStart())submit(true);
}
function renderItem(item){
  cur=item;rotClicks=0;touchedCells=new Set();clickSeq=[];T.revisions=0;T.itemStart=Date.now();T.firstActed=false;
  renderGrid();renderMeters();
}
function submit(){
  const rt=Date.now()-T.itemStart;
  locked=true;
  if(phase==='warmup'){log('warm-up connected! — UNSCORED');setTimeout(nextPhase,1100);return;}
  T.scored++;T.rts.push(rt);
  const efficient=rotClicks<=Math.ceil(cur.optimalRot*1.5)+1;
  if(efficient)T.exact++;
  T.levelSeries.push(level);T.maxLevel=efficient?Math.max(T.maxLevel,level):T.maxLevel;
  level=efficient?Math.min(level+1,LEVELS.length-1):Math.max(level-1,0);
  log(`SUBMIT lvl${cur.lvl+1} → CONNECTED${efficient?' EFFICIENT':' (many rotations)'} · ${effStr()} · rev ${T.revisions}`);
  renderMeters();
  setTimeout(nextPhase,1300);
}
function nextPhase(){
  locked=false;
  if(phase==='warmup'){scoredIndex=0;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<6?startScored():finish();}
}
function startWarmup(){phase='warmup';locked=false;$('#phasecue').textContent='\u2b50';renderItem(genItem(0));log('— warm-up (unscored) —');}
function startScored(){phase='scored';$('#phasecue').textContent='\ud83c\udfaf';renderItem(genItem(level));log(`— SCORED item ${scoredIndex+1}/6 · level ${level+1} · optimal ${cur.optimalRot} rotations —`);}
function finish(){phase='done';$('#phasecue').textContent='\ud83c\udfc6';locked=true;log(`— DONE · connected ${T.exact}/${T.scored} · ceiling level ${T.maxLevel+1} —`);}

async function runDemo(){
  phase='demo';$('#phasecue').textContent='\ud83d\udc41\ufe0f';locked=true;
  const R=1,C=2,start=[0,0],goal=[0,1];
  const required=new Map([['0,0',new Set(['W','E'])],['0,1',new Set(['W','E'])]]);
  const tiles=[{r:0,c:0,dirs:rotSet(new Set(['W','E']),1),isPath:true},{r:0,c:1,dirs:new Set(['W','E']),isPath:true}];
  renderItem({R,C,start,goal,tiles,required,path:[start,goal],stops:[],optimalRot:1,lvl:-1});
  log('ghost-hand demo (wordless, <10s)');ghostShow(true);await sleep(300);
  await ghostTo(cellEl(0,0));await ghostTap();rotateTile(0,0);
  await sleep(600);ghostShow(false);await sleep(400);startWarmup();
}

$('#grid').addEventListener('click',e=>{const d=e.target.closest('.tile');if(!d||locked||phase==='demo'||phase==='done')return;rotateTile(+d.dataset.r,+d.dataset.c);});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
