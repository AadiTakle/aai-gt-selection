<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-lilycount-01 — Frog Lily-Count (child counting span)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;--pond:#123b34;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #pad{width:360px;height:300px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;background:radial-gradient(circle at 50% 40%,#1f6b5c,#0d3a31 75%);border:6px solid #0d3a31;position:relative;overflow:hidden;box-shadow:inset 0 0 40px #0008}
  .critter{position:absolute;font-size:44px;cursor:pointer;transition:transform .1s,opacity .2s;user-select:none}
  .critter:active{transform:scale(.85)}
  .critter.done{opacity:.35;transform:scale(.8)}
  #leaf{position:absolute;inset:0;background:linear-gradient(160deg,#2f8f4e,#1c6b39);display:flex;align-items:center;justify-content:center;font-size:70px;opacity:0;pointer-events:none;transition:opacity .3s}
  #leaf.show{opacity:.96}
  .pondrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;min-height:60px}
  .numlily{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2f8f4e,#155534);border:3px solid #0d3a31;color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .numlily:active{transform:scale(.94)}
  .slots{display:flex;gap:10px;min-height:36px;align-items:center;justify-content:center}
  .slot{width:34px;height:34px;border-radius:8px;border:2px dashed var(--edge);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
  .slot.full{border-style:solid;border-color:var(--accent)}
  #cue{font-size:22px;height:30px;text-align:center}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button.leaf{background:#2f8f4e;color:#04240f;border-color:transparent;font-weight:700}
  button:disabled{opacity:.4;cursor:not-allowed}
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:7px 12px;background:#182042}
  .seg button.on{background:var(--warn);color:#3a2c00;font-weight:600}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🐸 Frog Lily-Count <span class="badge" id="bmode">set size 2</span></h1>
    <p class="sub" id="prompt">Tap each <b>frog</b> to count it (skip the bugs). Then remember how many were on each pad.</p>
  </div>
  <div id="pad"><div id="leaf">🍃</div></div>
  <div class="slots" id="slots"></div>
  <div class="pondrow" id="pondrow"></div>
  <div id="cue">👀</div>
  <div class="row">
    <div class="seg" id="orderseg">
      <button data-o="order" class="on">recall in order</button>
      <button data-o="sort">recall small→big</button>
    </div>
    <label class="sub" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="adapt" checked> above-grade staircase</label>
  </div>
  <div class="row">
    <button class="pri" id="go">▶ Watch how it works</button>
    <button id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=$("#pad"),leaf=$("#leaf");
let order="order";
const T={phase:"idle",setSize:2,spanMax:0,cHit:0,cTot:0,misTap:0,
  recallHit:0,recallTot:0,revisions:0,orderErr:0,itemErr:0,
  sizeStats:{},blockAcc:[],blur:0,log:[]};

function render(){
  const proc=T.cTot?Math.round(100*T.cHit/T.cTot):0;
  const recall=T.recallTot?Math.round(100*T.recallHit/T.recallTot):0;
  const slope=Object.keys(T.sizeStats).sort().map(k=>{const s=T.sizeStats[k];return `s${k}:${Math.round(100*s.hit/s.tot)}%`;}).join(" ");
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-lilycount-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>set size</span><b>${T.setSize}</b></div>
  <h2>Counting span</h2>
  <div class="kv"><span>span threshold <span class="m">M-SPAN</span></span><b>${T.spanMax||"—"}</b></div>
  <div class="kv"><span>counting accuracy <span class="m">M-PROCACC</span></span><b>${T.cTot?proc+"%":"—"}</b></div>
  <div class="kv"><span>recall accuracy <span class="m">M-ACC</span></span><b>${T.recallTot?recall+"%":"—"}</b></div>
  <div class="kv"><span>acc by set size <span class="m">M-UPDATECOST</span></span><b>${slope||"—"}</b></div>
  <h2>Process signals</h2>
  <div class="kv"><span>recall revisions <span class="m">M-REV</span></span><b>${T.revisions}</b></div>
  <div class="kv"><span>order vs item err <span class="m">M-ERRTYPE</span></span><b>${T.orderErr}/${T.itemErr}</b></div>
  <div class="kv"><span>bug mis-taps <span class="m">M-ERRTYPE</span></span><b>${T.misTap}</b></div>
  <h2>Consistency & engagement</h2>
  <div class="kv"><span>recall series <span class="m">M-CONSIST</span></span><b>${T.blockAcc.length?T.blockAcc.map(x=>x?"✓":"✗").join(""):"—"}</b></div>
  <div class="kv"><span>focus-loss (blur) <span class="m">M-ENGAGE</span></span><b>${T.blur}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>50)T.log.pop();}
window.addEventListener("blur",()=>{T.blur++;render();});

function rnd(n){return Math.random()*n|0;}
// show one pad: returns actual frog count; resolves after child commits with the leaf
async function showPad(scored,ghost){
  const frogs=1+rnd(5); // 1..5
  const bugs=rnd(3);     // 0..2 distractors
  pad.querySelectorAll(".critter").forEach(e=>e.remove());
  let counted=0;
  const place=(emoji,isFrog)=>{const c=document.createElement("div");c.className="critter";c.textContent=emoji;
    c.style.left=(20+rnd(280))+"px";c.style.top=(20+rnd(210))+"px";
    c.onclick=()=>{ if(isFrog){ if(!c.classList.contains("done")){c.classList.add("done");counted++;} }
      else{T.misTap++;c.style.transform="scale(1.2)";setTimeout(()=>c.style.transform="",120);} render(); };
    pad.appendChild(c);};
  for(let i=0;i<frogs;i++)place("🐸",true);
  for(let i=0;i<bugs;i++)place("🐞",false);
  $("#cue").innerHTML='tap the frogs, then <b>close the leaf</b> 🍃';
  // commit control
  const committed=await new Promise(res=>{
    const btn=document.createElement("button");btn.className="leaf";btn.textContent="🍃 close pad";btn.style.marginTop="6px";
    $("#cue").appendChild(document.createElement("br"));$("#cue").appendChild(btn);
    if(ghost){ /* auto after ghost taps */ }
    btn.onclick=()=>res(counted);
    window._commitPad=()=>res(counted);
  });
  leaf.classList.add("show");await sleep(360);leaf.classList.remove("show");
  pad.querySelectorAll(".critter").forEach(e=>e.remove());
  if(scored){T.cTot++;if(committed===frogs)T.cHit++;}
  return {frog:frogs,committed};
}

async function recall(counts,scored){
  const k=counts.length;
  let target=counts.slice();if(order==="sort")target=counts.slice().sort((a,b)=>a-b);
  const slots=$("#slots");slots.innerHTML="";for(let i=0;i<k;i++){const d=document.createElement("div");d.className="slot";slots.appendChild(d);}
  const row=$("#pondrow");row.innerHTML="";
  $("#cue").innerHTML=order==="sort"?"tap the counts <b>small → big</b>":"tap the counts <b>in pad order</b>";
  const picks=[];
  await new Promise(res=>{ for(let n=1;n<=5;n++){const b=document.createElement("div");b.className="numlily";b.textContent=n;
      b.onclick=()=>{ picks.push(n);const idx=picks.length-1;slots.children[idx].textContent=n;slots.children[idx].classList.add("full");
        if(picks.length===k)setTimeout(res,150);};row.appendChild(b);} });
  row.innerHTML="";
  const ok=picks.every((v,i)=>v===target[i]);
  if(!ok){const sameSet=[...picks].sort().join()===[...target].sort().join();if(sameSet)T.orderErr++;else T.itemErr++;}
  if(scored){T.recallTot++;if(ok)T.recallHit++;T.blockAcc.push(ok?1:0);
    const st=T.sizeStats[k]||(T.sizeStats[k]={hit:0,tot:0});st.tot++;if(ok)st.hit++;
  }
  $("#cue").textContent=ok?"✅":"↺";return ok;
}

async function trial(scored){
  const counts=[];
  for(let p=0;p<T.setSize;p++){const r=await showPad(scored);counts.push(r.frog);await sleep(250);}
  const ok=await recall(counts,scored);
  if(scored){ if(ok){T.setSize=Math.min(6,T.setSize+1);if(T.setSize-1>T.spanMax)T.spanMax=T.setSize-1;}
    else if($("#adapt").checked)T.setSize=Math.max(2,T.setSize-1);
    logE(`set ${counts.length}: counts ${counts.join("-")} ${ok?"recalled ok":"miss"} → next ${T.setSize}`);}
  $("#bmode").textContent="set size "+T.setSize;render();return ok;
}

// ---- ghost demo ----
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";$("#go").disabled=true;$("#replay").disabled=true;render();
  const ghost=document.createElement("div");ghost.textContent="👆";
  ghost.style.cssText="position:fixed;font-size:30px;z-index:9;transition:left .3s,top .3s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  const savedSize=T.setSize;T.setSize=2;
  // demo pad 1: 2 frogs
  for(let p=0;p<2;p++){
    const nf=p===0?2:3;
    pad.querySelectorAll(".critter").forEach(e=>e.remove());
    const frogEls=[];for(let i=0;i<nf;i++){const c=document.createElement("div");c.className="critter";c.textContent="🐸";
      c.style.left=(40+i*90)+"px";c.style.top=(90+ (i%2)*60)+"px";pad.appendChild(c);frogEls.push(c);}
    $("#cue").innerHTML="tap each frog to count 🐸";
    for(const c of frogEls){const r=c.getBoundingClientRect();ghost.style.opacity="1";ghost.style.left=(r.left+8)+"px";ghost.style.top=(r.top-4)+"px";
      await sleep(430);c.classList.add("done");await sleep(180);}
    leaf.classList.add("show");await sleep(400);leaf.classList.remove("show");
    pad.querySelectorAll(".critter").forEach(e=>e.remove());await sleep(200);
  }
  // demo recall: 2 then 3
  const slots=$("#slots");slots.innerHTML="";[0,1].forEach(()=>{const d=document.createElement("div");d.className="slot";slots.appendChild(d);});
  const row=$("#pondrow");row.innerHTML="";const lilies={};for(let n=1;n<=5;n++){const b=document.createElement("div");b.className="numlily";b.textContent=n;row.appendChild(b);lilies[n]=b;}
  $("#cue").innerHTML="tap the counts in order: 2 then 3";
  for(const [idx,val] of [[0,2],[1,3]]){const r=lilies[val].getBoundingClientRect();ghost.style.left=(r.left+16)+"px";ghost.style.top=(r.top+10)+"px";
    await sleep(450);slots.children[idx].textContent=val;slots.children[idx].classList.add("full");await sleep(200);}
  $("#cue").textContent="✅";await sleep(500);ghost.remove();row.innerHTML="";slots.innerHTML="";
  T.setSize=savedSize;
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice round";$("#go").onclick=warmup;
  $("#phasehint").textContent="Now you try — this practice round is NOT scored.";render();
}
async function warmup(){
  T.phase="warm-up (unscored)";$("#go").disabled=true;$("#replay").disabled=true;
  const s=T.setSize;T.setSize=2;render();await trial(false);T.setSize=s;$("#bmode").textContent="set size "+T.setSize;
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Start scored game";$("#go").onclick=startScored;
  $("#phasehint").textContent="These count. Count carefully — recall only counts if your counting was right.";render();
}
async function startScored(){
  T.phase="scored";$("#go").disabled=true;$("#replay").disabled=true;render();
  for(let r=0;r<4;r++){await trial(true);await sleep(500);}
  T.phase="done";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Play again";$("#go").onclick=startScored;
  $("#phasehint").textContent="Done. Accurate counting gates the span estimate; consistency beats speed.";
  $("#cue").textContent="🏁";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;
$("#orderseg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;order=b.dataset.o;
  [...$("#orderseg").children].forEach(x=>x.classList.toggle("on",x===b));logE("recall → "+order);render();});
render();
</script>
</body>
</html>
