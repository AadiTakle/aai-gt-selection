<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-gate-01 — Gatekeeper (probed running span)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;--tile:#232c4d;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #stage{width:460px;min-height:220px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:8px;position:relative;overflow:hidden}
  #big{font-size:88px;transition:transform .1s,opacity .1s;opacity:0;transform:scale(.5)}
  #big.show{opacity:1;transform:scale(1)}
  #cue{font-size:26px;height:32px}
  #gatebar{position:absolute;top:0;left:0;right:0;height:0;background:repeating-linear-gradient(45deg,#ffd166 0 12px,#3a2c00 12px 24px);transition:height .18s;z-index:5}
  #gatebar.down{height:100%;opacity:.92}
  .slots,.tray{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:6}
  .slot{width:56px;height:56px;border-radius:12px;border:2px dashed var(--edge);display:flex;align-items:center;justify-content:center;font-size:34px;background:#141a30;cursor:pointer}
  .slot.filled{border-style:solid;border-color:var(--accent);background:var(--tile)}
  .slot.ok{border-color:var(--good)}.slot.no{border-color:var(--bad)}
  .chip{width:54px;height:54px;border-radius:12px;border:1px solid var(--edge);background:#20284a;font-size:32px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .chip:active{transform:scale(.94)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .tel{width:320px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🚧 Gatekeeper <span class="badge">Spot-check the last few</span></h1>
    <p class="sub" id="task">Creatures walk through the gate. When the gate slams shut, tap the <b>last few</b> that just passed — then it opens again.</p>
  </div>
  <div id="stage">
    <div id="gatebar"></div>
    <div id="big">🦊</div>
    <div id="cue">👀</div>
    <div class="slots" id="resp"></div>
    <div class="tray" id="tray"></div>
  </div>
  <div class="row">
    <button class="pri" id="go">▶ Watch how it works</button>
    <button id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>

<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const big=$("#big"),cue=$("#cue"),resp=$("#resp"),tray=$("#tray"),gatebar=$("#gatebar");
const CREAT=["🦊","🐸","🐼","🦉","🐙","🦄"];
let k=2;
const T={phase:"idle",probes:0,k:2,correct:0,total:0,poly:[],rt:[],
  intrusion:0,novelErr:0,recency:{},curve:{},driftEarly:[],driftLate:[],
  blur:0,idleMax:0,log:[]};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sd=a=>a.length<2?0:Math.sqrt(mean(a.map(x=>(x-mean(a))**2)));
const cv=a=>{const m=mean(a);return m?sd(a)/m:0;};
const rand=a=>a[Math.random()*a.length|0];
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop();}
window.addEventListener("blur",()=>{T.blur++;render();});
function lapseRate(){if(T.rt.length<4)return 0;const b=[...T.rt].sort((x,y)=>x-y);const thr=b[Math.floor(b.length*0.75)]*1.5;
  return Math.round(100*T.rt.filter(x=>x>thr).length/T.rt.length);}
function render(){
  const acc=T.total?Math.round(100*T.correct/T.total):0;
  const poly=T.poly.length?Math.round(100*mean(T.poly)):0;
  const cur=Object.entries(T.curve).sort().map(([kk,a])=>`k${kk}:${Math.round(100*mean(a))}%`).join("  ");
  const rec=Object.entries(T.recency).sort().map(([p,a])=>`p${p}:${Math.round(100*mean(a))}%`).join(" ");
  const drift=(T.driftEarly.length&&T.driftLate.length)?(Math.round(100*mean(T.driftLate))-Math.round(100*mean(T.driftEarly))):0;
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-gate-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>probe window (k)</span><b>${k}</b></div>
  <div class="kv"><span>probes answered</span><b>${T.probes}</b></div>
  <h2>Accuracy</h2>
  <div class="kv"><span>whole probe <span class="m">M-ACC</span></span><b>${acc}% <span class="m">(${T.correct}/${T.total})</span></b></div>
  <div class="kv"><span>partial credit <span class="m">M-POLY</span></span><b>${poly}%</b></div>
  <div class="kv"><span>recency by position <span class="m">M-POLY</span></span><b style="font-size:11px">${rec||"—"}</b></div>
  <h2>Updating cost <span class="m">M-UPDATECOST</span></h2>
  <div class="kv"><span>acc by load</span><b style="font-size:11px">${cur||"—"}</b></div>
  <h2>Error type <span class="m">M-ERRTYPE</span></h2>
  <div class="kv"><span>intrusion (older)</span><b>${T.intrusion}</b></div>
  <div class="kv"><span>novel / order slip</span><b>${T.novelErr}</b></div>
  <h2>Consistency & gating</h2>
  <div class="kv"><span>response CV <span class="m">M-RTVAR</span></span><b>${cv(T.rt).toFixed(2)}</b></div>
  <div class="kv"><span>lapse rate <span class="m">M-LAPSE</span></span><b>${lapseRate()}%</b></div>
  <div class="kv"><span>drift late-early <span class="m">M-DRIFT</span></span><b>${drift>0?"+":""}${drift}%</b></div>
  <div class="kv"><span>focus-loss events <span class="m">M-ENGAGE</span></span><b>${T.blur}</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();

function palette(){tray.innerHTML="";CREAT.forEach(e=>{const c=document.createElement("div");c.className="chip";c.textContent=e;tray.appendChild(c);});}
function slots(n){resp.innerHTML="";for(let i=0;i<n;i++){const d=document.createElement("div");d.className="slot";resp.appendChild(d);}}

async function probe(history,scored,idx){
  gatebar.classList.add("down");cue.textContent="🚧";await sleep(260);
  slots(k);palette();
  const lastK=history.slice(-k);
  const t0=performance.now();let last=t0,awaiting=true;
  await new Promise(res=>{
    tray.onclick=e=>{const c=e.target.closest(".chip");if(!c||!awaiting)return;
      const s=resp.querySelector(".slot:not(.filled)");if(!s)return;
      if(scored)T.rt.push(performance.now()-last);last=performance.now();
      s.textContent=c.textContent;s.classList.add("filled");
      if(![...resp.querySelectorAll(".slot")].some(x=>!x.classList.contains("filled"))){awaiting=false;res();}render();};
  });
  tray.onclick=null;
  const ss=[...resp.querySelectorAll(".slot")];let nc=0;
  ss.forEach((s,i)=>{const ok=s.textContent===lastK[i];
    if(ok){nc++;s.classList.add("ok");}else{s.classList.add("no");
      if(scored){history.slice(0,-k).includes(s.textContent)?T.intrusion++:T.novelErr++;}}
    if(scored){(T.recency[i]=T.recency[i]||[]).push(ok?1:0);}});
  const all=nc===k;cue.textContent=all?"✅":"↔️";
  if(scored){T.total++;T.probes++;if(all)T.correct++;T.poly.push(nc/k);
    (T.curve[k]=T.curve[k]||[]).push(nc/k);(idx<2?T.driftEarly:T.driftLate).push(all?1:0);
    logE(`probe k${k}: ${nc}/${k}${all?" ✔":""}`);
    k=all?Math.min(4,k+1):Math.max(2,k-1);T.k=k;}
  render();await sleep(700);resp.innerHTML="";tray.innerHTML="";gatebar.classList.remove("down");cue.textContent="👀";
  return all;
}

async function runStream(scored){
  $("#go").disabled=true;$("#replay").disabled=true;
  const len=10+(Math.random()*4|0);const hist=[];
  const nProbes=3;const cand=[];for(let i=k+1;i<len;i++)cand.push(i);
  const pset=new Set();while(pset.size<nProbes&&cand.length)pset.add(cand.splice(Math.random()*cand.length|0,1)[0]);
  let pi=0;
  for(let i=0;i<len;i++){
    const e=rand(CREAT);hist.push(e);big.textContent=e;big.classList.add("show");await sleep(640);big.classList.remove("show");await sleep(150);
    if(pset.has(i+1)&&hist.length>=k){$("#phasehint").textContent=scored?"Gate check! Tap the last "+k+" in order.":"Practice check — tap the last "+k+".";await probe(hist,scored,pi++);}
  }
  big.textContent="";cue.textContent="🏁";
  $("#go").disabled=false;$("#replay").disabled=false;
}

async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;$("#replay").disabled=true;
  const kk=k;k=2;const seq=["🐸","🦉","🦊","🐼"];
  for(const e of seq){big.textContent=e;big.classList.add("show");await sleep(560);big.classList.remove("show");await sleep(150);}
  gatebar.classList.add("down");cue.textContent="🚧";await sleep(280);slots(2);palette();
  const ghost=document.createElement("div");ghost.textContent="👆";
  ghost.style.cssText="position:fixed;font-size:28px;z-index:20;transition:left .35s,top .35s;pointer-events:none";document.body.appendChild(ghost);
  const lastK=seq.slice(-2);
  for(let i=0;i<2;i++){const chip=[...tray.querySelectorAll(".chip")].find(c=>c.textContent===lastK[i]);
    const s=resp.querySelector(".slot:not(.filled)");const r=chip.getBoundingClientRect();
    ghost.style.left=(r.left+14)+"px";ghost.style.top=(r.top+8)+"px";await sleep(520);
    s.textContent=chip.textContent;s.classList.add("filled","ok");await sleep(220);}
  cue.textContent="✅";await sleep(650);ghost.remove();
  k=kk;resp.innerHTML="";tray.innerHTML="";gatebar.classList.remove("down");T.phase="idle";
  $("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice run";$("#go").onclick=warmup;
  $("#phasehint").textContent="Now you try — this practice run is NOT scored.";render();
}
async function warmup(){T.phase="warm-up (unscored)";render();await runStream(false);
  T.phase="idle";$("#go").textContent="▶ Start scored run";$("#go").onclick=startScored;
  $("#phasehint").textContent="This run counts. Checkpoints come without warning; the window grows when you're right.";render();}
async function startScored(){T.phase="scored";render();$("#go").disabled=true;await runStream(true);await runStream(true);finish();}
function finish(){T.phase="done";render();cue.textContent="🏁";$("#go").disabled=false;
  $("#go").textContent="▶ Another run";$("#go").onclick=startScored;
  $("#phasehint").textContent="Done. The recency gradient + acc-by-load slope across probes are the tail signals.";}
$("#go").onclick=demo;$("#replay").onclick=demo;
</script>
</body>
</html>
