<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUANT-PATTERNGROW-01 — Growing Pattern Architect</title>
<style>
:root{--bg:#0f1226;--panel:#1b2140;--panel2:#232a52;--accent:#5eead4;--accent2:#f59e0b;--good:#4ade80;--bad:#f87171;--ink:#eef1ff;--muted:#9aa3c7}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 20% -10%,#26305e,#0f1226 60%);min-height:100vh}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1120px;margin:0 auto;padding:18px}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid #313a6b;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.phasebar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#2b336a;color:var(--muted);border:1px solid #3a447f}
.pill.on{background:var(--accent);color:#053;font-weight:700}
.prompt{font-size:15px;color:var(--muted);min-height:22px;margin:6px 0 10px}
.examples{display:flex;gap:12px;align-items:flex-end;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.stagebox{text-align:center}
.stagebox .cap{color:var(--muted);font-size:12px;margin-top:4px}
.mini{display:grid;gap:3px;background:#141a38;border:1px solid #3a447f;border-radius:8px;padding:6px;justify-content:center}
.dot{width:14px;height:14px;border-radius:3px;background:linear-gradient(180deg,#7dd3fc,#3b82f6)}
.qbox{width:64px;height:64px;border:2px dashed var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--accent)}
.builder{display:flex;flex-direction:column;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(6,30px);gap:4px;background:#141a38;border:1px solid #3a447f;border-radius:12px;padding:10px}
.cell{width:30px;height:30px;border-radius:6px;background:#20264d;border:1px solid #333c73;cursor:pointer}
.cell.on{background:linear-gradient(180deg,#86efac,#22c55e);border-color:#16a34a}
.count{font-size:15px;color:var(--muted)}
.count b{color:var(--ink);font-size:20px}
.dial{display:flex;align-items:center;gap:14px;justify-content:center}
.dial .num{font-size:44px;font-weight:800;min-width:90px;text-align:center}
.step{width:52px;height:52px;border-radius:50%;border:0;background:#2b336a;color:var(--ink);font-size:26px;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}
button.act{font:600 15px system-ui;padding:10px 18px;border-radius:12px;border:0;cursor:pointer;background:var(--accent);color:#053}
button.act.ghost{background:#2b336a;color:var(--ink);border:1px solid #3a447f}
button.act:disabled{opacity:.4;cursor:default}
.fb{min-height:26px;text-align:center;font-weight:700;margin-top:12px}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.hand{position:fixed;font-size:32px;z-index:20;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:left .4s cubic-bezier(.4,0,.2,1),top .35s ease;opacity:0}
.tele{font-size:13px}
.tele h2{font-size:14px;margin:0 0 8px;color:var(--accent)}
.metrics{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-bottom:10px}
.metrics div:nth-child(odd){color:var(--muted)}
.metrics b{font-variant-numeric:tabular-nums}
.log{height:236px;overflow:auto;background:#12172f;border:1px solid #2a336a;border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-acc{color:var(--good)}.t-err{color:var(--bad)}.t-evt{color:#9fb0ff}.t-sys{color:var(--muted)}
.legend{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <h1>Growing Pattern Architect</h1>
    <div class="sub">Look at how the pattern grows. Build (or dial) the next one that keeps the pattern going.</div>
    <div class="phasebar" id="phasebar"></div>
    <div class="prompt" id="prompt"></div>
    <div class="examples" id="examples"></div>
    <div class="builder" id="builder"></div>
    <div class="row">
      <button class="act" id="doneBtn">Done</button>
      <button class="act ghost" id="clearBtn">Clear</button>
      <button class="act ghost" id="nextBtn" style="display:none">Next</button>
    </div>
    <div class="fb" id="fb"></div>
    <div class="hand" id="hand">&#128070;</div>
  </main>
  <aside class="card tele">
    <h2>Live telemetry</h2>
    <div class="metrics" id="metrics"></div>
    <div class="log" id="log"></div>
    <div class="legend">Logs <b>M-ACC</b>, <b>M-EFF</b> (tiles/edits vs optimal), <b>M-PATH</b> (build order), <b>M-RULEID</b> (rule dimensionality solved), <b>M-DIFFREACH</b> (near stage 4 vs far stage 10).</div>
  </aside>
</div>
<script>
(function(){
  "use strict";
  var el=function(id){return document.getElementById(id)};
  var examples=el('examples'),builder=el('builder'),hand=el('hand'),prompt=el('prompt'),
      fb=el('fb'),doneBtn=el('doneBtn'),clearBtn=el('clearBtn'),nextBtn=el('nextBtn');
  var T0=Date.now(); function perf(){return Date.now()-T0;}

  var Tel={
    scored:0,correct:0,effSum:0,effN:0,path:0,ruleMax:0,diffMax:0,
    push:function(cls,msg){var d=document.createElement('div');d.className=cls;
      d.textContent='['+(perf()/1000).toFixed(2)+'s] '+msg;var L=el('log');L.appendChild(d);L.scrollTop=L.scrollHeight;},
    render:function(){
      var acc=Tel.scored?Math.round(100*Tel.correct/Tel.scored)+'% ('+Tel.correct+'/'+Tel.scored+')':'—';
      var eff=Tel.effN?Math.round(100*Tel.effSum/Tel.effN)+'%':'—';
      el('metrics').innerHTML=
        '<div>M-ACC accuracy</div><b>'+acc+'</b>'+
        '<div>M-EFF mean</div><b>'+eff+'</b>'+
        '<div>M-PATH actions</div><b>'+Tel.path+'</b>'+
        '<div>M-RULEID max</div><b>'+(Tel.ruleMax||'—')+'</b>'+
        '<div>M-DIFFREACH stage</div><b>'+(Tel.diffMax||'—')+'</b>';
    }
  };

  // items: stages = counts shown; targetCount; mode build/dial; stageIndex (difficulty); ruleDim; cols for mini layout
  var items=[
    {phase:'demo',  stages:[1,2,3], target:4, mode:'build', stageIx:4, ruleDim:1, cols:[1,2,3,4]},
    {phase:'warmup',stages:[2,4,6], target:8, mode:'build', stageIx:4, ruleDim:1, cols:[1,2,3,4], rows:2},
    {phase:'scored',stages:[1,3,6], target:10,mode:'build', stageIx:4, ruleDim:2},
    {phase:'scored',stages:[3,6,9], target:30,mode:'dial', stageIx:10,ruleDim:2}
  ];
  var labels={demo:'1 Watch',warmup:'2 Try',scored:'3 Solve'};
  var idx=-1,cur=null,on=[],firstAction=0,edits=0,dialVal=0;

  function renderPhasebar(){
    el('phasebar').innerHTML=['demo','warmup','scored'].map(function(p){
      var on=cur&&cur.phase===p?' on':''; return '<span class="pill'+on+'">'+labels[p]+'</span>';
    }).join('');
  }
  function miniFig(count,idxStage){
    var b=document.createElement('div');b.className='stagebox';
    var m=document.createElement('div');m.className='mini';
    var cols=Math.min(count,5); m.style.gridTemplateColumns='repeat('+Math.max(cols,1)+',14px)';
    for(var i=0;i<count;i++){var d=document.createElement('div');d.className='dot';m.appendChild(d);}
    b.appendChild(m);
    var c=document.createElement('div');c.className='cap';c.textContent='#'+idxStage+' ('+count+')';b.appendChild(c);
    return b;
  }
  function drawExamples(){
    examples.innerHTML='';
    cur.stages.forEach(function(cnt,i){ examples.appendChild(miniFig(cnt,i+1)); });
    var q=document.createElement('div');q.className='stagebox';
    var box=document.createElement('div');box.className='qbox';box.textContent='?';q.appendChild(box);
    var cap=document.createElement('div');cap.className='cap';cap.textContent='#'+cur.stageIx+' = ?';q.appendChild(cap);
    examples.appendChild(q);
  }

  function drawBuilder(){
    builder.innerHTML=''; on=[];
    if(cur.mode==='build'){
      var g=document.createElement('div');g.className='grid';
      for(var i=0;i<24;i++){(function(i){
        var c=document.createElement('div');c.className='cell';c.id='cell'+i;
        c.onclick=function(){toggle(i);};
        g.appendChild(c); on[i]=false;
      })(i);}
      builder.appendChild(g);
      var cnt=document.createElement('div');cnt.className='count';cnt.id='cnt';cnt.innerHTML='You built: <b>0</b> tiles';
      builder.appendChild(cnt);
      clearBtn.style.display='inline-block';
    } else {
      dialVal=0;
      var d=document.createElement('div');d.className='dial';
      d.innerHTML='<button class="step" id="minus">&#8722;</button><div class="num" id="dialNum">0</div><button class="step" id="plus">+</button>';
      builder.appendChild(d);
      el('minus').onclick=function(){setDial(dialVal-1);};
      el('plus').onclick=function(){setDial(dialVal+1);};
      clearBtn.style.display='none';
    }
  }
  function toggle(i){
    if(cur.phase==='demo')return;
    if(firstAction===0){firstAction=perf();Tel.push('t-evt','first action');}
    on[i]=!on[i]; edits++; Tel.path++;
    el('cell'+i).classList.toggle('on',on[i]);
    var c=on.filter(Boolean).length; el('cnt').innerHTML='You built: <b>'+c+'</b> tiles';
    Tel.push('t-evt','tile '+(on[i]?'+':'-')+' -> count '+c);
    Tel.render();
  }
  function setDial(v){
    if(cur.phase==='demo')return; if(v<0)v=0;
    if(firstAction===0){firstAction=perf();Tel.push('t-evt','first action');}
    dialVal=v; edits++; Tel.path++; el('dialNum').textContent=v;
    Tel.push('t-evt','dial -> '+v);
    Tel.render();
  }
  clearBtn.onclick=function(){ if(cur.phase==='demo'||cur.mode!=='build')return;
    for(var i=0;i<24;i++){on[i]=false;el('cell'+i).classList.remove('on');} edits++; Tel.path++;
    el('cnt').innerHTML='You built: <b>0</b> tiles'; Tel.push('t-evt','clear'); };

  function loadItem(){
    idx++; if(idx>=items.length){finish();return;}
    cur=items[idx]; firstAction=0; edits=0; dialVal=0;
    fb.textContent='';fb.className='fb'; nextBtn.style.display='none'; doneBtn.disabled=false;
    renderPhasebar();
    prompt.innerHTML = cur.mode==='dial'
      ? 'How many tiles would be in shape #'+cur.stageIx+'? Dial the number.'
      : 'Build shape #'+cur.stageIx+' (the next one that keeps the pattern).';
    drawExamples(); drawBuilder();
    Tel.push('t-sys','LOAD '+cur.phase+': stages '+cur.stages.join(',')+' -> #'+cur.stageIx+' = '+cur.target+' ('+cur.mode+')');
    if(cur.phase==='demo') ghostDemo();
    Tel.render();
  }

  doneBtn.onclick=function(){ if(cur.phase==='demo')return; commit(); };
  function commit(){
    var val = cur.mode==='build'? on.filter(Boolean).length : dialVal;
    var correct=(val===cur.target);
    var optimal = cur.mode==='build'? cur.target : 1; // build: target taps; dial: 1 (but steppers cost)
    var used = cur.mode==='build'? edits : Math.max(edits,1);
    var eff = cur.mode==='build'? optimal/Math.max(used,optimal) : Math.min(cur.target,edits)? cur.target/Math.max(used,cur.target||1):0;
    if(cur.mode==='dial') eff = cur.target/Math.max(used,cur.target); // fewest steps ~= target value
    if(cur.phase==='scored'){
      Tel.scored++; if(correct)Tel.correct++;
      Tel.effSum+=eff; Tel.effN++;
      if(correct){ Tel.ruleMax=Math.max(Tel.ruleMax,cur.ruleDim); Tel.diffMax=Math.max(Tel.diffMax,cur.stageIx); }
      var etype = correct?'correct':(val<cur.target?'under by '+(cur.target-val):'over by '+(val-cur.target));
      Tel.push(correct?'t-acc':'t-err','SCORED #'+cur.stageIx+': built '+val+' (want '+cur.target+')  EFF='+Math.round(100*eff)+'%  ruleDim='+cur.ruleDim+'  err='+etype);
    } else {
      Tel.push('t-sys',cur.phase.toUpperCase()+': built '+val+' (want '+cur.target+') — not scored');
    }
    fb.textContent = correct? (cur.phase==='warmup'?'Pattern continued! Now the tricky ones.':'Yes — the pattern keeps going!')
                    : 'Not the right size — look at how it grows each step.';
    fb.className='fb '+(correct?'good':'bad');
    doneBtn.disabled=true; nextBtn.style.display='inline-block'; if(correct)beep();
    Tel.render();
  }
  nextBtn.onclick=loadItem;

  function ghostDemo(){
    doneBtn.disabled=true; hand.style.opacity='0';
    // build 'target' tiles one by one
    for(var i=0;i<cur.target;i++){(function(i){
      setTimeout(function(){
        var c=el('cell'+i);var r=c.getBoundingClientRect();
        hand.style.opacity='1';hand.style.left=(r.left+r.width/2-4)+'px';hand.style.top=(r.top+r.height/2)+'px';
        on[i]=true;c.classList.add('on');
        el('cnt').innerHTML='You built: <b>'+on.filter(Boolean).length+'</b> tiles';
        Tel.push('t-sys','ghost: tile '+(i+1));
      }, 400 + i*380);
    })(i);}
    setTimeout(function(){beep();fb.textContent='Shape #4 has '+cur.target+' (it grows +1 each time).';fb.className='fb good';hand.style.opacity='0';},400+cur.target*380+200);
    setTimeout(function(){loadItem();},400+cur.target*380+1300);
  }

  function beep(){try{var a=new(window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(620,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(960,a.currentTime+.15);g.gain.setValueAtTime(.12,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.3);o.start();o.stop(a.currentTime+.32);}catch(e){}}

  function finish(){
    prompt.textContent='';examples.innerHTML='';
    builder.innerHTML='<div style="text-align:center;padding:24px 0">'+
      '<div style="font-size:44px">&#127881;</div><div style="color:var(--muted)">Sample complete. Telemetry captured on the right.</div></div>';
    doneBtn.style.display='none';clearBtn.style.display='none';nextBtn.style.display='none';
    Tel.push('t-sys','SESSION complete: '+Tel.correct+'/'+Tel.scored+' scored correct');
  }
  window.addEventListener('blur',function(){Tel.push('t-sys','engagement: focus lost');});
  Tel.render(); loadItem();
})();
</script>
</body>
</html>
