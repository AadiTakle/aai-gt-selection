<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-HOIST-01 · Pulley Hoist</title>
<style>
  :root{--bg1:#fff6e8;--bg2:#eef0ff;--ink:#26304a;--card:#fff;--accent:#e8863b;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:14px}
  #instr{font-size:14px;color:#666;min-height:20px;text-align:center;max-width:430px}
  #scene{width:340px;height:250px;background:#f3f6ff;border-radius:16px;position:relative;border:3px solid #e2e8fb;overflow:hidden}
  #beam{position:absolute;top:14px;left:20px;right:20px;height:12px;background:#8a6a44;border-radius:4px}
  #platform{position:absolute;right:16px;top:60px;width:78px;height:12px;background:#6b9b6b;border-radius:4px}
  #plat-label{position:absolute;right:20px;top:40px;font-size:13px;color:#4a7a4a}
  #crate{position:absolute;left:40px;width:64px;height:64px;background:#c98b52;border:3px solid #a5703f;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#5a3d1f;transition:top .8s cubic-bezier(.3,.7,.3,1)}
  .pulley{position:absolute;top:8px;width:22px;height:22px;border-radius:50%;background:#556;border:3px solid #889;}
  #rope{position:absolute;top:20px;width:3px;background:#b9a; }
  #meter{width:300px;display:flex;flex-direction:column;gap:4px}
  .bar{height:20px;background:#e7ecff;border-radius:10px;overflow:hidden;position:relative}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);transition:width .4s}
  .barlab{font-size:12px;color:#777;display:flex;justify-content:space-between}
  #tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:12px}
  .tb{background:#eef6ff;border:3px solid #d7e6ff;padding:8px 14px;font-size:14px;font-weight:700;color:#3a4a7a}
  #pull{background:var(--accent);color:#fff;padding:10px 22px;font-weight:700;font-size:17px}
  #replay{width:44px;height:44px;background:#eef1ff;color:#5b6cff;font-size:20px;border-radius:50%}
  #row{display:flex;gap:14px;align-items:center}
  #ghost{position:fixed;left:0;top:0;font-size:34px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .5s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:170px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:880px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:260px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-HOIST-01 · Pulley Hoist</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="instr"></div>
      <div id="scene">
        <div id="beam"></div><div id="platform"></div><div id="plat-label">platform</div>
        <div id="crate">?</div>
      </div>
      <div id="meter"><div class="barlab"><span>lift power</span><span id="ml"></span></div><div class="bar"><i id="mbar"></i></div></div>
      <div id="tray">
        <button class="tb" data-a="pulley">＋ pulley 🛞</button>
        <button class="tb" data-a="weight">＋ weight 🏋️</button>
        <button class="tb" data-a="remove">－ remove</button>
      </div>
      <div id="row"><button id="pull">⬆️ PULL</button><button id="replay" title="replay demo">↻</button></div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const BASE=2; // one bare pull lifts 2
// lift = BASE * 2^pulleys + weight*2 ; success if lift >= crateWeight
const LEVELS={warm:{w:3,optP:1,optW:0},s1:{w:14,optP:3,optW:0}}; // 2*2^3=16>=14 -> 3 pulleys optimal(fewest parts)
function optParts(l){let best=99;for(let p=0;p<=5;p++)for(let w=0;w<=4;w++){if(BASE*Math.pow(2,p)+w*2>=l.w)best=Math.min(best,p+w)}return best}
const T={itemStart:0,acts:0,firstLat:null,firstActed:false,opt:0,pulls:0,removes:0,scored:0,correct:0,under:0,over:0,lastErr:''};
const METERS=[
 {id:'M-ACC',name:'Crate lifted (scored)',get:()=>T.scored?`${T.correct}/${T.scored}`:'—'},
 {id:'M-EFF',name:'Parts vs optimal',get:()=>T.opt?`${T.opt}/${st.pulleys+st.weights}`:'—'},
 {id:'M-PATH',name:'Actions taken',get:()=>T.acts+''},
 {id:'M-RTFIRST',name:'First-action latency (plan)',get:()=>T.firstLat==null?'—':T.firstLat+' ms'},
 {id:'M-ERRTYPE',name:'Last miss type',get:()=>T.lastErr||'—'},
 {id:'M-REV',name:'Removals (revisions)',get:()=>T.removes+''},
 {id:'M-HYP',name:'PULL test runs',get:()=>T.pulls+''},
 {id:'M-PERSIST',name:'Time-on-task (ms)',get:()=>T.itemStart?(Date.now()-T.itemStart):'—'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const t=T.itemStart?Date.now()-T.itemStart:0;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-6}px,${c.y-4}px)`;await sleep(480)}

let phase='demo',lvl=null,locked=false;
const st={pulleys:0,weights:0};
const setCue=i=>$('#phasecue').textContent=i;
function lift(){return BASE*Math.pow(2,st.pulleys)+st.weights*2}
function renderScene(){ // draw pulleys + crate label + power bar
  $$('.pulley').forEach(x=>x.remove());const sc=$('#scene');
  for(let i=0;i<st.pulleys;i++){const p=document.createElement('div');p.className='pulley';p.style.left=(150+i*30)+'px';sc.appendChild(p)}
  $('#crate').textContent=lvl.w;$('#crate').style.top='170px';
  const need=lvl.w,have=lift();const pct=Math.min(100,Math.round(100*have/need));
  $('#mbar').style.width=pct+'%';$('#mbar').style.background=have>=need?'var(--good)':'var(--accent)';
  $('#ml').textContent=`${have} / need ${need}` + (st.weights?`  (+${st.weights}🏋️)`:'');}
function newLevel(l){lvl=l;st.pulleys=0;st.weights=0;T.itemStart=Date.now();T.acts=0;T.firstActed=false;T.firstLat=null;T.opt=optParts(l);T.pulls=0;T.removes=0;T.lastErr='';locked=false;renderScene();renderMeters()}
function act(a){if(locked)return;if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first action (after planning)')}
  T.acts++;
  if(a==='pulley'){st.pulleys=Math.min(5,st.pulleys+1);log('mount pulley (total '+st.pulleys+')')}
  if(a==='weight'){st.weights=Math.min(4,st.weights+1);log('hang counterweight (total '+st.weights+')')}
  if(a==='remove'){if(st.weights>0){st.weights--;T.removes++;log('remove weight')}else if(st.pulleys>0){st.pulleys--;T.removes++;log('remove pulley')}}
  renderScene();renderMeters()}
async function pull(){if(locked)return;T.pulls++;const have=lift(),need=lvl.w;
  if(have>=need){locked=true;$('#crate').style.top='42px';setCue(phase==='scored'?'🏆':'⭐');$('#instr').textContent='Lifted onto the platform! 🎉';
    if(phase==='scored'){T.scored++;T.correct++;log(`LIFTED · parts ${st.pulleys+st.weights} (optimal ${T.opt}) · pulls ${T.pulls} · firstLat ${T.firstLat}ms`);renderMeters();setTimeout(finish,1500)}
    else{log('warm-up lifted (unscored)');setTimeout(startScored,1400)}}
  else{const wobble=$('#crate');wobble.style.top='150px';setTimeout(()=>wobble.style.top='170px',300);
    T.lastErr='under-lift';log(`run ${T.pulls}: too heavy (${have}<${need}) — add mechanical advantage`);renderMeters()}}
function finish(){phase='done';locked=true;setCue('🏆');$('#instr').textContent='Done! Nice rigging.'}
function startWarmup(){phase='warmup';setCue('⭐');$('#instr').textContent='Warm-up: add a pulley, then PULL. (unscored)';newLevel(LEVELS.warm);log('— warm-up (unscored) —')}
function startScored(){phase='scored';setCue('🎯');$('#instr').textContent='SCORED: the crate is heavy. Add pulleys/weights so lift power reaches it, then PULL — use the fewest parts.';newLevel(LEVELS.s1);log('— SCORED: lift the heavy crate —')}
async function runDemo(){phase='demo';setCue('👁️');$('#instr').textContent='';newLevel(LEVELS.warm);log('ghost-hand demo (wordless, <10s)');gShow(true);await sleep(300);
  await gTo($('[data-a="pulley"]'));act('pulley');await sleep(300);
  await gTo($('#pull'));gShow(false);await sleep(200);$('#crate').style.top='42px';$('#instr').textContent='';await sleep(1000);startWarmup()}
$('#tray').addEventListener('click',e=>{const b=e.target.closest('.tb');if(b)act(b.dataset.a)});
$('#pull').addEventListener('click',pull);
$('#replay').addEventListener('click',()=>{if(phase==='done')runDemo()});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
