<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-complexspan-01 — Solve &amp; Stash (complex span)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;--tile:#232c4d;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:470px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #stage{width:420px;min-height:240px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
  #prompt{font-size:44px;font-weight:800;min-height:60px;display:flex;align-items:center;gap:6px}
  #store{font-size:76px;font-weight:800;color:var(--warn)}
  .symgrid{display:grid;gap:2px}
  .symgrid div{width:16px;height:16px;border-radius:2px}
  .g4{display:grid;grid-template-columns:repeat(4,44px);grid-template-rows:repeat(4,44px);gap:8px}
  .g4 .c{background:var(--tile);border-radius:10px;cursor:pointer}
  .g4 .c.hot{background:var(--bad);box-shadow:0 0 16px 3px #ff6b8a88}
  .g4 .c.pick{background:#2f6df0}
  .g4 .c.ok{background:var(--good)}.g4 .c.no{background:var(--bad)}
  .yn{display:flex;gap:16px}
  .yn button{font-size:26px;width:96px;height:60px;border-radius:14px;border:2px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  .yn button.flash{outline:4px solid var(--good)}.yn button.wrong{outline:4px solid var(--bad)}
  .keypad{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:380px}
  .key{width:52px;height:52px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);font-size:22px;font-weight:700;cursor:pointer}
  .slots{display:flex;gap:8px}
  .slot{width:44px;height:44px;border:2px dashed var(--edge);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
  .slot.filled{border-style:solid;border-color:var(--accent)}.slot.ok{border-color:var(--good)}.slot.no{border-color:var(--bad)}
  #cue{font-size:24px;height:30px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.ctl{font:inherit;padding:9px 15px;border-radius:10px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:#062033;border-color:transparent;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:7px 12px;background:#182042}.seg button.on{background:var(--warn);color:#3a2c00;font-weight:600}
  .tel{width:315px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:140px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>🧩 Solve &amp; Stash <span class="badge" id="bmode">Math + letters</span></h1>
    <p class="sub" id="task">Answer each mini-puzzle (✓/✗), then remember the glowing letter. After a few, tap the letters back <b>in order</b>.</p>
  </div>
  <div id="stage">
    <div id="prompt"></div>
    <div id="store" style="display:none"></div>
    <div class="yn" id="yn" style="display:none"><button data-a="T">✓ true</button><button data-a="F">✗ false</button></div>
    <div id="recall" style="display:none"></div>
  </div>
  <div id="cue">👀</div>
  <div class="row">
    <div class="seg" id="modeseg">
      <button data-m="op" class="on">Math + letters</button>
      <button data-m="sym">Symmetry + spots</button>
    </div>
  </div>
  <div class="row">
    <button class="pri ctl" id="go">▶ Watch how it works</button>
    <button class="ctl" id="replay" disabled>↺ Replay demo</button>
  </div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>

<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const stage=$("#stage"),promptEl=$("#prompt"),storeEl=$("#store"),ynEl=$("#yn"),recallEl=$("#recall"),cue=$("#cue");
let mode="op", setSize=2;
const LETTERS=["F","H","J","K","L","P","Q","R","S","T"];
const T={phase:"idle",mode:"op",trial:0,setSize:2,
  storageMax:0,recallAcc:[0,0],poly:[],
  procCorrect:0,procTotal:0,procRT:[],
  serialHit:Array(6).fill(0),serialTot:Array(6).fill(0),log:[]};
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function med(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}
function cv(a){if(a.length<2)return 0;const m=mean(a);if(!m)return 0;return Math.sqrt(mean(a.map(x=>(x-m)**2)))/m;}
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop();}
function render(){
  const rAcc=T.recallAcc[1]?Math.round(100*T.recallAcc[0]/T.recallAcc[1]):0;
  const pAcc=T.procTotal?Math.round(100*T.procCorrect/T.procTotal):0;
  const maxpos=Math.max(2,...T.serialTot.map((t,i)=>t?i+1:0));
  const sp=T.serialTot.slice(0,maxpos).map((t,i)=>{const h=t?Math.round(100*T.serialHit[i]/t):0;return `<span style="flex:1;height:20px;border-radius:3px;background:linear-gradient(0deg,#5ce39a ${h}%,#223 ${h}%);font-size:9px;color:#000;display:flex;align-items:flex-end;justify-content:center">${t?h:""}</span>`;}).join("");
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-complexspan-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>shell</span><b>${T.mode==="op"?"operation span":"symmetry span"}</b></div>
  <div class="kv"><span>set size</span><b>${T.setSize}</b></div>
  <div class="kv"><span>sets done</span><b>${T.trial}</b></div>
  <h2>Storage (recall)</h2>
  <div class="kv"><span>max set recalled <span class="m">M-SPAN·M-DIFFREACH</span></span><b>${T.storageMax}</b></div>
  <div class="kv"><span>recall all-correct <span class="m">M-ACC</span></span><b>${rAcc}%</b></div>
  <div class="kv"><span>partial credit <span class="m">M-POLY</span></span><b>${T.poly.length?Math.round(100*mean(T.poly)):0}%</b></div>
  <h2>Processing (effort gate)</h2>
  <div class="kv"><span>processing acc <span class="m">M-PROCACC</span></span><b>${pAcc}%</b></div>
  <div class="kv"><span>processing RT <span class="m">M-RT</span></span><b>${Math.round(med(T.procRT))} ms</b></div>
  <div class="kv"><span>processing RT-CV <span class="m">M-RTVAR</span></span><b>${cv(T.procRT).toFixed(2)}</b></div>
  <div class="kv" style="color:${pAcc<80&&T.procTotal>3?'var(--bad)':'inherit'}"><span>gate (≥80% req)</span><b>${T.procTotal>3?(pAcc>=80?"valid":"trade-off!"):"—"}</b></div>
  <h2>Serial position <span class="m">M-SERIALPOS</span></h2>
  <div style="display:flex;gap:3px">${sp||'<span>—</span>'}</div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
render();

// ---- processing item ----
let cur=null;
ynEl.addEventListener("pointerdown",e=>{const b=e.target.closest("button");if(!b||!cur||cur.done)return;
  cur.done=true;cur.rt=performance.now()-cur.onset;cur.ok=b.dataset.a===cur.ans;
  b.classList.add(cur.ok?"flash":"wrong");setTimeout(()=>b.classList.remove("flash","wrong"),200);cur.resolve&&cur.resolve();});

function makeProcessing(){
  if(mode==="op"){
    const a=1+(Math.random()*8|0),b=1+(Math.random()*8|0),plus=Math.random()<.5;
    const real=plus?a+b:Math.max(a,b)-Math.min(a,b);
    const shownTrue=Math.random()<.5;const shown=shownTrue?real:real+(Math.random()<.5?1:-1);
    promptEl.style.display="flex";promptEl.innerHTML=`${plus?a:Math.max(a,b)} ${plus?"+":"−"} ${plus?b:Math.min(a,b)} = ${Math.max(0,shown)}`;
    return {ans:shownTrue?"T":"F"};
  }else{
    const N=6;const sym=Math.random()<.5;const cells=[];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)cells.push(0);
    for(let r=0;r<N;r++)for(let c=0;c<N/2;c++){const v=Math.random()<.4?1:0;cells[r*N+c]=v;cells[r*N+(N-1-c)]=sym?v:(Math.random()<.4?1:0);}
    promptEl.style.display="grid";promptEl.className="symgrid";promptEl.style.gridTemplateColumns=`repeat(${N},16px)`;
    promptEl.innerHTML=cells.map(v=>`<div style="background:${v?'#e9edff':'#26304f'}"></div>`).join("");
    return {ans:sym?"T":"F"};
  }
}
function makeStorage(){
  if(mode==="op"){const L=LETTERS[Math.random()*LETTERS.length|0];return {kind:"letter",val:L};}
  else{const k=Math.random()*16|0;return {kind:"cell",val:k};}
}

async function processingStep(scored){
  const p=makeProcessing();ynEl.style.display="flex";storeEl.style.display="none";
  cur={ans:p.ans,onset:performance.now(),done:false,resolve:null};
  await new Promise(res=>{cur.resolve=res;setTimeout(()=>{if(!cur.done){cur.done=true;cur.timeout=true;res();}},3500);});
  if(scored){T.procTotal++;if(cur.ok)T.procCorrect++;if(!cur.timeout)T.procRT.push(cur.rt);
    logE(`solve: ${cur.timeout?"slow":(cur.ok?"✓":"✗")} ${cur.timeout?"":Math.round(cur.rt)+"ms"}`);}
  promptEl.className=mode==="sym"?"symgrid":"";promptEl.style.display="none";ynEl.style.display="none";render();
}
async function storageStep(item){
  if(item.kind==="letter"){storeEl.style.display="block";storeEl.className="";storeEl.textContent=item.val;}
  else{storeEl.style.display="grid";storeEl.className="g4";storeEl.innerHTML=Array.from({length:16},(_,i)=>`<div class="c${i===item.val?' hot':''}"></div>`).join("");}
  await sleep(1000);storeEl.style.display="none";
}

async function recallPhase(items,scored){
  recallEl.style.display="flex";recallEl.style.flexDirection="column";recallEl.style.gap="12px";recallEl.style.alignItems="center";
  const n=items.length;
  const slots=document.createElement("div");slots.className="slots";
  for(let i=0;i<n;i++){const s=document.createElement("div");s.className="slot";slots.appendChild(s);}
  const pad=document.createElement("div");
  const picks=[];
  if(mode==="op"){
    pad.className="keypad";
    LETTERS.forEach(L=>{const k=document.createElement("button");k.className="key";k.textContent=L;pad.appendChild(k);});
    recallEl.innerHTML="";recallEl.appendChild(slots);recallEl.appendChild(pad);
    await new Promise(res=>{pad.onclick=e=>{const k=e.target.closest(".key");if(!k)return;
      const slot=[...slots.children].find(s=>!s.classList.contains("filled"));if(!slot)return;
      slot.textContent=k.textContent;slot.classList.add("filled");picks.push(k.textContent);
      if(picks.length===n){res();}};});
  }else{
    pad.className="g4";pad.innerHTML=Array.from({length:16},(_,i)=>`<div class="c" data-i="${i}"></div>`).join("");
    recallEl.innerHTML="";recallEl.appendChild(slots);recallEl.appendChild(pad);
    // slots show order numbers
    [...slots.children].forEach((s,i)=>s.textContent=i+1);
    await new Promise(res=>{pad.onclick=e=>{const c=e.target.closest(".c");if(!c||c.classList.contains("pick"))return;
      c.classList.add("pick");picks.push(+c.dataset.i);
      const slot=[...slots.children].find(s=>!s.classList.contains("filled"));slot.classList.add("filled");slot.textContent="●";
      if(picks.length===n){res();}};});
  }
  // score
  let nc=0;const truth=items.map(it=>it.val);
  picks.forEach((p,i)=>{const ok=p===truth[i];if(scored){T.serialTot[i]++;if(ok)T.serialHit[i]++;}if(ok)nc++;});
  if(mode==="op"){[...slots.children].forEach((s,i)=>s.classList.add(picks[i]===truth[i]?"ok":"no"));}
  else{[...pad.children].forEach(c=>{const i=+c.dataset.i;const pos=picks.indexOf(i);if(pos>=0)c.classList.add(picks[pos]===truth[pos]?"ok":"no");});}
  const all=nc===n;
  if(scored){T.recallAcc[1]++;if(all)T.recallAcc[0]++;T.poly.push(nc/n);if(all&&n>T.storageMax)T.storageMax=n;
    logE(`recall ${nc}/${n} ${all?"✓":""}`);}
  cue.textContent=all?"✅":"↔️";render();
  await sleep(1100);recallEl.style.display="none";recallEl.innerHTML="";
  return all;
}

async function runSet(scored){
  const n=T.setSize;const items=[];
  promptEl.style.display="flex";storeEl.style.display="none";ynEl.style.display="none";recallEl.style.display="none";
  for(let i=0;i<n;i++){
    cue.textContent="🧮";await processingStep(scored);
    const item=makeStorage();items.push(item);cue.textContent="💾";await storageStep(item);await sleep(200);
  }
  cue.textContent="✋";
  const all=await recallPhase(items,scored);
  if(scored){T.trial++;
    const pAcc=T.procTotal?T.procCorrect/T.procTotal:1;
    if(all&&pAcc>=0.75)T.setSize=Math.min(5,T.setSize+1);else if(!all)T.setSize=Math.max(2,T.setSize-1);
  }
  render();
}

// ---------- ghost-hand demo ----------
async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;$("#replay").disabled=true;
  const sm=mode;mode="op";
  const ghost=document.createElement("div");ghost.textContent="👆";ghost.style.cssText="position:fixed;font-size:28px;z-index:9;transition:left .35s,top .35s;opacity:0;pointer-events:none";document.body.appendChild(ghost);
  // one cycle: show 2+2=4 -> tap true; show letter K; show 3+1=9 -> tap false; letter R; recall K,R
  const items=[];
  async function fakeProc(text,ansBtnIdx){promptEl.style.display="flex";promptEl.className="";promptEl.textContent=text;ynEl.style.display="flex";
    const b=ynEl.children[ansBtnIdx];const r=b.getBoundingClientRect();ghost.style.opacity="1";ghost.style.left=(r.left+20)+"px";ghost.style.top=(r.top+6)+"px";
    await sleep(520);b.classList.add("flash");await sleep(220);b.classList.remove("flash");ynEl.style.display="none";promptEl.style.display="none";}
  async function fakeStore(L){storeEl.style.display="block";storeEl.textContent=L;await sleep(750);storeEl.style.display="none";items.push(L);await sleep(150);}
  await fakeProc("2 + 2 = 4",0);await fakeStore("K");
  await fakeProc("3 + 1 = 9",1);await fakeStore("R");
  // recall
  cue.textContent="✋";recallEl.style.display="flex";recallEl.style.flexDirection="column";recallEl.style.gap="12px";recallEl.style.alignItems="center";
  const slots=document.createElement("div");slots.className="slots";for(let i=0;i<2;i++){const s=document.createElement("div");s.className="slot";slots.appendChild(s);}
  const pad=document.createElement("div");pad.className="keypad";LETTERS.forEach(L=>{const k=document.createElement("button");k.className="key";k.textContent=L;pad.appendChild(k);});
  recallEl.innerHTML="";recallEl.appendChild(slots);recallEl.appendChild(pad);
  for(const L of items){const k=[...pad.children].find(b=>b.textContent===L);const r=k.getBoundingClientRect();ghost.style.left=(r.left+14)+"px";ghost.style.top=(r.top+6)+"px";await sleep(500);
    const slot=[...slots.children].find(s=>!s.classList.contains("filled"));slot.textContent=L;slot.classList.add("filled","ok");await sleep(220);}
  cue.textContent="✅";await sleep(600);ghost.remove();recallEl.style.display="none";recallEl.innerHTML="";
  mode=sm;
  T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Try a practice set";$("#go").onclick=warmup;
  $("#phasehint").textContent="Solve, remember, repeat — then recall in order. Practice (not scored).";render();
}
$("#go").onclick=demo;$("#replay").onclick=demo;

async function warmup(){T.phase="warm-up (unscored)";T.setSize=2;render();$("#go").disabled=true;$("#replay").disabled=true;
  await runSet(false);T.phase="idle";$("#go").disabled=false;$("#replay").disabled=false;
  $("#go").textContent="▶ Start scored round";$("#go").onclick=startScored;
  $("#phasehint").textContent="These count. Keep solving accurately — skipping the puzzles is detected.";render();}
let left=0;
async function startScored(){T.phase="scored";T.setSize=2;render();left=4;$("#go").disabled=true;await loop();}
async function loop(){await runSet(true);left--;if(left>0)await loop();else finish();}
function finish(){T.phase="done";render();cue.textContent="🏁";$("#go").disabled=false;
  $("#go").textContent="▶ Another round";$("#go").onclick=startScored;
  $("#phasehint").textContent=`Done. Max set recalled: ${T.storageMax}. Storage is only credited when processing stayed accurate — that gate blocks trade-off gaming.`;}

$("#modeseg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  mode=b.dataset.m;T.mode=mode;[...$("#modeseg").children].forEach(x=>x.classList.toggle("on",x===b));
  $("#bmode").textContent=mode==="op"?"Math + letters":"Symmetry + spots";
  $("#task").innerHTML=mode==="op"?"Answer each mini-puzzle (✓/✗), then remember the glowing letter. After a few, tap the letters back <b>in order</b>.":"Say if each pattern is <b>symmetric</b> (✓/✗), then remember the red spot. After a few, tap the spots back <b>in order</b>.";
  logE(`shell → ${mode}`);render();});
</script>
</body>
</html>
