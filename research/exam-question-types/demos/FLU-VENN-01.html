<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-VENN-01 · Double Match</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#ffffff;--accent:#5b6cff;
    --good:#22b573;--bad:#ff6b6b;--socket:#c9d3ef;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:16px;max-width:560px;width:100%}
  #rings{position:relative;width:380px;height:230px}
  #rings svg{position:absolute;left:0;top:0}
  .ex{position:absolute;width:46px;height:46px;transform:translate(-23px,-23px)}
  #overlaySlot{position:absolute;left:190px;top:115px;width:52px;height:52px;transform:translate(-26px,-26px);
    border-radius:50%;border:3px dashed var(--socket);background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center}
  #overlaySlot.filled-anim{animation:pop .3s ease}
  @keyframes pop{0%{transform:translate(-26px,-26px) scale(.5);opacity:.2}100%{transform:translate(-26px,-26px) scale(1);opacity:1}}
  #tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .opt{background:#fff;border:3px solid #e2e8fb;border-radius:14px;width:78px;height:78px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
  .opt:hover{transform:translateY(-3px);border-color:#c3ccf5}
  .opt.sel{border-color:var(--accent);box-shadow:0 0 0 4px #c9d0ff;transform:translateY(-3px)}
  .opt.correct{border-color:var(--good);box-shadow:0 0 0 4px #b4ecd0}
  .opt.wrong{border-color:var(--bad);box-shadow:0 0 0 4px #ffd0d0}
  #confrow{display:flex;gap:10px;height:44px;align-items:center;opacity:0;pointer-events:none;transition:.2s}
  #confrow.show{opacity:1;pointer-events:auto}
  .conf{border:2px solid #d7deff;background:#fff;border-radius:12px;font-size:22px;width:52px;height:40px;cursor:pointer}
  .conf.on{border-color:var(--accent);background:#eef0ff}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:72px;height:72px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:50px;height:50px;background:#eef1ff;color:#5b6cff;font-size:23px}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .7s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}
  @keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:190px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-VENN-01 · Double Match</div>
    <div id="phasecue">&#128065;</div>
    <div id="stagecard">
      <div id="rings">
        <svg width="380" height="230">
          <circle cx="150" cy="115" r="102" fill="rgba(91,108,255,.10)" stroke="#8f9cf0" stroke-width="3"/>
          <circle cx="230" cy="115" r="102" fill="rgba(34,181,115,.10)" stroke="#57c79a" stroke-width="3"/>
        </svg>
        <div id="overlaySlot"></div>
      </div>
      <div id="tray"></div>
      <div id="confrow"><button class="conf" data-c="sure" title="I am sure">&#11088;</button><button class="conf" data-c="unsure" title="not sure">&#128075;</button></div>
      <div id="controls">
        <button id="replay" title="replay demo">&#8635;</button>
        <button id="go" title="submit">&#10003;</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">&#128070;<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const last=a=>a[a.length-1];
const PAL={red:'#e6194b',green:'#2ca25f',blue:'#4363d8',orange:'#f58231',purple:'#911eb4'};
const COLORKEYS=Object.keys(PAL);const SH=['circle','square','triangle','diamond','star'];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[(Math.random()*a.length)|0];}
function polyPts(cx,cy,r,n,rot){let p=[];for(let i=0;i<n;i++){let a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function starPts(cx,cy,r,n){let p=[];for(let i=0;i<2*n;i++){let rr=i%2?r*0.45:r;let a=-Math.PI/2+i*Math.PI/n;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(' ');}
function oneShape(shape,color,cx,cy,r,filled){const f=filled?`fill="${color}"`:`fill="none" stroke="${color}" stroke-width="5"`;
  switch(shape){
    case 'circle':return `<circle cx="${cx}" cy="${cy}" r="${r}" ${f}/>`;
    case 'square':return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="3" ${f}/>`;
    case 'triangle':return `<polygon points="${polyPts(cx,cy,r,3,-Math.PI/2)}" ${f}/>`;
    case 'diamond':return `<polygon points="${polyPts(cx,cy,r,4,-Math.PI/2)}" ${f}/>`;
    case 'star':return `<polygon points="${starPts(cx,cy,r,5)}" ${f}/>`;
  }return '';}
function figSVG(f,box=64){return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}">${oneShape(f.shape,PAL[f.color],box/2,box/2,box*0.30,f.fill===0)}</svg>`;}

/* ---------- item generation: conjunctive membership (left feature AND right feature) ---------- */
function differ(dim,val){return dim==='shape'?pick(SH.filter(x=>x!==val)):dim==='color'?pick(COLORKEYS.filter(x=>x!==val)):(val===0?1:0);}
function base(){return {shape:'circle',color:'blue',fill:0};}
function setD(f,dim,v){f={...f};f[dim]=v;return f;}
function genItem(leftDim,leftVal,rightDim,rightVal){
  // third (neutral) dim held constant so only the two ring features matter
  const dims=['shape','color','fill'],third=dims.find(d=>d!==leftDim&&d!==rightDim);
  const neutral=third==='fill'?0:third==='color'?'blue':'circle';
  const mk=(l,r)=>{let f=base();f=setD(f,leftDim,l);f=setD(f,rightDim,r);f=setD(f,third,neutral);return f;};
  const leftEx=[mk(leftVal,differ(rightDim,rightVal)),mk(leftVal,differ(rightDim,rightVal))];
  const rightEx=[mk(differ(leftDim,leftVal),rightVal),mk(differ(leftDim,leftVal),rightVal)];
  const opts=[
    {a:mk(leftVal,rightVal),tag:'correct',rules:2},
    {a:mk(leftVal,differ(rightDim,rightVal)),tag:'attr:left-only',rules:1},
    {a:mk(differ(leftDim,leftVal),rightVal),tag:'attr:right-only',rules:1},
    {a:mk(differ(leftDim,leftVal),differ(rightDim,rightVal)),tag:'neither',rules:0},
  ];
  return {leftDim,leftVal,rightDim,rightVal,leftEx,rightEx,options:shuffle(opts)};
}

/* ---------- telemetry ---------- */
const T={scored:0,correct:0,rts:[],firstLat:null,lastErr:'\u2014',lastRule:'\u2014',conf:'\u2014',
  confHits:0,confN:0,itemStart:0,firstActed:false};
const METERS=[
 {id:'M-ACC',name:'Item accuracy (running)',get:()=>T.scored?`${T.correct}/${T.scored}  ${Math.round(100*T.correct/T.scored)}%`:'\u2014'},
 {id:'M-RT',name:'Response time — total',get:()=>T.rts.length?`${last(T.rts)} ms  (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency (induce both rules)',get:()=>T.firstLat==null?'\u2014':T.firstLat+' ms'},
 {id:'M-ERRTYPE',name:'Error type (single-attribute near-miss)',get:()=>T.lastErr},
 {id:'M-RULEID',name:'Rule dimensionality solved (attrs met)',get:()=>T.lastRule},
 {id:'M-CONF',name:'Confidence & calibration',get:()=>T.conf+(T.confN?`  · cal ${T.confHits}/${T.confN}`:'')},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>
  `<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span>`
  +`<span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');
  d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}

/* ---------- ghost ---------- */
const ghost=$('#ghost');
function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(680);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(480);}

/* ---------- flow ---------- */
let phase='demo',cur=null,staged=-1,locked=false,scoredIndex=0,confChoice=null;
const scoredItems=[genItem('color','green','shape','star'),genItem('fill',0,'color','purple')];
const LEXSLOT=[[75,72],[75,158]],REXSLOT=[[305,72],[305,158]];
function setCue(i){$('#phasecue').innerHTML=i;}
function placeEx(list,slots){list.forEach((f,i)=>{const d=document.createElement('div');d.className='ex';
  d.style.left=slots[i][0]+'px';d.style.top=slots[i][1]+'px';d.innerHTML=figSVG(f,46);$('#rings').appendChild(d);});}
function renderItem(item){cur=item;confChoice=null;
  $$('#rings .ex').forEach(e=>e.remove());placeEx(item.leftEx,LEXSLOT);placeEx(item.rightEx,REXSLOT);
  const os=$('#overlaySlot');os.innerHTML='';os.style.borderStyle='dashed';
  const tray=$('#tray');tray.innerHTML='';
  item.options.forEach((o,i)=>{const b=document.createElement('div');b.className='opt';b.dataset.i=i;b.innerHTML=figSVG(o.a);tray.appendChild(b);});
  $('#confrow').classList.remove('show');$$('.conf').forEach(c=>c.classList.remove('on'));
  $('#go').classList.remove('ready');staged=-1;T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;renderMeters();}
function fillOverlay(f){const os=$('#overlaySlot');os.style.borderStyle='solid';os.classList.remove('filled-anim');void os.offsetWidth;os.classList.add('filled-anim');os.innerHTML=figSVG(f,46);}
function onOpt(el){if(locked||phase==='demo'||phase==='done')return;const idx=+el.dataset.i;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first tap · option '+idx);}
  staged=idx;$$('#tray .opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');
  fillOverlay(cur.options[idx].a);$('#confrow').classList.add('show');$('#go').classList.add('ready');renderMeters();}
function onConf(el){if(phase==='demo'||phase==='done'||locked)return;confChoice=el.dataset.c;
  $$('.conf').forEach(c=>c.classList.remove('on'));el.classList.add('on');log('confidence: '+confChoice);}
function feedback(correct){const opt=$$('#tray .opt')[staged];if(opt)opt.classList.add(correct?'correct':'wrong');
  if(!correct){$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),450);
    const ci=cur.options.findIndex(o=>o.tag==='correct');$$('#tray .opt')[ci].classList.add('correct');}
  locked=true;$('#go').classList.remove('ready');$('#confrow').classList.remove('show');}
function submit(){if(staged===-1)return;const opt=cur.options[staged];const rt=Date.now()-T.itemStart;const correct=opt.tag==='correct';
  if(phase==='warmup'){feedback(correct);log('warm-up '+(correct?'correct':'incorrect')+' — UNSCORED');setTimeout(nextPhase,1000);return;}
  T.scored++;T.rts.push(rt);
  if(correct){T.correct++;T.lastErr='none';}else T.lastErr=opt.tag;
  T.lastRule=opt.rules+' / 2 attributes';
  if(confChoice){T.confN++;if((confChoice==='sure')===correct)T.confHits++;T.conf=confChoice;}
  else T.conf='(none)';
  feedback(correct);
  log(`SUBMIT scored ${scoredIndex+1} · ${cur.leftDim}+${cur.rightDim} \u2192 ${correct?'CORRECT':'wrong ['+opt.tag+']'} · RT ${rt}ms · conf ${confChoice||'-'}`);
  renderMeters();setTimeout(nextPhase,1300);}
function nextPhase(){locked=false;if(phase==='warmup'){scoredIndex=0;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<scoredItems.length?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('&#11088;');locked=false;renderItem(genItem('color','red','shape','circle'));log('— warm-up (unscored): left=red, right=circle; pick the red circle —');}
function startScored(){phase='scored';setCue('&#127919;');locked=false;renderItem(scoredItems[scoredIndex]);
  log(`— SCORED item ${scoredIndex+1}: overlap = ${cur.leftDim} AND ${cur.rightDim} —`);}
function finish(){phase='done';setCue('&#127942;');locked=true;
  log(`— DONE · accuracy ${T.correct}/${T.scored} · confidence calibration ${T.confHits}/${T.confN} —`);}
async function runDemo(){phase='demo';setCue('&#128065;');locked=true;
  const d=genItem('color','red','shape','circle');renderItem(d);
  log('ghost-hand demo (wordless, <10s): left share one feature, right another; pick the both');
  const ci=d.options.findIndex(o=>o.tag==='correct');
  ghostShow(true);await sleep(250);
  const ex=$$('#rings .ex');await ghostTo(ex[0]);await ghostTo(ex[1]);await sleep(120);
  await ghostTo(ex[2]);await ghostTo(ex[3]);await sleep(150);
  await ghostTo($$('#tray .opt')[ci]);await ghostTap();
  $$('#tray .opt')[ci].classList.add('correct');fillOverlay(d.options[ci].a);
  await sleep(500);await ghostTo($('#go'));await ghostTap();await sleep(350);ghostShow(false);await sleep(450);startWarmup();}

$('#tray').addEventListener('click',e=>{const o=e.target.closest('.opt');if(o)onOpt(o);});
$('#confrow').addEventListener('click',e=>{const c=e.target.closest('.conf');if(c)onConf(c);});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
