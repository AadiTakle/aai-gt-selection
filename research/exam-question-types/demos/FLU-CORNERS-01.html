<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLU-CORNERS-01 · Four-Corner Match</title>
<style>
  :root{--bg1:#eef4ff;--bg2:#f7ecff;--ink:#26304a;--card:#ffffff;--accent:#5b6cff;
    --good:#22b573;--bad:#ff6b6b;--socket:#c9d3ef;--tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:34px;height:40px;line-height:40px}
  #stagecard{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:18px;max-width:560px;width:100%}
  #gridwrap{position:relative;padding:16px;border-radius:20px;background:linear-gradient(160deg,#dfe7ff,#eef1ff);border:3px solid #cfd8ff}
  .grid2{display:grid;grid-template-columns:96px 34px 96px;grid-template-rows:96px 34px 96px;align-items:center;justify-items:center}
  .cell{background:#fff;border-radius:12px;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
  .cell.empty{background:repeating-linear-gradient(45deg,#eef2ff,#eef2ff 8px,#e2e9ff 8px,#e2e9ff 16px);border:3px dashed var(--socket)}
  .cell.filled-anim{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}
  .arrow{color:#9aa6d8;font-size:24px;font-weight:700}
  .arrow.lit{color:var(--accent);text-shadow:0 0 8px #b9c2ff}
  #tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .opt{background:#fff;border:3px solid #e2e8fb;border-radius:14px;width:84px;height:84px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
  .opt:hover{transform:translateY(-3px);border-color:#c3ccf5}
  .opt.sel{border-color:var(--accent);box-shadow:0 0 0 4px #c9d0ff;transform:translateY(-3px)}
  .opt.correct{border-color:var(--good);box-shadow:0 0 0 4px #b4ecd0}
  .opt.wrong{border-color:var(--bad);box-shadow:0 0 0 4px #ffd0d0}
  #controls{display:flex;gap:16px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:50%}
  #go{width:76px;height:76px;background:var(--accent);color:#fff;font-size:32px;box-shadow:0 10px 24px -8px var(--accent);opacity:.35;pointer-events:none;transition:.2s}
  #go.ready{opacity:1;pointer-events:auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #replay{width:52px;height:52px;background:#eef1ff;color:#5b6cff;font-size:24px}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #ghost{position:fixed;left:0;top:0;font-size:40px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .7s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #ghost .ring{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid var(--accent);opacity:0}
  #ghost.tap .ring{animation:tapring .5s ease-out}
  @keyframes tapring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:200px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}#log .t{color:#5f6f9e}
  @media(max-width:860px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:300px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">FLU-CORNERS-01 · Four-Corner Match</div>
    <div id="phasecue">&#128065;</div>
    <div id="stagecard">
      <div id="gridwrap"><div id="grid" class="grid2"></div></div>
      <div id="tray"></div>
      <div id="controls">
        <button id="replay" title="replay demo">&#8635;</button>
        <button id="go" title="submit">&#10003;</button>
      </div>
    </div>
  </div>
  <aside id="telemetry">
    <h3>Live telemetry · per-child</h3>
    <div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div>
  </aside>
  <div id="ghost">&#128070;<span class="ring"></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const last=a=>a[a.length-1];
const PAL={red:'#e6194b',green:'#2ca25f',blue:'#4363d8',orange:'#f58231',purple:'#911eb4'};
const COLORKEYS=Object.keys(PAL);const SH=['circle','square','triangle','diamond','star'];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- shape rendering (size / fill / rotation / count) ---------- */
function polyPts(cx,cy,r,n,rot){let p=[];for(let i=0;i<n;i++){let a=rot+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function starPts(cx,cy,r,n){let p=[];for(let i=0;i<2*n;i++){let rr=i%2?r*0.45:r;let a=-Math.PI/2+i*Math.PI/n;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(' ');}
function oneShape(shape,color,cx,cy,r,filled){const f=filled?`fill="${color}"`:`fill="none" stroke="${color}" stroke-width="5"`;
  switch(shape){
    case 'circle':return `<circle cx="${cx}" cy="${cy}" r="${r}" ${f}/>`;
    case 'square':return `<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="3" ${f}/>`;
    case 'triangle':return `<polygon points="${polyPts(cx,cy,r,3,-Math.PI/2)}" ${f}/>`;
    case 'diamond':return `<polygon points="${polyPts(cx,cy,r,4,-Math.PI/2)}" ${f}/>`;
    case 'star':return `<polygon points="${starPts(cx,cy,r,5)}" ${f}/>`;
  }return '';}
function attrSVG(a,box=80){const color=PAL[a.color]||a.color;const filled=a.fill===0;
  const big=a.size===1;const R=big?box*0.32:box*0.20;const n=a.count||1;let inner='';
  if(n===1){inner=oneShape(a.shape,color,box/2,box/2,R,filled);}
  else{const pos=[[.28,.5],[.5,.5],[.72,.5]];const r=box*0.14;pos.slice(0,n).forEach(p=>inner+=oneShape(a.shape,color,p[0]*box,p[1]*box,r,filled));}
  const rot=a.rot?` transform="rotate(45 ${box/2} ${box/2})"`:'';
  return `<svg width="${box}" height="${box}" viewBox="0 0 ${box} ${box}"><g${rot}>${inner}</g></svg>`;}

/* ---------- item generation: 2x2 dual-axis relational grid ---------- */
const DIMS=['size','fill','rot','count'];
function setDim(a,dim,v){a={...a};if(dim==='count')a.count=v?3:1;else a[dim]=v;return a;}
function genItem(rowDim,colDim,shape,color){
  shape=shape||SH[(Math.random()*SH.length)|0];color=color||COLORKEYS[(Math.random()*COLORKEYS.length)|0];
  const base={shape,color,size:0,fill:0,rot:0,count:1};
  const A=setDim(setDim(base,rowDim,0),colDim,0);
  const B=setDim(setDim(base,rowDim,1),colDim,0);
  const C=setDim(setDim(base,rowDim,0),colDim,1);
  const D=setDim(setDim(base,rowDim,1),colDim,1);
  const opts=[{a:D,tag:'correct',rules:2},{a:B,tag:'axis:row-only',rules:1},
    {a:C,tag:'axis:col-only',rules:1},{a:A,tag:'literal',rules:0}];
  return {rowDim,colDim,A,B,C,D,options:shuffle(opts)};
}
function twinOf(it){let s=SH.filter(x=>x!==it.A.shape),c=COLORKEYS.filter(x=>x!==it.A.color);
  return genItem(it.rowDim,it.colDim,s[(Math.random()*s.length)|0],c[(Math.random()*c.length)|0]);}

/* ---------- telemetry ---------- */
const T={scored:0,correct:0,rts:[],firstLat:null,lastErr:'\u2014',lastRule:'\u2014',
  results:[],itemStart:0,firstActed:false};
function consistStr(){if(T.results.length<2)return T.results.length?'need 2nd twin':'\u2014';
  const a=T.results[T.results.length-2],b=T.results[T.results.length-1];
  return (a===b?'consistent':'INCONSISTENT')+' ('+T.results.map(r=>r?'\u2713':'\u2717').join('')+')';}
const METERS=[
 {id:'M-ACC',name:'Item accuracy (running)',get:()=>T.scored?`${T.correct}/${T.scored}  ${Math.round(100*T.correct/T.scored)}%`:'\u2014'},
 {id:'M-RT',name:'Response time — total',get:()=>T.rts.length?`${last(T.rts)} ms  (mean ${mean(T.rts)})`:'\u2014'},
 {id:'M-RTFIRST',name:'First-action latency (map before act)',get:()=>T.firstLat==null?'\u2014':T.firstLat+' ms'},
 {id:'M-ERRTYPE',name:'Error type (which axis honored)',get:()=>T.lastErr},
 {id:'M-RULEID',name:'Rule dimensionality solved (row+col)',get:()=>T.lastRule},
 {id:'M-CONSIST',name:'Cross-item consistency (AIG twins)',get:()=>consistStr()},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>
  `<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span>`
  +`<span class="mname">${m.name}</span></div>`).join('');}
function renderMeters(){METERS.forEach(m=>{const el=$('#v_'+m.id);if(el)el.textContent=m.get();});}
function log(msg){const t=Date.now()-T.itemStart;const d=document.createElement('div');
  d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight;}

/* ---------- ghost ---------- */
const ghost=$('#ghost');
function ghostShow(v){ghost.classList.toggle('show',v);}
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
async function ghostTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-10}px,${c.y-8}px)`;await sleep(720);}
async function ghostTap(){ghost.classList.remove('tap');void ghost.offsetWidth;ghost.classList.add('tap');await sleep(520);}

/* ---------- flow ---------- */
let phase='demo',cur=null,staged=-1,locked=false,scoredIndex=0;
const base1=genItem('size','fill');const base2=genItem('rot','count');
const scoredItems=[base1,twinOf(base1),base2];
function setCue(i){$('#phasecue').innerHTML=i;}
function disableTray(d){locked=d;}
function renderItem(item){cur=item;const g=$('#grid');g.innerHTML='';
  const mk=(cls,html,id)=>{const d=document.createElement('div');d.className=cls;if(id)d.id=id;if(html!=null)d.innerHTML=html;return d;};
  g.appendChild(mk('cell',attrSVG(item.A)));
  g.appendChild(mk('arrow','&#8594;','arrowR'));
  g.appendChild(mk('cell',attrSVG(item.B)));
  g.appendChild(mk('arrow','&#8595;','arrowD'));g.appendChild(mk('arrow',''));g.appendChild(mk('arrow',''));
  g.appendChild(mk('cell',attrSVG(item.C)));
  g.appendChild(mk('arrow','&#8594;'));
  g.appendChild(mk('cell empty',null,'emptycell'));
  const tray=$('#tray');tray.innerHTML='';
  item.options.forEach((o,i)=>{const b=document.createElement('div');b.className='opt';b.dataset.i=i;b.innerHTML=attrSVG(o.a);tray.appendChild(b);});
  $('#go').classList.remove('ready');staged=-1;T.itemStart=Date.now();T.firstActed=false;T.firstLat=null;renderMeters();}
function fillEmpty(a){const cell=$('#emptycell');if(!cell)return;cell.classList.remove('empty');
  cell.classList.add('filled-anim');cell.innerHTML=attrSVG(a);setTimeout(()=>cell.classList.remove('filled-anim'),300);}
function onOpt(el){if(locked||phase==='demo'||phase==='done')return;const idx=+el.dataset.i;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first tap · option '+idx);}
  staged=idx;$$('#tray .opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');
  fillEmpty(cur.options[idx].a);$('#go').classList.add('ready');renderMeters();}
function feedback(correct){const opt=$$('#tray .opt')[staged];if(opt)opt.classList.add(correct?'correct':'wrong');
  if(!correct){$('#stagecard').classList.add('shake');setTimeout(()=>$('#stagecard').classList.remove('shake'),450);
    const ci=cur.options.findIndex(o=>o.tag==='correct');$$('#tray .opt')[ci].classList.add('correct');}
  disableTray(true);$('#go').classList.remove('ready');}
function submit(){if(staged===-1)return;const opt=cur.options[staged];const rt=Date.now()-T.itemStart;const correct=opt.tag==='correct';
  if(phase==='warmup'){feedback(correct);log('warm-up '+(correct?'correct':'incorrect')+' — UNSCORED');setTimeout(nextPhase,950);return;}
  T.scored++;T.rts.push(rt);T.results.push(correct?1:0);
  if(correct){T.correct++;T.lastErr='none';}else T.lastErr=opt.tag;
  T.lastRule=opt.rules+' / 2 relations';
  feedback(correct);
  log(`SUBMIT scored ${scoredIndex+1} · row=${cur.rowDim}/col=${cur.colDim} \u2192 ${correct?'CORRECT':'wrong ['+opt.tag+']'} · RT ${rt}ms`);
  renderMeters();setTimeout(nextPhase,1200);}
function nextPhase(){if(phase==='warmup'){scoredIndex=0;startScored();}
  else if(phase==='scored'){scoredIndex++;scoredIndex<scoredItems.length?startScored():finish();}}
function startWarmup(){phase='warmup';setCue('&#11088;');disableTray(false);renderItem(genItem('size','fill','circle','blue'));log('— warm-up (unscored): small\u2192big across, filled\u2192shape down —');}
function startScored(){phase='scored';setCue('&#127919;');disableTray(false);renderItem(scoredItems[scoredIndex]);
  log(`— SCORED item ${scoredIndex+1}: row=${cur.rowDim}, col=${cur.colDim}${scoredIndex===1?' (AIG twin of item 1)':''} —`);}
function finish(){phase='done';setCue('&#127942;');disableTray(true);
  log(`— DONE · accuracy ${T.correct}/${T.scored} · ${consistStr()} —`);}
async function runDemo(){phase='demo';setCue('&#128065;');disableTray(true);
  const d=genItem('size','fill','circle','blue');renderItem(d);log('ghost-hand demo (wordless, <10s): trace across, then down');
  const ci=d.options.findIndex(o=>o.tag==='correct');
  ghostShow(true);await sleep(300);
  $('#arrowR').classList.add('lit');await ghostTo($$('#grid .cell')[0]);await ghostTo($$('#grid .cell')[1]);await sleep(150);
  $('#arrowD').classList.add('lit');await ghostTo($$('#grid .cell')[0]);await ghostTo($$('#grid .cell')[2]);await sleep(200);
  await ghostTo($$('#tray .opt')[ci]);await ghostTap();
  $$('#tray .opt')[ci].classList.add('correct');fillEmpty(d.options[ci].a);
  await sleep(500);await ghostTo($('#go'));await ghostTap();await sleep(350);ghostShow(false);await sleep(450);startWarmup();}

$('#tray').addEventListener('click',e=>{const o=e.target.closest('.opt');if(o)onOpt(o);});
$('#go').addEventListener('click',()=>{if($('#go').classList.contains('ready'))submit();});
$('#replay').addEventListener('click',()=>{if(phase!=='demo')runDemo();});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
