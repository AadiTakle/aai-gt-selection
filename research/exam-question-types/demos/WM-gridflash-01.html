<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM-gridflash-01 — Star Grid (change detection / visual span)</title>
<style>
  :root{--bg:#0e1220;--panel:#171d33;--edge:#2a3358;--ink:#e9edff;--mut:#8b93c0;--accent:#5cc8ff;--good:#5ce39a;--bad:#ff6b8a;--warn:#ffd166;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
  h1{font-size:19px;margin:.2rem 0}.sub{color:var(--mut);font-size:13px;margin:0;text-align:center;max-width:480px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--warn);font-size:12px}
  #stage{width:400px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px}
  #grid{display:grid;grid-template-columns:repeat(4,70px);grid-template-rows:repeat(4,70px);gap:8px}
  .cell{border-radius:12px;background:#141a30;border:1px solid #232c4d;display:flex;align-items:center;justify-content:center;font-size:42px;line-height:1}
  .cell.probe{border:3px solid var(--warn);box-shadow:0 0 0 3px rgba(255,209,102,.2)}
  #cue{font-size:22px;height:28px;color:var(--mut)}
  .sc{display:flex;gap:40px}
  .scb{width:120px;height:60px;font-size:18px;font-weight:600;border-radius:14px;border:1px solid var(--edge);background:#20284a;color:var(--ink);cursor:pointer}
  .scb:disabled{opacity:.35}.scb.ok{background:var(--good);color:#062a17}.scb.no{background:var(--bad);color:#3a0011}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.pri{background:var(--accent);color:#062033;border:none;font-weight:600;padding:9px 15px;border-radius:10px;cursor:pointer;font-size:15px}
  button.pri:disabled{opacity:.4}
  .tel{width:322px;background:var(--panel);border-left:1px solid var(--edge);padding:14px 14px 40px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
  .tel h2{font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a3358;padding:2px 0}
  .kv b{color:var(--accent);font-weight:600}.kv .m{color:var(--mut);font-size:10px}
  .log{margin-top:6px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:6px;background:#10152a}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="main">
  <div style="text-align:center">
    <h1>✨ Star Grid <span class="badge">Same or changed?</span></h1>
    <p class="sub">The stars flash for a blink, then vanish. When one star comes back in its box, tap <b>SAME</b> if its colour is unchanged or <b>CHANGED</b> if it is different.</p>
  </div>
  <div id="stage">
    <div id="grid"></div>
    <div id="cue">watch…</div>
    <div class="sc">
      <button class="scb" id="btnSame" disabled>SAME ✓</button>
      <button class="scb" id="btnDiff" disabled>CHANGED ✕</button>
    </div>
  </div>
  <div class="row"><button class="pri" id="go">▶ Watch how it works</button></div>
  <p class="sub" id="phasehint">A ghost hand shows you first — no reading needed.</p>
</div>
<aside class="tel" id="tel"></aside>

<script>
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const grid=$("#grid");
const COLORS=["#ff5c5c","#4da1ff","#4be08a","#ffd166","#b58cff","#ff9f43"];
const CELLS=16;
let setSize=3,exposure=750,delay=900;
const T={phase:"idle",trial:0,setSize:3,correct:0,total:0,rtC:[],
  hit:0,change:0,fa:0,same:0,miss:0,
  span:0,maxReach:0,bySize:{},log:[]};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sd=a=>a.length<2?0:Math.sqrt(mean(a.map(x=>(x-mean(a))**2)));
const rand=a=>a[Math.random()*a.length|0];
function logE(s){T.log.unshift(`${(performance.now()/1000).toFixed(1)}s · ${s}`);if(T.log.length>60)T.log.pop();}
// Acklam inverse-normal CDF for d-prime
function phiInv(p){p=Math.min(0.999,Math.max(0.001,p));
  const a=[-3.969683028665376e1,2.209460984245205e2,-2.759285104469687e2,1.383577518672690e2,-3.066479806614716e1,2.506628277459239];
  const b=[-5.447609879822406e1,1.615858368580409e2,-1.556989798598866e2,6.680131188771972e1,-1.328068155288572e1];
  const c=[-7.784894002430293e-3,-3.223964580411365e-1,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783];
  const d=[7.784695709041462e-3,3.224671290700398e-1,2.445134137142996,3.754408661907416];
  const pl=0.02425;let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p<=1-pl){q=p-0.5;r=q*q;return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
  q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}
function dprime(){if(!T.change||!T.same)return null;
  let h=T.hit/T.change,f=T.fa/T.same;h=Math.min(1-1/(2*T.change),Math.max(1/(2*T.change),h));
  f=Math.min(1-1/(2*T.same),Math.max(1/(2*T.same),f));return phiInv(h)-phiInv(f);}
function capacityK(){if(!T.change||!T.same)return null;const h=T.hit/T.change,f=T.fa/T.same;return (mean(sizeList())* (h-f));}
function sizeList(){const s=[];for(const k in T.bySize)T.bySize[k].forEach(()=>s.push(+k));return s.length?s:[setSize];}
function consist(){const parts=Object.values(T.bySize).filter(a=>a.length>=2).map(a=>1-2*sd(a));
  return parts.length?Math.max(0,Math.round(100*mean(parts))):0;}
function lapse(){if(T.rtC.length<4)return 0;const b=[...T.rtC].sort((x,y)=>x-y);const thr=b[Math.floor(b.length*0.75)]*1.5;
  return Math.round(100*T.rtC.filter(x=>x>thr).length/T.rtC.length);}
function render(){
  const acc=T.total?Math.round(100*T.correct/T.total):0;const dp=dprime(),K=capacityK();
  const bs=Object.entries(T.bySize).sort().map(([k,a])=>`n${k}:${Math.round(100*mean(a))}%`).join("  ");
  $("#tel").innerHTML=`
  <h2>Live telemetry · WM-gridflash-01</h2>
  <div class="kv"><span>phase</span><b>${T.phase}</b></div>
  <div class="kv"><span>set size (N)</span><b>${setSize}</b></div>
  <div class="kv"><span>exposure / delay</span><b>${exposure} / ${delay} ms</b></div>
  <div class="kv"><span>trial</span><b>${T.trial}</b></div>
  <h2>Accuracy</h2>
  <div class="kv"><span>accuracy <span class="m">M-ACC</span></span><b>${acc}% <span class="m">(${T.correct}/${T.total})</span></b></div>
  <div class="kv"><span>acc by set size</span><b style="font-size:11px">${bs||"—"}</b></div>
  <h2>Capacity <span class="m">M-DPRIME / M-SPAN</span></h2>
  <div class="kv"><span>sensitivity d′ <span class="m">M-DPRIME</span></span><b>${dp===null?"—":dp.toFixed(2)}</b></div>
  <div class="kv"><span>capacity K</span><b>${K===null?"—":K.toFixed(1)}</b></div>
  <div class="kv"><span>span (clean N) <span class="m">M-SPAN</span></span><b>${T.span}</b></div>
  <div class="kv"><span>max N reached <span class="m">M-DIFFREACH</span></span><b>${T.maxReach}</b></div>
  <h2>Error type <span class="m">M-ERRTYPE</span></h2>
  <div class="kv"><span>miss (changed→same)</span><b>${T.miss}</b></div>
  <div class="kv"><span>false alarm (same→changed)</span><b>${T.fa}</b></div>
  <h2>Consistency</h2>
  <div class="kv"><span>median RT <span class="m">M-RT</span></span><b>${Math.round(mean(T.rtC))} ms</b></div>
  <div class="kv"><span>cross-form consist <span class="m">M-CONSIST</span></span><b>${consist()}%</b></div>
  <div class="kv"><span>lapse rate <span class="m">M-LAPSE</span></span><b>${lapse()}%</b></div>
  <div class="log">${T.log.map(l=>`<div>${l}</div>`).join("")}</div>`;
}
function buildGrid(){grid.innerHTML="";for(let i=0;i<CELLS;i++){const d=document.createElement("div");d.className="cell";d.dataset.i=i;grid.appendChild(d);}}
buildGrid();render();

function pickCells(n){const idx=[...Array(CELLS).keys()];const out=[];
  for(let i=0;i<n;i++)out.push(idx.splice(Math.random()*idx.length|0,1)[0]);return out;}
function paint(map){[...grid.children].forEach((c,i)=>{if(map[i]){c.textContent="★";c.style.color=map[i];}else{c.textContent="";c.style.color="";}c.classList.remove("probe");});}

async function runTrial(scored){
  $("#go").disabled=true;$("#btnSame").disabled=$("#btnDiff").disabled=true;
  $("#btnSame").className="scb";$("#btnDiff").className="scb";
  const cells=pickCells(setSize);const map={};cells.forEach(i=>map[i]=rand(COLORS));
  $("#cue").textContent="watch…";paint(map);await sleep(exposure);
  paint({});$("#cue").textContent="…";await sleep(delay);
  const probeI=rand(cells);const changed=Math.random()<0.5;
  let probeColor=map[probeI];
  if(changed){const others=COLORS.filter(c=>c!==map[probeI]);probeColor=rand(others);}
  const pm={};pm[probeI]=probeColor;paint(pm);
  grid.children[probeI].classList.add("probe");
  $("#cue").textContent="same or changed?";$("#btnSame").disabled=$("#btnDiff").disabled=false;
  const onset=performance.now();
  const ans=await new Promise(res=>{$("#btnSame").onclick=()=>res(false);$("#btnDiff").onclick=()=>res(true);});
  $("#btnSame").onclick=$("#btnDiff").onclick=null;const rt=performance.now()-onset;
  const ok=(ans===changed);
  (ans?$("#btnDiff"):$("#btnSame")).classList.add(ok?"ok":"no");
  if(scored){T.total++;T.trial++;T.rtC.push(rt);
    if(changed){T.change++;if(ans)T.hit++;else T.miss++;}else{T.same++;if(ans)T.fa++;}
    if(ok)T.correct++;
    (T.bySize[setSize]=T.bySize[setSize]||[]).push(ok?1:0);
    T.maxReach=Math.max(T.maxReach,setSize);if(ok)T.span=Math.max(T.span,setSize);
    logE(`N${setSize} ${changed?"chg":"same"} ${ok?"✔":"✗"} ${Math.round(rt)}ms`);
    setSize=ok?Math.min(6,setSize+1):Math.max(2,setSize-1);T.setSize=setSize;
    if(setSize>=5)exposure=Math.max(500,exposure-40);}
  render();await sleep(700);$("#cue").textContent="";paint({});
  $("#go").disabled=false;return ok;
}

async function demo(){
  if(T.phase==="demo")return;T.phase="demo";render();$("#go").disabled=true;
  const cells=[1,6,9];const map={};const cols=["#ff5c5c","#4da1ff","#4be08a"];cells.forEach((i,k)=>map[i]=cols[k]);
  $("#cue").textContent="watch…";paint(map);await sleep(820);paint({});$("#cue").textContent="…";await sleep(820);
  const pm={};pm[6]="#ffd166";paint(pm);grid.children[6].classList.add("probe");$("#cue").textContent="changed!";
  const ghost=document.createElement("div");ghost.textContent="👆";
  ghost.style.cssText="position:fixed;font-size:30px;z-index:20;transition:left .4s,top .4s;pointer-events:none";document.body.appendChild(ghost);
  const r=$("#btnDiff").getBoundingClientRect();ghost.style.left=(r.left+40)+"px";ghost.style.top=(r.top-4)+"px";
  await sleep(800);$("#btnDiff").classList.add("ok");await sleep(700);ghost.remove();
  $("#btnDiff").className="scb";paint({});$("#cue").textContent="";T.phase="idle";$("#go").disabled=false;
  $("#go").textContent="▶ Try a practice one";$("#go").onclick=warmup;
  $("#phasehint").textContent="Now you try — this practice one is NOT scored.";render();
}
async function warmup(){T.phase="warm-up (unscored)";render();$("#go").disabled=true;await runTrial(false);
  T.phase="idle";$("#go").disabled=false;$("#go").textContent="▶ Start scored round";$("#go").onclick=startScored;
  $("#phasehint").textContent="These count. More stars appear when you're right (harder).";render();}
async function startScored(){T.phase="scored";render();$("#go").disabled=true;
  for(let i=0;i<12;i++)await runTrial(true);finish();}
function finish(){T.phase="done";render();$("#go").disabled=false;
  $("#go").textContent="▶ Another round";$("#go").onclick=startScored;
  $("#phasehint").textContent="Done. d′ / capacity K and the set-size ceiling are the tail signals — not speed.";}
$("#go").onclick=demo;
</script>
</body>
</html>
