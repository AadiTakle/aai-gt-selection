<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB-PATHFORGE-01 · Path Forge</title>
<style>
  :root{--bg1:#eafaf0;--bg2:#eef0ff;--ink:#26304a;--card:#fff;--accent:#12a15f;--good:#22b573;--bad:#ff6b6b;
    --tel-bg:#11162a;--tel-ink:#c8d6ff;--tel-key:#7fffcf;--tel-dim:#7183b8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;min-height:100%}
  #wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px;min-width:0}
  #badge{font-size:12px;letter-spacing:.08em;color:#8a93b5;text-transform:uppercase;font-weight:700}
  #phasecue{font-size:32px;height:38px}
  #stagecard{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 18px 50px -22px #4a4a7a;
    display:flex;flex-direction:column;align-items:center;gap:12px}
  #instr{font-size:14px;color:#666;min-height:20px;text-align:center;max-width:420px}
  #grid{display:grid;gap:4px;background:#d5ead9;padding:8px;border-radius:12px;position:relative}
  .cell{width:60px;height:60px;border-radius:9px;background:#eef7f0;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;
    display:flex;align-items:center;justify-content:center;font-size:22px}
  .road i{position:absolute;background:#c8a06a;border-radius:2px}
  .cell.on i{background:#b98a4e}
  #walker{position:absolute;font-size:26px;transition:left .3s,top .3s;pointer-events:none;z-index:5}
  #tray{display:flex;gap:12px}
  .tp{width:64px;height:56px;border-radius:12px;background:#eef7f0;border:3px solid #d3e6d8;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .tp.sel{border-color:var(--accent);background:#dcf0e2}
  #row{display:flex;gap:12px;align-items:center}
  button{font:inherit;border:0;cursor:pointer;border-radius:12px}
  #go{background:var(--accent);color:#fff;padding:10px 22px;font-weight:700;font-size:16px}
  #replay{width:42px;height:42px;background:#eef1ff;color:#5b6cff;font-size:19px;border-radius:50%}
  #ghost{position:fixed;left:0;top:0;font-size:32px;pointer-events:none;z-index:60;opacity:0;
    transition:transform .45s cubic-bezier(.4,.1,.2,1),opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #ghost.show{opacity:.92}
  #telemetry{width:320px;flex:0 0 320px;background:var(--tel-bg);color:var(--tel-ink);display:flex;flex-direction:column;
    font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
  #telemetry h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;color:#fff;background:#1b2340;text-transform:uppercase}
  #mlist{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:baseline}
  .mid{color:var(--tel-key);font-weight:700}.mval{color:#fff}
  .mname{grid-column:1/3;color:var(--tel-dim);font-size:11px;margin-top:-3px}
  #logwrap{border-top:1px solid #262f52;margin-top:auto}
  #logwrap b{display:block;padding:8px 12px 4px;color:#8ea0d6;font-size:11px;letter-spacing:.08em}
  #log{height:170px;overflow:auto;padding:0 12px 12px;white-space:pre-wrap}
  #log div{padding:2px 0;border-bottom:1px dotted #232c4d}.t{color:#5f6f9e}
  @media(max-width:880px){body{flex-direction:column}#telemetry{width:100%;flex:none;height:260px}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="badge">GB-PATHFORGE-01 · Path Forge</div>
    <div id="phasecue">👁️</div>
    <div id="stagecard">
      <div id="instr"></div>
      <div id="grid"><div id="walker">🚶</div></div>
      <div id="tray"></div>
      <div id="row"><button id="go">🚶 GO</button><button id="replay" title="replay demo">↻</button></div>
    </div>
  </div>
  <aside id="telemetry"><h3>Live telemetry · per-child</h3><div id="mlist"></div>
    <div id="logwrap"><b>EVENT LOG</b><div id="log"></div></div></aside>
  <div id="ghost">👆</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const OPP={L:'R',R:'L',U:'D',D:'U'},DELTA={L:[0,-1],R:[0,1],U:[-1,0],D:[1,0]};
const DEF={straight:[['L','R'],['U','D']],curve:[['U','R'],['R','D'],['D','L'],['L','U']]};
const SZ=64;
const LEVELS={
 warm:{rows:1,cols:3,start:[0,0],goal:[0,2],opt:1,pre:{'0,0':{type:'straight',rot:0,fixed:1},'0,2':{type:'straight',rot:0,fixed:1}}},
 s1:{rows:3,cols:3,start:[0,0],goal:[2,2],opt:3,pre:{'0,0':{type:'curve',rot:1,fixed:1},'2,2':{type:'curve',rot:3,fixed:1}}}
};
const T={itemStart:0,placements:0,firstLat:null,firstActed:false,opt:0,runs:0,used:0,cells:null,scored:0,correct:0,reach:0};
const METERS=[
 {id:'M-ACC',name:'Path built (scored)',get:()=>T.scored?`${T.correct}/${T.scored}`:'—'},
 {id:'M-EFF',name:'Tiles vs optimal',get:()=>T.opt&&T.used?`${T.opt}/${T.used}`:'—'},
 {id:'M-PATH',name:'Placements + rotations',get:()=>T.placements+''},
 {id:'M-RTFIRST',name:'First-tile latency (plan)',get:()=>T.firstLat==null?'—':T.firstLat+' ms'},
 {id:'M-REV',name:'Rotations of placed tiles',get:()=>T.rot||0},
 {id:'M-EXPLORE',name:'Distinct cells used',get:()=>T.cells?T.cells.size:0},
 {id:'M-PROG',name:'Route connected (GO)',get:()=>T.runs?(T.reach?'100%':'partial'):'—'},
 {id:'M-PERSIST',name:'Time-on-task (ms)',get:()=>T.itemStart?(Date.now()-T.itemStart):'—'},
];
function buildMeters(){$('#mlist').innerHTML=METERS.map(m=>`<div class="mrow"><span class="mid">${m.id}</span><span class="mval" id="v_${m.id}"></span><span class="mname">${m.name}</span></div>`).join('')}
function renderMeters(){METERS.forEach(m=>{const e=$('#v_'+m.id);if(e)e.textContent=m.get()})}
function log(msg){const t=T.itemStart?Date.now()-T.itemStart:0;const d=document.createElement('div');d.innerHTML=`<span class="t">+${t}ms</span> ${msg}`;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight}
const ghost=$('#ghost');const gShow=v=>ghost.classList.toggle('show',v);
function centerOf(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function gTo(el){if(!el)return;const c=centerOf(el);ghost.style.transform=`translate(${c.x-6}px,${c.y-4}px)`;await sleep(430)}

let phase='demo',L=null,placed={},selType='straight',locked=false;
const setCue=i=>$('#phasecue').textContent=i;
function key(r,c){return r+','+c}
function bars(op){const seg={L:'left:0;top:25px;width:32px;height:10px',R:'right:0;top:25px;width:32px;height:10px',U:'left:25px;top:0;width:10px;height:32px',D:'left:25px;bottom:0;width:10px;height:32px'};
  const hub='left:23px;top:23px;width:14px;height:14px;border-radius:50%';
  return `<i style="${hub}"></i>`+op.map(o=>`<i style="${seg[o]}"></i>`).join('')}
function render(){const g=$('#grid');g.style.gridTemplateColumns=`repeat(${L.cols},60px)`;[...g.querySelectorAll('.cell')].forEach(x=>x.remove());
  for(let r=0;r<L.rows;r++)for(let c=0;c<L.cols;c++){const d=document.createElement('div');d.className='cell';d.dataset.r=r;d.dataset.c=c;
    const p=placed[key(r,c)];
    if(p){d.classList.add('road','on');d.innerHTML=`<div style="position:absolute;inset:0">${bars(DEF[p.type][p.rot])}</div>`}
    if(L.start[0]===r&&L.start[1]===c)d.insertAdjacentHTML('beforeend','<span style="position:absolute;top:-4px;left:-2px;font-size:16px">🏠</span>');
    if(L.goal[0]===r&&L.goal[1]===c)d.insertAdjacentHTML('beforeend','<span style="position:absolute;bottom:-4px;right:-2px;font-size:16px">🚩</span>');
    g.appendChild(d)}
  placeWalker(false)}
function placeWalker(anim){const w=$('#walker');w.style.transition=anim?'left .3s,top .3s':'none';w.style.left=(8+L.start[1]*SZ+18)+'px';w.style.top=(8+L.start[0]*SZ+16)+'px';if(!anim)requestAnimationFrame(()=>w.style.transition='left .3s,top .3s')}
function moveWalker(r,c){const w=$('#walker');w.style.left=(8+c*SZ+18)+'px';w.style.top=(8+r*SZ+16)+'px'}
function newLevel(spec){L=spec;placed={};for(const k in spec.pre)placed[k]={...spec.pre[k]};
  T.itemStart=Date.now();T.placements=0;T.firstActed=false;T.firstLat=null;T.opt=spec.opt;T.runs=0;T.rot=0;T.reach=0;
  T.used=Object.keys(placed).filter(k=>!placed[k].fixed).length;T.cells=new Set(Object.keys(placed).filter(k=>!placed[k].fixed));locked=false;render();renderMeters()}
function onCell(r,c){if(locked)return;const k=key(r,c);const p=placed[k];
  if(p&&p.fixed)return;
  if(!T.firstActed){T.firstActed=true;T.firstLat=Date.now()-T.itemStart;log('first tile placed (after planning)')}
  T.placements++;
  if(p){p.rot=(p.rot+1)%DEF[p.type].length;T.rot++;log(`rotate ${p.type} at ${k}`)}
  else{placed[k]={type:selType,rot:0};T.cells.add(k);log(`place ${selType} at ${k}`)}
  T.used=Object.keys(placed).filter(x=>!placed[x].fixed).length;render();renderMeters()}
function op(k){const p=placed[k];return p?DEF[p.type][p.rot]:null}
function bfsPath(){const s=key(...L.start),gk=key(...L.goal);const prev={};prev[s]=null;const q=[L.start];const seen=new Set([s]);
  while(q.length){const[r,c]=q.shift();for(const o of (op(r+','+c)||[])){const[dr,dc]=DELTA[o];const nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=L.rows||nc>=L.cols)continue;const nk=key(nr,nc);if(seen.has(nk))continue;const nop=op(nk);if(nop&&nop.includes(OPP[o])){seen.add(nk);prev[nk]=[r,c];q.push([nr,nc])}}}
  if(!seen.has(gk))return null;const path=[];let cur=L.goal;while(cur){path.unshift(cur);cur=prev[key(...cur)]}return path}
async function go(){if(locked)return;T.runs++;const path=bfsPath();
  if(path){T.reach=1;log('GO: road connected ('+path.length+' cells) — courier walking');for(const[r,c]of path){moveWalker(r,c);await sleep(320)}
    locked=true;$('#walker').textContent='🎉';setCue(phase==='scored'?'🏆':'⭐');$('#instr').textContent='The courier reached the flag! 🎉';
    if(phase==='scored'){T.scored++;T.correct++;log(`SOLVED · tiles ${T.used} (optimal ${T.opt}) · runs ${T.runs}`);renderMeters();setTimeout(()=>{$('#walker').textContent='🚶';finish()},1300)}
    else{log('warm-up solved (unscored)');setTimeout(()=>{$('#walker').textContent='🚶';startScored()},1200)}}
  else{T.reach=0;log('GO: road not connected yet — rotate/place tiles');renderMeters()}}
function finish(){phase='done';locked=true;setCue('🏆');$('#instr').textContent='Done! Tidy route.'}
function renderTray(){const t=$('#tray');t.innerHTML='';[['straight','↔'],['curve','⌐']].forEach(([ty])=>{const d=document.createElement('div');d.className='tp'+(selType===ty?' sel':'');d.dataset.ty=ty;
  const op0=DEF[ty][ty==='curve'?1:0];d.innerHTML=`<div style="position:absolute;inset:6px" class="road on">${bars(op0)}</div>`;t.appendChild(d)})}
function startWarmup(){phase='warmup';setCue('⭐');$('#instr').textContent='Warm-up: place one road tile in the gap, then GO. (unscored)';newLevel(LEVELS.warm);renderTray();log('— warm-up (unscored) —')}
function startScored(){phase='scored';setCue('🎯');$('#instr').textContent='SCORED: connect 🏠 to 🚩. Tap tray, tap a cell to place; tap a tile to rotate. Then GO.';newLevel(LEVELS.s1);renderTray();log('— SCORED: forge the road with curves —')}
async function runDemo(){phase='demo';setCue('👁️');$('#instr').textContent='';newLevel(LEVELS.warm);renderTray();log('ghost-hand demo (wordless, <10s)');gShow(true);await sleep(300);
  const mid=$('.cell[data-r="0"][data-c="1"]');await gTo(mid);placed['0,1']={type:'straight',rot:0};T.cells.add('0,1');render();await sleep(300);
  await gTo($('#go'));gShow(false);const path=bfsPath();for(const[r,c]of (path||[])){moveWalker(r,c);await sleep(300)}$('#walker').textContent='🎉';await sleep(800);$('#walker').textContent='🚶';$('#instr').textContent='';startWarmup()}
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.cell');if(c)onCell(+c.dataset.r,+c.dataset.c)});
$('#tray').addEventListener('click',e=>{const t=e.target.closest('.tp');if(t){selType=t.dataset.ty;renderTray()}});
$('#go').addEventListener('click',go);
$('#replay').addEventListener('click',()=>{if(phase==='done')runDemo()});
buildMeters();renderMeters();runDemo();
</script>
</body>
</html>
