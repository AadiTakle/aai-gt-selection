<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GT Question-Type Review</title>
<style>
  :root{
    --navy:#0f2742; --navy-2:#1b3a5b; --gold:#f2b705; --paper:#faf7f0;
    --ink:#12202e; --muted:#5a6b7b; --line:#dfe3e8; --ok:#1f8a4c; --card:#ffffff;
    --s1:#2563eb; --dual:#7c3aed; --s2:#c2410c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--paper)}
  header.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:3px solid var(--gold)}
  .topbar h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  .topbar .prog{font-size:13px;color:#cfe0f2}
  .topbar .spacer{flex:1}
  .topbar button{background:var(--gold);color:#231a02;border:none;border-radius:7px;padding:7px 12px;font-weight:650;cursor:pointer;font-size:13px}
  .topbar button.ghost{background:transparent;color:#dfe9f5;border:1px solid #37567a}
  .topbar button:hover{filter:brightness(1.05)}
  .layout{display:flex;height:calc(100vh - 53px)}
  aside{width:340px;min-width:300px;border-right:1px solid var(--line);overflow-y:auto;background:#fff}
  .filters{padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
  .filters input[type=search],.filters select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;margin-bottom:6px}
  .filters .row{display:flex;gap:6px}
  .filters .row select{margin-bottom:0}
  .filters label.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px}
  ul.types{list-style:none;margin:0;padding:0}
  li.type{padding:9px 12px;border-bottom:1px solid #eef1f4;cursor:pointer;display:flex;align-items:center;gap:8px}
  li.type:hover{background:#f4f7fb}
  li.type.active{background:#eaf1fb;box-shadow:inset 3px 0 0 var(--navy)}
  li.type .nm{flex:1;min-width:0}
  li.type .nm b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  li.type .nm span{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;color:#fff;white-space:nowrap}
  .b-S1{background:var(--s1)} .b-DUAL{background:var(--dual)} .b-S2{background:var(--s2)}
  .dot{width:9px;height:9px;border-radius:50%;background:#d5dbe1;flex:none}
  .dot.done{background:var(--ok)}
  main{flex:1;overflow-y:auto;padding:18px 22px}
  .empty{color:var(--muted);margin-top:40px;text-align:center}
  .head h2{margin:0 0 2px;font-size:22px}
  .head .meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .head .meta code{font-family:ui-monospace,Menlo,monospace;background:#eef1f4;padding:1px 6px;border-radius:5px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
  @media(max-width:1100px){.grid{grid-template-columns:1fr}}
  .demoWrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .demoWrap .bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f4f7fb;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
  .demoWrap .bar .spacer{flex:1}
  .demoWrap .bar a,.demoWrap .bar button{font-size:12px;color:var(--navy);background:none;border:1px solid var(--line);border-radius:5px;padding:3px 8px;cursor:pointer;text-decoration:none}
  .demoWrap iframe{width:100%;height:540px;border:0;display:block;background:#fff}
  .demoWrap .nodemo{padding:24px;color:var(--muted);text-align:center;font-size:13px}
  section.card{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:14px}
  section.card>h3{margin:0;font-size:13px;padding:9px 12px;border-bottom:1px solid var(--line);background:#fbfcfd;cursor:pointer;display:flex;align-items:center;gap:6px}
  section.card>h3 .tw{color:var(--muted);font-weight:400;font-size:11px;margin-left:auto}
  section.card .body{padding:11px 13px;font-size:13px;line-height:1.5}
  section.card.collapsed .body{display:none}
  .kv{margin:0 0 8px}
  .kv b{color:var(--navy-2)}
  table.metrics{width:100%;border-collapse:collapse;font-size:12px}
  table.metrics th,table.metrics td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
  table.metrics th{background:#f4f7fb;font-weight:600}
  table.metrics td code{font-family:ui-monospace,Menlo,monospace;font-size:11px}
  .comments h3{font-size:14px;margin:2px 0 10px;color:var(--navy)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:650;color:var(--navy-2);margin-bottom:4px}
  .field label .hint{font-weight:400;color:var(--muted)}
  .field textarea{width:100%;min-height:64px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:13px;resize:vertical;line-height:1.45}
  .field textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px #cfe0f2}
  .savenote{font-size:11px;color:var(--ok);height:14px}
  .disc{font-size:11px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:8px}
</style>
</head>
<body>
<header class="topbar">
  <h1>GT Question-Type Review</h1>
  <span class="prog" id="prog">0 / 0 reviewed</span>
  <span class="spacer"></span>
  <button class="ghost" id="importBtn" title="Load a previously exported review JSON">Import</button>
  <input type="file" id="importFile" accept="application/json" style="display:none" />
  <button id="exportBtn" title="Download your comments as Markdown + JSON">Export</button>
</header>

<div class="layout">
  <aside>
    <div class="filters">
      <input type="search" id="search" placeholder="Search name or code..." />
      <div class="row">
        <select id="fDomain"><option value="">All domains</option></select>
        <select id="fStage">
          <option value="">All stages</option>
          <option value="S1">Stage 1 (standing)</option>
          <option value="DUAL">Dual</option>
          <option value="S2">Stage 2 (learning-rate)</option>
        </select>
      </div>
      <label class="chk"><input type="checkbox" id="fUnrev" /> only unreviewed</label>
    </div>
    <ul class="types" id="typeList"></ul>
  </aside>
  <main id="main"><div class="empty">Loading types…</div></main>
</div>

<script>
const CATS = [
  {key:'ui',        label:'1 · UI / interaction',                 hint:'layout, controls, clarity, engagement, self-teach'},
  {key:'difficulty',label:'2 · Difficulty score & intended grade', hint:'is the rung/age-band right? escalation? ceiling?'},
  {key:'framing',   label:'3 · Question framing & answer',         hint:'prompt wording, stimulus, correctness/answer key'},
  {key:'general',   label:'4 · General improvement',               hint:'anything else to perfect this type'},
  {key:'metrics',   label:'5 · Metrics & how they are calculated', hint:'which signals, how collected, how they feed the score'},
];
const LS_KEY = 'gt-type-review-v1';
let DATA = [];
let store = loadStore();
let activeId = null;

function loadStore(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
function saveStore(){ localStorage.setItem(LS_KEY, JSON.stringify(store)); }
function hasComments(id){ const c = store[id]; return !!c && CATS.some(k => (c[k.key]||'').trim()); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderProg(){
  const done = DATA.filter(d=>hasComments(d.type_id)).length;
  document.getElementById('prog').textContent = `${done} / ${DATA.length} reviewed`;
}

function filtered(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const dom = document.getElementById('fDomain').value;
  const st = document.getElementById('fStage').value;
  const unrev = document.getElementById('fUnrev').checked;
  return DATA.filter(d=>{
    if(dom && d.domain!==dom) return false;
    if(st && d.stage!==st) return false;
    if(unrev && hasComments(d.type_id)) return false;
    if(q && !(d.type_id.toLowerCase().includes(q) || (d.name||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderList(){
  const ul = document.getElementById('typeList');
  const rows = filtered();
  ul.innerHTML = rows.map(d=>`
    <li class="type ${d.type_id===activeId?'active':''}" data-id="${d.type_id}">
      <span class="dot ${hasComments(d.type_id)?'done':''}"></span>
      <span class="nm"><b>${esc(d.name)}</b><span>${esc(d.type_id)} · ${esc(d.domain)}</span></span>
      <span class="badge b-${d.stage}">${d.stage}</span>
    </li>`).join('') || '<li class="type"><span class="nm"><b>No types match</b></span></li>';
  [...ul.querySelectorAll('li.type[data-id]')].forEach(li=>li.onclick=()=>select(li.dataset.id));
}

function card(title, bodyHtml, collapsed){
  return `<section class="card ${collapsed?'collapsed':''}"><h3>${title}<span class="tw">${collapsed?'show':'hide'}</span></h3><div class="body">${bodyHtml}</div></section>`;
}

function metricsTable(ms){
  if(!ms || !ms.length) return '<div class="kv">No metrics declared.</div>';
  return `<table class="metrics"><thead><tr><th>Metric</th><th>What</th><th>How it is collected</th></tr></thead><tbody>`+
    ms.map(m=>`<tr><td><code>${esc(m.id)}</code><br>${esc(m.name)}</td><td>${esc(m.what)}</td><td>${esc(m.how_to_collect)}</td></tr>`).join('')+
    `</tbody></table>`;
}

function select(id){
  activeId = id;
  const d = DATA.find(x=>x.type_id===id);
  renderList();
  const c = store[id] || (store[id]={});
  const demoHtml = d.demo
    ? `<div class="demoWrap"><div class="bar"><span>Live demo</span><span class="spacer"></span>
        <button data-reload>reload</button><a href="${esc(d.demo)}" target="_blank" rel="noreferrer">open in new tab ↗</a></div>
        <iframe src="${esc(d.demo)}" title="${esc(d.name)} demo" loading="lazy"></iframe></div>`
    : `<div class="demoWrap"><div class="nodemo">No demo file found for <code>${esc(d.type_id)}</code>.</div></div>`;

  const meta = `
    ${d.one_liner?`<p class="kv"><b>In one line:</b> ${esc(d.one_liner)}</p>`:''}
    ${d.interaction?`<p class="kv"><b>Interaction:</b> ${esc(d.interaction)}</p>`:''}
    ${d.self_teach?`<p class="kv"><b>Self-teach:</b> ${esc(d.self_teach)}</p>`:''}
    ${d.engagement_hook?`<p class="kv"><b>Engagement hook:</b> ${esc(d.engagement_hook)}</p>`:''}`;
  const diff = `
    <p class="kv"><b>Stage:</b> ${esc(d.stage_label)}</p>
    <p class="kv"><b>Age bands:</b> ${esc((d.age_bands||[]).join(', ')||'—')}</p>
    <p class="kv"><b>Adaptivity (works_well):</b> ${esc(d.works_well)}</p>
    ${d.content_range?`<p class="kv"><b>Content range:</b> ${esc(d.content_range)}</p>`:''}
    ${d.difficulty_levers?`<p class="kv"><b>Difficulty levers:</b> ${esc(Array.isArray(d.difficulty_levers)?d.difficulty_levers.join('; '):d.difficulty_levers)}</p>`:''}`;
  const metricsBody = metricsTable(d.metrics) + (d.tail_precision_rationale?`<p class="kv" style="margin-top:8px"><b>Why these separate the tail:</b> ${esc(d.tail_precision_rationale)}</p>`:'');

  const comments = `<div class="comments"><h3>Your review comments</h3>`+
    CATS.map(cat=>`
      <div class="field">
        <label>${cat.label} <span class="hint">— ${esc(cat.hint)}</span></label>
        <textarea data-cat="${cat.key}" placeholder="Comments…">${esc(c[cat.key]||'')}</textarea>
        <div class="savenote" data-note="${cat.key}"></div>
      </div>`).join('')+
    `<div class="disc">Comments auto-save to this browser. Use <b>Export</b> to hand them back. Born-synthetic review of an unapproved, pluggable design.</div></div>`;

  document.getElementById('main').innerHTML = `
    <div class="head">
      <h2>${esc(d.name)} <span class="badge b-${d.stage}">${d.stage}</span></h2>
      <div class="meta"><code>${esc(d.type_id)}</code> · domain: <b>${esc(d.domain)}</b> · adaptivity: ${esc(d.works_well)} · grades: ${esc((d.age_bands||[]).join(', ')||'—')}</div>
    </div>
    <div class="grid">
      <div>${demoHtml}
        ${card('Metrics tracked &amp; how they are calculated', metricsBody, false)}
      </div>
      <div>
        ${comments}
        ${card('Framing, interaction &amp; self-teach', meta, true)}
        ${card('Difficulty, grade level &amp; adaptivity', diff, true)}
        ${d.construct_irrelevant_risks?card('Construct-irrelevant risks (from spec)', `<div class="kv">${esc(d.construct_irrelevant_risks)}</div>`, true):''}
      </div>
    </div>`;

  const main = document.getElementById('main');
  main.querySelectorAll('section.card>h3').forEach(h=>h.onclick=()=>{
    const s=h.parentElement; s.classList.toggle('collapsed');
    h.querySelector('.tw').textContent = s.classList.contains('collapsed')?'show':'hide';
  });
  const rl = main.querySelector('[data-reload]');
  if(rl) rl.onclick=()=>{ const f=main.querySelector('iframe'); if(f) f.src=f.src; };
  main.querySelectorAll('textarea[data-cat]').forEach(ta=>{
    ta.addEventListener('input',()=>{
      c[ta.dataset.cat]=ta.value; saveStore();
      const note=main.querySelector(`[data-note="${ta.dataset.cat}"]`);
      if(note){ note.textContent='saved'; clearTimeout(note._t); note._t=setTimeout(()=>note.textContent='',900); }
      renderProg();
      const li=document.querySelector(`li.type[data-id="${CSS.escape(activeId)}"] .dot`);
      if(li) li.classList.toggle('done', hasComments(activeId));
    });
  });
}

function exportReview(){
  const stamp=new Date().toISOString().slice(0,16).replace('T',' ');
  const withC=DATA.filter(d=>hasComments(d.type_id));
  let md=`# GT Question-Type Review — comments\n\n_${withC.length} of ${DATA.length} types commented · exported ${stamp}_\n\n`;
  let curDom=null;
  withC.forEach(d=>{
    if(d.domain!==curDom){ md+=`\n## Domain: ${d.domain}\n`; curDom=d.domain; }
    const c=store[d.type_id]||{};
    md+=`\n### ${d.type_id} — ${d.name}  (${d.stage})\n`;
    CATS.forEach(cat=>{ const v=(c[cat.key]||'').trim(); if(v) md+=`- **${cat.label.replace(/^\d+ · /,'')}:** ${v}\n`; });
  });
  download('gt-type-review.md', md, 'text/markdown');
  download('gt-type-review.json', JSON.stringify(store,null,2), 'application/json');
}
function download(name, text, type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
}
function importReview(file){
  const r=new FileReader();
  r.onload=()=>{ try{
    const obj=JSON.parse(r.result);
    Object.keys(obj).forEach(id=>{ store[id]=Object.assign(store[id]||{}, obj[id]); });
    saveStore(); renderProg(); renderList(); if(activeId) select(activeId);
    alert('Imported review comments.');
  }catch(e){ alert('Could not parse that JSON.'); } };
  r.readAsText(file);
}

fetch('review-data.json').then(r=>r.json()).then(data=>{
  DATA=data;
  const domSel=document.getElementById('fDomain');
  [...new Set(DATA.map(d=>d.domain))].sort().forEach(dm=>{
    const o=document.createElement('option'); o.value=dm; o.textContent=dm; domSel.appendChild(o);
  });
  ['search','fDomain','fStage','fUnrev'].forEach(id=>{
    document.getElementById(id).addEventListener('input',renderList);
    document.getElementById(id).addEventListener('change',renderList);
  });
  document.getElementById('exportBtn').onclick=exportReview;
  document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
  document.getElementById('importFile').onchange=e=>{ if(e.target.files[0]) importReview(e.target.files[0]); };
  renderProg(); renderList();
  if(DATA.length) select(DATA[0].type_id);
  else document.getElementById('main').innerHTML='<div class="empty">No types in review-data.json</div>';
}).catch(err=>{
  document.getElementById('main').innerHTML=`<div class="empty">Could not load <code>review-data.json</code>.<br>Serve this folder over HTTP (see below), don't open with file://.<br><br><small>${esc(err.message)}</small></div>`;
});
</script>
</body>
</html>
